<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recovery check-in · StewardMD</title>
<meta name="description" content="Your hospital recovery check-in.">
<meta name="theme-color" content="#0e6e63">
<meta name="robots" content="noindex, nofollow">
<!-- The check-in link carries an opaque access token in ?t= — never leak it via the Referer header to any origin. -->
<meta name="referrer" content="no-referrer">
<!--
  FollowCare AI — patient recovery portal (Phase 1).
  A self-contained, login-free, install-free page a discharged patient opens from an SMS/email link
  (…/followcare?t=<opaque token>). It renders the day's check-in from /api/followcare/portal, submits to
  /api/followcare/submit, and shows a SAFE, engine-decided message. It NEVER diagnoses, NEVER changes any
  medicine, and on a red flag always tells the patient to seek urgent in-person care. No PHI is in the URL
  (only the opaque token); no analytics; no third-party requests. Accessible: labels, roles, large targets,
  reduced-motion aware, high-contrast, works dark + light.
-->
<style>
  :root{
    --teal:#0e6e63; --teal-2:#0b574e; --teal-ink:#08463e;
    --ink:#14202b; --slate:#5a7184; --paper:#f4f7f6; --panel:#ffffff; --line:#dbe4e2;
    --green:#127a52; --green-bg:#e7f6ee; --amber:#8a5a00; --amber-bg:#fdf1dc;
    --red:#b3261e; --red-bg:#fdeceb; --focus:#0a7f72;
    --shadow:0 20px 50px -30px rgba(0,0,0,.4);
  }
  /* Dark tokens apply when the device prefers dark (unless the patient forced light), OR when the patient
     forces dark via the theme toggle. Light is the :root default (and re-applied by .fc-light). */
  @media (prefers-color-scheme: dark){
    html:not(.fc-light){
      --teal:#3fc7b3; --teal-2:#2fae9b; --teal-ink:#bff1e8;
      --ink:#e8edf2; --slate:#9bb0c2; --paper:#0c1922; --panel:#132030; --line:#294050;
      --green:#5fd39b; --green-bg:#0f2b22; --amber:#f0c274; --amber-bg:#2e2410;
      --red:#ff8a80; --red-bg:#3a1614; --focus:#7fe0d2;
      --shadow:0 20px 50px -30px rgba(0,0,0,.7);
    }
  }
  html.fc-dark{
    --teal:#3fc7b3; --teal-2:#2fae9b; --teal-ink:#bff1e8;
    --ink:#e8edf2; --slate:#9bb0c2; --paper:#0c1922; --panel:#132030; --line:#294050;
    --green:#5fd39b; --green-bg:#0f2b22; --amber:#f0c274; --amber-bg:#2e2410;
    --red:#ff8a80; --red-bg:#3a1614; --focus:#7fe0d2;
    --shadow:0 20px 50px -30px rgba(0,0,0,.7);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:radial-gradient(1000px 500px at 50% -10%, color-mix(in srgb, var(--teal) 12%, transparent), transparent 60%), var(--paper);
    color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
  header.top{ display:flex; align-items:center; gap:10px; padding:8px 2px 18px; }
  .logo{ width:38px; height:38px; border-radius:10px; background:var(--teal); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; letter-spacing:-.02em; flex:0 0 auto; overflow:hidden; }
  .logo img{ width:100%; height:100%; object-fit:contain; padding:6px; }
  html.fcui2 .logo img{ padding:7px; }
  .brand{ font-weight:800; font-size:16px; letter-spacing:-.01em; }
  .brand span{ color:var(--teal); }
  .sub{ margin-left:auto; font-size:12px; color:var(--slate); }
  .theme-btn{ margin-left:10px; width:38px; height:38px; border-radius:11px; border:1.5px solid var(--line); background:var(--panel); color:var(--slate); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; transition:border-color .15s, color .15s, transform .12s; }
  .theme-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .theme-btn:active{ transform:scale(.94); }
  .theme-btn svg{ width:20px; height:20px; }
  html.fcui2 .theme-btn{ border-radius:13px; }
  .sub:empty + .theme-btn{ margin-left:auto; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:22px 20px; margin-bottom:16px; }
  h1{ font-size:1.35rem; margin:0 0 4px; letter-spacing:-.01em; }
  .lead{ color:var(--slate); font-size:.98rem; margin:0 0 4px; }
  .q{ padding:16px 0; border-top:1px solid var(--line); }
  .q:first-of-type{ border-top:none; }
  .q-label{ font-weight:650; font-size:1.02rem; margin:0 0 12px; display:block; }
  .q-unit{ color:var(--slate); font-weight:500; font-size:.85rem; }
  .opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt{ appearance:none; border:1.5px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:11px 15px; font-size:.98rem; cursor:pointer; min-height:46px; flex:1 1 auto; text-align:center; transition:border-color .12s, background .12s; }
  .opt:hover{ border-color:var(--teal); }
  .opt[aria-pressed="true"]{ border-color:var(--teal); background:color-mix(in srgb, var(--teal) 14%, var(--panel)); color:var(--teal-ink); font-weight:650; }
  .scale{ display:grid; grid-template-columns:repeat(auto-fit, minmax(40px,1fr)); gap:6px; }
  .scale .opt{ padding:11px 0; min-width:0; }
  .scale-ends{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--slate); margin-top:6px; }
  input[type="number"]{ width:100%; font-size:1.05rem; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); min-height:48px; }
  input[type="number"]:focus, .opt:focus-visible, button:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .cta{ width:100%; border:none; border-radius:14px; background:var(--teal); color:#fff; font-weight:750; font-size:1.05rem; padding:15px; min-height:52px; cursor:pointer; }
  .cta:hover{ background:var(--teal-2); }
  .cta:disabled{ opacity:.55; cursor:progress; }
  .foot{ text-align:center; color:var(--slate); font-size:.76rem; line-height:1.6; margin-top:6px; }
  .note{ background:var(--amber-bg); color:var(--amber); border-radius:12px; padding:12px 14px; font-size:.9rem; margin-top:14px; }
  /* result states */
  .result{ text-align:center; padding:8px 4px 4px; }
  .result .ic{ width:64px; height:64px; border-radius:50%; margin:6px auto 14px; display:flex; align-items:center; justify-content:center; font-size:30px; }
  .r-green .ic{ background:var(--green-bg); color:var(--green); }
  .r-amber .ic{ background:var(--amber-bg); color:var(--amber); }
  .r-red .ic{ background:var(--red-bg); color:var(--red); }
  .result h1{ margin-bottom:8px; }
  .result p{ color:var(--ink); font-size:1.02rem; }
  .emergency{ background:var(--red-bg); color:var(--red); border:1.5px solid color-mix(in srgb, var(--red) 40%, transparent); border-radius:14px; padding:16px; margin-top:16px; font-weight:600; }
  .call{ display:inline-flex; align-items:center; gap:8px; margin-top:12px; background:var(--red); color:#fff; text-decoration:none; font-weight:750; padding:13px 20px; border-radius:12px; min-height:48px; }
  .spinner{ width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } *{ transition:none !important; } }
  .hidden{ display:none !important; }
  .err-icon{ font-size:34px; }
  .disclaimer{ font-size:.72rem; color:var(--slate); margin-top:18px; text-align:center; line-height:1.6; }
  /* Doctor Action Center — patient inbox */
  .fc-msg{ border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; background:var(--panel); }
  .fc-msg-em{ border-color:#d9534f; background:color-mix(in srgb, #d9534f 8%, var(--panel)); }
  .fc-msg-h{ font-weight:750; font-size:.85rem; color:var(--slate); margin-bottom:6px; }
  .fc-msg-em .fc-msg-h{ color:#c9302c; }
  .fc-msg-b{ font-size:1rem; line-height:1.5; white-space:pre-wrap; margin-bottom:10px; }
  .fc-msg-act{ display:flex; flex-direction:column; gap:8px; }
  .fc-reply{ width:100%; min-height:80px; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; font:inherit; font-size:1rem; background:var(--panel); color:var(--ink); resize:vertical; }
  .fc-mini{ min-height:46px; padding:12px; font-size:.98rem; }
  .cta.sec, .fc-mini.sec{ background:transparent; color:var(--teal); border:1.5px solid var(--teal); }
  .fc-vrow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .fc-vrow label{ flex:1 1 140px; font-size:.9rem; }
  .fc-vrow input{ flex:1 1 90px; min-width:80px; padding:10px 11px; border:1.5px solid var(--line); border-radius:11px; font-size:1rem; background:var(--panel); color:var(--ink); }
  .fc-done{ font-weight:700; color:var(--teal); font-size:.95rem; padding:6px 0; }

  /* ═══════════ FollowCare premium UI v2 (flag smd_followcare_ui2 → html.fcui2) ═══════════
     Additive: only applies when the flag is on, so the classic portal is byte-for-byte unchanged when off. */
  html.fcui2 body{
    background:
      radial-gradient(1150px 640px at 6% -14%, color-mix(in srgb, var(--teal) 17%, transparent), transparent 56%),
      radial-gradient(920px 520px at 104% -4%, color-mix(in srgb, #2f9fd9 12%, transparent), transparent 55%),
      var(--paper);
  }
  html.fcui2 .wrap{ max-width:600px; padding:calc(14px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom)); }
  html.fcui2 header.top{ padding:14px 4px 22px; }
  html.fcui2 .logo{ width:42px; height:42px; border-radius:14px;
    background:linear-gradient(145deg, var(--teal), color-mix(in srgb, var(--teal) 60%, #21bda6));
    box-shadow:0 12px 24px -12px color-mix(in srgb, var(--teal) 85%, transparent); font-size:16px; }
  html.fcui2 .brand{ font-size:16.5px; letter-spacing:-.02em; }
  html.fcui2 .sub{ font-weight:600; }
  html.fcui2 .card{ border-radius:24px; padding:26px 22px; margin-bottom:14px;
    background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 95%, var(--teal) 5%), var(--panel));
    border:1px solid color-mix(in srgb, var(--line) 65%, transparent);
    box-shadow:0 1px 0 color-mix(in srgb,#fff 55%,transparent) inset, 0 26px 64px -36px rgba(8,42,38,.6), 0 6px 18px -12px rgba(8,42,38,.22); }
  html.fcui2 h1{ font-size:1.55rem; letter-spacing:-.025em; font-weight:800; }
  html.fcui2 .lead{ font-size:1.02rem; line-height:1.55; }
  html.fcui2 .q{ padding:18px 0; }
  html.fcui2 .q-label{ font-size:1.08rem; font-weight:700; margin-bottom:14px; }
  html.fcui2 .opts{ gap:10px; }
  html.fcui2 .opt{ border-radius:16px; padding:15px 16px; font-size:1.02rem; font-weight:600; min-height:54px;
    border:1.6px solid color-mix(in srgb, var(--line) 82%, transparent);
    background:color-mix(in srgb, var(--panel) 90%, var(--teal) 3%);
    transition:transform .13s cubic-bezier(.22,1,.36,1), border-color .15s, background .18s, box-shadow .2s; }
  html.fcui2 .opt:active{ transform:scale(.96); }
  html.fcui2 .opt[aria-pressed="true"]{ border-color:transparent; color:#fff;
    background:linear-gradient(145deg, var(--teal), color-mix(in srgb, var(--teal) 66%, #18b7a1));
    box-shadow:0 12px 24px -13px color-mix(in srgb, var(--teal) 90%, transparent); }
  html.fcui2 .scale{ gap:8px; }
  html.fcui2 .scale .opt{ padding:15px 0; font-weight:700; }
  html.fcui2 input[type="number"]{ border-radius:14px; min-height:52px; font-size:1.08rem;
    background:color-mix(in srgb, var(--panel) 92%, var(--teal) 2%); }
  html.fcui2 .cta{ border-radius:17px; padding:17px; font-size:1.1rem; min-height:58px; letter-spacing:.01em;
    background:linear-gradient(145deg, var(--teal), color-mix(in srgb, var(--teal) 64%, #14b39c));
    box-shadow:0 16px 32px -15px color-mix(in srgb, var(--teal) 85%, transparent);
    transition:transform .12s, box-shadow .2s, filter .2s; }
  html.fcui2 .cta:active{ transform:translateY(1px) scale(.99); }
  html.fcui2 .cta:hover{ filter:brightness(1.05); }
  html.fcui2 .cta.sec{ background:transparent; box-shadow:none; }
  html.fcui2 .result .ic{ width:92px; height:92px; font-size:42px; position:relative; }
  html.fcui2 .result .ic::after{ content:""; position:absolute; inset:-12px; border-radius:50%; border:2px solid currentColor; opacity:.16; }
  html.fcui2 .r-green .ic{ background:radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--green) 24%, var(--panel)), var(--green-bg)); }
  html.fcui2 .r-red .ic{ background:radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--red) 26%, var(--panel)), var(--red-bg)); }
  html.fcui2 .r-amber .ic{ background:radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--amber) 26%, var(--panel)), var(--amber-bg)); }
  html.fcui2 .result h1{ font-size:1.6rem; }
  html.fcui2 .result p{ font-size:1.06rem; color:var(--slate); }
  html.fcui2 .emergency{ border-radius:18px; padding:18px; box-shadow:0 14px 34px -18px color-mix(in srgb,var(--red) 55%,transparent); }
  html.fcui2 .call{ border-radius:15px; box-shadow:0 14px 28px -13px color-mix(in srgb, var(--red) 75%, transparent); }
  html.fcui2 .fc-msg{ border-radius:18px; padding:16px; box-shadow:0 12px 32px -22px rgba(8,42,38,.45);
    background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 96%, var(--teal) 4%), var(--panel)); }
  html.fcui2 .fc-msg-em{ box-shadow:0 14px 32px -16px color-mix(in srgb,#d9534f 55%,transparent); }
  html.fcui2 .fc-mini{ border-radius:14px; }
  html.fcui2 .fc-reply, html.fcui2 .fc-vrow input{ border-radius:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true"><img src="/mark-white.png" alt="" onerror="this.parentNode.textContent='SM'"></div>
    <div class="brand">Steward<span>MD</span></div>
    <div class="sub" id="sub"></div>
    <button class="theme-btn" id="fcTheme" type="button" aria-label="Toggle light or dark mode"></button>
  </header>

  <main id="main" aria-live="polite">
    <div class="card"><div class="spinner" role="status" aria-label="Loading your check-in"></div></div>
  </main>

  <p class="disclaimer">This recovery check-in supports your care team. It does not replace medical advice and never changes your medicines. If you feel unwell, contact your doctor or local emergency services.</p>
  <p class="disclaimer" id="fc-forget" style="display:none;margin-top:8px"></p>
  <p class="disclaimer" id="fc-privacy"></p>
</div>

ঔষধ আৰু নিৰ্দেশনাবোৰ অব্যাহত ৰাখক।","contact_t":"অনুগ্ৰহ কৰি আপোনাৰ চিকিৎসা দলৰ সৈতে যোগাযোগ কৰক","contact_b":"আপোনাৰ কিছুমান উত্তৰ ভালকৈ চোৱাৰ প্ৰয়োজন। অনুগ্ৰহ কৰি আজিয়েই আপোনাৰ চিকিৎসা দলৰ সৈতে যোগাযোগ কৰক। যদি আপুনি বহুত বেছি বেয়া অনুভৱ কৰে, তেন্তে আৰু সোনকালে চিকিৎসা সেৱা লওক।","seek_t":"অনুগ্ৰহ কৰি এতিয়াই চিকিৎসা সেৱা লওক","seek_emerg":"আপোনাৰ উত্তৰৰ ভিত্তিত, আপোনাক জৰুৰীভিত্তিত চিকিৎসকে চোৱাৰ প্ৰয়োজন। অনুগ্ৰহ কৰি এতিয়াই নিকটতম জৰুৰীকালীন বিভাগলৈ যাওক বা আপোনাৰ স্থানীয় জৰুৰীকালীন নম্বৰত ফোন কৰক। আপোনাৰ চিকিৎসা দলক জনোৱা হৈ আছে।","call":"112 ত ফোন কৰক","sendErr":"আপোনাৰ চেক-ইন পঠিয়াওঁতে কিবা এটা ভুল হ'ল। অনুগ্ৰহ কৰি পুনৰ চেষ্টা কৰক।","connSend":"সংযোগৰ সমস্যা। অনুগ্ৰহ কৰি আপোনাৰ ইণ্টাৰনেট পৰীক্ষা কৰি পুনৰ চেষ্টা কৰক।","forget":"চেক-ইন বন্ধ কৰক আৰু মোৰ তথ্য মচি পেলাওক","forget_confirm":"এই আৰোগ্য চেক-ইনবোৰ বন্ধ কৰি আপোনাৰ তথ্য স্থায়ীভাৱে মচি পেলাব নে? এইটো আকৌ ঘূৰাই আনিব নোৱাৰি।","forget_done_t":"আপোনাৰ তথ্য মচি পেলোৱা হৈছে","forget_done_b":"আপুনি আৰু কোনো চেক-ইন নাপাব। নিজৰ যত্ন লওক — অসুস্থ অনুভৱ কৰিলে আপোনাৰ চিকিৎসা দলৰ সৈতে যোগাযোগ কৰক।","unavail_t":"সাময়িকভাৱে উপলব্ধ নহয়","unavail_b":"এই আৰোগ্য চেক-ইনটো এই মুহূৰ্তত উপলব্ধ নহয়। অনুগ্ৰহ কৰি পিছত পুনৰ চেষ্টা কৰক, বা আপোনাৰ চিকিৎসা দলৰ সৈতে যোগাযোগ কৰক।"}

  // Bridge to the shared reviewed registry for the first-run language prompt (keeps one source of truth for
  // language names + prompt strings). Chrome/answer labels stay in the rich inline table above.
  function ti18n(key, lang, vars){ return FCI ? FCI.t(key, lang || LANG, vars) : (vars && vars.lang ? vars.lang : key); }
  function t(k){ var d = I18N[LANG] || I18N.en; return (d[k] != null ? d[k] : I18N.en[k]) || ""; }
  // A check-in question shown in the patient's language when a REVIEWED translation exists (by i18nKey);
  // otherwise the clinician-authored English text. Never a machine translation.
  function qText(q){ if(q && q.i18nKey && FCI){ var s = FCI.t(q.i18nKey, LANG); if(s && s !== q.i18nKey) return s; } return (q && q.text) || ""; }

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
  function clear(){ while(main.firstChild) main.removeChild(main.firstChild); }
  // Mandatory-English: safety/legal text is shown in the patient's language AND English (English always
  // present as an authoritative fallback, especially for the AI-drafted languages). enStr = the English string.
  function enStr(k){ return (I18N.en && I18N.en[k]) || ""; }
  function biHtml(k){ var s = esc(t(k)); if(LANG !== "en"){ var e = enStr(k); if(e && e !== t(k)) s += '<br><br><span style="opacity:.78;font-size:.94em">'+esc(e)+'</span>'; } return s; }
  // Legal/safety disclaimer — translated + always with the English underneath (never English-only-hidden).

    te: "ఈ రికవరీ చెక్-ఇన్ మీ సంరక్షణ బృందానికి సహాయం చేస్తుంది. ఇది వైద్య సలహాకు ప్రత్యామ్నాయం కాదు, మీ మందులను ఎప్పుడూ మార్చదు. మీకు అనారోగ్యంగా అనిపిస్తే, మీ వైద్యుడిని లేదా స్థానిక అత్యవసర సేవలను సంప్రదించండి.",

  };
  function updateDisclaimer(){ try{
    var d=document.querySelector(".disclaimer"); if(d){ var loc=DISCLAIMER[LANG]||DISCLAIMER.en; d.innerHTML = esc(loc) + (LANG!=="en" ? '<br><span style="opacity:.7">'+esc(DISCLAIMER.en)+'</span>' : ""); }
    // DPDP §5/§13 privacy notice: what's processed, by whom, why, retention, erase right, policy + grievance contact.
    var pv=document.getElementById("fc-privacy");
    if(pv && FCI){
      var note=FCI.t("fc.portal.privacy",LANG), noteEn=FCI.t("fc.portal.privacy","en");
      var links=' <a href="/privacy" style="color:var(--teal)">'+esc(FCI.t("fc.portal.privacy_link",LANG))+'</a> &middot; <a href="mailto:support@stewardmd.in" style="color:var(--teal)">'+esc(FCI.t("fc.portal.contact",LANG))+'</a>';
      var h=esc(note)+links;
      if(LANG!=="en" && note!==noteEn) h+='<br><span style="opacity:.7">'+esc(noteEn)+'</span>';
      pv.innerHTML=h;
    }
    // Right-to-erasure link — persistent on EVERY patient view, placed directly ABOVE the privacy
    // note so its "delete your data … using the link above" reference is always valid. (Previously the
    // link only rendered on the check-in FORM, so the Thank-you / Done pages promised a link that
    // wasn't there.) forgetMe() posts /forget with the URL token; hidden when there is no token.
    var fg=document.getElementById("fc-forget");
    if(fg){
      if(token){
        fg.innerHTML='<a href="#" style="color:var(--slate);text-decoration:underline">'+esc(t("forget"))+'</a>';
        fg.style.display="block";
        var fga=fg.querySelector("a"); if(fga) fga.onclick=function(e){ e.preventDefault(); forgetMe(); };
      } else { fg.style.display="none"; }
    }
  }catch(e){} }

  function screenMessage(icon, title, body, cls){
    clear();
    var card = el(
      '<div class="card result '+(cls||"")+'">'+
        '<div class="ic" aria-hidden="true">'+icon+'</div>'+
        '<h1>'+esc(title)+'</h1>'+
        '<p>'+esc(body)+'</p>'+
      '</div>'
    );
    main.appendChild(card);
    enter(card); pop(card.querySelector(".ic"));
  }

  function fetchJSON(url, opts){
    return fetch(url, opts).then(function(r){ return r.json().then(function(j){ return { status:r.status, body:j }; }); });
  }

  // ---- load today's check-in ----
  // Accept any language the shared registry supports (chrome falls back to English for unreviewed ones;
  // reviewed question/label strings still render in that language).
  function setLang(l){ if(!l) return; if(I18N[l] || (FCI && FCI.isSupported(l))){ LANG = l; try{ document.documentElement.lang = l; }catch(e){} updateDisclaimer(); } }
  function load(){
    if(!token){ return screenMessage("🔗",t("linkBad_t"),t("linkBad_b"),""); }
    fetchJSON(API+"/portal?t="+encodeURIComponent(token))
      .then(function(res){
        var b = res.body || {};
        setLang(b.lang);
        if(res.status===410 || b.error==="link_expired"){ return screenMessage("⌛",t("expired_t"),t("expired_b"),""); }
        if(!b.ok){
          if(b.error==="closed"){ return screenMessage("✅",t("done_t"),t("done_b"),"r-green"); }
          if(b.error==="not_configured"){ return screenMessage("🛠",t("unavail_t"),t("unavail_b"),""); }
          return screenMessage("🔗",t("linkBad_t"),t("linkBad_b"),"");
        }
        ctx = b;
        // First-run language confirmation: only when we auto-detected a non-English language that the patient
        // hasn't confirmed yet. Shown once; the choice is stored server-side so it's never asked again.
        if(b.lang && b.lang !== "en" && !b.langConfirmed && FCI && FCI.isSupported(b.lang)){
          return promptLanguage(b.lang, function(){ proceed(b); });
        }
        proceed(b);
      })
      .catch(function(){ screenMessage("📶",t("conn_t"),t("conn_b"),""); });
  }
  function proceed(b){
    if(b.nothingDue){
      if(b.recovered){ screenMessage("🎉",t("recovered_t"),t("recovered_b"),"r-green"); }
      else {
        var when = b.nextDueMs ? new Date(b.nextDueMs) : null;
        var whenTxt = when ? (" " + when.toLocaleDateString(LANG==="hi"?"hi-IN":(LANG==="te"?"te-IN":undefined),{weekday:"long", month:"short", day:"numeric"})) : "";
        screenMessage("✅",t("notdue_t"),t("notdue_b").replace("{w}", whenTxt),"r-green");
      }
    } else {
      renderForm();
    }
    loadInbox();   // Doctor Action Center: show messages from the care team below whatever screen we rendered
  }

  // ---- Doctor Action Center: patient inbox ----
  function ti(k){ return FCI ? FCI.t(k, LANG) : k; }   // inbox labels via the shared registry
  function loadInbox(){
    if(!token) return;
    fetchJSON(API+"/inbox?t="+encodeURIComponent(token))
      .then(function(res){ var b = res.body || {}; if(b.ok && b.items && b.items.length) renderInbox(b.items); })
      .catch(function(){});
  }
  function renderInbox(items){
    var sec = el('<div class="card" id="fc-inbox" style="margin-top:16px"></div>');
    sec.appendChild(el('<h2 style="font-size:16px;margin:0 0 10px">'+esc(ti("fc.inbox.title"))+'</h2>'));
    items.forEach(function(c){ sec.appendChild(inboxCard(c)); });
    main.appendChild(sec);
    enter(sec); staggerIn(sec.querySelectorAll(".fc-msg"));
  }
  function inboxCard(c){
    var emergency = c.priority === "high" || c.type === "emergency";
    var wrap = el('<div class="fc-msg'+(emergency?' fc-msg-em':'')+'"></div>');
    var who = (c.doctorName || (ti("fc.inbox.from"))) + (c.hospitalName ? " · " + c.hospitalName : "");
    wrap.appendChild(el('<div class="fc-msg-h">'+(emergency?('🚨 '+esc(ti("fc.inbox.emergency"))):esc(who))+'</div>'));
    if(c.body) wrap.appendChild(el('<div class="fc-msg-b">'+esc(c.body)+'</div>'));
    wrap.appendChild(inboxControls(c));
    return wrap;
  }
  function inboxControls(c){
    var box = el('<div class="fc-msg-act"></div>');
    var done = c.status === "read" || c.status === "replied";
    if(c.requiresResponse === "reply"){
      var ta = el('<textarea class="fc-reply" placeholder="'+esc(ti("fc.inbox.reply_ph"))+'"></textarea>');
      var send = el('<button type="button" class="cta fc-mini">'+esc(ti("fc.inbox.send"))+'</button>');
      send.addEventListener("click", function(){ tap(send); if(!ta.value.trim()) return; send.disabled=true; respond(c.id, "reply", { text: ta.value }, box, ti("fc.inbox.sent")); });
      box.appendChild(ta); box.appendChild(send);
    } else if(c.requiresResponse === "photo"){
      var fin = el('<input type="file" accept="image/*" style="display:none">');
      var up = el('<button type="button" class="cta fc-mini">📷 '+esc(ti("fc.inbox.upload_photo"))+'</button>');
      up.addEventListener("click", function(){ tap(up); fin.click(); });
      fin.addEventListener("change", function(){ if(fin.files && fin.files[0]) uploadPhoto(c.id, fin.files[0], box); });
      box.appendChild(up); box.appendChild(fin);
    } else if(c.requiresResponse === "vitals"){
      var fields = (c.payload && c.payload.fields) || [];
      var inputs = {};
      fields.forEach(function(k){
        var row = el('<div class="fc-vrow"></div>');
        var label = VITAL_LABELS[k] ? VITAL_LABELS[k].label : k;
        var unit = VITAL_LABELS[k] ? VITAL_LABELS[k].unit : "";
        if(k === "bp"){
          row.innerHTML = '<label>'+esc(label)+' ('+esc(unit)+')</label>';
          var s = el('<input type="number" inputmode="numeric" placeholder="Systolic">');
          var d = el('<input type="number" inputmode="numeric" placeholder="Diastolic">');
          inputs[k+"_sys"]=s; inputs[k+"_dia"]=d; row.appendChild(s); row.appendChild(d);
        } else {
          row.innerHTML = '<label>'+esc(label)+' ('+esc(unit)+')</label>';
          var inp = el('<input type="number" inputmode="decimal" step="any">'); inputs[k]=inp; row.appendChild(inp);
        }
        box.appendChild(row);
      });
      var sub = el('<button type="button" class="cta fc-mini">'+esc(ti("fc.inbox.submit_vitals"))+'</button>');
      sub.addEventListener("click", function(){
        tap(sub); var payload = { requested: fields }; Object.keys(inputs).forEach(function(k){ payload[k] = inputs[k].value; });
        sub.disabled=true; respond(c.id, "vitals", payload, box, ti("fc.inbox.sent"));
      });
      box.appendChild(sub);
    } else if(c.requiresResponse === "review"){
      var acc = el('<button type="button" class="cta fc-mini">'+esc(ti("fc.inbox.accept_review"))+'</button>');
      acc.addEventListener("click", function(){ tap(acc); acc.disabled=true; respond(c.id, "review", {}, box, ti("fc.inbox.sent")); });
      box.appendChild(acc);
    } else if(c.requiresResponse === "acknowledge" || c.requiresResponse === "read"){
      if(done){ box.appendChild(el('<div class="fc-done">✓ '+esc(ti("fc.inbox.acknowledged"))+'</div>')); }
      else {
        var ack = el('<button type="button" class="cta fc-mini sec">'+esc(ti("fc.inbox.acknowledge"))+'</button>');
        ack.addEventListener("click", function(){ tap(ack); ack.disabled=true; respond(c.id, c.requiresResponse==="read"?"read":"acknowledge", {}, box, ti("fc.inbox.acknowledged")); });
        box.appendChild(ack);
      }
    }
    return box;
  }
  var VITAL_LABELS = {
    bp:{label:"Blood pressure",unit:"mmHg"}, pulse:{label:"Pulse",unit:"bpm"}, temp:{label:"Temperature",unit:"°C"},
    weight:{label:"Weight",unit:"kg"}, glucose:{label:"Blood sugar",unit:"mg/dL"}, spo2:{label:"SpO₂",unit:"%"},
    rr:{label:"Respiratory rate",unit:"/min"}, urine:{label:"Urine output",unit:"mL/24h"}
  };
  function respond(commId, kind, extra, box, okLabel){
    var payload = Object.assign({ t: token, commId: commId, kind: kind }, extra || {});
    fetchJSON(API+"/respond", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(payload) })
      .then(function(res){
        if(res.body && res.body.ok){ box.innerHTML = '<div class="fc-done">✓ '+esc(okLabel||ti("fc.inbox.sent"))+'</div>'; }
        else { box.appendChild(el('<p class="foot" role="alert">'+esc(t("sendErr"))+'</p>')); }
      })
      .catch(function(){ box.appendChild(el('<p class="foot" role="alert">'+esc(t("connSend"))+'</p>')); });
  }
  function uploadPhoto(commId, file, box){
    box.appendChild(el('<div class="fc-done" id="fc-uping">…</div>'));
    fetch(API+"/upload?t="+encodeURIComponent(token)+"&commId="+encodeURIComponent(commId), { method:"POST", headers:{ "Content-Type": file.type || "application/octet-stream" }, body:file })
      .then(function(r){ return r.json().then(function(j){ return { status:r.status, body:j }; }); })
      .then(function(res){
        if(res.body && res.body.ok && res.body.key){ respond(commId, "photo", { mediaKeys:[res.body.key] }, box, ti("fc.inbox.uploaded")); }
        else { var e = box.querySelector("#fc-uping"); if(e) e.remove(); box.appendChild(el('<p class="foot" role="alert">'+esc(ti("fc.inbox.upload_err"))+'</p>')); }
      })
      .catch(function(){ var e = box.querySelector("#fc-uping"); if(e) e.remove(); box.appendChild(el('<p class="foot" role="alert">'+esc(t("connSend"))+'</p>')); });
  }

  // ---- first-run language prompt ("Would you like to continue in <lang>?") ----
  function persistLang(code, done){
    setLang(code);
    fetchJSON(API+"/lang", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ t:token, lang:code }) })
      .then(function(){ if(done) done(); }, function(){ if(done) done(); });   // never block on the write
  }
  function promptLanguage(detected, done){
    clear();
    var native = FCI ? FCI.langNative(detected) : detected;
    var card = el('<div class="card"><div class="ic" aria-hidden="true">🌐</div>'+
      '<h1>'+esc(ti18n("fc.lang.prompt", detected, { lang: native }))+'</h1>'+
      '<p class="lead">'+esc(ti18n("fc.lang.prompt", "en", { lang: (FCI?FCI.langName(detected):detected) }))+'</p>'+
      '<div id="langbtns"></div>'+
      '<p class="foot">'+esc(ti18n("fc.lang.change_hint", detected))+'</p></div>');
    main.appendChild(card);
    var wrap = card.querySelector("#langbtns");
    var bCont = el('<button type="button" class="cta">'+esc(ti18n("fc.lang.continue", detected, { lang: native }))+'</button>');
    var bEng  = el('<button type="button" class="opt" style="width:100%;margin-top:10px">'+esc(ti18n("fc.lang.english", "en"))+'</button>');
    var bOth  = el('<button type="button" class="opt" style="width:100%;margin-top:10px">'+esc(ti18n("fc.lang.choose", detected))+'</button>');
    bCont.addEventListener("click", function(){ tap(bCont); persistLang(detected, done); });
    bEng.addEventListener("click", function(){ tap(bEng); persistLang("en", done); });
    bOth.addEventListener("click", function(){ tap(bOth); chooseLanguage(done); });
    wrap.appendChild(bCont); wrap.appendChild(bEng); wrap.appendChild(bOth);
    enter(card); pop(card.querySelector(".ic"));
  }
  function chooseLanguage(done){
    clear();
    var card = el('<div class="card"><div class="ic" aria-hidden="true">🌐</div>'+
      '<h1>'+esc(ti18n("fc.lang.choose_title", LANG))+'</h1><div id="langlist"></div></div>');
    main.appendChild(card);
    var list = card.querySelector("#langlist");
    (FCI ? FCI.languages() : [{code:"en",name:"English",native:"English"}]).forEach(function(l){
      var lbl = l.code === "en" ? "English" : (l.native + " · " + l.name) + (l.reviewed ? "" : "");
      var b = el('<button type="button" class="opt" style="width:100%;margin-top:8px;text-align:left">'+esc(lbl)+'</button>');
      b.addEventListener("click", function(){ tap(b); persistLang(l.code, done); });
      list.appendChild(b);
    });
    enter(card); pop(card.querySelector(".ic"));
  }

  // ---- render the questionnaire ----
  function renderForm(){
    clear();
    subEl.textContent = t("day") + " " + ctx.dayOffset;
    // Generic greeting only — a shared/forwarded link must never reveal the patient's name.
    var lead = t("lead").replace("{d}", ctx.disease ? (" ("+esc(ctx.disease)+")") : "");
    var head = el(
      '<div class="card">'+
        '<h1>'+esc(t("title"))+'</h1>'+
        '<p class="lead">'+lead+'</p>'+
        '<form id="frm"></form>'+
      '</div>'
    );
    main.appendChild(head);
    var frm = head.querySelector("#frm");
    (ctx.questionnaire.questions||[]).forEach(function(q){ frm.appendChild(renderQ(q)); });

    var submit = el('<button type="button" class="cta" id="send">'+esc(t("send"))+'</button>');
    frm.appendChild(submit);
    frm.appendChild(el('<p class="foot" id="ferr" role="alert"></p>'));
    submit.addEventListener("click", function(){ tap(submit); onSubmit(); });
    // Change language anytime (the "Settings" affordance — reopens the chooser and re-renders the form).
    if(FCI){
      var langBar = el('<p style="text-align:center;margin-top:14px"><a href="#" style="color:var(--slate);font-size:12.5px;text-decoration:underline">🌐 '+esc(ti18n("fc.lang.settings", LANG))+'</a></p>');
      langBar.querySelector("a").addEventListener("click", function(e){ e.preventDefault(); chooseLanguage(function(){ renderForm(); }); });
      main.appendChild(langBar);
    }
    // Patient opt-out + right-to-erasure now lives in the PERSISTENT footer (updateDisclaimer → #fc-forget),
    // so it shows on EVERY view (form, Thank-you, Done) — matching the privacy note's "link above".
    // Animate: card in, questions stagger in, submit follows.
    enter(head); staggerIn(frm.querySelectorAll(".q")); enter(submit, 0.05 + (frm.querySelectorAll(".q").length) * 0.045);
  }

  function forgetMe(){
    if(!(window.confirm && confirm(t("forget_confirm")))) return;
    fetchJSON(API+"/forget", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ t:token }) })
      .then(function(){ screenMessage("🗑️", t("forget_done_t"), t("forget_done_b"), "r-green"); })
      .catch(function(){ screenMessage("📶", t("conn_t"), t("conn_b"), ""); });
  }

  function renderQ(q){
    var wrap = el('<div class="q"></div>');
    var unit = q.unit ? (' <span class="q-unit">('+esc(q.unit)+')</span>') : "";
    wrap.appendChild(el('<label class="q-label" id="lab_'+esc(q.id)+'">'+esc(qText(q))+unit+'</label>'));

    if(q.type==="yesno"){
      wrap.appendChild(choiceRow(q.id, [{v:"no",t:t("no")},{v:"yes",t:t("yes")}]));
    } else if(q.type==="overall"){
      wrap.appendChild(choiceRow(q.id, [{v:"better",t:t("better")},{v:"same",t:t("same")},{v:"worse",t:t("worse")}]));
    } else if(q.type==="choice" && q.options){
      wrap.appendChild(choiceRow(q.id, q.options.map(function(o){ return { v:o, t:optLabel(o) }; })));
    } else if(q.type==="scale"){
      wrap.appendChild(scaleRow(q.id, 0, q.max || 3));   // render the pathway's real 0..max range (default 0-3)
      wrap.appendChild(el('<div class="scale-ends"><span>'+esc(t("none"))+'</span><span>'+esc(t("worst"))+'</span></div>'));
    } else if(q.type==="number"){
      var inp = el('<input type="number" inputmode="decimal" step="any" aria-labelledby="lab_'+esc(q.id)+'">');
      inp.addEventListener("input", function(){ answers[q.id] = inp.value===""? undefined : inp.value; });
      wrap.appendChild(inp);
    } else {
      // default → free choice yes/no
      wrap.appendChild(choiceRow(q.id, [{v:"no",t:t("no")},{v:"yes",t:t("yes")}]));
    }
    return wrap;
  }
  // Known choice values get a translated label; anything else falls back to a capitalised English word.
  function optLabel(o){ var d=I18N[LANG]||I18N.en; return (d[o]!=null?d[o]:(I18N.en[o]!=null?I18N.en[o]:cap(o))); }

  function cap(s){ s=String(s); return s.charAt(0).toUpperCase()+s.slice(1); }

  function choiceRow(id, opts){
    var row = el('<div class="opts" role="group" aria-labelledby="lab_'+esc(id)+'"></div>');
    opts.forEach(function(o){
      var b = el('<button type="button" class="opt" aria-pressed="false" data-v="'+esc(o.v)+'">'+esc(o.t)+'</button>');
      b.addEventListener("click", function(){
        answers[id] = o.v; tap(b);
        Array.prototype.forEach.call(row.children, function(c){ c.setAttribute("aria-pressed", c===b?"true":"false"); });
      });
      row.appendChild(b);
    });
    return row;
  }

  function scaleRow(id, min, max){
    var row = el('<div class="scale" role="group" aria-labelledby="lab_'+esc(id)+'"></div>');
    for(var n=min;n<=max;n++){ (function(n){
      var b = el('<button type="button" class="opt" aria-pressed="false">'+n+'</button>');
      b.addEventListener("click", function(){
        answers[id] = n; tap(b);
        Array.prototype.forEach.call(row.children, function(c){ c.setAttribute("aria-pressed", c===b?"true":"false"); });
      });
      row.appendChild(b);
    })(n); }
    return row;
  }

  // ---- submit ----
  function onSubmit(){
    var send = document.getElementById("send");
    var ferr = document.getElementById("ferr");
    ferr.textContent = "";
    // Require the "overall" question, every global emergency probe, AND every answerable (non-numeric)
    // red-flag question — a check-in must never be scored with a red-flag question left blank. Numeric vitals
    // (SpO2/glucose/BP) stay optional (the server engine blocks Green when they're missing).
    var required = (ctx.questionnaire.questions||[]).filter(function(q){ return q.id==="overall" || q.id.indexOf("g_")===0 || (q.redFlag && q.type!=="number"); });
    var missing = required.filter(function(q){ return answers[q.id]===undefined || answers[q.id]===null || answers[q.id]===""; });
    if(missing.length){ ferr.textContent = t("required"); return; }

    send.disabled = true; send.textContent = t("sending");
    fetchJSON(API+"/submit", {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ t:token, answers:answers })
    }).then(function(res){
      var b = res.body || {};
      if(res.status===410 || b.error==="link_expired"){ return screenMessage("⌛",t("expired_t"),t("expired_b"),""); }
      if(!b.ok){
        if(b.error==="already_submitted"){ return screenMessage("✅",t("already_t"),t("already_b"),"r-green"); }
        send.disabled=false; send.textContent=t("send");
        ferr.textContent = t("sendErr");
        return;
      }
      showResult(b);
    }).catch(function(){
      send.disabled=false; send.textContent=t("send");
      ferr.textContent = t("connSend");
    });
  }

  // ---- engine-decided, safe result (rendered in the patient's language) ----
  function showResult(b){
    var lvl = b.escalation || "green";
    if(lvl==="red"){
      clear();
      var rc = el(
        '<div class="card result r-red">'+
          '<div class="ic" aria-hidden="true">⚠️</div>'+
          '<h1>'+esc(t("seek_t"))+'</h1>'+
          '<div class="emergency">'+biHtml("seek_emerg")+'</div>'+
          '<a class="call" href="tel:112">📞 '+esc(t("call"))+'</a>'+
        '</div>'
      );
      main.appendChild(rc);
      // Urgent result: card in, icon pops, then a gentle 2× attention pulse on the icon (never frantic).
      enter(rc); var ic = rc.querySelector(".ic"); pop(ic);
      anim(ic, { transform: ["scale(1)", "scale(1.14)", "scale(1)"] }, { duration: 1.1, delay: 0.55, repeat: 2, easing: "ease-in-out" });
      var call = rc.querySelector(".call"); enter(call, 0.35);
      return;
    }
    if(lvl==="orange"){ screenMessage("🟠",t("contact_t"),t("contact_b"),"r-amber"); return; }
    if(b.recovered){ screenMessage("🎉",t("recovered_t"),t("recovered_b"),"r-green"); return; }
    screenMessage("✅",t("thanks_t"),t("green_b"),"r-green");
  }

  load();
})();
</script>
</body>
</html>
