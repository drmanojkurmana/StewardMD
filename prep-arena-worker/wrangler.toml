# prep-arena: PrepNucleus Arena live battles (Durable Objects Matchmaker + BattleRoom). Plan: vault/plans/PrepNucleus-Arena.md.
# Deploy (owner approves): see vault/modules/PrepNucleus.md "Arena server". Not deployed by CI.
name = "prep-arena"
main = "src/index.js"
compatibility_date = "2026-06-27"
account_id = "5476a757e49205bd1cce40b144eb59a9"
workers_dev = true

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "BATTLE_ROOM"
class_name = "BattleRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "BattleRoom"]

# D1 shared with Pages (functions/api/prep/arena). CREATE FIRST: npx wrangler d1 create prep-arena-db
# then paste the id here and in the root wrangler.toml (both blocks).
[[d1_databases]]
binding = "PREP_ARENA_DB"
database_name = "prep-arena-db"
database_id = "REPLACE_AFTER_CREATE"

# The screened question bank (same bucket and prefix Pages serves from), for battle questions.
[[r2_buckets]]
binding = "PREP_BANK_R2"
bucket_name = "stewardmd-offline"

# FIREBASE_PROJECT_ID defaults to stewardmd-498ec in functions/_fbauth.js.
