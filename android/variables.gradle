ext {
    // Android 8.0. Raised from 24 (the Capacitor scaffold default, never a deliberate choice) for
    // @capacitor/barcode-scanner, whose Android library (ionbarcode-android) requires 26 — the
    // native scanner behind the prescription QR check. The alternative,
    // @capacitor-mlkit/barcode-scanning, builds at 24 but ships a podspec only and so cannot be
    // added to this SPM iOS project at all.
    // Cost, accepted by the owner: Android 7.0/7.1 (API 24-25) can no longer install or update.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}