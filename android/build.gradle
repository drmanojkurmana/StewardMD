// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Kotlin + Compose compiler — used ONLY by the additive :wear module (Wear OS client).
        // The :app module stays Java/Groovy; adding these classpaths does not change its build.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.1.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
