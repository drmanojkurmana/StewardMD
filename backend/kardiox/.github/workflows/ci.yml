name: kardiox-pipeline-ci

on:
  push:
    paths: ["backend/kardiox/**"]
  pull_request:
    paths: ["backend/kardiox/**"]

defaults:
  run:
    working-directory: backend/kardiox

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check app tests || true   # non-blocking initially; tighten later
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kardiox-pipeline:ci backend/kardiox
