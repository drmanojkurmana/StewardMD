<!doctype html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<meta name="referrer" content="no-referrer"/>
<title>Your place in the queue · StewardMD</title>
<!-- Self-contained patient wait page (Smart OPD Queue). No login, no app, NO PHI: only position/ETA/
     status from /api/queue/portal via the opaque signed token. Fonts are self-hosted (assets/fonts/)
     so icons + type render on any hospital network, no CDN. -->
<style>
  /* Self-hosted fonts: no CDN dependency on hospital wifi. */
  @font-face{ font-family:'Inter Variable'; font-style:normal; font-weight:100 900; font-display:swap; src:url(/assets/fonts/inter-variable.woff2) format('woff2'); }
  @font-face{ font-family:'Material Symbols Rounded'; font-style:normal; font-weight:300 700; font-display:block; src:url(/assets/fonts/material-symbols-rounded.woff2) format('woff2'); }

  :root{ --primary:#0e6e63; --on-primary:#fff; --primary-container:#0b7d70; --on-primary-container:#f4fffc;
    --primary-fixed:#89f5e7; --on-primary-fixed-variant:#005049; --secondary:#566a74;
    --tertiary-container:#5f7784; --on-tertiary-container:#fdfcff; --error:#ba1a1a; --ok:#1c7a4a;
    --bg:#f6f7f5; --surface:#ffffff; --on-surface:#14202b; --on-surface-variant:#3d4947;
    --sc-lowest:#fff; --sc-low:#f2f4f6; --sc-highest:#e6eae9; --surface-variant:#dbe3e1; --outline-variant:#c1ccc9;
    --ease:cubic-bezier(.2,.7,.2,1); --dur:.55s; }
  @media (prefers-color-scheme: dark){ :root{ --primary:#3fc7b3; --on-primary:#04322c; --primary-container:#0d5b52; --on-primary-container:#c9fff5;
    --bg:#111a1e; --surface:#18242a; --on-surface:#eaf0f2; --on-surface-variant:#bcc9c6;
    --sc-lowest:#141f24; --sc-low:#18242a; --sc-highest:#2a383e; --surface-variant:#31424a; --outline-variant:#31424a; --secondary:#a9bcc3; } }

  *{box-sizing:border-box} html,body{margin:0}
  body{ background:var(--bg); color:var(--on-surface); font-family:'Inter Variable',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100dvh; -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-family:'Material Symbols Rounded'; font-weight:400; vertical-align:middle; user-select:none; line-height:1; -webkit-font-feature-settings:'liga'; }
  .fill{ font-variation-settings:'FILL' 1; }

  header{ position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 1px 2px rgba(20,32,43,.06); }
  .hd{ display:flex; align-items:center; gap:8px; max-width:480px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 20px 14px; }
  .hd .mark{ width:26px; height:26px; background:var(--primary); -webkit-mask:url(/logo.png) center/contain no-repeat; mask:url(/logo.png) center/contain no-repeat; }
  .hd h1{ font:800 20px 'Inter Variable',Inter; color:var(--on-surface); margin:0; letter-spacing:-.01em; }
  .hd h1 span{ color:var(--primary); }
  /* White-label: a Pro clinic's own logo + name, with a discreet "powered by StewardMD". */
  .hd .clogo{ height:28px; width:auto; max-width:150px; object-fit:contain; }
  .hd .cname{ font:800 18px 'Inter Variable',Inter; color:var(--on-surface); letter-spacing:-.01em; }
  .hd .pw{ margin-left:auto; display:inline-flex; align-items:center; gap:5px; font:600 10px 'Inter Variable',Inter; letter-spacing:.03em; text-transform:uppercase; color:var(--secondary); }
  .hd .pw .m{ width:14px; height:14px; background:var(--secondary); -webkit-mask:url(/logo.png) center/contain no-repeat; mask:url(/logo.png) center/contain no-repeat; }

  main{ max-width:480px; margin:0 auto; padding:20px 20px 130px; display:flex; flex-direction:column; gap:18px; }
  .top{ text-align:center; }
  .top h2{ font:700 22px 'Inter Variable',Inter; margin:0; letter-spacing:-.01em; }
  .top .doc{ font:500 14px 'Inter Variable',Inter; color:var(--secondary); margin:4px 0 12px; display:flex; align-items:center; justify-content:center; gap:5px; }
  .live{ display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; background:color-mix(in srgb,var(--primary) 10%,transparent); color:var(--primary); font:700 12px 'Inter Variable',Inter; }
  .live .material-symbols-outlined{ font-size:18px; animation:spin 2.6s linear infinite; }

  .card{ background:var(--sc-lowest); border:1px solid var(--surface-variant); border-radius:18px; box-shadow:0 1px 3px rgba(20,32,43,.05); }
  .pos{ padding:22px; display:flex; flex-direction:column; align-items:center; position:relative; overflow:hidden; }
  .pos .bar{ position:absolute; top:0; left:0; height:4px; width:100%; background:var(--surface-variant); }
  .pos .bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--primary-container),var(--primary)); border-radius:0 4px 4px 0; transition:width .95s var(--ease); }
  .pos .lbl{ font:700 12px 'Inter Variable',Inter; letter-spacing:.14em; text-transform:uppercase; color:var(--secondary); margin:8px 0 6px; }
  .pos .n{ display:flex; align-items:baseline; gap:3px; color:var(--primary); }
  .pos .n b{ font:800 68px 'Inter Variable',Inter; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; display:inline-block; }
  .pos .n b.bump{ animation:bump .5s var(--ease); }
  .pos .n sup{ font:700 18px 'Inter Variable',Inter; color:var(--secondary); }
  .pos .split{ display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; margin-top:18px; padding-top:18px; border-top:1px solid var(--surface-variant); text-align:center; }
  .pos .split .k{ font:700 12px 'Inter Variable',Inter; color:var(--secondary); margin-bottom:4px; }
  .pos .split .v{ font:700 20px 'Inter Variable',Inter; }
  .pos .split .col+.col{ border-left:1px solid var(--surface-variant); }
  .pos .split .dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:5px; animation:ping 2.4s var(--ease) infinite; }

  .eta{ background:var(--primary-container); color:var(--on-primary-container); border-radius:16px; padding:16px; display:flex; align-items:center; gap:14px; }
  .eta .ic{ background:rgba(255,255,255,.18); padding:12px; border-radius:12px; display:grid; place-items:center; }
  .eta .ic .material-symbols-outlined{ font-size:28px; }
  .eta .k{ font:700 12px 'Inter Variable',Inter; letter-spacing:.04em; text-transform:uppercase; opacity:.85; margin-bottom:2px; }
  .eta .v{ font:700 18px 'Inter Variable',Inter; }
  .eta .conf{ margin-left:auto; background:var(--primary-fixed); color:var(--on-primary-fixed-variant); padding:5px 11px; border-radius:999px; font:700 12px 'Inter Variable',Inter; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .eta .conf .material-symbols-outlined{ font-size:15px; }

  .journey{ padding:16px; }
  .journey h3{ font:700 12px 'Inter Variable',Inter; letter-spacing:.03em; color:var(--secondary); margin:0 0 16px; }
  .steps{ position:relative; padding-left:26px; display:flex; flex-direction:column; gap:20px; }
  .steps::before{ content:""; position:absolute; top:8px; bottom:8px; left:-17px; width:1px; background:var(--surface-variant); }
  .step{ position:relative; }
  .step .node{ position:absolute; left:-26px; top:0; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; box-shadow:0 0 0 4px var(--sc-lowest); }
  .step .node.done{ background:var(--primary); color:var(--on-primary); }
  .step .node.done .material-symbols-outlined{ font-size:13px; }
  .step .node.cur{ background:var(--primary-container); animation:node 2s var(--ease) infinite; } .step .node.cur i{ width:8px; height:8px; background:var(--on-primary-container); border-radius:50%; }
  .step .node.todo{ background:var(--sc-highest); border:2px solid var(--surface-variant); }
  .step .t{ font:600 14px 'Inter Variable',Inter; } .step.cur .t{ color:var(--primary); }
  .step .m{ font:500 12px 'Inter Variable',Inter; color:var(--secondary); }

  .note{ background:var(--sc-low); border:1px solid var(--surface-variant); border-radius:12px; padding:14px; display:flex; gap:10px; align-items:flex-start; }
  .note .material-symbols-outlined{ color:var(--secondary); font-size:20px; }
  .note .t{ font:600 14px 'Inter Variable',Inter; } .note .m{ font:400 13px 'Inter Variable',Inter; color:var(--secondary); margin-top:2px; }

  .actions{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:none; background:color-mix(in srgb,var(--sc-lowest) 92%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--surface-variant); padding:12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .actions.on{ display:block; }
  .actions .in{ max-width:480px; margin:0 auto; display:flex; gap:10px; }
  .actions button{ flex:1; border-radius:12px; padding:12px; font:700 12px 'Inter Variable',Inter; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; background:var(--sc-highest); color:var(--on-surface-variant); border:1px solid var(--outline-variant); transition:transform .12s var(--ease),background .15s; }
  .actions button:active{ transform:scale(.96); }
  .actions button.primary{ background:var(--primary); color:var(--on-primary); border:none; }
  .actions button[hidden]{ display:none; }
  .actions button .material-symbols-outlined{ font-size:20px; }

  .msg{ text-align:center; padding:60px 24px; color:var(--secondary); }
  .msg .material-symbols-outlined{ font-size:48px; color:var(--outline-variant); display:block; margin:0 auto 14px; }
  .msg h2{ font:700 20px 'Inter Variable',Inter; color:var(--on-surface); margin:0 0 6px; }
  .msg .retry{ margin-top:18px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--outline-variant); background:var(--sc-lowest); color:var(--primary); font:700 13px 'Inter Variable',Inter; padding:10px 18px; border-radius:12px; cursor:pointer; }
  .msg .retry:active{ transform:scale(.97); }

  /* Skeleton loader */
  .sk{ background:linear-gradient(90deg,var(--sc-low) 25%,var(--sc-highest) 37%,var(--sc-low) 63%); background-size:400% 100%; animation:sh 1.4s ease infinite; border-radius:12px; }

  /* Entrance reveal (first paint only) */
  .rv{ animation:rise var(--dur) var(--ease) both; }

  @keyframes rise{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
  @keyframes bump{ 0%{transform:scale(1)} 35%{transform:scale(1.16)} 100%{transform:scale(1)} }
  @keyframes spin{ to{transform:rotate(360deg)} }
  @keyframes sh{ 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  @keyframes ping{ 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)} 70%,100%{box-shadow:0 0 0 7px transparent} }
  @keyframes node{ 0%,100%{box-shadow:0 0 0 4px var(--sc-lowest),0 0 0 4px transparent} 50%{box-shadow:0 0 0 4px var(--sc-lowest),0 0 0 11px color-mix(in srgb,var(--primary) 16%,transparent)} }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } .pos .bar i{ width:auto; } }
</style>
</head>
<body>
<header><div class="hd"><span class="mark" aria-hidden="true"></span><h1>Steward<span>MD</span></h1></div></header>
<main id="app">
  <section class="card pos" aria-hidden="true" style="gap:0">
    <div class="sk" style="height:12px;width:110px;margin:6px 0 14px"></div>
    <div class="sk" style="height:64px;width:130px;border-radius:16px"></div>
    <div class="sk" style="height:52px;width:100%;margin-top:20px"></div>
  </section>
  <section class="card sk" aria-hidden="true" style="height:74px;border:none"></section>
</main>
<div class="actions" id="actions"><div class="in">
  <button data-act="directions" id="btnDir" hidden><span class="material-symbols-outlined">directions</span>Directions</button>
  <button class="primary" data-act="call" id="btnCall" hidden><span class="material-symbols-outlined">call</span>Call Desk</button>
  <button data-act="share" id="btnShare"><span class="material-symbols-outlined">share</span>Share</button>
</div></div>
<script>
(function(){
  "use strict";
  var P = new URLSearchParams(location.search);
  var token = P.get("t") || "";
  var app = document.getElementById("app");
  var actions = document.getElementById("actions");
  var RM = false; try{ RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var rendered = false;                 // first live paint done?
  var last = { pos: 0, barW: 0 };       // for count-up + bar tween across polls
  var call = { phone:"", mapUrl:"" };

  function ms(n,f){ return '<span class="material-symbols-outlined'+(f?' fill':'')+'">'+n+'</span>'; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function ordSuffix(n){ var s=["th","st","nd","rd"], v=n%100; return (s[(v-20)%10]||s[v]||s[0]); }
  function clock(msv){ try{ return new Date(msv).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }catch(e){ return ""; } }

  function hideActions(){ actions.className = "actions"; }
  // White-label branding: a Pro clinic's uploaded logo (served by us) replaces the StewardMD mark as the
  // primary brand, with a discreet "powered by StewardMD". Falls back to the StewardMD mark when unbranded.
  var headerEl = document.querySelector("header");
  function setBrand(d){
    var logo = d && d.clinicLogo, name = (d && d.clinicName) || "";
    if(logo){
      headerEl.innerHTML = '<div class="hd"><img class="clogo" src="'+esc(logo)+'" alt="'+esc(name||"Clinic")+'"/>'+
        (name? '<span class="cname">'+esc(name)+'</span>':'')+
        '<span class="pw">powered by <span class="m" aria-hidden="true"></span>StewardMD</span></div>';
    } else {
      headerEl.innerHTML = '<div class="hd"><span class="mark" aria-hidden="true"></span><h1>Steward<span>MD</span></h1></div>';
    }
  }
  function msgView(icon, title, sub, retry){
    hideActions();
    app.innerHTML = '<div class="msg rv">'+ms(icon)+'<h2>'+esc(title)+'</h2><p>'+esc(sub||"")+'</p>'+
      (retry?'<button class="retry" data-act="retry">'+ms("refresh")+'Try again</button>':'')+'</div>';
  }
  function countUp(el, from, to){
    from = from|0; to = to|0;
    if(RM || from===to){ el.textContent = to; return; }
    var start = null, dur = 700;
    function step(ts){ if(start==null) start=ts; var p=Math.min(1,(ts-start)/dur); var e=1-Math.pow(1-p,3);
      el.textContent = Math.round(from + (to-from)*e); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  function showActions(d){
    call.phone = d.deskPhone || d.phone || "";
    call.mapUrl = d.mapUrl || d.directionsUrl || "";
    document.getElementById("btnCall").hidden = !call.phone;
    document.getElementById("btnDir").hidden = !call.mapUrl;
    actions.className = "actions on";
  }

  function render(d){
    setBrand(d);
    if(!d || !d.ok){
      if(d && d.error==="link_expired") return msgView("event_busy","This tracking link has expired","Your visit is complete. Thank you for visiting.");
      if(d && d.error==="not_configured") return msgView("hourglass_top","Queue is being set up","Please check back shortly.", true);
      return msgView("link_off","Link not valid","This queue tracking link isn't active. Ask the front desk for a new one.");
    }
    if(d.journey && d.journey.done) return msgView("task_alt","Your consultation is complete","Thank you for visiting. You may close this page.");

    showActions(d);
    var first = !rendered;
    var rv = first ? " rv" : "";
    var inConsult = d.status==="in_consultation";
    var dept = d.department || "Your clinic", doc = d.doctorName || "";
    var pos = inConsult ? null : (d.position||0);
    var targetW = inConsult ? 100 : Math.max(8, 100-(d.ahead||0)*12);
    var startN = first ? 0 : last.pos;

    var posBlock = inConsult
      ? '<div class="n"><b>Now</b></div>'
      : '<div class="n"><b id="posn">'+startN+'</b><sup>'+ordSuffix(pos)+'</sup></div>';
    var etaBlock = (!inConsult && d.etaStart)
      ? '<section class="eta'+rv+'"><div class="ic">'+ms("schedule",true)+'</div><div style="flex:1"><div class="k">Estimated consultation</div><div class="v">'+clock(d.etaStart)+' &ndash; '+clock(d.etaEnd)+'</div></div>'
        + (d.confidence? '<div class="conf">'+ms("check_circle")+ d.confidence +'% conf.</div>':'') +'</section>'
      : "";
    var j = d.journey||{};
    var inRoom = !inConsult, consulting = inConsult;
    var steps =
      '<div class="step"><div class="node done">'+ms("check")+'</div><div class="t">Registered</div><div class="m">'+(j.registeredAt?clock(j.registeredAt):"·")+'</div></div>'+
      '<div class="step'+(inRoom?' cur':'')+'"><div class="node '+(inRoom?'cur':'done')+'">'+(inRoom?'<i></i>':ms("check"))+'</div><div class="t">In waiting room</div><div class="m">'+(inRoom?"Currently":(j.calledAt?clock(j.calledAt):"Done"))+'</div></div>'+
      '<div class="step'+(consulting?' cur':'')+'"><div class="node '+(consulting?'cur':'todo')+'">'+(consulting?'<i></i>':'')+'</div><div class="t">Consultation</div><div class="m">'+(consulting?"Now":"Upcoming")+'</div></div>';
    var docStatus = inConsult ? "In consultation" : (d.doctorStatus==="break"?"On a short break": d.doctorStatus==="emergency"?"Handling an emergency": d.doctorStatus==="procedure"?"In a procedure":"Seeing patients");

    app.innerHTML =
      '<section class="top'+rv+'"><h2>'+esc(dept)+'</h2>'+ (doc? '<p class="doc">'+ms("person")+esc(doc)+'</p>':'') +
        '<span class="live">'+ms("sync")+'Live tracking active</span></section>'+
      '<section class="card pos'+rv+'"><div class="bar"><i id="posbar" style="width:'+last.barW+'%"></i></div>'+
        '<div class="lbl">'+(inConsult?"You are being seen":"Your position")+'</div>'+ posBlock +
        '<div class="split"><div class="col"><div class="k">Patients ahead</div><div class="v">'+(inConsult?0:(d.ahead||0))+'</div></div>'+
          '<div class="col"><div class="k">Doctor status</div><div class="v" style="font-size:14px;font-weight:600"><span class="dot"></span>'+esc(docStatus)+'</div></div></div></section>'+
      etaBlock +
      '<section class="card journey'+rv+'"><h3>Appointment journey</h3><div class="steps">'+steps+'</div></section>'+
      '<section class="note'+rv+'">'+ms("sms")+'<div><div class="t">We’ll text you</div><div class="m">You’ll get an SMS when it’s nearly your turn, so you can step away if you need to.</div></div></section>';

    // stagger the first-paint reveals
    if(first && !RM){ var rvs=app.querySelectorAll(".rv"); for(var i=0;i<rvs.length;i++){ rvs[i].style.animationDelay=(i*70)+"ms"; } }

    // motion: grow the bar, count/bump the position number
    var pb = document.getElementById("posbar");
    var pn = document.getElementById("posn");
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      if(pb) pb.style.width = targetW + "%";
      if(pn && pos!=null){
        if(first){ countUp(pn, 0, pos); }
        else { pn.textContent = pos; if(pos!==last.pos && !RM){ pn.classList.remove("bump"); void pn.offsetWidth; pn.classList.add("bump"); } }
      }
    }); });
    if(pos!=null) last.pos = pos;
    last.barW = targetW;
    rendered = true;
  }

  // action bar (share always; call/directions only when the server provides them)
  actions.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b) return;
    var a = b.getAttribute("data-act");
    if(a==="share"){ if(navigator.share){ navigator.share({title:"My place in the queue", url:location.href}).catch(function(){}); } else { try{ navigator.clipboard.writeText(location.href); }catch(x){} } }
    else if(a==="call" && call.phone){ try{ location.href="tel:"+call.phone; }catch(x){} }
    else if(a==="directions" && call.mapUrl){ try{ window.open(call.mapUrl,"_blank","noopener"); }catch(x){} }
  });
  // retry from an error view
  app.addEventListener("click", function(e){ if(e.target.closest('[data-act="retry"]')){ load(); } });

  // ---- sealed visit timeline (patient's own record, shared at checkout: /queue?t=..&v=t) ----
  var TL_LABEL={note:"Clinical note",assessment:"Assessment",medication:"Medication",vitals:"Vitals",checkout:"Visit completed"};
  var TL_ICON={note:"description",assessment:"assignment",medication:"medication",vitals:"monitor_heart",checkout:"task_alt"};
  function renderTimeline(d){
    hideActions();
    setBrand(d);
    if(!d || !d.ok){
      if(d && d.error==="expired") return msgView("event_busy","This visit link has expired","Ask your doctor to re-share it if you still need it.");
      if(d && d.error==="not_ready") return msgView("hourglass_top","Visit not finished yet","Your summary will be here once your visit is complete.", true);
      return msgView("link_off","Link not valid","This visit link isn't active. Ask the front desk for a new one.");
    }
    var items=(d.entries||[]).filter(function(e){ return TL_LABEL[e.kind]; });
    var rows=items.length? items.map(function(e,i){
      return '<div class="step rv" style="animation-delay:'+(i*60)+'ms"><div class="node done">'+ms(TL_ICON[e.kind]||"description")+'</div>'+
        '<div class="t">'+esc(TL_LABEL[e.kind]||"Note")+'</div>'+
        '<div class="m">'+clock(e.ts)+'</div>'+
        (e.text? '<p style="margin:4px 0 0;white-space:pre-wrap;grid-column:2/-1">'+esc(e.text)+'</p>':'')+'</div>';
    }).join("") : '<div class="msg" style="padding:20px 0"><p>No notes were recorded for this visit.</p></div>';
    app.innerHTML='<section class="top rv"><h2>Your visit summary</h2>'+
      '<span class="live">'+ms("verified")+'Shared securely by your doctor</span></section>'+
      '<section class="card journey rv" style="animation-delay:.08s"><h3>What happened during your visit</h3><div class="steps">'+rows+'</div></section>'+
      '<section class="note rv" style="animation-delay:.16s">'+ms("info")+'<div><div class="t">Keep this for your records</div><div class="m">This link is private to you and expires automatically.</div></div></section>';
  }

  function load(){
    if(P.get("v")==="t"){
      if(!token) return msgView("link_off","No visit link","Open the link from your SMS message.");
      return fetch("/api/queue/timeline?t="+encodeURIComponent(token), {headers:{"Accept":"application/json"}})
        .then(function(r){ return r.json(); }).then(renderTimeline)
        .catch(function(){ msgView("wifi_off","Can’t load your summary","Check your connection and try again.", true); });
    }
    if(P.get("mock")==="1"){ var now=Date.now(); return render({ ok:true, department:"StewardMD Cardiology", doctorName:"Dr. Sarah Richardson", doctorStatus:"consulting", status:"waiting", position:4, ahead:3, etaStart:now+18*60000, etaEnd:now+25*60000, confidence:96, clinicLogo:P.get("logo")||"", clinicName:P.get("name")||"", journey:{ registeredAt:now-90*60000, calledAt:0, consultStartAt:0, done:false } }); }
    if(!token) return msgView("link_off","No tracking link","Open the link from your SMS or WhatsApp message.");
    fetch("/api/queue/portal?t="+encodeURIComponent(token), {headers:{"Accept":"application/json"}})
      .then(function(r){ return r.json(); }).then(render)
      .catch(function(){ msgView("wifi_off","Can’t reach the queue","Check your connection and try again.", true); });
  }
  load();
  if(P.get("v")!=="t" && P.get("mock")!=="1" && token) setInterval(load, 20000);   // live refresh (poll); timeline is static
})();
</script>
