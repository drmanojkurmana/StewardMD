  :root{

  *{box-sizing:border-box}

  /* clinic picker */
  .crow{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);transition:box-shadow .15s ease,transform .15s ease}

     Scrolls sideways on a phone rather than wrapping into an unreadable grid. */

  .p-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
  .p-t{flex:1 0 132px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}

  .p-l{font:600 11px system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
  .p-v{font:700 24px system-ui,sans-serif;margin-top:4px}

  /* Video visits: the three tele actions keep a 44px target on every pointer, not only touch. */
  .acts button.tele,.opd-modern .acts button.tele{min-height:44px}

  .tele-sheet .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .tele-sheet a.btn{display:flex;align-items:center;justify-content:center;min-height:44px;text-decoration:none;box-sizing:border-box}
  .btn.danger{background:var(--red);color:#fff}
  .btn.danger:hover{box-shadow:0 4px 14px rgba(225,29,72,.35)}
  /* modal (animated bottom sheet) */
  .scrim{position:fixed;inset:0;background:rgba(6,18,16,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;visibility:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .24s var(--ease),visibility .24s}
  .scrim.on{opacity:1;visibility:visible}
  .sheet{background:var(--card);color:var(--ink);width:100%;max-width:500px;border-radius:22px 22px 0 0;padding:22px;max-height:88vh;overflow:auto;box-shadow:var(--sh-lg);border:1px solid var(--line);transform:translateY(100%);transition:transform .28s var(--ease)}
  .scrim.on .sheet{transform:none}
  @media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px;transform:translateY(14px) scale(.98)}}
  .sheet h3{margin:0 0 12px;font-size:18px;letter-spacing:-.01em}

  .cats button{background:var(--btn);color:var(--ink);padding:9px 14px;min-height:44px;font-weight:600;font-size:13px;border:1.5px solid var(--line);border-radius:10px}

  .dc h3{margin:0 0 2px}.dc .dc-sub{color:var(--mut);font-size:13px;margin:0 0 14px}

  .dc-k{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
  .dc-k .l{font-size:12px;color:var(--mut);font-weight:600}.dc-k .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .dc-k .s{font-size:12px;color:var(--mut)}.dc-k.warn{border-color:var(--amber-line);background:var(--amber-soft)}.dc-k.warn .v{color:var(--amber)}

  /* Vital signs read back from the clinical record (opd.html openNotes). One card per set of readings. */
  .vs{margin:2px 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .vs h4{margin:0 0 2px;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .vs h4 .src{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--mut)}
  .vs .st{font-size:12px;color:var(--mut);margin:0 0 8px}

  .vs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px 10px}
  .vs-v{display:flex;flex-direction:column;gap:1px}
  .vs-v .n{font-size:11px;color:var(--mut)}
  .vs-v .x{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .vs-v .x small{font-size:11px;font-weight:600;color:var(--mut);margin-left:3px}
  .vs .note{font-size:12.5px;color:var(--ink-sec);margin-top:6px;white-space:pre-wrap}
  /* The doctor's assessment, read from the clinical record. Same card language as vital signs. */
  .asn-set{padding:8px 0;border-top:1px solid var(--line)}
  .asn-set:first-of-type{border-top:0}
  .asn-sec{margin:6px 0}
  .asn-sec .n{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;font-weight:700}

    var send=function(){ return fetch(queueApiUrl(path),{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){return r.json().catch(function(){return {ok:false,error:"bad_response"};});}); };
    if(st.tokType==="firebase") return fbToken().then(function(t){ if(t) h["Authorization"]="Bearer "+t; return send(); });
    if(st.tok) h["X-Staff-Token"]=st.tok;   // GHIS token OR StewardMD staff session (server tries both)
    return send();
  }

  // One staff sign-in for both PIN and email: an "@" in the ID -> email+password (any device, no clinic
  // code); otherwise clinic-code + staff-ID + PIN. Same two server endpoints, one merged form.
  function doStaffLogin(){
    var id=document.getElementById("sid").value.trim(), pw=document.getElementById("spw").value.trim();
    if(!id||!pw){err("Enter your staff ID (or email) and PIN (or password).");return;}
    /* THE CLINIC CODE DECIDES, NOT THE SHAPE OF THE ID. This read only for an "@" and sent anything
     * containing one down the email+password door, ignoring the clinic code just typed and offering
     * the PIN as a password. Every staff ID seeded so far IS an email address, so the staff door
     * answered "Wrong email or password" to people whose code, ID and PIN were all correct. Same
     * bug, same fix as wardsynq/site/shell.js. */
    var hasAt=id.indexOf("@")>-1;
    var codeTyped=(document.getElementById("sorg")&&document.getElementById("sorg").value.trim())||"";
    var isEmail=!codeTyped&&hasAt;
    id=id.toLowerCase();   // staff IDs + emails are case-insensitive; the doctor app stores them lowercase, and mobile keyboards auto-capitalize - so normalize to match
    if(!hasAt && !codeTyped){err("Enter your clinic code (or sign in with your email).");return;}
    err("Signing in…");
    var url=isEmail?queueApiUrl("auth/email"):queueApiUrl("auth/pin");
    var body=isEmail?{email:id,password:pw}:{clinicCode:codeTyped,identity:id,pin:pw};
    fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(r){
      // Two-step sign-in: the PIN/password was right; ask for the phone's code and pass the answer through.
      if(!r||r.error!=="mfa_required") return r;
      var code=""; try{ code=prompt((r.message||"Enter the 6-digit code from your authenticator app.")+"\n\nLost your phone? Enter a backup code instead.")||""; }catch(e){}
      if(!code.trim()) return {cancelled:true};
      return fetch(queueApiUrl("auth/mfa"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({challenge:r.challenge,code:code.trim()})}).then(function(x){return x.json();});
    }).then(function(r){
      if(r&&r.cancelled){ err("Sign-in cancelled."); return; }
      if(r&&(r.error==="wrong_code"||r.error==="challenge_expired")){ err(r.error==="wrong_code"?"That code did not match. Sign in again and use the newest code.":"That took too long. Sign in again."); return; }
      if(!r||!r.ok){ err(r&&r.error==="locked"?"Too many attempts. Try again later.":(r&&r.error==="staff_disabled"?"OPD access not enabled yet.":(isEmail?"Wrong email or password.":"Wrong clinic code, staff ID or PIN."))); return; }
      if(r&&r.orgCode) try{ localStorage.setItem("smd_opd_clinic_code", r.orgCode); }catch(e){}
      else if(codeTyped) try{ localStorage.setItem("smd_opd_clinic_code", codeTyped); }catch(e){}
      onLogin("staff",r.token,r.orgId);
    }).catch(function(){err("Could not reach the server.");});
  }
  function doGhisLogin(){
    var uid=document.getElementById("uid").value.trim(), pwd=document.getElementById("pwd").value, hosp="manual";   // GITAM (GHIS) is the hospital - no code to type
    if(!uid||!pwd){err("Enter your employee ID and password.");return;} err("Signing in…");
    fetch("/api/ghis/staff-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:uid,password:pwd})}).then(function(r){return r.json();}).then(function(r){
      if(!r||!r.token){ err(r&&r.error==="staff_disabled"?"OPD access not enabled yet.":(r&&r.error==="bad_credentials"?"Wrong employee ID or password.":"Sign-in failed.")); return; }
      onLogin("staff",r.token,hosp);
    }).catch(function(){err("Could not reach the server.");});

  function doFirebase(mode){
    var a=fbAuth(); if(!a){err("Account sign-in unavailable here. Use PIN or email.");return;} err("Signing in…");
    var p;
    if(mode==="google") p=a.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    else {
      var em=document.getElementById("fe").value.trim(), pw=document.getElementById("fp").value;
      if(!em||!pw){err("Enter your email and password.");return;}
      p=a.signInWithEmailAndPassword(em,pw);
    }
    p.then(function(){ onLogin("firebase",""); }).catch(function(e){ err((e&&e.message)||"Sign-in failed."); });
  }
  function logout(msg){
    liveStop();
    // Plan item 13: an offline check-in not yet sent is the patient's place in the queue; say so before it is dropped.
    // A forced sign-out (msg: the session ended) keeps them for the next sign-in at this desk instead.
    try{ var od=offDesk(); if(od&&od.pending()){ if(!msg){ if(!window.confirm(od.pending()+" offline check-in(s) have not reached the queue yet and will be lost. Sign out anyway?")) return; od.clear(); } } else if(od) od.clear(); OFF=null; }catch(e){}
    // The next person at this desk must not inherit the last one's patient lookups (steward-identity-resolver.js).
    try{ if(window.StewardIdentityResolver&&window.StewardIdentityResolver.clearCache) window.StewardIdentityResolver.clearCache(); }catch(e){}
    if(st.tokType==="firebase"){ var a=fbAuth(); if(a) try{a.signOut();}catch(e){} }
    st.tok=""; st.tokType=""; st.who=null;
    try{
      localStorage.removeItem(LS_TOK);
      localStorage.removeItem(LS_TT);
      localStorage.removeItem("smd_opd_staff_tok");
      localStorage.removeItem("smd_opd_toktype");
      sessionStorage.removeItem("smd_staff_token");
    }catch(e){}
    renderLogin(msg);
  }

  // ---- boot: whoami then board ----
  function boot(){
    app.innerHTML='<div class="login"><p>Loading…</p></div>';
    api("whoami").then(function(r){
      if(!r||!r.ok){ if(r&&r.error==="unauthorized"){logout("Your session ended. Please sign in again.");return;} renderLogin("Session expired. Sign in again."); return; }
      // The hospital requires two-step sign-in for this role and it is not set up: every other request would be refused.
      if(r.twoStepRequired){ app.innerHTML='<div class="login"><h3>Two-step sign-in required</h3><p>Your hospital requires two-step sign-in for your role. Set it up at <a href="https://wardsynq.com/#/security">wardsynq.com, Sign-in security</a>, then sign in here again.</p><button class="btn" id="tsOut">Sign out</button></div>'; document.getElementById("tsOut").onclick=function(){logout("");}; return; }
      st.who=r; st.smdId=r.smdId||""; st.billingOn=!!r.billing; if(r.orgId||r.hospitalId) st.hospital=r.orgId||r.hospitalId; st.orgId=r.orgId||r.hospitalId||st.hospital; st.orgCode=r.orgCode||"";
      if(r.orgName) st.orgName=r.orgName;
      if(r.hasLogo!==undefined) st.hasLogo=!!r.hasLogo;
      if(r.doctorName) st.doctorName=r.doctorName;
      if(r.orgCode) try{ localStorage.setItem("smd_opd_clinic_code", r.orgCode); }catch(e){}
      // ANY StewardMD account can own a clinic. No clinic yet -> the create-clinic wizard (never a shared board).
      // A StewardMD account can own SEVERAL clinics: none -> wizard; one -> open it; many -> the picker.
      if(r.kind==="firebase"){ api("orgs").then(function(o){ var list=(o&&o.orgs)||[]; st.ownsOrg=true;
        if(!list.length){ openWizard(); return; }
        // Came from wardsynq.com with a hospital already chosen: open that one, not the picker.
        var wp=wardsynqOrg(), chosen=wp&&list.filter(function(c){return c.id===wp;})[0];
        if(chosen){ openClinic(chosen); return; }
        if(list.length===1){ openClinic(list[0]); return; }
        renderClinics(list);
      }); return; }
      // All roles (doctor, nurse, cashier, pharmacy, admin, owner) share the common OPD dashboard.
      // Cashier and pharmacy stations are accessible via the Billing & Pharmacy buttons in the toolbar
      // or patient ticket Bill actions, without forcibly ejecting staff away from the queue board.
      loadDash();
    }).catch(function(){ renderLogin("Could not reach the server. Check your connection and try again."); });
  }
  // ---- multi-clinic manager: one StewardMD account can own several clinics (open / add / delete) ----
  function wardsynqOrg(){ var w=""; try{ w=localStorage.getItem("smd_opd_workplace")||""; }catch(e){} return w.indexOf("wardsynq:")===0?w.slice(9):""; }
  /* WardSynQ hospital OPDs bill through the hospital's unified OPD + IPD cashier (ward.js), not the
   * standalone clinic cashier. Personal clinics keep /clinic-billing. A clinic is ONLY a WardSynQ
   * Inpatient Hospital when the SERVER says so on whoami (mode "wardsynq" with a real hospital id):
   * never from the hostname, nor from a stored workplace, both of which misrouted personal clinics
   * (mode "native", e.g. SMD-6TEQZM) into the inpatient cashier that looks for admitted bed stays. */
  function isWardSynQHospital(){
    return !!(st.who&&st.who.mode==="wardsynq"&&st.who.hospitalId&&st.who.hospitalId!=="manual");
  }
  function openWardSynqCashier(mrn){

    toast("Hospital Cashier loading…");

      if(window.WARD&&window.WARD.open){ clearInterval(poll); window.WARD.open({orgId:st.orgId,act:"cashier",mrn:mrn||"",returnToOpd:true}); }
    },100);

  /* The role is hospital-scoped: an account's whoami without a hospital is its global role, which hid

  function openClinic(c){ st.orgId=c.id; st.orgCode=c.code||""; st.orgName=c.name||""; st.hasLogo=!!c.hasLogo; st.doctorName=c.doctorName||""; st.hospital=c.id; st.ownsOrg=true; st.currentOrg=c; if(c.id) localStorage.setItem(LS_HOSP,c.id);
    if(c.code) try{ localStorage.setItem("smd_opd_clinic_code", c.code); }catch(e){}

  function delClinic(id,name){
    if(!confirm('Remove "'+name+'"? It leaves your clinic list. Patient records and the audit trail are kept.')) return;

    var typed=prompt('Type DELETE to remove "'+name+'"');
    if(typed!=="DELETE"){ if(typed!==null) toast("Nothing was removed. Type DELETE exactly."); return; }
    api("org/delete",{method:"POST",body:{orgId:id,confirm:typed}}).then(function(r){
      if(!r||!r.ok){ toast(r&&r.error?friendly(r.error):"Could not delete the clinic"); return; }
      toast("Clinic deleted"); openClinics();
    }).catch(function(){ toast("Could not reach the server"); });

  // Config-driven: if the org has rooms configured -> nurse-station (pool + room board); else the
  // existing doctor board (legacy path, unchanged). A single-room clinic shows just its room queue.
  function loadDash(tries){
    tries=tries||0;
    api("opd-board?orgId="+encodeURIComponent(st.orgId)+"&date="+st.date).then(function(r){
      if(r&&r.ok){
        st.opd=r;
        st.telehealth=!!r.telehealth;   // video visits: true only when the hospital saved a video server
        if(r.orgName) st.orgName=r.orgName;
        if(r.hasLogo!==undefined) st.hasLogo=!!r.hasLogo;
        renderNurseStation(r); consumePendingScan(); if(!st.pulse) loadPulse(); return;
      }
      if(r&&(r.error==="bad_response")&&tries<3){ setTimeout(function(){loadDash(tries+1);},700); return; }
      if(st.ownsOrg||(st.who&&st.who.role==="admin")) renderShell('<div class="empty">No rooms yet.<br>Tap <b>+ Clinic</b> to set up your clinic and rooms.</div>');
      else renderShell('<div class="empty">'+((r&&r.error==="forbidden"||r&&r.error==="not_a_member")?"You are not assigned to this clinic. Ask the owner to add you.":"No queue available yet.")+'</div>');
    }).catch(function(){ // transient network (weak WiFi): retry a few times before showing an error

  function mountOpdFlow(){

    flowUI.restore.forEach(function(x){if(x.anchor.parentNode)x.anchor.parentNode.replaceChild(x.node,x.anchor);});

      '<label class="opd-search"><span class="ms" aria-hidden="true">search</span><input id="opdPatientSearch" type="search" autocomplete="off" aria-label="Find patient by name, token or MRN" placeholder="Find patient, token or MRN"></label>'+

    board.innerHTML=stages.map(function(s){return '<section class="opd-lane" data-opd-lane="'+s[0]+'" aria-label="'+s[1]+'"><h2>'+s[1]+'<span class="opd-lane-count"></span></h2><p>'+s[2]+'</p><div class="opd-lane-cards"></div><div class="opd-lane-empty">No patients in this stage.</div></section>';}).join("");
    original.parentNode.insertBefore(board,original);
    var records={};
    function record(t,sid,room,doctor){records[(sid||"pool")+":"+t.id]={ticket:t,room:room,doctor:doctor};}
    if(st.opd){

    }else{(st.board||[]).forEach(function(b){(b.tickets||[]).forEach(function(t){record(t,b.session.id,"",docLabel(b.session.doctorUid,b.session.doctorName)||"Doctor");});});}
    Array.prototype.forEach.call(original.querySelectorAll(".pcard,.row"),function(node){
      var a=node.querySelector("[data-assign]"), action=node.querySelector("[data-t][data-s]")||node.querySelector("[data-t]");

      OFF._org=st.orgId; OFF._date=st.date;

        if(a==="send") offTick(); else if(a==="dismiss"){ d.dismiss(b.getAttribute("data-tok")); paintOffline(); } }; }

  function uploadLogo(file,name){
    var h={ "Content-Type": file.type||"application/octet-stream" };

    var doPost=function(){ return fetch("/api/queue/"+path,{method:"POST",headers:h,body:file}).then(function(r){return r.json().catch(function(){return {ok:false,error:"bad_response"};});}); };
    if(st.tokType==="firebase") return fbToken().then(function(t){ if(t) h["Authorization"]="Bearer "+t; return doPost(); });
    if(st.tok) h["X-Staff-Token"]=st.tok;
    return doPost();
  }

  // Lab-flow badges shared by both boards: a patient sent for tests reads "At Lab / Tests", and a
  // patient returned with results reads "Results Ready".
  function labBadges(t){
    var h="";
    if(t.status==="at_diagnostics") h+=' <span class="chip" style="background:#e0f2fe;color:#0369a1;font-size:11px;font-weight:700">At Lab / Tests</span>';
    if(t.priority===1) h+=' <span class="chip" style="background:#fef9c3;color:#854d0e;font-size:11px;font-weight:700">'+(t.priorityReason&&t.priorityReason!=="results"?esc(prioLabel(t)):"★ Results Ready")+'</span>';
    return h;
  }
  function ticketRow(s,t,i,n){
    var cls=t.priority>=2?"p2":(t.priority>=1?"p1":""); var consult=t.status==="in_consultation"; var atLab=t.status==="at_diagnostics";
    var eta=t.etaStart?Math.max(0,Math.round((t.etaStart-Date.now())/60000)):null;
    var b=[];
    if(!consult&&!atLab&&can("queue.status")) b.push('<button data-a="call" data-s="'+s.id+'" data-t="'+t.id+'">Call</button>');
    if(!consult&&!atLab&&can("queue.status")) b.push('<button class="pri" data-a="start" data-s="'+s.id+'" data-t="'+t.id+'">Start</button>');
    if(atLab&&can("queue.status")) b.push('<button class="pri" data-a="diagdone" data-s="'+s.id+'" data-t="'+t.id+'">Tests Done → Return</button>');
    if(t.status==="called"&&can("queue.status")) b.push('<button data-a="noshow" data-s="'+s.id+'" data-t="'+t.id+'" data-n="'+esc(t.name||"")+'">No-show</button>');
    if(!atLab&&can("queue.reorder")&&i>0) b.push('<button data-a="up" data-s="'+s.id+'" data-t="'+t.id+'" data-i="'+i+'">▲</button>');
    if(!atLab&&can("queue.reorder")&&i<n-1) b.push('<button data-a="down" data-s="'+s.id+'" data-t="'+t.id+'" data-i="'+i+'">▼</button>');
    if(!atLab&&can("queue.reorder")&&i>0) b.push('<button data-a="top" data-s="'+s.id+'" data-t="'+t.id+'">To #1</button>');
    if(can("queue.priority")) b.push('<button data-a="prio" data-s="'+s.id+'" data-t="'+t.id+'" data-p="'+(t.priority||0)+'">'+(t.priority?"Change priority":"Priority")+'</button>');
    if(!consult&&!atLab&&can("queue.assign")) b.push('<button data-a="assign" data-s="'+s.id+'" data-t="'+t.id+'">Move to doctor</button>');   // an in-consultation patient isn't queued -> assign always failed; hide it
    if(consult&&can("queue.status")) b.push('<button data-a="sendback" data-s="'+s.id+'" data-t="'+t.id+'">Send back</button>');   // reroute from the room back to the waiting hall (in_consultation -> waiting)
    if(consult&&can("queue.status")) b.push('<button data-a="senddiag" data-s="'+s.id+'" data-t="'+t.id+'">Send for Tests</button>');   // out to diagnostics (in_consultation -> at_diagnostics): frees the room for the next patient
    if(consult&&can("queue.status")) b.push('<button class="pri" data-a="checkout" data-s="'+s.id+'" data-t="'+t.id+'">Checkout <span class="ms sm">chevron_right</span></button>');
    b=b.concat(teleButtons(s,t));
    if(can("emr.vitals")) b.push('<button data-a="vitals" data-s="'+s.id+'" data-t="'+t.id+'" data-n="'+esc(t.name||"")+'">Vitals</button>');
    b.push('<button data-a="label" data-s="'+s.id+'" data-t="'+t.id+'">Label</button>');
    if(can("queue.status")) b.push('<button class="rm" data-a="remove" data-s="'+s.id+'" data-t="'+t.id+'" data-n="'+esc(t.name||"")+'">Remove</button>');
    var billLabel = (t.unbilledAmount > 0) ? ("Bill ₹" + Math.round(t.unbilledAmount / 100)) : "Bill";
    var billChip = (t.unbilledAmount > 0)
      ? ' <span class="chip" style="background:#fef3c7;color:#b45309;font-size:11px;font-weight:700">₹' + Math.round(t.unbilledAmount/100) + ' unbilled</span>'
      : (t.billingStatus === "paid"
        ? ' <span class="chip" style="background:#ecfdf5;color:#059669;font-size:11px;font-weight:700">Paid</span>'
        : ' <span class="chip" style="background:#f1f5f9;color:#64748b;font-size:11px">Unbilled</span>');
    var mrnVal = t.mrn || t.ghisPatientId || t.smdId || t.id || "";
    b.push('<button data-a="bill" data-t="' + t.id + '" data-smd="' + esc(mrnVal) + '" data-mrn="' + esc(mrnVal) + '" data-unbilled="' + (t.unbilledAmount||0) + '" data-name="' + esc(t.name||"Patient") + '"' + (t.unbilledAmount>0?' class="pri"':'') + '>' + billLabel + '</button>');
    return '<div class="row '+cls+'"><div class="top"><div class="pos'+(consult?" consult":"")+'">'+(consult?'<span class="ms sm">play_arrow</span>':(i+1))+'</div>'+
      '<div><div class="nm">'+tok(t)+esc(t.name||"Patient")+'<span class="mrn">#'+esc(t.mrnLast4||"")+'</span>'+teleChip(t)+billChip+labBadges(t)+'</div>'+
      '<div class="meta">'+(t.visitType==="followup"?"Follow-up":"New")+(eta!=null?" · ETA "+eta+"m":"")+'</div></div>'+
      '<div class="st">'+esc(t.status.replace(/_/g," "))+'</div></div>'+
      '<div class="acts">'+b.join("")+'</div></div>';
  }
  function wireRowActions(){
    Array.prototype.forEach.call(document.querySelectorAll(".acts [data-a]"),function(btn){
      btn.onclick=function(){
        var a=btn.getAttribute("data-a"), sid=btn.getAttribute("data-s"), tid=btn.getAttribute("data-t");
        if(a==="call") post("status",{sessionId:sid,ticketId:tid,status:"called"});
        else if(a==="start") post("status",{sessionId:sid,ticketId:tid,status:"in_consultation"});
        else if(a==="sendback") post("status",{sessionId:sid,ticketId:tid,status:"waiting"});
        else if(a==="senddiag") post("status",{sessionId:sid,ticketId:tid,status:"at_diagnostics"});
        // Tests done: back to the doctor's queue first, then flagged priority 1 so the row reads Results Ready.
        else if(a==="diagdone") post("status",{sessionId:sid,ticketId:tid,status:"waiting"},function(){ post("priority",{sessionId:sid,ticketId:tid,reason:"results"}); });
        else if(a==="noshow") openNoShowMark(sid,tid,btn.getAttribute("data-n"));
        else if(a==="prio") openPriority(sid,tid,+btn.getAttribute("data-p"));
        else if(a==="up") openMove(sid,tid,+btn.getAttribute("data-i")-1);
        else if(a==="down") openMove(sid,tid,+btn.getAttribute("data-i")+1);
        else if(a==="top") openMove(sid,tid,0);
        else if(a==="assign") openAssign(sid,tid);
        else if(a==="checkout") doCheckout(sid,tid);
        else if(a==="remove") openRemove(sid,tid,btn.getAttribute("data-n"));
        else if(a==="notes") openNotes(sid,tid,btn.getAttribute("data-n"));
        else if(a==="vitals") openVitals(sid,tid,btn.getAttribute("data-n"));
        else if(a==="label") openFileLabel(tid,sid);
        else if(a==="televisit") openTeleConsent(sid,tid,btn.getAttribute("data-n"));
        else if(a==="telestart") teleStart(sid,tid,btn);
        else if(a==="telelink") teleSendLink(sid,tid,btn);
        else if (a === "bill") {
          var mrn = btn.getAttribute("data-mrn") || btn.getAttribute("data-smd") || tid;
          var unbilledAmt = Number(btn.getAttribute("data-unbilled")) || 0;
          var ptName = btn.getAttribute("data-name") || "Patient";
          if (isWardSynQHospital()) {
            openWardSynqCashier(mrn);
          } else if (unbilledAmt > 0) {
            openQuickPay(mrn, tid, ptName, unbilledAmt);
          } else {
            var curOrg = st.orgId || st.hospital || "";
            location.href = "/clinic-billing?patientId=" + encodeURIComponent(mrn) + "&orgId=" + encodeURIComponent(curOrg) + "&ticketId=" + encodeURIComponent(tid);
          }
        }
      };
    });
  }
  // ---- VIDEO VISITS (server: functions/_telehealth.js, /api/queue/tele/*). Offered only when the hospital saved a
  // video server (opd-board / whoami say telehealth:true). A visit becomes a video visit only after the desk records
  // who agreed. The room address is never on the board: /tele/start hands it to the doctor who starts the call.
  var TELE_LIVE=["registered","waiting","called","in_consultation"];
  var TELE_GIVERS=[["patient","The patient"],["parent","A parent"],["legal-guardian","A legal guardian"],["next-of-kin","Next of kin"],["power-of-attorney","Power of attorney holder"]];
  // Nurse station: the flag stored from the last opd-board load (an assign-room reply's board may not carry it).
  // Legacy doctor board: whoami carries the same flag.
  function teleOn(){ return st.opd ? !!(st.telehealth||st.opd.telehealth) : !!(st.who&&st.who.telehealth); }
  function teleChip(t){ return t&&t.teleconsult?' <span class="chip tele-chip" title="Video visit">Video</span>':""; }
  function teleButtons(s,t){
    if(!teleOn()||!s||!s.id||!t||TELE_LIVE.indexOf(t.status)<0) return [];
    var nm=esc(t.name||"Patient"), at=' data-s="'+esc(s.id)+'" data-t="'+esc(t.id)+'" data-n="'+nm+'"', out=[];
    if(!t.teleconsult){
      if(can("queue.add")) out.push('<button type="button" class="tele" data-a="televisit"'+at+' aria-label="Video visit for '+nm+': record consent"><span class="ms sm" aria-hidden="true">videocam</span>Video visit</button>');
    } else if(can("queue.status")){
      out.push('<button type="button" class="tele pri" data-a="telestart"'+at+' aria-label="Start video call with '+nm+'"><span class="ms sm" aria-hidden="true">video_call</span>Start video</button>');
      out.push('<button type="button" class="tele" data-a="telelink"'+at+' aria-label="Send video link to '+nm+'"><span class="ms sm" aria-hidden="true">send_to_mobile</span>Send video link</button>');
    }
    return out;
  }
  function teleErr(r){
    var e=r&&r.error;
    var m={video_off:"Video visits are off for this hospital.",visit_closed:"This visit has ended, so the video call cannot be used.",not_teleconsult:"This is not a video visit yet. Record the consent first.",consent_required:"Tick that they agreed to a video consultation.",giver_required:"Pick who agreed.",unknown_giver:"Pick who agreed from the list."}[e];
    return m||(r&&r.message)||(e?friendly(e):"Action failed");
  }
  function openTeleConsent(sid,tid,name){
    var opts=TELE_GIVERS.map(function(g){return '<option value="'+g[0]+'">'+g[1]+'</option>';}).join("");
    open('<div class="tele-sheet"><h3>Video visit'+(name?' for '+esc(name):'')+'</h3>'+
      '<p style="color:var(--mut);margin:0 0 4px">Record the consent before this visit becomes a video consultation. It is kept in the audit trail.</p>'+
      '<label for="tgiv">Who agreed</label><select id="tgiv">'+opts+'</select>'+
      '<label class="agree" for="tagr"><input type="checkbox" id="tagr">They agreed to a video consultation</label>'+
      '<div class="row2"><button type="button" class="cancel" id="cx">Cancel</button><button type="button" class="btn" id="ok" style="margin:0" disabled>Save</button></div></div>');
    var agr=sheet.querySelector("#tagr"), ok=sheet.querySelector("#ok");
    agr.onchange=function(){ ok.disabled=!agr.checked; };
    sheet.querySelector("#cx").onclick=close;
    ok.onclick=function(){

  // ---- clinical notes drawer (READ-ONLY; staff can view + download, never edit) ----
  var NOTE_KIND={vitals:"Vitals",note:"Clinical note",assessment:"Assessment",meds:"Medication",order:"Investigation",checkout:"Visit closed"};
  // ---- vital signs from the WardSynQ clinical record ----------------------------------------
  // The timeline above is the visit's narrative. Where a clinic has opted its tenant in
  // (settings.wardsynq.migrations.vitals), the nurse's vitals ALSO land in the clinical record as
  // coded observations (LOINC, units as entered). This reads them back with the same credentials the
  // console already holds, through the record's own door, which decides who may see them. Nothing
  // here duplicates the timeline: the timeline keeps its text line, the record shows the values.
  var VITAL_LABEL={"8480-6":"BP",  "8462-4":"BP", "8867-4":"Pulse","8310-5":"Temp","59408-5":"SpO2","9279-1":"Resp","29463-7":"Weight"};
  var VITAL_ORDER=["bp","8867-4","8310-5","59408-5","9279-1","29463-7"];
  var VITAL_UNIT={"mm[Hg]":"mmHg","/min":"/min","[degF]":"°F","Cel":"°C","%":"%","kg":"kg"};
  // PURE. Observations -> sets of readings, one per recorded moment, newest first. Systolic and
  // diastolic pair into one "BP 142/91". `thisVisit` is set from the observation's source ticket.
  function vitalSets(observations,ticketId){
    var by={}, order=[];
    (observations||[]).forEach(function(o){
      if(!o||o.category!=="vital-signs"||typeof o.value!=="number") return;
      var at=(o.meta&&o.meta.effectiveAt)||(o.meta&&o.meta.recordedAt)||""; var src=(o.meta&&o.meta.source&&o.meta.source.sourceId)||"";
      var key=at+"|"+src; if(!by[key]){ by[key]={at:at,thisVisit:!!ticketId&&src==="opd-ticket:"+ticketId,values:{},note:o.sourceText||"",by:(o.writtenBy&&o.writtenBy.id)||""}; order.push(key); }
      var set=by[key];
      if(o.code==="8480-6"||o.code==="8462-4"){ set.values.bp=set.values.bp||{unit:o.unit}; set.values.bp[o.code==="8480-6"?"s":"d"]=o.value; }
      else set.values[o.code]={v:o.value,unit:o.unit};
      if(o.sourceText&&!set.note) set.note=o.sourceText;
    });
    return order.map(function(k){return by[k];}).sort(function(a,b){return String(b.at).localeCompare(String(a.at));});
  }
  function renderVitalSets(sets,fetchedAt){
    var when=function(iso){ var d=new Date(iso); return isNaN(d)?"":d.toLocaleString([],{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
    var cell=function(n,x,u){ return '<div class="vs-v"><span class="n">'+n+'</span><span class="x">'+esc(x)+(u?'<small>'+esc(u)+'</small>':'')+'</span></div>'; };
    var body=sets.slice(0,6).map(function(st){
      var v=st.values, cells=[];
      VITAL_ORDER.forEach(function(k){
        if(k==="bp"){ if(v.bp&&(v.bp.s!=null||v.bp.d!=null)) cells.push(cell("BP",(v.bp.s!=null?v.bp.s:"?")+"/"+(v.bp.d!=null?v.bp.d:"?"),VITAL_UNIT[v.bp.unit]||v.bp.unit||"")); }
        else if(v[k]) cells.push(cell(VITAL_LABEL[k]||k,String(v[k].v),VITAL_UNIT[v[k].unit]||v[k].unit||""));
      });
      return '<div class="vs-set"><div class="w"><b>'+when(st.at)+'</b>'+(st.thisVisit?'<span class="now">This visit</span>':'')+'</div><div class="vs-grid">'+cells.join("")+'</div>'+(st.note?'<div class="note">'+esc(st.note)+'</div>':'')+'</div>';
    }).join("");
    var more=sets.length>6?'<p class="st" style="margin:8px 0 0">'+(sets.length-6)+' earlier '+(sets.length-6===1?'set':'sets')+' of readings in the record.</p>':'';
    return '<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">Read from the clinical record'+(fetchedAt?' · '+when(fetchedAt):'')+'</p>'+body+more;
  }
  // The record's door answers for itself; each answer is a different sentence for the doctor.
  function recordVitalsBlock(rec,onDone){
    var box=document.createElement("div"); box.className="vs"; box.setAttribute("aria-live","polite");
    box.innerHTML='<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">Loading from the clinical record…</p>';
    if(!rec.patientId){ box.innerHTML='<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">This patient has no medical record number, so vitals cannot be filed in the clinical record for this visit.</p>'; onDone&&onDone(); return box; }
    var h={}; var url="/api/wardsynq/"+encodeURIComponent(rec.tenantId)+"/patient/"+encodeURIComponent(rec.patientId)+"/Observation";
    var go=function(){
      return fetch(url,{headers:h}).then(function(r){ return r.json().catch(function(){return null;}).then(function(j){ return {status:r.status,body:j}; }); })
        .then(function(x){
          var sets=(x.status===200&&x.body&&x.body.ok)?vitalSets(x.body.records,rec.ticketId):null;
          if(sets){ box.innerHTML=sets.length?renderVitalSets(sets,new Date().toISOString()):'<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">No vital signs in the clinical record for this patient yet. Nurse-recorded vitals appear here once saved.</p>'; }
          else if(x.status===403) box.innerHTML='<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">Your role cannot view the clinical record. The visit timeline above is still available.</p>';
          else if(x.status===401) box.innerHTML='<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">Sign in again to read the clinical record.</p>';
          else if(x.status===404) box.innerHTML='<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">The clinical record is not available for this clinic right now. The visit timeline above is unaffected.</p>';
          else box.innerHTML='<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">Could not reach the clinical record. Showing the visit timeline only; the values are safe in the record and will appear when it is reachable.</p>';
        })
        .catch(function(){ box.innerHTML='<h4>Vital signs<span class="src">Clinical record</span></h4><p class="st">Could not reach the clinical record. Showing the visit timeline only.</p>'; })
        .then(function(){ onDone&&onDone(); });
    };

  // ---- the doctor's assessment, from the WardSynQ clinical record --------------------------------
  // Same idea as vital signs above, reading the SAME generic record endpoint for a different
  // resource type. The note's four SOAP sections are what functions/_wardsynq/migrate-assessment.js

  // Save the notes locally as a plain-text file (no PHI ever leaves via a URL/log - a local Blob download).
  function downloadNotes(name,tl){
    var L=["StewardMD - Clinical notes","Patient: "+(name||"Patient")+(tl.mrnLast4?" (#"+tl.mrnLast4+")":""),"Clinic: "+(st.orgCode||st.orgId||""),"Downloaded: "+new Date().toLocaleString(),"------------------------------------------------------------",""];

    var currentDocName = st.doctorName || (st.who && st.who.doctorName) || meName() || "";
    open('<h3>Staff & roles</h3><div class="t" style="margin-bottom:10px">Clinic code (staff sign in with this): <b>'+esc(st.orgCode||st.orgId)+'</b></div>'+
      '<div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px">'+
        '<div style="font-weight:700;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px"><span class="ms sm">medical_services</span> Doctor & Clinic Admin Profile</div>'+
        '<div class="t" style="font-size:12px;margin-bottom:8px">When you are both clinic owner/admin and doctor, configure your display name and clinic name here.</div>'+
        '<label style="font-size:12px;color:var(--mut)">Doctor display name</label>'+
        '<input id="admDocName" value="'+esc(currentDocName)+'" placeholder="e.g. Dr. Manoj Kumar" style="margin-bottom:8px">'+
        '<label style="font-size:12px;color:var(--mut)">Clinic name</label>'+
        '<input id="admClinicName" value="'+esc(clinicName)+'" placeholder="e.g. Sunrise Clinic" style="margin-bottom:10px">'+
        '<button class="btn" id="saveAdmProfile" style="margin:0;width:auto;padding:8px 14px;font-size:13px">Save Doctor & Clinic Profile</button>'+
      '</div>'+
      '<div style="font-weight:700;font-size:13px;margin-bottom:6px">Staff Members</div>'+
      '<div id="slist">Loading…</div>'+
      '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'+
      '<div style="font-weight:700;font-size:13px;margin-bottom:8px">Invite Staff / Doctor</div>'+
      '<input id="sdn" placeholder="Full name (e.g. Dr. Rajesh Sharma or Nurse Priya)" style="margin-bottom:8px">'+
      '<input id="se" placeholder="Staff ID (e.g. recep1, or ghis:502862)" style="margin-bottom:8px">'+
      '<select id="sr" style="margin-bottom:8px">'+ROLES.map(function(r){return '<option value="'+r+'"'+(r==="nurse"?" selected":"")+'>'+r+'</option>';}).join("")+'</select>'+
      '<input id="spin" placeholder="Set a PIN (4-8 digits, e.g. 4826)" inputmode="numeric" style="margin-bottom:8px">'+
      '<input id="sem" placeholder="Email login (optional)" style="margin-bottom:6px">'+
      '<input id="spw" type="password" placeholder="Email password (if email set)">'+
      '<div class="row2"><button class="cancel" id="cx">Close</button><button class="btn" id="ok" style="margin:0">Invite / Save</button></div></div>');
    sheet.querySelector("#cx").onclick=close;
    var saveProfileBtn = sheet.querySelector("#saveAdmProfile");
    if(saveProfileBtn){
      saveProfileBtn.onclick = function(){
        var dn = sheet.querySelector("#admDocName").value.trim();
        var cn = sheet.querySelector("#admClinicName").value.trim();
        if(!dn && !cn){ toast("Enter doctor name or clinic name"); return; }
        saveProfileBtn.disabled = true;
        saveProfileBtn.textContent = "Saving…";
        api("org/update", { method: "POST", body: { orgId: st.orgId, doctorName: dn, name: cn } }).then(function(r){
          saveProfileBtn.disabled = false;
          saveProfileBtn.textContent = "Save Doctor & Clinic Profile";
          if(!r || !r.ok){ toast(r && r.error ? friendly(r.error) : "Failed to save profile"); return; }
          if(dn) { st.doctorName = dn; if(st.who) st.who.doctorName = dn; }
          if(cn) { st.orgName = cn; if(st.who) st.who.orgName = cn; }
          toast("Doctor and clinic profile updated");
          loadDash();
        }).catch(function(){
          saveProfileBtn.disabled = false;
          saveProfileBtn.textContent = "Save Doctor & Clinic Profile";
          toast("Could not reach the server");
        });
      };
    }
    sheet.querySelector("#ok").onclick=function(){
      var id=sheet.querySelector("#se").value.trim().toLowerCase(); if(!id){toast("Enter a staff ID");return;}   // lowercase so it matches the case-insensitive staff login
      var dn=sheet.querySelector("#sdn").value.trim();
      var role=sheet.querySelector("#sr").value, pin=sheet.querySelector("#spin").value.trim(), em=sheet.querySelector("#sem").value.trim(), pw=sheet.querySelector("#spw").value;
      if(pin && !/^\d{4,8}$/.test(pin)){toast("PIN must be 4 to 8 digits");return;}
      var mBody = { orgId: st.orgId, identity: id, role: role };
      if(dn) mBody.displayName = dn;
      api("member",{method:"POST",body:mBody}).then(function(r){
        if(!r||!r.ok){toast(r&&r.error?friendly(r.error):"Save failed");return;}
        // Each step's refusal stops the chain and is shown. This said "Saved" even when the PIN or
        // password had been refused, so staff were handed a sign-in that did not exist.
        var step=function(what,path,body){return function(){return api(path,{method:"POST",body:body}).then(function(x){ if(!x||!x.ok) throw new Error(what+" not set: "+((x&&(x.message||friendly(x.error)))||"no response")); });};};
        var chain=Promise.resolve();
        if(pin) chain=chain.then(step("PIN","member/pin",{orgId:st.orgId,identity:id,pin:pin}));
        if(em&&pw) chain=chain.then(step("Password","member/password",{orgId:st.orgId,identity:id,email:em,password:pw}));
        chain.then(function(){ toast("Saved"); loadStaffList(); ["sdn","se","spin","sem","spw"].forEach(function(x){var el=sheet.querySelector("#"+x);if(el)el.value="";}); })
          .catch(function(e){ loadStaffList(); toast(e.message); });
      });
    };
    loadStaffList();
  }
  function loadStaffList(){
    api("members?orgId="+encodeURIComponent(st.orgId)).then(function(r){
      var el=sheet.querySelector("#slist"); if(!el) return;
      var rows=(r&&r.members)||[];
      st.docMembers = rows;
      el.innerHTML=rows.length? rows.map(function(m){
        var login=(m.hasPin?"PIN":"")+(m.email?((m.hasPin?" + ":"")+"email"):""); if(!login) login="no login set";
        /* Why they cannot sign in, where the owner can fix it: five wrong PINs lock the account for
           fifteen minutes, and the sign-in page will not say so (it must not confirm which login names
           exist), so the owner otherwise hears "wrong PIN" for a PIN that is right. */
        var lockMin=m.lockedUntil&&m.lockedUntil>Date.now()?Math.ceil((m.lockedUntil-Date.now())/60000):0;
        if(lockMin) login="locked "+lockMin+"m (too many tries)";
        var nameDisp = m.displayName ? (esc(m.displayName) + ' <span class="t">(' + esc(m.identity) + ')</span>') : esc(m.identity);
        return '<div class="ev" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>'+nameDisp+'</b>'+(m.active?"":' <span class="t" style="color:var(--red)">(disabled)</span>')+'<div class="t">'+esc(m.role)+' · '+esc(login)+'</div></div>'+
          '<button class="cancel" data-tog="'+esc(m.identity)+'" data-act="'+(m.active?"disable":"restore")+'" style="padding:6px 10px">'+(m.active?"Disable":"Restore")+'</button></div>';
      }).join("") : '<div class="empty">No staff yet. Invite one below.</div>';
      Array.prototype.forEach.call(el.querySelectorAll("[data-tog]"),function(b){b.onclick=function(){
        api("member/"+b.getAttribute("data-act"),{method:"POST",body:{orgId:st.orgId,identity:b.getAttribute("data-tog")}}).then(function(){toast("Updated");loadStaffList();});
      };});
    });
  }

  // ---- AUTO-QUEUE CONSULTATION FEE (Pay First Flow) ----
  function autoQueueConsultationFee(patientId, ticketId, doctorId){
    var mode = (st.opd && st.opd.opdBillingMode) || "pay_first";
    if (mode !== "pay_first") return; // doctor_first mode doesn't queue upfront fee
    api("bill/tariff?orgId=" + encodeURIComponent(st.orgId)).then(function(r){
      if (!r || !r.ok || !r.items || !r.items.length) return;
      var items = r.items;
      var trf = (doctorId && items.find(function(x){ return x.kind === "consultation" && (x.doctorId === doctorId || (x.code && x.code.indexOf(doctorId) > -1)); })) ||
                items.find(function(x){ return x.kind === "consultation"; });
      if (trf) {
        api("bill/order", {
          method: "POST",
          body: { orgId: st.orgId, patientId: patientId, ticketId: ticketId, tariffId: trf.id, qty: 1 }
        }).then(function(){ refresh(); }).catch(function(){});
      }
    }).catch(function(){});
  }

  // ---- TARIFF, PHARMACY STOCK & OPD FLOW ADMIN ----
  function openTariffAdmin(initialTab){
    var activeTab = initialTab || 0;
    open('<h3>Price List, Pharmacy Stock & OPD Flow</h3>' +
      '<div class="t" style="margin-top:-6px;font-size:12.5px;color:var(--mut)">Configure doctor consultation fees, dispensary stock & procedures, and choose your billing workflow.</div>' +
      '<div class="ttabs">' +
        '<button class="ttab' + (activeTab===0?' active':'') + '" data-ttab="0"><span class="ms sm">medical_services</span> Doctor Fees</button>' +
        '<button class="ttab' + (activeTab===1?' active':'') + '" data-ttab="1"><span class="ms sm">medication</span> Pharmacy Stock</button>' +
        '<button class="ttab' + (activeTab===2?' active':'') + '" data-ttab="2"><span class="ms sm">biotech</span> Investigations</button>' +
        '<button class="ttab' + (activeTab===3?' active':'') + '" data-ttab="3"><span class="ms sm">swap_horiz</span> Billing Flow</button>' +
      '</div>' +
      '<div id="tAdminContent"><div class="empty">Loading clinic catalog…</div></div>' +
      '<div class="row2"><button class="cancel" id="cxTariff" style="margin:0">Close</button></div>', true);

    sheet.querySelector("#cxTariff").onclick = close;

    // ---- bulk CSV import (Pharmacy Stock + Investigations tabs) ----
    // Columns: Name,Kind,DosageForm,PriceRupees,Stock,Unit. A header row is recognised by a "name"
    // column; without one the columns are read in that fixed order. Each row is saved through the same
    // bill/tariff endpoint as the manual form, so validation + audit are identical.
    var CSV_KINDS = { medication: 1, investigation: 1, service: 1, consultation: 1 };
    function parseCsv(text){
      var rows = [], row = [], cur = "", q = false, i, c;
      for (i = 0; i < text.length; i++){
        c = text[i];
        if (q){
          if (c === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; }
          else cur += c;
        }
        else if (c === '"') q = true;
        else if (c === ","){ row.push(cur); cur = ""; }
        else if (c === "\n" || c === "\r"){
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(cur); cur = "";
          if (row.length > 1 || String(row[0]).trim() !== "") rows.push(row);
          row = [];
        }
        else cur += c;
      }
      row.push(cur);
      if (row.length > 1 || String(row[0]).trim() !== "") rows.push(row);
      return rows;
    }
    function csvTemplate(defaultKind){
      var k = defaultKind === "investigation" ? "investigation" : "medication";
      return "Name,Kind,DosageForm,PriceRupees,Stock,Unit\n" +
        (k === "medication"
          ? "Paracetamol 650mg,medication,Tab,30,100,Tab\nAmoxicillin 500mg,medication,Cap,80,50,Cap\n"
          : "CBC Blood Test,investigation,,250,,\nECG 12-Lead,investigation,,250,,\n");
    }
    function downloadCsvSample(defaultKind){
      var blob = new Blob([csvTemplate(defaultKind)], { type: "text/csv" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = defaultKind === "investigation" ? "investigations-template.csv" : "pharmacy-stock-template.csv";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    function runCsvImport(file, defaultKind, statusEl){
      var reader = new FileReader();
      reader.onload = function(){
        var rows;
        try { rows = parseCsv(String(reader.result || "")); }
        catch (e){ statusEl.textContent = "That file could not be read as CSV."; return; }
        if (!rows.length){ statusEl.textContent = "The file has no rows."; return; }
        var head = rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
        var hasHead = head.indexOf("name") > -1;
        var data = hasHead ? rows.slice(1) : rows;
        var col = function(r, name, pos){
          if (hasHead){ var i = head.indexOf(name); return i > -1 ? String(r[i] || "").trim() : ""; }
          return String(r[pos] != null ? r[pos] : "").trim();
        };
        var n = 0, ok = 0, skipped = 0;
        var next = function(){
          if (n >= data.length){
            statusEl.textContent = "Saved " + ok + " of " + data.length + " rows" + (skipped ? " (" + skipped + " skipped: no name or bad price)" : "") + ".";
            toast("CSV import: " + ok + " of " + data.length + " saved");
            reloadTariff();
            return;
          }
          var r = data[n]; n++;
          statusEl.textContent = "Saving row " + n + " of " + data.length + "...";
          var name = col(r, "name", 0);
          var kind = col(r, "kind", 1).toLowerCase();
          if (!CSV_KINDS[kind]) kind = defaultKind;
          var paise = Math.round(Number(col(r, "pricerupees", 3)) * 100);
          if (!name || !isFinite(paise) || paise < 0){ skipped++; next(); return; }
          api("bill/tariff", { method: "POST", body: {
            orgId: st.orgId, name: name, kind: kind,
            dosageForm: col(r, "dosageform", 2), unit: col(r, "unit", 5),
            price: paise, stock: Math.max(0, Math.round(Number(col(r, "stock", 4)) || 0))
          } }).then(function(x){ if (x && x.ok) ok++; else skipped++; next(); },
            function(){ skipped++; next(); });
        };
        next();
      };
      reader.readAsText(file);
    }
    function wireCsvImport(host, defaultKind){
      var sample = host.querySelector("#csvSample"), imp = host.querySelector("#csvImport"), file = host.querySelector("#csvFile");
      if (sample) sample.onclick = function(){ downloadCsvSample(defaultKind); };
      if (imp && file){
        imp.onclick = function(){ file.click(); };
        file.onchange = function(){
          var statusEl = host.querySelector("#csvStatus");
          if (!file.files || !file.files.length) return;
          if (statusEl) statusEl.textContent = "Reading " + file.files[0].name + "...";
          runCsvImport(file.files[0], defaultKind, statusEl || { textContent: "" });
          file.value = "";
        };
      }
    }
    function csvImportCard(){
      return '<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px">' +
        '<div style="font-weight:700;font-size:13px;margin-bottom:4px">Bulk Import via CSV</div>' +
        '<div style="font-size:12px;color:var(--mut);margin-bottom:10px">Columns: Name, Kind, DosageForm, PriceRupees, Stock, Unit. One item per row.</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn ghost" id="csvSample" style="margin:0;width:auto;padding:8px 14px;font-size:12.5px">Download Sample Template</button>' +
          '<button class="btn" id="csvImport" style="margin:0;width:auto;padding:8px 14px;font-size:12.5px">Import CSV</button>' +
          '<input type="file" id="csvFile" accept=".csv,text/csv" style="display:none">' +
        '</div>' +
        '<div id="csvStatus" style="font-size:12px;color:var(--mut);margin-top:8px"></div>' +
      '</div>';
    }

    function renderTab(){
      Array.prototype.forEach.call(sheet.querySelectorAll("[data-ttab]"), function(b){
        b.classList.toggle("active", Number(b.getAttribute("data-ttab")) === activeTab);
      });
      var host = sheet.querySelector("#tAdminContent");
      if (!host) return;

      var items = st.tariffItems || [];
      var curOrg = st.currentOrg || {};
      var defaultFee = curOrg.defaultConsultationFee || 0;

      if (activeTab === 0) {
        // Tab 0: Doctor Fees
        var docList = [{ id: meUid() || "owner", name: st.doctorName || (st.who && st.who.doctorName) || meName() || "Owner Doctor" }];
        (st.docMembers || []).forEach(function(m){
          if (m.role === "doctor" && m.identity !== docList[0].id) {
            docList.push({ id: m.identity, name: m.displayName || m.identity });
          }
        });

        var docRows = docList.map(function(doc){
          var curItem = items.find(function(t){
            return t.kind === "consultation" && (t.doctorId === doc.id || (doc.name && t.name && t.name.indexOf(doc.name) > -1));
          });
          var fee = curItem ? Math.round(curItem.price / 100) : (defaultFee ? Math.round(defaultFee / 100) : 500);
          return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card)">' +
            '<div><b>' + esc(withDr(doc.name) || "Doctor") + '</b><div style="font-size:11.5px;color:var(--mut)">' + esc(doc.id) + '</div></div>' +
            '<div style="display:flex;align-items:center;gap:6px">' +
              '<span style="font-weight:700">₹</span>' +
              '<input type="number" min="0" step="50" style="width:90px;padding:6px 8px;margin:0" value="' + fee + '" data-docfee-id="' + esc(doc.id) + '" data-docfee-name="' + esc(doc.name) + '" data-docfee-tid="' + esc(curItem ? curItem.id : "") + '">' +
              // OPD plan item 9: the follow-up fee (blank = same as a new visit). The free-review window is the hospital setting.
              '<input type="number" min="0" step="50" placeholder="Follow-up" title="Follow-up fee (blank = same as new)" style="width:90px;padding:6px 8px;margin:0 0 0 6px" value="' + (curItem && curItem.followupPrice != null ? Math.round(curItem.followupPrice / 100) : "") + '" data-docfee-fu="' + esc(doc.id) + '">' +
              '<button class="btn" style="margin:0;width:auto;padding:6px 12px;font-size:12px" data-save-docfee="' + esc(doc.id) + '">Save</button>' +
            '</div>' +
          '</div>';
        }).join("");

        host.innerHTML = '<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px">' +
          '<div style="font-weight:700;font-size:13px;margin-bottom:4px">Clinic Default Consultation Fee</div>' +
          '<div style="font-size:12px;color:var(--mut);margin-bottom:8px">Applied when no doctor-specific fee is found.</div>' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<span style="font-weight:700">₹</span>' +
            '<input id="defFeeInput" type="number" min="0" step="50" style="width:110px;margin:0" value="' + (defaultFee ? Math.round(defaultFee / 100) : 500) + '">' +
            '<button class="btn" id="saveDefFee" style="margin:0;width:auto;padding:8px 14px;font-size:12.5px">Save Default Fee</button>' +
          '</div>' +
        '</div>' +
        '<div style="font-weight:700;font-size:13px;margin-bottom:8px">Doctor-Specific Consultation Fees</div>' +
        docRows;

        var sDef = host.querySelector("#saveDefFee");
        if (sDef) {
          sDef.onclick = function(){
            var val = Math.round(Number(host.querySelector("#defFeeInput").value) * 100) || 0;
            sDef.disabled = true; sDef.textContent = "Saving…";
            api("org/update", { method: "POST", body: { orgId: st.orgId, defaultConsultationFee: val } }).then(function(r){
              sDef.disabled = false; sDef.textContent = "Save Default Fee";
              if (r && r.ok) {
                if (st.currentOrg) st.currentOrg.defaultConsultationFee = val;
                if (st.opd) st.opd.defaultConsultationFee = val;
                toast("Default consultation fee saved");
              } else toast("Failed to save default fee");
            });
          };
        }

        Array.prototype.forEach.call(host.querySelectorAll("[data-save-docfee]"), function(btn){
          btn.onclick = function(){
            var docId = btn.getAttribute("data-save-docfee");
            var inp = host.querySelector('[data-docfee-id="' + docId + '"]');
            var docName = inp.getAttribute("data-docfee-name") || "Doctor";

  // ---- NURSE STATION (unassigned pool -> assign to room -> room queue) ----
  var STATUS_LABEL={normal:"Normal",moderate:"Moderate",busy:"Busy",unavailable:"Doctor offline",available:"Available"};
  function waitMin(t){ return t.registeredAt?Math.max(0,Math.round((Date.now()-t.registeredAt)/60000)):0; }
  // GIMSR two-nurse central-routing control: LEFT = the routing inbox (unassigned pool nurses route from);
  // RIGHT = the room wall (each room's status + queue). Doctors see their room queue via the app.
  function renderNurseStation(bd){
    st.opd=bd; var pool=bd.pool||[], rooms=bd.rooms||[];
    var inRooms=0, consulting=0;
    rooms.forEach(function(rm){ inRooms+=rm.waiting||0; (rm.tickets||[]).forEach(function(t){ if(t.status==="in_consultation") consulting++; }); });
    // routing inbox
    var poolRows=pool.length? pool.map(function(t){ var w=waitMin(t), urg=t.priority>=2;
      var billLabel = (t.unbilledAmount > 0) ? ("Bill ₹" + Math.round(t.unbilledAmount / 100)) : "Bill";
      var billChip = (t.unbilledAmount > 0)
        ? ' <span class="chip" style="background:#fef3c7;color:#b45309;font-size:11px;font-weight:700">₹' + Math.round(t.unbilledAmount/100) + ' unbilled</span>'
        : (t.billingStatus === "paid"
          ? ' <span class="chip" style="background:#ecfdf5;color:#059669;font-size:11px;font-weight:700">Paid</span>'
          : ' <span class="chip" style="background:#f1f5f9;color:#64748b;font-size:11px">Unbilled</span>');
      var mrnVal = t.mrn || t.ghisPatientId || t.smdId || t.id || "";
      return '<div class="pcard'+(urg?" urg":"")+'"><div class="nm">'+tok(t)+esc(t.name||"Patient")+'<span class="mrn">#'+esc(t.mrnLast4||"")+'</span>'+(urg?' <span class="dept" style="background:var(--red-soft);color:var(--red)">URGENT</span>':'')+billChip+'</div>'+
        '<div style="margin:5px 0"><span class="dept">'+esc(t.department||"General")+'</span> <span class="wt'+(w>=15?" late":"")+'">waited '+w+'m</span></div>'+
        '<div class="acts" style="display:flex;gap:6px;margin-top:6px">'+
          (can("queue.assign")?'<button class="assignbtn" data-assign="'+esc(t.id)+'" style="flex:1;margin:0">Route to a room <span class="ms sm">chevron_right</span></button>':"")+
          '<button data-a="bill" data-t="'+t.id+'" data-smd="'+esc(mrnVal)+'" data-mrn="'+esc(mrnVal)+'" data-unbilled="'+(t.unbilledAmount||0)+'" data-name="'+esc(t.name||"Patient")+'"'+(t.unbilledAmount>0?' class="pri"':'')+' style="flex:none">'+billLabel+'</button>'+
        '</div></div>';
    }).join("") : '<div class="empty">No one waiting to be routed.'+(can("queue.add")?'<br>Tap <b>+ Walk-in</b> to register an arrival.':"")+'</div>';
    var poolPanel='<div class="pool"><h3>Central routing · '+pool.length+' waiting</h3><div class="rows">'+poolRows+'</div></div>';
    // room wall
    var wall=rooms.length? rooms.map(function(rm){ var s={id:rm.sessionId}, tickets=rm.tickets||[];
      var q=(rm.sessionId&&tickets.length)? tickets.map(function(t,i){return roomTicketRow(s,t,i,tickets.length);}).join("") : '<div class="empty" style="padding:18px 8px">'+(rm.doctorUid?"No patients":"No doctor - set one in Rooms")+'</div>';
      var pd=(rm.room.assignment&&rm.room.assignment.primary)||rm.doctorUid||"";
      var dName = rm.doctorName || (rm.room && rm.room.doctorName) || (rm.room && rm.room.assignment && rm.room.assignment.doctorName) || "";
      var doc=rm.doctorUid?(docLabel(pd,dName)||"Doctor"):"No doctor";
      return '<div class="rcard '+esc(rm.status)+'"><h3>'+esc(rm.room.name||"Room")+(rm.room.number?" · "+esc(rm.room.number):"")+'<span class="rstat '+esc(rm.status)+'">'+esc(STATUS_LABEL[rm.status]||rm.status)+'</span></h3>'+
        '<div class="docline"><span class="dot2'+(rm.doctorUid?" on":"")+'"></span>'+esc(doc)+' · '+rm.waiting+' waiting'+(rm.room.department?" · "+esc(rm.room.department):"")+'</div>'+
        '<div class="rows">'+q+'</div>'+
        (rm.sessionId?'<div style="padding:8px 12px;border-top:1px solid var(--line);text-align:right"><button class="ghost" data-audit="'+esc(rm.sessionId)+'" style="font-size:13px">Audit trail</button></div>':"")+'</div>';
    }).join("") : '<div class="empty">No rooms yet. Open <b>Rooms</b> to add consultation rooms + assign doctors.</div>';
    var totals='<div class="tot"><div class="kpi"><b>'+pool.length+'</b>To route</div><div class="kpi"><b>'+inRooms+'</b>In room queues</div><div class="kpi"><b>'+consulting+'</b>Consulting now</div></div>';
    renderShell(totals+'<div class="ctl">'+poolPanel+'<div class="wall">'+wall+'</div></div>');
    Array.prototype.forEach.call(document.querySelectorAll("[data-assign]"),function(b){b.onclick=function(){openAssignRoom(b.getAttribute("data-assign"));};});
    Array.prototype.forEach.call(document.querySelectorAll("[data-audit]"),function(b){b.onclick=function(){openAudit(b.getAttribute("data-audit"));};});
    wireRowActions();
    mountOpdFlow();

  // ---- FILE LABEL / STICKER + 1-TOUCH TAP-SCAN ---------------------------------------
  // Clinics paste a physical NFC tag onto the patient file and print the same UID as a Code128
  // barcode + QR on the label. This dialog prints/writes; the background listeners below route
  // a tap/scan to the right station with no typing. UID fields checked in order, MRN first.
  function findTicketByUid(uid){
    var key=String(uid==null?"":uid).trim(); if(!key) return null;
    // Universal Patient Identity: a QR/wedge scan may carry the full /opd deep link or a
    // prefixed id - reduce it to the canonical id before matching. Best-effort only.
    try{ if(window.StewardIdentityResolver&&StewardIdentityResolver.normalizeCarrierValue){ var nk=StewardIdentityResolver.normalizeCarrierValue(key); if(nk) key=nk; } }catch(e){}
    var up=key.toUpperCase();
    var same=function(v){ return v!=null&&v!==""&&(String(v)===key||String(v).toUpperCase()===up); };
    var hit=null, i, j;
    var consider=function(t,sid){
      if(hit||!t) return;
      if(same(t.stewardId)||same(t.mrn)||same(t.ghisPatientId)||same(t.smdId)||same(t.id)||same(t.token)) hit={t:t,sid:sid||null,tid:t.id};
    };
    for(i=0;i<(st.board||[]).length&&!hit;i++){ var b=st.board[i], ts=(b&&b.tickets)||[];
      for(j=0;j<ts.length&&!hit;j++) consider(ts[j],b.session&&b.session.id); }
    if(st.opd){
      var pool=st.opd.pool||[];
      for(j=0;j<pool.length&&!hit;j++) consider(pool[j],null);
      var rooms=st.opd.rooms||[];
      for(i=0;i<rooms.length&&!hit;i++){ var rt=(rooms[i]&&rooms[i].tickets)||[];
        for(j=0;j<rt.length&&!hit;j++) consider(rt[j],rooms[i]&&rooms[i].sessionId); }
    }
    return hit;
  }

  // Writes the UID onto a blank NFC tag held to the device. Plain-text payload: every phone
  // camera and wedge reader takes it with no app. Fails spoken, never silent.
  function writeNfcTag(uid){
    uid=String(uid==null?"":uid);
    if(!uid){ toast("Nothing to write."); return Promise.resolve(false); }
    var nfcMod = window.NiKey || window.SMD_NFC;
    // The desk just issued this carrier: register it so later taps in this session resolve
    // to this patient (and a later lost-tag report can revoke it). Best-effort only.
    var regCarrier=function(){ try{ if(window.StewardIdentityResolver&&StewardIdentityResolver.registerCarrier) StewardIdentityResolver.registerCarrier({patientId:uid,stewardId:uid,type:"nfc",value:uid,issuedBy:"frontdesk"}); }catch(e){} };
    if(nfcMod && nfcMod.isSupportedSync && nfcMod.isSupportedSync()){
      toast("Ni-Key: Hold an NFC tag to the device...");
      return nfcMod.writeTag(uid).then(function(){
        regCarrier();
        toast("Ni-Key tag written. Tap it to verify.");
        return true;
      }, function(e){
        toast("Could not write the Ni-Key tag"+(e&&e.message?": "+e.message:"")+". Try another tag.");
        return false;
      });
    }
    if(!("NDEFReader" in window)){ toast("Ni-Key NFC writing is not available on this device or browser."); return Promise.resolve(false); }
    try{
      var w=new NDEFReader();
      return w.write(uid).then(function(){ regCarrier(); toast("Ni-Key tag written. Tap it to verify."); return true; },
        function(e){ toast("Could not write the Ni-Key tag"+(e&&e.message?": "+e.message:"")+". Try another tag."); return false; });
    }catch(e){ toast("Could not write the Ni-Key tag."); return Promise.resolve(false); }
  }
  // Text out of an NDEF record. RTD-TEXT payloads open with a status byte + language code, so a
  // raw decode would hand routing "enSMD-..." - skip that prefix, then take the UID-shaped run.
  function nfcScanText(rec){
    try{
      var d=rec&&rec.data;
      if(typeof d==="string") return d.trim();
      var bytes=null;
      if(d instanceof DataView) bytes=new Uint8Array(d.buffer,d.byteOffset,d.byteLength);
      else if(d instanceof ArrayBuffer) bytes=new Uint8Array(d);
      if(!bytes||!bytes.length) return "";
      var off=0;
      if(rec.recordType==="text"||rec.recordType==="urn:nfc:wkt:T") off=1+(bytes[0]&63);
      var s="";
      try{ s=new TextDecoder().decode(bytes.subarray(off)); }
      catch(e){ s=String.fromCharCode.apply(null,Array.prototype.slice.call(bytes.subarray(off))); }
      var m=/[A-Za-z0-9][A-Za-z0-9\-_]{2,63}/.exec(s||"");
      return m?m[0]:"";
    }catch(e){ return ""; }
  }
  // Background NFC read: a tapped file tag routes with no typing. scan() without a gesture may
  // refuse on some browsers - that only means taps wait for a foreground write, never an error.
  var nfcListening=false;
  function startNfcListener(){
    if(nfcListening) return;
    if(window.SMD_NFC && window.SMD_NFC.isSupportedSync && window.SMD_NFC.isSupportedSync()){
      window.SMD_NFC.startScan(function(tag){
        var v=(tag&&(tag.text||tag.uid))||"";
        if(v) handleScannedUid(v);
      }).then(function(){ nfcListening=true; },function(){});
      return;
    }
    if(!("NDEFReader" in window)) return;
    try{
      var r=new NDEFReader();
      var p=r.scan();
      if(p&&p.then) p.then(function(){ nfcListening=true; },function(){});
      else nfcListening=true;
      r.onreading=function(ev){
        try{
          var recs=(ev&&ev.message&&ev.message.records)||[];
          for(var i=0;i<recs.length;i++){ var v=nfcScanText(recs[i]); if(v){ handleScannedUid(v); return; } }
        }catch(e){}
      };
    }catch(e){}
  }
  // Background wedge-scanner read: USB/Bluetooth scanners type fast (<45ms between keys) and end
  // with Enter. Keystrokes landing in a field belong to the field (the billing lookup's own Enter
  // already looks the patient up), so only body-level bursts count as scans.
  var scanBuf="", scanLast=0, scanTimer=null, scanListening=false;
  function startScannerListener(){
    if(scanListening) return; scanListening=true;
    document.addEventListener("keydown",function(e){
      try{
        if(!e||e.ctrlKey||e.metaKey||e.altKey) return;
        if(e.key==="Enter"){
          if(scanBuf.length>=3){ var v=scanBuf; scanBuf=""; handleScannedUid(v); e.preventDefault(); }
          else scanBuf="";
          return;
        }
        if(e.key&&e.key.length===1){
          var t=e.target, tag=t&&t.tagName;
          if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable)){ scanBuf=""; return; }
          var now=Date.now();
          if(now-scanLast>45) scanBuf="";
          scanLast=now; scanBuf+=e.key;
          if(scanBuf.length>80) scanBuf=scanBuf.slice(-80);
          if(scanTimer) clearTimeout(scanTimer);
          scanTimer=setTimeout(function(){ scanBuf=""; },150);
        }
      }catch(err){}
    });
  }

  // One tap/scan, routed by station: doctor gets the visit-aware action sheet (start the
  // consultation, open the chart, or start a linked follow-up), nurse opens vitals pre-linked
  // to the patient, pharmacy highlights the dispense row, cashier lands on the bill.
  function handleScannedUid(uid){
    uid=String(uid==null?"":uid).trim();

    // stops here with a spoken reason; anything unresolved falls back to the raw uid so

  function openPoolAdd(){
    // The SAME check-in sheet the phone app uses (patient-register.js). It replaced a three-field
    // sheet that captured no gender, age or date of birth - none of which ABDM can work without.
    // The server validates and issues the MR number; this only carries the answers.
    if(!(window.SMD_PATIENTREG&&SMD_PATIENTREG.open)){ toast("Patient check-in is unavailable."); return; }
    var mode=(st.opd&&st.opd.mode==="connect")?"connect":"native";
    // D7: the hospital's departments and token numbering first, so the desk picks the department the
    // token is numbered in. A failed load is said on the sheet (departments:null), never an empty list.
    api("org?orgId="+encodeURIComponent(st.orgId)).then(function(o){ return o&&o.ok?o:null; },function(){ return null; }).then(function(o){
      var perDept=!!(o&&o.org&&o.org.tokens&&o.org.tokens.scope==="department");
      SMD_PATIENTREG.open({
        mode: mode,
        clinicName: st.orgCode||"Check-in",
        departments: o?(o.departments||[]):null,
        departmentRequired: perDept,
        resolve: function(id){ return api("patient/resolve?orgId="+encodeURIComponent(st.orgId)+"&id="+encodeURIComponent(id)); },
        submit: function(b){ b.orgId=st.orgId; b.workplaceMode=mode; b.date=st.date; b.forQueue="pool"; return api("patient/register",{method:"POST",body:b}); },
        offline: function(sent){ var d=offDesk(); if(!d) return null; return d.issue(sent).then(function(r){ paintOffline(); return r; }); },
        printToken: function(o){ printTokenSlip(o); },
        onAdded: function(r,sent){
          // Registered -> into the central pool for routing (a one-room clinic auto-routes server-side).
          api("pool",{method:"POST",body:{orgId:st.orgId,name:(r.patient&&r.patient.name)||"",mobile:(r.patient&&r.patient.mobile)||"",
            mrn:r.mrn,visitType:(r.patient&&r.patient.visitType)==="followup"?"followup":"new",date:st.date,departmentId:(sent&&sent.departmentId)||""}})
            .then(function(q){
              // A refused queue add is never shown as added: the patient is registered but has no token.
              if(!q||!q.ok){ toast("Registered "+r.mrn+" but NOT queued: "+((q&&q.message)||(q&&q.error)||"no response")); refresh(); return; }
              toast("Added - "+r.mrn+(q.ticket&&q.ticket.token?" - token "+q.ticket.token:""));
              if(q.ticket) autoQueueConsultationFee(r.mrn, q.ticket.id, sent && sent.doctorId);
              refresh();
            },function(){ toast("Registered "+r.mrn+" but NOT queued: the server could not be reached."); });
        }
      });
    });

  // ---- ROOMS EDITOR (owner/admin): add rooms + assign/rotate doctors ----
  var ASSIGN_MODES=[["primary","One doctor"],["rotating","Rotating (multiple)"],["unassigned","No doctor (unassigned)"]];
  function meUid(){ try{ var a=fbAuth(); return (a&&a.currentUser&&a.currentUser.uid)||""; }catch(e){ return ""; } }
  function meName(){ try{ var u=fbAuth().currentUser; return (u&&u.displayName)||""; }catch(e){ return ""; } }
  function withDr(n){ n=String(n||"").trim(); return n?(/^dr\.?\s/i.test(n)?n:"Dr "+n):""; }
  function prettyLocal(e){ return String(e||"").split("@")[0].replace(/[._]+/g," ").replace(/\d+/g,"").trim().replace(/\b\w/g,function(c){return c.toUpperCase();}); }
  function normDocId(id){ return String(id||"").replace(/^(fb|cfa|ghis|uid):/i,"").trim(); }
  function isOpaqueId(v){
    var x = String(v||"").trim();
    return !x || /^(fb|cfa|ghis|uid):/i.test(x) || /^[a-z0-9_-]{16,}$/i.test(x);
  }
  // Friendly doctor label from a stored doctor id (Firebase uid for the account, or a member email for
  // invited doctors). Never surface the raw hex uid. Prefers the account display name for this device.
  function docLabel(pd,doctorName){
    if(!pd) return "";
    var currentUid = meUid();
    var isMe = currentUid && normDocId(pd) === normDocId(currentUid);
    if(doctorName && !isOpaqueId(doctorName) && doctorName.indexOf("@")===-1) {
      return withDr(doctorName);
    }
    if(isMe){
      var myDocName = st.doctorName || (st.who && st.who.doctorName) || meName() || (st.who && st.who.name && st.who.name !== "Doctor" ? st.who.name : "");
      if(myDocName && !isOpaqueId(myDocName)) return withDr(myDocName);
      return "Doctor (You)";
    }
    var npd = normDocId(pd);
    if(st.docMembers && st.docMembers.length){
      var m = st.docMembers.find(function(x){ return normDocId(x.identity) === npd; });
      if(m && m.displayName && !isOpaqueId(m.displayName)) return withDr(m.displayName);
    }
    if(pd.indexOf("@")>-1) return withDr(prettyLocal(pd));
    if(st.doctorName && !isOpaqueId(st.doctorName)) return withDr(st.doctorName);
    return "Doctor";
  }
  function doctorOptions(){ // "Me" (this account) + org members with role doctor
    var myName = st.doctorName || (st.who && st.who.doctorName) || meName() || "Me (this account)";
    var opts=[{id:meUid(),label:withDr(myName)||"Me (this account)"}];
    (st.docMembers||[]).forEach(function(m){
      if(m.role==="doctor") {
        var lbl = m.displayName ? (withDr(m.displayName) + " (" + m.identity + ")") : m.identity;
        opts.push({id:m.identity,label:lbl,name:m.displayName||""});
      }
    });
    return opts.filter(function(o){return o.id;});
  }
  function roomDoctorLabel(rm){
    var a=rm.assignment||{};
    var dn = rm.doctorName || a.doctorName || "";
    if(a.mode==="unassigned"||(!a.primary&&!(a.doctors||[]).length)) return "No doctor";
    if(a.mode==="rotating") return "Rotating ("+(a.doctors||[]).length+")";
    var d=a.primary||(a.doctors||[])[0]||"";
    return d?(docLabel(d, dn)||"Doctor"):"No doctor";
  }

  function open(html, wide){ if(wide) sheet.classList.add("wide"); else sheet.classList.remove("wide"); sheet.innerHTML=html; scrim.classList.add("on"); }

  // The shared check-in sheet (patient-register.js) offers a File Label button on its done card
  // only when this is present - the phone app has no label dialog, so it stays hidden there.
  try{ window.openFileLabel=openFileLabel; }catch(e){}

  // USB/Bluetooth wedge-scanner burst listener. Both no-op where unsupported.
  try{ startNfcListener(); }catch(e){}
  try{ startScannerListener(); }catch(e){}
  // Preview mode (?mock=1): render the central-routing control with sample data - no auth/network.
  // The admin capabilities below are COSMETIC: every request is authorised independently on the
  // server, so nothing here can read or write real data. A banner says so, because the Staff /
  // Rooms / Branding controls render in full and a staff member landing on this URL would
  // otherwise believe they had been given admin rights and report the failures as bugs.
  if(new URLSearchParams(location.search||"").get("mock")==="1"){

      pv.textContent="Preview with sample data - not your clinic. Nothing here is saved.";
      document.body.insertBefore(pv, document.body.firstChild); } catch(e){}
    var nm=Date.now();
    renderNurseStation({mode:"native",rooms:[
      {room:{id:"r1",name:"Medicine 1",number:"101",department:"General",assignment:{primary:"drA"}},doctorUid:"drA",sessionId:"s1",waiting:3,status:"moderate",tickets:[
        {id:"t1",name:"Ramesh Kumar",mrnLast4:"4821",status:"in_consultation",priority:0,registeredAt:nm-22*60000},
        {id:"t2",name:"Lakshmi Devi",mrnLast4:"7734",status:"called",priority:0,registeredAt:nm-14*60000},
        {id:"t3",name:"Abdul Rahman",mrnLast4:"1902",status:"waiting",priority:2,registeredAt:nm-30*60000}]},
      {room:{id:"r2",name:"Cardiology",number:"104",department:"Cardiology",assignment:{primary:"drB"}},doctorUid:"drB",sessionId:"s2",waiting:1,status:"normal",tickets:[
        {id:"t4",name:"Sita Mahalakshmi",mrnLast4:"5560",status:"waiting",priority:0,registeredAt:nm-6*60000}]},
      {room:{id:"r3",name:"Dermatology",number:"106",department:"Dermatology",assignment:{}},doctorUid:null,sessionId:null,waiting:0,status:"unavailable",tickets:[]}],
      pool:[
        {id:"p1",name:"John Peter",mrnLast4:"3341",department:"Cardiology",priority:0,registeredAt:nm-4*60000},
        {id:"p2",name:"Fatima Begum",mrnLast4:"9021",department:"General",priority:2,registeredAt:nm-18*60000},
        {id:"p3",name:"Vikram Rao",mrnLast4:"6655",department:"Dermatology",priority:0,registeredAt:nm-2*60000}]});
    consumePendingScan();
    return;
  }
  // Entry: a StewardMD account (Firebase) persists in the SDK; wait for it. Staff sessions use the stored token.
  if(st.tokType==="firebase"){ var a=fbAuth(); if(a){ a.onAuthStateChanged(function(u){ u?boot():renderLogin(); }); } else renderLogin("Account sign-in unavailable. Use PIN or email."); }
  else if(st.tok) boot(); else renderLogin();
})();
