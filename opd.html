<style>
  /* Self-hosted fonts (no CDN) + Material Symbols icon class */
  @font-face{font-family:'Inter Variable';font-style:normal;font-weight:100 900;font-display:swap;src:url(/assets/fonts/inter-variable.woff2) format('woff2')}
  @font-face{font-family:'Material Symbols Rounded';font-style:normal;font-weight:300 700;font-display:block;src:url(/assets/fonts/material-symbols-rounded.woff2) format('woff2')}
  .ms{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-size:18px;user-select:none;flex:none}
  .ms.sm{font-size:15px}.ms.lg{font-size:22px}

  :root{--tl:#0e6e63;--tl-d:#0b5c56;--tl-soft:#e3f1ee;
    --ink:#14202b;--mut:#5a7184;--line:#d7dee3;--bg:#f6f7f5;--card:#fff;--btn:#eef1f4;
    --amber:#92620a;--amber-soft:#fdf1dd;--amber-line:#f2d8a8;
    --red:#ab1c2c;--red-soft:#fbe9ea;--red-line:#f0c2c6;
    --ok:#1c7a4a;--ok-soft:#e2f2ea;--indigo:#3730a3;--indigo-soft:#eef2ff;--slate:#94a3b8;
    --r:14px;--sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);--sh-lg:0 12px 34px rgba(15,23,42,.20);
    --ease:cubic-bezier(.2,.7,.2,1);--dur:.5s}
  @media (prefers-color-scheme:dark){:root{--tl:#3fc7b3;--tl-d:#2fb3a0;--tl-soft:#0d2e2a;
    --ink:#eaf0f2;--mut:#a9bcc3;--line:#31424a;--bg:#0f1a1e;--card:#18242a;--btn:#223038;
    --amber:#e0a94a;--amber-soft:#2a2113;--amber-line:#5a4620;
    --red:#f0868f;--red-soft:#2c1518;--red-line:#5a2a30;
    --ok:#5bd08f;--ok-soft:#12261b;--indigo:#b9c0ff;--indigo-soft:#1c2140;--slate:#64748b;
    --sh:0 1px 3px rgba(0,0,0,.45);--sh-lg:0 12px 34px rgba(0,0,0,.55)}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:15px/1.45 'Inter Variable',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;transition:transform .12s var(--ease),background .15s,box-shadow .15s}
  button:active{transform:scale(.97)}
  input,select{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;width:100%;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{outline:0;border-color:var(--tl);box-shadow:0 0 0 3px var(--tl-soft)}
  .wrap{max-width:1200px;margin:0 auto;padding:16px}
  /* header */
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .brand{font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}.brand span{color:var(--tl)}
  .brand .mk{width:22px;height:22px;background:var(--tl);-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat;flex:none}
  .brand .clogo{height:24px;width:auto;max-width:130px;object-fit:contain}
  .role{margin-left:auto;font-size:13px;color:var(--mut);display:flex;gap:10px;align-items:center}
  .pw{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--mut)}
  .pw .m{width:13px;height:13px;background:var(--mut);-webkit-mask:url(/logo.png) center/contain no-repeat;mask:url(/logo.png) center/contain no-repeat}
  .chip{background:var(--tl-soft);color:var(--tl-d);padding:4px 10px;border-radius:999px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
  .ghost{background:var(--btn);color:var(--ink);padding:8px 12px}
  .ghost:hover{background:var(--line)}
  /* login */
  .login{max-width:380px;margin:8vh auto;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:26px;animation:rise .45s var(--ease) both}
  .login h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}.login p{margin:0 0 18px;color:var(--mut)}
  .login label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
  .btn{background:var(--tl);color:#fff;padding:13px 16px;font-weight:700;width:100%;margin-top:16px}
  .btn:hover{box-shadow:0 4px 14px var(--tl-soft)}
  .btn:active{background:var(--tl-d)}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
  .ltabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .lt{background:var(--btn);color:var(--mut);padding:7px 10px;font-size:12px;font-weight:700;border-radius:8px}
  .lt.on{background:var(--tl-soft);color:var(--tl-d)}
  /* clinic picker */
  .crow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);transition:box-shadow .15s,transform .15s}
  .crow:hover{box-shadow:var(--sh);transform:translateY(-1px)}
  .cinfo{flex:1;min-width:0}.cinfo b{display:block;font-size:16px;line-height:1.2}.cinfo .t{font-size:12px;color:var(--mut)}
  .cact{display:flex;gap:8px;flex-shrink:0}
  .cact .cbtn{width:auto;margin:0;padding:9px 16px}
  .cact .del{padding:9px 12px;color:var(--red);background:var(--red-soft)}
  /* board */
  .toolbar{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}
  .toolbar .grow{flex:1}
  .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .doc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s}
  .doc:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
  .doc>h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .doc>h2 small{margin-left:auto;font-weight:600;color:var(--mut);font-size:12px}
  .rows{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:60px}
  .empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .empty .ms{font-size:30px;color:var(--line)}
  .row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);transition:box-shadow .15s,border-color .15s}
  .row:hover{box-shadow:var(--sh)}
  .row.p2{border-color:var(--red-line);background:var(--red-soft)}.row.p1{border-color:var(--amber-line);background:var(--amber-soft)}
  .row .top{display:flex;align-items:center;gap:8px}
  .pos{width:26px;height:26px;border-radius:8px;background:var(--tl);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px;flex:none}
  .pos.consult{background:var(--ok)}
  .nm{font-weight:700}.mrn{color:var(--mut);font-weight:600;font-size:12px;margin-left:4px}
  .meta{color:var(--mut);font-size:12px;margin-top:2px}
  .st{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--tl-d);display:flex;align-items:center;gap:4px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .acts button{background:var(--btn);color:var(--ink);padding:8px 11px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px}
  .acts button:hover{background:var(--line)}
  .acts button.pri{background:var(--tl);color:#fff}
  .acts button.pri:hover{background:var(--tl-d)}
  .acts button.warn{background:var(--red-soft);color:var(--red)}
  .acts button.rm{background:var(--red-soft);color:var(--red)}
  .acts button.rm:hover{background:var(--red);color:#fff}
  .btn.danger{background:var(--red)}
  .btn.danger:hover{box-shadow:0 4px 14px rgba(171,28,44,.35)}
  /* modal (animated bottom sheet) */
  .scrim{position:fixed;inset:0;background:rgba(6,20,28,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility .28s}
  .scrim.on{opacity:1;visibility:visible}
  .sheet{background:var(--card);color:var(--ink);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px;max-height:88vh;overflow:auto;box-shadow:var(--sh-lg);transform:translateY(100%);transition:transform .32s var(--ease)}
  .scrim.on .sheet{transform:none}
  @media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px;transform:translateY(14px) scale(.98)}}
  .sheet h3{margin:0 0 12px}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .cats button{background:var(--btn);color:var(--ink);padding:9px 13px;font-weight:600;border:2px solid transparent}
  .cats button.on{border-color:var(--tl);background:var(--tl-soft);color:var(--tl-d)}
  .sheet .row2{display:flex;gap:10px;margin-top:16px}.sheet .row2 button{flex:1;padding:13px}
  .cancel{background:var(--btn);color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:10px;z-index:40;opacity:0;transition:.24s var(--ease);max-width:90%;box-shadow:var(--sh-lg)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .drawer{padding:6px 0}
  .ev{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-left:4px}
  .ev b{color:var(--ink)}.ev .t{color:var(--mut);font-size:12px}
  .link{word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
  /* skeleton shimmer for loading states */
  .skel{background:linear-gradient(90deg,var(--btn) 25%,var(--line) 37%,var(--btn) 63%);background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:10px}
  /* nurse station */
  .rstat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:999px;margin-left:auto}
  .rstat.normal{background:var(--ok-soft);color:var(--ok)}.rstat.moderate{background:var(--amber-soft);color:var(--amber)}
  .rstat.busy{background:var(--red-soft);color:var(--red)}.rstat.unavailable{background:var(--btn);color:var(--mut)}
  .poolwrap{background:var(--card);border:1px solid var(--tl);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
  .poolwrap>h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);background:var(--tl-soft)}
  .assignbtn{background:var(--tl);color:#fff;padding:9px 14px;font-weight:700;font-size:13px;margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:5px}
  .assignbtn:hover{background:var(--tl-d)}
  /* central-routing control (GIMSR two-nurse station): routing inbox + room wall */
  .tot{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tot .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 16px;box-shadow:var(--sh);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.02em;font-weight:700}
  .tot .kpi b{display:block;font-size:24px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .ctl{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
  @media(max-width:860px){.ctl{grid-template-columns:1fr}}
  .pool{background:var(--card);border:2px solid var(--tl);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  @media(min-width:861px){.pool{position:sticky;top:74px}}
  .pool>h3{margin:0;padding:13px 15px;font-size:15px;background:var(--tl-soft);color:var(--tl-d);border-bottom:1px solid var(--line)}
  .pool .rows{padding:8px;display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow:auto}
  .pcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);transition:box-shadow .15s}
  .pcard:hover{box-shadow:var(--sh)}
  .pcard.urg{border-color:var(--red-line);background:var(--red-soft)}
  .dept{display:inline-block;background:var(--indigo-soft);color:var(--indigo);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
  .wt{font-size:12px;color:var(--mut)} .wt.late{color:var(--red);font-weight:800}
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s}
  .rcard:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
  .rcard.busy{border-top:3px solid var(--red)} .rcard.moderate{border-top:3px solid var(--amber)} .rcard.normal{border-top:3px solid var(--ok)} .rcard.unavailable{border-top:3px solid var(--slate)}
  .rcard>h3{margin:0;padding:12px 14px;font-size:15px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .rcard .docline{padding:7px 14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);display:flex;gap:7px;align-items:center}
  .dot2{width:8px;height:8px;border-radius:50%;background:var(--slate);flex:none} .dot2.on{background:var(--ok)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var LS_TOK="smd_opd_staff_tok", LS_HOSP="smd_opd_hospital", LS_TT="smd_opd_toktype";
  // The clinic DAY is IST, not UTC. The session key bakes the date in (functions/_queue_engine.js
  // sessionId()), and the server computes it as now()+05:30 (opdDate). This page used to send
  // new Date().toISOString().slice(0,10) - a UTC day - so between 00:00 and 05:30 IST the console wrote
  // to YESTERDAY's session while the doctor's app read TODAY's, and console-added patients simply never
  // appeared. Same clinic, same room, different bucket.
  function istDay(){ return new Date(Date.now()+19800000).toISOString().slice(0,10); }
  var st={tok:localStorage.getItem(LS_TOK)||"", tokType:localStorage.getItem(LS_TT)||"", who:null, ownsOrg:false, orgCode:"", smdId:"", hospital:localStorage.getItem(LS_HOSP)||"manual", board:[], date:istDay()};
  var app=document.getElementById("app"), scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet"), toastEl=document.getElementById("toast");
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};
  var toast=function(m){toastEl.textContent=m;toastEl.classList.add("on");setTimeout(function(){toastEl.classList.remove("on");},2600);};
  function fbAuth(){ try{ return (window.firebase&&firebase.auth)?firebase.auth():null; }catch(e){ return null; } }
  function fbToken(){ var a=fbAuth(); var u=a&&a.currentUser; return (u&&u.getIdToken)?u.getIdToken().catch(function(){return "";}):Promise.resolve(""); }
  function api(path,opts){
    opts=opts||{}; var h=opts.headers||{}; h["Content-Type"]="application/json";
    var send=function(){ return fetch("/api/queue/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined}).then(function(r){return r.json().catch(function(){return {ok:false,error:"bad_response"};});}); };
    if(st.tokType==="firebase") return fbToken().then(function(t){ if(t) h["Authorization"]="Bearer "+t; return send(); });
    if(st.tok) h["X-Staff-Token"]=st.tok;   // GHIS token OR StewardMD staff session (server tries both)
    return send();
  }
  function can(cap){return st.who&&st.who.caps&&st.who.caps.indexOf(cap)>-1;}
  function onLogin(tokType,tok,orgId){ st.tokType=tokType; st.tok=tok||""; if(orgId){st.hospital=orgId;localStorage.setItem(LS_HOSP,orgId);} localStorage.setItem(LS_TT,tokType); if(tok)localStorage.setItem(LS_TOK,tok); else localStorage.removeItem(LS_TOK); boot(); }

  // ---- login: StewardMD account (owner/doctor) · Staff PIN · Staff email · GITAM/GHIS ----
  function renderLogin(msg,method){
    method=method||"staff";
    var tabs=[["account","Owner / Doctor"],["staff","Staff"],["ghis","GITAM / GHIS"]]
      .map(function(m){return '<button class="lt'+(m[0]===method?" on":"")+'" data-m="'+m[0]+'">'+m[1]+'</button>';}).join("");
    var form="";
    if(method==="account") form='<p>Clinic owner or doctor - your StewardMD account.</p><button class="btn" id="fbG" style="margin-top:0">Sign in with Google</button><div style="text-align:center;color:var(--mut);margin:12px 0;font-size:12px">or email + password</div><input id="fe" placeholder="Email" autocomplete="username" style="margin-bottom:8px"><input id="fp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" id="fbE">Sign in</button>';
    else if(method==="staff") form='<p>Front-desk / clinic staff sign-in.</p><label>Clinic code</label><input id="sorg" value="'+esc(st.orgCode||"")+'" placeholder="SMD-XXXXXX"><label>Staff ID or email</label><input id="sid" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label>PIN or password</label><input id="spw" type="password" autocomplete="current-password"><button class="btn" id="goStaff">Unlock</button><div style="margin-top:10px;color:var(--mut);font-size:12px">Use your <b>clinic code + staff ID + PIN</b>, or just your <b>email + password</b> (works from any device).</div>';
    else form='<p>GITAM (GIMSR) staff - sign in with your GHIS employee ID. This is the GITAM hospital queue.</p><label>Employee ID</label><input id="uid" inputmode="numeric" autocomplete="username"><label>Password</label><input id="pwd" type="password" autocomplete="current-password"><button class="btn" id="go">Sign in</button>';
    app.innerHTML='<div class="login"><h1>StewardMD <span style="color:var(--tl)">OPD</span></h1><div class="ltabs">'+tabs+'</div>'+form+'<div class="err" id="err">'+esc(msg||"")+'</div></div>';
    Array.prototype.forEach.call(app.querySelectorAll(".lt"),function(b){b.onclick=function(){renderLogin(null,b.getAttribute("data-m"));};});
    var $=function(id){return document.getElementById(id);};
    if($("goStaff")) $("goStaff").onclick=doStaffLogin;
    if($("go")) $("go").onclick=doGhisLogin;
    if($("fbG")) $("fbG").onclick=function(){doFirebase("google");};
    if($("fbE")) $("fbE").onclick=function(){doFirebase("email");};
  }
  function err(m){ var e=document.getElementById("err"); if(e) e.textContent=m; }
  // One staff sign-in for both PIN and email: an "@" in the ID -> email+password (any device, no clinic
  // code); otherwise clinic-code + staff-ID + PIN. Same two server endpoints, one merged form.
  function doStaffLogin(){
    var id=document.getElementById("sid").value.trim(), pw=document.getElementById("spw").value;
    if(!id||!pw){err("Enter your staff ID (or email) and PIN (or password).");return;}
    var isEmail=id.indexOf("@")>-1;
    id=id.toLowerCase();   // staff IDs + emails are case-insensitive; the doctor app stores them lowercase, and mobile keyboards auto-capitalize - so normalize to match
    if(!isEmail && !document.getElementById("sorg").value.trim()){err("Enter your clinic code (or sign in with your email).");return;}
    err("Signing in…");
    var url=isEmail?"/api/queue/auth/email":"/api/queue/auth/pin";
    var body=isEmail?{email:id,password:pw}:{clinicCode:document.getElementById("sorg").value.trim(),identity:id,pin:pw};
    fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(r){
      if(!r||!r.ok){ err(r&&r.error==="locked"?"Too many attempts. Try again later.":(r&&r.error==="staff_disabled"?"OPD access not enabled yet.":(isEmail?"Wrong email or password.":"Wrong clinic code, staff ID or PIN."))); return; }
      onLogin("staff",r.token,r.orgId);
    }).catch(function(){err("Could not reach the server.");});
  }
  function doGhisLogin(){
    var uid=document.getElementById("uid").value.trim(), pwd=document.getElementById("pwd").value, hosp="manual";   // GITAM (GHIS) is the hospital - no code to type
    if(!uid||!pwd){err("Enter your employee ID and password.");return;} err("Signing in…");
    fetch("/api/ghis/staff-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:uid,password:pwd})}).then(function(r){return r.json();}).then(function(r){

  // ---- boot: whoami then board ----
  function boot(){
    app.innerHTML='<div class="login"><p>Loading…</p></div>';
    api("whoami").then(function(r){
      if(!r||!r.ok){ if(r&&r.error==="unauthorized"){logout("Your session ended. Please sign in again.");return;} renderLogin("Session expired. Sign in again."); return; }
      st.who=r; st.smdId=r.smdId||""; st.billingOn=!!r.billing; if(r.orgId||r.hospitalId) st.hospital=r.orgId||r.hospitalId; st.orgId=r.orgId||r.hospitalId||st.hospital; st.orgCode=r.orgCode||"";
      // ANY StewardMD account can own a clinic. No clinic yet -> the create-clinic wizard (never a shared board).
      // A StewardMD account can own SEVERAL clinics: none -> wizard; one -> open it; many -> the picker.
      if(r.kind==="firebase"){ api("orgs").then(function(o){ var list=(o&&o.orgs)||[]; st.ownsOrg=true;
        if(!list.length){ openWizard(); return; }
        if(list.length===1){ openClinic(list[0]); return; }
        renderClinics(list);
      }); return; }
      // Station-bound roles open on their own station rather than the read-only queue board. Guarded on
      // the SERVER's billing switch: the station is inert unless CLINIC_BILLING_ENABLED=1, and redirecting
      // into a switched-off page left the cashier with nowhere to go at all - they could not fall back,
      // because the redirect fired first. When it is off, they stay here and are told why.
      var stationRole=st.who&&(st.who.role==="cashier"||st.who.role==="pharmacy");
      if(stationRole&&st.billingOn){ location.replace(st.who.role==="pharmacy"?"/clinic-billing?station=pharmacy":"/clinic-billing"); return; }
      if(stationRole&&!st.billingOn){ renderShell('<div class="empty">The billing and pharmacy station is not switched on for this clinic yet.<br>Ask the owner to enable it, then sign in again.</div>'); return; }
      loadDash();
    }).catch(function(){ renderLogin("Could not reach the server. Check your connection and try again."); });

  function loadDash(tries){
    tries=tries||0;

      if(r&&r.ok){ st.opd=r; renderNurseStation(r); return; }   // org-scoped board only; NO shared legacy board
      if(r&&(r.error==="bad_response")&&tries<3){ setTimeout(function(){loadDash(tries+1);},700); return; }
      if(st.ownsOrg||(st.who&&st.who.role==="admin")) renderShell('<div class="empty">No rooms yet.<br>Tap <b>+ Clinic</b> to set up your clinic and rooms.</div>');

    }).catch(function(){ // transient network (weak WiFi): retry a few times before showing an error
      if(tries<3){ if(!document.querySelector(".ctl")) app.innerHTML='<div class="login"><p>Loading your queue… (retrying)</p></div>'; setTimeout(function(){loadDash(tries+1);},800); return; }

    });

  // Pro white-label: upload the clinic's own logo (shown on the patient page, wall board + FollowCare).

  function uploadLogo(file,name){
    var h={ "Content-Type": file.type||"application/octet-stream" };
    var path="branding?orgId="+encodeURIComponent(st.orgId)+"&name="+encodeURIComponent(name||"");
    var doPost=function(){ return fetch("/api/queue/"+path,{method:"POST",headers:h,body:file}).then(function(r){return r.json().catch(function(){return {ok:false,error:"bad_response"};});}); };
    if(st.tokType==="firebase") return fbToken().then(function(t){ if(t) h["Authorization"]="Bearer "+t; return doPost(); });
    if(st.tok) h["X-Staff-Token"]=st.tok;
    return doPost();
  }
  function renderBoard(){
    if(!st.board.length){ renderShell('<div class="empty">No OPD queues yet for today.<br>Patients auto-import from GHIS once doctors sign in, or add a walk-in.</div>'); return; }
    var docs=st.board.map(function(b){
      var s=b.session, tickets=(b.tickets||[]).filter(function(t){return ["registered","waiting","called","in_consultation"].indexOf(t.status)>-1;});
      var rows=tickets.length? tickets.map(function(t,i){return ticketRow(s,t,i,tickets.length);}).join("") : '<div class="empty">No patients waiting</div>';
      return '<div class="doc"><h2>'+esc(s.doctorName||s.doctorUid||"Doctor")+'<small>'+tickets.length+' in queue</small></h2>'+
        '<div class="rows">'+rows+'</div>'+
        '<div style="padding:8px 12px;border-top:1px solid var(--line);text-align:right">'+
          '<button class="ghost" data-audit="'+esc(s.id)+'" style="font-size:13px">View audit trail</button></div></div>';
    }).join("");
    renderShell('<div class="docs">'+docs+'</div>');
    Array.prototype.forEach.call(document.querySelectorAll("[data-audit]"),function(b){b.onclick=function(){openAudit(b.getAttribute("data-audit"));};});
    wireRowActions();
  }
  function ticketRow(s,t,i,n){
    var cls=t.priority>=2?"p2":(t.priority>=1?"p1":""); var consult=t.status==="in_consultation";
    var eta=t.etaStart?Math.max(0,Math.round((t.etaStart-Date.now())/60000)):null;
    var b=[];
    if(!consult&&can("queue.status")) b.push('<button data-a="call" data-s="'+s.id+'" data-t="'+t.id+'">Call</button>');
    if(!consult&&can("queue.status")) b.push('<button class="pri" data-a="start" data-s="'+s.id+'" data-t="'+t.id+'">Start</button>');
    if(can("queue.reorder")&&i>0) b.push('<button data-a="up" data-s="'+s.id+'" data-t="'+t.id+'" data-i="'+i+'">▲</button>');
    if(can("queue.reorder")&&i<n-1) b.push('<button data-a="down" data-s="'+s.id+'" data-t="'+t.id+'" data-i="'+i+'">▼</button>');
    if(can("queue.reorder")&&i>0) b.push('<button data-a="top" data-s="'+s.id+'" data-t="'+t.id+'">To #1</button>');
    if(can("queue.priority")) b.push('<button data-a="prio" data-s="'+s.id+'" data-t="'+t.id+'" data-p="'+(t.priority>=2?0:2)+'">'+(t.priority>=2?"Clear urgent":"Urgent")+'</button>');
    if(!consult&&can("queue.assign")) b.push('<button data-a="assign" data-s="'+s.id+'" data-t="'+t.id+'">Move to doctor</button>');   // an in-consultation patient isn't queued -> assign always failed; hide it
    if(consult&&can("queue.status")) b.push('<button data-a="sendback" data-s="'+s.id+'" data-t="'+t.id+'">Send back</button>');   // reroute from the room back to the waiting hall (in_consultation -> waiting)
    if(consult&&can("queue.status")) b.push('<button class="pri" data-a="checkout" data-s="'+s.id+'" data-t="'+t.id+'">Checkout <span class="ms sm">chevron_right</span></button>');
    // Remove a mistaken / duplicate / wrongly-routed patient (soft cancel → off the board, audit kept).
    if(can("emr.vitals")) b.push('<button data-a="vitals" data-s="'+s.id+'" data-t="'+t.id+'" data-n="'+esc(t.name||"")+'">Vitals</button>');   // nurse records BP/temp/SpO2 etc. onto the encounter timeline
    if(can("queue.status")) b.push('<button class="rm" data-a="remove" data-s="'+s.id+'" data-t="'+t.id+'" data-n="'+esc(t.name||"")+'">Remove</button>');
    return '<div class="row '+cls+'"><div class="top"><div class="pos'+(consult?" consult":"")+'">'+(consult?'<span class="ms sm">play_arrow</span>':(i+1))+'</div>'+
      '<div><div class="nm">'+esc(t.name||"Patient")+'<span class="mrn">#'+esc(t.mrnLast4||"")+'</span></div>'+
      '<div class="meta">'+(t.visitType==="followup"?"Follow-up":"New")+(eta!=null?" · ETA "+eta+"m":"")+'</div></div>'+
      '<div class="st">'+esc(t.status.replace(/_/g," "))+'</div></div>'+
      '<div class="acts">'+b.join("")+'</div></div>';
  }
  function wireRowActions(){
    Array.prototype.forEach.call(document.querySelectorAll(".acts [data-a]"),function(btn){
      btn.onclick=function(){
        var a=btn.getAttribute("data-a"), sid=btn.getAttribute("data-s"), tid=btn.getAttribute("data-t");
        if(a==="call") post("status",{sessionId:sid,ticketId:tid,status:"called"});
        else if(a==="start") post("status",{sessionId:sid,ticketId:tid,status:"in_consultation"});
        else if(a==="sendback") post("status",{sessionId:sid,ticketId:tid,status:"waiting"});
        else if(a==="prio") post("priority",{sessionId:sid,ticketId:tid,priority:+btn.getAttribute("data-p")});
        else if(a==="up") openMove(sid,tid,+btn.getAttribute("data-i")-1);
        else if(a==="down") openMove(sid,tid,+btn.getAttribute("data-i")+1);
        else if(a==="top") openMove(sid,tid,0);
        else if(a==="assign") openAssign(sid,tid);
        else if(a==="checkout") doCheckout(sid,tid);
        else if(a==="remove") openRemove(sid,tid,btn.getAttribute("data-n"));
        else if(a==="notes") openNotes(sid,tid,btn.getAttribute("data-n"));
        else if(a==="vitals") openVitals(sid,tid,btn.getAttribute("data-n"));
      };
    });
  }
  function post(seg,body,after){ api(seg,{method:"POST",body:body}).then(function(r){ if(!r||!r.ok){toast(r&&r.error?friendly(r.error):"Action failed");return;} (after||refresh)(r); }); }

  // ---- checkout ----
  function doCheckout(sid,tid){
    if(!confirm("Check out this patient? The visit will be closed and the next patient called.")) return;
    api("checkout",{method:"POST",body:{sessionId:sid,ticketId:tid}}).then(function(r){
      if(!r||!r.ok){toast(r&&r.error?friendly(r.error):"Checkout failed");return;}
      refresh();
      if(r.timelineUrl){ open('<h3>Patient checked out</h3><p style="color:var(--mut)">'+(r.sent?"Timeline sent to the patient on WhatsApp.":"Share this visit summary (valid 7 days):")+'</p><div class="link">'+esc(r.timelineUrl)+'</div><div class="row2"><button class="btn" id="cx" style="margin:0">Done</button></div>'); sheet.querySelector("#cx").onclick=close; }
    });
  }
  // ---- audit drawer ----
  function openAudit(sid){
    open('<h3>Audit trail</h3><div class="drawer" id="ad">Loading…</div><div class="row2"><button class="cancel" id="cx" style="margin:0">Close</button></div>');
    sheet.querySelector("#cx").onclick=close;
    api("audit?sessionId="+encodeURIComponent(sid)).then(function(r){
      var el=sheet.querySelector("#ad"); if(!el) return;
      if(!r||!r.ok||!r.events||!r.events.length){ el.innerHTML='<div class="empty">No recorded actions yet.</div>'; return; }
      el.innerHTML=r.events.map(function(e){
        var m=e.meta; try{ var j=JSON.parse(e.meta); if(j.from&&j.to) m="#"+j.from+" → #"+j.to+(j.category?" ("+j.category+")":"")+(j.reason?" - "+j.reason:""); else if(j.toDoctor) m="reassigned to "+j.toDoctor+(j.reason?" - "+j.reason:""); }catch(_){}
        var when=new Date(e.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
        return '<div class="ev"><div><b>'+esc(e.action)+'</b> · '+esc(e.mrnLast4?("#"+e.mrnLast4):"")+' <span class="t">'+when+' · '+esc(e.actor)+'</span></div><div class="t">'+esc(m)+'</div></div>';
      }).join("");

  // ---- clinical notes drawer (READ-ONLY; staff can view + download, never edit) ----
  var NOTE_KIND={vitals:"Vitals",note:"Clinical note",assessment:"Assessment",meds:"Medication",order:"Investigation",checkout:"Visit closed"};
  function openNotes(sid,tid,name){
    open('<h3>Clinical notes'+(name?' - '+esc(name):'')+'</h3><p class="t" style="margin:-6px 0 10px">View only. Doctors record notes; you can read and download.</p><div class="drawer" id="nd">Loading…</div><div class="row2"><button class="cancel" id="cx">Close</button><button class="btn" id="dl" style="margin:0" disabled>Download</button></div>');
    sheet.querySelector("#cx").onclick=close;
    var show=function(r){
      var el=sheet.querySelector("#nd"); if(!el) return;
      if(!r||!r.ok){ el.innerHTML='<div class="empty">'+((r&&(r.error==="forbidden"||r.error==="out_of_scope"))?"You don't have permission to view these notes.":"Could not load the notes.")+'</div>'; return; }
      var tl=r.timeline||{}, entries=tl.entries||[];
      if(!entries.length){ el.innerHTML='<div class="empty">No clinical notes recorded for this visit yet.</div>'; return; }
      el.innerHTML=entries.map(function(e){
        var when=new Date(e.ts).toLocaleString([],{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
        return '<div class="ev"><div><b>'+esc(NOTE_KIND[e.kind]||e.kind||"Note")+'</b> <span class="t">'+when+(e.by?" · "+esc(e.by):"")+'</span></div><div style="white-space:pre-wrap;margin-top:2px">'+esc(e.text||"")+'</div></div>';
      }).join("");
      var dl=sheet.querySelector("#dl"); if(dl){ dl.disabled=false; dl.onclick=function(){ downloadNotes(name,tl); }; }
    };
    if(st.orgId==="demo"){ var n=Date.now(); show({ok:true,timeline:{mrnLast4:"4821",entries:[
      {ts:n-40*60000,kind:"vitals",by:"Sister Anu",text:"BP 128/82 · Temp 98.4°F · SpO2 98% · Pulse 78/min"},
      {ts:n-32*60000,kind:"assessment",by:"Dr Manoj",text:"C/o epigastric pain 3 days, worse after meals. No alarm features. Likely GERD."},
      {ts:n-30*60000,kind:"order",by:"Dr Manoj",text:"CBC, LFT, USG abdomen"},
      {ts:n-28*60000,kind:"meds",by:"Dr Manoj",text:"Pantoprazole 40mg OD x 2 weeks; antacid syrup PRN"}
    ]}}); return; }
    api("timeline?sessionId="+encodeURIComponent(sid)+"&ticketId="+encodeURIComponent(tid)).then(show);
  }
  // Save the notes locally as a plain-text file (no PHI ever leaves via a URL/log - a local Blob download).
  function downloadNotes(name,tl){
    var L=["StewardMD - Clinical notes","Patient: "+(name||"Patient")+(tl.mrnLast4?" (#"+tl.mrnLast4+")":""),"Clinic: "+(st.orgCode||st.orgId||""),"Downloaded: "+new Date().toLocaleString(),"------------------------------------------------------------",""];
    (tl.entries||[]).forEach(function(e){
      L.push("["+new Date(e.ts).toLocaleString()+"] "+(NOTE_KIND[e.kind]||e.kind||"Note")+(e.by?" · "+e.by:""));
      L.push(String(e.text||"").trim()); L.push("");
    });
    var blob=new Blob([L.join("\n")],{type:"text/plain;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="notes-"+String(name||"patient").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".txt";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(a.href);}catch(e){} a.remove(); },200);
    try{ toast("Notes downloaded"); }catch(e){}
  }

    sheet.querySelector("#ok").onclick=function(){

  // ---- NURSE STATION (unassigned pool -> assign to room -> room queue) ----
  var STATUS_LABEL={normal:"Normal",moderate:"Moderate",busy:"Busy",unavailable:"Doctor offline",available:"Available"};
  function waitMin(t){ return t.registeredAt?Math.max(0,Math.round((Date.now()-t.registeredAt)/60000)):0; }
  // GIMSR two-nurse central-routing control: LEFT = the routing inbox (unassigned pool nurses route from);
  // RIGHT = the room wall (each room's status + queue). Doctors see their room queue via the app.
  function renderNurseStation(bd){
    st.opd=bd; var pool=bd.pool||[], rooms=bd.rooms||[];
    var inRooms=0, consulting=0;
    rooms.forEach(function(rm){ inRooms+=rm.waiting||0; (rm.tickets||[]).forEach(function(t){ if(t.status==="in_consultation") consulting++; }); });
    // routing inbox
    var poolRows=pool.length? pool.map(function(t){ var w=waitMin(t), urg=t.priority>=2;
      return '<div class="pcard'+(urg?" urg":"")+'"><div class="nm">'+esc(t.name||"Patient")+'<span class="mrn">#'+esc(t.mrnLast4||"")+'</span>'+(urg?' <span class="dept" style="background:var(--red-soft);color:var(--red)">URGENT</span>':'')+'</div>'+
        '<div style="margin:5px 0"><span class="dept">'+esc(t.department||"General")+'</span> <span class="wt'+(w>=15?" late":"")+'">waited '+w+'m</span></div>'+
        (can("queue.assign")?'<button class="assignbtn" data-assign="'+esc(t.id)+'" style="width:100%;margin-left:0;margin-top:4px">Route to a room <span class="ms sm">chevron_right</span></button>':"")+'</div>';
    }).join("") : '<div class="empty">No one waiting to be routed.'+(can("queue.add")?'<br>Tap <b>+ Walk-in</b> to register an arrival.':"")+'</div>';
    var poolPanel='<div class="pool"><h3>Central routing · '+pool.length+' waiting</h3><div class="rows">'+poolRows+'</div></div>';
    // room wall
    var wall=rooms.length? rooms.map(function(rm){ var s={id:rm.sessionId}, tickets=rm.tickets||[];
      var q=(rm.sessionId&&tickets.length)? tickets.map(function(t,i){return roomTicketRow(s,t,i,tickets.length);}).join("") : '<div class="empty" style="padding:18px 8px">'+(rm.doctorUid?"No patients":"No doctor - set one in Rooms")+'</div>';
      var pd=(rm.room.assignment&&rm.room.assignment.primary)||rm.doctorUid||"";
      var doc=rm.doctorUid?(docLabel(pd,rm.doctorName)||"Doctor"):"No doctor";
      return '<div class="rcard '+esc(rm.status)+'"><h3>'+esc(rm.room.name||"Room")+(rm.room.number?" · "+esc(rm.room.number):"")+'<span class="rstat '+esc(rm.status)+'">'+esc(STATUS_LABEL[rm.status]||rm.status)+'</span></h3>'+
        '<div class="docline"><span class="dot2'+(rm.doctorUid?" on":"")+'"></span>'+esc(doc)+' · '+rm.waiting+' waiting'+(rm.room.department?" · "+esc(rm.room.department):"")+'</div>'+
        '<div class="rows">'+q+'</div>'+
        (rm.sessionId?'<div style="padding:8px 12px;border-top:1px solid var(--line);text-align:right"><button class="ghost" data-audit="'+esc(rm.sessionId)+'" style="font-size:13px">Audit trail</button></div>':"")+'</div>';
    }).join("") : '<div class="empty">No rooms yet. Open <b>Rooms</b> to add consultation rooms + assign doctors.</div>';
    var totals='<div class="tot"><div class="kpi"><b>'+pool.length+'</b>To route</div><div class="kpi"><b>'+inRooms+'</b>In room queues</div><div class="kpi"><b>'+consulting+'</b>Consulting now</div></div>';
    renderShell(totals+'<div class="ctl">'+poolPanel+'<div class="wall">'+wall+'</div></div>');
    Array.prototype.forEach.call(document.querySelectorAll("[data-assign]"),function(b){b.onclick=function(){openAssignRoom(b.getAttribute("data-assign"));};});
    Array.prototype.forEach.call(document.querySelectorAll("[data-audit]"),function(b){b.onclick=function(){openAudit(b.getAttribute("data-audit"));};});
    wireRowActions();
  }
  function roomTicketRow(s,t,i,n){
    var consult=t.status==="in_consultation"; var cls=t.priority>=2?"p2":(t.priority>=1?"p1":"");
    var b=[];
    if(!consult&&can("queue.status")){ b.push('<button data-a="call" data-s="'+s.id+'" data-t="'+t.id+'">Call</button>'); b.push('<button class="pri" data-a="start" data-s="'+s.id+'" data-t="'+t.id+'">Start</button>'); }
    if(can("queue.reorder")&&i>0) b.push('<button data-a="top" data-s="'+s.id+'" data-t="'+t.id+'">To #1</button>');
    if(can("queue.priority")) b.push('<button data-a="prio" data-s="'+s.id+'" data-t="'+t.id+'" data-p="'+(t.priority>=2?0:2)+'">'+(t.priority>=2?"Clear":"Urgent")+'</button>');
    if(consult&&can("queue.status")) b.push('<button data-a="sendback" data-s="'+s.id+'" data-t="'+t.id+'">Send back</button>');   // room -> waiting hall (in_consultation -> waiting)
    if(consult&&can("queue.status")) b.push('<button class="pri" data-a="checkout" data-s="'+s.id+'" data-t="'+t.id+'">Checkout</button>');
    if(can("emr.vitals")) b.push('<button data-a="vitals" data-s="'+s.id+'" data-t="'+t.id+'" data-n="'+esc(t.name||"Patient")+'">Vitals</button>');   // nurse records vitals onto the timeline
    if(can("emr.view")) b.push('<button data-a="notes" data-s="'+s.id+'" data-t="'+t.id+'" data-n="'+esc(t.name||"Patient")+'">Notes</button>');
    return '<div class="row '+cls+'"><div class="top"><div class="pos'+(consult?" consult":"")+'">'+(consult?'<span class="ms sm">play_arrow</span>':(i+1))+'</div>'+
      '<div><div class="nm">'+esc(t.name||"Patient")+'<span class="mrn">#'+esc(t.mrnLast4||"")+'</span></div>'+
      '<div class="meta">'+esc(t.status.replace(/_/g," "))+'</div></div></div><div class="acts">'+b.join("")+'</div></div>';
  }
  // Nurse records vitals -> a compact timeline entry (kind:"vitals", EMR_VITALS cap). This is the nurse's
  // headline job; it writes to the same encounter timeline the doctor reads. One field is enough to save.
  function openVitals(sid,tid,name){
    var inp='style="width:100%;box-sizing:border-box;margin:3px 0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px"';
    var cell=function(lbl,id,ph,mode){return '<label style="font-size:12px;color:var(--mut)">'+lbl+'<input id="'+id+'" inputmode="'+(mode||"numeric")+'" placeholder="'+ph+'" '+inp+'></label>';};
    open('<h3>Record vitals'+(name?' - '+esc(name):'')+'</h3>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 10px">'+
        '<label style="font-size:12px;color:var(--mut)">BP (mmHg)<div style="display:flex;align-items:center;gap:6px"><input id="vbps" inputmode="numeric" placeholder="120" '+inp+'><span>/</span><input id="vbpd" inputmode="numeric" placeholder="80" '+inp+'></div></label>'+
        cell("Pulse (/min)","vpr","78")+cell("Temp (&deg;F)","vtemp","98.4","decimal")+cell("SpO2 (%)","vspo2","98")+cell("Resp (/min)","vrr","16")+cell("Weight (kg)","vwt","","decimal")+
      '</div>'+
      '<input id="vnote" placeholder="Note (optional)" '+inp.replace("style=\"","style=\"margin-top:8px;")+'>'+
      '<div class="row2"><button class="cancel" id="cx">Cancel</button><button class="btn" id="ok" style="margin:0">Save vitals</button></div>');
    sheet.querySelector("#cx").onclick=close;
    sheet.querySelector("#ok").onclick=function(){
      var g=function(id){var e=sheet.querySelector("#"+id);return e?e.value.trim():"";};
      var p=[], bps=g("vbps"), bpd=g("vbpd");
      if(bps||bpd) p.push("BP "+(bps||"?")+"/"+(bpd||"?")+" mmHg");
      if(g("vpr")) p.push("Pulse "+g("vpr")+"/min");
      if(g("vtemp")) p.push("Temp "+g("vtemp")+"°F");
      if(g("vspo2")) p.push("SpO2 "+g("vspo2")+"%");
      if(g("vrr")) p.push("RR "+g("vrr")+"/min");
      if(g("vwt")) p.push("Wt "+g("vwt")+"kg");
      var note=g("vnote"); if(note) p.push(note);
      if(!p.length){toast("Enter at least one value");return;}
      close();
      post("timeline",{sessionId:sid,ticketId:tid,kind:"vitals",text:p.join(" · ")});
    };
  }
  function openAssignRoom(tid){
    var pt=((st.opd&&st.opd.pool)||[]).filter(function(x){return x.id===tid;})[0]||{};
    var dept=(pt.department||"").toLowerCase();
    // GIMSR routing: matching-department rooms first, then the rest; shortest queue reads at a glance.
    var rooms=((st.opd&&st.opd.rooms)||[]).filter(function(r){return r.doctorUid;});
    var match=function(r){ return dept && String(r.room.department||"").toLowerCase()===dept; };
    rooms.sort(function(a,b){ return (match(b)?1:0)-(match(a)?1:0) || (a.waiting||0)-(b.waiting||0); });
    var opts=rooms.map(function(r){return '<option value="'+esc(r.room.id)+'">'+(match(r)?"✓ ":"")+esc(r.room.name||"Room")+(r.room.department?" ("+esc(r.room.department)+")":"")+' - '+esc(STATUS_LABEL[r.status]||r.status)+' · '+r.waiting+' waiting</option>';}).join("");
    open('<h3>Route '+esc(pt.name||"patient")+'</h3><p class="t" style="margin:0 0 8px">'+(dept?"Billed department: <b>"+esc(pt.department)+"</b> - matching rooms first.":"Pick the consulting room.")+'</p>'+(opts?'<select id="rsel">'+opts+'</select>':'<div class="empty">No staffed room available. Assign a doctor to a room in <b>Rooms</b> first.</div>')+
      (can("queue.priority")?'<label style="display:block;margin:12px 0 6px;font-weight:600;font-size:13px"><input type="checkbox" id="urg"> Urgent (front of the room queue)</label>':'')+   // only roles with the priority right may mark urgent (reception cannot)
      '<input id="arz" placeholder="Optional note" style="margin-top:6px">'+
      '<div class="row2"><button class="cancel" id="cx">Cancel</button><button class="btn" id="ok" style="margin:0">Assign</button></div>');
    sheet.querySelector("#cx").onclick=close;
    sheet.querySelector("#ok").onclick=function(){
      var sel=sheet.querySelector("#rsel"); if(!sel){toast("No room available");return;}
      var body={orgId:st.orgId,ticketId:tid,roomId:sel.value,date:st.date,reason:sheet.querySelector("#arz").value.trim()};
      var urg=sheet.querySelector("#urg"); if(urg&&urg.checked) body.priority=2;
      close();
      api("assign-room",{method:"POST",body:body}).then(function(r){ if(!r||!r.ok){toast(r&&r.error?friendly(r.error):"Assign failed");return;} if(r.board){st.opd=r.board;renderNurseStation(r.board);}else loadDash(); });
    };
  }

  // ---- ROOMS EDITOR (owner/admin): add rooms + assign/rotate doctors ----
  var ASSIGN_MODES=[["primary","One doctor"],["rotating","Rotating (multiple)"],["unassigned","No doctor (unassigned)"]];
  function meUid(){ try{ var a=fbAuth(); return (a&&a.currentUser&&a.currentUser.uid)||""; }catch(e){ return ""; } }
  function meName(){ try{ var u=fbAuth().currentUser; return (u&&u.displayName)||""; }catch(e){ return ""; } }
  function withDr(n){ n=String(n||"").trim(); return n?(/^dr\.?\s/i.test(n)?n:"Dr "+n):""; }
  function prettyLocal(e){ return String(e||"").split("@")[0].replace(/[._]+/g," ").replace(/\d+/g,"").trim().replace(/\b\w/g,function(c){return c.toUpperCase();}); }
  // Friendly doctor label from a stored doctor id (Firebase uid for the account, or a member email for
  // invited doctors). Never surface the raw hex uid. Prefers the account display name for this device.
  function docLabel(pd,doctorName){
    if(!pd) return "";
    if(pd===meUid()) return withDr(meName()) || withDr(prettyLocal((st.who&&st.who.name)||"")) || "You";
    if(doctorName && doctorName.indexOf("@")===-1 && !/^[a-z0-9]{16,}$/i.test(doctorName)) return withDr(doctorName);
    if(pd.indexOf("@")>-1) return withDr(prettyLocal(pd));
    return "Dr "+String(pd).slice(0,8);
  }
  function doctorOptions(){ // "Me" (this account) + org members with role doctor
    var opts=[{id:meUid(),label:"Me (this account)"}];
    (st.docMembers||[]).forEach(function(m){ if(m.role==="doctor") opts.push({id:m.identity,label:m.identity}); });
    return opts.filter(function(o){return o.id;});
  }
  function roomDoctorLabel(rm){ var a=rm.assignment||{}; if(a.mode==="unassigned"||(!a.primary&&!(a.doctors||[]).length)) return "No doctor"; if(a.mode==="rotating") return "Rotating ("+(a.doctors||[]).length+")"; var d=a.primary||(a.doctors||[])[0]||""; return d?(docLabel(d)||"Doctor"):"No doctor"; }
  function openRoomsAdmin(){
    open('<h3>Rooms</h3><div class="t" style="margin-bottom:8px">Clinic '+esc(st.orgCode||st.orgId)+'</div><div id="rlist">Loading…</div>'+
      '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'+
      '<input id="nrn" placeholder="New room name (e.g. Room 1 / Cardiology)" style="margin-bottom:8px">'+
      '<input id="nrnum" placeholder="Room number (optional)">'+
      '<div class="row2"><button class="cancel" id="cx">Close</button><button class="btn" id="ok" style="margin:0">Add room</button></div></div>');
    sheet.querySelector("#cx").onclick=close;
    sheet.querySelector("#ok").onclick=function(){
      var n=sheet.querySelector("#nrn").value.trim(); if(!n){toast("Enter a room name");return;}
      api("room",{method:"POST",body:{orgId:st.orgId,name:n,number:sheet.querySelector("#nrnum").value.trim(),assignment:{mode:"primary",primary:meUid(),doctors:[meUid()]}}}).then(function(r){
        if(!r||!r.ok){toast(r&&r.error?friendly(r.error):"Add failed");return;} toast("Room added (assigned to you)"); sheet.querySelector("#nrn").value="";sheet.querySelector("#nrnum").value=""; loadRoomsList();
      });
    };
    // load the org's doctor members (for the picker) then the rooms
    api("members?orgId="+encodeURIComponent(st.orgId)).then(function(r){ st.docMembers=(r&&r.members)||[]; }).catch(function(){}).then(loadRoomsList);
  }
  function loadRoomsList(){
    api("rooms?orgId="+encodeURIComponent(st.orgId)).then(function(r){
      var el=sheet.querySelector("#rlist"); if(!el) return;
      var rooms=(r&&r.rooms)||[];
      el.innerHTML=rooms.length? rooms.map(function(rm){
        return '<div class="ev" style="display:flex;align-items:center;gap:8px"><div style="flex:1"><b>'+esc(rm.name||"Room")+'</b>'+(rm.number?' <span class="t">#'+esc(rm.number)+'</span>':'')+'<div class="t">'+esc(roomDoctorLabel(rm))+'</div></div>'+
          '<button class="cancel" data-assign="'+esc(rm.id)+'" style="padding:6px 10px">Assign</button></div>';
      }).join("") : '<div class="empty">No rooms yet. Add one below.</div>';
      Array.prototype.forEach.call(el.querySelectorAll("[data-assign]"),function(b){b.onclick=function(){openRoomAssign(b.getAttribute("data-assign"));};});
    });
  }
  function openRoomAssign(roomId){
    var docs=doctorOptions();
    var modeSel='<select id="ram">'+ASSIGN_MODES.map(function(m){return '<option value="'+m[0]+'">'+m[1]+'</option>';}).join("")+'</select>';
    var docList=docs.length? docs.map(function(d){return '<label style="display:block;margin:6px 0"><input type="checkbox" class="rdoc" value="'+esc(d.id)+'"'+(d.label==="Me (this account)"?" checked":"")+'> '+esc(d.label)+'</label>';}).join("") : '<div class="t">No doctors yet - invite doctors in Staff, or assign yourself.</div>';
    open('<h3>Assign doctor to room</h3><label>Mode</label>'+modeSel+'<label style="display:block;margin-top:10px">Doctor(s)</label>'+docList+
      '<div class="row2"><button class="cancel" id="cx">Cancel</button><button class="btn" id="ok" style="margin:0">Save</button></div>');
    sheet.querySelector("#cx").onclick=function(){openRoomsAdmin();};
    sheet.querySelector("#ok").onclick=function(){
      var mode=sheet.querySelector("#ram").value;
      var picked=Array.prototype.map.call(sheet.querySelectorAll(".rdoc:checked"),function(c){return c.value;});
      var assignment=(mode==="unassigned")?{mode:"unassigned",doctors:[],primary:null}:{mode:mode,doctors:picked,primary:picked[0]||null};
      if(mode!=="unassigned"&&!picked.length){toast("Pick at least one doctor");return;}
      api("room/update",{method:"POST",body:{orgId:st.orgId,roomId:roomId,assignment:assignment}}).then(function(r){
        if(!r||!r.ok){toast(r&&r.error?friendly(r.error):"Save failed");return;} toast("Room updated"); openRoomsAdmin();
      });
    };
  }

  // ---- ONBOARDING WIZARD (short for a private clinic; scaffolded for a hospital) ----
  function openWizard(){
    var type="native";
    open('<h3>Set up your OPD</h3>'+
      '<label>Clinic / hospital name</label><input id="wzn" placeholder="e.g. Dr Rao Clinic">'+
      '<label style="display:block;margin-top:12px">Type</label>'+
      '<div class="cats" id="wzt"><button data-t="native" class="on">Private clinic</button><button data-t="connect">Hospital / EMR</button></div>'+
      '<div class="row2"><button class="cancel" id="cx">Cancel</button><button class="btn" id="ok" style="margin:0">Create</button></div>');
    Array.prototype.forEach.call(sheet.querySelectorAll("#wzt [data-t]"),function(b){b.onclick=function(){type=b.getAttribute("data-t");Array.prototype.forEach.call(sheet.querySelectorAll("#wzt button"),function(x){x.classList.remove("on");});b.classList.add("on");};});
    sheet.querySelector("#cx").onclick=close;
    sheet.querySelector("#ok").onclick=function(){
      var name=sheet.querySelector("#wzn").value.trim(); if(!name){toast("Enter a name");return;}
      var ep=type==="native"?"onboard/clinic":"onboard/hospital";
      api(ep,{method:"POST",body:{name:name,roomName:"Consulting Room"}}).then(function(r){
        if(!r||!r.ok){toast(r&&r.error?friendly(r.error):"Setup failed");return;}
        st.orgId=r.org.id; st.orgCode=r.org.code||""; st.hospital=r.org.id; localStorage.setItem(LS_HOSP,r.org.id);
        (type==="native")?wizReception(r.org.id):wizRooms(r.org.id);
      });
    };
  }
  function wizReception(orgId){   // private clinic: your room is ready (you = the doctor); add reception, or skip.
    open('<h3>Clinic ready</h3><p class="t" style="margin-top:0">Your clinic code is <b>'+esc(st.orgCode||orgId)+'</b> - staff sign in with this. Add a front-desk login now, or skip.</p>'+
      '<input id="wri" placeholder="Reception staff ID (e.g. front1)" style="margin-bottom:8px"><input id="wrp" placeholder="Set a PIN" inputmode="numeric" type="password">'+
      '<div class="row2"><button class="cancel" id="skip">Skip · Start</button><button class="btn" id="ok" style="margin:0">Add & start</button></div>');
    sheet.querySelector("#skip").onclick=function(){close();toast("Clinic ready");loadDash();};
    sheet.querySelector("#ok").onclick=function(){
      var id=sheet.querySelector("#wri").value.trim(), pin=sheet.querySelector("#wrp").value.trim();
      if(!id){close();loadDash();return;}
      api("member",{method:"POST",body:{orgId:orgId,identity:id,role:"reception"}}).then(function(){
        var done=function(){close();toast("Clinic ready");loadDash();};
        pin?api("member/pin",{method:"POST",body:{orgId:orgId,identity:id,pin:pin}}).then(done):done();
      });
    };
  }
  function wizRooms(orgId){   // hospital: add rooms fast; assign doctors + staff afterwards from Staff.
    var added=[];
    open('<h3>Add rooms</h3><p class="t" style="margin-top:0">Add your consultation rooms. Assign doctors and staff afterwards from the Staff panel.</p>'+
      '<input id="rmn" placeholder="Room name (e.g. Medicine 1)"><div id="rmlist" class="t" style="margin:8px 0"></div>'+
      '<div class="row2"><button class="cancel" id="add">Add room</button><button class="btn" id="ok" style="margin:0">Finish</button></div>');
    sheet.querySelector("#add").onclick=function(){
      var n=sheet.querySelector("#rmn").value.trim(); if(!n){toast("Room name?");return;}
      api("room",{method:"POST",body:{orgId:orgId,name:n}}).then(function(r){ if(r&&r.ok){added.push(n);sheet.querySelector("#rmlist").textContent="Added: "+added.join(", ");sheet.querySelector("#rmn").value="";toast("Room added");} });
    };
    sheet.querySelector("#ok").onclick=function(){close();toast("Hospital ready");loadDash();};
  }

  function open(html){ sheet.innerHTML=html; scrim.classList.add("on"); }
  function close(){ scrim.classList.remove("on"); sheet.innerHTML=""; }
  scrim.onclick=function(e){ if(e.target===scrim) close(); };

  // Preview mode (?mock=1): render the central-routing control with sample data - no auth/network.
  // The admin capabilities below are COSMETIC: every request is authorised independently on the
  // server, so nothing here can read or write real data. A banner says so, because the Staff /
  // Rooms / Branding controls render in full and a staff member landing on this URL would
  // otherwise believe they had been given admin rights and report the failures as bugs.
  if(new URLSearchParams(location.search||"").get("mock")==="1"){
    st.who={role:"admin",caps:["queue.view","queue.add","queue.reorder","queue.status","queue.priority","queue.assign","staff.admin","emr.vitals","emr.view"],kind:"firebase",name:"Preview"}; st.ownsOrg=true; st.orgCode="SMD-DEMO01"; st.orgId="demo";
    try { var pv=document.createElement("div"); pv.setAttribute("role","status");
      pv.style.cssText="position:sticky;top:0;z-index:99;background:#8a5208;color:#fff;padding:8px 14px;font:700 12px/1.4 -apple-system,system-ui,sans-serif;text-align:center";
      pv.textContent="Preview with sample data - not your clinic. Nothing here is saved.";
      document.body.insertBefore(pv, document.body.firstChild); } catch(e){}
    var nm=Date.now();
    renderNurseStation({mode:"native",rooms:[
      {room:{id:"r1",name:"Medicine 1",number:"101",department:"General",assignment:{primary:"drA"}},doctorUid:"drA",sessionId:"s1",waiting:3,status:"moderate",tickets:[
        {id:"t1",name:"Ramesh Kumar",mrnLast4:"4821",status:"in_consultation",priority:0,registeredAt:nm-22*60000},
        {id:"t2",name:"Lakshmi Devi",mrnLast4:"7734",status:"called",priority:0,registeredAt:nm-14*60000},
        {id:"t3",name:"Abdul Rahman",mrnLast4:"1902",status:"waiting",priority:2,registeredAt:nm-30*60000}]},
      {room:{id:"r2",name:"Cardiology",number:"104",department:"Cardiology",assignment:{primary:"drB"}},doctorUid:"drB",sessionId:"s2",waiting:1,status:"normal",tickets:[
        {id:"t4",name:"Sita Mahalakshmi",mrnLast4:"5560",status:"waiting",priority:0,registeredAt:nm-6*60000}]},
      {room:{id:"r3",name:"Dermatology",number:"106",department:"Dermatology",assignment:{}},doctorUid:null,sessionId:null,waiting:0,status:"unavailable",tickets:[]}],
      pool:[
        {id:"p1",name:"John Peter",mrnLast4:"3341",department:"Cardiology",priority:0,registeredAt:nm-4*60000},
        {id:"p2",name:"Fatima Begum",mrnLast4:"9021",department:"General",priority:2,registeredAt:nm-18*60000},
        {id:"p3",name:"Vikram Rao",mrnLast4:"6655",department:"Dermatology",priority:0,registeredAt:nm-2*60000}]});
    return;
  }
  // Entry: a StewardMD account (Firebase) persists in the SDK; wait for it. Staff sessions use the stored token.
  if(st.tokType==="firebase"){ var a=fbAuth(); if(a){ a.onAuthStateChanged(function(u){ u?boot():renderLogin(); }); } else renderLogin("Account sign-in unavailable. Use PIN or email."); }
  else if(st.tok) boot(); else renderLogin();
})();
</script>
