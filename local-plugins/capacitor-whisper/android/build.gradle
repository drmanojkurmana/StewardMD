buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "in.stewardmd.whisper"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    // NDK r27+ ships 16 KB-aligned prebuilts (libc++_shared.so) and, with
    // ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON below, links our .so with 16 KB LOAD-segment
    // alignment — required for Android 15 devices with 16 KB memory pages (and Play compliance).
    ndkVersion project.hasProperty('ndkVersion') ? rootProject.ext.ndkVersion : '27.2.12479018'
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName '1.0'

        // Native whisper.cpp build. arm64-v8a FIRST (real devices); x86_64 emulators may not run
        // inference — test on a real arm64 device (plan §3 "Android specifics").
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-O3 -std=c++17 -fexceptions -frtti'
                // ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON makes the NDK link every .so with
                // max-page-size=16384 (16 KB-aligned LOAD segments) — see the ndkVersion note.
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
}
