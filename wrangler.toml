FOUNDING_PRICE_YEAR = "39900"        # Founding-Doctor ₹399/year (first 500)
AI_DAILY_COST_CAP_INR = "0.5"        # Free default (₹/day)
AI_COST_CAP_STUDENT = "5"
AI_COST_CAP_RESIDENT = "5"
AI_COST_CAP_CO_RESIDENT = "6"        # POOLED across the 2 accounts
AI_COST_CAP_INTERN = "5"
AI_COST_CAP_PHYSICIAN = "10"         # Pro
AI_COST_CAP_PHYSICIAN_PRO = "25"     # Physician Pro
CREDIT_CONVERSION = "0.5"            # ₹50 → ₹25 of AI
FOUNDING_AI_GRANT_INR = "120"        # founding annual pool: ₹120 + one ₹120 refill = ₹240/yr ceiling
FOUNDING_AI_REFILL_INR = "120"
FOUNDING_DAILY_CAP_INR = "0.01"      # ~0 free daily → founding AI draws the annual pool
