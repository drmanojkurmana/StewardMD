# Cloudflare Pages config — mirrors the project's LIVE dashboard bindings
# (captured via `wrangler pages download config stewardmd`) and ADDS the Vectorize
# binding the hybrid-retrieval vector arm needs. Nothing else changes: same build
# output (root), same AI + KV bindings that are already configured.
name = "stewardmd"
pages_build_output_dir = ""
compatibility_date = "2025-01-01"

# Workers AI (already live) — query embedding for hybrid retrieval
[ai]
binding = "AI"

# Vectorize (NEW) — KB disease-vector index for the semantic arm (functions/api/retrieve)
[[vectorize]]
binding = "KB_VECTORIZE"
index_name = "stewardmd-kb"

# D1 — offline NMC register mirror; doctor verification falls back to it when live NMC is down
[[d1_databases]]
binding = "stewardmd_nmc"
database_name = "stewardmd-nmc"
database_id = "36803432-5e8c-45e7-8dff-530f9a36c2cd"

# D1 — Medical Updates module (guidelines / approvals / safety alerts / trials + sources + crawl logs)
# CREATE FIRST:  wrangler d1 create stewardmd-updates   → paste the returned database_id below (both blocks).
# Then apply schema: wrangler d1 execute stewardmd-updates --remote --file functions/db/updates_schema.sql
[[d1_databases]]
binding = "UPDATES_DB"
database_name = "stewardmd-updates"
database_id = "f1fe0b36-d780-415d-ae8d-e9024747b552"

# D1 — StewardMD Connect (interop platform): tenants, memberships, connector configs, audit, ABDM txns.
# Gated behind CONNECT_* flags + CONNECT_MASTER_KEY (secrets). Created via `wrangler d1 create stewardmd-connect`.
[[d1_databases]]
binding = "CONNECT_DB"
database_name = "stewardmd-connect"
database_id = "788b1c85-acb4-4242-882c-24b402298b2c"

# R2 — FollowCare patient photos (wound/rash/etc). PHI-minimising: private bucket, 7-day lifecycle expiry on
# the followcare/ prefix + view-once (FOLLOWCARE_PHOTO_VIEW_ONCE=1) + purge-on-erase. Code binding = FOLLOWCARE_R2.
[[r2_buckets]]
binding = "FOLLOWCARE_R2"
bucket_name = "stewardmd-followcare-media"

# Plaintext config vars (NOT secrets — secrets stay in `wrangler pages secret put`).
# DPDP §8(7) storage limitation: auto-erase a FollowCare episode 7 days after it is
# recovered/closed (active follow-ups are never touched; see functions/_followcare_dispatch.js).
[vars]
FOLLOWCARE_RETENTION_DAYS = "7"
# Admin/owner allowlist (comma-separated Google account emails). The authoritative server gate
# (functions/_adminauth.js ownerOK) uses this; the in-code defaults are kept in sync as a fallback.
OWNER_EMAILS = "drmanojkurmana@gmail.com,mkkmanojkumar0@gmail.com,kdiwakar45@gmail.com"
# AI Control Center abuse watchlist FALLBACK: flag a doctor once their AI requests today reach this
# count. The per-module daily caps (MaiK 50 + cases 25 + Vision 50 + STT 50 + ECG 10) already
# hard-block runaway use at ~185/day, so 150 (~80% of the max) surfaces only the heaviest users.
# The owner can override this live from the AI Control Center console (KV ai:abuse:threshold, no
# redeploy); this env value is the fallback when no KV override is set.
AI_ABUSE_REQ_THRESHOLD = "150"
# Smart OPD Queue backend switch (dev/testing). PUBLIC-RELEASE-GATE: set "0" before public/store release.
QUEUE_ENABLED = "1"
# LIVE EMR WRITE-BACK: "1" lets the assessment + investigation-order submits POST into GHIS (each ALSO needs the
# client smd_opd_emr_write flag + an explicit confirm()). Prescribe stays server-hard-blocked (needs the separate
# QUEUE_EMR_PRESCRIBE_OK) until the CreateDrugs payload is verified. PUBLIC-RELEASE-GATE: set "0" before release.
QUEUE_EMR_WRITE = "1"
# OPD staff platform (roles/assignment/reorder-audit/timeline/checkout). PUBLIC-RELEASE-GATE: set "0" before release.
QUEUE_STAFF_ENABLED = "1"
# Phase 5: admin is the clinic OWNER's StewardMD account (+ org membership). No GHIS-id bootstrap.
# Patient messaging channel for the queue (timeline link etc.). "whatsapp" for now; switch to "sms" (2Factor) later.
FOLLOWCARE_MSG_CHANNEL = "whatsapp"
# MaiK semantic answer cache: "1" serves common GENERIC questions from KV (zero-token, instant).
# Never caches case/PHI answers. Bump MAIK_CACHE_VERSION to invalidate the whole cache after a
# prompt/model/KB change. Set "0" to disable instantly.
MAIK_ANSWER_CACHE = "1"
MAIK_CACHE_VERSION = "1"
# MaiK cite-or-abstain: "1" makes the model ground+cite and say "verify / not certain" instead of
# confidently guessing. Set "0" to revert to the prior prompt exactly.
MAIK_ABSTAIN = "1"
# Oncology treatment-plan writes (OPD Protocol assign, cycles, administration). "1" un-gates the
# role-split onco endpoints; every write is still cap-gated (EMR_TREAT doctor / EMR_VITALS nurse) +
# suggest-and-confirm. PUBLIC-RELEASE-GATE: review before public release.
QUEUE_ONCO_WRITE = "1"
# AI abuse controls: enforce per-user + per-module daily/rate caps. Was default-off (every account
# behaved like the owner); "1" turns on the _ai_usage caps. Owner accounts stay exempt (admin).
# Set "0" to revert instantly. (Caps today: MaiK 50, cases 25, Vision 50, STT 50, ECG 10, research 2,
# + 60 req/day, 200k tok/day, 3M/month, 3s min-interval — tune in _ai_usage.js/_usage.js if too tight.)
MAIK_ENFORCE_CAPS = "1"
# Experimental Access code-gate ENFORCEMENT for the imaging AI cloud-compute endpoints. "1" = the
# server requires an owner OR a valid access code (X-XA-Token) to hit /api/{sknx,thorex,kardiox}
# compute. On-device imaging is unaffected; owner accounts always pass (ownerOK). Set "0" to revert.
EXPERIMENTAL_ENFORCE_SKNX = "1"
EXPERIMENTAL_ENFORCE_THOREX = "1"
EXPERIMENTAL_ENFORCE_KARDIOX = "1"
# ── Pro pricing (paise; ₹1 = 100). Read by functions/api/billing/[[path]].js plans(). INERT while the
# launch promo (PRO_FREE_UNTIL, default 15 Sep 2026) is active. See docs/PRICING_PACKAGING.md.
PRO_PRICE_MONTHLY = "59900"          # Pro ₹599/mo
PRO_PRICE_ANNUAL = "499900"          # Pro ₹4,999/yr (~2 months free)
STUDENT_PRICE_MONTHLY = "19900"      # Student ₹199/mo (verified trainee)
STUDENT_PRICE_ANNUAL = "199900"      # Student ₹1,999/yr
CORESIDENT_PRICE_MONTHLY = "29900"   # Co-Resident ₹299/mo (2 accounts, shared AI pool)
ULTIMATE_PRICE_MONTHLY = "149900"    # Ultimate ₹1,499/mo
ULTIMATE_PRICE_ANNUAL = "1499900"    # Ultimate ₹14,999/yr
ONCO_ADDON_MONTHLY = "8900"          # Physician Onco add-on +₹89/mo
FOUNDING_PRICE_YEAR = "39900"        # Founding-Doctor ₹399 for the whole year (first 500)
# ── Per-user daily AI COST cap (₹/day) by role. Read by functions/_credits.js. INERT unless AI_COST_CAP_ON="1".
AI_DAILY_COST_CAP_INR = "0.5"        # Free default
AI_COST_CAP_STUDENT = "5"            # trainee: GST-net ₹169 rev → ₹5/day keeps worst-case margin non-negative
AI_COST_CAP_RESIDENT = "5"
AI_COST_CAP_CO_RESIDENT = "6"        # POOLED across the 2 accounts
AI_COST_CAP_INTERN = "5"
AI_COST_CAP_PHYSICIAN = "10"         # Pro (worst-case ~41% margin after GST)
AI_COST_CAP_PHYSICIAN_PRO = "25"     # Physician Pro (worst-case ~41%)
CREDIT_CONVERSION = "0.5"            # buy ₹50 credits → ₹25 of AI allowance
# ── Founding-Doctor fixed annual AI pool (₹): ₹120 grant + one ₹120 auto-refill = ₹240/yr ceiling.
FOUNDING_AI_GRANT_INR = "120"
FOUNDING_AI_REFILL_INR = "120"
FOUNDING_DAILY_CAP_INR = "0.01"      # ~0 free daily allowance → founding AI draws the annual pool
FOUNDING_SEATS = "500"
# Anti-sharing device lock: "1" enforces the signed-in-device limit (1/tier, Co-Resident + Physician Pro 2;
# override per role via DEVICE_LIMIT_<ROLE>). "0"/unset = record-only, no eviction. Clinic limits per role
# are code defaults (Pro 2, Physician 4, Physician Pro 6; override via CLINIC_LIMIT_<ROLE>).
DEVICE_LOCK_ON = "0"
# AI_COST_CAP_ON intentionally UNSET → the rupee cost cap + founding pool stay INERT until go-live.

[env.production]
compatibility_date = "2026-06-28"

[env.production.vars]
FOLLOWCARE_RETENTION_DAYS = "7"
AI_ABUSE_REQ_THRESHOLD = "150"
OWNER_EMAILS = "drmanojkurmana@gmail.com,mkkmanojkumar0@gmail.com,kdiwakar45@gmail.com"
QUEUE_ENABLED = "1"   # PUBLIC-RELEASE-GATE: OPD queue backend on for dev/testing; set "0" before release
QUEUE_EMR_WRITE = "1"   # LIVE GHIS write-back for assessment + investigation orders (prescribe stays blocked). PUBLIC-RELEASE-GATE
QUEUE_STAFF_ENABLED = "1"   # OPD staff platform on for dev/testing. PUBLIC-RELEASE-GATE: set "0" before release
FOLLOWCARE_MSG_CHANNEL = "whatsapp"   # queue patient messages via WhatsApp for now; switch to "sms" (2Factor) later
MAIK_ANSWER_CACHE = "1"   # semantic answer cache ON (generic Qs only, never case/PHI); MAIK_CACHE_VERSION bump = invalidate
MAIK_CACHE_VERSION = "1"
