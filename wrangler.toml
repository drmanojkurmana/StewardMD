MAIK_ENFORCE_CAPS = "1"   # enforce per-user/per-module AI daily+rate caps (owner exempt); set "0" to revert
EXPERIMENTAL_ENFORCE_SKNX = "1"   # imaging code-gate enforced server-side (owner + code-holders only); "0" reverts
