<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>design-guide quality fixture</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #18181b; background: #f4f4f5; }
      main { width: min(100% - 32px, 720px); margin: 48px auto; }
      section { padding: 24px; border: 1px solid #d4d4d8; background: white; }
      button { min-height: 44px; padding: 0 16px; }
      button:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Quality gate fixture</h1>
      <section aria-live="polite">
        <h2 id="state-title"></h2>
        <p id="state-copy"></p>
        <button type="button">Continue</button>
      </section>
    </main>
    <script>
      const state = new URLSearchParams(location.search).get("state") || "success";
      const messages = {
        loading: ["Loading", "Content is being prepared."],
        empty: ["No results", "Change the filters and try again."],
        error: ["Unable to load", "Retry after checking the connection."],
        success: ["Ready", "The interface is ready for review."]
      };
      const [title, copy] = messages[state] || messages.error;
      document.querySelector("#state-title").textContent = title;
      document.querySelector("#state-copy").textContent = copy;
    </script>
  </body>
</html>
