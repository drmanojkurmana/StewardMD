<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="clT clD">
<title id="clT">Clinical Diagnostic Decision &amp; Systematic Workup Pathway</title>
<desc id="clD">Multi-stage evidence-based clinical reasoning pathway spanning triage, targeted biomarkers, multimodality imaging, and definitive therapy.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Systematic Clinical Diagnostic &amp; Triage Pathway</text>
<!-- Stage 1: Triage -->
<rect x="25" y="55" width="165" height="48" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
<circle cx="45" cy="79" r="10" fill="#0284c7"/>
<text x="45" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">1</text>
<text x="65" y="73" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#f8fafc">Clinical Triage</text>
<text x="65" y="87" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">Vital signs &amp; Red flags</text>
<!-- Stage 2: Diagnostic Workup -->
<rect x="210" y="55" width="165" height="48" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
<circle cx="230" cy="79" r="10" fill="#0284c7"/>
<text x="230" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">2</text>
<text x="250" y="73" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#f8fafc">Biomarkers &amp; Imaging</text>
<text x="250" y="87" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">Targeted panels &amp; scans</text>
<!-- Connectors -->
<path d="M190 79 L210 79" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>
<path d="M292 103 L292 135" stroke="#38bdf8" stroke-width="2"/>
<!-- Stage 3: Risk Stratification -->
<rect x="210" y="135" width="165" height="48" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<circle cx="230" cy="159" r="10" fill="#f59e0b"/>
<text x="230" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">3</text>
<text x="250" y="153" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#f8fafc">Risk Stratification</text>
<text x="250" y="167" font-family="system-ui, sans-serif" font-size="7.5" fill="#fef3c7">Severity &amp; Organ scores</text>
<!-- Connector -->
<path d="M210 159 L190 159" stroke="#38bdf8" stroke-width="2"/>
<!-- Stage 4: Targeted Therapy -->
<rect x="25" y="135" width="165" height="48" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<circle cx="45" cy="159" r="10" fill="#10b981"/>
<text x="45" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">4</text>
<text x="65" y="153" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#f8fafc">Targeted Therapy</text>
<text x="65" y="167" font-family="system-ui, sans-serif" font-size="7.5" fill="#a7f3d0">Definitive intervention</text>
<!-- Clinical Summary Box -->
<rect x="25" y="205" width="350" height="75" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
<text x="40" y="226" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#38bdf8">Diagnostic Decision Support: Objective Milestones</text>
<text x="40" y="244" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">1. Early Recognition: Differentiate life threats from stable presentations</text>
<text x="40" y="259" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">2. Diagnostic Yield: Prioritize high-sensitivity screening and high-specificity confirmation</text>
<text x="40" y="274" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">3. Disposition &amp; Escalation: Intensive care transfer vs structured outpatient monitoring</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Iterative Diagnostic Refinement, Bayesian Post-Test Probability &amp; Escalation</text>
</svg>
