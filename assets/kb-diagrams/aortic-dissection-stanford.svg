<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-labelledby="aodT aodD">
<title id="aodT">Aortic dissection schematic: Stanford type A versus type B</title>
<desc id="aodD">Two panels comparing Stanford type A dissection involving the ascending aorta with type B confined to the descending aorta, showing the intimal flap and true and false lumens.</desc>
<rect x="0" y="0" width="560" height="360" rx="10" fill="#f7f4ee"/>
<text x="280" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Aortic dissection: Stanford classification (schematic)</text>
<!-- TYPE A panel -->
<text x="145" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b42318">Type A: ascending involved</text>
<!-- aorta tube: valve, ascending, arch, descending -->
<path d="M100 300 L100 180 C100 120 130 96 175 96 L215 96 C250 96 258 120 258 150 L258 300" stroke="#b42318" stroke-width="34" fill="none" stroke-linecap="round"/>
<!-- head vessels -->
<path d="M160 96 L160 66 M190 96 L190 66 M220 98 L228 70" stroke="#b42318" stroke-width="10" stroke-linecap="round"/>
<!-- false lumen overlay in ascending -->
<path d="M100 290 L100 180 C100 128 124 104 160 100" stroke="#5f1a15" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.85"/>
<!-- intimal flap line -->
<path d="M100 285 L100 180 C100 128 124 104 160 100" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<path d="M160 100 C200 96 240 100 252 128" stroke="#ffffff" stroke-width="2" fill="none" stroke-dasharray="5 4" opacity="0.7"/>
<!-- true lumen overlay -->
<path d="M100 300 L100 190" stroke="#e2574c" stroke-width="12" fill="none" stroke-linecap="round"/>
<!-- entry tear arrow -->
<line x1="66" y1="220" x2="94" y2="220" stroke="#1f2937" stroke-width="2"/>
<path d="M86 214 L96 220 L86 226" stroke="#1f2937" stroke-width="2" fill="none"/>
<text x="20" y="208" font-family="sans-serif" font-size="10" fill="#1f2937">Entry tear</text>
<text x="118" y="180" font-family="sans-serif" font-size="10" fill="#ffffff">True</text>
<text x="118" y="250" font-family="sans-serif" font-size="10" fill="#f3c1c1">False</text>
<text x="150" y="150" font-family="sans-serif" font-size="10" fill="#1f2937">Intimal flap</text>
<line x1="148" y1="140" x2="132" y2="118" stroke="#1f2937" stroke-width="1"/>
<!-- TYPE B panel -->
<text x="415" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2556a8">Type B: descending only</text>
<path d="M370 300 L370 180 C370 120 400 96 445 96 L485 96 C520 96 528 120 528 150 L528 300" stroke="#b42318" stroke-width="34" fill="none" stroke-linecap="round"/>
<path d="M430 96 L430 66 M460 96 L460 66 M490 98 L498 70" stroke="#b42318" stroke-width="10" stroke-linecap="round"/>
<!-- flap confined to descending -->
<path d="M528 170 L528 295" stroke="#5f1a15" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.85"/>
<path d="M528 165 L528 295" stroke="#ffffff" stroke-width="2.5" fill="none"/>
<path d="M370 300 L370 180 C370 120 400 96 445 96 L485 96 C520 96 528 120 528 150" stroke="#e2574c" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.9"/>
<text x="540" y="235" font-family="sans-serif" font-size="10" fill="#1f2937">False</text>
<text x="386" y="235" font-family="sans-serif" font-size="10" fill="#ffffff">True</text>
<text x="352" y="120" font-family="sans-serif" font-size="10" fill="#1f2937">Ascending spared</text>
<line x1="392" y1="118" x2="376" y2="160" stroke="#1f2937" stroke-width="1"/>
<!-- legend -->
<rect x="36" y="312" width="14" height="14" rx="3" fill="#e2574c"/>
<text x="56" y="323" font-family="sans-serif" font-size="11" fill="#1f2937">True lumen</text>
<rect x="160" y="312" width="14" height="14" rx="3" fill="#5f1a15"/>
<text x="180" y="323" font-family="sans-serif" font-size="11" fill="#1f2937">False lumen</text>
<line x1="300" y1="319" x2="326" y2="319" stroke="#1f2937" stroke-width="2.5"/>
<text x="332" y="323" font-family="sans-serif" font-size="11" fill="#1f2937">Intimal flap</text>
<text x="280" y="348" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">Type A needs emergency surgery; uncomplicated type B is usually managed medically. Schematic, not imaging.</text>
</svg>
