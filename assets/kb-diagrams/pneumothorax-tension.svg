<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="ptxT ptxD">
<title id="ptxT">Chest X-ray schematic: left tension pneumothorax</title>
<desc id="ptxD">Stylised PA chest film showing a left visceral pleural line, absent lung markings lateral to it, a partly collapsed left lung, tracheal deviation and mediastinal shift to the right.</desc>
<rect x="0" y="0" width="400" height="470" rx="10" fill="#10151c"/>
<text x="200" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e6edf3">Tension pneumothorax, left (schematic)</text>
<!-- chest wall -->
<path d="M70 60 C60 180 62 300 84 400" stroke="#3b4a5c" stroke-width="3" fill="none"/>
<path d="M330 60 C340 180 338 300 316 400" stroke="#3b4a5c" stroke-width="3" fill="none"/>
<!-- clavicles -->
<path d="M110 62 C140 52 170 54 192 66" stroke="#5b6b7f" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M290 62 C260 52 230 54 208 66" stroke="#5b6b7f" stroke-width="4" fill="none" stroke-linecap="round"/>
<!-- right lung (normal, expanded, with markings) -->
<path d="M212 92 C240 80 268 78 296 86 C308 160 306 300 290 356 C262 368 232 360 216 340 L212 200 Z" fill="#1a2431"/>
<path d="M236 130 L250 200 L244 280" stroke="#3d4e63" stroke-width="2" fill="none"/>
<path d="M250 200 L270 232 M250 200 L232 238 M244 280 L260 306 M244 280 L230 304" stroke="#3d4e63" stroke-width="1.5" fill="none"/>
<path d="M222 170 C240 164 258 166 272 174" stroke="#2c3846" stroke-width="2" fill="none"/>
<path d="M220 230 C240 224 260 226 276 234" stroke="#2c3846" stroke-width="2" fill="none"/>
<!-- trachea DEVIATED to the right of midline -->
<path d="M214 60 L222 150" stroke="#ffb454" stroke-width="6" stroke-linecap="round"/>
<path d="M222 150 L206 178 M222 150 L244 172" stroke="#ffb454" stroke-width="5" stroke-linecap="round" fill="none"/>
<line x1="200" y1="60" x2="200" y2="180" stroke="#5b6b7f" stroke-width="1" stroke-dasharray="4 4"/>
<!-- heart shifted right -->
<path d="M222 210 C206 212 196 230 196 258 C196 294 210 322 228 332 C234 324 238 296 238 262 C238 238 232 214 222 210 Z" fill="#2b3646"/>
<!-- left pleural space: empty (no markings) -->
<path d="M104 84 C130 76 150 78 162 92 L158 300 C140 336 116 354 100 348 C90 280 90 150 104 84 Z" fill="#0b0f14"/>
<!-- visceral pleural line -->
<path d="M162 92 C168 160 166 240 158 300" stroke="#f2f6fa" stroke-width="2.5" fill="none"/>
<!-- collapsed left lung edge at hilum -->
<path d="M162 150 C180 170 186 220 178 280 C172 300 164 312 158 316 C160 260 160 200 162 150 Z" fill="#31404f" opacity="0.9"/>
<!-- diaphragms: left flattened and depressed (tension sign) -->
<path d="M216 344 C246 330 276 330 292 340" stroke="#5b6b7f" stroke-width="3" fill="none"/>
<line x1="98" y1="372" x2="160" y2="372" stroke="#5b6b7f" stroke-width="3"/>
<!-- shift arrow -->
<line x1="150" y1="120" x2="196" y2="120" stroke="#ff7b72" stroke-width="2"/>
<path d="M188 114 L198 120 L188 126" stroke="#ff7b72" stroke-width="2" fill="none"/>
<!-- callouts -->
<circle cx="161" cy="190" r="3" fill="#f2f6fa"/>
<line x1="161" y1="190" x2="120" y2="420" stroke="#9fb3c8" stroke-width="1"/>
<text x="30" y="424" font-family="sans-serif" font-size="11" fill="#c9d4e0">Pleural line</text>
<text x="228" y="416" font-family="sans-serif" font-size="11" fill="#c9d4e0">No lung markings</text>
<line x1="262" y1="400" x2="240" y2="412" stroke="#9fb3c8" stroke-width="1"/>
<text x="228" y="430" font-family="sans-serif" font-size="11" fill="#c9d4e0">lateral to the line</text>
<text x="238" y="96" font-family="sans-serif" font-size="11" fill="#ffb454">Tracheal deviation</text>
<text x="238" y="110" font-family="sans-serif" font-size="11" fill="#ffb454">+ mediastinal shift</text>
<text x="238" y="124" font-family="sans-serif" font-size="11" fill="#c9d4e0">(tension physiology)</text>
<text x="200" y="456" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#7d8b9c">Schematic illustration, not a patient image</text>
</svg>
