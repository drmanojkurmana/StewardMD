<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="edT edD">
<title id="edT">Endocrine &amp; Metabolic Axis Diagnostic Schematic</title>
<desc id="edD">Hypothalamic-pituitary-end organ hormonal feedback loops and cellular metabolic pathways.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Endocrine Feedback &amp; Metabolic Control Axis</text>
<!-- Hypothalamus / Pituitary Box -->
<rect x="135" y="45" width="130" height="40" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
<text x="200" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#c4b5fd">Hypothalamus / Pituitary</text>
<!-- Stimulatory Hormone Signal Down -->
<path d="M185 85 L185 145" stroke="#10b981" stroke-width="2.5"/>
<polygon points="185,150 181,142 189,142" fill="#10b981"/>
<text x="145" y="115" font-family="system-ui, sans-serif" font-size="8" fill="#6ee7b7">Trophic Drive</text>
<!-- Target End Organ (Thyroid / Adrenal / Pancreas) -->
<rect x="130" y="150" width="140" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<text x="200" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#fef3c7">Target Endocrine Gland</text>
<text x="200" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">Hormone Secretion (T4, Cortisol, Insulin)</text>
<!-- Negative Feedback Loop Up -->
<path d="M250 150 C290 130 290 90 260 70" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
<text x="300" y="105" font-family="system-ui, sans-serif" font-size="8" fill="#fca5a5">Negative Feedback</text>
<!-- Downstream Cellular Receptors & Metabolism -->
<rect x="30" y="225" width="340" height="55" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
<text x="45" y="246" font-family="system-ui, sans-serif" font-size="8.5" fill="#38bdf8">Metabolic Effector Organs: Hepatic Gluconeogenesis, Glycogenolysis &amp; Adipose Lipolysis</text>
<text x="45" y="266" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Diagnostic Laboratory Biomarkers: Free Hormone Assays, Stimulation &amp; Suppression Dynamics</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Endocrine Feedback Dynamics, Receptor Transduction &amp; Homeostatic Setpoints</text>
</svg>
