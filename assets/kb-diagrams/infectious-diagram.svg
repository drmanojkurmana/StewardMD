<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="idT idD">
<title id="idT">Infectious Disease &amp; Microbial Pathogenesis Schematic</title>
<desc id="idD">Microbiological and systemic inflammatory response schematic illustrating pathogen entry, immune activation, and systemic response.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Infectious Disease &amp; Host Response Pathway</text>
<!-- Pathogen Inset (Bacteria / Virus) -->
<circle cx="100" cy="110" r="35" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
<circle cx="95" cy="105" r="4" fill="#fca5a5"/><circle cx="110" cy="115" r="5" fill="#fca5a5"/><circle cx="85" cy="120" r="4" fill="#fca5a5"/>
<!-- Spikes / Antigen Markers -->
<line x1="100" y1="75" x2="100" y2="65" stroke="#ef4444" stroke-width="2.5"/><circle cx="100" cy="63" r="3" fill="#f87171"/>
<line x1="135" y1="110" x2="145" y2="110" stroke="#ef4444" stroke-width="2.5"/><circle cx="147" cy="110" r="3" fill="#f87171"/>
<line x1="100" y1="145" x2="100" y2="155" stroke="#ef4444" stroke-width="2.5"/><circle cx="100" cy="157" r="3" fill="#f87171"/>
<line x1="65" y1="110" x2="55" y2="110" stroke="#ef4444" stroke-width="2.5"/><circle cx="53" cy="110" r="3" fill="#f87171"/>
<text x="100" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#fca5a5">Pathogen / Antigen</text>
<!-- Cytokine Storm / Immune Activation Arrow -->
<path d="M150 110 L230 110" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
<!-- Systemic Cascade Box -->
<rect x="235" y="60" width="145" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<text x="307" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#fbbf24">Host Inflammatory Cascade</text>
<rect x="245" y="95" width="125" height="24" rx="4" fill="#0f172a"/>
<text x="307" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0">1. Cytokine Surge (IL-6/TNF)</text>
<rect x="245" y="125" width="125" height="24" rx="4" fill="#0f172a"/>
<text x="307" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0">2. Capillary Endothelial Leak</text>
<rect x="245" y="155" width="125" height="24" rx="4" fill="#0f172a"/>
<text x="307" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#f87171">3. Septic / Organ Hypoperfusion</text>
<!-- Biomarker Diagnostics below -->
<rect x="30" y="225" width="340" height="55" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
<text x="45" y="246" font-family="system-ui, sans-serif" font-size="8.5" fill="#38bdf8">Diagnostic Biomarkers: Procalcitonin, CRP, Blood Cultures, Molecular PCR</text>
<text x="45" y="266" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Targeted Antimicrobials: Early Source Control, Minimum Inhibitory Concentration (MIC) Titration</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Pathogen Virulence, Immune Response &amp; Antimicrobial Susceptibility</text>
</svg>
