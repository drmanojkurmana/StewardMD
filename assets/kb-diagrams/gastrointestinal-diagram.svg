<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="gdT gdD">
<title id="gdT">Gastrointestinal &amp; Abdomino-Pelvic Diagnostic Schematic</title>
<desc id="gdD">Cross-sectional and anatomical schematic of abdominal viscera: stomach, hepatobiliary tree, pancreas, and bowel loops.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Abdominal &amp; Hepatobiliary Diagnostic Schematic</text>
<!-- Liver -->
<path d="M120 70 C190 60 210 80 210 120 C210 150 160 160 110 150 C80 145 70 100 120 70 Z" fill="#991b1b" stroke="#dc2626" stroke-width="1.5"/>
<text x="145" y="110" font-family="system-ui, sans-serif" font-size="9" fill="#fecaca">Liver / Hepatic</text>
<!-- Gallbladder & Biliary Tree -->
<ellipse cx="160" cy="148" rx="8" ry="14" fill="#15803d" stroke="#22c55e" stroke-width="1.2"/>
<!-- Stomach -->
<path d="M210 90 C260 85 285 110 270 150 C255 180 210 170 195 155 C190 135 195 100 210 90 Z" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
<text x="240" y="130" font-family="system-ui, sans-serif" font-size="9" fill="#fef3c7">Stomach</text>
<!-- Pancreas -->
<path d="M185 155 C210 150 250 155 260 165 C250 175 200 175 180 165 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
<!-- Small / Large Bowel Loops -->
<rect x="110" y="185" width="180" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<path d="M130 205 C150 195 180 215 200 200 C220 215 250 195 270 205 M130 235 C150 225 180 245 200 230 C220 245 250 225 270 235 M130 265 C150 255 180 270 200 255 C220 270 250 255 270 265" stroke="#475569" stroke-width="2.5" fill="none"/>
<text x="200" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">Enteric Loops &amp; Mesenteric Flow</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Abdominal Anatomy: Hepatobiliary System, Pancreas &amp; Enteric Wall</text>
</svg>
