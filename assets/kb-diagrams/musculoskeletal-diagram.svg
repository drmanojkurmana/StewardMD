<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="msT msD">
<title id="msT">Musculoskeletal &amp; Rheumatologic Joint Diagnostic Schematic</title>
<desc id="msD">Synovial joint cross-section and bone architecture illustrating articular cartilage, synovium, bone marrow, and inflammatory pannus.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Musculoskeletal &amp; Synovial Articulation Schematic</text>
<!-- Upper Bone Cortex -->
<path d="M160 50 L160 110 C160 130 140 140 140 150 C140 160 170 160 200 160 C230 160 260 160 260 150 C260 140 240 130 240 110 L240 50 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<text x="200" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">Proximal Bone Cortex</text>
<!-- Articular Cartilage (Cyan) -->
<path d="M145 152 C170 158 230 158 255 152" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
<!-- Joint Space & Synovium -->
<path d="M130 140 C115 160 115 180 130 200 M270 140 C285 160 285 180 270 200" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
<text x="85" y="172" font-family="system-ui, sans-serif" font-size="8.5" fill="#fef3c7">Synovial Capsule</text>
<!-- Lower Bone Cortex -->
<path d="M140 190 C140 200 160 210 160 230 L160 290 L240 290 L240 230 C240 210 260 200 260 190 C230 180 170 180 140 190 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
<path d="M145 188 C170 182 230 182 255 188" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
<text x="200" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">Distal Articular Cortex</text>
<!-- Inflammatory Inset -->
<circle cx="270" cy="170" r="14" fill="#ef4444" fill-opacity="0.3" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="345" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#fca5a5">Synovitis / Pannus</text>
<text x="345" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#94a3b8">Cartilage Erosion</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Articular Cartilage, Synovial Fluid Analysis &amp; Cortical Alignment</text>
</svg>
