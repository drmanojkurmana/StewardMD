<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="vfT vfD">
<title id="vfT">ECG rhythm strip schematic: ventricular fibrillation</title>
<desc id="vfD">Stylised Lead II rhythm strip showing a chaotic irregular baseline with varying amplitude and no identifiable P waves, QRS complexes or T waves.</desc>
<defs>
<pattern id="vfgrid" width="50" height="50" patternUnits="userSpaceOnUse">
<rect width="50" height="50" fill="#fdf0f0"/>
<path d="M10 0 V50 M20 0 V50 M30 0 V50 M40 0 V50 M0 10 H50 M0 20 H50 M0 30 H50 M0 40 H50" stroke="#f3c1c1" stroke-width="0.7"/>
<path d="M0 0 H50 V50" stroke="#e08e8e" stroke-width="1.2" fill="none"/>
</pattern>
</defs>
<rect x="0" y="0" width="640" height="230" rx="8" fill="url(#vfgrid)"/>
<text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Ventricular fibrillation (schematic rhythm strip)</text>
<text x="16" y="48" font-family="sans-serif" font-size="11" fill="#6b7280">Lead II, 25 mm/s, 10 mm/mV</text>
<polyline fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round" points="30,150 44,146 56,138 66,150 76,162 86,142 96,118 106,140 116,168 126,150 136,128 146,148 156,172 166,146 176,120 186,144 196,166 206,140 216,116 226,142 236,164 246,144 256,122 266,146 276,168 286,142 296,124 306,150 316,170 326,148 336,126 346,150 356,172 366,148 376,130 386,154 396,174 406,150 416,128 426,152 436,172 446,148 456,126 466,150 476,170 486,146 496,124 506,148 516,168 526,144 536,122 546,146 556,166 566,142 576,124 586,148 596,164 606,148 616,136"/>
<line x1="30" y1="150" x2="616" y2="150" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="16" y="196" font-family="sans-serif" font-size="11" fill="#b42318">Chaotic baseline, varying amplitude</text>
<text x="16" y="212" font-family="sans-serif" font-size="11" fill="#b42318">No P wave, no QRS, no T wave: shockable, defibrillate at once</text>
</svg>
