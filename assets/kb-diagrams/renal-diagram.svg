<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="rdT rdD">
<title id="rdT">Renal &amp; Genitourinary Diagnostic Schematic</title>
<desc id="rdD">Nephrological and urinary tract schematic illustrating nephron filtration, corticomedullary junction, renal collecting system, and bladder.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Renal &amp; Nephrological Diagnostic Pathway</text>
<!-- Kidney Outline (Renal Parenchyma) -->
<path d="M160 65 C220 65 250 100 250 150 C250 190 220 230 170 230 C130 230 110 190 110 150 C110 100 130 65 160 65 Z" fill="#1e293b" stroke="#0284c7" stroke-width="2.5"/>
<!-- Renal Medulla Pyramids -->
<path d="M170 95 L195 110 L170 125 Z M170 135 L200 150 L170 165 Z M170 175 L195 190 L170 205 Z" fill="#0369a1"/>
<!-- Renal Pelvis & Ureter -->
<path d="M195 150 C215 150 220 180 220 280" stroke="#f59e0b" stroke-width="3.5" fill="none"/>
<text x="240" y="240" font-family="system-ui, sans-serif" font-size="9" fill="#fbbf24">Ureter</text>
<!-- Nephron Inset Box -->
<rect x="250" y="65" width="130" height="120" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.2"/>
<text x="315" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#38bdf8">Glomerulus &amp; Tubule</text>
<!-- Bowman's Capsule & Loop of Henle -->
<circle cx="280" cy="110" r="10" fill="#dc2626"/>
<path d="M290 110 C320 110 320 140 310 150 L310 170 M325 110 L325 170" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
<text x="315" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#cbd5e1">Loop of Henle</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Corticomedullary Differentiation, GFR Filtration &amp; Collecting System</text>
</svg>
