<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="hmT hmD">
<title id="hmT">Haematology &amp; Peripheral Blood Smear Diagnostic Schematic</title>
<desc id="hmD">Peripheral blood film morphology and haematopoietic differentiation illustrating erythrocyte indices, leukocytes, and thrombocytes.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Peripheral Blood Film &amp; Haematological Schematic</text>
<!-- Normal Erythrocyte (RBC) -->
<circle cx="110" cy="110" r="28" fill="#b91c1c" stroke="#ef4444" stroke-width="2"/>
<circle cx="110" cy="110" r="12" fill="#f87171" fill-opacity="0.6"/>
<text x="110" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#fca5a5">Biconcave RBC (Central Pallor)</text>
<!-- Leukocyte (Neutrophil with Multilobed Nucleus) -->
<circle cx="270" cy="110" r="34" fill="#312e81" stroke="#6366f1" stroke-width="2"/>
<ellipse cx="260" cy="100" rx="9" ry="12" fill="#818cf8"/>
<ellipse cx="280" cy="105" rx="10" ry="10" fill="#818cf8"/>
<ellipse cx="265" cy="125" rx="11" ry="8" fill="#818cf8"/>
<path d="M265 108 L275 110 M275 112 L270 120" stroke="#818cf8" stroke-width="2"/>
<text x="270" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#c7d2fe">Polymorphonuclear Leukocyte</text>
<!-- Platelets / Thrombocytes -->
<ellipse cx="190" cy="90" rx="5" ry="4" fill="#a855f7"/>
<ellipse cx="205" cy="105" rx="6" ry="5" fill="#a855f7"/>
<ellipse cx="180" cy="115" rx="5" ry="5" fill="#a855f7"/>
<text x="195" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e9d5ff">Thrombocytes</text>
<!-- Coagulation / Bone Marrow Inset -->
<rect x="30" y="195" width="340" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="45" y="215" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#38bdf8">Diagnostic Cellular Parameters &amp; Coagulation Cascade</text>
<text x="45" y="235" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">RBC Indices: MCV, MCH, RDW (Microcytic / Macrocytic / Normocytic Anemias)</text>
<text x="45" y="252" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1">Haemostatic Axis: PT/INR (Extrinsic), aPTT (Intrinsic), Fibrinogen &amp; D-dimer</text>
<text x="45" y="269" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Bone Marrow Lineages: Myeloid : Erythroid Ratio, Blasts &amp; Dysplastic Precursors</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Erythrocyte Morphology, Differential White Cell Count &amp; Haemostasis</text>
</svg>
