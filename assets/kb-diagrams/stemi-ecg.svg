<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="stT stD">
<title id="stT">ECG schematic: anterior ST elevation with reciprocal depression</title>
<desc id="stD">Two stylised rhythm strips. Upper strip shows convex ST elevation merging into tall T waves. Lower strip shows reciprocal ST depression in opposite leads.</desc>
<defs>
<pattern id="stgrid" width="50" height="50" patternUnits="userSpaceOnUse">
<rect width="50" height="50" fill="#fdf0f0"/>
<path d="M10 0 V50 M20 0 V50 M30 0 V50 M40 0 V50 M0 10 H50 M0 20 H50 M0 30 H50 M0 40 H50" stroke="#f3c1c1" stroke-width="0.7"/>
<path d="M0 0 H50 V50" stroke="#e08e8e" stroke-width="1.2" fill="none"/>
</pattern>
</defs>
<rect x="0" y="0" width="640" height="320" rx="8" fill="url(#stgrid)"/>
<text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Anterior STEMI pattern (schematic)</text>
<text x="16" y="46" font-family="sans-serif" font-size="11" fill="#6b7280">Anterior leads (e.g. V2 to V4): convex ST elevation</text>
<line x1="16" y1="140" x2="624" y2="140" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="4 4"/>
<polyline fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round" points="30,140 70,140 78,132 84,140 96,140 104,112 112,84 124,66 140,58 158,64 176,84 192,120 200,140 240,140 248,132 254,140 266,140 274,112 282,84 294,66 310,58 328,64 346,84 362,120 370,140 410,140 418,132 424,140 436,140 444,112 452,84 464,66 480,58 498,64 516,84 532,120 540,140 580,140"/>
<circle cx="104" cy="112" r="3.5" fill="#b42318"/>
<text x="300" y="96" font-family="sans-serif" font-size="11" fill="#b42318">Convex ST elevation</text>
<line x1="296" y1="100" x2="282" y2="88" stroke="#b42318" stroke-width="1"/>
<circle cx="274" cy="112" r="3.5" fill="#b42318"/>
<text x="540" y="108" font-family="sans-serif" font-size="10" fill="#6b7280">J point</text>
<text x="16" y="176" font-family="sans-serif" font-size="11" fill="#6b7280">Opposite (inferior) leads: reciprocal ST depression supports the diagnosis</text>
<line x1="16" y1="272" x2="624" y2="272" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="4 4"/>
<polyline fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round" points="30,272 90,272 98,280 106,292 118,300 134,300 148,292 158,278 166,262 174,272 230,272 238,280 246,292 258,300 274,300 288,292 298,278 306,262 314,272 370,272 378,280 386,292 398,300 414,300 428,292 438,278 446,262 454,272 510,272"/>
<text x="330" y="306" font-family="sans-serif" font-size="11" fill="#2556a8">Reciprocal ST depression</text>
<text x="470" y="312" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">Schematic, not patient tracings</text>
</svg>
