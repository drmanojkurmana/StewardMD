<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="ddT ddD">
<title id="ddT">Dermatology &amp; Cutaneous Histological Layer Schematic</title>
<desc id="ddD">Cross-section of the skin architecture illustrating epidermis, stratum corneum, dermo-epidermal junction, dermis, and vascular plexus.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Cutaneous Architecture &amp; Histopathological Schematic</text>
<!-- Stratum Corneum -->
<rect x="50" y="50" width="300" height="15" fill="#ca8a04"/>
<text x="35" y="62" font-family="system-ui, sans-serif" font-size="8" fill="#fef08a" text-anchor="end">Stratum Corneum</text>
<!-- Epidermis -->
<rect x="50" y="65" width="300" height="50" fill="#a16207"/>
<text x="35" y="92" font-family="system-ui, sans-serif" font-size="8" fill="#fed7aa" text-anchor="end">Epidermis</text>
<!-- Dermo-Epidermal Junction (Basement Membrane) -->
<path d="M50 115 C70 125 90 105 110 115 C130 125 150 105 170 115 C190 125 210 105 230 115 C250 125 270 105 290 115 C310 125 330 105 350 115" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
<text x="35" y="118" font-family="system-ui, sans-serif" font-size="7.5" fill="#7dd3fc" text-anchor="end">Basement Membrane</text>
<!-- Dermis & Papillae -->
<rect x="50" y="125" width="300" height="90" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="35" y="170" font-family="system-ui, sans-serif" font-size="8" fill="#cbd5e1" text-anchor="end">Dermis</text>
<!-- Dermal Capillary Loops & Inflammatory Infiltrate -->
<path d="M90 200 L90 140 C90 130 110 130 110 140 L110 200 M170 200 L170 140 C170 130 190 130 190 140 L190 200 M250 200 L250 140 C250 130 270 130 270 140 L270 200" stroke="#ef4444" stroke-width="2" fill="none"/>
<circle cx="100" cy="155" r="4" fill="#38bdf8"/><circle cx="180" cy="155" r="4" fill="#38bdf8"/><circle cx="260" cy="155" r="4" fill="#38bdf8"/>
<!-- Hypodermis / Subcutis -->
<rect x="50" y="215" width="300" height="55" fill="#451a03"/>
<text x="35" y="245" font-family="system-ui, sans-serif" font-size="8" fill="#fbcfe8" text-anchor="end">Subcutaneous Fat</text>
<text x="200" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#fef3c7">Lipocytes / Adipose Panniculus</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Epidermal Keratinocytes, Dermal Vasculature &amp; Perivascular Infiltrates</text>
</svg>
