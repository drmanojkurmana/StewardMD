<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="ndT ndD">
<title id="ndT">Neuroimaging &amp; Cranial Axis Diagnostic Schematic</title>
<desc id="ndD">Axial cranial CT/MRI brain slice schematic highlighting cerebral cortex, basal ganglia, ventricles, and neurovascular territories.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Neuroimaging &amp; Cranial CT/MRI Diagnostic Schematic</text>
<!-- Cranium Skull Vault -->
<ellipse cx="200" cy="165" rx="120" ry="130" fill="#1e293b" stroke="#64748b" stroke-width="5"/>
<ellipse cx="200" cy="165" rx="112" ry="122" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
<!-- Brain Parenchyma / Hemispheres -->
<path d="M198 50 C120 52 100 110 100 165 C100 220 120 275 198 280 Z" fill="#1e293b"/>
<path d="M202 50 C280 52 300 110 300 165 C300 220 280 275 202 280 Z" fill="#1e293b"/>
<!-- Interhemispheric Falx Cerebri -->
<line x1="200" y1="50" x2="200" y2="280" stroke="#475569" stroke-width="2"/>
<!-- Lateral Ventricles (Frontal & Occipital Horns) -->
<path d="M185 125 C170 125 165 145 185 175 C190 155 190 135 185 125 Z" fill="#0284c7"/>
<path d="M215 125 C230 125 235 145 215 175 C210 155 210 135 215 125 Z" fill="#0284c7"/>
<ellipse cx="200" cy="180" rx="4" ry="14" fill="#0284c7"/>
<!-- Vascular / Ischaemic or Hemorrhagic Lesion Focus -->
<circle cx="140" cy="160" r="16" fill="#ef4444" fill-opacity="0.4" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 2"/>
<!-- Callouts -->
<line x1="140" y1="160" x2="60" y2="160" stroke="#f87171" stroke-width="1"/>
<circle cx="140" cy="160" r="3" fill="#ef4444"/>
<text x="55" y="155" text-anchor="end" font-family="system-ui, sans-serif" font-size="8.5" fill="#fca5a5">Lesion Focus</text>
<text x="55" y="168" text-anchor="end" font-family="system-ui, sans-serif" font-size="7.5" fill="#94a3b8">Ischaemia / Bleed</text>
<line x1="215" y1="145" x2="330" y2="145" stroke="#38bdf8" stroke-width="1"/>
<circle cx="215" cy="145" r="3" fill="#38bdf8"/>
<text x="335" y="148" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">Ventricular System</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">Axial Neuroimaging: Sulcal Pattern, Ventricles &amp; Midline Symmetry</text>
</svg>
