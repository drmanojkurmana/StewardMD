<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="cdT cdD">
<title id="cdT">Cardiovascular Diagnostic & Hemodynamic Schematic</title>
<desc id="cdD">Schematic of cardiac chambers, electrical conduction axis, coronary perfusion pathways, and systemic vascular resistance dynamics.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Cardiovascular Diagnostic &amp; Hemodynamic Pathway</text>
<!-- Myocardium Outline -->
<path d="M140 70 C110 70 80 110 80 160 C80 230 160 280 200 295 C240 280 320 230 320 160 C320 110 290 70 260 70 C230 70 210 95 200 110 C190 95 170 70 140 70 Z" fill="#1e293b" stroke="#0284c7" stroke-width="2.5"/>
<!-- Conduction Nodes & Vector -->
<circle cx="160" cy="110" r="6" fill="#f59e0b"/>
<text x="135" y="105" font-family="system-ui, sans-serif" font-size="9" fill="#fbbf24">SA Node</text>
<circle cx="195" cy="150" r="5" fill="#f59e0b"/>
<text x="210" y="152" font-family="system-ui, sans-serif" font-size="9" fill="#fbbf24">AV Node</text>
<path d="M195 155 L195 210 L160 250 M195 210 L230 250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
<!-- Coronary Perfusion Artery -->
<path d="M210 85 C240 100 265 140 260 190 C255 230 220 270 200 285" stroke="#ef4444" stroke-width="3" fill="none"/>
<text x="268" y="135" font-family="system-ui, sans-serif" font-size="9" fill="#f87171">Coronary Perfusion (LAD/RCA)</text>
<!-- Diagnostic Vector Strip below -->
<rect x="25" y="235" width="130" height="60" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
<path d="M30 265 L45 265 L50 258 L55 265 L60 265 L65 242 L70 280 L75 265 L85 265 L95 250 L105 265 L145 265" stroke="#10b981" stroke-width="1.8" fill="none"/>
<text x="90" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">ECG Rhythm Strip &amp; ST Vector</text>
<!-- Annotations -->
<line x1="260" y1="180" x2="330" y2="180" stroke="#64748b" stroke-width="1"/>
<circle cx="260" cy="180" r="3" fill="#ef4444"/>
<text x="335" y="183" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">Ischaemia / Infarct Zone</text>
</svg>
