<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="capT capD">
<title id="capT">Chest X-ray schematic: right middle and lower lobe consolidation</title>
<desc id="capD">Stylised PA chest film showing dense opacity in the right mid and lower zones with dark branching air bronchograms and loss of the right heart border.</desc>
<rect x="0" y="0" width="400" height="470" rx="10" fill="#10151c"/>
<text x="200" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e6edf3">PA chest schematic: lobar consolidation</text>
<!-- chest wall -->
<path d="M70 60 C60 180 62 300 84 400" stroke="#3b4a5c" stroke-width="3" fill="none"/>
<path d="M330 60 C340 180 338 300 316 400" stroke="#3b4a5c" stroke-width="3" fill="none"/>
<!-- clavicles -->
<path d="M110 62 C140 52 170 54 192 66" stroke="#5b6b7f" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M290 62 C260 52 230 54 208 66" stroke="#5b6b7f" stroke-width="4" fill="none" stroke-linecap="round"/>
<!-- ribs left -->
<path d="M96 120 C130 112 160 114 186 126" stroke="#2c3846" stroke-width="2" fill="none"/>
<path d="M92 170 C128 162 160 164 188 176" stroke="#2c3846" stroke-width="2" fill="none"/>
<path d="M92 220 C128 212 160 214 188 226" stroke="#2c3846" stroke-width="2" fill="none"/>
<path d="M94 270 C128 262 158 264 184 276" stroke="#2c3846" stroke-width="2" fill="none"/>
<!-- ribs right -->
<path d="M304 120 C270 112 240 114 214 126" stroke="#2c3846" stroke-width="2" fill="none"/>
<path d="M308 170 C272 162 240 164 212 176" stroke="#2c3846" stroke-width="2" fill="none"/>
<!-- left lung (clear) -->
<path d="M104 84 C140 76 170 80 190 96 L188 300 C160 340 120 360 100 352 C88 300 88 160 104 84 Z" fill="#1a2431"/>
<path d="M120 140 L150 200 L138 260" stroke="#273444" stroke-width="2" fill="none"/>
<path d="M150 200 L172 230 M150 200 L132 236" stroke="#273444" stroke-width="1.5" fill="none"/>
<!-- trachea and carina -->
<path d="M200 66 L200 150" stroke="#8b98a9" stroke-width="6" stroke-linecap="round"/>
<path d="M200 150 L176 176 M200 150 L224 176" stroke="#8b98a9" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- heart -->
<path d="M200 190 C178 190 162 210 160 244 C158 286 176 322 200 336 C206 330 210 300 210 260 C210 230 208 200 200 190 Z" fill="#2b3646"/>
<!-- right heart border: effaced where consolidation touches it (dashed = silhouette sign) -->
<path d="M200 190 C208 200 210 230 210 260" stroke="#8b98a9" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<!-- right lung upper zone (clear) -->
<path d="M210 96 C236 82 266 78 296 86 C308 150 306 180 300 205 L214 205 C210 170 208 130 210 96 Z" fill="#1a2431"/>
<!-- consolidation: right mid and lower zones -->
<path d="M214 205 L300 205 C306 260 304 330 290 372 C270 392 240 398 222 390 L212 330 C210 290 210 245 214 205 Z" fill="#dfe7ef" fill-opacity="0.72"/>
<path d="M214 205 L300 205 C302 230 303 255 302 280" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
<!-- air bronchograms: dark branching lucencies inside the opacity -->
<path d="M252 230 L244 280 L232 320 M244 280 L262 306 M244 280 L230 302" stroke="#10151c" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M272 240 L268 290 L258 330 M268 290 L282 312" stroke="#10151c" stroke-width="3" fill="none" stroke-linecap="round"/>
<!-- diaphragm -->
<path d="M96 356 C130 336 170 336 192 356" stroke="#5b6b7f" stroke-width="3" fill="none"/>
<path d="M222 392 C250 378 280 378 296 372" stroke="#5b6b7f" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
<!-- callouts -->
<line x1="290" y1="250" x2="352" y2="230" stroke="#9fb3c8" stroke-width="1"/>
<circle cx="290" cy="250" r="3" fill="#9fb3c8"/>
<text x="356" y="226" font-family="sans-serif" font-size="11" fill="#c9d4e0">Consolidation:</text>
<text x="356" y="240" font-family="sans-serif" font-size="11" fill="#c9d4e0">right mid zone</text>
<line x1="248" y1="292" x2="150" y2="420" stroke="#9fb3c8" stroke-width="1"/>
<circle cx="248" cy="292" r="3" fill="#9fb3c8"/>
<text x="40" y="424" font-family="sans-serif" font-size="11" fill="#c9d4e0">Air bronchograms</text>
<line x1="208" y1="232" x2="150" y2="200" stroke="#9fb3c8" stroke-width="1"/>
<circle cx="208" cy="232" r="3" fill="#9fb3c8"/>
<text x="18" y="188" font-family="sans-serif" font-size="11" fill="#c9d4e0">Silhouette sign:</text>
<text x="18" y="202" font-family="sans-serif" font-size="11" fill="#c9d4e0">right heart border lost</text>
<text x="200" y="456" text-anchor="middle" font-family="sans-serif" font-size="10" font-style="italic" fill="#7d8b9c">Schematic illustration, not a patient image</text>
</svg>
