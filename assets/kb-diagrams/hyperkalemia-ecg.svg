<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="hkT hkD">
<title id="hkT">ECG schematic: hyperkalaemia with peaked tented T waves</title>
<desc id="hkD">Stylised Lead II rhythm strip showing sinus rhythm with flattened P waves, normal narrow QRS complexes and tall narrow-based peaked T waves.</desc>
<defs>
<pattern id="hkgrid" width="50" height="50" patternUnits="userSpaceOnUse">
<rect width="50" height="50" fill="#fdf0f0"/>
<path d="M10 0 V50 M20 0 V50 M30 0 V50 M40 0 V50 M0 10 H50 M0 20 H50 M0 30 H50 M0 40 H50" stroke="#f3c1c1" stroke-width="0.7"/>
<path d="M0 0 H50 V50" stroke="#e08e8e" stroke-width="1.2" fill="none"/>
</pattern>
</defs>
<rect x="0" y="0" width="640" height="250" rx="8" fill="url(#hkgrid)"/>
<text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Hyperkalaemia: peaked tented T waves (schematic)</text>
<text x="16" y="48" font-family="sans-serif" font-size="11" fill="#6b7280">Lead II, 25 mm/s, 10 mm/mV</text>
<line x1="16" y1="170" x2="624" y2="170" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="4 4"/>
<polyline fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="round" points="30,170 66,170 72,164 80,166 88,170 104,170 108,186 114,196 122,182 130,170 140,170 148,140 158,104 170,84 182,104 192,140 200,170 236,170 242,164 250,166 258,170 274,170 278,186 284,196 292,182 300,170 310,170 318,140 328,104 340,84 352,104 362,140 370,170 406,170 412,164 420,166 428,170 444,170 448,186 454,196 462,182 470,170 480,170 488,140 498,104 510,84 522,104 532,140 540,170 580,170"/>
<text x="196" y="80" font-family="sans-serif" font-size="11" fill="#b42318">Peaked tented T,</text>
<text x="196" y="94" font-family="sans-serif" font-size="11" fill="#b42318">narrow base</text>
<line x1="192" y1="98" x2="180" y2="92" stroke="#b42318" stroke-width="1"/>
<text x="404" y="216" font-family="sans-serif" font-size="11" fill="#6b7280">Flattened P, normal narrow QRS</text>
<text x="440" y="240" font-family="sans-serif" font-size="10" font-style="italic" fill="#6b7280">Schematic, not a patient tracing</text>
</svg>
