<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="pdT pdD">
<title id="pdT">Pulmonary &amp; Respiratory Diagnostic Imaging Schematic</title>
<desc id="pdD">Schematic chest radiograph and airway branching illustrating parenchymal consolidation, pleural interface, and gas exchange units.</desc>
<rect x="0" y="0" width="400" height="320" rx="10" fill="#0f172a"/>
<text x="200" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Respiratory &amp; Chest Radiograph Diagnostic Schematic</text>
<!-- Trachea & Bronchi -->
<path d="M200 45 L200 110" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
<path d="M200 110 L160 145 M200 110 L240 145" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
<path d="M160 145 L135 185 M160 145 L175 185 M240 145 L225 185 M240 145 L265 185" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
<!-- Lung Fields Outline -->
<path d="M110 80 C150 70 185 80 185 120 L180 250 C150 280 110 285 90 270 C80 230 80 130 110 80 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<path d="M290 80 C250 70 215 80 215 120 L220 250 C250 280 290 285 310 270 C320 230 320 130 290 80 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<!-- Parenchymal Infiltrate / Consolidation zone in right base -->
<path d="M225 190 C260 180 295 190 300 240 C280 270 240 270 225 240 Z" fill="#93c5fd" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
<!-- Cardiac Silhouette -->
<path d="M185 170 C170 170 160 190 160 220 C160 250 180 275 200 280 C215 275 220 250 220 220 C220 190 205 170 185 170 Z" fill="#334155"/>
<text x="185" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#94a3b8">Cardiac Shadow</text>
<!-- Callout Annotation -->
<line x1="280" y1="230" x2="340" y2="230" stroke="#38bdf8" stroke-width="1"/>
<circle cx="280" cy="230" r="3" fill="#38bdf8"/>
<text x="345" y="233" font-family="system-ui, sans-serif" font-size="8.5" fill="#cbd5e1">Infiltrate / Airspace Opacity</text>
<text x="200" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">CXR Architecture: Lung Fields, Air Bronchograms &amp; Pleural Margins</text>
</svg>
