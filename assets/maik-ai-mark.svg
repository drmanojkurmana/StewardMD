<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- MaiK AI mark: the ONE file for the "Ask MaiK" icon across the app (owner artwork placeholder, 2026-10-09).
       Traced automatically (potrace) from the owner's IMG_2673 / IMG_2672 (white geometric M of two chevron brackets, a four-point star, a
       small teal "AI" lower right; the lower-right bracket is lighter so it reads M + K). To swap in the final artwork, replace the shapes inside the three symbols and
       keep the ids and the 0 0 100 100 viewBox; nothing else in the app needs to change (maik-ai-mark.js injects
       this file as an inline sprite; vault/modules/MaiK.md, "MaiK AI mark").
       Symbols: mkai-full (M, star, teal AI; 28 px and up), mkai-mark (no AI; small sizes), mkai-tile (app-icon tile,
       40 px and up), mkai-tile-mark (the tile without AI, under 40 px); mkai-m and mkai-tile-bg-s are shared parts.
       Colours: the M and the star are currentColor; "AI" is var(--mkai-accent, #2fb3a6); the tile is a fixed
       dark teal gradient with a white mark, readable on light and dark screens. Fills are inline styles so no page
       CSS (icon rules like "svg * { fill: none }") can repaint the mark. -->
  <defs>
    <linearGradient id="mkai-k-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
    <mask id="mkai-k-fade" maskContentUnits="objectBoundingBox">
      <rect x=".82" y="0" width=".18" height="1" style="fill:url(#mkai-k-grad);stroke:none"/>
    </mask>
    <linearGradient id="mkai-tile-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4a4a"/>
      <stop offset=".55" stop-color="#0a3333"/>
      <stop offset="1" stop-color="#061e22"/>
    </linearGradient>
    <radialGradient id="mkai-tile-glow" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#2fb3a6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2fb3a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the M (two chevron brackets) and the star; shared by every variant -->
  <symbol id="mkai-m" viewBox="0 0 100 100">
    <g transform="matrix(0.0093023 0 0 -0.0093023 -17.8605 117.9070)">
      <path style="fill:inherit;stroke:none" d="M1927 12603 c-8 -15 -2 -4861 6 -4870 10 -10 690 -17 764 -8 l53 6 2 1550 3 1549 450 -442 c248 -242 752 -741 1120 -1107 369 -367 722 -717 785 -778 l115 -112 50 31 c28 18 160 95 295 174 134 78 246 147 248 154 5 15 -109 129 -3313 3301 -513 508 -571 563 -578 552z M12644 12597 c-7 -7 -205 -203 -440 -437 -236 -233 -685 -679 -999 -990 -313 -311 -990 -981 -1502 -1489 -513 -508 -933 -927 -933 -931 0 -3 35 -26 78 -50 149 -84 436 -252 471 -276 20 -13 42 -24 51 -24 15 0 392 368 1253 1225 799 796 1214 1205 1220 1205 4 0 8 -699 9 -1552 l3 -1553 300 -2 c165 0 350 1 410 4 l110 6 -3 1196 c-1 658 -2 1755 -2 2439 0 683 -3 1242 -7 1242 -5 -1 -13 -6 -19 -13z M2130 6871 l-205 -6 0 -2438 c0 -1838 3 -2437 12 -2435 25 6 3871 3828 3881 3857 2 5 -28 26 -65 47 -37 20 -135 78 -218 127 -234 140 -305 178 -321 175 -7 -2 -245 -233 -526 -513 -282 -281 -670 -665 -863 -855 -192 -190 -510 -503 -705 -696 -195 -192 -359 -353 -365 -356 -7 -4 -10 514 -10 1545 l0 1552 -205 1 c-113 0 -297 -2 -410 -5z"/>
      <path style="fill:inherit;stroke:none" d="M7286 11268 c-3 -13 -10 -66 -16 -118 -97 -824 -307 -1719 -524 -2235 -320 -757 -827 -1088 -2143 -1399 -257 -61 -647 -141 -915 -188 -71 -12 -128 -25 -128 -28 0 -4 37 -12 83 -19 289 -44 968 -189 1232 -262 229 -64 468 -143 655 -216 656 -258 959 -540 1214 -1128 177 -411 328 -971 442 -1650 54 -323 63 -376 85 -545 12 -96 25 -178 29 -183 3 -4 12 37 19 90 89 709 220 1353 381 1873 117 378 273 708 437 922 351 460 1124 778 2543 1047 146 28 289 53 318 57 78 10 55 19 -123 48 -321 53 -777 151 -1145 247 -1349 351 -1760 744 -2105 2014 -117 433 -218 952 -296 1533 -21 153 -32 191 -43 140z"/>
      <!-- lower right is lighter so the mark reads M + K: a faint leg and an upright that fades downward -->
      <path style="fill:inherit;fill-opacity:.2;stroke:none" d="M12048 6873 l-198 -3 -2 -1548 -3 -1547 -370 365 c-203 201 -512 505 -685 675 -173 171 -557 551 -852 845 -296 294 -545 536 -553 538 -8 2 -70 -29 -137 -69 -68 -39 -136 -80 -153 -89 -43 -24 -276 -160 -303 -177 -22 -13 17 -53 1315 -1346 1374 -1368 2307 -2295 2471 -2452 l92 -89 0 2452 0 2452 -212 -2 c-117 -2 -302 -4 -410 -5z"/>
      <path style="fill:inherit;stroke:none" mask="url(#mkai-k-fade)" d="M12048 6873 l-198 -3 -2 -1548 -3 -1547 -370 365 c-203 201 -512 505 -685 675 -173 171 -557 551 -852 845 -296 294 -545 536 -553 538 -8 2 -70 -29 -137 -69 -68 -39 -136 -80 -153 -89 -43 -24 -276 -160 -303 -177 -22 -13 17 -53 1315 -1346 1374 -1368 2307 -2295 2471 -2452 l92 -89 0 2452 0 2452 -212 -2 c-117 -2 -302 -4 -410 -5z"/>
    </g>
  </symbol>
  <!-- full mark: M, star and the teal AI (28 px and up) -->
  <symbol id="mkai-full" viewBox="0 0 100 100">
    <use href="#mkai-m" style="fill:currentColor;stroke:none"/>
    <path transform="translate(62.5 79.5) scale(.72) translate(-58.5 -80.6)" style="fill:var(--mkai-accent,#2fb3a6);stroke:none;fill-rule:evenodd" d="M58.5 96.6L63.9 80.6H67.1L72.5 96.6H69.1L68 93.4H63L61.9 96.6ZM63.9 90.6H67.1L65.5 85.9ZM75.4 80.6H78.6V96.6H75.4Z"/>
  </symbol>
  <!-- mark only, for small sizes (16 to 27 px): no AI -->
  <symbol id="mkai-mark" viewBox="0 0 100 100">
    <use href="#mkai-m" style="fill:currentColor;stroke:none"/>
  </symbol>
  <!-- the tile background, shared by both tiles -->
  <symbol id="mkai-tile-bg-s" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" style="fill:url(#mkai-tile-bg);stroke:none"/>
    <rect width="100" height="100" rx="22" style="fill:url(#mkai-tile-glow);stroke:none"/>
    <rect x=".5" y=".5" width="99" height="99" rx="21.5" style="fill:none;stroke:#63f0db;stroke-opacity:.28;stroke-width:1"/>
  </symbol>
  <!-- app-icon tile: dark teal gradient, white mark, teal AI (40 px and up) -->
  <symbol id="mkai-tile" viewBox="0 0 100 100">
    <use href="#mkai-tile-bg-s"/>
    <g transform="translate(20 20) scale(.6)">
      <use href="#mkai-m" style="fill:#fff;stroke:none"/>
      <path transform="translate(62.5 79.5) scale(.72) translate(-58.5 -80.6)" style="fill:#5fe0cf;stroke:none;fill-rule:evenodd" d="M58.5 96.6L63.9 80.6H67.1L72.5 96.6H69.1L68 93.4H63L61.9 96.6ZM63.9 90.6H67.1L65.5 85.9ZM75.4 80.6H78.6V96.6H75.4Z"/>
    </g>
  </symbol>
  <!-- the same tile without AI, for avatars under 40 px; the mark sits a little larger -->
  <symbol id="mkai-tile-mark" viewBox="0 0 100 100">
    <use href="#mkai-tile-bg-s"/>
    <g transform="translate(17 17) scale(.66)">
      <use href="#mkai-m" style="fill:#fff;stroke:none"/>
    </g>
  </symbol>
  <use href="#mkai-full" color="#fff"/>
</svg>
