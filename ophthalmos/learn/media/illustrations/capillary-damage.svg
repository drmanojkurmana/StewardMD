<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img">
<desc>Longitudinal cut-away of a retinal capillary. Left half healthy: endothelial lining, pericytes wrapped outside it, thin basement membrane, red cells in single file. Right half diabetic: pericytes lost, basement membrane thickened, a microaneurysm bulging from the wall, and fluid and yellow lipid leaking into the retina.</desc>
<defs>
<linearGradient id="cd-lumen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2a2e"/><stop offset=".5" stop-color="#6e3336"/><stop offset="1" stop-color="#4e2428"/></linearGradient>
<radialGradient id="cd-sac" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#6e3336"/><stop offset="1" stop-color="#4e2428"/></radialGradient>
<linearGradient id="cd-rbc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d24a3c"/><stop offset="1" stop-color="#96231f"/></linearGradient>
<linearGradient id="cd-endo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b3aa"/><stop offset="1" stop-color="#cf9a93"/></linearGradient>
<radialGradient id="cd-fluid" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#9fcbe6" stop-opacity=".26"/><stop offset="1" stop-color="#9fcbe6" stop-opacity="0"/></radialGradient>
<filter id="cd-tex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".015 .04" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .6 1.3 0 0 0 -.55"/></filter>
<filter id="cd-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
<clipPath id="cd-clip"><rect width="800" height="440" rx="24"/></clipPath>
</defs>
<g clip-path="url(#cd-clip)">
<rect width="800" height="440" fill="#141215"/>
<rect width="800" height="440" filter="url(#cd-tex)" opacity=".16"/>
<g fill="#262129" opacity=".7"><ellipse cx="192" cy="97" rx="8" ry="6"/><ellipse cx="779" cy="388" rx="10" ry="6"/><ellipse cx="456" cy="366" rx="9" ry="5"/><ellipse cx="223" cy="411" rx="12" ry="7"/><ellipse cx="94" cy="365" rx="9" ry="5"/><ellipse cx="198" cy="27" rx="11" ry="5"/><ellipse cx="69" cy="96" rx="9" ry="8"/><ellipse cx="367" cy="370" rx="12" ry="6"/><ellipse cx="140" cy="378" rx="12" ry="8"/><ellipse cx="661" cy="60" rx="10" ry="6"/><ellipse cx="519" cy="85" rx="10" ry="8"/><ellipse cx="245" cy="333" rx="10" ry="8"/><ellipse cx="698" cy="34" rx="13" ry="8"/><ellipse cx="39" cy="98" rx="8" ry="7"/><ellipse cx="280" cy="34" rx="9" ry="7"/><ellipse cx="329" cy="26" rx="8" ry="7"/><ellipse cx="601" cy="344" rx="12" ry="8"/><ellipse cx="68" cy="343" rx="11" ry="5"/></g>
<rect x="400" width="400" height="440" fill="#3a2a10" opacity=".08"/>
<g id="thickened-basement-membrane"><title>Thickened basement membrane</title><path d="M376 158C400 158 410 150 436 150L800 150L800 178L410 178C396 178 388 160 376 158Z" fill="#8f82a3"/><path d="M376 282C400 282 410 290 436 290L800 290L800 262L410 262C396 262 388 280 376 282Z" fill="#8f82a3"/><circle cx="610" cy="150" r="64" fill="#8f82a3"/><g fill="none" stroke="#c4b6d6" stroke-width="1.2" opacity=".55"><path d="M420 156L546 156M420 164L547 164M420 171L545 171M674 156L800 156M674 164L800 164M675 171L800 171"/><path d="M420 268L800 268M420 276L800 276M420 284L800 284"/><circle cx="610" cy="150" r="57"/><circle cx="610" cy="150" r="61"/></g></g>
<g id="basement-membrane"><title>Basement membrane (normal, thin)</title><g fill="none" stroke="#b9a9c9" stroke-width="2.6" opacity=".9"><path d="M0 158L384 158"/><path d="M0 282L384 282"/></g></g>
<g id="pericytes"><title>Pericytes (wrap the capillary)</title><g fill="#a77893"><path d="M20 177C40 170 55.0 168 75.0 168C95.0 168 110 170 130 177C110 175 40 175 20 177Z"/><ellipse cx="75.0" cy="168" rx="15" ry="6.5" fill="#6d3f6a"/><path d="M130 177C150 170 165.0 168 185.0 168C205.0 168 220 170 240 177C220 175 150 175 130 177Z"/><ellipse cx="185.0" cy="168" rx="15" ry="6.5" fill="#6d3f6a"/><path d="M250 177C270 170 285.0 168 305.0 168C325.0 168 340 170 360 177C340 175 270 175 250 177Z"/><ellipse cx="305.0" cy="168" rx="15" ry="6.5" fill="#6d3f6a"/><path d="M70 263C90 270 105.0 272 125.0 272C145.0 272 160 270 180 263C160 265 90 265 70 263Z"/><ellipse cx="125.0" cy="272" rx="15" ry="6.5" fill="#6d3f6a"/><path d="M190 263C210 270 225.0 272 245.0 272C265.0 272 280 270 300 263C280 265 210 265 190 263Z"/><ellipse cx="245.0" cy="272" rx="15" ry="6.5" fill="#6d3f6a"/><path d="M300 263C320 270 325.0 272 345.0 272C365.0 272 370 270 390 263C370 265 320 265 300 263Z"/><ellipse cx="345.0" cy="272" rx="15" ry="6.5" fill="#6d3f6a"/></g></g>
<g id="pericyte-loss"><title>Pericyte loss (empty pockets)</title><g fill="none" stroke="#d6c7e6" stroke-width="1.3" stroke-dasharray="3 3" opacity=".75"><ellipse cx="470" cy="172" rx="30" ry="5" /><ellipse cx="735" cy="172" rx="30" ry="5" /><ellipse cx="500" cy="268" rx="30" ry="5" /><ellipse cx="690" cy="268" rx="30" ry="5" /></g></g>
<rect x="0" y="190" width="800" height="60" fill="url(#cd-lumen)"/>
<path d="M0 205C60 200 90 214 150 208S260 196 330 210S470 216 560 204S700 200 800 210M100 190L96 250M230 190L240 250M360 190L352 250M480 190L490 250M720 190L712 250" fill="none" stroke="#8a4a4e" stroke-width="1" opacity=".45"/>
<g id="endothelium"><title>Endothelial cells (inner lining)</title><g fill="url(#cd-endo)"><rect x="0" y="178" width="402" height="12"/><rect x="0" y="250" width="402" height="12"/><rect x="398" y="178" width="402" height="12"/><rect x="398" y="250" width="402" height="12"/><path d="M566 178A52 52 0 1 1 654 178Z"/></g><g fill="#7a4a78" opacity=".95"><ellipse cx="70" cy="188" rx="24" ry="5.5"/><ellipse cx="250" cy="188" rx="24" ry="5.5"/><ellipse cx="700" cy="188" rx="24" ry="5.5"/><ellipse cx="150" cy="252" rx="24" ry="5.5"/><ellipse cx="330" cy="252" rx="24" ry="5.5"/><ellipse cx="480" cy="252" rx="24" ry="5.5"/><ellipse cx="740" cy="252" rx="24" ry="5.5"/></g><g stroke="#9a6a70" stroke-width="1.4"><path d="M120 178L123 190"/><path d="M200 178L203 190"/><path d="M300 178L303 190"/><path d="M380 178L383 190"/><path d="M470 178L473 190"/><path d="M690 178L693 190"/><path d="M770 178L773 190"/><path d="M60 250L63 262"/><path d="M240 250L243 262"/><path d="M390 250L393 262"/><path d="M560 250L563 262"/><path d="M660 250L663 262"/></g></g>
<g id="microaneurysm"><title>Microaneurysm (outpouching of the weakened wall)</title><circle cx="610" cy="150" r="43" fill="url(#cd-sac)"/><rect x="577" y="172" width="66" height="20" fill="#5c2b2f"/><g fill="url(#cd-rbc)"><ellipse cx="596" cy="134" rx="15" ry="9" transform="rotate(-25 596 134)"/><ellipse cx="624" cy="130" rx="15" ry="9" transform="rotate(20 624 130)"/><ellipse cx="610" cy="160" rx="15" ry="9"/><ellipse cx="586" cy="158" rx="12" ry="8" transform="rotate(40 586 158)"/><ellipse cx="634" cy="154" rx="12" ry="8" transform="rotate(-35 634 154)"/></g><g fill="#f2b0a4" opacity=".35"><ellipse cx="596" cy="134" rx="6" ry="3" transform="rotate(-25 596 134)"/><ellipse cx="624" cy="130" rx="6" ry="3" transform="rotate(20 624 130)"/><ellipse cx="610" cy="160" rx="6" ry="3"/></g></g>
<g id="red-blood-cells"><title>Red blood cells in single file</title><g fill="url(#cd-rbc)"><path d="M40 195C66 196 66 244 40 245C45 232 45 208 40 195Z"/><path d="M110 195C136 196 136 244 110 245C115 232 115 208 110 195Z"/><path d="M185 195C211 196 211 244 185 245C190 232 190 208 185 195Z"/><path d="M262 195C288 196 288 244 262 245C267 232 267 208 262 195Z"/><path d="M338 195C364 196 364 244 338 245C343 232 343 208 338 195Z"/><path d="M445 195C471 196 471 244 445 245C450 232 450 208 445 195Z"/><path d="M520 195C546 196 546 244 520 245C525 232 525 208 520 195Z"/><path d="M700 195C726 196 726 244 700 245C705 232 705 208 700 195Z"/><path d="M772 195C798 196 798 244 772 245C777 232 777 208 772 195Z"/></g></g>
<g id="leaking-fluid"><title>Leaking fluid (plasma)</title><ellipse cx="610" cy="340" rx="130" ry="44" fill="url(#cd-fluid)"/><ellipse cx="610" cy="66" rx="56" ry="20" fill="url(#cd-fluid)"/><g fill="#cfe4ef" opacity=".7"><circle cx="560" cy="270" r="2.2"/><circle cx="561" cy="284" r="2.6"/><circle cx="563" cy="300" r="3.0"/><circle cx="566" cy="316" r="3.4"/><circle cx="560" cy="332" r="3.0"/><circle cx="660" cy="270" r="2.2"/><circle cx="661" cy="284" r="2.6"/><circle cx="659" cy="300" r="3.0"/><circle cx="656" cy="316" r="3.4"/><circle cx="664" cy="334" r="3.0"/><circle cx="620" cy="352" r="3.0"/><circle cx="580" cy="356" r="2.6"/><circle cx="700" cy="346" r="2.8"/><circle cx="530" cy="344" r="2.6"/><circle cx="610" cy="80" r="2.4"/><circle cx="604" cy="68" r="2.8"/><circle cx="618" cy="58" r="3.0"/><circle cx="596" cy="54" r="2.4"/></g></g>
<g id="leaking-lipid"><title>Leaking lipid (forms hard exudates)</title><g fill="#f1cf55" stroke="#a87d18" stroke-width=".8"><circle cx="596" cy="336" r="5.5"/><circle cx="610" cy="346" r="4.5"/><circle cx="588" cy="350" r="4.0"/><circle cx="624" cy="336" r="4.0"/><circle cx="640" cy="352" r="4.5"/><circle cx="574" cy="340" r="3.5"/><circle cx="690" cy="362" r="4.0"/><circle cx="702" cy="354" r="3.2"/><circle cx="536" cy="364" r="3.6"/><circle cx="612" cy="364" r="3.4"/><circle cx="628" cy="44" r="3.6"/><circle cx="602" cy="40" r="3.0"/></g></g>
<g id="leaky-junctions"><title>Opened junctions between endothelial cells</title><g fill="#141215"><rect x="559" y="250" width="3.5" height="12"/><rect x="659" y="250" width="3.5" height="12"/></g></g>
<path d="M400 18V422" stroke="#a8a8b0" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round" opacity=".5"/>
</g>
