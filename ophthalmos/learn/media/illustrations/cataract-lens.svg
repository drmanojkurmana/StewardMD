<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img">
<desc>Two vertical sections of the eye with light entering from the left. Top: a clear lens; parallel rays pass the cornea and lens and meet at one sharp point on the retina. Bottom: a cataract; the cloudy yellow-white nucleus scatters the light, so only a dim, blurred patch reaches the retina.</desc>
<defs>
<clipPath id="ct-clip"><rect width="800" height="260" rx="22"/></clipPath>
<radialGradient id="ct-vit" cx="40%" cy="50%" r="60%"><stop offset="0" stop-color="#15141a"/><stop offset="1" stop-color="#1c1a22"/></radialGradient>
<linearGradient id="ct-iris" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6242"/><stop offset="1" stop-color="#5a3c28"/></linearGradient>
<radialGradient id="ct-clear" cx="45%" cy="45%" r="60%"><stop offset="0" stop-color="#e6f0f4" stop-opacity=".22"/><stop offset="1" stop-color="#c6d8e0" stop-opacity=".1"/></radialGradient>
<radialGradient id="ct-cortex" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#efe6d4" stop-opacity=".5"/><stop offset="1" stop-color="#d9d0c0" stop-opacity=".28"/></radialGradient>
<radialGradient id="ct-nuc" cx="45%" cy="45%" r="55%"><stop offset="0" stop-color="#f6e7b8"/><stop offset=".6" stop-color="#e3c47c"/><stop offset="1" stop-color="#c79a4e" stop-opacity=".6"/></radialGradient>
<radialGradient id="ct-spot"><stop offset="0" stop-color="#ffc05a" stop-opacity=".9"/><stop offset="1" stop-color="#ffc05a" stop-opacity="0"/></radialGradient>
<radialGradient id="ct-scat"><stop offset="0" stop-color="#fff0c8" stop-opacity=".35"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/></radialGradient>
<radialGradient id="ct-blur"><stop offset="0" stop-color="#ffc05a" stop-opacity=".45"/><stop offset="1" stop-color="#ffc05a" stop-opacity="0"/></radialGradient>
<filter id="ct-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="260"><feGaussianBlur stdDeviation="2.5"/></filter>
<filter id="ct-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="260"><feGaussianBlur stdDeviation=".9"/></filter>
<filter id="ct-haze" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
