<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img">
<desc>Front view of a right eye with the lids open, nose side to the right. White sclera covered by clear conjunctiva with fine tortuous surface vessels running in from the lid edges, a ring of fine straight deeper vessels just around the cornea, the brown iris and black pupil seen through the clear cornea, and the pink caruncle in the inner corner.</desc>
