<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
<title>Regular astigmatism: two meridians focus at two different points</title>
<style>
.ray{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 200}
.core{stroke-width:2.6}.glow{stroke-width:8;opacity:.16}

.va{animation:fanV 10s linear infinite}
@keyframes fanV{0%{stroke-dashoffset:100;opacity:1}22%{stroke-dashoffset:0;opacity:1}30%{opacity:1}36%{opacity:.25}60%{opacity:.25}66%{opacity:1}90%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
.ha{animation:fanH 10s linear infinite}
@keyframes fanH{0%,32%{stroke-dashoffset:100;opacity:1}54%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
.hd{animation:dashH 10s ease-out infinite}
@keyframes dashH{0%,50%{opacity:0}56%{opacity:1}90%{opacity:1}98%,100%{opacity:0}}
.mv{animation:mV 10s ease-out infinite}
@keyframes mV{0%,18%{opacity:0}24%{opacity:1}90%{opacity:1}98%,100%{opacity:0}}
.mh{animation:mH 10s ease-out infinite}
@keyframes mH{0%,50%{opacity:0}56%{opacity:1}90%{opacity:1}98%,100%{opacity:0}}
.iv{animation:iV 10s ease-out infinite}
@keyframes iV{0%{opacity:1}30%{opacity:1}36%{opacity:.2}60%{opacity:.2}66%{opacity:1}90%{opacity:1}98%,100%{opacity:1}}
.ih{animation:iH 10s ease-out infinite}
@keyframes iH{0%,30%{opacity:.2}36%{opacity:1}90%{opacity:1}98%,100%{opacity:.2}}
.st{animation:sturm 10s ease-out infinite}
@keyframes sturm{0%,62%{opacity:0;transform:translateY(-6px)}70%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}
.dash{stroke-dasharray:3 4;fill:none;stroke-width:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="vit" cx=".45" cy=".5" r=".6"><stop offset="0" stop-color="#1b2a33" stop-opacity=".55"/><stop offset="1" stop-color="#101a20" stop-opacity=".35"/></radialGradient><radialGradient id="lensg" cx=".55" cy=".45" r=".6"><stop offset="0" stop-color="#f3ecd8" stop-opacity=".55"/><stop offset="1" stop-color="#cdbd96" stop-opacity=".38"/></radialGradient></defs>
<g id="vitreous"><title>Vitreous</title><path d="M302 199.9 A138 138 0 0 1 440 62 A138 138 0 0 1 578 200 A138 138 0 0 1 440 338 A138 138 0 0 1 302 200.1 Z" fill="url(#vit)"/></g>
<g id="sclera"><title>Sclera</title><path d="M309.3 130.5 A148 148 0 0 1 440 52 A148 148 0 0 1 588 200 A148 148 0 0 1 440 348 A148 148 0 0 1 309.3 269.5" fill="none" stroke="#c7bfb2" stroke-width="9" stroke-linecap="round"/></g>
<g id="choroid"><title>Choroid</title><path d="M386 69.2 A141.5 141.5 0 0 1 440 58.5 A141.5 141.5 0 0 1 581.5 200 A141.5 141.5 0 0 1 440 341.5 A141.5 141.5 0 0 1 386 330.8" fill="none" stroke="#7b3a33" stroke-width="4.5"/></g>
<g id="retina"><title>Retina</title><path d="M386 73 A138 138 0 0 1 440 62 A138 138 0 0 1 578 200 A138 138 0 0 1 440 338 A138 138 0 0 1 386 327" fill="none" stroke="#e39a86" stroke-width="2.6"/></g>
<g id="fovea"><title>Fovea (centre of the macula)</title><ellipse cx="579.2" cy="200" rx="3.2" ry="15" fill="#b4574a" opacity=".85"/><ellipse cx="579.6" cy="200" rx="2" ry="5" fill="#6e2820"/></g>
<g id="optic-nerve"><title>Optic nerve</title><path d="M568.8 248.1 L584.9 257.7 Q601.3 273.3 689.1 309.4 L706.6 266.9 Q618.7 230.7 593.9 225 L575.2 225 Z" fill="#d3c6aa" stroke="#9a8b72" stroke-width="2.2" stroke-linejoin="round"/><path d="M573 236.8 L697.9 288.1" stroke="#b9ab90" stroke-width="3" stroke-dasharray="3 5" opacity=".7"/></g>
<g id="cornea"><title>Cornea</title><path d="M309.3 130.5 A97 97 0 0 0 309.3 269.5 L326.4 269.5 A81 81 0 0 1 326.4 130.5 Z" fill="#9cc6d6" fill-opacity=".28" stroke="#cfe6ee" stroke-opacity=".85" stroke-width="1.4"/></g>
<g id="ciliary-body"><title>Ciliary body</title><g class="cil-t "><path d="M320 123 L386 73 L380 83 L354 106 L347 133 L334 129 Z" fill="#8e4b40"/><path d="M337 126 L345 124 L341 131 Z M343 118 L351 115 L348 123 Z" fill="#a8604f"/></g><g class="cil-b "><path d="M320 277 L386 327 L380 317 L354 294 L347 267 L334 271 Z" fill="#8e4b40"/><path d="M337 274 L345 276 L341 269 Z M343 282 L351 285 L348 277 Z" fill="#a8604f"/></g></g>
<g id="zonules"><title>Zonules (suspensory ligament)</title><g fill="none" stroke="#d9d2c0" stroke-width=".9" opacity=".8"><path d="M344 132 L341 146 M348 133 L346 144 M352 131 L351 146 M344 268 L341 254 M348 267 L346 256 M352 269 L351 254"/></g></g>
<g id="lens"><title>Crystalline lens</title><g class="lens"><path d="M346 144 A125 125 0 0 0 346 256 A75 75 0 0 0 346 144 Z" fill="url(#lensg)" stroke="#efe6cf" stroke-opacity=".75" stroke-width="1.3"/></g></g>
<g id="iris"><title>Iris</title><path d="M318 123 L328 122 L335 152 L331 153 Z M318 277 L328 278 L335 248 L331 247 Z" fill="#8a5a3c" stroke="#8a5a3c" stroke-width="2" stroke-linejoin="round"/><path d="M328 123 L335 151 M328 277 L335 249" stroke="#3a2418" stroke-width="2" stroke-linecap="round"/></g><g id="cornea-front-view"><title>Front view of the toric cornea with its two principal meridians</title><circle cx="84" cy="74" r="40" fill="#9cc6d6" fill-opacity=".1" stroke="#cfe6ee" stroke-opacity=".7" stroke-width="1.4"/><circle cx="84" cy="74" r="12" fill="#1a1a1d" stroke="#8a5a3c" stroke-width="4"/><g id="vertical-meridian"><title>Vertical meridian (steeper)</title><g class="iv"><path d="M84 38 L84 110" stroke="#3b9dff" stroke-width="3.2" stroke-linecap="round"/></g></g><g id="horizontal-meridian"><title>Horizontal meridian (flatter)</title><g class="ih"><path d="M48 74 L120 74" stroke="#ff8a66" stroke-width="3.2" stroke-linecap="round"/></g></g></g><g id="vertical-meridian-rays"><title>Rays through the steeper vertical meridian</title><g class="va"><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 164 L286.9 164 L350 171.7 L542 200 L577.9 205.3"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 182 L281.7 182 L350 185.8 L542 200 L578 202.7"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 200 L280 200 L350 200 L542 200 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 218 L281.7 218 L350 214.2 L542 200 L578 197.3"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 236 L286.9 236 L350 228.3 L542 200 L577.9 194.7"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 164 L286.9 164 L350 171.7 L542 200 L577.9 205.3"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 182 L281.7 182 L350 185.8 L542 200 L578 202.7"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 200 L280 200 L350 200 L542 200 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 218 L281.7 218 L350 214.2 L542 200 L578 197.3"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 236 L286.9 236 L350 228.3 L542 200 L577.9 194.7"/></g></g><g id="horizontal-meridian-rays"><title>Rays through the flatter horizontal meridian</title><g class="ha"><path class="ray glow" pathLength="100" stroke="#ff8a66" d="M0 164 L286.9 164 L350 169.3 L577.9 195.6"/><path class="ray glow" pathLength="100" stroke="#ff8a66" d="M0 182 L281.7 182 L350 184.6 L578 197.8"/><path class="ray glow" pathLength="100" stroke="#ff8a66" d="M0 200 L280 200 L350 200 L578 200"/><path class="ray glow" pathLength="100" stroke="#ff8a66" d="M0 218 L281.7 218 L350 215.4 L578 202.2"/><path class="ray glow" pathLength="100" stroke="#ff8a66" d="M0 236 L286.9 236 L350 230.7 L577.9 204.4"/><path class="ray core" pathLength="100" stroke="#ff8a66" d="M0 164 L286.9 164 L350 169.3 L577.9 195.6"/><path class="ray core" pathLength="100" stroke="#ff8a66" d="M0 182 L281.7 182 L350 184.6 L578 197.8"/><path class="ray core" pathLength="100" stroke="#ff8a66" d="M0 200 L280 200 L350 200 L578 200"/><path class="ray core" pathLength="100" stroke="#ff8a66" d="M0 218 L281.7 218 L350 215.4 L578 202.2"/><path class="ray core" pathLength="100" stroke="#ff8a66" d="M0 236 L286.9 236 L350 230.7 L577.9 204.4"/></g></g><g class="hd"><path class="dash" stroke="#ff8a66" d="M577.9 195.6 L616 200"/><path class="dash" stroke="#ff8a66" d="M578 197.8 L616 200"/><path class="dash" stroke="#ff8a66" d="M578 200 L616 200"/><path class="dash" stroke="#ff8a66" d="M578 202.2 L616 200"/><path class="dash" stroke="#ff8a66" d="M577.9 204.4 L616 200"/></g><g id="first-focal-line"><title>First focal line (vertical meridian focus)</title><g class="mv"><circle cx="542" cy="200" r="4.5" fill="#fff6e0" stroke="#3b9dff" stroke-width="2"/></g></g><g id="second-focal-line"><title>Second focal line (horizontal meridian focus)</title><g class="mh"><circle cx="616" cy="200" r="4.5" fill="none" stroke="#ff8a66" stroke-width="2"/></g></g><g id="conoid-of-sturm"><title>Conoid of Sturm: beam shape at the first focal line, circle of least confusion and second focal line</title><g class="st"><path d="M515 66 L542 190" stroke="#a8a8b0" stroke-width="1.2" stroke-dasharray="2 4" opacity=".7"/><rect x="489" y="10" width="52" height="52" rx="12" fill="#1c1c1f" stroke="#3a3a40"/><path d="M500 36 L530 36" stroke="#f2f2f4" stroke-width="4" stroke-linecap="round"/><path d="M579 66 L579 190" stroke="#a8a8b0" stroke-width="1.2" stroke-dasharray="2 4" opacity=".7"/><rect x="553" y="10" width="52" height="52" rx="12" fill="#1c1c1f" stroke="#3a3a40"/><circle cx="579" cy="36" r="9" fill="none" stroke="#f2f2f4" stroke-width="3"/><path d="M643 66 L616 190" stroke="#a8a8b0" stroke-width="1.2" stroke-dasharray="2 4" opacity=".7"/><rect x="617" y="10" width="52" height="52" rx="12" fill="#1c1c1f" stroke="#3a3a40"/><path d="M643 21 L643 51" stroke="#f2f2f4" stroke-width="4" stroke-linecap="round"/></g></g>
</svg>
