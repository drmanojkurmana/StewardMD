<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" role="img">
<title>Glaucomatous cupping: the optic cup enlarges and the neuroretinal rim thins</title>
<style>
.cup{animation:cup 10s cubic-bezier(.77,0,.175,1) infinite;transform:translate(199px,203px) scale(.7,.8)}
@keyframes cup{0%,8%{transform:translate(200px,197px) scale(.3,.3)}50%{transform:translate(200px,201px) scale(.42,.62)}78%,90%{transform:translate(199px,203px) scale(.7,.8)}98%,100%{transform:translate(200px,197px) scale(.3,.3)}}
.gc{transform-origin:432px 200px;animation:gc 10s cubic-bezier(.77,0,.175,1) infinite;transform:scaleY(.8)}
@keyframes gc{0%,8%{transform:scaleY(.3)}50%{transform:scaleY(.62)}78%,90%{transform:scaleY(.8)}98%,100%{transform:scaleY(.3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="fund" cx=".53" cy=".5" r=".55"><stop offset="0" stop-color="#a24c2e"/><stop offset=".7" stop-color="#7a321f"/><stop offset="1" stop-color="#4a1c12"/></radialGradient><radialGradient id="rim" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#eda184"/><stop offset="1" stop-color="#d98566"/></radialGradient><radialGradient id="cupg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fdf4e2"/><stop offset=".72" stop-color="#f4e0bf"/><stop offset="1" stop-color="#eda184" stop-opacity="0"/></radialGradient><clipPath id="fc"><circle cx="200" cy="200" r="188"/></clipPath></defs><g id="fundus"><title>Retina around the optic disc (fundus view)</title><circle cx="200" cy="200" r="188" fill="url(#fund)"/></g><g id="optic-disc"><title>Optic disc</title><ellipse cx="204" cy="200" rx="74" ry="84" fill="#efcfae" opacity=".85"/></g><g id="neuroretinal-rim"><title>Neuroretinal rim</title><ellipse cx="204" cy="200" rx="71" ry="81" fill="url(#rim)"/></g><g id="optic-cup"><title>Optic cup</title><g class="cup"><ellipse rx="86" ry="96" fill="url(#cupg)"/></g></g><g id="retinal-veins"><title>Retinal veins</title><g clip-path="url(#fc)"><path d="M208 202 C208 188 208 176 206 166" fill="none" stroke="#7e2322" stroke-width="7" stroke-linecap="round"/><path d="M206 166 C196 136 172 108 132 86 S60 56 14 52" fill="none" stroke="#7e2322" stroke-width="7" stroke-linecap="round"/><path d="M206 166 C220 134 248 108 296 88 S360 66 390 62" fill="none" stroke="#7e2322" stroke-width="7" stroke-linecap="round"/><path d="M 208 198 C 208 212 208 224 206 234" fill="none" stroke="#7e2322" stroke-width="7" stroke-linecap="round"/><path d="M 206 234 C 196 264 172 292 132 314 S 60 344 14 348" fill="none" stroke="#7e2322" stroke-width="7" stroke-linecap="round"/><path d="M 206 234 C 220 266 248 292 296 312 S 360 334 390 338" fill="none" stroke="#7e2322" stroke-width="7" stroke-linecap="round"/></g></g><g id="retinal-arteries"><title>Retinal arteries</title><g clip-path="url(#fc)"><path d="M199 202 C199 188 199 178 198 168" fill="none" stroke="#c4493d" stroke-width="4.6" stroke-linecap="round"/><path d="M198 168 C186 142 160 120 122 102 S56 80 12 78" fill="none" stroke="#c4493d" stroke-width="4.6" stroke-linecap="round"/><path d="M198 168 C212 142 238 120 282 104 S350 88 392 88" fill="none" stroke="#c4493d" stroke-width="4.6" stroke-linecap="round"/><path d="M 199 198 C 199 212 199 222 198 232" fill="none" stroke="#c4493d" stroke-width="4.6" stroke-linecap="round"/><path d="M 198 232 C 186 258 160 280 122 298 S 56 320 12 322" fill="none" stroke="#c4493d" stroke-width="4.6" stroke-linecap="round"/><path d="M 198 232 C 212 258 238 280 282 296 S 350 312 392 312" fill="none" stroke="#c4493d" stroke-width="4.6" stroke-linecap="round"/></g></g><g id="cdr-gauge"><title>Cup-to-disc ratio gauge: cup height against disc height</title><rect x="426" y="116" width="12" height="168" rx="6" fill="#2c2c30"/><rect class="gc" x="426" y="116" width="12" height="168" rx="6" fill="#f4e0bf"/><path d="M418 116 L446 116 M418 284 L446 284" stroke="#a8a8b0" stroke-width="2" stroke-linecap="round"/></g>
</svg>
