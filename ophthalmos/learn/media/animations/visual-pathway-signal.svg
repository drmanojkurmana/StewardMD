<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img">
<title>Visual pathway: nasal fibres cross at the chiasm, temporal fibres stay on the same side</title>
<style>
.fb{fill:none;stroke-width:2.4;opacity:.38}
.pu{fill:none;stroke-width:5.5;stroke-linecap:round;stroke-dasharray:7 93;animation:pu 5s linear infinite}
@keyframes pu{from{stroke-dashoffset:7}to{stroke-dashoffset:-93}}
.d2{animation-delay:-2.5s}
.cx{animation:cx 5s ease-out infinite;opacity:.55}
@keyframes cx{0%,4%{opacity:.9}30%,100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pu{display:none}.fb{opacity:.9}}
</style>
<g id="brain-outline"><title>Brain seen from above</title><path d="M296 196 C226 192 150 212 124 276 C100 336 102 432 128 506 C154 576 222 620 294 624 Z M304 196 C374 192 450 212 476 276 C500 336 498 432 472 506 C446 576 378 620 306 624 Z" fill="#121214" stroke="#2c2c30" stroke-width="2"/></g><g id="visual-field"><title>Visual field: left half and right half</title><path d="M300 14 A28 28 0 0 0 300 70 Z" fill="#3b9dff" fill-opacity=".85"/><path d="M300 14 A28 28 0 0 1 300 70 Z" fill="#ff8a66" fill-opacity=".85"/><circle cx="300" cy="42" r="28" fill="none" stroke="#a8a8b0" stroke-width="1.5"/><circle cx="300" cy="42" r="2.5" fill="#f2f2f4"/></g><g id="right-eye"><title>Right eye</title><circle cx="390" cy="118" r="47" fill="#1c1c1f" stroke="#c7bfb2" stroke-width="3"/><path d="M370 76 A30 30 0 0 1 410 76" fill="#9cc6d6" fill-opacity=".2" stroke="#cfe6ee" stroke-width="1.5"/><ellipse cx="390" cy="86" rx="15" ry="7" fill="#e9dfc6" fill-opacity=".45"/></g><g id="right-temporal-retina"><title>Right eye temporal retina</title><path d="M431.8 131.6 A44 44 0 0 1 390 162" fill="none" stroke="#3b9dff" stroke-width="5" stroke-linecap="round"/></g><g id="right-nasal-retina"><title>Right eye nasal retina</title><path d="M390 162 A44 44 0 0 1 348.2 131.6" fill="none" stroke="#ff8a66" stroke-width="5" stroke-linecap="round"/></g><g id="left-eye"><title>Left eye</title><circle cx="210" cy="118" r="47" fill="#1c1c1f" stroke="#c7bfb2" stroke-width="3"/><path d="M190 76 A30 30 0 0 1 230 76" fill="#9cc6d6" fill-opacity=".2" stroke="#cfe6ee" stroke-width="1.5"/><ellipse cx="210" cy="86" rx="15" ry="7" fill="#e9dfc6" fill-opacity=".45"/></g><g id="left-temporal-retina"><title>Left eye temporal retina</title><path d="M210 162 A44 44 0 0 1 168.2 131.6" fill="none" stroke="#ff8a66" stroke-width="5" stroke-linecap="round"/></g><g id="left-nasal-retina"><title>Left eye nasal retina</title><path d="M251.8 131.6 A44 44 0 0 1 210 162" fill="none" stroke="#3b9dff" stroke-width="5" stroke-linecap="round"/></g><g id="right-optic-nerve"><title>Right optic nerve</title><path d="M390 166 C388 206 372 244 318 266" fill="none" stroke="#cfc3a8" stroke-opacity=".16" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g><g id="left-optic-nerve"><title>Left optic nerve</title><path d="M210 166 C212 206 228 244 282 266" fill="none" stroke="#cfc3a8" stroke-opacity=".16" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g><g id="optic-chiasm"><title>Optic chiasm</title><path d="M276 258 L324 258 L330 276 L270 276 Z" fill="#cfc3a8" fill-opacity=".16"/></g><g id="right-optic-tract"><title>Right optic tract</title><path d="M322 272 L378 350" fill="none" stroke="#cfc3a8" stroke-opacity=".16" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><g id="left-optic-tract"><title>Left optic tract</title><path d="M278 272 L222 350" fill="none" stroke="#cfc3a8" stroke-opacity=".16" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><g id="right-lgn"><title>Right lateral geniculate body</title><ellipse cx="380" cy="354" rx="20" ry="14" fill="#6b5a70" fill-opacity=".55"/></g><g id="left-lgn"><title>Left lateral geniculate body</title><ellipse cx="220" cy="354" rx="20" ry="14" fill="#6b5a70" fill-opacity=".55"/></g><g id="right-optic-radiation"><title>Right optic radiation</title><path d="M380 356 C424 404 446 462 416 520 C398 556 362 576 338 590" fill="none" stroke="#cfc3a8" stroke-opacity=".16" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g><g id="left-optic-radiation"><title>Left optic radiation</title><path d="M220 356 C176 404 154 462 184 520 C202 556 238 576 262 590" fill="none" stroke="#cfc3a8" stroke-opacity=".16" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g><g id="right-visual-cortex"><title>Right primary visual cortex (occipital lobe)</title><g class="cx"><path d="M306 566 C340 562 372 574 384 604 C360 618 330 622 306 622 Z" fill="#3b9dff" fill-opacity=".45"/></g></g><g id="left-visual-cortex"><title>Left primary visual cortex (occipital lobe)</title><g class="cx d2"><path d="M294 566 C260 562 228 574 216 604 C240 618 270 622 294 622 Z" fill="#ff8a66" fill-opacity=".45"/></g></g><g id="right-temporal-fibres"><title>Right temporal retina fibres (stay on the right)</title><path class="fb" stroke="#3b9dff" d="M424 146 Q414 164 394 166 C393 204 378 244 322 268 C338 290 360 318 380 352 C420 400 448 460 420 520 C400 560 360 580 340 592"/><path class="pu" pathLength="100" stroke="#3b9dff" d="M424 146 Q414 164 394 166 C393 204 378 244 322 268 C338 290 360 318 380 352 C420 400 448 460 420 520 C400 560 360 580 340 592"/></g><g id="left-nasal-fibres"><title>Left nasal retina fibres (cross to the right)</title><path class="fb" stroke="#3b9dff" d="M244 146 Q234 162 214 166 C215 202 234 240 300 272 C320 284 352 318 376 356 C414 404 440 462 412 520 C394 556 354 576 332 588"/><path class="pu" pathLength="100" stroke="#3b9dff" d="M244 146 Q234 162 214 166 C215 202 234 240 300 272 C320 284 352 318 376 356 C414 404 440 462 412 520 C394 556 354 576 332 588"/></g><g id="right-nasal-fibres"><title>Right nasal retina fibres (cross to the left)</title><path class="fb" stroke="#ff8a66" d="M356 146 Q366 162 386 166 C385 202 366 240 300 272 C280 284 248 318 224 356 C186 404 160 462 188 520 C206 556 246 576 268 588"/><path class="pu d2" pathLength="100" stroke="#ff8a66" d="M356 146 Q366 162 386 166 C385 202 366 240 300 272 C280 284 248 318 224 356 C186 404 160 462 188 520 C206 556 246 576 268 588"/></g><g id="left-temporal-fibres"><title>Left temporal retina fibres (stay on the left)</title><path class="fb" stroke="#ff8a66" d="M176 146 Q186 164 206 166 C207 204 222 244 278 268 C262 290 240 318 220 352 C180 400 152 460 180 520 C200 560 240 580 260 592"/><path class="pu d2" pathLength="100" stroke="#ff8a66" d="M176 146 Q186 164 206 166 C207 204 222 244 278 268 C262 290 240 318 220 352 C180 400 152 460 180 520 C200 560 240 580 260 592"/></g>
