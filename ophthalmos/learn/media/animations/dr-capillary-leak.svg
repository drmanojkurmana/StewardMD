dates"><title>Hard exudates (lipid deposits)</title><circle class="ex" cx="324" cy="156" r="4.5" style="--dx:78px;--dy:40px;animation-delay:0.00s"/><circle class="ex" cx="340" cy="124" r="3.6" style="--dx:62px;--dy:72px;animation-delay:0.12s"/><circle class="ex" cx="372" cy="100" r="5.0" style="--dx:30px;--dy:96px;animation-delay:0.24s"/><circle class="ex" cx="406" cy="92" r="4.0" style="--dx:-4px;--dy:104px;animation-delay:0.36s"/><circle class="ex" cx="438" cy="102" r="4.8" style="--dx:-36px;--dy:94px;animation-delay:0.48s"/><circle class="ex" cx="468" cy="126" r="3.8" style="--dx:-66px;--dy:70px;animation-delay:0.00s"/><circle class="ex" cx="486" cy="160" r="4.4" style="--dx:-84px;--dy:36px;animation-delay:0.12s"/><circle class="ex" cx="306" cy="188" r="3.4" style="--dx:96px;--dy:8px;animation-delay:0.24s"/><circle class="ex" cx="502" cy="192" r="3.2" style="--dx:-100px;--dy:4px;animation-delay:0.36s"/><circle class="ex" cx="354" cy="138" r="2.8" style="--dx:48px;--dy:58px;animation-delay:0.48s"/><circle class="ex" cx="454" cy="144" r="3.0" style="--dx:-52px;--dy:52px;animation-delay:0.00s"/><circle class="ex" cx="388" cy="116" r="2.6" style="--dx:14px;--dy:80px;animation-delay:0.12s"/><circle class="ex" cx="422" cy="120" r="2.8" style="--dx:-20px;--dy:76px;animation-delay:0.24s"/><circle class="ex" cx="292" cy="148" r="2.6" style="--dx:110px;--dy:48px;animation-delay:0.36s"/><circle class="ex" cx="514" cy="150" r="2.8" style="--dx:-112px;--dy:46px;animation-delay:0.48s"/></g>
</svg>
