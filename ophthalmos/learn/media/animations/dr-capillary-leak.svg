<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 800 300" role="img">
<title>Diabetic retinopathy: pericyte loss, microaneurysm and leakage forming hard exudates</title>
<style>
.flow{animation:flow 2.5s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(70px)}}
.pl{animation:plose 10s cubic-bezier(.23,1,.32,1) infinite;opacity:0}
@keyframes plose{0%,10%{opacity:1;transform:translateY(0)}24%,88%{opacity:0;transform:translateY(-5px)}96%,100%{opacity:1;transform:translateY(0)}}
.sac{transform-origin:402px 229px;animation:sac 10s cubic-bezier(.77,0,.175,1) infinite}
@keyframes sac{0%,26%{opacity:0;transform:scale(.8,.06)}30%{opacity:1}46%{transform:scale(1,1)}88%{opacity:1;transform:scale(1,1)}97%,100%{opacity:0;transform:scale(.8,.06)}}
.ex{fill:#ecc865;animation:leak 10s cubic-bezier(.23,1,.32,1) infinite}
@keyframes leak{0%,46%{opacity:0;transform:translate(var(--dx),var(--dy))}50%{opacity:.9}70%{opacity:1;transform:translate(0,0)}88%{opacity:1;transform:translate(0,0)}96%,100%{opacity:0;transform:translate(0,0)}}
.hz{transform-origin:402px 170px;animation:haze 10s ease-out infinite;opacity:.8}
@keyframes haze{0%,46%{opacity:0;transform:scale(.4)}72%,88%{opacity:.8;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="tis" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#241a1c"/><stop offset="1" stop-color="#110d0e"/></radialGradient><linearGradient id="lum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d1016"/><stop offset=".5" stop-color="#5a1a20"/><stop offset="1" stop-color="#3d1016"/></linearGradient><radialGradient id="hzg"><stop offset="0" stop-color="#e8c565" stop-opacity=".3"/><stop offset="1" stop-color="#e8c565" stop-opacity="0"/></radialGradient><clipPath id="tube"><rect x="0" y="230" width="800" height="50"/></clipPath></defs><g id="retinal-tissue"><title>Retinal tissue around the capillary</title><rect y="40" width="800" height="300" rx="18" fill="url(#tis)"/></g><g id="oedema"><title>Leaked plasma (retinal oedema)</title><ellipse class="hz" cx="402" cy="170" rx="150" ry="100" fill="url(#hzg)"/></g><g id="capillary-wall"><title>Capillary wall (endothelium)</title><rect x="0" y="222" width="800" height="66" fill="#b8716c"/><ellipse cx="40" cy="284" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="120" cy="226" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="200" cy="284" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="280" cy="226" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="360" cy="284" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="440" cy="226" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="520" cy="284" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="600" cy="226" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="680" cy="284" rx="14" ry="2.4" fill="#8e4c50"/><ellipse cx="760" cy="226" rx="14" ry="2.4" fill="#8e4c50"/></g><g id="capillary-lumen"><title>Capillary lumen with plasma</title><rect x="0" y="230" width="800" height="50" fill="url(#lum)"/></g><g id="red-blood-cells"><title>Red blood cells</title><g clip-path="url(#tube)"><g class="flow"><g transform="translate(-80 251) rotate(-15)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(-10 259) rotate(8)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(60 251) rotate(1)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(130 259) rotate(-6)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(200 251) rotate(-13)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(270 259) rotate(10)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(340 251) rotate(3)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(410 259) rotate(-4)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(480 251) rotate(-11)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(550 259) rotate(12)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(620 251) rotate(5)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(690 259) rotate(-2)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(760 251) rotate(-9)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g><g transform="translate(830 259) rotate(14)"><ellipse rx="12" ry="7.5" fill="#c4413c"/><ellipse rx="5.5" ry="3.2" fill="#dc6a5f"/></g></g></g></g><g id="microaneurysm"><title>Microaneurysm (outpouching of the capillary wall)</title><g class="sac"><path d="M364 229 C364 176 380 158 402 158 C424 158 440 176 440 229 Z" fill="#b8716c"/><path d="M372 233 C372 184 386 166 402 166 C418 166 432 184 432 233 Z" fill="#5a1a20"/><g transform="translate(39