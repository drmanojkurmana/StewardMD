<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
<title>Accommodation: for a near object the ciliary muscle contracts and the lens becomes rounder</title>
<style>
.ray{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 200}
.core{stroke-width:2.6}.glow{stroke-width:8;opacity:.16}

.lz{transform-origin:360px 200px;animation:lens 10s cubic-bezier(.77,0,.175,1) infinite;transform:scale(1.22,.9)}
@keyframes lens{0%,40%{transform:scale(1,1)}54%,84%{transform:scale(1.22,.9)}96%,100%{transform:scale(1,1)}}
.cil-t{transform-origin:368px 88px;animation:ct 10s cubic-bezier(.77,0,.175,1) infinite;transform:scale(1.06,1.2)}
.cil-b{transform-origin:368px 312px;animation:ct 10s cubic-bezier(.77,0,.175,1) infinite;transform:scale(1.06,1.2)}
@keyframes ct{0%,40%{transform:scale(1,1)}54%,84%{transform:scale(1.06,1.2)}96%,100%{transform:scale(1,1)}}
.zt{animation:zt 10s ease-in-out infinite;opacity:0}
@keyframes zt{0%,42%{opacity:1}52%,84%{opacity:0}94%,100%{opacity:1}}
.zs{animation:zs 10s ease-in-out infinite}
@keyframes zs{0%,42%{opacity:0}52%,84%{opacity:1}94%,100%{opacity:0}}
.far{animation:far 10s linear infinite;opacity:0}
@keyframes far{0%{stroke-dashoffset:100;opacity:1}22%{stroke-dashoffset:0;opacity:1}36%{stroke-dashoffset:0;opacity:1}42%,100%{stroke-dashoffset:0;opacity:0}}
.near{animation:near 10s linear infinite}
@keyframes near{0%,54%{stroke-dashoffset:100;opacity:1}72%{stroke-dashoffset:0;opacity:1}84%{stroke-dashoffset:0;opacity:1}90%,100%{stroke-dashoffset:0;opacity:0}}
.obj{animation:obj 10s ease-out infinite}
@keyframes obj{0%,42%{opacity:0;transform:translateX(-10px)}50%{opacity:1;transform:translateX(0)}84%{opacity:1;transform:translateX(0)}92%,100%{opacity:0;transform:translateX(0)}}
.pf{transform-box:fill-box;transform-origin:center;animation:pf 10s cubic-bezier(.77,0,.175,1) infinite;opacity:0}
@keyframes pf{0%,21%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.25)}30%{transform:scale(1)}36%{opacity:1}41%,100%{opacity:0}}
.pn{transform-box:fill-box;transform-origin:center;animation:pn 10s cubic-bezier(.77,0,.175,1) infinite}
@keyframes pn{0%,71%{opacity:0;transform:scale(.6)}75%{opacity:1;transform:scale(1.25)}80%{transform:scale(1)}84%{opacity:1}90%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><radialGradient id="vit" cx=".45" cy=".5" r=".6"><stop offset="0" stop-color="#1b2a33" stop-opacity=".55"/><stop offset="1" stop-color="#101a20" stop-opacity=".35"/></radialGradient><radialGradient id="lensg" cx=".55" cy=".45" r=".6"><stop offset="0" stop-color="#f3ecd8" stop-opacity=".55"/><stop offset="1" stop-color="#cdbd96" stop-opacity=".38"/></radialGradient></defs>
<g id="vitreous"><title>Vitreous</title><path d="M302 199.9 A138 138 0 0 1 440 62 A138 138 0 0 1 578 200 A138 138 0 0 1 440 338 A138 138 0 0 1 302 200.1 Z" fill="url(#vit)"/></g>
<g id="sclera"><title>Sclera</title><path d="M309.3 130.5 A148 148 0 0 1 440 52 A148 148 0 0 1 588 200 A148 148 0 0 1 440 348 A148 148 0 0 1 309.3 269.5" fill="none" stroke="#c7bfb2" stroke-width="9" stroke-linecap="round"/></g>
<g id="choroid"><title>Choroid</title><path d="M386 69.2 A141.5 141.5 0 0 1 440 58.5 A141.5 141.5 0 0 1 581.5 200 A141.5 141.5 0 0 1 440 341.5 A141.5 141.5 0 0 1 386 330.8" fill="none" stroke="#7b3a33" stroke-width="4.5"/></g>
<g id="retina"><title>Retina</title><path d="M386 73 A138 138 0 0 1 440 62 A138 138 0 0 1 578 200 A138 138 0 0 1 440 338 A138 138 0 0 1 386 327" fill="none" stroke="#e39a86" stroke-width="2.6"/></g>
<g id="fovea"><title>Fovea (centre of the macula)</title><ellipse cx="579.2" cy="200" rx="3.2" ry="15" fill="#b4574a" opacity=".85"/><ellipse cx="579.6" cy="200" rx="2" ry="5" fill="#6e2820"/></g>
<g id="optic-nerve"><title>Optic nerve</title><path d="M568.8 248.1 L584.9 257.7 Q601.3 273.3 689.1 309.4 L706.6 266.9 Q618.7 230.7 593.9 225 L575.2 225 Z" fill="#d3c6aa" stroke="#9a8b72" stroke-width="2.2" stroke-linejoin="round"/><path d="M573 236.8 L697.9 288.1" stroke="#b9ab90" stroke-width="3" stroke-dasharray="3 5" opacity=".7"/></g>
<g id="cornea"><title>Cornea</title><path d="M309.3 130.5 A97 97 0 0 0 309.3 269.5 L326.4 269.5 A81 81 0 0 1 326.4 130.5 Z" fill="#9cc6d6" fill-opacity=".28" stroke="#cfe6ee" stroke-opacity=".85" stroke-width="1.4"/></g>
<g id="ciliary-body"><title>Ciliary body</title><g class="cil-t "><path d="M320 123 L386 73 L380 83 L354 106 L347 133 L334 129 Z" fill="#8e4b40"/><path d="M337 126 L345 124 L341 131 Z M343 118 L351 115 L348 123 Z" fill="#a8604f"/></g><g class="cil-b "><path d="M320 277 L386 327 L380 317 L354 294 L347 267 L334 271 Z" fill="#8e4b40"/><path d="M337 274 L345 276 L341 269 Z M343 282 L351 285 L348 277 Z" fill="#a8604f"/></g></g>
<g id="zonules"><title>Zonules (suspensory ligament)</title><g fill="none" stroke="#d9d2c0" stroke-width=".9" opacity=".8"><g class="zt"><path d="M344 132 L341 146 M348 133 L346 144 M352 131 L351 146 M344 268 L341 254 M348 267 L346 256 M352 269 L351 254"/></g><g class="zs"><path d="M343 139 Q339 144 342 150 M347 140 Q343 145 346 149 M351 139 Q355 144 351 150 M343 261 Q339 256 342 250 M347 260 Q343 255 346 251 M351 261 Q355 256 351 250"/></g></g></g>
<g id="lens"><title>Crystalline lens</title><g class="lz"><path d="M346 144 A125 125 0 0 0 346 256 A75 75 0 0 0 346 144 Z" fill="url(#lensg)" stroke="#efe6cf" stroke-opacity=".75" stroke-width="1.3"/></g></g>
<g id="iris"><title>Iris</title><path d="M318 123 L328 122 L335 152 L331 153 Z M318 277 L328 278 L335 248 L331 247 Z" fill="#8a5a3c" stroke="#8a5a3c" stroke-width="2" stroke-linejoin="round"/><path d="M328 123 L335 151 M328 277 L335 249" stroke="#3a2418" stroke-width="2" stroke-linecap="round"/></g><g id="far-rays"><title>Parallel rays from a far object</title><g class="far"><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 164 L286.9 164 L350 170.4 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 182 L281.7 182 L350 185.2 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 200 L280 200 L350 200 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 218 L281.7 218 L350 214.8 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 236 L286.9 236 L350 229.6 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 164 L286.9 164 L350 170.4 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 182 L281.7 182 L350 185.2 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 200 L280 200 L350 200 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 218 L281.7 218 L350 214.8 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 236 L286.9 236 L350 229.6 L578 200"/></g></g><g id="near-rays"><title>Diverging rays from a near object</title><g class="near"><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M40 200.4 L285.1 169 L350 165.8 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M40 200 L281.2 184.5 L350 182.9 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M40 200 L280 200 L350 200 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M40 200 L281.2 215.5 L350 217.1 L578 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M40 199.6 L285.1 231 L350 234.2 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M40 200.4 L285.1 169 L350 165.8 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M40 200 L281.2 184.5 L350 182.9 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M40 200 L280 200 L350 200 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M40 200 L281.2 215.5 L350 217.1 L578 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M40 199.6 L285.1 231 L350 234.2 L578 200"/></g></g><g id="near-object"><title>Near object</title><g class="obj"><circle cx="40" cy="200" r="12" fill="#3b9dff" opacity=".3"/><circle cx="40" cy="200" r="5" fill="#f2f2f4"/></g></g><g id="far-focus"><title>Far object focused on the fovea</title><g class="pf"><circle cx="578" cy="200" r="11" fill="#3b9dff" opacity=".35"/><circle cx="578" cy="200" r="3.6" fill="#fff6e0"/></g></g><g id="near-focus"><title>Near object focused on the fovea</title><g class="pn"><circle cx="578" cy="200" r="11" fill="#3b9dff" opacity=".35"/><circle cx="578" cy="200" r="3.6" fill="#fff6e0"/></g></g>
</svg>
