<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img">
<title>Myopia: long eye focuses in front of the retina; a concave lens moves focus onto the retina</title>
<style>
.ray{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 200}
.core{stroke-width:2.6}.glow{stroke-width:8;opacity:.16}

.blue{animation:drawA 10s linear infinite}
@keyframes drawA{0%{stroke-dashoffset:100;opacity:1}24%{stroke-dashoffset:0;opacity:1}40%{stroke-dashoffset:0;opacity:1}48%,100%{stroke-dashoffset:0;opacity:0}}
.warm{animation:drawB 10s linear infinite}
@keyframes drawB{0%,50%{stroke-dashoffset:100;opacity:1}72%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
.bl,.mk{animation:showA 10s ease-out infinite}
@keyframes showA{0%,22%{opacity:0}29%{opacity:1}40%{opacity:1}48%,100%{opacity:0}}
.sl{animation:lensIn 10s cubic-bezier(.23,1,.32,1) infinite}
@keyframes lensIn{0%,41%{opacity:0;transform:translateX(-14px)}50%{opacity:1;transform:translateX(0)}90%{opacity:1;transform:translateX(0)}98%,100%{opacity:0;transform:translateX(0)}}
.pt{transform-box:fill-box;transform-origin:center;animation:pulse 10s cubic-bezier(.77,0,.175,1) infinite}
@keyframes pulse{0%,71%{opacity:0;transform:scale(.6)}75%{opacity:1;transform:scale(1.3)}80%{transform:scale(1)}85%{transform:scale(1.15)}90%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
.dash{stroke-dasharray:3 4;fill:none;stroke-width:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.blue,.bl,.mk{opacity:.0}}
</style>
<defs><radialGradient id="vit" cx=".45" cy=".5" r=".6"><stop offset="0" stop-color="#1b2a33" stop-opacity=".55"/><stop offset="1" stop-color="#101a20" stop-opacity=".35"/></radialGradient><radialGradient id="lensg" cx=".55" cy=".45" r=".6"><stop offset="0" stop-color="#f3ecd8" stop-opacity=".55"/><stop offset="1" stop-color="#cdbd96" stop-opacity=".38"/></radialGradient></defs>
<g id="vitreous"><title>Vitreous</title><path d="M302 199.9 A138 138 0 0 1 440 62 A210 138 0 0 1 650 200 A210 138 0 0 1 440 338 A138 138 0 0 1 302 200.1 Z" fill="url(#vit)"/></g>
<g id="sclera"><title>Sclera</title><path d="M309.3 130.5 A148 148 0 0 1 440 52 A220 148 0 0 1 660 200 A220 148 0 0 1 440 348 A148 148 0 0 1 309.3 269.5" fill="none" stroke="#c7bfb2" stroke-width="9" stroke-linecap="round"/></g>
<g id="choroid"><title>Choroid</title><path d="M386 69.2 A141.5 141.5 0 0 1 440 58.5 A213.5 141.5 0 0 1 653.5 200 A213.5 141.5 0 0 1 440 341.5 A141.5 141.5 0 0 1 386 330.8" fill="none" stroke="#7b3a33" stroke-width="4.5"/></g>
<g id="retina"><title>Retina</title><path d="M386 73 A138 138 0 0 1 440 62 A210 138 0 0 1 650 200 A210 138 0 0 1 440 338 A138 138 0 0 1 386 327" fill="none" stroke="#e39a86" stroke-width="2.6"/></g>
<g id="fovea"><title>Fovea (centre of the macula)</title><ellipse cx="651.2" cy="200" rx="3.2" ry="15" fill="#b4574a" opacity=".85"/><ellipse cx="651.6" cy="200" rx="2" ry="5" fill="#6e2820"/></g>
<g id="optic-nerve"><title>Optic nerve</title><path d="M636.8 247.5 L651.5 259.1 Q665.7 276.6 748.2 323.7 L771 283.7 Q688.5 236.7 664.7 227.7 L646.1 225.4 Z" fill="#d3c6aa" stroke="#9a8b72" stroke-width="2.2" stroke-linejoin="round"/><path d="M642.4 236.8 L759.6 303.7" stroke="#b9ab90" stroke-width="3" stroke-dasharray="3 5" opacity=".7"/></g>
<g id="cornea"><title>Cornea</title><path d="M309.3 130.5 A97 97 0 0 0 309.3 269.5 L326.4 269.5 A81 81 0 0 1 326.4 130.5 Z" fill="#9cc6d6" fill-opacity=".28" stroke="#cfe6ee" stroke-opacity=".85" stroke-width="1.4"/></g>
<g id="ciliary-body"><title>Ciliary body</title><g class="cil-t "><path d="M320 123 L386 73 L380 83 L354 106 L347 133 L334 129 Z" fill="#8e4b40"/><path d="M337 126 L345 124 L341 131 Z M343 118 L351 115 L348 123 Z" fill="#a8604f"/></g><g class="cil-b "><path d="M320 277 L386 327 L380 317 L354 294 L347 267 L334 271 Z" fill="#8e4b40"/><path d="M337 274 L345 276 L341 269 Z M343 282 L351 285 L348 277 Z" fill="#a8604f"/></g></g>
<g id="zonules"><title>Zonules (suspensory ligament)</title><g fill="none" stroke="#d9d2c0" stroke-width=".9" opacity=".8"><path d="M344 132 L341 146 M348 133 L346 144 M352 131 L351 146 M344 268 L341 254 M348 267 L346 256 M352 269 L351 254"/></g></g>
<g id="lens"><title>Crystalline lens</title><g class="lens"><path d="M346 144 A125 125 0 0 0 346 256 A75 75 0 0 0 346 144 Z" fill="url(#lensg)" stroke="#efe6cf" stroke-opacity=".75" stroke-width="1.3"/></g></g>
<g id="iris"><title>Iris</title><path d="M318 123 L328 122 L335 152 L331 153 Z M318 277 L328 278 L335 248 L331 247 Z" fill="#8a5a3c" stroke="#8a5a3c" stroke-width="2" stroke-linejoin="round"/><path d="M328 123 L335 151 M328 277 L335 249" stroke="#3a2418" stroke-width="2" stroke-linecap="round"/></g><g id="concave-lens"><title>Concave (minus) spectacle lens</title><g class="sl"><path d="M159 124 L181 124 Q171 200 181 276 L159 276 Q169 200 159 124 Z" fill="#cfe6ee" fill-opacity=".24" stroke="#dcecf2" stroke-opacity=".9" stroke-width="1.6"/></g></g><g id="uncorrected-rays"><title>Uncorrected light rays</title><g class="blue"><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 164 L286.9 164 L350 170.4 L578 200 L649.5 209.3"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 182 L281.7 182 L350 185.2 L578 200 L649.9 204.7"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 200 L280 200 L350 200 L578 200 L650 200"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 218 L281.7 218 L350 214.8 L578 200 L649.9 195.3"/><path class="ray glow" pathLength="100" stroke="#3b9dff" d="M0 236 L286.9 236 L350 229.6 L578 200 L649.5 190.7"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 164 L286.9 164 L350 170.4 L578 200 L649.5 209.3"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 182 L281.7 182 L350 185.2 L578 200 L649.9 204.7"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 200 L280 200 L350 200 L578 200 L650 200"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 218 L281.7 218 L350 214.8 L578 200 L649.9 195.3"/><path class="ray core" pathLength="100" stroke="#3b9dff" d="M0 236 L286.9 236 L350 229.6 L578 200 L649.5 190.7"/></g></g><g id="blur-circle"><title>Blur circle on the retina</title><g class="bl"><path d="M649.2 187.7 A210 138 0 0 1 649.2 212.3" fill="none" stroke="#3b9dff" stroke-width="14" stroke-linecap="round" opacity=".28"/><path d="M649.2 187.7 A210 138 0 0 1 649.2 212.3" fill="none" stroke="#3b9dff" stroke-width="5" stroke-linecap="round" opacity=".9"/></g></g><g id="focus-in-front-of-retina"><title>Uncorrected focus, in front of the retina</title><g class="mk"><circle cx="578" cy="200" r="5" fill="none" stroke="#3b9dff" stroke-width="2"/></g></g><g id="corrected-rays"><title>Light rays after the correcting lens</title><g class="warm"><path class="ray glow" pathLength="100" stroke="#ffc05a" d="M0 167.1 L170 167.2 L286.9 164 L350 168.5 L650 200"/><path class="ray glow" pathLength="100" stroke="#ffc05a" d="M0 183.5 L170 183.5 L281.7 182 L350 184.3 L650 200"/><path class="ray glow" pathLength="100" stroke="#ffc05a" d="M0 200 L170 200 L280 200 L350 200 L650 200"/><path class="ray glow" pathLength="100" stroke="#ffc05a" d="M0 216.5 L170 216.5 L281.7 218 L350 215.7 L650 200"/><path class="ray glow" pathLength="100" stroke="#ffc05a" d="M0 232.9 L170 232.8 L286.9 236 L350 231.5 L650 200"/><path class="ray core" pathLength="100" stroke="#ffc05a" d="M0 167.1 L170 167.2 L286.9 164 L350 168.5 L650 200"/><path class="ray core" pathLength="100" stroke="#ffc05a" d="M0 183.5 L170 183.5 L281.7 182 L350 184.3 L650 200"/><path class="ray core" pathLength="100" stroke="#ffc05a" d="M0 200 L170 200 L280 200 L350 200 L650 200"/><path class="ray core" pathLength="100" stroke="#ffc05a" d="M0 216.5 L170 216.5 L281.7 218 L350 215.7 L650 200"/><path class="ray core" pathLength="100" stroke="#ffc05a" d="M0 232.9 L170 232.8 L286.9 236 L350 231.5 L650 200"/></g></g><g id="corrected-focus"><title>Corrected focus on the fovea</title><g class="pt"><circle cx="650" cy="200" r="11" fill="#ffc05a" opacity=".35"/><circle cx="650" cy="200" r="3.6" fill="#fff6e0"/></g></g>
</svg>
