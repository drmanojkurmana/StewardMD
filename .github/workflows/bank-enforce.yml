name: Bank ENFORCE flip

# Sets or clears PREP_BANK_ENFORCE on the stewardmd Pages production
# environment and retries the latest production deployment so the new
# value takes effect. workflow_dispatch only; input "off" deletes the
# secret (gate returns to shadow logging on the next deployment).
on:
  workflow_dispatch:
    inputs:
      enforce:
        description: "on = enforce bank gate, off = shadow mode"
        type: choice
        options: [on, off]
        default: "on"

jobs:
  flip:
    runs-on: ubuntu-latest
    steps:
      - name: Set Pages secret and redeploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENFORCE: ${{ inputs.enforce }}
        run: |
          npm install -g wrangler@4
          if [ "$ENFORCE" = "on" ]; then
            printf '1' | npx wrangler pages secret put PREP_BANK_ENFORCE --project-name stewardmd
          else
            npx wrangler pages secret delete PREP_BANK_ENFORCE --project-name stewardmd || true
          fi
          npx wrangler pages secret list --project-name stewardmd
          # Retry the latest production deployment so the new secret applies.
          DEP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/stewardmd/deployments?env=production&per_page=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "retrying deployment $DEP"
          curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/stewardmd/deployments/$DEP/retry" | head -c 400
