name: Clean Knowledge Library references

on:
  push:
    branches: [feat/clean-reference-ui]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: feat/clean-reference-ui

      - name: Update Knowledge Library reference presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reasoning.js')
          s = p.read_text()

          old = 'var sub = [src.edition, src.tag, src.pages].filter(Boolean).join(" · ");'
          new = 'var sub = [src.edition, src.tag].filter(Boolean).join(" · ");'
          if old not in s:
              raise SystemExit('Expected reference header expression not found')
          s = s.replace(old, new, 1)

          old = "cite: '<strong>' + rIco(\"book\") + ' ' + esc(srcName) + ' (22e)</strong>' + (pages.length ? ' — pp. ' + pages.join(\", \") : \"\") + '<br>Reference knowledge paraphrased &amp; page-cited. Not a treatment regimen — verify against full guidelines before acting.'"
          new = "cite: '<strong>Reference</strong><br>Harrison\\'s Principles of Internal Medicine, 22nd Edition<br>Oxford Textbook of Medicine<br>Davidson\\'s Principles and Practice of Medicine'"
          if old not in s:
              raise SystemExit('Expected reference footer expression not found')
          s = s.replace(old, new, 1)

          old = "(harrisonRef(id, { expanded: true }) || '<p class=\"dx-sel-empty\">No Harrison reference loaded for this disease.</p>') + (refInf ? '' : '<button class=\"dx-select ' + (inf ? \"inf\" : \"ni\") + '\" data-sel=\"' + id + '\">Open full ' + (inf ? \"stewardship\" : \"management\") + ' page →</button>') + '<div class=\"dx-mgmt-disc\">' + rIco(\"warn\") + ' Decision-support only. Reference knowledge is paraphrased from Harrison\\'s 22e and standard guidelines. Verify against full guidelines and prescribing references before acting.</div></div>'"
          new = "(harrisonRef(id, { expanded: true }) || '<p class=\"dx-sel-empty\">No reference loaded for this disease.</p>') + (refInf ? '' : '<button class=\"dx-select ' + (inf ? \"inf\" : \"ni\") + '\" data-sel=\"' + id + '\">Open full ' + (inf ? \"stewardship\" : \"management\") + ' page →</button>') + '</div>'"
          if old not in s:
              raise SystemExit('Expected reader disclaimer expression not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate
        run: node --check reasoning.js

      - name: Commit and remove this workflow
        run: |
          rm -f .github/workflows/clean-reference-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reasoning.js .github/workflows/clean-reference-ui.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(kb): simplify Knowledge Library references"
          git push origin feat/clean-reference-ui
