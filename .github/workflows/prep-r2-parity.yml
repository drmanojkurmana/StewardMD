name: prep-r2-parity
# Everything the app reads from R2 must exist there. Merging content does not upload it (tools/prep-r2-sync.mjs does),
# and a skipped upload silently hides modules, lessons and MCQs from every phone (owner 2026-10-17: 1,110 interventional
# radiology MCQs merged and invisible). This job reads the live bank with the tools credential and goes red when the repo
# lists a file R2 does not have. ota-publish.yml runs the same check and refuses to publish while it fails.
on:
  push:
    branches: [main]
    paths:
      - "prep/**"
      - "tools/prep-r2-*.mjs"
      - "tools/prep-gate-smoke.mjs"
      - "functions/api/prep/session.js"
      - "functions/_prep_bank_gate.js"
      - "prep-bank-client.js"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "prep/**"
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo content versus live R2
        env:
          SMD_TOOL_TOKEN: ${{ secrets.SMD_TOOL_TOKEN }}
        # On a pull request the upload has not happened yet, so the report is informational there; on main, on the
        # schedule and before an OTA publish it is a hard failure.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          node tools/prep-r2-parity.mjs
      - name: Bank gate answers the native iOS app (session route, no Origin header)
        # A pull request is judged before its deploy, so it is informational there; main and the schedule are hard failures.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: node tools/prep-gate-smoke.mjs
