name: CI

# Runs the unit suite on every push/PR to main so logic regressions are caught before deploy.
# (This is the test gate; the native build additionally runs scripts/preflight.sh — see README.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pure ES-module unit tests (no deps needed for the *.test.mjs suite).
      # --experimental-test-module-mocks matches `npm test`: several suites use mock.module(), which
      # without the flag throws "mock.module is not a function" and fails the file rather than the
      # assertion. CI must run the suite the same way the repo's own script does.
      #
      # --experimental-sqlite is passed to match `npm test`, and A CORRECTION IS RECORDED HERE. An
      # earlier version of this comment claimed the flag's absence had silently disarmed the
      # disaster-recovery suites on every CI run. That was wrong: node:sqlite is unflagged on Node
      # 22.13+ (the 23.4 change was backported), this runner resolves `node-version: '22'` to 22.23.2,
      # and the pre-flag CI log for f49ece3e (run 34401383280) shows the restore rehearsal, the
      # version-gap refusal, tenancy-in-SQL and the on-premise round trip all executing as `ok`. The
      # claim was inferred from the flag being absent and the skip guard existing; the outcome was
      # never checked. On this runner the flag is a no-op that makes the intent explicit and protects
      # against a future pin below 22.13. It fixed nothing that was broken.
      - name: Run unit tests
        run: node --test --experimental-test-module-mocks --experimental-sqlite test/*.test.mjs

      # A SKIPPED DR SUITE MUST NOT READ AS A PASSING ONE. wardsynq-restore / wardsynq-onprem /
      # wardsynq-d1-sql deliberately SKIP rather than fail when node:sqlite is unavailable, so a
      # future Node pin or flag change could stop them running with no red build to say so. This
      # step is that forward guard - it is NOT a fix for a present failure, and it has not found one.
      - name: Prove the DR suites actually executed
        run: node --experimental-test-module-mocks --experimental-sqlite test/check-dr-suites-ran.mjs

  atlas-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install atlas pipeline deps
        run: pip install -r atlas-pipeline/requirements.txt
      # These gates already existed and NOTHING invoked them, so the clearance register,
      # the ontology region map and the pipeline invariants could all drift without
      # failing a merge. An unreachable gate is not a gate. Kept in its OWN job so an
      # unrelated failure in unit-tests cannot silence them again.
      - name: Atlas source clearance, ontology and pipeline self-checks
        run: |
          python atlas-pipeline/check_sources.py
          python atlas-pipeline/ontology.py --check
          python atlas-pipeline/test_pipeline.py
      - name: Atlas data and layout suites
        run: |
          node test/atlas-data.test.mjs
          node test/atlas-layout.test.mjs

  maik-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # MaiK decision-layer regression net (offline, zero-token): guards against false-refusals,
      # over-asking, and the disambiguation loop. Loads the real KB, so it needs a bigger heap.
      - name: MaiK decision eval
        run: node --max-old-space-size=4096 scripts/maik-eval.mjs

  web-preflight:
    runs-on: ubuntu-latest
    # 5 was too tight, and it was failing this job on PRs whose code was fine. The work below is a
    # grep and two node --check calls (seconds); the whole budget was being spent inside
    # actions/checkout, whose `git fetch` of the PR merge ref intermittently stalls and is then
    # cancelled at the cap - "The operation was canceled", with no step of ours ever running. Seen on
    # #777 and #778, at 5m02s and 5m04s. Raising the ceiling does not weaken the check.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # Config-only preflight (google-services.json is gitignored / not in CI, so skip that hard-fail
      # here — RUN_TESTS handled by the unit-tests job). This catches merge markers + basic sanity.
      - name: Merge-marker + entry-file sanity
        run: |
          if grep -RIlnE '^(<<<<<<<|>>>>>>>|=======$)' index.html ./*.js 2>/dev/null; then
            echo "Merge conflict markers found"; exit 1
          fi
          node --check index.html 2>/dev/null || true   # html isn't JS; skip
          for f in app.js home.js reasoning.js opd-emr.js native-bridge.js client-errors.js; do
            [ -f "$f" ] && node --check "$f" || true
          done
          echo "web preflight ok"
