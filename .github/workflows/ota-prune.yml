name: OTA — prune old builds

# Owner rule (2026-11-03): only the last 10 published OTA builds stay in R2; older builds are deleted automatically
# after every publish. scripts/ota-prune.mjs keeps the 10 newest versions in ota/history.json plus the live channel
# and the staged candidate, rewrites ota/known-hashes.json first, then deletes unreferenced files and old manifests,
# and fails if the live build is missing any file afterwards.

on:
  workflow_run:
    workflows: ["OTA — publish live"]
    types: [completed]
  workflow_dispatch:
    inputs:
      keep:
        description: "How many published builds to keep"
        default: "10"

# Same group as ota-stage.yml so a prune never runs while a build is being staged (staging skips hashes listed in
# ota/known-hashes.json). A new ota-stage run (cancel-in-progress there) may still cancel a running prune: that is
# safe, because the prune rewrites known-hashes.json before deleting anything, and the next prune finishes the job.
concurrency:
  group: ota-stage
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Keep the last N published builds, delete the rest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ota-prune.mjs --keep "${{ inputs.keep || '10' }}" --apply
