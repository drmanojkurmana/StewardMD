name: Dx + antibiotic accuracy
# Replays the gold cases and the held-out set through the real reasoning engine in headless Chrome
# and fails if any accuracy or antibiotic-gate count is worse than kb/validation/dx-floors.json.
# Plan: kb/validation/PLAN-DX-ABX-10.md (Phase 0). A deliberate change that moves a number is
# recorded with `node test/run-dx-audit.mjs --write-floors` in the same PR, so the diff shows it.
on:
  pull_request:
    branches: [main]
    paths: ['reasoning.js', 'app.js', 'clinical-nlp.js', 'clinical-vocab.js', 'dxmgmt.js', 'opd-emr.js', 'abx-wizard.js',
      'kb/dist/**', 'kb/validation/**', 'test/run-dx-audit.mjs', 'test/run-gate-v2.mjs', 'test/run-rank-v3.mjs', 'test/run-kb-v2.mjs', 'test/run-calib.mjs', 'test/run-prior.mjs', 'test/run-dx-ask.mjs', 'test/run-dx-simple.mjs', 'reasoning-workspace.css', 'test/dx-heldout.json', 'test/dx-heldout-2.json', 'sw.js', 'index.html', '.github/workflows/dx-accuracy.yml']
  push:
    branches: [main]
    paths: ['reasoning.js', 'app.js', 'clinical-nlp.js', 'clinical-vocab.js', 'dxmgmt.js', 'opd-emr.js', 'abx-wizard.js',
      'kb/dist/**', 'kb/validation/**', 'test/run-dx-audit.mjs', 'test/run-gate-v2.mjs', 'test/run-rank-v3.mjs', 'test/run-kb-v2.mjs', 'test/run-calib.mjs', 'test/run-prior.mjs', 'test/run-dx-ask.mjs', 'test/run-dx-simple.mjs', 'reasoning-workspace.css', 'test/dx-heldout.json', 'test/dx-heldout-2.json', 'sw.js', 'index.html', '.github/workflows/dx-accuracy.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROME: /usr/bin/google-chrome
      CHROME_FLAGS: --no-sandbox --disable-dev-shm-usage
      BASE: http://localhost:8804/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shipped config (flags at their defaults)
        run: node test/run-dx-audit.mjs --check
      - name: Antibiotic gate v2 (smd_gate_v2, default OFF until the owner approves)
        run: FLAGS=smd_gate_v2=1 node test/run-dx-audit.mjs --check
      - name: Text extraction v2 (smd_nlp_v2, default OFF until the owner approves)
        run: FLAGS=smd_nlp_v2=1 node test/run-dx-audit.mjs --check
      - name: Gate + extraction
        run: FLAGS=smd_gate_v2=1,smd_nlp_v2=1 node test/run-dx-audit.mjs --check
      - name: Differential ordering v3 (smd_rank_v3, default OFF until the owner approves)
        run: FLAGS=smd_rank_v3=1 node test/run-dx-audit.mjs --check
      - name: Gate + extraction + ordering
        run: FLAGS=smd_gate_v2=1,smd_nlp_v2=1,smd_rank_v3=1 node test/run-dx-audit.mjs --check
      - name: Knowledge-base additions (smd_kb_v2, default OFF until the owner approves)
        run: FLAGS=smd_kb_v2=1 node test/run-dx-audit.mjs --check
      - name: Not enough information (smd_calib, default OFF until the owner approves)
        run: FLAGS=smd_calib=1 node test/run-dx-audit.mjs --check
      - name: Prevalence prior (smd_prior_v1, default OFF; the balanced gold set cannot validate it)
        run: FLAGS=smd_prior_v1=1 node test/run-dx-audit.mjs --check
      - name: All five plan flags
        run: FLAGS=smd_gate_v2=1,smd_nlp_v2=1,smd_rank_v3=1,smd_kb_v2=1,smd_calib=1 node test/run-dx-audit.mjs --check
      - name: All five plus the prevalence prior
        run: FLAGS=smd_gate_v2=1,smd_nlp_v2=1,smd_rank_v3=1,smd_kb_v2=1,smd_calib=1,smd_prior_v1=1 node test/run-dx-audit.mjs --check
      - name: Knowledge-base additions behaviour (cholangitis vs viral hepatitis, SBP, note numbers)
        run: node test/run-kb-v2.mjs
      - name: Not enough information behaviour (engine, red flags, workspace, OPD, wizard)
        run: node test/run-calib.mjs
      - name: Differentiating questions on Select (smd_dx_ask; engine, panel, purity, phone width)
        run: node test/run-dx-ask.mjs
      - name: Plain view of the workspace (smd_dx_simple; presentation only, engine unchanged)
        run: node test/run-dx-simple.mjs
      - name: Prevalence prior behaviour (order only, tiers, can't-miss guard, hospital counts)
        run: node test/run-prior.mjs
      - name: Differential ordering v3 behaviour (order only, anchors, disqualifiers, negatives, OPD)
        run: node test/run-rank-v3.mjs
      - name: Antibiotic gate v2 behaviour (engine, workspace, wizard; flag on and off)
        run: node test/run-gate-v2.mjs
