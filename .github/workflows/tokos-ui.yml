name: Tokós UI
# view-transitions.js installs a capture-phase click interceptor for the whole app: an edit
# there alone broke the Tokos same-tick clinic contract (Oct 2026) without touching any path
# above, so it must re-run this suite too.
on:
  pull_request:
    branches: [main]
    paths: ['tokos*', 'tokos/**', 'home.js', 'swipe-back.js', 'index.html', 'view-transitions.js', 'test/run-tokos-ui.mjs', 'test/run-tokos-app-ui.mjs', 'test/run-tokos-instruments-ui.mjs', '.github/workflows/tokos-ui.yml']
  push:
    branches: [main]
    paths: ['tokos*', 'tokos/**', 'home.js', 'swipe-back.js', 'index.html', 'view-transitions.js', 'test/run-tokos-ui.mjs', 'test/run-tokos-app-ui.mjs', 'test/run-tokos-instruments-ui.mjs', '.github/workflows/tokos-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tokós module (hub, clinic, calipers, grading, reveal, Escape, offline; 390 px)
        run: node test/run-tokos-ui.mjs
      - name: Tokós in the real app (flag off and on, deep link, back, focus)
        run: node test/run-tokos-app-ui.mjs
      - name: Tokós instruments (atlas, spotter, FSRS, Hindi, 390/820/1194 px, light/dark)
        run: node test/run-tokos-instruments-ui.mjs
