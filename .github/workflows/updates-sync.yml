name: Medical Updates — daily sync

# BUG (2026-08-22, WhatsApp report): "This Week in Medicine" content had been frozen for ~4 weeks.
# Root cause: functions/_updates_pipeline.js (the "daily crawl + summarize pipeline") only runs when
# something calls POST /api/updates/sync (admin/cron-gated - see functions/_adminauth.js) - nothing
# in the repo was actually calling it on a schedule. Cloudflare Pages Functions are request-triggered
# only, so the trigger has to live here, the same way ota-stage.yml drives OTA staging on push.
#
# Never gates on anything: if a run fails or is skipped, yesterday's feed just stays visible - no
# partial/broken state, same failure posture as ota-stage.yml.
#
# REQUIRES a repo secret named UPDATES_ADMIN_TOKEN matching the Cloudflare Pages env var of the same
# name (functions/_adminauth.js) - add it under Settings -> Secrets and variables -> Actions.
on:
  schedule:
    - cron: "17 3 * * *"   # ~8:47am IST - once daily, off the hour to avoid provider cron pile-ups
  workflow_dispatch: {}     # manual "Push a sync now" without waiting for the schedule

concurrency:
  group: updates-sync
  cancel-in-progress: false   # let an in-flight crawl finish; don't cancel mid-summarize

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/updates/sync
        env:
          UPDATES_ADMIN_TOKEN: ${{ secrets.UPDATES_ADMIN_TOKEN }}
        run: |
          if [ -z "$UPDATES_ADMIN_TOKEN" ]; then
            echo "::error::UPDATES_ADMIN_TOKEN secret is not set - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "X-Admin-Token: $UPDATES_ADMIN_TOKEN" \
            https://stewardmd.in/api/updates/sync)
          echo "HTTP $code"; cat response.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::sync returned HTTP $code"; exit 1
          fi
          grep -q '"ok":true' response.json || { echo "::error::sync response did not report ok:true"; exit 1; }
