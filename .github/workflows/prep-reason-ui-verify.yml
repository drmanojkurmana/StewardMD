name: prep-reason-ui verify (temporary)

# One-shot visual verification for the reasoning-explanations UI: runs
# test/run-prep-reason-ui.mjs on ubuntu where browsers launch, and keeps the
# screenshots. Delete this file once verified (it is not part of CI).
on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + browsers
        run: |
          mkdir -p /tmp/pw-ci && cd /tmp/pw-ci && npm init -y >/dev/null 2>&1
          npm install playwright --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Run reasoning UI suite
        run: |
          mkdir -p shots
          CHROME="$(command -v google-chrome || command -v chromium)" SHOTS="$GITHUB_WORKSPACE/shots" PLAYWRIGHT_CORE=/tmp/pw-ci/node_modules/playwright-core node test/run-prep-reason-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reason-shots
          path: shots/
