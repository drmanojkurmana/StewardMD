name: Deploy Research Worker

# Builds and publishes the ResearchMD worker container image to GitHub
# Container Registry (ghcr.io) and notifies the approved container runtime.
# Triggered on demand only via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      confirm:
        description: "Confirmation token (must equal 'deploy')"
        required: true
        default: ""
        type: string

permissions:
  contents: read
  packages: write

# Never run two Research Worker deploys concurrently.
concurrency:
  group: deploy-research-worker-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, and deploy research worker
    runs-on: ubuntu-latest
    if: inputs.confirm == 'deploy'
    environment: ${{ inputs.environment }}
    env:
      RESEARCH_DEPLOY_HOOK: ${{ secrets.RESEARCH_DEPLOY_HOOK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/research/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r backend/research/requirements-dev.txt

      - name: Run research tests (fail closed)
        working-directory: backend/research
        run: PYTHONPATH=. pytest -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${LOWER_OWNER}/stewardmd-research-worker:${SHA}"
          echo "Building image ${IMAGE_URI} with context backend/research..."
          docker build -t "${IMAGE_URI}" -f backend/research/worker/Dockerfile backend/research
          echo "Pushing image ${IMAGE_URI} to GitHub Container Registry..."
          docker push "${IMAGE_URI}"

      # Placeholder deploy step calling runtime hook if configured.
      # The approved container runtime is not finalized yet (see docs/research/DEPLOYMENT_RUNBOOK.md).
      - name: Deploy to container runtime (placeholder)
        if: env.RESEARCH_DEPLOY_HOOK != ''
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          LOWER_OWNER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${LOWER_OWNER}/stewardmd-research-worker:${SHA}"
          echo "Deploying ${IMAGE_URI} via runtime deploy hook..."
          curl -f -sS -X POST -H 'Content-Type: application/json' --data "{\"image\":\"${IMAGE_URI}\",\"environment\":\"${{ inputs.environment }}\"}" "$RESEARCH_DEPLOY_HOOK"
