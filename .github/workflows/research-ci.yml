name: Research service CI
on:
  push:
    branches: [main]
    paths:
      - 'backend/research/**'
      - 'research-engine.js'
      - 'research-stats.js'
      - 'scripts/research-parity.R'
      - 'scripts/research-parity-5d.R'
      - 'scripts/research-parity-epi.R'
      - 'research-statfile.js'
      - 'research-screen-masterchart.js'
      - 'scripts/research-statfile-*.py'
      - 'test/run-research-statfile-ui.mjs'
      - 'test/research-*.test.mjs'
      - 'test/fixtures/research/**'
      - 'docs/research/**'
      - '.github/workflows/research-ci.yml'
  pull_request:
    paths:
      - 'backend/research/**'
      - 'research-engine.js'
      - 'research-stats.js'
      - 'scripts/research-parity.R'
      - 'scripts/research-parity-5d.R'
      - 'scripts/research-parity-epi.R'
      - 'research-statfile.js'
      - 'research-screen-masterchart.js'
      - 'scripts/research-statfile-*.py'
      - 'test/run-research-statfile-ui.mjs'
      - 'test/research-*.test.mjs'
      - 'test/fixtures/research/**'
      - 'docs/research/**'
      - '.github/workflows/research-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/research/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < '../../functions/api/research/[[path]].js'
      - run: node --input-type=module --check < ../../workers/research-orchestrator/src/index.js
  parity:
    runs-on: ubuntu-24.04  # setup-r system deps are missing on the 26.04 image
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Resolve R library path
        run: echo "R_LIB=$(Rscript -e 'cat(.libPaths()[1L])')" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIB }}
          key: ${{ runner.os }}-r-parity-${{ hashFiles('scripts/research-parity.R') }}
          restore-keys: |
            ${{ runner.os }}-r-parity-
      - name: Install metafor and metadat
        run: Rscript -e 'for (p in c("metafor", "metadat")) if (!requireNamespace(p, quietly = TRUE)) install.packages(p, repos = "https://cloud.r-project.org")'
      - name: Generate R parity fixtures
        run: Rscript scripts/research-parity.R
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run engine and R parity tests
        run: node --test --experimental-test-module-mocks --experimental-sqlite test/research-engine.test.mjs test/research-parity.test.mjs
  parity-5d:
    runs-on: ubuntu-24.04  # setup-r system deps are missing on the 26.04 image
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Resolve R library path
        run: echo "R_LIB=$(Rscript -e 'cat(.libPaths()[1L])')" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIB }}
          key: ${{ runner.os }}-r-parity-5d-${{ hashFiles('scripts/research-parity-5d.R') }}
          restore-keys: |
            ${{ runner.os }}-r-parity-5d-
      - name: Install survival and mada
        run: Rscript -e 'for (p in c("survival", "mada")) if (!requireNamespace(p, quietly = TRUE)) install.packages(p, repos = "https://cloud.r-project.org")'
      - name: Generate 5D R parity fixtures
        run: Rscript scripts/research-parity-5d.R
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 5D JS R parity tests
        run: node --test test/research-stats-parity-5d.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/research/requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r backend/research/requirements-dev.txt
      - name: Run 5D stats parity tests
        run: python -m pytest backend/research/tests/test_stats_parity.py -v
  parity-epi:
    runs-on: ubuntu-24.04  # setup-r system deps are missing on the 26.04 image
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install epiR and tableone
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::epiR
            any::tableone
      - name: Generate epiR and tableone R parity fixtures
        run: Rscript scripts/research-parity-epi.R
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run epiR and tableone JS R parity tests
        run: node --test test/research-stats-parity-epi.test.mjs
  parity-statfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyreadstat (checker only; the app reads these files on the phone)
        run: pip install "pyreadstat==1.3.8" "pandas>=2.2,<4"
      - name: Read every SPSS and Stata test file with pyreadstat
        run: python3 scripts/research-statfile-parity.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: On-device reader unit tests
        run: node --test test/research-statfile.test.mjs
      - name: On-device reader against pyreadstat
        run: node --test test/research-statfile-parity.test.mjs
      - name: Master chart upload in a real browser (SPSS and Stata)
        run: CHROME="$(command -v google-chrome || command -v chromium)" node test/run-research-statfile-ui.mjs
