name: Research service CI
on:
  push:
    branches: [main]
    paths:
      - 'backend/research/**'
      - '.github/workflows/research-ci.yml'
  pull_request:
    paths:
      - 'backend/research/**'
      - '.github/workflows/research-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/research/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest
