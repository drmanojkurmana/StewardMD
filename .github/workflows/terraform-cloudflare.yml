name: Cloudflare security headers (Terraform)

# Plan on PRs that touch the Cloudflare Terraform; apply on merge to main.
# Path-filtered so normal app PRs never trigger it.
on:
  pull_request:
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform-cloudflare.yml"
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform-cloudflare.yml"

# Least privilege: read the repo, write PR comments (for the plan). No more.
permissions:
  contents: read
  pull-requests: write

# Never run two applies against the same state at once.
concurrency:
  group: terraform-cloudflare
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # HCP remote state (workspace Execution Mode = Local). Set as repo variables.
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
  # Module inputs. Token is a secret; zone id is a non-secret repo variable.
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_zone_id: ${{ vars.CF_ZONE_ID }}

defaults:
  run:
    working-directory: infra/cloudflare

jobs:
  # ---- PR: validate + plan, post the plan as a PR comment (read-only) ----
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const plan = (process.env.PLAN_STDOUT || '').slice(0, 60000);
            const body = [
              `#### Terraform Plan — \`${process.env.PLAN_OUTCOME}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const marker = '#### Terraform Plan';
            const prev = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (prev) await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---- main: apply. Gated by the "production" Environment (add a required
  #      reviewer there for manual approval before any change goes live). ----
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve
