name: Deploy Drug API Worker

# Publishes the Cloudflare Worker (api.stewardmd.in) whenever its code changes on
# main — so the drug database (brand search, /composition filter, etc.) can be
# deployed entirely from a phone: merge the PR and approve, no terminal needed.
# Path-filtered so ordinary app changes never trigger a Worker deploy.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}   # also run on demand from the GitHub app → Actions → Run workflow

permissions:
  contents: read

# Never run two Worker deploys at once.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gated by the "production" Environment (same as the Terraform apply). Add a
    # required reviewer there and each deploy waits for a one-tap approval.
    environment: production
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        env:
          # wrangler 4 can't auto-list the account from a resource-scoped API token; supply it.
          # Kept as a secret (wrangler.jsonc intentionally omits account_id from source control).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # Pin wrangler v4 — the worker uses wrangler.jsonc (comments), which wrangler 3.x (the
          # action's stale fallback when node_modules isn't installed in CI) can't read; it then
          # walked up to the root Pages wrangler.toml and failed ("Workers command in a Pages
          # project"), silently breaking every worker deploy.
          wranglerVersion: "4.107.0"
          command: deploy
