name: links-floor
on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "tools/prep-links*.mjs"
      - "tools/prep-qgen.mjs"
      - "prep/bank/topic-links.json"
      - "prep/bank/rematch-links.json"
      - "prep/lessons/**"
      - "prep/taxonomy.json"
# Cost guard (Nov 2026): a flood of content PRs ran this 350+ times in a day, each fetching every bank and overlay
# file through a Pages Function (one KV + one R2 read per file), part of ~13M billable requests. The fetch step skips
# files already in its cache dir, so keep that dir between runs, and run one at a time per branch.
concurrency:
  group: links-floor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gaps:
    runs-on: ubuntu-latest
    # Blocking: every usable item has a Know-more target (LINKS-LESSONS-DONE.md).
    # The gaps step FAILS while unlinked > 0 and blocks the PR.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse fetched bank files
        uses: actions/cache@v4
        with:
          path: /tmp/links-cache
          key: links-cache-${{ hashFiles('prep/bank/overlay-counts.json', 'prep/taxonomy.json', 'prep/bank/index*.json') }}
          restore-keys: links-cache-
      - name: Build the links index over live bank text
        env:
          # the bank is gated (PREP_BANK_ENFORCE=1); the tools credential lets CI read it (functions/api/prep/bank toolOK)
          SMD_TOOL_TOKEN: ${{ secrets.SMD_TOOL_TOKEN }}
          NODE_OPTIONS: --import=./tools/_bank-token.mjs
        run: |
          node tools/prep-links.mjs fetch --cache /tmp/links-cache
          node tools/prep-links.mjs build --cache /tmp/links-cache --out /tmp/links-out
      - name: Fail while any usable item has no target
        run: node tools/prep-links.mjs gaps --out /tmp/links-out --fail
