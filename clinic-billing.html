<html class="light" lang="en">

<title>Billing · StewardMD OPD</title>
<!-- Cashier / billing station (lean MVP). Reuses the staff session from the OPD console (sign in at
     /opd first). Look up a patient by their SMD id, review unbilled orders, generate an invoice, mark
     paid. Inert unless CLINIC_BILLING_ENABLED=1 server-side. ?mock=1 for a no-auth demo. -->
<!-- Firebase (same app as /opd): a clinic OWNER signs in with Google there; that session persists to this
     same-origin page, so we can mint a Bearer id-token here. Staff cashiers use the X-Staff-Token path instead. -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>try{ firebase.initializeApp({ apiKey:"AIzaSyCaqxRQfMtq95j0J_vLj7EF4sxrN0FhO0I", authDomain:"stewardmd-498ec.firebaseapp.com", projectId:"stewardmd-498ec", appId:"1:911280405587:web:d09038e15e98d69dc79aa6" }); }catch(e){}</script>
<style>
  @font-face{ font-family:'Inter Variable'; font-style:normal; font-weight:100 900; font-display:swap; src:url(/assets/fonts/inter-variable.woff2) format('woff2'); }
  @font-face{ font-family:'Material Symbols Rounded'; font-style:normal; font-weight:300 700; font-display:block; src:url(/assets/fonts/material-symbols-rounded.woff2) format('woff2'); }
  :root{ --teal:#0e6e63; --teal-d:#0b5c56; --teal-soft:#e3f1ee; --ink:#14202b; --mut:#5a7184; --line:#d7dee3;
    --bg:#f6f7f5; --card:#fff; --btn:#eef1f4; --ok:#1c7a4a; --ok-soft:#e2f2ea; --red:#ab1c2c;
    --ease:cubic-bezier(.2,.7,.2,1); --sh:0 1px 3px rgba(20,32,43,.06); --sh-lg:0 12px 34px rgba(20,32,43,.16); }
  @media (prefers-color-scheme:dark){ :root{ --teal:#3fc7b3; --teal-d:#2fb3a0; --teal-soft:#0d2e2a; --ink:#eaf0f2; --mut:#a9bcc3;
    --line:#31424a; --bg:#0f1a1e; --card:#18242a; --btn:#223038; --ok:#5bd08f; --ok-soft:#12261b; --red:#f0868f; } }
  *{ box-sizing:border-box } html,body{ margin:0 }
  body{ background:var(--bg); color:var(--ink); font-family:'Inter Variable',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100dvh; -webkit-font-smoothing:antialiased; }
  .ms{ font-family:'Material Symbols Rounded'; font-weight:400; line-height:1; vertical-align:middle; -webkit-font-feature-settings:'liga'; user-select:none; }
  header{ position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--card) 90%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .hd{ max-width:640px; margin:0 auto; display:flex; align-items:center; gap:9px; padding:calc(13px + env(safe-area-inset-top)) 20px 13px; }
  .hd .mk{ width:24px; height:24px; background:var(--teal); -webkit-mask:url(/logo.png) center/contain no-repeat; mask:url(/logo.png) center/contain no-repeat; }
  .hd h1{ font:800 19px 'Inter Variable',Inter; margin:0; letter-spacing:-.01em; } .hd h1 span{ color:var(--teal); }
  .hd .tag{ margin-left:auto; font:700 11px 'Inter Variable',Inter; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); background:var(--teal-soft); padding:5px 10px; border-radius:999px; }
  main{ max-width:640px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--sh); padding:18px; animation:rise .4s var(--ease) both; }
  h2{ font:700 15px 'Inter Variable',Inter; margin:0 0 12px; display:flex; align-items:center; gap:8px; } h2 .ms{ color:var(--teal); font-size:20px; }
  label{ display:block; font:600 12px 'Inter Variable',Inter; color:var(--mut); margin:0 0 6px; }
  input{ width:100%; font:600 16px 'Inter Variable',Inter; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:13px 14px; }
  input:focus{ outline:0; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  .btn{ width:100%; margin-top:12px; background:var(--teal); color:#fff; border:none; border-radius:12px; padding:14px; font:700 15px 'Inter Variable',Inter; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s var(--ease); }
  .btn:active{ transform:scale(.98) } .btn:hover{ background:var(--teal-d) } .btn.ghost{ background:var(--btn); color:var(--ink); } .btn:disabled{ opacity:.6; }
  .pt{ display:flex; align-items:center; gap:12px; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .pt .av{ width:44px; height:44px; border-radius:50%; background:var(--teal-soft); color:var(--teal-d); display:grid; place-items:center; font:800 15px 'Inter Variable',Inter; flex:none; }
  .pt b{ display:block; font:800 17px 'Inter Variable',Inter; } .pt span{ font:600 12px 'Inter Variable',Inter; color:var(--mut); }
  .line{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .line:last-of-type{ border-bottom:none; }
  .line .k{ font:700 9.5px 'Inter Variable',Inter; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:6px; background:var(--btn); color:var(--mut); flex:none; }
  .line .k.med{ background:var(--teal-soft); color:var(--teal-d); }
  .line .nm{ flex:1; min-width:0; font:600 14px 'Inter Variable',Inter; } .line .nm small{ color:var(--mut); font-weight:600; }
  .line .amt{ font:700 14px 'Inter Variable',Inter; font-variant-numeric:tabular-nums; }
  .tot{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:2px solid var(--line); font:800 20px 'Inter Variable',Inter; }
  .tot .ms{ }
  .pays{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px; }
  .pays button{ background:var(--btn); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:13px 8px; font:700 13px 'Inter Variable',Inter; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .pays button:active{ transform:scale(.97) } .pays button .ms{ font-size:22px; color:var(--teal); }
  .msg{ text-align:center; color:var(--mut); padding:34px 10px; } .msg .ms{ font-size:44px; color:var(--line); display:block; margin:0 auto 12px; }
  .paid{ text-align:center; padding:28px 10px; } .paid .ms{ font-size:56px; color:var(--ok); display:block; margin:0 auto 10px; animation:pop .5s var(--ease); } .paid b{ font:800 20px 'Inter Variable',Inter; }
  .err{ color:var(--red); font:600 13px 'Inter Variable',Inter; min-height:16px; margin-top:8px; }
  @keyframes rise{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @keyframes pop{ 0%{transform:scale(.4);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important } }
  #loBtn{ transition:all .15s ease; border:1px solid var(--line); }
  #loBtn:hover{ background:var(--red); color:#fff; border-color:var(--red); }
</style>
</head>
<body>
<header><div class="hd"><span class="mk" aria-hidden="true"></span><h1>Steward<span>MD</span> <span id="stnName">Billing</span></h1><a class="btn ghost" href="/opd" style="text-decoration:none;margin-top:0;width:auto;padding:6px 12px;font-size:13px;margin-left:auto;margin-right:8px;display:inline-flex;align-items:center;gap:4px"><span class="ms" style="font-size:16px">arrow_back</span> OPD Board</a><span class="tag" id="stnTag" style="margin-left:0">Cashier</span><button class="btn ghost" id="loBtn" title="Sign out of this session" style="margin-top:0;width:auto;padding:6px 12px;font-size:13px;margin-left:8px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;flex-shrink:0"><span class="ms" style="font-size:16px">logout</span> Sign out</button></div></header>
<main id="app"></main>
<script>
(function(){
  "use strict";
  var P = new URLSearchParams(location.search);
  var app = document.getElementById("app");
  var MOCK = P.get("mock") === "1";
  // Same page, two stations. The pharmacy reads the SAME order lifecycle the cashier writes
  // to - it is the next state after "paid", not a separate system.
  var STATION = P.get("station") === "pharmacy" ? "pharmacy" : "billing";
  var tok = "", tt = "";
  try { tok = localStorage.getItem("smd_opd_staff_tok") || ""; tt = localStorage.getItem("smd_opd_toktype") || ""; } catch (e) {}
  if (tt === "account") tt = "firebase";   // wardsynq.com spells the account sign-in "account" (LT-01)
  var orgId = P.get("orgId") || "";
  try { if (!orgId) orgId = localStorage.getItem("smd_opd_hospital") || ""; } catch (e) {}
  var cur = null;   // { patient, orders } | { invoice }

  var loBtn = document.getElementById("loBtn");
  if (loBtn) {
    loBtn.onclick = function() {
      try {
        localStorage.removeItem("smd_opd_staff_tok");
        localStorage.removeItem("smd_opd_toktype");
        localStorage.removeItem("smd_opd_hospital");
        sessionStorage.removeItem("smd_staff_token");
        if (window.firebase && firebase.auth) firebase.auth().signOut().catch(function(){});
      } catch (e) {}
      location.href = "/opd";
    };
  }

  function ms(n){ return '<span class="ms">'+n+'</span>'; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
  function rupees(p){ return "₹" + (Math.round(p||0)/100).toFixed(2); }
  function initials(n){ return String(n||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase() || "?"; }

  function fbToken(){ try { var a=firebase&&firebase.auth&&firebase.auth(); var u=a&&a.currentUser; return (u&&u.getIdToken)?u.getIdToken().catch(function(){return "";}):Promise.resolve(""); } catch(e){ return Promise.resolve(""); } }
  function queueApiUrl(path){
    var base = (location.hostname.indexOf("wardsynq") > -1) ? "https://stewardmd.in/api/queue/" : "/api/queue/";
    return base + String(path || "").replace(/^\/+/, "");
  }
  function api(path, opts){
    opts = opts || {};
    var h = { "Content-Type": "application/json" };
    var send = function(){ return fetch(queueApiUrl("bill/" + path), { method: opts.method || "GET", headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function(r){ return r.json().catch(function(){ return { ok:false, error:"bad_response" }; }); })
      .catch(function(){ return { ok:false, error:"network" }; }); };
    if (tt === "firebase") return fbToken().then(function(t){ if(t) h["Authorization"]="Bearer "+t; return send(); });   // clinic owner: mint an id-token like /opd does
    if (tok) h["X-Staff-Token"] = tok;   // staff cashier session
    return send();
  }

  // ---- pharmacy station ------------------------------------------------------------------------
  // Medication orders that are PAID but not yet handed over. Investigations never appear: they have no
  // dispensing step. The server enforces the same rule, so an unpaid order cannot be released even if
  // this list were stale.
  function pharmacyView(){
    app.innerHTML = '<section class="card"><div class="msg">'+ms("hourglass_empty")+'Loading dispense list…</div></section>';
    api("pharmacy?orgId="+encodeURIComponent(orgId)).then(function(r){
      if (!r || !r.ok) {
        app.innerHTML = '<section class="card"><div class="msg">'+ms("lock")+
          (r && r.error === "billing_disabled" ? "The pharmacy station is not switched on for this clinic yet." : "Could not load the dispense list.")+'</div></section>';
        return;
      }
      renderPharmacy((r.orders)||[], r.truncated ? r.cap : 0);
    });
  }
  // More waiting than one screen reads: said plainly, so the list is never taken for everything owed.
  function capNote(cap){ return cap ? '<div class="msg">'+ms("warning")+'Showing the first '+cap+' only. More are waiting than this list can show; dispense these and refresh.</div>' : ""; }
  function renderPharmacy(orders, cap){
    if (!orders.length) {
      app.innerHTML = '<section class="card"><h2>'+ms("done_all")+'Nothing to dispense</h2>'+
        '<div class="msg">Every paid medicine has been handed over.</div>'+
        '<button class="btn" id="rf">'+ms("refresh")+'Refresh</button></section>';
      document.getElementById("rf").onclick = pharmacyView;
      return;
    }
    var rows = orders.map(function(o){
      return '<div class="line"><span class="k med">Rx</span>'+
        '<span class="nm">'+esc(o.name)+(o.qty>1?' <small>x'+o.qty+'</small>':'')+
        '<br><small>'+esc(o.patientId||"")+'</small></span>'+
        '<button class="btn" style="margin:0;width:auto;padding:8px 14px" data-disp="'+esc(o.id)+'">'+ms("check")+'Dispense</button></div>';
    }).join("");
    app.innerHTML = '<section class="card"><h2>'+ms("medication")+'To dispense <small>('+orders.length+(cap?'+':'')+')</small></h2>'+capNote(cap)+
      rows+'<div class="err" id="err"></div>'+
      '<button class="btn" id="rf" style="background:#e2e8f0;color:#0f172a">'+ms("refresh")+'Refresh</button></section>';
    document.getElementById("rf").onclick = pharmacyView;
    Array.prototype.forEach.call(app.querySelectorAll("[data-disp]"), function(b){
      b.onclick = function(){
        b.disabled = true; b.textContent = "Dispensing…";
        api("dispense", { method:"POST", body:{ orgId:orgId, orderId:b.getAttribute("data-disp") } }).then(function(r){
          if (r && r.ok) { pharmacyView(); return; }
          b.disabled = false; b.innerHTML = ms("check")+"Dispense";
          document.getElementById("err").textContent =
            (r && r.error === "not_dispensable") ? "That order is not paid yet - send the patient to billing first." : "Could not record the dispense. Try again.";
        });
      };
    });
  }

  function lookupView(prefill){
    cur = null;
    app.innerHTML = '<section class="card"><h2>'+ms("badge")+'Find patient</h2>'+
      '<label>Patient ID or Token</label><input id="mrn" placeholder="SMD-XXXXXX-0000 or token" autocomplete="off" value="'+esc(prefill||"")+'">'+
      '<div class="err" id="err"></div>'+
      '<button class="btn" id="go">'+ms("search")+'Look up orders</button></section>';
    var go = document.getElementById("go"), inp = document.getElementById("mrn");
    inp.focus();
    go.onclick = function(){ var id = inp.value.trim(); if(!id){ document.getElementById("err").textContent = "Enter the patient's ID."; return; } loadPatient(id); };
    inp.addEventListener("keydown", function(e){ if(e.key==="Enter") go.click(); });
    // Everyone with something waiting to be billed, so the cashier does not depend on being told an ID.
    var q = document.createElement("section"); q.className = "card"; q.innerHTML = '<h2>'+ms("pending_actions")+'Waiting to be billed</h2><div class="msg">Loading…</div>';
    app.appendChild(q);

    var qOpd = document.createElement("section"); qOpd.className = "card"; qOpd.style.display = "none";
    app.appendChild(qOpd);

    if (MOCK) {
      q.innerHTML = '<h2>'+ms("pending_actions")+'Waiting to be billed</h2><div class="msg">Demo: the live list shows every patient with unbilled orders.</div>';
      return;
    }
    api("queue?orgId="+encodeURIComponent(orgId)).then(function(r){
      if (!r || !r.ok) { q.innerHTML = '<h2>'+ms("pending_actions")+'Waiting to be billed</h2><div class="msg">'+ms("error")+'The list could not be loaded. Do not read this as nothing waiting. Look a patient up by ID instead.</div>'; return; }
      var by = {}; (r.orders||[]).forEach(function(o){ (by[o.patientId] = by[o.patientId] || []).push(o); });
      var ids = Object.keys(by);
      q.innerHTML = '<h2>'+ms("pending_actions")+'Waiting to be billed <small style="font-size:12px;font-weight:600;color:var(--mut)">('+ids.length+')</small></h2>' + (r.truncated ? capNote(r.cap) : "") + (ids.length
        ? ids.map(function(id){ var n = by[id].length, tot = by[id].reduce(function(s,o){ return s + (o.unitPrice||0)*(o.qty||1); }, 0);
            return '<div class="line"><span class="nm">'+esc(id)+' <small>'+n+' item'+(n===1?'':'s')+'</small></span><span class="amt">'+rupees(tot)+'</span><button class="btn ghost" style="width:auto;margin:0 0 0 8px;padding:8px 12px" data-bill="'+esc(id)+'">Open</button></div>'; }).join("")
        : '<div class="msg">Nothing is waiting to be billed.</div>');
      Array.prototype.forEach.call(q.querySelectorAll("[data-bill]"), function(b){ b.onclick = function(){ loadPatient(b.getAttribute("data-bill")); }; });

      if (r.opdPatients && r.opdPatients.length) {
        qOpd.style.display = "block";
        qOpd.innerHTML = '<h2>'+ms("group")+'Today\'s OPD Queue <small style="font-size:12px;font-weight:600;color:var(--mut)">('+r.opdPatients.length+' registered)</small></h2>' +
          r.opdPatients.map(function(p){
            var chip = p.unbilledTotal > 0
              ? '<span style="background:var(--teal-soft);color:var(--teal-d);font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px;letter-spacing:0.02em">'+rupees(p.unbilledTotal)+' unbilled</span>'
              : '<span style="background:var(--btn);color:var(--mut);font-weight:600;padding:2px 8px;border-radius:6px;font-size:11px">Registered</span>';
            var tokenStr = p.token ? '<span style="display:inline-block;padding:2px 6px;border-radius:6px;background:var(--btn);font-weight:700;font-size:12px;margin-right:6px">#'+esc(p.token)+'</span>' : '';
            var pid = p.mrn || p.id;
            return '<div class="line" style="display:flex;align-items:center;justify-content:space-between;gap:8px">'+
              '<div style="flex:1;min-width:0">'+
                '<div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">'+tokenStr+'<span>'+esc(p.name||"Patient")+'</span></div>'+
                '<div style="font-size:12px;color:var(--mut);margin-top:2px">'+esc(pid)+(p.department?' · '+esc(p.department):'')+'</div>'+
              '</div>'+
              '<div style="display:flex;align-items:center;gap:8px">'+
                chip +
                '<button class="btn ghost" style="width:auto;margin:0;padding:6px 14px;font-size:13px" data-opd-bill="'+esc(pid)+'">'+ms("receipt_long")+' Bill</button>'+
              '</div>'+
            '</div>';
          }).join("");
        Array.prototype.forEach.call(qOpd.querySelectorAll("[data-opd-bill]"), function(b){
          b.onclick = function(){ loadPatient(b.getAttribute("data-opd-bill")); };
        });
      }
    });
  }

  function loadPatient(id){
    document.getElementById("err").textContent = "";
    Promise.all([ api("patient?orgId="+encodeURIComponent(orgId)+"&id="+encodeURIComponent(id)),
                  api("orders?orgId="+encodeURIComponent(orgId)+"&patientId="+encodeURIComponent(id)+"&status=ordered") ])
      .then(function(res){
        var p = res[0], o = res[1];
        if (!p || !p.ok) { document.getElementById("err").textContent = p && p.error === "billing_disabled" ? "Billing is not enabled for this clinic yet." : p && p.error === "not_found" ? "No patient found with that ID." : "The patient could not be looked up. Try again."; return; }
        if (!o || !o.ok) { document.getElementById("err").textContent = "This patient's orders could not be loaded. Do not read this as nothing to bill."; return; }
        review({ patient: p, orders: o.orders || [] });
      });
  }

  function orderLine(o){
    return '<div class="line"><span class="k'+(o.kind==="medication"?" med":"")+'">'+(o.kind==="medication"?"Rx":"Lab")+'</span>'+
      '<span class="nm">'+esc(o.name)+(o.qty>1?' <small>x'+o.qty+'</small>':'')+'</span>'+
      '<span class="amt">'+rupees((o.unitPrice||0)*(o.qty||1))+'</span></div>';
  }
  function review(data){
    cur = data;
    var p = data.patient, orders = data.orders;
    var total = orders.reduce(function(s,o){ return s + (o.unitPrice||0)*(o.qty||1); }, 0);
    var body = orders.length
      ? orders.map(orderLine).join("") + '<div class="tot"><span>Total</span><span>'+rupees(total)+'</span></div>' +
        '<button class="btn" id="inv">'+ms("receipt_long")+'Generate invoice</button>'
      : '<div class="msg" style="padding:16px 12px;background:var(--bg);border-radius:12px;border:1px dashed var(--line);margin-bottom:14px;color:var(--mut)">'+ms("inventory_2")+' No unbilled orders yet for this patient. Add items from the price list below to bill.</div><button class="btn ghost" id="back" style="margin-bottom:16px">'+ms("arrow_back")+'Look up another patient</button>';
    app.innerHTML = '<section class="card"><div class="pt"><div class="av">'+esc(initials(p.name))+'</div><div><b>'+esc(p.name||"Patient")+'</b><span>'+esc(p.id||"")+(p.ageYears?" · "+p.ageYears+"y":"")+(p.sex?" · "+esc(p.sex):"")+'</span></div></div>'+
      '<h2>'+ms("assignment")+'Unbilled orders</h2>'+body+'<div class="err" id="err"></div>'+
      '<h2>'+ms("add_shopping_cart")+'Add an item</h2><div id="addItem"><div class="msg">Loading the price list…</div></div></section>';
    var inv = document.getElementById("inv"); if(inv) inv.onclick = function(){ inv.disabled=true; inv.innerHTML = ms("hourglass_top")+"Creating…"; makeInvoice(p.id); };
    var back = document.getElementById("back"); if(back) back.onclick = function(){ lookupView(); };
    loadAddItem(p);
  }
  // The price is the clinic's own price list; the server takes it from there, not from this page.
  function loadAddItem(p){
    var box = document.getElementById("addItem");
    if (MOCK) { box.innerHTML = '<div class="msg">'+ms("info")+'Demo: items come from the clinic price list.</div>'; return; }
    api("tariff?orgId="+encodeURIComponent(orgId)).then(function(r){
      if (!box) return;
      if (!r || !r.ok) { box.innerHTML = '<div class="msg">'+ms("error")+'The price list could not be loaded.</div>'; return; }
      var items = r.items || [];
      if (!items.length) { box.innerHTML = '<div class="msg">'+ms("info")+'The price list is empty. The clinic owner adds items under Admin, Price list.</div>'; return; }
      box.innerHTML = '<label>Item</label><select id="tItem">'+items.map(function(t){ return '<option value="'+esc(t.id)+'">'+esc(t.name)+' - '+rupees(t.price)+'</option>'; }).join("")+'</select>'+
        '<label>Quantity</label><input id="tQty" type="number" min="1" value="1">'+
        '<button class="btn ghost" id="tAdd">'+ms("add")+'Add to this bill</button>';
      document.getElementById("tAdd").onclick = function(){
        var b = this; b.disabled = true;
        api("order", { method:"POST", body:{ orgId:orgId, patientId:p.id, ticketId:p.ticketId||"", tariffId:document.getElementById("tItem").value, qty:Number(document.getElementById("tQty").value)||1 } }).then(function(x){
          b.disabled = false;
          if (x && x.ok) { loadPatient(p.id); return; }
          document.getElementById("err").textContent = x && x.error === "forbidden" ? "Your role cannot add items to a bill. A doctor or the clinic owner can." :
            x && x.error === "tariff_item_not_found" ? "That item is no longer on the price list. Reload." : "The item was not added.";
        });
      };
    });
  }

  function makeInvoice(patientId){
    api("invoice", { method:"POST", body:{ orgId:orgId, patientId:patientId } }).then(function(r){
      if(!r || !r.ok){ document.getElementById("err").textContent = r && r.error==="no_billable_orders" ? "Those orders were already billed." : "Could not create the invoice."; return; }
      invoiceView(r.invoice, cur.patient);
    });
  }
  function invoiceView(invoice, p){
    cur = { invoice: invoice, patient: p };
    var lines = (invoice.lines||[]).map(function(l){ return '<div class="line"><span class="nm">'+esc(l.name)+(l.qty>1?' <small>x'+l.qty+'</small>':'')+'</span><span class="amt">'+rupees(l.amount)+'</span></div>'; }).join("");
    app.innerHTML = '<section class="card"><div class="pt"><div class="av">'+esc(initials(p&&p.name))+'</div><div><b>'+esc((p&&p.name)||"Patient")+'</b><span>Invoice '+esc((invoice.id||"").slice(-6).toUpperCase())+'</span></div></div>'+
      '<h2>'+ms("receipt_long")+'Invoice</h2>'+lines+'<div class="tot"><span>Amount due</span><span>'+rupees(invoice.total)+'</span></div>'+
      '<div class="pays"><button data-m="cash">'+ms("payments")+'Cash</button><button data-m="upi">'+ms("qr_code_2")+'UPI</button><button data-m="card">'+ms("credit_card")+'Card</button></div>'+
      '<div class="err" id="err"></div></section>';
    Array.prototype.forEach.call(app.querySelectorAll(".pays button"), function(b){ b.onclick = function(){ pay(invoice.id, b.getAttribute("data-m")); }; });
  }
  function pay(invoiceId, method){
    Array.prototype.forEach.call(app.querySelectorAll(".pays button"), function(b){ b.disabled = true; });
    api("pay", { method:"POST", body:{ orgId:orgId, invoiceId:invoiceId, method:method } }).then(function(r){
      if(!r || !r.ok){ document.getElementById("err").textContent = "Payment could not be recorded."; Array.prototype.forEach.call(app.querySelectorAll(".pays button"), function(b){ b.disabled = false; }); return; }
      app.innerHTML = '<section class="card"><div class="paid">'+ms("check_circle")+'<b>Payment recorded</b><div style="color:var(--mut);margin-top:6px">'+method.toUpperCase()+' · patient is cleared to proceed.</div></div>'+
        '<button class="btn" id="next">'+ms("person_add")+'Next patient</button></section>';
      document.getElementById("next").onclick = function(){ lookupView(); };
    });
  }

  // One entry point for both stations.
  function start(){
    if (STATION === "pharmacy") {
      try { document.getElementById("stnName").textContent = "Pharmacy"; document.getElementById("stnTag").textContent = "Dispense"; } catch(e){}
      pharmacyView(); return;
    }
    var initPt = P.get("patient") || P.get("patientId") || P.get("ticketId");
    if (initPt) {
      lookupView(initPt);
      loadPatient(initPt);
      return;
    }
    lookupView();
  }

  // ---- boot ----
  if (MOCK) {
    review({ patient: { id:"SMD-AB12CD-0007", name:"Asha Kumar", ageYears:34, sex:"F" },
      orders: [ { id:"o1", kind:"investigation", name:"Complete Blood Count", qty:1, unitPrice:15050 },
                { id:"o2", kind:"investigation", name:"Random Blood Sugar", qty:1, unitPrice:8000 },
                { id:"o3", kind:"medication", name:"Amoxicillin 500mg", qty:15, unitPrice:400 } ] });
  } else if (tt === "firebase") {
    // Clinic owner: the Google session restores asynchronously - wait for it before the first authed call.
    app.innerHTML = '<section class="card"><div class="msg">'+ms("hourglass_empty")+'Loading…</div></section>';
    var signInPrompt = function(){ app.innerHTML = '<section class="card"><div class="msg">'+ms("lock")+'Please sign in at the OPD console first, then reopen this page.</div><a class="btn" href="/opd" style="text-decoration:none">'+ms("open_in_new")+'Open OPD console</a></section>'; };
    try { firebase.auth().onAuthStateChanged(function(u){ if(u) start(); else signInPrompt(); }); } catch(e){ start(); }
  } else if (!tok) {
    var savedCode = ""; try { savedCode = localStorage.getItem("smd_opd_clinic_code") || ""; } catch(e){}
    var preCode = P.get("clinicCode") || P.get("clinic") || savedCode;
    var preId = P.get("staffId") || P.get("id") || "";
    app.innerHTML = '<section class="card"><h2>' + ms("lock") + 'Cashier Station Sign-in</h2>' +
      '<p style="color:var(--mut);font-size:13px;margin:0 0 14px">Sign in with your clinic code, staff ID and PIN to access billing.</p>' +
      '<label>Clinic code</label><input id="bCode" placeholder="SMD-XXXXXX" value="' + esc(preCode) + '" autocomplete="off">' +
      '<label>Staff ID</label><input id="bId" placeholder="biller" value="' + esc(preId) + '" autocomplete="username" autocapitalize="none">' +
      '<label>PIN or Password</label><input id="bPin" type="password" placeholder="••••" autocomplete="current-password">' +
      '<div class="err" id="bErr"></div>' +
      '<button class="btn" id="bGo">' + ms("lock_open") + 'Unlock Station</button>' +
      '<div style="text-align:center;margin-top:14px"><a class="btn ghost" href="/opd" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px">' + ms("arrow_back") + 'Back to OPD Board</a></div></section>';
    var go = document.getElementById("bGo");
    var doAuth = function() {
      var c = (document.getElementById("bCode").value || "").trim();
      var u = (document.getElementById("bId").value || "").trim();
      var p = (document.getElementById("bPin").value || "").trim();
      var errEl = document.getElementById("bErr");
      if (!c || !u || !p) { errEl.textContent = "Enter your clinic code, staff ID and PIN."; return; }
      errEl.textContent = "Signing in…"; go.disabled = true;
      fetch(queueApiUrl("auth/pin"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clinicCode: c, identity: u, pin: p })
      }).then(function(r){ return r.json(); }).then(function(r){
        if (!r || !r.ok) {
          go.disabled = false;
          errEl.textContent = (r && r.error === "invalid_login") ? "Wrong clinic code, staff ID or PIN." : (r && r.error) || "Sign-in failed.";
          return;
        }
        tok = r.token; orgId = r.orgId; tt = "staff";
        try {
          localStorage.setItem("smd_opd_staff_tok", r.token);
          localStorage.setItem("smd_opd_toktype", "staff");
          localStorage.setItem("smd_opd_hospital", r.orgId);
          if (r.orgCode) localStorage.setItem("smd_opd_clinic_code", r.orgCode);
        } catch(e) {}
        start();
      }).catch(function(){ go.disabled = false; errEl.textContent = "Could not reach the server."; });
    };
    go.onclick = doAuth;
    document.getElementById("bPin").addEventListener("keydown", function(e){ if (e.key === "Enter") doAuth(); });
  } else {
    start();
  }
})();
</script>
