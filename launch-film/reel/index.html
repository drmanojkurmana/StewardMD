<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<meta name="hyperframes" content="duration:45,fps:30,width:1080,height:1920" />
<meta name="description" content="StewardMD 45-second 9:16 Instagram Reel, NullMotion/HyperFrames composition" />
<title>StewardMD Reel</title>
<link rel="stylesheet" href="../film/film.css" />
<link rel="stylesheet" href="reel.css" />
<script src="../vendor/gsap.min.js"></script>
<script src="../film/lib.js"></script>
<script src="../film/rects.js"></script>
<script src="reel.js"></script>
<!-- One file per section; each reads its window from FILM.T (reel.js).
     Preview: #play, ?section=<id>, or ?t=<seconds>. -->
<script src="sections/00-background.js"></script>
<script src="sections/01-open.js"></script>
<script src="sections/02-reason.js"></script>
<script src="sections/03-steward.js"></script>
<script src="sections/04-maik.js"></script>
<script src="sections/05-icu.js"></script>
<script src="sections/06-watch.js"></script>
<script src="sections/07-finale.js"></script>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="45" data-width="1080" data-height="1920">
    <div id="stage"></div>
    <div class="vignette"></div>
    <div class="grain" id="grain"></div>
  </div>
  <script>
    (function () {
      var tl = FILM.build();
      tl.fromTo("#grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "7373px 5281px", duration: FILM.DURATION, ease: "steps(" + (FILM.DURATION * FILM.FPS) + ")" }, 0);
      var q = new URLSearchParams(location.search);
      FILM.ready().then(function () {
        window.__filmReady = true;
        if (q.has("t")) tl.seek(+q.get("t"));
        else if (q.has("section")) {
          var s = FILM.sections.filter(function (x) { return x.id === q.get("section"); })[0];
          if (s) { tl.seek(s.start); tl.tweenFromTo(s.start, s.start + s.duration, { repeat: -1 }); }
        } else if (location.hash === "#play") tl.play(0);
        else tl.seek(0);
      });
    })();
  </script>
</body>
</html>
