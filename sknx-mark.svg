<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <title>SknX AI</title>
  <desc>Minimal geometric dermatology mark: layered skin contours intersect a precision AI scanning aperture and node.</desc>
  <defs>
    <linearGradient id="skin" x1="14" y1="20" x2="53" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2D2BA"/>
      <stop offset="1" stop-color="#C88760"/>
    </linearGradient>
    <linearGradient id="teal" x1="49" y1="10" x2="68" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62D6C4"/>
      <stop offset="1" stop-color="#087C73"/>
    </linearGradient>
    <clipPath id="skinClip">
      <circle cx="37" cy="40" r="25"/>
    </clipPath>
  </defs>

  <!-- Skin: three clean epidermal/dermal contour layers -->
  <g clip-path="url(#skinClip)">
    <path d="M5 18C17 12 25 17 35 22C45 27 52 27 66 20V34C53 41 46 39 35 34C24 29 16 27 5 33V18Z" fill="url(#skin)"/>
    <path d="M4 34C15 28 23 32 34 38C45 44 53 43 67 35V49C54 56 45 55 34 49C23 43 15 41 4 47V34Z" fill="#D9A27F"/>
    <path d="M4 50C15 44 23 47 34 53C45 59 53 58 67 50V65C53 71 44 69 33 63C22 57 14 55 4 61V50Z" fill="#B87350"/>
  </g>

  <!-- Precision aperture: deliberately incomplete to imply scanning/analysis -->
  <path d="M31 11C18 14 10 25 10 39C10 47 13 54 18 60" stroke="url(#teal)" stroke-width="5" stroke-linecap="round"/>
  <path d="M50 12C59 17 65 27 65 39" stroke="url(#teal)" stroke-width="5" stroke-linecap="round"/>
  <path d="M65 50C61 59 53 66 44 68" stroke="url(#teal)" stroke-width="5" stroke-linecap="round"/>

  <!-- AI/clinical decision node -->
  <circle cx="65" cy="39" r="8" fill="#0B625B"/>
  <circle cx="65" cy="39" r="3" fill="#F8F3E9"/>
  <path d="M57 39H49" stroke="#0B625B" stroke-width="2" stroke-linecap="round"/>
</svg>
