<script>
/* ── Apple-style auto-hide header ──────────────────────────────────────────
   Hides the sticky header when scrolling down, reveals it on scroll-up.
   Uses rAF-throttled scroll sampling and small thresholds to avoid jitter. */
(function () {
  var head = document.querySelector(".app-head");
  if (!head) return;
  var lastY = window.pageYOffset || 0;
  var ticking = false;
  var REVEAL_AT_TOP = 8;   // always show when near the very top
  var DELTA = 6;           // ignore tiny scrolls (trackpad noise)

  function update() {
    ticking = false;
    var y = window.pageYOffset || 0;
    // Elevate with a shadow once the page has scrolled a little.
    head.classList.toggle("head-scrolled", y > REVEAL_AT_TOP);

    // Near the top: force the header visible.
    if (y <= head.offsetHeight) {
      head.classList.remove("head-hidden");
      lastY = y;
      return;
    }
    var diff = y - lastY;
    if (Math.abs(diff) < DELTA) return;   // too small to act on
    if (diff > 0) {
      head.classList.add("head-hidden");   // scrolling down → hide
    } else {
      head.classList.remove("head-hidden"); // scrolling up → show
    }
    lastY = y;
  }

  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
})();
</script>

<script>
/* ── (SPY) Fluid scroll-reveal accordion ────────────────────────────────────
   Sections unfold as you scroll DOWN to them and fold back as you scroll UP
   past them — the "expand on down-scroll, collapse on up-scroll" behaviour.

   Why this feels fluid (unlike a strict one-open-at-a-time accordion): every
   open/close happens near the BOTTOM edge of the screen — a section opens just
   as its header reaches the bottom (its body expands below the fold, off
   screen) and closes only once its header drops back past the bottom. Nothing
   in the part of the page you are reading ever changes height, so there is no
   jump and no need to fight the scroll with programmatic scrolling. */
(function () {
  function init() {
    if (window.__smdSpyWired) return;
    window.__smdSpyWired = true;

    var OPEN_FRAC = 0.85;  // open once the header rises into the top 85% of the screen
    var CLOSE_FRAC = 1.0;  // close again only when the header drops to the very bottom edge
    var PAUSE_MS = 3500;   // after a manual tap, leave the accordion alone this long
    var pausedUntil = 0;
    var raf = false;
    var mutating = false;

    function oa() { return document.getElementById("outputArea"); }
    function cards() {
      var o = oa();
      return o ? Array.prototype.slice.call(o.querySelectorAll(".card.smd-acc")) : [];
    }
    function hdr(c) { return c.querySelector(":scope > h2"); }
    function isOpen(c) { return !c.classList.contains("smd-collapsed"); }
    function setOpen(c, open) {
      if (open) c.classList.remove("smd-collapsed"); else c.classList.add("smd-collapsed");
      var h = hdr(c); if (h) h.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function run() {
      raf = false;
      if (Date.now() < pausedUntil) return;
      var o = oa();
      var list = cards();
      if (!o || !list.length) { if (o) o.classList.remove("smd-spy-on"); return; }
      o.classList.add("smd-spy-on");

      var vh = window.innerHeight || document.documentElement.clientHeight || 0;
      var openLine = vh * OPEN_FRAC;
      var closeLine = vh * CLOSE_FRAC;

      // One top-to-bottom pass. Animation is off during the pass so each toggle's
      // height change is applied before we measure the next header — that keeps
      // the pass self-consistent (and the changes are off-screen anyway).
      o.classList.add("smd-spy-instant");
      var changed = false;
      for (var i = 0; i < list.length; i++) {
        var h = hdr(list[i]); if (!h) continue;
        var top = h.getBoundingClientRect().top;
        var open = isOpen(list[i]);
        // open when the header reaches the bottom band; keep open until it drops
        // all the way back to the bottom edge (hysteresis between the two lines).
        var want = open ? (top < closeLine) : (top <= openLine);
        if (want !== open) { setOpen(list[i], want); changed = true; }
      }
      if (changed) {
        mutating = true;
        requestAnimationFrame(function () { o.classList.remove("smd-spy-instant"); mutating = false; });
      } else {
        o.classList.remove("smd-spy-instant");
      }
    }
    function schedule() { if (!raf) { raf = true; requestAnimationFrame(run); } }

    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", schedule, { passive: true });

    // a manual tap (header, or Expand/Collapse all) wins for a short window
    function markManual(e) {
      if (e.target && e.target.closest &&
          e.target.closest(".card.smd-acc > h2, [data-smd-acc-all]")) {
        pausedUntil = Date.now() + PAUSE_MS;
      }
    }
    document.addEventListener("click", markManual, true);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") markManual(e);
    }, true);

    var o0 = oa();
    if (o0 && window.MutationObserver) {
      new MutationObserver(function () { if (!mutating) schedule(); })
        .observe(o0, { childList: true, subtree: true });
    }
    schedule();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
<script>
/* ── NFC file-tag taps (smdNfcBoot) ──────────────────────────────────────────
   A tapped folder tag opens the patient's FULL chart (vitals, assessment, meds,
   investigations, timeline - OPDEMR loads all of these itself). Resolution order:
   today's queue ticket -> on-device clinic record -> hospital record by UHID.
   A blank tag opens the assignment sheet (write current / today's / typed UHID).
   Silent no-op where NFC is unsupported (desktop browsers). */
(function () {
  function say(m) { try { if (window.toast) window.toast(m); } catch (e) {} }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {} }
  function same(a, b) {
    if (a == null || a === "" || b == null || b === "") return false;
    return String(a) === String(b) || String(a).toUpperCase() === String(b).toUpperCase();
  }
  function queueTickets() {
    try {
      var s = window.QUEUE && window.QUEUE._st;
      return (s && s.tickets) || [];
    } catch (e) { return []; }
  }
  try { window.onNfcUhid = onNfcUhid; window.SMD_handleScanUid = onNfcUhid; } catch (e) {}
  function onNfcUhid(uhid) {
    uhid = String(uhid == null ? "" : uhid).trim();
    if (!uhid) return;
    if (window.StewardIdentityResolver && window.StewardIdentityResolver.normalizeCarrierValue) {
      var _norm = window.StewardIdentityResolver.normalizeCarrierValue(uhid);
      if (_norm) uhid = _norm;
    }
    buzz();
    say("NFC Tag: UHID " + uhid);
    // 1. Today's queue: route through the workplace-aware opener (GHIS / Connect /
    //    WardSynQ / local clinic), exactly as tapping the ticket would.
    try {
      var tk = queueTickets();
      for (var i = 0; i < tk.length; i++) {
        var t = tk[i] || {};
        if (same(t.stewardId, uhid) || same(t.mrn, uhid) || same(t.ghisPatientId, uhid) || same(t.smdId, uhid) || same(t.id, uhid) || same(t.token, uhid)) {
          if (window.QUEUE && window.QUEUE._openTicketEmr) { window.QUEUE._openTicketEmr(t.id); return; }
        }
      }
    } catch (e) {}
    // 2. On-device clinic store (My Clinic): open the local record directly.
    try {
      var C = window.SMD_CLINIC;
      if (C && C.listPatients && window.OPDEMR && window.OPDEMR.openProfile) {
        var pts = C.listPatients() || [];
        for (var j = 0; j < pts.length; j++) {
          var p = pts[j] || {};
          if (same(p.stewardId, uhid) || same(p.mrn, uhid) || same(p.id, uhid)) {
            window.OPDEMR.openProfile({ source: "local", localStore: C.localStore, patientId: p.id, displayId: p.mrn || p.stewardId || "", name: p.name || ("Patient " + uhid), age: p.age || "", sex: p.sex || "" });
            return;
          }
        }
      }
    } catch (e) {}
    // 3. Hospital record by UHID: OPDEMR loads the profile, vitals, assessment, meds,
    //    investigations and timeline itself (and asks for sign-in when needed).
    try {
      if (window.OPDEMR && window.OPDEMR.openProfile) {
        window.OPDEMR.openProfile({ patientId: uhid, mrn: uhid, name: "Patient " + uhid });
      } else {
        say("No patient chart available for " + uhid);
      }
