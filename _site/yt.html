<!--
  yt.html — an https origin for the YouTube player, nothing else.

  WHY THIS FILE EXISTS
  The native app is a Capacitor WebView served from capacitor://localhost. YouTube's player refuses
  to initialise when the embedding page's origin is not http(s), which surfaces to the user as
  "Error 153: Video player configuration error". Verified on a real device: three URL variants
  (youtube-nocookie, youtube.com, and youtube.com with an explicit origin param) all loaded the
  iframe and none ever reported onReady.

  Changing the app's own scheme to https would fix the origin, but the origin IS the storage key,
  so it would orphan every user's localStorage and IndexedDB across the whole app. Far too much to
  pay for inline video.

  So the app iframes THIS page over https instead. YouTube then sees an https origin
  (stewardmd.in), the player runs, and the video plays inside the lesson. Nothing is downloaded,
  nothing is re-hosted: this is still the rights holder's own player, one frame further out.

  ABUSE SURFACE, DELIBERATELY CLOSED
  A page that embeds any ?v= you hand it is a generic embedder someone else could point at their
  own content while it sits on our domain. The allow-list below means it will only ever play the
  videos CliniX and PrepReels teach with. Adding a video to either means adding its id here too.
-->

  function param(name) {
    var m = String(location.search || "").match(new RegExp("[?&]" + name + "=([^&]+)"));
    return m ? decodeURIComponent(m[1]) : "";
  }
  function fail(text) {
    var d = document.createElement("div");
    d.className = "msg";
    d.textContent = text;
    document.body.appendChild(d);
  }

  var v = param("v");
  // Structural check first, so a malformed id never reaches the allow-list lookup or the DOM.
  if (!/^[A-Za-z0-9_-]{11}$/.test(v)) { fail("No video requested."); return; }
  if (ALLOW[v] !== 1) { fail("That video is not part of CliniX."); return; }

  var start = parseInt(param("start") || param("t") || "0", 10);
  var end = parseInt(param("end") || "0", 10);   // SURGX step clips stop where the step ends
  // autoplay=1 (PrepReels): start as soon as the card is on screen. With sound when the WebView allows it,
  // otherwise muted (YouTube's own unmute button stays), so a blocked autoplay never leaves a paused frame.
  var auto = param("autoplay") === "1";
  var f = document.createElement("iframe");
  // enablejsapi so the parent can detect that the player really started, and fall back to a
  // link card if it did not. playsinline keeps it in the lesson on iOS instead of going fullscreen.
  f.src = "https://www.youtube.com/embed/" + v +
          "?rel=0&modestbranding=1&playsinline=1&enablejsapi=1" +
          (start > 0 ? "&start=" + start : "") + (end > start ? "&end=" + end : "") + (auto ? "&autoplay=1" : "") +
          "&origin=" + encodeURIComponent(location.origin);
  f.setAttribute("allow", "autoplay; accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen");
  f.setAttribute("allowfullscreen", "");
  f.id = "ytp";
  f.setAttribute("title", "CliniX teaching video");
  document.body.appendChild(f);

  // Relay the player's own events up to the app, so it can tell "playing" from "silently broken".
  window.addEventListener("message", function (e) {
    if (String(e.origin).indexOf("youtube.com") < 0) return;
    try { parent.postMessage({ clinixYt: true, v: v, data: e.data }, "*"); } catch (x) {}
  });
  try { parent.postMessage({ clinixYt: true, v: v, shim: "loaded" }, "*"); } catch (x) {}

  if (auto) {
    window.onYouTubeIframeAPIReady = function () {
      var muted = false, muteAndPlay = function () { if (muted) return; muted = true; try { p.mute(); p.playVideo(); } catch (x) {} setTimeout(report, 300); };
      // State up to the app (its own play/pause, seek, sound and fullscreen controls), commands down from it.
      var report = function () { try { parent.postMessage({ smdYt: true, v: v, state: p.getPlayerState(), muted: p.isMuted() }, "*"); } catch (x) {} };
      window.addEventListener("message", function (e) {
        var d = e && e.data;
        if (e.source !== window.parent || !d || typeof d.smdCmd !== "string") return;
        try {
          if (d.smdCmd === "play") p.playVideo();
          else if (d.smdCmd === "pause") p.pauseVideo();
          else if (d.smdCmd === "seek") p.seekTo(Math.max(0, p.getCurrentTime() + (+d.by || 0)), true);
          else if (d.smdCmd === "mute") p.mute();
          else if (d.smdCmd === "unmute") { p.unMute(); p.setVolume(100); }
        } catch (x) {}
        setTimeout(report, 250);
      });
      var p = new YT.Player("ytp", { events: {
        onStateChange: report,
        onReady: function () {
          try { p.playVideo(); } catch (x) {}
          // Older players do not send onAutoplayBlocked: still unstarted or cued after 3 s means it was blocked.
          setTimeout(function () { try { var st = p.getPlayerState(); if (st === -1 || st === 5) muteAndPlay(); } catch (x) {} }, 3000);
        },
        onAutoplayBlocked: muteAndPlay
      } });
    };
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
