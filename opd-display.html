<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPD Display · StewardMD</title>
<meta name="robots" content="noindex">
<style>
  /* Waiting-room WALL screen: high-contrast, large type, readable across a room. Brand teal on ink.
     All motion is pure CSS (no CDN library) so it animates even on an offline TV. */
  @font-face{ font-family:'Inter Variable'; font-style:normal; font-weight:100 900; font-display:swap; src:url(/assets/fonts/inter-variable.woff2) format('woff2'); }
  @font-face{ font-family:'Material Symbols Rounded'; font-style:normal; font-weight:300 700; font-display:block; src:url(/assets/fonts/material-symbols-rounded.woff2) format('woff2'); }
  :root{
    --ink:#07141c; --ink2:#0d2230; --panel:#102b3a; --line:#1e3d4f;
    --teal:#3fc7b3; --teal-deep:#0e6e63; --text:#eef6f8; --muted:#8fb0c0;
    --call:#ffcf5c; --call-deep:#b8860b; --serve:#57e08b; --busy:#ff7a7a;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(1200px 700px at 80% -10%, #123244 0%, var(--ink) 60%);
    color:var(--text); font-family:'Inter Variable',"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #app{ height:100vh; display:flex; flex-direction:column; padding:2.2vh 2.4vw; gap:1.6vh; }
  header{ display:flex; align-items:center; gap:1.2vw; }
  .brand{ font-size:clamp(20px,2.4vw,40px); font-weight:800; letter-spacing:.3px; display:flex; align-items:center; gap:.7vw; }
  .brand span{ color:var(--teal); }
  .brand .mk{ width:clamp(22px,2.2vw,40px); height:clamp(22px,2.2vw,40px); background:var(--teal); -webkit-mask:url(/logo.png) center/contain no-repeat; mask:url(/logo.png) center/contain no-repeat; flex:none; }
  .brand .clogo{ height:clamp(26px,2.6vw,46px); width:auto; max-width:22vw; object-fit:contain; }
  .clinic{ font-size:clamp(14px,1.5vw,24px); color:var(--muted); font-weight:600; }
  .pw{ display:inline-flex; align-items:center; gap:.4vw; font-size:clamp(10px,.9vw,15px); font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .pw .m{ width:clamp(13px,1.1vw,18px); height:clamp(13px,1.1vw,18px); background:var(--muted); -webkit-mask:url(/logo.png) center/contain no-repeat; mask:url(/logo.png) center/contain no-repeat; }
  .grow{ flex:1; }
  .live{ display:flex; align-items:center; gap:.5vw; color:var(--muted); font-size:clamp(12px,1.1vw,18px); font-weight:600; }
  .dot{ width:.8vw; height:.8vw; min-width:9px; min-height:9px; border-radius:50%; background:var(--serve); animation:ping 2.4s var(--ease) infinite; }
  .clock{ font-variant-numeric:tabular-nums; font-size:clamp(16px,1.7vw,30px); font-weight:700; letter-spacing:1px; }

  /* NOW CALLING hero banner */
  .banner{ display:none; align-items:center; gap:1.6vw; background:linear-gradient(90deg,#3a2c07,#5c4708);
    border:2px solid var(--call); border-radius:18px; padding:1.6vh 1.8vw; box-shadow:0 0 40px rgba(255,207,92,.18); }
  .banner.on{ display:flex; animation:bannerIn .5s var(--ease); }
  .banner.freshpulse{ animation:freshPulse 1s ease-in-out; }
  .banner .tag{ font-size:clamp(16px,1.6vw,28px); font-weight:900; letter-spacing:3px; color:var(--call);
    text-transform:uppercase; white-space:nowrap; display:flex; align-items:center; gap:.5vw; }
  .banner .tag .ms{ font-family:'Material Symbols Rounded'; font-size:clamp(20px,1.9vw,34px); animation:bell 2.2s var(--ease) infinite; }
  .banner .items{ display:flex; flex-wrap:wrap; gap:.8vw 2vw; flex:1; }
  .banner .item{ font-size:clamp(20px,2.2vw,44px); font-weight:800; }
  .banner .item b{ color:var(--call); }
  .banner .item .arrow{ color:var(--muted); margin:0 .5vw; font-weight:600; }

  main{ flex:1; display:grid; gap:1.6vh 1.4vw; grid-template-columns:repeat(auto-fill,minmax(clamp(280px,22vw,460px),1fr));
    align-content:start; overflow:hidden; }
  .card{ background:linear-gradient(180deg,var(--panel),var(--ink2)); border:1px solid var(--line);
    border-top:5px solid var(--teal-deep); border-radius:16px; padding:1.6vh 1.4vw; display:flex; flex-direction:column; gap:1vh;
    min-height:0; will-change:transform,opacity; }
  .card.normal{ border-top-color:var(--serve); } .card.moderate{ border-top-color:var(--call); }
  .card.busy{ border-top-color:var(--busy); } .card.unavailable{ border-top-color:#43596a; opacity:.75; }
  .card.calling{ border-color:var(--call); animation:callGlow 1.7s ease-in-out infinite; }
  .rhead{ display:flex; align-items:baseline; gap:.8vw; }
  .rname{ font-size:clamp(20px,1.9vw,36px); font-weight:800; }
  .rnum{ font-size:clamp(18px,1.7vw,32px); font-weight:800; color:var(--teal); }
  .rdept{ color:var(--muted); font-size:clamp(12px,1.1vw,18px); font-weight:600; text-transform:uppercase; letter-spacing:1.5px; margin-top:-.4vh; }
  .now{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:.4vh; padding:.6vh 0; }
  .now .lbl{ font-size:clamp(12px,1.1vw,18px); font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  .now.call .lbl{ color:var(--call); } .now.serve .lbl{ color:var(--serve); } .now.idle .lbl{ color:var(--muted); }
  .now .who{ font-size:clamp(26px,2.8vw,58px); font-weight:900; line-height:1.05; }
  .now.call .who{ animation:callName 1.7s ease-in-out infinite; }
  .now .cnt{ font-size:clamp(26px,2.8vw,58px); font-weight:900; color:var(--muted); }
  .up{ color:var(--muted); font-size:clamp(13px,1.2vw,20px); font-weight:600; border-top:1px solid var(--line); padding-top:.9vh; min-height:1.2em; }
  .up b{ color:var(--text); font-weight:800; }
  footer{ color:var(--muted); font-size:clamp(11px,1vw,16px); text-align:center; display:flex; align-items:center; justify-content:center; gap:.5vw; }
  .msg{ margin:auto; text-align:center; color:var(--muted); font-size:clamp(18px,2vw,34px); font-weight:600; max-width:70%; }

  @keyframes riseIn{ from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:none} }
  @keyframes callGlow{ 0%,100%{box-shadow:0 0 26px rgba(255,207,92,.20)} 50%{box-shadow:0 0 46px rgba(255,207,92,.42)} }
  @keyframes callName{ 0%,100%{opacity:1} 50%{opacity:.78} }
  @keyframes bannerIn{ from{opacity:0; transform:translateY(-10px) scale(.97)} to{opacity:1; transform:none} }
  @keyframes freshPulse{ 0%,100%{transform:scale(1)} 40%{transform:scale(1.025)} }
  @keyframes bell{ 0%,100%{transform:rotate(0)} 10%{transform:rotate(-12deg)} 20%{transform:rotate(10deg)} 30%{transform:rotate(-6deg)} 40%{transform:rotate(0)} }
  @keyframes ping{ 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--serve) 60%,transparent)} 70%,100%{box-shadow:0 0 0 .9vw transparent} }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand" id="brand"><span class="mk" aria-hidden="true"></span>Steward<span>MD</span></div>
    <div class="clinic" id="clinic"></div>
    <div class="grow"></div>
    <div class="live"><span class="dot" id="livedot"></span><span id="livetxt">Live</span></div>
    <div class="clock" id="clock"></div>
  </header>
  <section class="banner" id="banner"><div class="tag"><span class="ms">campaign</span>Now Calling</div><div class="items" id="bannerItems"></div></section>
  <main id="grid"></main>
  <footer id="foot"></footer>
</div>

<script>
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var P = new URLSearchParams(location.search);
  var token = P.get("t") || "";
  var grid = $("grid"), banner = $("banner"), bannerItems = $("bannerItems");
  var prevCalling = new Set();

  function clock(){ var d = new Date(); $("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  clock(); setInterval(clock, 5000);

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); }
  function message(t){ grid.innerHTML = '<div class="msg">' + esc(t) + '</div>'; banner.classList.remove("on"); }

  // White-label: a Pro clinic's logo becomes the primary brand with "powered by StewardMD" (server sends org.logo).
  function setBrand(org){
    org = org || {};
    if(org.logo){
      $("brand").innerHTML = '<img class="clogo" src="' + esc(org.logo) + '" alt="' + esc(org.name || "Clinic") + '"/>' +
        '<span class="pw">powered by <span class="m" aria-hidden="true"></span>StewardMD</span>';
      $("clinic").textContent = "";
    } else {
      $("brand").innerHTML = '<span class="mk" aria-hidden="true"></span>Steward<span>MD</span>';
      $("clinic").textContent = org.name ? "· " + org.name : "";
    }
  }

  function renderBanner(rooms){
    var calls = [];
    rooms.forEach(function(r){ (r.calling || []).forEach(function(n){ calls.push({ n: n, room: r.number || r.name }); }); });
    if (!calls.length){ banner.classList.remove("on"); return; }
    bannerItems.innerHTML = calls.map(function(c){ return '<span class="item"><b>' + esc(c.n) + '</b><span class="arrow">&rarr;</span>Room ' + esc(c.room) + '</span>'; }).join("");
    banner.classList.add("on");
    // new call since last poll? one-shot attention pulse on the whole banner
    var fresh = calls.some(function(c){ return !prevCalling.has(c.room + "|" + c.n); });
    if (fresh){ banner.classList.remove("freshpulse"); void banner.offsetWidth; banner.classList.add("freshpulse"); }
  }

  function card(r){
    var el = document.createElement("div");
    el.className = "card " + (r.status || "");
    var calling = (r.calling && r.calling.length) ? r.calling[0] : "";
    if (calling) el.classList.add("calling");
    var now;
    if (calling) now = '<div class="now call"><div class="lbl">Now calling</div><div class="who">' + esc(calling) + '</div></div>';
    else if (r.serving) now = '<div class="now serve"><div class="lbl">In consultation</div><div class="who">' + esc(r.serving) + '</div></div>';
    else if (r.status === "unavailable") now = '<div class="now idle"><div class="lbl">Not available</div><div class="who">&middot;</div></div>';
    else now = '<div class="now idle"><div class="lbl">Waiting</div><div class="cnt">' + (r.waiting || 0) + '</div></div>';
    var up = r.upcoming || [];
    var serveLine = (calling && r.serving) ? '<span class="up-serve">In consultation: <b>' + esc(r.serving) + '</b></span> ' : '';
    var upTxt = (up.length ? 'Next: ' + up.map(function(n){ return '<b>' + esc(n) + '</b>'; }).join(" &middot; ") : (r.waiting ? '' : (calling || r.serving ? '' : 'No one waiting')));
    el.innerHTML = '<div class="rhead"><span class="rname">' + esc(r.name) + '</span>' + (r.number ? '<span class="rnum">' + esc(r.number) + '</span>' : '') + '</div>' +
      (r.department ? '<div class="rdept">' + esc(r.department) + '</div>' : '') + now +
      '<div class="up">' + serveLine + upTxt + '</div>';
    return el;
  }

  function renderGrid(rooms){
    grid.innerHTML = "";
    if (!rooms.length){ message("No consultation rooms are open yet."); return; }
    rooms.map(card).forEach(function(el){ grid.appendChild(el); });
  }

  function load(){
    if (P.get("mock") === "1"){
      var rooms = [
        { name:"Dr. Richardson", number:"1", department:"Cardiology", status:"busy", calling:["Asha Kumar"], serving:"R. Mehta", waiting:6, upcoming:["S. Rao","N. Iyer","T. Das"] },
        { name:"Dr. Sharma", number:"2", department:"General Medicine", status:"moderate", serving:"P. Nair", waiting:3, upcoming:["V. Singh","M. Bose"] },
        { name:"Dr. Fernandez", number:"3", department:"Pediatrics", status:"normal", waiting:1, upcoming:["Baby of L. Roy"] },
        { name:"Dr. Gupta", number:"4", department:"Orthopedics", status:"unavailable", waiting:0, upcoming:[] }
      ];
      setBrand({ name: P.get("name") || "Sunrise Clinic", logo: P.get("logo") || "" });
      renderBanner(rooms); renderGrid(rooms);
      return;
    }
    if (!token){ message("This display link is missing its code. Open the link from the OPD console (Display button)."); return; }
    fetch("/api/queue/display?t=" + encodeURIComponent(token), { headers: { Accept: "application/json" } })
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(d){
        $("livedot").style.background = "var(--serve)"; $("livetxt").textContent = "Live";
        if (!d || !d.ok){
          if (d && d.error === "invalid") return message("This display link is not valid or has expired. Generate a new one from the OPD console.");
          if (d && d.error === "not_configured") return message("The OPD board is not set up yet.");
          return message("Could not load the board.");
        }
        setBrand(d.org);
        renderBanner(d.rooms || []);
        renderGrid(d.rooms || []);
        prevCalling = new Set(); (d.rooms || []).forEach(function(r){ (r.calling || []).forEach(function(n){ prevCalling.add((r.number || r.name) + "|" + n); }); });
      })
      .catch(function(){
        $("livedot").style.background = "var(--busy)"; $("livetxt").textContent = "Reconnecting";
        // keep the last board on screen through a transient network blip
      });
  }
  load();
  setInterval(load, 6000);
</script>
<footer style="text-align:center;padding:14px 16px calc(12px + env(safe-area-inset-bottom));color:#94a3b8;font:500 11px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif">&copy; 2026 StewardMD &middot; All rights reserved &middot; <a href="/copyright" style="color:#94a3b8">MAIKNOWLEDGE LLP</a></footer>
</body>
</html>
