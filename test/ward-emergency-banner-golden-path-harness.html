<script>
/* The REAL ward.js driven through the emergency-banner golden path (open the ward list -> a real,
 * server-reported active emergency shows as a banner on the LIST -> open a chart -> the SAME banner
 * is still visible there, without navigating back) against an in-memory stub server whose response
 * shape is confirmed against functions/_wardsynq/emergency-mode.js and its own route-level proof in
 * test/wardsynq-emergency-mode-bridge.test.mjs. This proves the CLIENT half; it is not a live server.
 */
window.__calls = [];
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = "opd-pat-smd-h1-em01", ENC_ID = "wsq-enc-smd-h1-em01";
var ACTIVE = [{
  activationId: "wsq-emergency-org-harness-1", scope: { level: "org", units: [] }, kind: "mass-casualty",
  reason: "Multi-vehicle collision, twelve casualties inbound to ED.",
  relaxations: ["triage-priority-override"], declaredBy: "cfa:admin",
  declaredAt: "2026-09-09T09:00:00.000Z", expiresAt: "2026-09-09T13:00:00.000Z",
  revokedAt: null, revokedBy: null, active: true,
}];

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/list") >= 0) return reply({ ok: true, patients: [{ encounterId: ENC_ID, patientId: PATIENT_ID, class: "IPD", ward: "Medical A", bed: "1", admittedAt: "2026-09-09T06:00:00.000Z" }] });
  if (u.indexOf("/ward/beds") >= 0) return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "Medical A", bedsKnown: true, occupied: [], free: ["1"], unplaced: [] }] });
  if (u.indexOf("/ward/emergency-status") >= 0) return reply({ ok: true, active: ACTIVE, any: true });

  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: 0 });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });
  if (u.indexOf("/ward/collections") >= 0) return reply({ ok: true, requests: [] });
  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });
  if (u.indexOf("/ward/cosign-queue") >= 0) return reply({ ok: true, notes: [], waiting: 0, mine: [], unsubmitted: 0, canSign: false });
  if (u.indexOf("/ward/quality") >= 0) return reply({ ok: true, measures: [] });
  if (u.indexOf("/ward/overrides") >= 0) return reply({ ok: true, report: { overrides: [] } });
  if (u.indexOf("/ward/fhir-exceptions") >= 0) return reply({ ok: true, exceptions: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>

</script>
