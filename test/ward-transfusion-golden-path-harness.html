<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ TASK 3.5: blood bank golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the blood-bank golden path (open a chart -> Blood bank button ->
 * request -> crossmatch -> issue -> two-person bedside check -> start -> observe -> complete)
 * against an in-memory stub server whose response shapes are confirmed against
 * functions/_wardsynq/migrate-transfusion.js and the route-level tests in
 * test/wardsynq-transfusion-bridge.test.mjs, which prove these same contracts persist for real.
 * This proves the CLIENT half; it is not a live server. */
window.__calls = [];
window.__errors = [];
window.addEventListener("error", function (e) { window.__errors.push(String(e.error && e.error.stack || e.message)); });
window.prompt = function (msg) { window.__calls.push({ prompt: msg }); return window.__promptValue || ""; };
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = "opd-pat-smd-h1-tx01", ENC_ID = "wsq-enc-smd-h1-tx01", EPISODE_ID = "txn-smd-h1-tx01-1";
var EP = { episodeId: EPISODE_ID, patientId: PATIENT_ID, component: "red-cells", phase: "requested", crossmatch: null, ledger: [{ event: "requested", actorId: "cfa:doctor", at: "2026-09-09T08:00:00.000Z" }] };

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/list") >= 0) return reply({ ok: true, patients: [{ encounterId: ENC_ID, patientId: PATIENT_ID, class: "IPD", ward: "Medical A", bed: "1", admittedAt: "2026-09-09T06:00:00.000Z" }] });
  if (u.indexOf("/ward/beds") >= 0) return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "Medical A", bedsKnown: true, occupied: [], free: ["1"], unplaced: [] }] });

  if (u.indexOf("/ward/transfusion-queue") >= 0) return reply({ ok: true, patientId: PATIENT_ID, episodes: [EP] });
  if (u.indexOf("/ward/transfusion-request") >= 0 && (opts && opts.method) === "POST") {
    return reply({ ok: true, written: 1, episodeId: EPISODE_ID, phase: "requested" });
  }
  if (u.indexOf("/ward/transfusion-crossmatch") >= 0 && (opts && opts.method) === "POST") {
    EP.phase = "crossmatched";
    EP.crossmatch = { unitId: body.unitId, aboGroup: body.aboGroup, rhD: body.rhD, verdict: { abo: "O to A" } };
    return reply({ ok: true, written: 1, phase: "crossmatched" });
  }
  if (u.indexOf("/ward/transfusion-issue") >= 0 && (opts && opts.method) === "POST") { EP.phase = "issued"; return reply({ ok: true, written: 1, phase: "issued" }); }
  if (u.indexOf("/ward/transfusion-bedside-check") >= 0 && (opts && opts.method) === "POST") {
    if (body.scannedUnitId !== EP.crossmatch.unitId) return reply({ ok: false, status: 409, error: "transfusion_refused", code: "WRONG_UNIT", detail: "the unit at the bedside is not the unit crossmatched for this patient" });
    EP.phase = "checked"; return reply({ ok: true, written: 1, phase: "checked" });
  }
  if (u.indexOf("/ward/transfusion-start") >= 0 && (opts && opts.method) === "POST") { EP.phase = "transfusing"; return reply({ ok: true, written: 1, phase: "transfusing" }); }
  if (u.indexOf("/ward/transfusion-observe") >= 0 && (opts && opts.method) === "POST") { return reply({ ok: true, written: 1, observations: [body.vitals] }); }
  if (u.indexOf("/ward/transfusion-complete") >= 0 && (opts && opts.method) === "POST") { EP.phase = "completed"; return reply({ ok: true, written: 1, phase: "completed" }); }

  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: 0 });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });
  if (u.indexOf("/ward/collections") >= 0) return reply({ ok: true, requests: [] });
  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
