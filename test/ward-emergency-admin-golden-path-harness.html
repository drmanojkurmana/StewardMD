<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ: emergency declare/deactivate golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the emergency declare/deactivate golden path (ward list ->
 * Emergency button -> declare a real emergency with a real relaxation -> it appears in the log and
 * the visible-status banner -> stand it down -> the log shows it stood down and the banner clears)
 * against an in-memory stub server whose response shapes are confirmed against
 * functions/_wardsynq/emergency-mode.js. Proves the CLIENT half; it is not a live server. */
window.__calls = [];
window.prompt = function (msg) { window.__calls.push({ prompt: msg }); return "Surge resolved, all patients relocated."; };
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var ACTIVATIONS = [];
var seq = 0;

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/list") >= 0) return reply({ ok: true, patients: [] });
  if (u.indexOf("/ward/beds") >= 0) return reply({ ok: true, wards: [] });

  if (u.indexOf("/ward/emergency-declare") >= 0 && (opts && opts.method) === "POST") {
    seq++;
    var a = { activationId: "wsq-emergency-org-harness-" + seq, kind: body.kind, reason: body.reason, relaxations: body.relaxations || [], declaredAt: "2026-09-09T09:00:00.000Z", expiresAt: "2026-09-09T13:00:00.000Z", revokedAt: null, revokedBy: null, active: true };
    ACTIVATIONS.push(a);
    return reply({ ok: true, written: 1, activationId: a.activationId, active: true, kind: a.kind, reason: a.reason, relaxations: a.relaxations });
  }
  if (u.indexOf("/ward/emergency-deactivate") >= 0 && (opts && opts.method) === "POST") {
    var found = ACTIVATIONS.filter(function (x) { return x.activationId === body.activationId; })[0];
    if (found) { found.active = false; found.revokedAt = "2026-09-09T10:00:00.000Z"; found.revokedReason = body.reason; }
    return reply({ ok: true, written: 1, active: false });
  }
  if (u.indexOf("/ward/emergency-log") >= 0) return reply({ ok: true, activations: ACTIVATIONS.slice().reverse(), active: ACTIVATIONS.filter(function (a) { return a.active; }).length });
  if (u.indexOf("/ward/emergency-status") >= 0) return reply({ ok: true, active: ACTIVATIONS.filter(function (a) { return a.active; }), any: ACTIVATIONS.some(function (a) { return a.active; }) });

  if (u.indexOf("/ward/cosign-queue") >= 0) return reply({ ok: true, notes: [], waiting: 0, mine: [], unsubmitted: 0, canSign: false });
  if (u.indexOf("/ward/quality") >= 0) return reply({ ok: true, measures: [] });
  if (u.indexOf("/ward/overrides") >= 0) return reply({ ok: true, report: { overrides: [] } });
  if (u.indexOf("/ward/fhir-exceptions") >= 0) return reply({ ok: true, exceptions: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
