<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ TASK 4.17: ROI golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the ROI golden path (open a chart -> ROI button -> request a
 * release -> authorize it with a stated basis -> fulfill it with a real disclosure count -> a
 * second request is denied with a reason) against an in-memory stub server whose response shapes
 * are confirmed against functions/_wardsynq/roi.js and its own route-level proof in
 * test/wardsynq-roi-bridge.test.mjs. This proves the CLIENT half; it is not a live server. */
window.__calls = [];
window.prompt = function (msg) {
  window.__calls.push({ prompt: msg });
  if (/authorization basis/i.test(msg)) return "Signed patient authorization on file, ref #99.";
  if (/denying/i.test(msg)) return "No authorization provided by the requester.";
  if (/delivered how/i.test(msg)) return "emailed";
  if (/how many records/i.test(msg)) return "3";
  return window.__promptValue || "";
};
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = "opd-pat-smd-h1-roi01", ENC_ID = "wsq-enc-smd-h1-roi01";
var REQUESTS = [];
var seq = 0;

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };
  var refuse = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(Object.assign({ ok: false }, obj)); } }); };

  if (u.indexOf("/ward/list") >= 0) return reply({ ok: true, patients: [{ encounterId: ENC_ID, patientId: PATIENT_ID, class: "IPD", ward: "Medical A", bed: "1", admittedAt: "2026-09-09T06:00:00.000Z" }] });
  if (u.indexOf("/ward/beds") >= 0) return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "Medical A", bedsKnown: true, occupied: [], free: ["1"], unplaced: [] }] });

  if (u.indexOf("/ward/roi-request") >= 0 && (opts && opts.method) === "POST") {
    seq++;
    var reqObj = { roiId: "wsq-roi-" + seq, patientId: PATIENT_ID, requester: body.requester, purpose: body.purpose, recipient: body.recipient, scope: body.scope, authorizationBasis: null, state: "requested", requestedAt: "2026-09-09T09:00:00.000Z", decisionReason: null, disclosure: null };
    REQUESTS.push(reqObj);
    return reply({ ok: true, written: 1, roiId: reqObj.roiId, state: "requested" });
  }
  if (u.indexOf("/ward/roi-authorize") >= 0 && (opts && opts.method) === "POST") {
    var r1 = REQUESTS.filter(function (x) { return x.roiId === body.roiId; })[0];
    if (!body.authorizationBasis) return refuse({ status: 409, error: "AUTHORIZATION_BASIS_REQUIRED", detail: "authorizing a release needs a stated basis" });
    r1.state = "authorized"; r1.authorizationBasis = body.authorizationBasis;
    return reply({ ok: true, written: 1, state: "authorized" });
  }
  if (u.indexOf("/ward/roi-deny") >= 0 && (opts && opts.method) === "POST") {
    var r2 = REQUESTS.filter(function (x) { return x.roiId === body.roiId; })[0];
    if (!body.reason) return refuse({ status: 422, error: "REASON_REQUIRED", detail: "a denial must say why" });
    r2.state = "denied"; r2.decisionReason = body.reason;
    return reply({ ok: true, written: 1, state: "denied" });
  }
  if (u.indexOf("/ward/roi-fulfill") >= 0 && (opts && opts.method) === "POST") {
    var r3 = REQUESTS.filter(function (x) { return x.roiId === body.roiId; })[0];
    r3.state = "fulfilled"; r3.disclosure = { deliveredStatus: body.deliveredStatus, resourceCounts: body.resourceCounts, at: "2026-09-09T10:00:00.000Z" };
    return reply({ ok: true, written: 1, state: "fulfilled" });
  }
  if (u.indexOf("/ward/roi-requests") >= 0) return reply({ ok: true, patientId: PATIENT_ID, requests: REQUESTS.slice().reverse(), shareExternalConsent: { status: "not-recorded" } });

  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: 0 });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });
  if (u.indexOf("/ward/collections") >= 0) return reply({ ok: true, requests: [] });
  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
