<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paywall sheet fixture</title>
<!-- Host page for test/run-paywall-ui.mjs: the REAL pro-paywall.js on a real page. Only the network
     and the Firebase user are stubbed; /api/billing/plans answers with the server ladder shape
     (paise), so every price, strike-through, SAVE% and per-day figure on screen is computed by the
     shipping code from a payload, never hardcoded in the sheet. -->
<style>
  :root { --paper:#f6f7f5; --ink:#14202b; --panel:#fff; --line:#d7dee3; --slate:#2d4356; --slate-soft:#5a7184;
          --teal:#0e6e63; --teal-soft:#e3f1ee; --gold:#b9852a; --green:#1c7a4a; --green-bg:#e7f5ec; --green-line:#aedcc1;
          --sans: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; --serif: Georgia, "Times New Roman", serif; }
  body { margin:0; font-family: var(--sans); background:#fff; }
</style>
<script>
  window.PLANS = { plans: {
    monthly: { months: 1, amount: 59900 }, annual: { months: 12, amount: 599000 },
    tiers: {
      student:      { amount: 19900, annual: 199000, regular:  39900, label: "Trainee", requiresVerify: true },
      coresident:   { amount: 29900, annual: 299000, regular:  99900, seats: 2, label: "Co-Resident" },
      pro:          { amount: 59900, annual: 599000, regular:  99900, label: "Pro", popular: true },
      physician:    { amount: 74900, annual: 749000, regular: 149900, label: "Physician" },
      physicianpro: { amount: 89900, annual: 899000, regular: 249900, label: "Physician Pro", premium: true }
    },
    addons: { onco: { amount: 8900, label: "Physician Onco" } },
    tokens: { boost: { mt: 50000, amount: 4900 }, plus: { mt: 250000, amount: 19900, regular: 24500, popular: true }, power: { mt: 750000, amount: 49900, regular: 73500 } }
  } };
  window.STATUS = { signedIn: true, pro: false, promo: false, verified: true };
  /* Screenshot flags (single-shot headless runs cannot click): ?promo=1 serves a launch-promo
     status, ?dark=1 flips the host surfaces to the app's dark tokens. Same host harness for
     before/after captures; only the sheet code under test differs. */
  (function () {
    var q = location.search || "";
    if (/[?&]promo=1/.test(q)) window.STATUS = { signedIn: true, pro: false, promo: true, verified: true, promoUntil: Date.UTC(2026, 5, 30, 12, 0, 0) };
    if (/[?&]dark=1/.test(q)) {
      var s = document.createElement("style");
      s.textContent = ":root{--paper:#0b141a;--ink:#e9f1ee;--panel:#14242c;--line:#2a3f47;--slate:#c2d1d4;--slate-soft:#8fa3ab}body{background:#0b141a}";
      document.head.appendChild(s);
    }
  })();
  window.SMD_PRO = { isProSync: function () { return false; }, proState: function () { return window.STATUS; }, sync: function () { return Promise.resolve(window.STATUS); } };
  window.SMD_AUTH = { currentUser: { getIdToken: function () { return Promise.resolve("tok"); } } };
  window.toast = function () {};
  window.fetch = function (url) {
    var body = String(url).indexOf("/plans") > -1 ? window.PLANS : window.STATUS;
    return Promise.resolve({ ok: true, status: 200, clone: function () { return this; }, json: function () { return Promise.resolve(body); } });
  };
  /* Same shape as the app registry (home.js ICONS.get): bare viewBox svg, real path data for
     the names the paywall sheet uses. pro-paywall.js stamps width/height itself. */
  window.ICONS = { get: function (name) {
    var P = {
      note: '<path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h5"/>',
      mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/>',
      rounds: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="m9 13 2 2 4-4"/>',
      brain: '<path d="M12 4.6a3 3 0 0 0-5 1.6A2.8 2.8 0 0 0 4.6 11a2.8 2.8 0 0 0 1 4.6A2.6 2.6 0 0 0 9 19a2.6 2.6 0 0 0 3 .6"/><path d="M12 4.6a3 3 0 0 1 5 1.6A2.8 2.8 0 0 1 19.4 11a2.8 2.8 0 0 1-1 4.6A2.6 2.6 0 0 1 15 19a2.6 2.6 0 0 1-3 .6"/><path d="M12 5v14"/>',
      close: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      check: '<path d="m5 12 5 5L20 7"/>',
      bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'
    };
    return '<svg viewBox="0 0 24 24" class="smd-ico" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (P[name] || "") + "</svg>";
  } };
</script>
</head>
<body>
<main style="height:100vh;padding:20px;font:600 14px var(--sans);color:#5a7184">StewardMD (fixture)</main>
<script src="/pro-paywall.js"></script>
</body>
</html>
