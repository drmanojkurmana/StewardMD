<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ ED: golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the ED golden path (arrival of an unidentified patient -> triage
 * -> the chart's shared cards -> a resuscitation bundle -> disposition, admitted) against an
 * in-memory stub server whose response shapes are confirmed against functions/_wardsynq/migrate-ed.js
 * / migrate-resus.js and the route-level tests in test/wardsynq-ed.test.mjs, which prove these same
 * contracts persist for real. This proves the CLIENT half; it is not a live server. */
window.__calls = [];
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = null, ENC_ID = null, MRN = null;
var ACUITY = null;
var BUNDLE_ID = null, BUNDLE_STATE = null;
var IPD_ENC_ID = null;

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/ed-list") >= 0) {
    return reply({ ok: true, patients: ENC_ID ? [{ encounterId: ENC_ID, patientId: PATIENT_ID, mrn: MRN, chiefComplaint: "Found down, unresponsive", acuity: ACUITY, arrivedAt: "2026-09-09T03:00:00.000Z" }] : [] });
  }
  if (u.indexOf("/ward/ed-arrival") >= 0 && (opts && opts.method) === "POST") {
    MRN = "TRAUMA-UNKNOWN-MALE-20260909-01";
    PATIENT_ID = "opd-pat-trauma-unknown-male-20260909-01"; ENC_ID = "wsq-ed-" + PATIENT_ID + "-2026-09-09t03-00-00-000z";
    return reply({ ok: true, written: 2, encounterId: ENC_ID, patientId: PATIENT_ID, mrn: MRN, provisional: true, version: 1 });
  }
  if (u.indexOf("/ward/ed-triage") >= 0 && (opts && opts.method) === "POST") {
    ACUITY = body.acuity;
    return reply({ ok: true, written: 1, encounterId: ENC_ID, acuity: ACUITY, version: 2 });
  }
  if (u.indexOf("/ward/ed-disposition") >= 0 && (opts && opts.method) === "POST") {
    if (body.disposition === "admitted") {
      IPD_ENC_ID = "wsq-adm-" + PATIENT_ID + "-2026-09-09t04-00-00-000z";
      return reply({ ok: true, written: 2, encounterId: ENC_ID, disposition: "admitted", admittedEncounterId: IPD_ENC_ID, patientId: PATIENT_ID, version: 3 });
    }
    return reply({ ok: true, written: 1, encounterId: ENC_ID, disposition: body.disposition, patientId: PATIENT_ID, version: 3 });
  }

  if (u.indexOf("/ward/beds") >= 0) {
    return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "ICU", bedsKnown: true, occupied: [], free: ["1", "2"], unplaced: [] }] });
  }

  if (u.indexOf("/ward/resus-start") >= 0 && (opts && opts.method) === "POST") {
    BUNDLE_ID = "wsq-resus-" + PATIENT_ID + "-code-sepsis-2026-09-09t03-00-00-000z";
    BUNDLE_STATE = bundleStatus(false);
    return reply({ ok: true, written: 1, bundleId: BUNDLE_ID, status: BUNDLE_STATE });
  }
  if (u.indexOf("/ward/resus-mark") >= 0 && (opts && opts.method) === "POST") {
    BUNDLE_STATE = bundleStatus(true);
    return reply({ ok: true, written: 1, bundleId: BUNDLE_ID, status: BUNDLE_STATE });
  }
  if (u.indexOf("/ward/resus") >= 0 && (!opts || (opts.method || "GET") === "GET")) {
    return reply({ ok: true, bundles: BUNDLE_ID ? [Object.assign({ bundleId: BUNDLE_ID }, BUNDLE_STATE)] : [] });
  }

  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: Object.keys((body && body.vitals) || {}).length });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });
  if (u.indexOf("/ward/collections") >= 0) return reply({ ok: true, requests: [] });
  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });

  return reply({ ok: true });
};

function bundleStatus(lactateDone) {
  return {
    code: "code-sepsis", label: "Code Sepsis", state: "running", timeZero: "2026-09-09T03:00:00.000Z", elapsedMinutes: 10,
    elements: [
      { key: "lactate", label: "Measure lactate", done: lactateDone, doneAt: lactateDone ? "2026-09-09T03:10:00.000Z" : null, targetMinutes: 60, minutesRemaining: lactateDone ? null : 50, overdue: false, notApplicable: false },
      { key: "cultures", label: "Blood cultures BEFORE antibiotics", done: false, targetMinutes: 60, minutesRemaining: 50, overdue: false, notApplicable: false },
      { key: "antibiotics", label: "Broad-spectrum antibiotics", done: false, targetMinutes: 60, minutesRemaining: 50, overdue: false, notApplicable: false },
    ],
    breaches: [], nextDue: null, compliant: false,
  };
}
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
