<script>
// Off-device: no native Drive token (SMD_getDriveToken absent) -> create still boots locally; Drive
// publish/discover fail gracefully. The EMR overlay is mocked so we assert the source:"shared" handoff
// without pulling opd-emr's whole dependency graph. localStorage/sessionStorage are the real browser ones.
window.confirm = function () { return true; };
window.__opened = null;
window.OPDEMR = { openProfile: function (opts) { window.__opened = opts; } };   // record the handoff
</script>
