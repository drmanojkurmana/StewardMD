<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ TASK 3.1: specimen collection golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the specimen-collection golden path (open a chart -> order a lab
 * test -> see it uncollected -> Collect -> wristband scan -> collected, with a real accession
 * number) against an in-memory stub server whose response shapes are confirmed against
 * functions/_wardsynq/specimen.js and the route-level tests in
 * test/wardsynq-lab-specimen-safeguards.test.mjs, which prove these same contracts persist for
 * real. This proves the CLIENT half; it is not a live server. */
window.__calls = [];
window.__prompts = [];
window.prompt = function (msg) { window.__calls.push({ prompt: msg }); return window.__prompts.shift() || ""; };
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = "opd-pat-smd-h1-lab01", ENC_ID = "wsq-enc-smd-h1-lab01", MRN = "SMD-H1-LAB01", SR_ID = "wsq-sr-lab-h1";
var COLLECTED = false, ACCESSION = null;

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/list") >= 0) return reply({ ok: true, patients: [{ encounterId: ENC_ID, patientId: PATIENT_ID, class: "IPD", ward: "Medical A", bed: "1", admittedAt: "2026-09-09T06:00:00.000Z" }] });
  if (u.indexOf("/ward/beds") >= 0) return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "Medical A", bedsKnown: true, occupied: [], free: ["1"], unplaced: [] }] });

  if (u.indexOf("/ward/collections") >= 0) {
    return reply({ ok: true, patientId: PATIENT_ID, requests: [{
      serviceRequestId: SR_ID, code: "Renal profile", display: "Renal profile", category: "laboratory", priority: "routine",
      collection: COLLECTED ? { state: "collected", at: "2026-09-09T09:00:00.000Z", specimenId: "wsq-spec-1" } : { state: "none", detail: "No sample has been taken for this request." },
    }], awaitingCollection: COLLECTED ? 0 : 1, inTransit: COLLECTED ? 1 : 0 });
  }
  if (u.indexOf("/ward/collect") >= 0 && (opts && opts.method) === "POST") {
    if (body.scannedPatientBarcode && body.scannedPatientBarcode.toUpperCase() !== MRN) {
      return reply({ ok: false, status: 409, error: "wrong_patient_scan", detail: "the scanned wristband does not match the patient this order belongs to", written: 0 });
    }
    COLLECTED = true; ACCESSION = "ACC-" + Date.now().toString(36).toUpperCase();
    return reply({ ok: true, written: 1, specimenId: "wsq-spec-1", accessionNumber: ACCESSION, state: "collected", note: "Collected. The laboratory has not received it yet, and no result has been produced." });
  }

  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });
  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: 0 });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
