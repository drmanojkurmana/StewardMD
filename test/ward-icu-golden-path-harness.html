<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ ICU: golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the ICU golden path (bed board -> admit with the ICU checkbox ->
 * chart -> device association -> a device reading) against an in-memory stub server whose response
 * shapes are confirmed against functions/_wardsynq/migrate-inpatient.js / migrate-device.js and the
 * route-level tests in test/wardsynq-icu.test.mjs, which prove these same contracts persist for
 * real. This proves the CLIENT half; it is not a live server. */
window.__calls = [];
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = null, ENC_ID = null, MRN = "SMD-H1-ICU01", ADMIT_CLASS = null;
var DEVICE = null;

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/list") >= 0) {
    return reply({ ok: true, patients: ENC_ID ? [{ encounterId: ENC_ID, patientId: PATIENT_ID, class: ADMIT_CLASS, ward: "ICU", bed: "3", admittedAt: "2026-09-09T09:00:00.000Z" }] : [] });
  }
  if (u.indexOf("/ward/beds") >= 0) {
    return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "ICU", bedsKnown: true, occupied: [], free: ["3", "4"], unplaced: [] }] });
  }
  if (u.indexOf("/patient/get") >= 0) {
    return reply({ ok: true, patient: { mrn: MRN, name: "ICU Harness Patient", ageYears: 62, gender: "male" } });
  }
  if (u.indexOf("/ward/admit") >= 0 && (opts && opts.method) === "POST") {
    ADMIT_CLASS = body.class === "ICU" ? "ICU" : "IPD";
    PATIENT_ID = "opd-pat-smd-h1-icu01"; ENC_ID = "wsq-enc-smd-h1-icu01";
    return reply({ ok: true, written: 1, encounterId: ENC_ID, patientId: PATIENT_ID, version: 1 });
  }

  if (u.indexOf("/ward/device-list") >= 0) {
    return reply({ ok: true, devices: DEVICE ? [DEVICE] : [] });
  }
  if (u.indexOf("/ward/device-associate") >= 0 && (opts && opts.method) === "POST") {
    var a = body.association || {};
    if (String(a.scannedWristband || "").toUpperCase() !== MRN) return reply({ ok: false, status: 422, error: "WRISTBAND_MISMATCH" });
    DEVICE = { deviceId: a.device.deviceId, assetTag: a.device.assetTag, kind: "monitor" };
    return reply({ ok: true, written: 1, deviceId: DEVICE.deviceId, association: DEVICE, version: 1 });
  }
  if (u.indexOf("/ward/device-dissociate") >= 0 && (opts && opts.method) === "POST") {
    DEVICE = null;
    return reply({ ok: true, written: 1, deviceId: body.deviceId });
  }

  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: Object.keys((body && body.vitals) || {}).length });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });
  if (u.indexOf("/ward/collections") >= 0) return reply({ ok: true, requests: [] });
  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
