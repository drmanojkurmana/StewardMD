<script>
// BOTH Phase D flags ON (smd_onco_protocols + smd_onco_recommend) - the flow is gated behind both.
window.SMD_QUEUE_FLAGS = { bool: function (k) { return String(k).indexOf("smd_onco_") === 0; } };
window.toast = function (m) { window.__toasts = (window.__toasts || []).concat([m]); };
window.__flowEvents = [];
window.__flowPayloads = {};
document.addEventListener("smd-onco-flow", function (e) {
  var d = e.detail || {};
  window.__flowEvents.push(d.action);
  if (d.action) window.__flowPayloads[d.action] = d.payload || null;
});

  {
    id: "fx-dlbcl-rchopd", name: "FX R-CHOP-D", protocolVersion: "1.0", status: "ACTIVE",
    disease: "Diffuse large B-cell lymphoma", diseaseId: "dlbcl", stage: ["III", "IV"],
    biomarkers: { CD20: "positive" }, treatmentSetting: "curative-intent", treatmentIntent: ["curative"], lineOfTherapy: "first",

      { id: "rituximab", name: "Rituximab", basis: "bsa", dosePerUnit: 375, unit: "mg/m2", route: "IV", days: [1], roundingRule: { increment: 50 } },

      guideline: [{ layer: "guideline", source: "NCCN B-cell Lymphomas", evidenceStatus: "current" }] }
  },
  {
    id: "fx-dlbcl-alt", name: "FX DLBCL Alt", protocolVersion: "0.9", status: "ACTIVE",
    disease: "Diffuse large B-cell lymphoma", diseaseId: "dlbcl", stage: ["III", "IV"],
    treatmentIntent: ["curative"],
    regimen: { cycleLengthDays: 21, cycles: 3, drugs: [
      { id: "cyclophosphamide", name: "Cyclophosphamide", basis: "bsa", dosePerUnit: 750, unit: "mg/m2", route: "IV", days: [1], roundingRule: { increment: 50 } }

  },
  {

    disease: "Non small cell lung cancer", diseaseId: "nsclc", stage: ["IV"], treatmentIntent: ["palliative"],

  }
];

// ---- Patient / assessment context ----
window.__ctx = {
  patient: { name: "Test Patient", mrn: "MR-1001" },
  age: 55, sex: "female", heightCm: 165, weightKg: 60, creatinine: 0.9,

window.__ready = false;
</script>
