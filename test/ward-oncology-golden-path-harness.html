<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ ONCqis bridge: golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the ONCqis bridge golden path (open a chart -> Oncology button ->
 * link a plan -> record a diagnosis with staging -> record a CTCAE-graded adverse event -> record a
 * chemo administration) against an in-memory stub server whose response shapes are confirmed
 * against functions/_wardsynq/migrate-oncology.js and the route-level tests in
 * test/wardsynq-oncology.test.mjs, which prove these same contracts persist for real. This proves
 * the CLIENT half; it is not a live server. */
window.__calls = [];
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = "opd-pat-smd-h1-onco01", ENC_ID = "wsq-enc-smd-h1-onco01", MRN = "SMD-H1-ONCO01";
var LINKS = [], DIAGNOSES = [], AES = [], CHEMOS = [];

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/list") >= 0) return reply({ ok: true, patients: [{ encounterId: ENC_ID, patientId: PATIENT_ID, class: "IPD", ward: "Daycare Oncology", bed: "1", admittedAt: "2026-09-09T06:00:00.000Z" }] });
  if (u.indexOf("/ward/beds") >= 0) return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "Daycare Oncology", bedsKnown: true, occupied: [], free: ["1"], unplaced: [] }] });

  if (u.indexOf("/ward/onco-timeline") >= 0) {
    return reply({ ok: true, timeline: { patientId: PATIENT_ID, links: LINKS, diagnoses: DIAGNOSES, adverseEvents: AES, chemoAdministrations: CHEMOS } });
  }
  if (u.indexOf("/ward/onco-link") >= 0 && (opts && opts.method) === "POST") {
    LINKS = [{ oncoPlanId: body.plan.oncoPlanId, regimen: body.plan.regimen, protocolVersion: body.plan.protocolVersion }];
    return reply({ ok: true, written: 1, linkId: "wsq-onco-link-" + body.plan.oncoPlanId });
  }
  if (u.indexOf("/ward/onco-diagnosis") >= 0 && (opts && opts.method) === "POST") {
    DIAGNOSES = [{ display: body.condition.display, oncologyStaging: body.staging ? { stageGroup: body.staging.stageGroup, t: null, n: null, m: null } : null }];
    return reply({ ok: true, written: 1, conditionId: "wsq-onco-dx-1" });
  }
  if (u.indexOf("/ward/onco-ae") >= 0 && (opts && opts.method) === "POST") {
    if (body.event.grade < 1 || body.event.grade > 5) return reply({ ok: false, status: 422, error: "grade_must_be_1_to_5" });
    AES = [{ term: body.event.term, grade: body.event.grade, ctcaeVersion: "5.0" }];
    return reply({ ok: true, written: 1, eventId: "wsq-onco-ae-1" });
  }
  if (u.indexOf("/ward/onco-chemo") >= 0 && (opts && opts.method) === "POST") {
    CHEMOS = [{ drug: body.admin.drug, doseGiven: body.admin.doseGiven, bsaUsed: body.admin.bsaUsed, extravasation: body.admin.extravasation, startedAt: "2026-09-09T09:00:00.000Z" }];
    return reply({ ok: true, written: 1, chemoId: "wsq-chemo-1" });
  }

  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: 0 });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });
  if (u.indexOf("/ward/collections") >= 0) return reply({ ok: true, requests: [] });
  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
