<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WardSynQ TASK 3.3: pharmacy golden path harness</title>
<link rel="stylesheet" href="../ward.css">
<style>html,body{margin:0;height:100%}</style>
</head><body>
<script>
/* The REAL ward.js driven through the pharmacy golden path (open a chart -> Pharmacy button ->
 * pick an order -> see its safety verdict -> verify -> dispense) against an in-memory stub server
 * whose response shapes are confirmed against functions/_wardsynq/pharmacy-verify.js,
 * functions/_wardsynq/pharmacy-dispense.js and the route-level tests in
 * test/wardsynq-inpatient-emar.test.mjs, which prove these same contracts persist for real. This
 * proves the CLIENT half; it is not a live server. */
window.__calls = [];
localStorage.setItem("smd_opd_staff_tok", "harness-token");

var PATIENT_ID = "opd-pat-smd-h1-ph01", ENC_ID = "wsq-enc-smd-h1-ph01", ORDER_ID = "wsq-mo-ph-h1";
var VERIFIED = false, DISPENSES = [];

window.fetch = function (url, opts) {
  var u = String(url), body = null;
  try { body = opts && opts.body ? JSON.parse(opts.body) : null; } catch (e) {}
  window.__calls.push({ url: u, method: (opts && opts.method) || "GET", body: body });
  var reply = function (obj) { return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(obj); } }); };

  if (u.indexOf("/ward/list") >= 0) return reply({ ok: true, patients: [{ encounterId: ENC_ID, patientId: PATIENT_ID, class: "IPD", ward: "Medical A", bed: "1", admittedAt: "2026-09-09T06:00:00.000Z" }] });
  if (u.indexOf("/ward/beds") >= 0) return reply({ ok: true, bedsConfigured: true, wards: [{ ward: "Medical A", bedsKnown: true, occupied: [], free: ["1"], unplaced: [] }] });

  if (u.indexOf("/ward/verification-queue") >= 0) {
    return reply({ ok: true, patientId: PATIENT_ID,
      orders: [{ orderId: ORDER_ID, drug: "Warfarin 5mg", dose: { value: 5, unit: "mg" }, route: "oral", frequency: "OD",
        state: VERIFIED ? "verified" : "unverified", verification: VERIFIED ? { outcome: "verified" } : null,
        safety: { allowed: true, blocks: [], warnings: [{ code: "NOT_CHECKED_ACTIVE_MED", message: "Could not resolve the patient's other active medications; interaction checking is incomplete." }] } }],
      allergies: [{ substance: "Penicillin", severity: "severe" }], unverified: VERIFIED ? 0 : 1 });
  }
  if (u.indexOf("/ward/dispenses") >= 0) return reply({ ok: true, dispenses: DISPENSES });
  if (u.indexOf("/ward/verify-order") >= 0 && (opts && opts.method) === "POST") {
    VERIFIED = body.outcome === "verified";
    return reply({ ok: true, written: 1, outcome: body.outcome, verifiedBy: "cfa:harness" });
  }
  if (u.indexOf("/ward/dispense") >= 0 && (opts && opts.method) === "POST") {
    DISPENSES = [{ drug: "Warfarin 5mg", quantity: body.quantity, batch: body.batch, expiry: body.expiry, dispensedAt: "2026-09-09T09:00:00.000Z" }];
    return reply({ ok: true, written: 1, dispenseId: "wsq-md-1", note: "Issued to the ward. No dose has been administered, and no administration record was touched." });
  }

  if (u.indexOf("/ward/problems") >= 0) return reply({ ok: true, problems: [] });
  if (u.indexOf("/ward/criticals") >= 0) return reply({ ok: true, loops: [] });
  if (u.indexOf("/ward/balance") >= 0) return reply({ ok: true, balance: null });
  if (u.indexOf("/ward/outbox") >= 0) return reply({ ok: true, transmissions: [] });
  if (u.indexOf("/ward/templates") >= 0) return reply({ ok: true, templates: [] });
  if (u.indexOf("/ward/news2") >= 0) return reply({ ok: true, tool: "NEWS2", score: { scorable: false, reason: "Not enough vitals recorded to score." } });
  if (u.indexOf("/ward/flowsheet") >= 0) return reply({ ok: true, grid: { hours: [], rows: [] } });
  if (u.indexOf("/ward/vitals") >= 0) return reply({ ok: true, written: 0 });
  if (u.indexOf("/ward/schedule") >= 0) return reply({ ok: true, due: [], prn: [], unscheduled: [] });
  if (u.indexOf("/ward/collections") >= 0) return reply({ ok: true, requests: [] });
  if (u.indexOf("/ward/pending-tests") >= 0) return reply({ ok: true, pending: [] });
  if (u.indexOf("/ward/fhir") >= 0) return reply({ resourceType: "Bundle", type: "searchset", entry: [] });

  return reply({ ok: true });
};
</script>
<script src="../ward.js"></script>
<script>
window.__ready = !!(window.WARD && window.WARD.open);
</script>
</body></html>
