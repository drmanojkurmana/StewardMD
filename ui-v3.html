<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StewardMD — UI v3 foundation (Step 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="/ui-v3.css?v=s1" rel="stylesheet">
<style>/* demo-only spacing for the component gallery */ .gal{display:flex;flex-direction:column;gap:10px}</style>
</head>
<body class="v3">
<div class="v3-app">
  <!-- shared AppHeader -->
  <header class="v3-header">
    <button class="v3-ic" aria-label="Menu"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="v3-brand"><div class="v3-mark"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M9 12l2 2 4-4"/></svg></div><div><div class="v3-brand-tt">Steward<span class="v3-md">MD</span></div><div class="v3-brand-sub">Antibiotic Stewardship</div></div></div>
    <div class="v3-spacer"></div>
    <button class="v3-ic" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    <button class="v3-ic v3-dotbadge" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    <div class="v3-avatar">G</div>
  </header>

  <main class="v3-main"><div class="v3-stack">
    <!-- hero -->
    <section class="v3-card v3-hero">
      <div style="flex:1;min-width:0"><h1 class="v3-h-hero">Steward<span class="v3-md">MD</span></h1><span class="v3-tag">Antibiotic Decision Engine</span><p>Evidence-based antimicrobial recommendations at the point of care.</p></div>
      <div class="v3-shield"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><line x1="12" y1="8" x2="12" y2="14"/><line x1="9" y1="11" x2="15" y2="11"/></svg></div>
    </section>

    <!-- quick row -->
    <div class="v3-qrow">
      <button class="v3-qc"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span>Account</span></button>
      <button class="v3-qc"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search</span></button>
      <button class="v3-qc"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Framework</span></button>
      <button class="v3-qc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg><span>Theme</span></button>
    </div>

    <!-- primary + secondary action -->
    <button class="v3-primary"><div class="ic"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="12" y1="12" x2="12" y2="18"/><line x1="9" y1="15" x2="15" y2="15"/></svg></div><div style="flex:1;min-width:0"><div class="tt">Start a Case</div><div class="sub">New clinical decision — choose Simple or Advanced</div></div><div class="arr"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg></div></button>
    <button class="v3-secondary"><div class="ic"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div style="flex:1;min-width:0"><div class="tt">Clinical Reasoning <span style="color:var(--v3-primary);font-size:12px">(Beta)</span></div><div class="sub">Experimental step-by-step reasoning workspace</div></div><div class="arr"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></div></button>

    <!-- quick access -->
    <div class="v3-sec-label">Quick access</div>
    <div class="v3-grid">
      <button class="v3-tile"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg></div><div><div class="tt">My Cases</div><div class="sub">Saved assessments</div></div></button>
      <button class="v3-tile"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 5h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6v13h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3H3Z"/></svg></div><div><div class="tt">Guidelines</div><div class="sub">IDSA · WHO · ICMR</div></div></button>
      <button class="v3-tile"><div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8.01" y2="11"/><line x1="16" y1="11" x2="16.01" y2="11"/></svg></div><div><div class="tt">Calculators</div><div class="sub">50+ tools</div></div></button>
      <button class="v3-tile"><div class="ic"><svg viewBox="0 0 24 24"><path d="M10.5 13.5 3 21M2 18a4 4 0 0 0 6 3l9-9a4 4 0 0 0-6-6L2 14a4 4 0 0 0 0 4Z"/></svg></div><div><div class="tt">Drugs DB</div><div class="sub">Brands · doses · price</div></div></button>
    </div>

    <!-- component gallery (so you can judge the building blocks) -->
    <div class="v3-sec-label">Component preview</div>
    <div class="v3-card gal">
      <div class="v3-seg"><button class="on">Default</button><button>Compact</button><button>Large</button></div>
      <div class="v3-chips"><span class="v3-chip">anticoagulant</span><span class="v3-chip outline">narrow TI</span><span class="v3-chip outline">INR</span></div>
      <button class="v3-btn block">Primary button (52px)</button>
      <button class="v3-btn ghost block">Ghost button</button>
      <button class="v3-btn subtle block">Subtle button</button>
    </div>

    <div class="v3-foot">UI v3 foundation · Step 1 · for review</div>
  </div></main>

  <!-- shared BottomNav -->
  <nav class="v3-tabbar">
    <button class="v3-tab active"><svg viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg><span>Home</span></button>
    <button class="v3-tab"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search</span></button>
    <button class="v3-tab"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg><span>Cases</span></button>
    <button class="v3-tab"><svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 5h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6v13h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3H3Z"/></svg><span>Guides</span></button>
    <button class="v3-tab"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg><span>More</span></button>
  </nav>
</div>
<script>
  document.getElementById("themeBtn").addEventListener("click",function(){document.body.classList.toggle("v3-dark");});
  document.querySelectorAll(".v3-tab").forEach(function(t){t.addEventListener("click",function(){document.querySelectorAll(".v3-tab").forEach(function(x){x.classList.remove("active")});t.classList.add("active");});});
  document.querySelectorAll(".v3-seg button").forEach(function(b){b.addEventListener("click",function(){b.parentNode.querySelectorAll("button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");});});
</script>
</body>
</html>
