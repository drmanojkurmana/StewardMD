<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Childhood dehydration: assess signs, assign plan A, B or C</title> <desc id="d">Assessment across thirst, eyes, skin pinch, urine, pulse, consciousness and shock sorts into no dehydration for plan A home fluids, some dehydration for plan B facility ORS, severe dehydration for plan C IV bolus. Losses and inputs are charted.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Dehydration in children: signs pick the plan</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Thirst, eyes, pinch, urine, pulse, consciousness: read the child, then A, B or C</text> <rect x="40" y="100" width="220" height="250" rx="12" fill="#3D5A54"/> <text x="150" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">PLAN A: none</text> <text x="150" y="154" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">alert, tears present,</text> <text x="150" y="176" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">pinch instant, urine</text> <text x="150" y="198" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">normal</text> <text x="150" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">home: extra fluids,</text> <text x="150" y="250" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">ORS after stools,</text> <text x="150" y="272" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">keep feeding</text> <text x="150" y="304" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">counsel, return if worse</text> <text x="150" y="326" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">chart losses and inputs</text> <rect x="290" y="100" width="220" height="250" rx="12" fill="#071318"/> <text x="400" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">PLAN B: some</text> <text x="400" y="154" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">eager thirst, sunken eyes,</text> <text x="400" y="176" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">slow pinch, scanty urine,</text> <text x="400" y="198" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">rapid pulse, restless</text> <text x="400" y="228" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">facility: ORS dosed by</text> <text x="400" y="250" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">weight over 4 hours,</text> <text x="400" y="272" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">reassess, then A or C</text> <text x="400" y="304" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">NG if vomiting persists</text> <text x="400" y="326" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">zinc 14 days, keep feeds</text> <rect x="540" y="100" width="220" height="250" rx="12" fill="#0B6B5B"/> <text x="650" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">PLAN C: severe</text> <text x="650" y="154" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">unable to drink, no tears,</text> <text x="650" y="176" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">very slow pinch, anuric,</text> <text x="650" y="198" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">thready pulse, floppy,</text> <text x="650" y="220" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">cold peripheries: shock</text> <text x="650" y="250" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">IV Ringer bolus, then</text> <text x="650" y="272" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">ORS + reassess hourly</text> <text x="650" y="304" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">watch lungs: overload kills</text> <text x="650" y="326" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">never antimotility drugs</text> <text x="400" y="390" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Pinch recoil is the bedside clock: instant, slow, or very slow decides the plan.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Some gets ORS, severe gets IV: fluids restore, zinc shortens, feeds continue.</text> </svg>
