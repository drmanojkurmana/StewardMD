t-family="system-ui,sans-serif">Palatopharyngeal</text><text x="500.0" y="271.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">arch (posterior)</text><text x="400.0" y="118.0" font-size="12" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Supratonsillar fossa</text><text x="400.0" y="425.0" font-size="12" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lateral: superior constrictor (the internal carotid lies deep to it)</text><text x="40.0" y="470.0" font-size="12" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Artery: tonsillar branch of the facial artery. Vein: paratonsillar (external palatine) vein.</text><text x="40.0" y="490.0" font-size="12" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Lymph: jugulodigastric node. Nerve: glossopharyngeal (CN IX).</text></svg>