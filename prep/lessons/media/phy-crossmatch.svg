<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d"><title id="t">Crossmatching</title><desc id="d">d</desc><rect width="800" height="390" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Crossmatching</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Type and screen first; electronic issue if no antibodies</text><rect x="68.0" y="96.0" width="320.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="228.0" y="121.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Major crossmatch:</text><text x="228.0" y="137.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">donor red cells + recipient serum</text><rect x="412.0" y="96.0" width="320.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="572.0" y="121.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Minor crossmatch:</text><text x="572.0" y="137.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">donor serum + recipient red cells</text><rect x="68.0" y="194.0" width="320.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="228.0" y="219.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Detects recipient antibodies</text><text x="228.0" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">against donor cells (matters most)</text><rect x="412.0" y="194.0" width="320.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="572.0" y="219.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Detects donor antibodies</text><text x="572.0" y="235.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(largely replaced by screening)</text><rect x="240.0" y="292.0" width="320.0" height="58.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="317.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Emergency: group O negative red cells</text><text x="400.0" y="333.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">while typing is completed</text><line x1="228.0" y1="154.0" x2="228.0" y2="186.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M228.0 194.0 L224.5 185.7 L231.5 185.7 Z" fill="#3D5A54"/><line x1="572.0" y1="154.0" x2="572.0" y2="186.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M572.0 194.0 L568.5 185.7 L575.5 185.7 Z" fill="#3D5A54"/><line x1="228.0" y1="252.0" x2="393.0" y2="290.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M400.0 292.0 L391.1 293.5 L392.7 286.7 Z" fill="#3D5A54"/></svg>