<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" role="img" aria-labelledby="t d"><title id="t">Parts of the duodenum</title><desc id="d">Table of the four parts of the duodenum with vertebral level and key features: D1 bulb at L1 with the commonest ulcer site, D2 with the major papilla, D3 crossing IVC and aorta behind the SMA, D4 to the duodenojejunal flexure at L2.</desc><rect width="800" height="376" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parts of the duodenum</text><text x="104.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Part</text><text x="275.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Level</text><text x="571.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Key points</text><rect x="19.0" y="100.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="130.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">D1 (superior, bulb)</text><line x1="192.0" y1="126.0" x2="215.6" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 126.0 L214.6 129.1 L214.6 122.9 Z" fill="#3D5A54"/><rect x="225.0" y="100.0" width="100.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="275.0" y="130.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">L1</text><line x1="328.0" y1="126.0" x2="351.6" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M358.0 126.0 L350.6 129.1 L350.6 122.9 Z" fill="#3D5A54"/><rect x="361.0" y="100.0" width="420.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="571.0" y="122.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Commonest site of peptic ulcer; posterior ulcer can erode</text><text x="571.0" y="138.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">gastroduodenal artery</text><rect x="19.0" y="164.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="194.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">D2 (descending)</text><line x1="192.0" y1="190.0" x2="215.6" y2="190.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 190.0 L214.6 193.1 L214.6 186.9 Z" fill="#3D5A54"/><rect x="225.0" y="164.0" width="100.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="275.0" y="194.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">L1 to L3</text><line x1="328.0" y1="190.0" x2="351.6" y2="190.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M358.0 190.0 L350.6 193.1 L350.6 186.9 Z" fill="#3D5A54"/><rect x="361.0" y="164.0" width="420.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="571.0" y="194.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Major duodenal papilla (ampulla of Vater) on medial wall</text><rect x="19.0" y="228.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="258.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">D3 (horizontal)</text><line x1="192.0" y1="254.0" x2="215.6" y2="254.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 254.0 L214.6 257.1 L214.6 250.9 Z" fill="#3D5A54"/><rect x="225.0" y="228.0" width="100.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="275.0" y="258.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">L3</text><line x1="328.0" y1="254.0" x2="351.6" y2="254.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M358.0 254.0 L350.6 257.1 L350.6 250.9 Z" fill="#3D5A54"/><rect x="361.0" y="228.0" width="420.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="571.0" y="258.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Crosses IVC and aorta; SMA and SMV in front of it</text><rect x="19.0" y="292.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="322.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">D4 (ascending)</text><line x1="192.0" y1="318.0" x2="215.6" y2="318.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 318.0 L214.6 321.1 L214.6 314.9 Z" fill="#3D5A54"/><rect x="225.0" y="292.0" width="100.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="275.0" y="322.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">L3 to L2</text><line x1="328.0" y1="318.0" x2="351.6" y2="318.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M358.0 318.0 L350.6 321.1 L350.6 314.9 Z" fill="#3D5A54"/><rect x="361.0" y="292.0" width="420.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="571.0" y="314.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ends at duodenojejunal flexure, suspended by the ligament of</text><text x="571.0" y="330.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Treitz</text></svg>