<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Cholangitis: Charcot triad to Reynolds pentad, drain urgently</title> <desc id="d">Biliary stasis plus infection gives Charcot triad: fever, jaundice, right upper quadrant pain. Added shock and confusion make Reynolds pentad: resuscitate, give broad-spectrum antibiotics, decompress urgently by ERCP with sphincterotomy and stent.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cholangitis: three signs warn, five mean crash</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Stasis plus infection under pressure: pus behind a blocked bile duct</text> <g font-family="system-ui,sans-serif" text-anchor="middle"> <rect x="60" y="80" width="200" height="96" rx="12" fill="#0B6B5B"/><text x="160" y="112" font-size="14" font-weight="700" fill="#FFFFFF">FEVER</text><text x="160" y="134" font-size="11.5" font-weight="400" fill="#FFFFFF">infection behind</text><text x="160" y="150" font-size="11.5" font-weight="400" fill="#FFFFFF">the blockage</text> <rect x="280" y="80" width="200" height="96" rx="12" fill="#0B6B5B"/><text x="380" y="112" font-size="14" font-weight="700" fill="#FFFFFF">JAUNDICE</text><text x="380" y="134" font-size="11.5" font-weight="400" fill="#FFFFFF">stasis backs bile</text><text x="380" y="150" font-size="11.5" font-weight="400" fill="#FFFFFF">into blood</text> <rect x="500" y="80" width="200" height="96" rx="12" fill="#0B6B5B"/><text x="600" y="112" font-size="14" font-weight="700" fill="#FFFFFF">RUQ PAIN</text><text x="600" y="134" font-size="11.5" font-weight="400" fill="#FFFFFF">pressure under</text><text x="600" y="150" font-size="11.5" font-weight="400" fill="#FFFFFF">the right ribs</text> </g> <text x="400" y="206" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CHARCOT TRIAD: these three together mean cholangitis until proven otherwise</text> <text x="400" y="238" font-size="16" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">+ SHOCK  +  CONFUSION  =  REYNOLDS PENTAD: the patient is dying</text> <rect x="60" y="258" width="680" height="150" rx="12" fill="#071318"/> <text x="400" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#42CDB5" font-family="system-ui,sans-serif">PENTAD MANAGEMENT: RESUSCITATE, COVER, DRAIN</text> <text x="400" y="314" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">1. Aggressive IV fluids for shock: hypotension here is biliary sepsis</text> <text x="400" y="336" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">2. Broad-spectrum antibiotics at once: do not wait for cultures</text> <text x="400" y="358" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">3. Urgent ERCP: sphincterotomy plus stent to release the pus</text> <text x="400" y="388" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Antibiotics alone never cure an obstructed duct: drain it.</text> <text x="400" y="448" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Gallstone in the common duct is the usual culprit; stent first, clear stones later.</text> <text x="400" y="469" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Confusion plus jaundice is sepsis until proven otherwise: escalate, do not observe.</text> </svg>
