<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Thyroid surgery complications: parathyroids and laryngeal nerves</title> <desc id="d">Two panels. Devitalised or excised parathyroids cause acute hypocalcaemia with perioral paraesthesia, Trousseau carpopedal spasm and Chvostek facial twitching. Recurrent laryngeal nerve injury palsies the voice; external superior laryngeal injury denervates cricothyroid causing vocal fatigue and loss of high pitch.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thyroidectomy: glands behind, nerves beside</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Calcium falls from lost parathyroids; voice fails from bruised nerves</text> <rect x="40" y="100" width="350" height="290" rx="12" fill="#071318"/> <text x="215" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">HYPOPARATHYROIDISM</text> <text x="215" y="156" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">devitalised or excised glands:</text> <text x="215" y="178" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">acute postoperative</text> <text x="215" y="200" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hypocalcaemia</text> <text x="215" y="230" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">perioral paraesthesia</text> <text x="215" y="254" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Trousseau: carpopedal spasm</text> <text x="215" y="278" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Chvostek: facial twitch</text> <text x="215" y="306" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">check calcium, replace IV,</text> <text x="215" y="328" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">add calcitriol long term</text> <text x="215" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">preserve glands in situ</text> <rect x="410" y="100" width="350" height="290" rx="12" fill="#0B6B5B"/> <text x="585" y="130" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">NERVE PALSIES</text> <text x="585" y="156" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">recurrent laryngeal: hoarse</text> <text x="585" y="178" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">or breathy voice, weak cough;</text> <text x="585" y="200" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">bilateral risks airway</text> <text x="585" y="230" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">external superior laryngeal:</text> <text x="585" y="252" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">cricothyroid denervated,</text> <text x="585" y="274" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">vocal fatigue, no high pitch</text> <text x="585" y="306" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">identify nerves before dividing,</text> <text x="585" y="328" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">ligate vessels capsular</text> <text x="585" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">pre-op and post-op voice check</text> <text x="400" y="430" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Tingling mouth plus twitching face on day one: calcium, not reassurance.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Hoarse after thyroidectomy: scope the cords; fatigue on high notes: think superior laryngeal.</text> </svg>
