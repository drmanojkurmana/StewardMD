<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Kaplan-Meier survival curves</title><desc id="d">Two step-down Kaplan-Meier curves, treatment above control, with censoring ticks and a 50 percent line for reading median survival.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Kaplan-Meier survival curves</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Step-down survival over time; ticks mark patients censored (last seen alive)</text><line x1="130" y1="400" x2="670" y2="400" stroke="#071318" stroke-width="2"/><line x1="130" y1="400" x2="130" y2="140" stroke="#071318" stroke-width="2"/><path d="M130 140.0 L216.4 140.0 L216.4 171.2 L313.6 171.2 L313.6 212.8 L410.8 212.8 L410.8 249.2 L518.8 249.2 L518.8 285.6 L626.8 285.6 L626.8 311.6" fill="none" stroke="#0B6B5B" stroke-width="3.5"/><path d="M130 140.0 L205.6 140.0 L205.6 197.2 L292.0 197.2 L292.0 257.0 L389.2 257.0 L389.2 306.4 L497.2 306.4 L497.2 342.8 L616.0 342.8 L616.0 363.6" fill="none" stroke="#B7791F" stroke-width="3.5"/><line x1="270.4" y1="179.8" x2="270.4" y2="193.8" stroke="#0B6B5B" stroke-width="2.5"/><line x1="454" y1="260.4" x2="454" y2="274.4" stroke="#0B6B5B" stroke-width="2.5"/><line x1="130" y1="270" x2="670" y2="270" stroke="#3D5A54" stroke-width="1.5" stroke-dasharray="5 4"/><text x="118" y="270" font-size="11" font-weight="600" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">50%</text><text x="430" y="158" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Treatment</text><text x="470" y="316" font-size="13.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Control</text><text x="400" y="434" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">time from randomisation</text><text x="84" y="270" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 84 270)">still event-free (%)</text><text x="400" y="462" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Median survival: where the curve crosses 50%. Compare curves with the log-rank test.</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Censoring is not dropping out of the maths: censored patients inform the curve until last seen.</text></svg>
