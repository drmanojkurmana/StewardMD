<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" role="img" aria-labelledby="t d"><title id="t">Lower limb nerve injuries</title><desc id="d">Table of lower limb nerve injuries: common peroneal at the fibular neck gives foot drop, tibial gives loss of plantar flexion and sole sensation, femoral gives quadriceps weakness and loss of knee jerk, superior gluteal gives Trendelenburg sign.</desc><rect width="800" height="376" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lower limb nerve injuries</text><text x="99.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Nerve</text><text x="315.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Typical site</text><text x="616.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Motor and sensory loss</text><rect x="19.0" y="100.0" width="160.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="130.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Common peroneal</text><line x1="182.0" y1="126.0" x2="205.6" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M212.0 126.0 L204.6 129.1 L204.6 122.9 Z" fill="#3D5A54"/><rect x="215.0" y="100.0" width="200.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="315.0" y="130.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fibular neck</text><line x1="418.0" y1="126.0" x2="441.6" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M448.0 126.0 L440.6 129.1 L440.6 122.9 Z" fill="#3D5A54"/><rect x="451.0" y="100.0" width="330.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="130.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Foot drop, steppage gait; dorsum of foot numb</text><rect x="19.0" y="164.0" width="160.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="194.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tibial</text><line x1="182.0" y1="190.0" x2="205.6" y2="190.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M212.0 190.0 L204.6 193.1 L204.6 186.9 Z" fill="#3D5A54"/><rect x="215.0" y="164.0" width="200.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="315.0" y="186.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Popliteal fossa,</text><text x="315.0" y="202.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">posterior knee</text><line x1="418.0" y1="190.0" x2="441.6" y2="190.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M448.0 190.0 L440.6 193.1 L440.6 186.9 Z" fill="#3D5A54"/><rect x="451.0" y="164.0" width="330.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="186.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">No plantar flexion or inversion;</text><text x="616.0" y="202.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">calcaneovalgus; sole numb</text><rect x="19.0" y="228.0" width="160.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="258.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Femoral</text><line x1="182.0" y1="254.0" x2="205.6" y2="254.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M212.0 254.0 L204.6 257.1 L204.6 250.9 Z" fill="#3D5A54"/><rect x="215.0" y="228.0" width="200.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="315.0" y="258.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pelvic or inguinal trauma</text><line x1="418.0" y1="254.0" x2="441.6" y2="254.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M448.0 254.0 L440.6 257.1 L440.6 250.9 Z" fill="#3D5A54"/><rect x="451.0" y="228.0" width="330.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="250.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Quadriceps weak, knee gives way, knee jerk</text><text x="616.0" y="266.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">lost; anterior thigh numb</text><rect x="19.0" y="292.0" width="160.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="322.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Superior gluteal</text><line x1="182.0" y1="318.0" x2="205.6" y2="318.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M212.0 318.0 L204.6 321.1 L204.6 314.9 Z" fill="#3D5A54"/><rect x="215.0" y="292.0" width="200.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="315.0" y="322.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Intramuscular injection</text><line x1="418.0" y1="318.0" x2="441.6" y2="318.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M448.0 318.0 L440.6 321.1 L440.6 314.9 Z" fill="#3D5A54"/><rect x="451.0" y="292.0" width="330.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="322.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Trendelenburg sign; waddling gait</text></svg>