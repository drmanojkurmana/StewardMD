<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 498" role="img" aria-labelledby="t d"><title id="t">Course of the thoracic duct</title><desc id="d">Flow diagram of the thoracic duct: starts at the cisterna chyli near T12, passes through the aortic opening, ascends in the posterior mediastinum between aorta and azygos vein, crosses to the left around T5, and drains into the junction of the left internal jugular and subclavian veins.</desc><rect width="800" height="498" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Course of the thoracic duct</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Drains the whole body except the right head, neck, arm and right chest</text><rect x="210.0" y="92.0" width="380.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="120.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cisterna chyli (near T12)</text><rect x="210.0" y="164.0" width="380.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="192.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Through the aortic opening of the diaphragm</text><rect x="210.0" y="236.0" width="380.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="256.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior mediastinum:</text><text x="400.0" y="272.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">between aorta and azygos vein</text><rect x="210.0" y="308.0" width="380.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="336.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Crosses to the left about T5</text><rect x="210.0" y="380.0" width="380.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="400.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Left venous angle:</text><text x="400.0" y="416.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">left internal jugular and subclavian vein</text><line x1="400.0" y1="140.0" x2="400.0" y2="156.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 164.0 L396.5 155.7 L403.5 155.7 Z" fill="#3D5A54"/><line x1="400.0" y1="212.0" x2="400.0" y2="228.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 236.0 L396.5 227.7 L403.5 227.7 Z" fill="#3D5A54"/><line x1="400.0" y1="284.0" x2="400.0" y2="300.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 308.0 L396.5 299.7 L403.5 299.7 Z" fill="#3D5A54"/><line x1="400.0" y1="356.0" x2="400.0" y2="372.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 380.0 L396.5 371.7 L403.5 371.7 Z" fill="#3D5A54"/><text x="400.0" y="480.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The right lymphatic duct drains the right upper quadrant.</text></svg>