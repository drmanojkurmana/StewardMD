<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 411.0" role="img" aria-labelledby="t d"><title id="t">The rule of 4 in the brainstem</title><desc id="d">Table of the rule of 4 for brainstem localisation: four cranial nerves in the medulla IX to XII, four in the pons V to VIII, four above the pons I to IV; four midline M structures and four lateral S structures.</desc><rect width="800" height="411.0" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The rule of 4 in the brainstem</text><text x="177.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Rule</text><text x="558.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Members</text><rect x="37.0" y="100.0" width="280.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="177.0" y="128.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4 cranial nerves above the pons</text><line x1="320.0" y1="124.0" x2="343.6" y2="124.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M350.0 124.0 L342.6 127.1 L342.6 120.9 Z" fill="#3D5A54"/><rect x="353.0" y="100.0" width="410.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="558.0" y="128.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">I, II, III, IV</text><rect x="37.0" y="158.0" width="280.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="177.0" y="186.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4 cranial nerves in the pons</text><line x1="320.0" y1="182.0" x2="343.6" y2="182.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="