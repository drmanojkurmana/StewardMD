<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" role="img" aria-labelledby="t d"><title id="t">Renal anomalies and their cause</title><desc id="d">d</desc><rect width="800" height="376" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Renal anomalies and their cause</text><text x="109.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Anomaly</text><text x="325.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cause</text><text x="616.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Note</text><rect x="24.0" y="100.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="109.0" y="130.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Horseshoe kidney</text><line x1="197.0" y1="126.0" x2="220.6" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M227.0 126.0 L219.6 129.1 L219.6 122.9 Z" fill="#3D5A54"/><rect x="230.0" y="100.0" width="190.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="325.0" y="130.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fusion of lower poles</text><line x1="423.0" y1="126.0" x2="446.6" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M453.0 126.0 L445.6 129.1 L445.6 122.9 Z" fill="#3D5A54"/><rect x="456.0" y="100.0" width="320.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="122.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Trapped under the inferior mesenteric artery;</text><text x="616.0" y="138.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">usually asymptomatic</text><rect x="24.0" y="164.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="109.0" y="194.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pelvic kidney</text><line x1="197.0" y1="190.0" x2="220.6" y2="190.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M227.0 190.0 L219.6 193.1 L219.6 186.9 Z" fill="#3D5A54"/><rect x="230.0" y="164.0" width="190.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="325.0" y="194.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Failure of ascent</text><line x1="423.0" y1="190.0" x2="446.6" y2="190.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M453.0 190.0 L445.6 193.1 L445.6 186.9 Z" fill="#3D5A54"/><rect x="456.0" y="164.0" width="320.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="194.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ectopic, may obstruct labour</text><rect x="24.0" y="228.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="109.0" y="258.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Unilateral agenesis</text><line x1="197.0" y1="254.0" x2="220.6" y2="254.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M227.0 254.0 L219.6 257.1 L219.6 250.9 Z" fill="#3D5A54"/><rect x="230.0" y="228.0" width="190.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="325.0" y="250.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ureteric bud fails to</text><text x="325.0" y="266.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">form</text><line x1="423.0" y1="254.0" x2="446.6" y2="254.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M453.0 254.0 L445.6 257.1 L445.6 250.9 Z" fill="#3D5A54"/><rect x="456.0" y="228.0" width="320.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="258.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Contralateral kidney hypertrophies</text><rect x="24.0" y="292.0" width="170.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="109.0" y="314.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bilateral agenesis</text><text x="109.0" y="330.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(Potter)</text><line x1="197.0" y1="318.0" x2="220.6" y2="318.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M227.0 318.0 L219.6 321.1 L219.6 314.9 Z" fill="#3D5A54"/><rect x="230.0" y="292.0" width="190.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="325.0" y="322.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">No ureteric bud</text><line x1="423.0" y1="318.0" x2="446.6" y2="318.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M453.0 318.0 L445.6 321.1 L445.6 314.9 Z" fill="#3D5A54"/><rect x="456.0" y="292.0" width="320.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="616.0" y="314.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oligohydramnios, lung hypoplasia, limb and</text><text x="616.0" y="330.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">face changes</text></svg>