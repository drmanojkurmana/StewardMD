<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d"><title id="t">Rhesus haemolytic disease of the newborn</title><desc id="d">d</desc><rect width="800" height="480" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Rhesus haemolytic disease of the newborn</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Kleihauer test quantifies the fetal cells; MCA Doppler screens for fetal anaemia</text><rect x="230.0" y="92.0" width="340.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="122.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">RhD-negative mother, RhD-positive fetus</text><rect x="230.0" y="166.0" width="340.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="180.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fetomaternal bleed (delivery, abortion,</text><text x="400.0" y="196.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">trauma):</text><text x="400.0" y="212.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">mother makes anti-D</text><rect x="230.0" y="240.0" width="340.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="262.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Next RhD-positive pregnancy:</text><text x="400.0" y="278.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">IgG anti-D crosses the placenta</text><rect x="230.0" y="314.0" width="340.0" height="52.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="336.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fetal haemolysis: anaemia, hydrops,</text><text x="400.0" y="352.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">neonatal jaundice</text><rect x="230.0" y="388.0" width="340.0" height="52.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="402.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prevention: anti-D immunoglobulin at 28</text><text x="400.0" y="418.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">weeks</text><text x="400.0" y="434.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">and within 72 h of any sensitising event</text><line x1="400.0" y1="144.0" x2="400.0" y2="158.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 166.0 L396.5 157.7 L403.5 157.7 Z" fill="#3D5A54"/><line x1="400.0" y1="218.0" x2="400.0" y2="232.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 240.0 L396.5 231.7 L403.5 231.7 Z" fill="#3D5A54"/><line x1="400.0" y1="292.0" x2="400.0" y2="306.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 314.0 L396.5 305.7 L403.5 305.7 Z" fill="#3D5A54"/></svg>