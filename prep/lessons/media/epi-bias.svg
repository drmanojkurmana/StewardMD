<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Recall bias: memory distorts the odds ratio</title><desc id="d">Two panels of stacked bars. Truly, half of cases and half of controls were exposed, an odds ratio of 1. From memory, cases report four-fifths exposed and controls two-fifths, a false odds ratio of 6.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Recall bias: memory distorts the odds ratio</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Equal truth, unequal memory: a harmless exposure looks six times riskier</text><text x="170" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Truth: both groups half exposed</text><rect x="40" y="245" width="90" height="115" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><rect x="40" y="130" width="90" height="115" fill="#FBF3E2" stroke="#B7791F" stroke-width="2.5"/><text x="85" y="307.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">50%</text><text x="85" y="192.0" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">50%</text><text x="85" y="382" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cases</text><text x="85" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Exposed (teal)</text><rect x="210" y="245" width="90" height="115" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><rect x="210" y="130" width="90" height="115" fill="#FBF3E2" stroke="#B7791F" stroke-width="2.5"/><text x="255" y="307.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">50%</text><text x="255" y="192.0" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">50%</text><text x="255" y="382" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Controls</text><text x="255" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Not exposed (gold)</text><text x="170" y="425" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Odds ratio = 1.0: no link</text><line x1="40" y1="360" x2="300" y2="360" stroke="#071318" stroke-width="2"/><text x="560" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">As remembered: cases recall more</text><rect x="430" y="176" width="90" height="184" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><rect x="430" y="130" width="90" height="46" fill="#FBF3E2" stroke="#B7791F" stroke-width="2.5"/><text x="475" y="272.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">80%</text><text x="475" y="157.5" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">20%</text><text x="475" y="382" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cases</text><text x="475" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Exposed (teal)</text><rect x="600" y="268" width="90" height="92" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><rect x="600" y="130" width="90" height="138" fill="#FBF3E2" stroke="#B7791F" stroke-width="2.5"/><text x="645" y="318.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">40%</text><text x="645" y="203.5" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">60%</text><text x="645" y="382" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Controls</text><text x="645" y="120" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Not exposed (gold)</text><text x="560" y="425" font-size="13.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Odds ratio = 6.0: false alarm</text><line x1="430" y1="360" x2="690" y2="360" stroke="#071318" stroke-width="2"/><text x="400.0" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cases remember more than controls; blind the interviewer and verify records.</text></svg>
