<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 472" role="img" aria-labelledby="t d"><title id="t">Autonomic dysreflexia</title><desc id="d">d</desc><rect width="800" height="472" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Autonomic dysreflexia</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lesion at or above T6 only</text><rect x="240.0" y="96.0" width="320.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stimulus below the lesion</text><text x="400.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(full bladder, faecal loading, ulcer)</text><rect x="240.0" y="188.0" width="320.0" height="60.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="214.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Spinal sympathetic surge below T6:</text><text x="400.0" y="230.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">vasoconstriction, severe hypertension</text><rect x="68.0" y="280.0" width="320.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="228.0" y="298.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Baroreflex: vagal slowing and</text><text x="228.0" y="314.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">vasodilation</text><text x="228.0" y="330.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">above the lesion only</text><rect x="412.0" y="280.0" width="320.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="572.0" y="306.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Headache, flushing above the lesion,</text><text x="572.0" y="322.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pounding, bradycardia</text><rect x="240.0" y="372.0" width="320.0" height="60.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="390.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Treat: sit up, remove trigger</text><text x="400.0" y="406.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(catheter),</text><text x="400.0" y="422.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">then rapid-acting antihypertensive</text><line x1="400.0" y1="156.0" x2="400.0" y2="180.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 188.0 L396.5 179.7 L403.5 179.7 Z" fill="#3D5A54"/><line x1="400.0" y1="248.0" x2="235.1" y2="278.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M228.0 280.0 L235.5 275.0 L236.8 281.9 Z" fill="#3D5A54"/><line x1="400.0" y1="248.0" x2="564.9" y2="278.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M572.0 280.0 L563.2 281.9 L564.5 275.0 Z" fill="#3D5A54"/><line x1="228.0" y1="340.0" x2="392.9" y2="370.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 372.0 L391.2 373.9 L392.5 367.0 Z" fill="#3D5A54"/><line x1="572.0" y1="340.0" x2="407.1" y2="370.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 372.0 L407.5 367.0 L408.8 373.9 Z" fill="#3D5A54"/></svg>