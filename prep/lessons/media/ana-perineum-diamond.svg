<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">The perineum</title><desc id="d">Diamond-shaped perineum divided by a line between the ischial tuberosities into the anterior urogenital triangle and the posterior anal triangle, bounded by pubic symphysis, ischiopubic rami, ischial tuberosities, sacrotuberous ligaments and coccyx.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The perineum</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Inferior view in lithotomy position: front at the top</text><path d="M400 100 L560 260 L400 440 L240 260 Z" fill="#F4FAF8" stroke="#071318" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="240.0" y1="260.0" x2="560.0" y2="260.0" stroke="#B3382C" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 4"/><circle cx="240.0" cy="260.0" r="12" fill="#E6DCC8" stroke="#071318" stroke-width="1.8"/><circle cx="560.0" cy="260.0" r="12" fill="#E6DCC8" stroke="#071318" stroke-width="1.8"/><text x="220.0" y="285.0" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Ischial</text><text x="220.0" y="301.0" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">tuberosity</text><text x="580.0" y="285.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Ischial</text><text x="580.0" y="301.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">tuberosity</text><text x="400.0" y="90.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pubic symphysis</text><text x="400.0" y="462.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Coccyx</text><text x="280.0" y="170.0" font-size="12" font-weight="600" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Ischiopubic ramus</text><text x="520.0" y="170.0" font-size="12" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Ischiopubic ramus</text><text x="280.0" y="380.0" font-size="12" font-weight="600" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Sacrotuberous</text><text x="280.0" y="396.0" font-size="12" font-weight="600" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">ligament</text><text x="520.0" y="380.0" font-size="12" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Sacrotuberous</text><text x="520.0" y="396.0" font-size="12" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">ligament</text><text x="400.0" y="190.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">UROGENITAL TRIANGLE</text><text x="400.0" y="212.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">urethra, vagina or penile root</text><text x="400.0" y="316.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">ANAL TRIANGLE</text><text x="400.0" y="336.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">anal canal, ischioanal fossae</text></svg>