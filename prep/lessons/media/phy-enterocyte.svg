<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Carbohydrate and protein absorption in the enterocyte</title><desc id="d">Enterocyte schematic: SGLT1 brings glucose and galactose in with sodium, GLUT5 brings fructose in, PepT1 brings small peptides with hydrogen, GLUT2 releases all three sugars at the basolateral side, and the sodium potassium pump powers the sodium gradient.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Carbohydrate and protein absorption in the enterocyte</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lumen on the left, blood on the right</text><rect x="260.0" y="120.0" width="280.0" height="300.0" rx="8" fill="#FBEFD2" stroke="#071318" stroke-width="2.2"/><text x="130.0" y="140.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">LUMEN</text><text x="670.0" y="140.0" font-size="13" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">BLOOD</text><text x="400.0" y="150.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Enterocyte</text><rect x="238.0" y="178.0" width="44.0" height="44.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="260.0" y="204.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">SGLT1</text><line x1="150.0" y1="200.0" x2="236.8" y2="200.0" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round"/><path d="M244.0 200.0 L235.7 203.5 L235.7 196.5 Z" fill="#3E6FA5"/><text x="120.0" y="188.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">glucose, galactose</text><text x="120.0" y="206.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">+ 2 Na+</text><rect x="238.0" y="248.0" width="44.0" height="44.0" rx="8" fill="#F5DDA6" stroke="#071318" stroke-width="1.6"/><text x="260.0" y="274.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GLUT5</text><line x1="150.0" y1="270.0" x2="236.8" y2="270.0" stroke="#B7791F" stroke-width="2.4" stroke-linecap="round"/><path d="M244.0 270.0 L235.7 273.5 L235.7 266.5 Z" fill="#B7791F"/><text x="110.0" y="270.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">fructose</text><rect x="238.0" y="318.0" width="44.0" height="44.0" rx="8" fill="#F1C6C0" stroke="#071318" stroke-width="1.6"/><text x="260.0" y="344.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PepT1</text><line x1="150.0" y1="340.0" x2="236.8" y2="340.0" stroke="#B3382C" stroke-width="2.4" stroke-linecap="round"/><path d="M244.0 340.0 L235.7 343.5 L235.7 336.5 Z" fill="#B3382C"/><text x="120.0" y="330.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">di- and tripeptides</text><text x="120.0" y="348.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">+ H+</text><rect x="518.0" y="208.0" width="44.0" height="44.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="540.0" y="234.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GLUT2</text><line x1="556.0" y1="230.0" x2="642.8" y2="230.0" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round"/><path d="M650.0 230.0 L641.7 233.5 L641.7 226.5 Z" fill="#3E6FA5"/><text x="680.0" y="215.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">glucose, galactose,</text><text x="680.0" y="233.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">fructose</text><rect x="518.0" y="308.0" width="44.0" height="44.0" rx="8" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="540.0" y="334.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Na/K</text><text x="540.0" y="365.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Na+/K+ ATPase</text><line x1="556.0" y1="322.0" x2="632.8" y2="322.0" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M640.0 322.0 L631.7 325.5 L631.7 318.5 Z" fill="#3D5A54"/><text x="660.0" y="326.0" font-size="11" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">3 Na+ out</text><line x1="640.0" y1="338.0" x2="563.2" y2="338.0" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M556.0 338.0 L564.3 334.5 L564.3 341.5 Z" fill="#3D5A54"/><text x="660.0" y="346.0" font-size="11" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2 K+ in</text><text x="400.0" y="460.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sodium gradient from the pump drives SGLT1; glucose-galactose malabsorption is an SGLT1 defect.</text><text x="400.0" y="480.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Oral rehydration solution works because glucose carries sodium and water.</text></svg>