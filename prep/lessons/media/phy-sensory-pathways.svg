<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img" aria-labelledby="t d"><title id="t">Two somatosensory pathways</title><desc id="d">Two ascending sensory pathways: dorsal column medial lemniscus carrying fine touch and proprioception, ipsilateral in the cord, crossing in the medulla; spinothalamic carrying pain and temperature, crossing within the cord; both reach VPL thalamus and the postcentral gyrus.</desc><rect width="800" height="512" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Two somatosensory pathways</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cord hemisection (Brown-Sequard): ipsilateral touch and motor loss, contralateral pain loss</text><rect x="48.0" y="96.0" width="340.0" height="56.0" rx="8" fill="#DCEAF7" stroke="#3E6FA5" stroke-width="1.6"/><text x="218.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Dorsal column pathway:</text><text x="218.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">fine touch, vibration, proprioception</text><rect x="412.0" y="96.0" width="340.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="582.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Spinothalamic pathway:</text><text x="582.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pain, temperature, crude touch</text><rect x="48.0" y="176.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="218.0" y="200.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ascend ipsilaterally in gracile and cuneate</text><text x="218.0" y="216.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">tracts</text><rect x="412.0" y="176.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="582.0" y="200.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cross at the spinal level, ascend</text><text x="582.0" y="216.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">contralaterally</text><rect x="48.0" y="256.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="218.0" y="280.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nuclei gracilis and cuneatus: cross in the</text><text x="218.0" y="296.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">medulla</text><rect x="412.0" y="256.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="582.0" y="288.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Spinothalamic tract through the brainstem</text><rect x="48.0" y="336.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="218.0" y="368.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Medial lemniscus</text><rect x="412.0" y="336.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="582.0" y="368.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Spinal lemniscus</text><rect x="48.0" y="416.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="218.0" y="440.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">VPL thalamus, then postcentral gyrus (areas</text><text x="218.0" y="456.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">3, 1, 2)</text><line x1="218.0" y1="152.0" x2="218.0" y2="168.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M218.0 176.0 L214.5 167.7 L221.5 167.7 Z" fill="#3D5A54"/><line x1="218.0" y1="232.0" x2="218.0" y2="248.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M218.0 256.0 L214.5 247.7 L221.5 247.7 Z" fill="#3D5A54"/><line x1="218.0" y1="312.0" x2="218.0" y2="328.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M218.0 336.0 L214.5 327.7 L221.5 327.7 Z" fill="#3D5A54"/><line x1="218.0" y1="392.0" x2="218.0" y2="408.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M218.0 416.0 L214.5 407.7 L221.5 407.7 Z" fill="#3D5A54"/><line x1="582.0" y1="152.0" x2="582.0" y2="168.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M582.0 176.0 L578.5 167.7 L585.5 167.7 Z" fill="#3D5A54"/><line x1="582.0" y1="232.0" x2="582.0" y2="248.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M582.0 256.0 L578.5 247.7 L585.5 247.7 Z" fill="#3D5A54"/><line x1="582.0" y1="312.0" x2="582.0" y2="328.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M582.0 336.0 L578.5 327.7 L585.5 327.7 Z" fill="#3D5A54"/><line x1="582.0" y1="392.0" x2="225.2" y2="415.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M218.0 416.0 L226.0 412.0 L226.5 419.0 Z" fill="#3D5A54"/></svg>