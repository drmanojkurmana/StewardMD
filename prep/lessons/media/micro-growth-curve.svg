<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Bacterial growth curve in batch culture</title><desc id="d">The four phases of bacterial growth plotted as log viable cell count against time: 1. Lag phase with metabolic adaptation and no division; 2. Log or exponential phase with maximum balanced division and antibiotic sensitivity; 3. Stationary phase where growth equals death; 4. Decline or death phase with exponential viability loss.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bacterial growth curve: Four phases</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Log viable count over time in closed batch culture</text><line x1="140" y1="410" x2="680" y2="410" stroke="#071318" stroke-width="2"/><line x1="140" y1="410" x2="140" y2="120" stroke="#071318" stroke-width="2"/><line x1="240" y1="120" x2="240" y2="410" stroke="#E0ECE8" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="420" y1="120" x2="420" y2="410" stroke="#E0ECE8" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="560" y1="120" x2="560" y2="410" stroke="#E0ECE8" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M 160.0 370.0 L 200.0 370.0 L 240.0 370.0 L 249.0 361.8 L 258.0 358.5 L 267.0 354.1 L 276.0 348.2 L 285.0 340.4 L 294.0 330.4 L 303.0 318.2 L 312.0 303.6 L 321.0 287.3 L 330.0 270.0 L 339.0 252.7 L 348.0 236.4 L 357.0 221.8 L 366.0 209.6 L 375.0 199.6 L 384.0 191.8 L 393.0 185.9 L 402.0 181.5 L 411.0 178.2 L 420.0 175.9 L 460.0 170.0 L 500.0 170.0 L 540.0 170.0 L 560.0 170.0 L 567.1 181.4 L 574.3 192.8 L 581.4 204.2 L 588.6 215.6 L 595.7 227.0 L 602.8 238.4 L 610.0 249.8 L 617.1 261.2 L 624.3 272.6 L 631.4 284.0 L 638.5 295.4 L 645.7 306.8 L 652.8 318.2 L 660.0 329.6" fill="none" stroke="#0B6B5B" stroke-width="3.5"/><text x="190" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">1. Lag Phase</text><text x="190" y="158" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Enzyme adaptation</text><text x="190" y="172" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">No cell division</text><text x="330" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">2. Log (Exponential)</text><text x="330" y="158" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Constant doubling time</text><text x="330" y="172" font-size="10.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Max antibiotic killing</text><text x="490" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">3. Stationary</text><text x="490" y="158" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Growth = Death</text><text x="490" y="172" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Spore / toxin release</text><text x="615" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">4. Decline / Death</text><text x="615" y="158" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Death exceeds division</text><text x="615" y="172" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Involution forms</text><text x="410" y="445" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Time in Culture</text><text x="95" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 95 265)">Log Number of Viable Bacteria</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Beta-lactam antibiotics and aminoglycosides exert maximum bactericidal efficacy during the active log phase.</text></svg>