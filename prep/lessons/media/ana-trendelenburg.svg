<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" role="img" aria-labelledby="t d"><title id="t">Trendelenburg test: why the pelvis drops</title><desc id="d">d</desc><rect width="800" height="456" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Trendelenburg test: why the pelvis drops</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Nerve supply: superior gluteal nerve (L4, L5, S1)</text><rect x="250.0" y="96.0" width="300.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stand on the right leg</text><text x="400.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(left foot lifted)</text><rect x="250.0" y="196.0" width="300.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="222.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Right gluteus medius and minimus</text><text x="400.0" y="238.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">abduct the hip and fix the pelvis</text><rect x="88.0" y="296.0" width="300.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="238.0" y="330.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal: pelvis stays level</text><rect x="412.0" y="296.0" width="300.0" height="60.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="562.0" y="322.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Weak or paralysed:</text><text x="562.0" y="338.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">left pelvis drops (positive)</text><line x1="400.0" y1="156.0" x2="400.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 196.0 L396.5 187.7 L403.5 187.7 Z" fill="#3D5A54"/><line x1="400.0" y1="256.0" x2="245.0" y2="294.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 296.0 L245.2 290.6 L246.9 297.4 Z" fill="#3D5A54"/><line x1="400.0" y1="256.0" x2="555.0" y2="294.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M562.0 296.0 L553.1 297.4 L554.8 290.6 Z" fill="#3D5A54"/><text x="400.0" y="408.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Causes: superior gluteal nerve injury, hip dislocation, coxa vara, polio.</text><text x="400.0" y="438.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The patient lurches over the weak side to compensate (Trendelenburg gait).</text></svg>