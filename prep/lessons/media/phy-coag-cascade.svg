<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 508" role="img" aria-labelledby="t d"><title id="t">Coagulation cascade</title><desc id="d">Coagulation cascade: intrinsic pathway XII XI IX with VIII and extrinsic pathway tissue factor with VIIa both activate X, which with V converts prothrombin to thrombin, converting fibrinogen to fibrin, cross linked by XIII; PT tests the extrinsic route, APTT the intrinsic, and warfarin lowers II VII IX and X.</desc><rect width="800" height="508" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Coagulation cascade</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Common pathway: X, V, II, I</text><rect x="88.0" y="96.0" width="300.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="238.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Intrinsic: XII, XI, IX</text><text x="238.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(+ VIIIa) APTT</text><rect x="412.0" y="96.0" width="300.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="562.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Extrinsic: tissue factor</text><text x="562.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">+ VIIa PT</text><rect x="250.0" y="190.0" width="300.0" height="60.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="224.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Factor X activated</text><rect x="250.0" y="284.0" width="300.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="310.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Xa + Va: prothrombin (II) to thrombin</text><text x="400.0" y="326.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(IIa)</text><rect x="250.0" y="378.0" width="300.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="404.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fibrinogen to fibrin, cross-linked by</text><text x="400.0" y="420.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">XIII</text><line x1="238.0" y1="156.0" x2="393.0" y2="188.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 190.0 L391.2 191.7 L392.6 184.9 Z" fill="#3D5A54"/><line x1="562.0" y1="156.0" x2="407.0" y2="188.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 190.0 L407.4 184.9 L408.8 191.7 Z" fill="#3D5A54"/><line x1="400.0" y1="250.0" x2="400.0" y2="276.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 284.0 L396.5 275.7 L403.5 275.7 Z" fill="#3D5A54"/><line x1="400.0" y1="344.0" x2="400.0" y2="370.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 378.0 L396.5 369.7 L403.5 369.7 Z" fill="#3D5A54"/><text x="400.0" y="490.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Vitamin K-dependent: II, VII, IX, X, protein C and S. Warfarin lowers them; heparin acts via antithrombin.</text></svg>