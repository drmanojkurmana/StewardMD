<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">COPD: GOLD grades, ABE groups and the BODE index</title>
<desc id="d">Airflow obstruction is confirmed when post-bronchodilator FEV1 over FVC is below 0.70. GOLD grades by FEV1 percent predicted: grade 1 at 80 or above, grade 2 from 50 to 79, grade 3 from 30 to 49, grade 4 below 30. Groups A, B and E combine symptoms with exacerbation history: E means 2 or more moderate or 1 or more severe exacerbation. The BODE index scores BMI, obstruction, dyspnoea and exercise from 0 to 10; higher is worse.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">COPD staging: GOLD grades, groups, BODE</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Obstruction first (FEV1/FVC &lt; 0.70 post-BD), then grade, group, and BODE</text>
<rect x="60" y="76" width="680" height="40" fill="#F4F8F6"/>
<text x="400" y="101" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Confirm: post-bronchodilator FEV1 / FVC &lt; 0.70</text>
<text x="70" y="140" font-size="13" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">GOLD grade (FEV1 % predicted)</text>
<line x1="70" y1="230" x2="730" y2="230" stroke="#071318" stroke-width="2"/>
<line x1="70" y1="150" x2="70" y2="230" stroke="#071318" stroke-width="1.5"/>
<line x1="730" y1="150" x2="730" y2="230" stroke="#071318" stroke-width="1.5"/>
<rect x="70" y="150" width="132" height="80" fill="#0B6B5B"/>
<rect x="202" y="150" width="198" height="80" fill="#0B6B5B" opacity="0.55"/>
<rect x="400" y="150" width="198" height="80" fill="#B7791F" opacity="0.65"/>
<rect x="598" y="150" width="132" height="80" fill="#B42318"/>
<text x="136" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">GOLD 1</text>
<text x="136" y="202" font-size="12" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">≥ 80</text>
<text x="301" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GOLD 2</text>
<text x="301" y="202" font-size="12" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">50–79</text>
<text x="499" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GOLD 3</text>
<text x="499" y="202" font-size="12" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">30–49</text>
<text x="664" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">GOLD 4</text>
<text x="664" y="202" font-size="12" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">&lt; 30</text>
<text x="70" y="248" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">mild</text>
<text x="700" y="248" font-size="11" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">very severe</text>
<text x="70" y="280" font-size="13" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">ABE group (symptoms × exacerbations)</text>
<rect x="70" y="292" width="210" height="66" fill="#F4F8F6"/>
<rect x="295" y="292" width="210" height="66" fill="#F4F8F6"/>
<rect x="520" y="292" width="210" height="66" fill="#F4F8F6"/>
<text x="175" y="316" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">A: few symptoms</text>
<text x="175" y="338" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0–1 moderate, none severe</text>
<text x="400" y="316" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">B: more symptoms</text>
<text x="400" y="338" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0–1 moderate, none severe</text>
<text x="625" y="316" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">E: frequent flares</text>
<text x="625" y="338" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">≥ 2 moderate or ≥ 1 severe</text>
<text x="70" y="390" font-size="13" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">BODE index (0–10, higher is worse)</text>
<rect x="70" y="400" width="660" height="52" fill="#F4F8F6"/>
<text x="86" y="422" font-size="12" fill="#071318" font-family="system-ui,sans-serif">B: BMI ≤ 21 scores</text>
<text x="86" y="442" font-size="12" fill="#071318" font-family="system-ui,sans-serif">O: obstruction (FEV1 %) · D: dyspnoea (mMRC) · E: exercise (6-min walk)</text>
<text x="400" y="478" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Grade says how blocked; group says how bothered and how often flaring; BODE predicts the road ahead.</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Oxygen target 88–92%; LTOT at least 15 hours a day.</text>
</svg>
