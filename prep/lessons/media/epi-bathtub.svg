<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Prevalence is incidence times duration</title><desc id="d">Two bathtubs. A brief disease has a wide tap and a wide drain, so the water level stays low. A chronic disease has a narrow drain, so the water level rises high.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prevalence is incidence times duration</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Brief or rapidly fatal: low pool. Chronic: high pool.</text><text x="190.0" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Brief or rapidly fatal</text><path d="M60 150 L60 400 L320 400 L320 150" fill="none" stroke="#071318" stroke-width="3"/><rect x="64" y="330" width="252" height="70" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><rect x="158" y="110" width="64" height="40" fill="#0B6B5B"/><text x="190.0" y="130" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">IN</text><text x="190.0" y="105" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Incidence (tap)</text><rect x="158" y="400" width="64" height="26" fill="#B7791F"/><text x="190.0" y="442" font-size="11.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Recovery + death (drain)</text><text x="190.0" y="359.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">PREVALENCE</text><text x="190.0" y="379.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">(water level)</text><text x="190.0" y="452" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Wide drain: water stays low</text><text x="190.0" y="470" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">high incidence, low prevalence</text><text x="610.0" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Chronic</text><path d="M480 150 L480 400 L740 400 L740 150" fill="none" stroke="#071318" stroke-width="3"/><rect x="484" y="210" width="252" height="190" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><rect x="595" y="110" width="30" height="40" fill="#0B6B5B"/><text x="610.0" y="130" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">IN</text><text x="610.0" y="105" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Incidence (tap)</text><rect x="599" y="400" width="22" height="26" fill="#B7791F"/><text x="610.0" y="442" font-size="11.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Recovery + death (drain)</text><text x="610.0" y="299.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">PREVALENCE</text><text x="610.0" y="319.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">(water level)</text><text x="610.0" y="452" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Narrow drain: water rises high</text><text x="610.0" y="470" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">low incidence, high prevalence</text><text x="400.0" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Prevalence = incidence x duration: a cure that only prolongs life raises prevalence.</text></svg>
