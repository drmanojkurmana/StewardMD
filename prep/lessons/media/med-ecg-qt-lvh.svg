<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">QT interval and voltage: what lengthens, shortens and hypertrophies</title> <desc id="d">QT prolongation from hypocalcaemia and hypokalaemia with torsades risk, QT shortening from hypercalcaemia, left ventricular hypertrophy by SV1 plus RV5 above 35 mm from hypertension and aortic valve disease, and right ventricular hypertrophy by R/S above 1 in V1.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">QT and voltage: length, shortness, thickness</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Low calcium and potassium stretch QT toward torsades; voltage names the thick chamber</text> <rect x="40" y="100" width="350" height="150" rx="12" fill="#071318"/> <text x="215" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">QT PROLONGED: torsades risk</text> <text x="215" y="154" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hypocalcaemia lengthens QT</text> <text x="215" y="176" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hypokalaemia lengthens QT</text> <text x="215" y="202" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">polymorphic VT: torsades</text> <text x="215" y="224" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">twisting QRS around baseline</text> <rect x="410" y="100" width="350" height="150" rx="12" fill="#071318"/> <text x="585" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">QT SHORT: hypercalcaemia</text> <text x="585" y="154" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">high calcium shortens QT</text> <text x="585" y="176" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">opposite of low calcium</text> <text x="585" y="202" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">calcium sets the ST length:</text> <text x="585" y="224" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">low stretches, high trims</text> <rect x="40" y="270" width="350" height="150" rx="12" fill="#0B6B5B"/> <text x="215" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">LVH: SV1 + RV5 over 35 mm</text> <text x="215" y="324" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">commonest cause: long-standing</text> <text x="215" y="346" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hypertension, then aortic</text> <text x="215" y="368" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">stenosis and regurgitation</text> <text x="215" y="394" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">deepest S plus tallest R: add them</text> <rect x="410" y="270" width="350" height="150" rx="12" fill="#0B6B5B"/> <text x="585" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">RVH: R/S over 1 in V1</text> <text x="585" y="324" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">normally S dominates V1;</text> <text x="585" y="346" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">R taller than S means the</text> <text x="585" y="368" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">right ventricle dominates</text> <text x="585" y="394" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">think pulmonary hypertension</text> <text x="400" y="460" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Low stretches QT, high trims it; left voltage adds to 35, right flips V1.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Long QT plus syncope: think torsades before it happens.</text> </svg>
