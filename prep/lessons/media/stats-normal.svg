<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Normal distribution with 68, 95 and 99.7 percent bands</title><desc id="d">Bell curve centred on the mean. About 68 percent of values lie within one standard deviation, 95 percent within two, and 99.7 percent within three.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The normal distribution: 68 - 95 - 99.7</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Share of values within 1, 2 and 3 standard deviations of the mean</text><path d="M120.0 399.5 L129.3 399.2 L138.7 398.8 L148.0 398.3 L157.3 397.6 L166.7 396.6 L176.0 395.2 L185.3 393.4 L194.7 391.1 L204.0 388.1 L213.3 384.2 L222.7 379.4 L232.0 373.5 L241.3 366.4 L250.7 358.0 L260.0 348.1 L269.3 336.8 L278.7 324.0 L288.0 309.9 L297.3 294.7 L306.7 278.5 L316.0 261.7 L325.3 244.7 L334.7 228.1 L344.0 212.2 L353.3 197.5 L362.7 184.8 L372.0 174.3 L381.3 166.4 L390.7 161.6 L400.0 160.0 L409.3 161.6 L418.7 166.4 L428.0 174.3 L437.3 184.8 L446.7 197.5 L456.0 212.2 L465.3 228.1 L474.7 244.7 L484.0 261.7 L493.3 278.5 L502.7 294.7 L512.0 309.9 L521.3 324.0 L530.7 336.8 L540.0 348.1 L549.3 358.0 L558.7 366.4 L568.0 373.5 L577.3 379.4 L586.7 384.2 L596.0 388.1 L605.3 391.1 L614.7 393.4 L624.0 395.2 L633.3 396.6 L642.7 397.6 L652.0 398.3 L661.3 398.8 L670.7 399.2 L680.0 399.5 L680.0 400 L120.0 400 Z" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><line x1="320" y1="400" x2="480" y2="426" stroke="#0B6B5B" stroke-width="3"/><line x1="320" y1="400" x2="320" y2="416" stroke="#0B6B5B" stroke-width="3"/><line x1="480" y1="400" x2="480" y2="416" stroke="#0B6B5B" stroke-width="3"/><text x="400" y="448" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">±1 SD: about 68%</text><line x1="240" y1="400" x2="560" y2="426" stroke="#B7791F" stroke-width="3"/><line x1="240" y1="400" x2="240" y2="416" stroke="#B7791F" stroke-width="3"/><line x1="560" y1="400" x2="560" y2="416" stroke="#B7791F" stroke-width="3"/><text x="400" y="448" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">±2 SD: about 95%</text><line x1="160" y1="400" x2="640" y2="426" stroke="#B42318" stroke-width="3"/><line x1="160" y1="400" x2="160" y2="416" stroke="#B42318" stroke-width="3"/><line x1="640" y1="400" x2="640" y2="416" stroke="#B42318" stroke-width="3"/><text x="400" y="448" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">±3 SD: about 99.7%</text><text x="400" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">mean = median = mode</text><line x1="120" y1="400" x2="680" y2="400" stroke="#071318" stroke-width="2"/><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">A z score says how many SDs a value sits from the mean: z = (value - mean) / SD.</text></svg>
