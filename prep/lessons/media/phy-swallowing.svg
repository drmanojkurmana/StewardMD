<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Swallowing in three phases</title><desc id="d">d</desc><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Swallowing in three phases</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Pharyngeal and oesophageal phases are brainstem and enteric reflexes</text><rect x="180.0" y="92.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="124.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oral (voluntary): tongue pushes the bolus to the pharynx</text><rect x="180.0" y="176.0" width="440.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="200.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pharyngeal (reflex): palate rises, larynx lifts,</text><text x="400.0" y="216.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">epiglottis closes, upper sphincter relaxes</text><rect x="180.0" y="260.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="284.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oesophageal: primary peristalsis, then secondary</text><text x="400.0" y="300.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">peristalsis</text><rect x="180.0" y="344.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="376.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lower oesophageal sphincter relaxes (NO, VIP)</text><line x1="400.0" y1="148.0" x2="400.0" y2="168.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 176.0 L396.5 167.7 L403.5 167.7 Z" fill="#3D5A54"/><line x1="400.0" y1="232.0" x2="400.0" y2="252.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 260.0 L396.5 251.7 L403.5 251.7 Z" fill="#3D5A54"/><line x1="400.0" y1="316.0" x2="400.0" y2="336.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 344.0 L396.5 335.7 L403.5 335.7 Z" fill="#3D5A54"/><text x="400.0" y="452.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Achalasia: loss of inhibitory neurons, sphincter fails to relax, bird-beak on barium swallow.</text></svg>