<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-labelledby="t d"><title id="t">Cerebellar cortex circuit</title><desc id="d">d</desc><rect width="800" height="466" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cerebellar cortex circuit</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Mossy fibres supply context; climbing fibres teach by signalling errors</text><rect x="58.0" y="92.0" width="330.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="223.0" y="111.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mossy fibres (pontine nuclei, spinal</text><text x="223.0" y="127.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">cord)</text><rect x="412.0" y="92.0" width="330.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="577.0" y="111.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Climbing fibres</text><text x="577.0" y="127.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(inferior olive)</text><rect x="235.0" y="164.0" width="330.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="191.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Granule cells, then parallel fibres</text><rect x="235.0" y="236.0" width="330.0" height="46.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="263.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Purkinje cell: sole cortical output, GABA</text><rect x="235.0" y="308.0" width="330.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="327.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Deep cerebellar nuclei (dentate,</text><text x="400.0" y="343.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">interposed, fastigial)</text><rect x="235.0" y="380.0" width="330.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="399.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thalamus and red nucleus, then cortex and</text><text x="400.0" y="415.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">spinal cord</text><line x1="223.0" y1="138.0" x2="392.9" y2="163.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 164.0 L391.3 166.3 L392.3 159.3 Z" fill="#3D5A54"/><line x1="400.0" y1="210.0" x2="400.0" y2="228.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 236.0 L396.5 227.7 L403.5 227.7 Z" fill="#3D5A54"/><line x1="742.0" y1="115.0" x2="768.0" y2="115.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="768.0" y1="115.0" x2="768.0" y2="259.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="768.0" y1="259.0" x2="574.2" y2="259.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M567.0 259.0 L575.3 255.5 L575.3 262.5 Z" fill="#3D5A54"/><line x1="400.0" y1="282.0" x2="400.0" y2="300.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 308.0 L396.5 299.7 L403.5 299.7 Z" fill="#3D5A54"/><text x="408.0" y="299.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">inhibits</text><line x1="400.0" y1="354.0" x2="400.0" y2="372.