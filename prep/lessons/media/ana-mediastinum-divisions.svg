<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Divisions of the mediastinum</title><desc id="d">Side view of the mediastinum: a plane at the sternal angle divides superior from inferior; the inferior mediastinum is divided by the pericardium into anterior, middle and posterior parts with their contents.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Divisions of the mediastinum</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Left lateral view: sternum at the left, vertebral column at the right</text><rect x="130.0" y="90.0" width="18.0" height="340.0" rx="4" fill="#E6DCC8" stroke="#071318" stroke-width="1.6"/><text x="139.0" y="80.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sternum</text><rect x="610.0" y="90.0" width="22.0" height="340.0" rx="4" fill="#E6DCC8" stroke="#071318" stroke-width="1.6"/><text x="621.0" y="80.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Vertebrae</text><line x1="120.0" y1="200.0" x2="650.0" y2="200.0" stroke="#B3382C" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="660.0" y="205.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#B3382C" font-family="system-ui,sans-serif">Sternal angle</text><text x="660.0" y="220.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#B3382C" font-family="system-ui,sans-serif">(T4 and T5)</text><text x="380.0" y="150.0" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">SUPERIOR</text><text x="380.0" y="172.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">thymus, great vessels, trachea, oesophagus</text><ellipse cx="360.0" cy="330.0" rx="110" ry="90" fill="#FBE3E0" stroke="#071318" stroke-width="2"/><text x="360.0" y="322.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">MIDDLE</text><text x="360.0" y="340.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">heart in pericardium</text><text x="360.0" y="356.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">great vessel roots</text><text x="215.0" y="330.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">ANTERIOR</text><text x="215.0" y="348.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">fat, nodes</text><text x="552.0" y="322.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">POSTERIOR</text><text x="552.0" y="340.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">oesophagus,</text><text x="552.0" y="354.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">descending</text><text x="552.0" y="368.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">aorta, thoracic</text><text x="552.0" y="382.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">duct, azygos</text><text x="400.0" y="470.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Inferior mediastinum = anterior + middle + posterior, relative to the pericardium.</text></svg>