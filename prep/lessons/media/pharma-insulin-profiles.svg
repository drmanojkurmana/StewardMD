<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Insulin time profiles: onset, peak and duration</title><desc id="d">Gantt chart of insulin action against hours since injection: rapid lispro acts from 15 minutes, peaks at 1 hour and lasts 3 to 4 hours; regular acts from 30 minutes, peaks near 2 to 3 hours and lasts 6 to 8 hours; NPH acts from 2 hours, peaks between 4 and 10 hours and lasts 10 to 16 hours; glargine starts near 2 hours, has no peak and lasts about 24 hours.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Insulin time profiles: onset, peak and duration</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Approximate adult values; individuals vary</text><text x="200.0" y="131.0" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Rapid (lispro)</text><rect x="215.5" y="110.0" width="82.8" height="30.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="2.2"/><circle cx="232.1" cy="125.0" r="7" fill="#B7791F" stroke="#FFFFFF" stroke-width="2"/><text x="232.1" y="102.0" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">peak</text><text x="215.5" y="158.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">onset 15 min, peak 1 h, lasts 3 to 4 h</text><text x="200.0" y="209.0" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Short (regular)</text><rect x="221.0" y="188.0" width="165.6" height="30.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="2.2"/><circle cx="265.2" cy="203.0" r="7" fill="#B7791F" stroke="#FFFFFF" stroke-width="2"/><text x="265.2" y="180.0" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">peak</text><text x="221.0" y="236.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">onset 30 min, peak 2 to 3 h, lasts 6 to 8 h</text><text x="200.0" y="287.0" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Intermediate (NPH)</text><rect x="254.2" y="266.0" width="309.2" height="30.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="2.2"/><rect x="298.3" y="266.0" width="132.5" height="30.0" rx="4" fill="#F5C86E" stroke="#B7791F" stroke-width="0"/><text x="364.6" y="258.0" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">peak band</text><text x="254.2" y="314.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">cloudy, peaks 4 to 10 h, lasts 10 to 16 h</text><text x="200.0" y="365.0" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Long (glargine)</text><rect x="254.2" y="344.0" width="485.8" height="30.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="2.2"/><text x="497.1" y="336.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">no peak</text><text x="254.2" y="392.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">flat profile, no peak, about 24 h</text><line x1="210.0" y1="404.0" x2="210.0" y2="412.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="210.0" y="430.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><line x1="298.3" y1="404.0" x2="298.3" y2="412.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="298.3" y="430.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">4</text><line x1="386.7" y1="404.0" x2="386.7" y2="412.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="386.7" y="430.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">8</text><line x1="475.0" y1="404.0" x2="475.0" y2="412.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="475.0" y="430.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">12</text><line x1="563.3" y1="404.0" x2="563.3" y2="412.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="563.3" y="430.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">16</text><line x1="651.7" y1="404.0" x2="651.7" y2="412.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="651.7" y="430.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">20</text><line x1="740.0" y1="404.0" x2="740.0" y2="412.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="740.0" y="430.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">24</text><line x1="210.0" y1="408.0" x2="740.0" y2="408.0" stroke="#071318" stroke-width="2" stroke-linecap="round"/><text x="475.0" y="452.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">hours since injection</text><text x="400.0" y="490.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Basal bolus pairs flat long acting cover with rapid meal boluses; NPH peaks can cause nocturnal lows.</text></svg>