<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 472" role="img" aria-labelledby="t d"><title id="t">Great saphenous vein</title><desc id="d">Diagram of the great saphenous vein: starts in front of the medial malleolus, ascends the medial leg and thigh with the saphenous nerve, and enters the femoral vein at the saphenofemoral junction after receiving superficial tributaries.</desc><rect width="800" height="472" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Great saphenous vein</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Superficial tributaries: epigastric, circumflex iliac, external pudendal, thigh veins</text><rect x="200.0" y="96.0" width="400.0" height="54.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="119.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Dorsal venous arch, in front</text><text x="400.0" y="135.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">of the medial malleolus</text><rect x="200.0" y="180.0" width="400.0" height="54.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="203.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Up the medial leg with the saphenous nerve,</text><text x="400.0" y="219.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">behind the medial femoral condyle</text><rect x="200.0" y="264.0" width="400.0" height="54.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="295.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Saphenous opening in the fascia lata</text><rect x="200.0" y="348.0" width="400.0" height="54.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="371.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Saphenofemoral junction:</text><text x="400.0" y="387.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">joins the femoral vein</text><line x1="400.0" y1="150.0" x2="400.0" y2="172.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 180.0 L396.5 171.7 L403.5 171.7 Z" fill="#3D5A54"/><line x1="400.0" y1="234.0" x2="400.0" y2="256.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 264.0 L396.5 255.7 L403.5 255.7 Z" fill="#3D5A54"/><line x1="400.0" y1="318.0" x2="400.0" y2="340.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 348.0 L396.5 339.7 L403.5 339.7 Z" fill="#3D5A54"/><text x="400.0" y="454.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Used for cut-down and bypass grafts; Trendelenburg test checks the junction.</text></svg>