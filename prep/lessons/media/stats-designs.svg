<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Randomised trial, cohort and case-control designs</title><desc id="d">Three flows: a randomised trial goes randomise, intervene, outcome; a cohort goes exposed or not, follow up, outcome; a case-control study starts from cases and controls and looks back at exposure.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Study designs: which way does time run?</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cohort and trials look forward; case-control looks back</text><text x="56" y="158" font-size="15" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">RCT</text><rect x="250" y="124" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="325" y="156" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Randomise</text><path d="M402 150 l14 -7 v14 Z" fill="#0B6B5B"/><line x1="400" y1="150" x2="418" y2="150" stroke="#0B6B5B" stroke-width="2.5"/><rect x="418" y="124" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="493" y="156" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Intervene</text><path d="M570 150 l14 -7 v14 Z" fill="#0B6B5B"/><line x1="568" y1="150" x2="586" y2="150" stroke="#0B6B5B" stroke-width="2.5"/><rect x="586" y="124" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="661" y="156" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Outcome</text><text x="56" y="263" font-size="15" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Cohort</text><rect x="250" y="229" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="325" y="261" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Exposed / not</text><path d="M402 255 l14 -7 v14 Z" fill="#0B6B5B"/><line x1="400" y1="255" x2="418" y2="255" stroke="#0B6B5B" stroke-width="2.5"/><rect x="418" y="229" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="493" y="261" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Follow up</text><path d="M570 255 l14 -7 v14 Z" fill="#0B6B5B"/><line x1="568" y1="255" x2="586" y2="255" stroke="#0B6B5B" stroke-width="2.5"/><rect x="586" y="229" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="661" y="261" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Outcome</text><text x="56" y="368" font-size="15" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">Case-control</text><rect x="250" y="334" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#B7791F" stroke-width="2"/><text x="325" y="366" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Exposure (past)</text><path d="M402 360 l-14 -7 v14 Z" fill="#B7791F"/><line x1="400" y1="360" x2="418" y2="360" stroke="#B7791F" stroke-width="2.5"/><rect x="418" y="334" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#B7791F" stroke-width="2"/><text x="493" y="366" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Look back</text><path d="M570 360 l-14 -7 v14 Z" fill="#B7791F"/><line x1="568" y1="360" x2="586" y2="360" stroke="#B7791F" stroke-width="2.5"/><rect x="586" y="334" width="150" height="52" rx="12" fill="#EAF3F0" stroke="#B7791F" stroke-width="2"/><text x="661" y="366" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cases / controls</text><text x="400" y="440" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Only the RCT allocates the exposure; the others observe it, so confounding threatens them.</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Ask first: who was chosen, on exposure or on outcome? That names the design.</text></svg>
