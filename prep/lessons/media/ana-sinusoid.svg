<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d"><title id="t">Sinusoid, space of Disse and hepatocytes</title><desc id="d">Schematic of a liver sinusoid: blood in the sinusoid lumen with a Kupffer cell, fenestrated endothelium, the space of Disse containing a stellate cell that stores vitamin A, then hepatocytes with a bile canaliculus between them.</desc><rect width="800" height="480" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sinusoid, space of Disse and hepatocytes</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Blood flows from portal tract to central vein; bile flows the opposite way</text><rect x="80.0" y="90.0" width="640.0" height="90.0" rx="0" fill="#FBE3E0" stroke="#071318" stroke-width="1.6"/><text x="400.0" y="78.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Sinusoid lumen</text><ellipse cx="120.0" cy="135.0" rx="14" ry="8" fill="#C0392B" stroke="#7A1F17" stroke-width="1.2"/><ellipse cx="205.0" cy="135.0" rx="14" ry="8" fill="#C0392B" stroke="#7A1F17" stroke-width="1.2"/><ellipse cx="290.0" cy="135.0" rx="14" ry="8" fill="#C0392B" stroke="#7A1F17" stroke-width="1.2"/><ellipse cx="375.0" cy="135.0" rx="14" ry="8" fill="#C0392B" stroke="#7A1F17" stroke-width="1.2"/><ellipse cx="460.0" cy="135.0" rx="14" ry="8" fill="#C0392B" stroke="#7A1F17" stroke-width="1.2"/><ellipse cx="545.0" cy="135.0" rx="14" ry="8" fill="#C0392B" stroke="#7A1F17" stroke-width="1.2"/><ellipse cx="630.0" cy="135.0" rx="14" ry="8" fill="#C0392B" stroke="#7A1F17" stroke-width="1.2"/><circle cx="300.0" cy="105.0" r="14" fill="#9F7AB8" stroke="#071318" stroke-width="1.5"/><text x="318.0" y="100.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Kupffer cell</text><line x1="80.0" y1="182.0" x2="720.0" y2="182.0" stroke="#071318" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 8"/><text x="400.0" y="198.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">fenestrated endothelium (no basement membrane)</text><rect x="80.0" y="205.0" width="640.0" height="28.0" rx="0" fill="#FFF1CC" stroke="#071318" stroke-width="1.2"/><text x="400.0" y="224.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Space of Disse</text><ellipse cx="560.0" cy="219.0" rx="22" ry="9" fill="#F1C6C0" stroke="#071318" stroke-width="1.4"/><text x="630.0" y="223.0" font-size="11.5" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">stellate cell</text><rect x="80.0" y="233.0" width="640.0" height="120.0" rx="0" fill="#E4D7C2" stroke="#071318" stroke-width="1.6"/><ellipse cx="160.0" cy="290.0" rx="70" ry="40" fill="#EFE2CC" stroke="#071318" stroke-width="1.4"/><circle cx="160.0" cy="290.0" r="11" fill="#8C6FA0" stroke="#071318" stroke-width="1.2"/><ellipse cx="340.0" cy="290.0" rx="70" ry="40" fill="#EFE2CC" stroke="#071318" stroke-width="1.4"/><circle cx="340.0" cy="290.0" r="11" fill="#8C6FA0" stroke="#071318" stroke-width="1.2"/><ellipse cx="520.0" cy="290.0" rx="70" ry="40" fill="#EFE2CC" stroke="#071318" stroke-width="1.4"/><circle cx="520.0" cy="290.0" r="11" fill="#8C6FA0" stroke="#071318" stroke-width="1.2"/><circle cx="250.0" cy="290.0" r="6" fill="#9AD0A6" stroke="#0B6B5B" stroke-width="1.6"/><circle cx="430.0" cy="290.0" r="6" fill="#9AD0A6" stroke="#0B6B5B" stroke-width="1.6"/><text x="250.0" y="340.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">bile canaliculus</text><text x="160.0" y="380.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hepatocyte</text><text x="400.0" y="430.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Stellate cells store vitamin A; activated in fibrosis they lay down collagen.</text></svg>