<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Stroke: the clock decides</title><desc id="d">Last-known-well starts every countdown: alteplase to 4.5 hours, thrombectomy for large vessels to 24 hours, then aspirin, clopidogrel and statin.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stroke: the clock decides</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Last-known-well starts every countdown</text><line x1="60.0" y1="110.0" x2="740.0" y2="110.0" stroke="#3D5A54" stroke-width="2.4" stroke-linecap="round"/><line x1="60.0" y1="100.0" x2="60.0" y2="120.0" stroke="#071318" stroke-width="2.4" stroke-linecap="round"/><text x="60.0" y="140.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Onset</text><text x="60.0" y="157.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">last-known-well</text><line x1="330.0" y1="100.0" x2="330.0" y2="120.0" stroke="#071318" stroke-width="2.4" stroke-linecap="round"/><text x="330.0" y="140.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4.5 h</text><text x="330.0" y="157.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">alteplase gate</text><line x1="740.0" y1="100.0" x2="740.0" y2="120.0" stroke="#071318" stroke-width="2.4" stroke-linecap="round"/><text x="740.0" y="140.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">24 h</text><text x="740.0" y="157.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">thrombectomy gate</text><rect x="30.0" y="185.0" width="355.0" height="120.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="207.5" y="249.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ISCHAEMIC: alteplase to 4.5 h</text><rect x="415.0" y="185.0" width="355.0" height="120.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="592.5" y="249.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Large vessel: thrombectomy to 24 h</text><rect x="30.0" y="325.0" width="355.0" height="90.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="207.5" y="374.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Then: aspirin + clopidogrel + statin</text><rect x="415.0" y="325.0" width="355.0" height="90.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="592.5" y="374.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bleed: lower BP, reverse, operate</text><text x="400.0" y="455.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Lysis with bleed kills.</text><text x="400.0" y="477.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Unsafe swallow drowns: screen first, NG only. Malignant infarct: hemicraniectomy saves.</text></svg>