<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="t d"><title id="t">Alveolar gas equation and the A-a gradient</title><desc id="d">d</desc><rect width="800" height="510" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Alveolar gas equation and the A-a gradient</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">FiO2 0.21, barometric pressure 760, water vapour 47, respiratory quotient 0.8</text><rect x="140.0" y="90.0" width="520.0" height="50.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="119.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Inspired PO2 = 0.21 x (760 - 47) = about 150 mmHg</text><rect x="140.0" y="156.0" width="520.0" height="50.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="185.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Minus PaCO2 / R = 40 / 0.8 = 50 mmHg</text><rect x="140.0" y="222.0" width="520.0" height="50.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="251.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Alveolar PO2 (PAO2) = about 100 mmHg</text><rect x="140.0" y="288.0" width="520.0" height="50.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="317.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Minus arterial PO2 (PaO2) about 90 mmHg</text><rect x="140.0" y="354.0" width="520.0" height="50.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="383.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A-a gradient about 10 mmHg (normal below about 15, rises with age)</text><rect x="140.0" y="420.0" width="520.0" height="50.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="441.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Wide gradient: V/Q mismatch, shunt, diffusion defect.</text><text x="400.0" y="457.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal gradient, low PaO2: hypoventilation, low FiO2</text><line x1="400.0" y1="140.0" x2="400.0" y2="148.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 156.0 L396.5 147.7 L403.5 147.7 Z" fill="#3D5A54"/><line x1="400.0" y1="206.0" x2="400.0" y2="214.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 222.0 L396.5 213.7 L403.5 213.7 Z" fill="#3D5A54"/><line x1="400.0" y1="272.0" x2="400.0" y2="280.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 288.0 L396.5 279.7 L403.5 279.7 Z" fill="#3D5A54"/><line x1="400.0" y1="338.0" x2="400.0" y2="346.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 354.0 L396.5 345.7 L403.5 345.7 Z" fill="#3D5A54"/><line x1="400.0" y1="404.0" x2="400.0" y2="412.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 420.0 L396.5 411.7 L403.5 411.7 Z" fill="#3D5A54"/></svg>