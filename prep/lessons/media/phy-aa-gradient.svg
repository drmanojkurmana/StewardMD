<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" role="img" aria-labelledby="t d"><title id="t">Alveolar gas equation and the A-a gradient</title><desc id="d">d</desc><rect width="800" height="484" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Alveolar gas equation and the A-a gradient</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">FiO2 0.21, barometric pressure 760, water vapour 47, respiratory quotient 0.8</text><rect x="230.0" y="90.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="108.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Inspired PO2 = 0.21 x (760 - 47) = about</text><text x="400.0" y="124.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">150 mmHg</text><rect x="230.0" y="152.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="178.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Minus PaCO2 / R = 40 / 0.8 = 50 mmHg</text><rect x="230.0" y="214.0" width="340.0" height="44.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="240.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Alveolar PO2 (PAO2) = about 100 mmHg</text><rect x="230.0" y="276.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="302.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Minus arterial PO2 (PaO2) about 90 mmHg</text><rect x="230.0" y="338.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="356.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A-a gradient about 10 mmHg (normal below</text><text x="400.0" y="372.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">about 15, rises with age)</text><rect x="230.0" y="400.0" width="340.0" height="44.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="402.8" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Wide gradient: V/Q mismatch, shunt,</text><text x="400.0" y="418.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">diffusion defect.</text><text x="400.0" y="434.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal gradient, low PaO2: hypoventilation,</text><text x="400.0" y="450.3" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">low FiO2</text><line x1="400.0" y1="134.0" x2="400.0" y2="144.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 152.0 L396.5 143.7 L403.5 143.7 Z" fill="#3D5A54"/><line x1="400.0" y1="196.0" x2="400.0" y2="206.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 214.0 L396.5 205.7 L403.5 205.7 Z" fill="#3D5A54"/><line x1="400.0" y1="258.0" x2="400.0" y2="268.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 276.0 L396.5 267.7 L403.5 267.7 Z" fill="#3D5A54"/><line x1="400.0" y1="320.0" x2="400.0" y2="330.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 338.0 L396.5 329.7 L403.5 329.7 Z" fill="#3D5A54"/><line x1="400.0" y1="382.0" x2="400.0" y2="392.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 400.0 L396.5 391.7 L403.5 391.7 Z" fill="#3D5A54"/></svg>