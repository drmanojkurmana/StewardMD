<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" role="img" aria-labelledby="t d"><title id="t">Middle ear ossicles and muscles</title><desc id="d">Chain of ossicles: tympanic membrane to malleus, incus and stapes footplate in the oval window, with tensor tympani on the malleus supplied by CN V3 and stapedius on the stapes supplied by CN VII.</desc><rect width="800" height="386" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Middle ear ossicles and muscles</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Air vibrations become fluid waves in the cochlea</text><rect x="30.0" y="100.0" width="128.8" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="94.4" y="126.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tympanic</text><text x="94.4" y="142.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">membrane</text><rect x="182.8" y="100.0" width="128.8" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="247.2" y="134.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Malleus</text><rect x="335.6" y="100.0" width="128.8" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="134.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Incus</text><rect x="488.4" y="100.0" width="128.8" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="552.8" y="134.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stapes</text><rect x="641.2" y="100.0" width="128.8" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="705.6" y="126.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oval window</text><text x="705.6" y="142.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(perilymph)</text><rect x="182.8" y="226.0" width="128.8" height="60.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="247.2" y="252.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tensor tympani</text><text x="247.2" y="268.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(CN V3)</text><rect x="488.4" y="226.0" width="128.8" height="60.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="552.8" y="252.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stapedius</text><text x="552.8" y="268.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(CN VII)</text><line x1="158.8" y1="130.0" x2="175.6" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M182.8 130.0 L174.5 133.5 L174.5 126.5 Z" fill="#3D5A54"/><line x1="311.6" y1="130.0" x2="328.4" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M335.6 130.0 L327.3 133.5 L327.3 126.5 Z" fill="#3D5A54"/><line x1="464.4" y1="130.0" x2="481.2" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M488.4 130.0 L480.1 133.5 L480.1 126.5 Z" fill="#3D5A54"/><line x1="617.2" y1="130.0" x2="634.0" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M641.2 130.0 L632.9 133.5 L632.9 126.5 Z" fill="#3D5A54"/><line x1="311.6" y1="256.0" x2="341.6" y2="256.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="341.6" y1="256.0" x2="341.6" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="341.6" y1="130.0" x2="320.8" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M313.6 130.0 L321.9 126.5 L321.9 133.5 Z" fill="#3D5A54"/><line x1="617.2" y1="256.0" x2="647.2" y2="256.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="647.2" y1="256.0" x2="647.2" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="647.2" y1="130.0" x2="626.4" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M619.2 130.0 L627.5 126.5 L627.5 133.5 Z" fill="#3D5A54"/><text x="400.0" y="338.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Malleus handle attaches at the umbo; stapes footplate sits in the oval window.</text><text x="400.0" y="368.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Both muscles contract reflexively in loud noise.</text></svg>