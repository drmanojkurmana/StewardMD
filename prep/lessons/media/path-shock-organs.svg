<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Shock organ injury patterns and the final pathway</title> <desc id="d">Five organ cards: kidney with acute tubular necrosis, lung with diffuse alveolar damage, liver with centrilobular necrosis, gut with infarction, adrenals with haemorrhage in meningococcal sepsis. Multiorgan failure is the usual final pathway to death.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prolonged shock: each organ fails its own way</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Organ patterns in pathology stems point back to shock; multiorgan failure is the final pathway</text> <rect x="40" y="100" width="220" height="120" rx="12" fill="#071318"/> <text x="150" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Kidney</text> <text x="150" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">acute tubular</text> <text x="150" y="174" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">necrosis</text> <text x="150" y="200" font-size="11.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">oliguria, muddy brown casts</text> <rect x="290" y="100" width="220" height="120" rx="12" fill="#071318"/> <text x="400" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Lung</text> <text x="400" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">diffuse alveolar</text> <text x="400" y="174" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">damage</text> <text x="400" y="200" font-size="11.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">shock lung: ARDS, hyaline membranes</text> <rect x="540" y="100" width="220" height="120" rx="12" fill="#071318"/> <text x="650" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Liver</text> <text x="650" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">centrilobular</text> <text x="650" y="174" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">necrosis</text> <text x="650" y="200" font-size="11.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">zone 3 first: farthest from blood</text> <rect x="40" y="244" width="350" height="120" rx="12" fill="#0B6B5B"/> <text x="215" y="272" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Gut</text> <text x="215" y="296" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">ischaemia and infarction</text> <text x="215" y="318" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">translocation feeds sepsis</text> <text x="215" y="344" font-size="11.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">watershed areas suffer first</text> <rect x="410" y="244" width="350" height="120" rx="12" fill="#B7791F"/> <text x="585" y="272" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Adrenals</text> <text x="585" y="296" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">haemorrhage in meningococcal</text> <text x="585" y="318" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">sepsis: Waterhouse-Friderichsen</text> <text x="585" y="344" font-size="11.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">purpura + shock + adrenal failure</text> <rect x="40" y="388" width="720" height="52" rx="12" fill="none" stroke="#071318" stroke-width="2"/> <text x="400" y="420" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Multiorgan failure is the usual final pathway to death</text> <text x="400" y="464" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Stem clue to organ pattern: name the organ injury, then name shock as the cause.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Reversible early, irreversible late: lysosomal enzymes and membrane failure mark the point of no return.</text> </svg>
