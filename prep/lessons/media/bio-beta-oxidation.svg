<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">One turn of the beta oxidation spiral</title><desc id="d">The four recurring steps acting on a fatty acyl CoA: first oxidation by acyl CoA dehydrogenase gives FADH2; hydration by enoyl CoA hydratase adds water; second oxidation by hydroxyacyl CoA dehydrogenase gives NADH; thiolysis by thiolase releases one acetyl CoA and leaves a chain shorter by 2 carbons. Palmitate with 16 carbons needs 7 turns giving 8 acetyl CoA plus 7 FADH2 plus 7 NADH, worth about 106 ATP.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">One turn of the beta oxidation spiral</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Same four enzymes every turn; each turn shortens the chain by 2 carbons</text><rect x="30.0" y="120.0" width="172.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.2"/><text x="116.0" y="156.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1. Oxidation</text><text x="116.0" y="182.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">acyl-CoA dehydrogenase</text><text x="116.0" y="228.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">FAD to FADH2</text><line x1="204.0" y1="195.0" x2="207.6" y2="195.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M214.0 195.0 L206.6 198.1 L206.6 191.9 Z" fill="#3D5A54"/><rect x="216.0" y="120.0" width="172.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#3E6FA5" stroke-width="2.2"/><text x="302.0" y="156.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2. Hydration</text><text x="302.0" y="182.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3E6FA5" font-family="system-ui,sans-serif">enoyl-CoA hydratase</text><text x="302.0" y="228.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">adds water</text><line x1="390.0" y1="195.0" x2="393.6" y2="195.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 195.0 L392.6 198.1 L392.6 191.9 Z" fill="#3D5A54"/><rect x="402.0" y="120.0" width="172.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.2"/><text x="488.0" y="156.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">3. Oxidation</text><text x="488.0" y="182.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">hydroxyacyl-CoA DH</text><text x="488.0" y="228.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">NAD+ to NADH</text><line x1="576.0" y1="195.0" x2="579.6" y2="195.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M586.0 195.0 L578.6 198.1 L578.6 191.9 Z" fill="#3D5A54"/><rect x="588.0" y="120.0" width="172.0" height="150.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2.2"/><text x="674.0" y="156.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4. Thiolysis</text><text x="674.0" y="182.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">thiolase</text><text x="674.0" y="228.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">acetyl-CoA out, minus 2 C</text><line x1="30.0" y1="296.0" x2="30.0" y2="330.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="760.0" y1="296.0" x2="760.0" y2="330.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="30.0" y1="330.0" x2="760.0" y2="330.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><text x="400.0" y="358.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">next turn with the shortened chain</text><rect x="120.0" y="392.0" width="560.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="416.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Palmitate (16 C): 7 turns give 8 acetyl-CoA + 7 FADH2 + 7 NADH: about</text><text x="400.0" y="432.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">106 ATP</text></svg>