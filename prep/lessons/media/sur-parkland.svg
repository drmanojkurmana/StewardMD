<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Parkland burns resuscitation: 4 mL times kg times percent burn</title> <desc id="d">Major burns over 20 percent body surface use 4 mL of lactated Ringer per kg per percent burn. Half in the first 8 hours, the rest over the next 16 hours. Titrate to adult urine output 0.5 mL per kg per hour. Example: 70 kg at 40 percent needs 11,200 mL.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parkland: 4 mL x kg x % burn, half in 8 h</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Major burn means over 20% TBSA: balanced crystalloid (lactated Ringer)</text> <rect x="60" y="76" width="680" height="64" rx="12" fill="#071318"/><text x="400" y="103" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">24-h volume = 4 mL x weight (kg) x burn (%)</text><text x="400" y="126" font-size="12.5" font-weight="400" text-anchor="middle" fill="#42CDB5" font-family="system-ui,sans-serif">Rule of Nines first: each leg 18%, each arm 9%, torso front 18% + back 18%, head 9%</text> <text x="60" y="168" font-size="13" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">FIRST 8 HOURS: HALF THE TOTAL</text> <rect x="60" y="178" width="340" height="56" rx="12" fill="#0B6B5B"/><text x="230" y="200" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">50% fast: shock window</text><text x="230" y="221" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">capillary leak is maximal early</text> <text x="420" y="168" font-size="13" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">NEXT 16 HOURS: THE REST</text> <rect x="420" y="178" width="320" height="56" rx="12" fill="#071318"/><text x="580" y="200" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">50% slow: leak sealing</text><text x="580" y="221" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">then titrate, never run blind</text> <rect x="60" y="252" width="680" height="120" rx="12" fill="#B7791F"/><text x="400" y="280" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">WORKED EXAMPLE: 70 KG, 40% BURN</text><text x="400" y="306" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4 x 70 x 40 = 11,200 mL in 24 h</text><text x="400" y="330" font-size="13" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">5,600 mL in first 8 h (700 mL/h), 5,600 mL over next 16 h (350 mL/h)</text> <rect x="60" y="388" width="680" height="56" rx="12" fill="#071318"/><text x="400" y="410" font-size="13" font-weight="700" text-anchor="middle" fill="#42CDB5" font-family="system-ui,sans-serif">TARGET ADULT URINE OUTPUT 0.5 mL/kg/h (about 35 mL/h at 70 kg)</text><text x="400" y="431" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Urine, not the formula, steers the drip: halve it if output doubles the target.</text> <text x="400" y="472" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Clock starts at burn time, not arrival: 4 hours down means 4 hours of the first 8 already gone.</text> <text x="400" y="493" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Children need maintenance glucose on top; this card shows the adult rule only.</text> </svg>
