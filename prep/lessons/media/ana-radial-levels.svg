<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">Radial nerve injury by level</title><desc id="d">Table of radial nerve injury by level: axilla (crutch palsy) loses triceps and wrist drop; spiral groove spares triceps with wrist drop; posterior interosseous branch gives finger drop without sensory loss.</desc><rect width="800" height="330" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Radial nerve injury by level</text><text x="99.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Level</text><text x="320.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cause</text><text x="621.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Deficit</text><rect x="19.0" y="100.0" width="160.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="132.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Axilla</text><line x1="182.0" y1="128.0" x2="205.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M212.0 128.0 L204.6 131.1 L204.6 124.9 Z" fill="#3D5A54"/><rect x="215.0" y="100.0" width="210.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="320.0" y="124.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Crutch, Saturday night</text><text x="320.0" y="140.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">palsy</text><line x1="428.0" y1="128.0" x2="451.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M458.0 128.0 L450.6 131.1 L450.6 124.9 Z" fill="#3D5A54"/><rect x="461.0" y="100.0" width="320.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="621.0" y="124.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Triceps lost; wrist drop; sensory loss over</text><text x="621.0" y="140.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">dorsal hand</text><rect x="19.0" y="170.0" width="160.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="202.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Spiral groove</text><line x1="182.0" y1="198.0" x2="205.6" y2="198.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M212.0 198.0 L204.6 201.1 L204.6 194.9 Z" fill="#3D5A54"/><rect x="215.0" y="170.0" width="210.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="320.0" y="202.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mid-shaft humeral fracture</text><line x1="428.0" y1="198.0" x2="451.6" y2="198.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M458.0 198.0 L450.6 201.1 L450.6 194.9 Z" fill="#3D5A54"/><rect x="461.0" y="170.0" width="320.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="621.0" y="194.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Triceps spared; wrist drop; dorsal hand</text><text x="621.0" y="210.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">sensory loss</text><rect x="19.0" y="240.0" width="160.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="264.8" font-size="12.5" font-weight="500" text-anchor=