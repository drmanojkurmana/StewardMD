<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">Length-tension relationship</title><desc id="d">Length tension curves of skeletal muscle: active tension peaks at an optimal sarcomere length of about 2.0 to 2.2 micrometres where filament overlap is maximal and falls at shorter and longer lengths, while passive tension rises steeply when stretched beyond that.</desc><rect width="800" height="500" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Length-tension relationship</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Skeletal muscle</text><line x1="92.0" y1="410.0" x2="760.0" y2="410.0" stroke="#071318" stroke-width="2" stroke-linecap="round"/><line x1="92.0" y1="410.0" x2="92.0" y2="84.0" stroke="#071318" stroke-width="2" stroke-linecap="round"/><line x1="92.0" y1="410.0" x2="92.0" y2="416.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="92.0" y="432.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1.0</text><line x1="203.3" y1="410.0" x2="203.3" y2="416.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="203.3" y="432.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1.5</text><line x1="314.7" y1="410.0" x2="314.7" y2="416.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="314.7" y="432.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2.0</text><line x1="426.0" y1="410.0" x2="426.0" y2="416.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="426.0" y="432.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2.5</text>