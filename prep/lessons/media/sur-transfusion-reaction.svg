<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Transfusion reaction: stop, saline, recheck, call, never restart</title> <desc id="d">Action strip: new fever, flank pain, hypotension or breathlessness during transfusion means stop the transfusion, keep the line open with saline, recheck identity, call senior help and the laboratory, never restart the unit, return it for investigation. Reactions range from febrile shivering to haemolysis and lung injury.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Transfusion reaction: five moves in order</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fever, flank pain, hypotension or breathlessness mid-unit: act, never restart</text> <rect x="40" y="110" width="128" height="200" rx="12" fill="#B7791F"/> <text x="104" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1</text> <text x="104" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">STOP</text> <text x="104" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">clamp the</text> <text x="104" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">unit at</text> <text x="104" y="232" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">once</text> <rect x="184" y="110" width="128" height="200" rx="12" fill="#071318"/> <text x="248" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">2</text> <text x="248" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">SALINE</text> <text x="248" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">keep line</text> <text x="248" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">open with</text> <text x="248" y="232" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">saline</text> <rect x="328" y="110" width="144" height="200" rx="12" fill="#071318"/> <text x="400" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">3</text> <text x="400" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">RECHECK</text> <text x="400" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">patient, bag,</text> <text x="400" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">paperwork</text> <text x="400" y="232" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">identity</text> <rect x="488" y="110" width="128" height="200" rx="12" fill="#071318"/> <text x="552" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">4</text> <text x="552" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">CALL</text> <text x="552" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">senior help</text> <text x="552" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">and the</text> <text x="552" y="232" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">laboratory</text> <rect x="632" y="110" width="128" height="200" rx="12" fill="#0B6B5B"/> <text x="696" y="140" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">5</text> <text x="696" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">RETURN</text> <text x="696" y="192" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">send unit</text> <text x="696" y="212" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">back for</text> <text x="696" y="232" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">testing</text> <rect x="40" y="330" width="720" height="60" rx="12" fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="7 5"/> <text x="400" y="366" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">NEVER restart a unit that caused a serious reaction</text> <text x="400" y="420" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Febrile shivering to haemolysis and lung injury: the response is the same drill.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Stop, saline, recheck, call, return: in that order, every time.</text> </svg>
