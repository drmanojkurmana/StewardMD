<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Web of causation: many links feed one disease</title><desc id="d">A network of six risk factors feeding coronary heart disease. Smoking is circled: removing one strong link can control the disease even when other links remain.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Web of causation: many links feed one disease</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">McMahon and Pugh: chronic disease has many interacting causes, not one</text><line x1="400" y1="248" x2="400" y2="118" stroke="#3D5A54" stroke-width="1.5"/><rect x="322" y="98" width="156" height="40" rx="20" fill="#FDECEA" stroke="#B42318" stroke-width="3"/><text x="400" y="123" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Smoking</text><line x1="400" y1="248" x2="610" y2="195" stroke="#3D5A54" stroke-width="1.5"/><rect x="532" y="175" width="156" height="40" rx="20" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="610" y="200" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Salty, fatty diet</text><line x1="400" y1="248" x2="610" y2="300" stroke="#3D5A54" stroke-width="1.5"/><rect x="532" y="280" width="156" height="40" rx="20" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="610" y="305" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High cholesterol</text><line x1="400" y1="248" x2="400" y2="392" stroke="#3D5A54" stroke-width="1.5"/><rect x="322" y="372" width="156" height="40" rx="20" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="400" y="397" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypertension</text><line x1="400" y1="248" x2="190" y2="300" stroke="#3D5A54" stroke-width="1.5"/><rect x="112" y="280" width="156" height="40" rx="20" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="190" y="305" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Diabetes</text><line x1="400" y1="248" x2="190" y2="195" stroke="#3D5A54" stroke-width="1.5"/><rect x="112" y="175" width="156" height="40" rx="20" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="190" y="200" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Physical inactivity</text><circle cx="400" cy="248" r="62" fill="#071318"/><text x="400" y="244" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Coronary</text><text x="400" y="262" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">heart disease</text><text x="400" y="445" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Cut the smoking link and the whole web weakens</text><text x="400.0" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">No single germ here: prevention works on whichever links can be broken.</text></svg>
