<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Oxytocin positive feedback in labour</title><desc id="d">d</desc><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oxytocin positive feedback in labour</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Oestrogen raises uterine oxytocin receptors; prostaglandins add to contraction</text><rect x="230.0" y="92.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="118.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fetal head stretches the cervix</text><rect x="230.0" y="158.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="176.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Afferent signal to hypothalamus</text><text x="400.0" y="192.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(paraventricular nucleus)</text><rect x="230.0" y="224.0" width="340.0" height="44.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="250.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior pituitary releases oxytocin</text><rect x="230.0" y="290.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="316.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stronger uterine contractions</text><rect x="230.0" y="356.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="382.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Delivery ends the loop</text><line x1="400.0" y1="136.0" x2="400.0" y2="150.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 158.0 L396.5 149.7 L403.5 149.7 Z" fill="#3D5A54"/><line x1="400.0" y1="202.0" x2="400.0" y2="216.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 224.0 L396.5 215.7 L403.5 215.7 Z" fill="#3D5A54"/><line x1="400.0" y1="268.0" x2="400.0" y2="282.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 290.0 L396.5 281.7 L403.5 281.7 Z" fill="#3D5A54"/><line x1="570.0" y1="312.0" x2="600.0" y2="312.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="600.0" y1="312.0" x2="600.0" y2="114.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="600.0" y1="114.0" x2="579.2" y2="114.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M572.0 114.0 L580.3 110.5 L580.3 117.5 Z" fill="#3D5A54"/><text x="608.0" y="213.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">pushes harder</text><line x1="400.0" y1="334.0" x2="400.0" y2="348.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 356.0 L396.5 347.7 L403.5 347.7 Z" fill="#3D5A54"/></svg>