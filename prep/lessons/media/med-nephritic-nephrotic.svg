<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Nephritic versus nephrotic syndrome</title>
<desc id="d">Nephritic syndrome is inflammatory: cola-coloured haematuria with red-cell casts, hypertension, oliguria, and proteinuria below 3.5 grams per day. Post-streptococcal disease follows a sore throat or impetigo by weeks; IgA disease strikes within hours of a sore throat. Nephrotic syndrome is leaky: proteinuria above 3.5 grams per day with albumin below 30, oedema, and hyperlipidaemia. Latency and casts split them at the bedside.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nephritic vs nephrotic: inflamed or leaky</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Casts and latency tell them apart; the 3.5 g/day line divides them</text>
<rect x="60" y="76" width="330" height="340" fill="#F4F8F6"/>
<rect x="410" y="76" width="330" height="340" fill="#F4F8F6"/>
<text x="225" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">NEPHRITIC (inflamed)</text>
<text x="575" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">NEPHROTIC (leaky)</text>
<text x="80" y="142" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• cola haematuria, RBC casts</text>
<text x="80" y="168" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• hypertension, oliguria</text>
<text x="80" y="194" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• proteinuria &lt; 3.5 g/day</text>
<text x="80" y="220" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• periorbital oedema</text>
<text x="80" y="262" font-size="12" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Latency clocks the cause:</text>
<text x="80" y="286" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">post-strep: weeks after sore</text>
<text x="80" y="306" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">throat or impetigo</text>
<text x="80" y="330" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">IgA: within hours, loin ache</text>
<text x="80" y="354" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">lupus: rashes, mouth ulcers</text>
<text x="80" y="378" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">vasculitis: purpura, sinus bleeds</text>
<text x="430" y="142" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• proteinuria &gt; 3.5 g/day</text>
<text x="430" y="168" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• albumin &lt; 30 g/L</text>
<text x="430" y="194" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• oedema to anasarca</text>
<text x="430" y="220" font-size="12.5" fill="#071318" font-family="system-ui,sans-serif">• hyperlipidaemia, clots</text>
<text x="430" y="262" font-size="12" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Bedside split:</text>
<text x="430" y="286" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">dipstick blood + protein,</text>
<text x="430" y="306" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">microscopy: casts vs fat bodies,</text>
<text x="430" y="330" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">BP up and urine down,</text>
<text x="430" y="354" font-size="12" fill="#3D5A54" font-family="system-ui,sans-serif">or swollen and albumin down</text>
<line x1="60" y1="436" x2="740" y2="436" stroke="#071318" stroke-width="1.5"/>
<text x="400" y="462" font-size="12" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Red-cell casts mean glomerular bleeding. Urgent biopsy decides rapidly progressive disease.</text>
<text x="400" y="486" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Low C3: post-strep and lupus. ANCA: vasculitis. Anti-GBM: lungs plus kidneys.</text>
</svg>
