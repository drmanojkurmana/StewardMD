<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d"><title id="t">Graded potential and action potential along an axon</title><desc id="d">Plot of response amplitude against distance: a graded electrotonic potential decays exponentially with distance, while an action potential regenerates and keeps a constant amplitude along the axon.</desc><rect width="800" height="480" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Graded potential and action potential along an axon</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Length constant sets how far a graded potential spreads</text><line x1="92.0" y1="390.0" x2="760.0" y2="390.0" stroke="#071318" stroke-width="2" stroke-linecap="round"/><line x1="92.0" y1="390.0" x2="92.0" y2="84.0" stroke="#071318" stroke-width="2" stroke-linecap="round"/><line x1="92.0" y1="390.0" x2="92.0" y2="396.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="92.0" y="412.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><line x1="259.0" y1="390.0" x2="259.0" y2="396.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="259.0" y="412.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2</text><line x1="426.0" y1="390.0" x2="426.0" y2="396.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="426.0" y="412.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">4</text><line x1="593.0" y1="390.0" x2="593.0" y2="396.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="593.0" y="412.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">6</text><line x1="760.0" y1="390.0" x2="760.0" y2="396.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="760.0" y="412.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">8</text><line x1="86.0" y1="390.0" x2="92.0" y2="390.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="394.0" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><line x1="86.0" y1="250.9" x2="92.0" y2="250.9" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="254.9" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">50</text><line x1="86.0" y1="111.8" x2="92.0" y2="111.8" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="115.8" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">100</text><text x="426.0" y="452.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Distance from the stimulus (mm)</text><text x="26" y="237.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 26 237.0)">Amplitude (% of peak)</text><path d="M92.0 111.8 L97.6 120.1 L103.1 128.2 L108.7 136.0 L114.3 143.6 L119.8 150.9 L125.4 158.1 L131.0 165.0 L136.5 171.7 L142.1 178.2 L147.7 184.5 L153.2 190.7 L158.8 196.6 L164.4 202.4 L169.9 208.0 L175.5 213.4 L181.1 218.7 L186.6 223.8 L192.2 228.8 L197.8 233.6 L203.3 238.3 L208.9 242.8 L214.5 247.2 L220.0 251.4 L225.6 255.6 L231.2 259.6 L236.7 263.5 L242.3 267.3 L247.9 270.9 L253.4 274.5 L259.0 277.9 L264.6 281.3 L270.1 284.5 L275.7 287.7 L281.3 290.7 L286.8 293.7 L292.4 296.6 L298.0 299.3 L303.5 302.1 L309.1 304.7 L314.7 307.2 L320.2 309.7 L325.8 312.1 L331.4 314.4 L336.9 316.7 L342.5 318.9 L348.1 321.0 L353.6 323.0 L359.2 325.0 L364.8