<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="t d"><title id="t">Testosterone and DHT</title><desc id="d">d</desc><rect width="800" height="280" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Testosterone and DHT</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">5-alpha reductase inhibitors (finasteride) shrink the prostate</text><text x="114.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Hormone</text><text x="340.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Source</text><text x="626.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Effects</text><rect x="29.0" y="104.0" width="170.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="114.0" y="140.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Testosterone</text><line x1="202.0" y1="136.0" x2="225.6" y2="136.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M232.0 136.0 L224.6 139.1 L224.6 132.9 Z" fill="#3D5A54"/><rect x="235.0" y="104.0" width="210.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="340.0" y="140.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Leydig cells, under LH</text><line x1="448.0" y1="136.0" x2="471.6" y2="136.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M478.0 136.0 L470.6 139.1 L470.6 132.9 Z" fill="#3D5A54"/><rect x="481.0" y="104.0" width="290.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="626.0" y="125.1" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Muscle and bone anabolism,</text><text x="626.0" y="140.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">erythropoiesis, libido, voice deepening,</text><text x="626.0" y="155.6" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">spermatogenesis</text><rect x="29.0" y="182.0" width="170.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="114.0" y="210.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Dihydrotestosterone</text><text x="114.0" y="226.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(DHT)</text><line x1="202.0" y1="214.0" x2="225.6" y2="214.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M232.0 214.0 L224.6 217.1 L224.6 210.9 Z" fill="#3D5A54"/><rect x="235.0" y="182.0" width="210.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="340.0" y="210.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">5-alpha reductase in</text><text x="340.0" y="226.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">prostate, skin, genitalia</text><line x1="448.0" y1="214.0" x2="471.6" y2="214.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M478.0 214.0 L470.6 217.1 L470.6 210.9 Z" fill="#3D5A54"/><rect x="481.0" y="182.0" width="290.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="626.0" y="203.1" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">External genitalia, prostate growth,</text><text x="626.0" y="218.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">facial and body hair, male-pattern</text><text x="626.0" y="233.6" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">baldness</text></svg>