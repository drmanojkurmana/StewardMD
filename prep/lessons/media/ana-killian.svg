<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" role="img" aria-labelledby="t d"><title id="t">Killian dehiscence and Zenker diverticulum</title><desc id="d">d</desc><rect width="800" height="474" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Killian dehiscence and Zenker diverticulum</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Both parts belong to the inferior constrictor</text><rect x="190.0" y="96.0" width="420.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thyropharyngeus</text><text x="400.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(oblique fibres)</text><rect x="190.0" y="180.0" width="420.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="204.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Killian dehiscence</text><text x="400.0" y="220.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(weak gap, posterior wall)</text><rect x="190.0" y="264.0" width="420.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="288.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cricopharyngeus</text><text x="400.0" y="304.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(horizontal fibres, upper oesophageal sphincter)</text><rect x="190.0" y="348.0" width="420.0" height="56.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="372.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Zenker diverticulum: mucosa</text><text x="400.0" y="388.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">bulges through the gap</text><line x1="400.0" y1="152.0" x2="400.0" y2="172.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 180.0 L396.5 171.7 L403.5 171.7 Z" fill="#3D5A54"/><line x1="400.0" y1="236.0" x2="400.0" y2="256.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 264.0 L396.5 255.7 L403.5 255.7 Z" fill="#3D5A54"/><line x1="610.0" y1="208.0" x2="636.0" y2="208.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="636.0" y1="208.0" x2="636.0" y2="376.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="636.0" y1="376.0" x2="619.2" y2="376.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M612.0 376.0 L620.3 372.5 L620.3 379.5 Z" fill="#3D5A54"/><text x="400.0" y="456.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Presents with dysphagia, regurgitation of food and halitosis.</text></svg>