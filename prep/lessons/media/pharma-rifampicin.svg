<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Rifampicin: orange secretions, enzyme induction and MDR-TB</title> <desc id="d">Four facts: rifampicin turns urine, sweat, tears and contact lenses orange-red, which is harmless; it induces liver enzymes so avoid protease inhibitors such as indinavir; it is hepatically cleared so no renal dose change is needed; MDR-TB means resistance to isoniazid and rifampicin together.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Rifampicin: four facts examiners love</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Warn the patient, watch the interactions, respect the liver, define the resistance</text> <rect x="40" y="100" width="350" height="140" rx="12" fill="#B7791F"/> <text x="215" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Orange everything</text> <text x="215" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">urine, sweat, tears,</text> <text x="215" y="174" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">contact lenses turn</text> <text x="215" y="196" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">orange-red</text> <text x="215" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">harmless: warn, do not stop</text> <rect x="410" y="100" width="350" height="140" rx="12" fill="#071318"/> <text x="585" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Enzyme inducer</text> <text x="585" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">speeds liver metabolism of</text> <text x="585" y="174" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">co-drugs: levels fall</text> <text x="585" y="198" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">avoid with protease inhibitors</text> <text x="585" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">e.g. indinavir</text> <rect x="40" y="260" width="350" height="140" rx="12" fill="#0B6B5B"/> <text x="215" y="288" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Liver cleared</text> <text x="215" y="312" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hepatically cleared, so</text> <text x="215" y="334" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">no renal dose change</text> <text x="215" y="358" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">but watch hepatitis:</text> <text x="215" y="380" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">check liver function</text> <rect x="410" y="260" width="350" height="140" rx="12" fill="#071318"/> <text x="585" y="288" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">MDR-TB defined</text> <text x="585" y="312" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">resistance to isoniazid</text> <text x="585" y="334" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">AND rifampicin together</text> <text x="585" y="358" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">isoniazid resistance often</text> <text x="585" y="380" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">predicts rifampicin resistance</text> <text x="400" y="440" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Orange secretions reassure; falling co-drug levels and rising transaminases alarm.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Rifampicin colours, induces and needs the liver: counsel, interact, monitor.</text> </svg>
