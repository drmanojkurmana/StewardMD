<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Parkinson disease: what goes wrong</title><desc id="d">Parkinson disease circuit: loss of substantia nigra dopamine weakens the direct pathway and releases the indirect pathway, so globus pallidus internus over-inhibits the thalamus, causing bradykinesia, rigidity and rest tremor.</desc><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parkinson disease: what goes wrong</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Levodopa restores dopamine; long term it causes peak-dose dyskinesia and wearing off</text><rect x="235.0" y="96.0" width="330.0" height="56.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Substantia nigra pars compacta cells die</text><text x="400.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(Lewy bodies)</text><rect x="58.0" y="182.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="223.0" y="214.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Direct pathway weak (less D1 drive)</text><rect x="412.0" y="182.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="577.0" y="206.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Indirect pathway strong (D2 not</text><text x="577.0" y="222.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">inhibited)</text><rect x="235.0" y="268.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="292.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GPi/SNr over-active: thalamus</text><text x="400.0" y="308.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">over-inhibited</text><rect x="235.0" y="354.0" width="330.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="370.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Less cortical drive: TRAP</text><text x="400.0" y="386.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tremor, Rigidity, Akinesia, Postural</text><text x="400.0" y="402.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">instability</text><line x1="400.0" y1="152.0" x2="230.1" y2="180.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M223.0 182.0 L230.6 177.2 L231.8 184.1 Z" fill="#3D5A54"/><line x1="400.0" y1="152.0" x2="569.9" y2="180.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M577.0 182.0 L568.2 184.1 L569.4 177.2 Z" fill="#3D5A54"/><line x1="223.0" y1="238.0" x2="392.9" y2="266.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 268.0 L391.2 270.1 L392.4 263.2 Z" fill="#3D5A54"/><line x1="577.0" y1="238.0" x2="407.1" y2="266.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 268.0 L407.6 263.2 L408.8 270.1 Z" fill="#3D5A54"/><line x1="400.0" y1="324.0" x2="400.0" y2="346.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 354.0 L396.5 345.7 L403.5 345.7 Z" fill="#3D5A54"/></svg>