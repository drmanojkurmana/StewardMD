<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">Mobile and fixed parts of the colon</title><desc id="d">Two columns separating colon parts that have a mesentery and are mobile (transverse colon, sigmoid colon, appendix) from parts that are retroperitoneal and fixed (ascending colon, descending colon).</desc><rect width="800" height="400" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mobile and fixed parts of the colon</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Rectum: upper part with peritoneum, lower part without</text><rect x="60.0" y="100.0" width="300.0" height="190.0" rx="8" fill="#F4FAF8" stroke="#0B6B5B" stroke-width="1.6"/><text x="210.0" y="152.0" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Intraperitoneal, with a mesentery</text><text x="210.0" y="167.8" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif"></text><text x="210.0" y="183.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Transverse colon (transverse</text><text x="210.0" y="199.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">mesocolon)</text><text x="210.0" y="215.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sigmoid colon (sigmoid mesocolon)</text><text x="210.0" y="231.3" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Appendix (mesoappendix)</text><text x="210.0" y="247.1" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Caecum: free, usually no mesentery</text><rect x="440.0" y="100.0" width="300.0" height="190.0" rx="8" fill="#F4FAF8" stroke="#B7791F" stroke-width="1.6"/><text x="590.0" y="159.9" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Secondarily retroperitoneal, fixed</text><text x="590.0" y="175.8" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif"></text><text x="590.0" y="191.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ascending colon</text><text x="590.0" y="207.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Descending colon</text><text x="590.0" y="223.3" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Peritoneum covers front and sides</text><text x="590.0" y="239.2" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">only</text><text x="210.0" y="88.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Can twist (volvulus)</text><text x="590.0" y="88.0" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Cannot twist</text><text x="400.0" y="345.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sigmoid volvulus is a surgical emergency; the sigmoid mesocolon has a narrow root.</text></svg>