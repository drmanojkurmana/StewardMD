<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Walls of the inguinal canal</title><desc id="d">Diagram of the four walls of the inguinal canal: anterior wall external oblique aponeurosis, posterior wall transversalis fascia with the conjoint tendon medially, roof arching fibres of internal oblique and transversus abdominis, floor inguinal ligament.</desc><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Walls of the inguinal canal</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Right canal, cut across its length; deep ring lateral, superficial ring medial</text><rect x="250.0" y="150.0" width="300.0" height="150.0" rx="6" fill="#FFFFFF" stroke="#071318" stroke-width="2.4"/><text x="400.0" y="215.0" font-size="16" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Inguinal canal</text><text x="400.0" y="238.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">spermatic cord (round ligament in women)</text><rect x="250.0" y="92.0" width="300.0" height="40.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="108.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Roof: arching fibres of internal</text><text x="400.0" y="123.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">oblique and transversus abdominis</text><rect x="250.0" y="318.0" width="300.0" height="40.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="334.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Floor: inguinal ligament</text><text x="400.0" y="349.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(lacunar ligament medially)</text><rect x="12.0" y="175.0" width="226.0" height="100.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="125.0" y="206.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior wall</text><text x="125.0" y="221.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">External oblique aponeurosis</text><text x="125.0" y="237.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(+ internal oblique</text><text x="125.0" y="252.2" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">laterally)</text><rect x="562.0" y="175.0" width="226.0" height="100.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="675.0" y="214.1" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior wall</text><text x="675.0" y="229.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Transversalis fascia</text><text x="675.0" y="244.6" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(+ conjoint tendon medially)</text><line x1="238.0" y1="225.0" x2="243.6" y2="225.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M250.0 225.0 L242.6 228.1 L242.6 221.9 Z" fill="#3D5A54"/><line x1="562.0" y1="225.0" x2="556.4" y2="225.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M550.0 225.0 L557.4 221.9 L557.4 228.1 Z" fill="#3D5A54"/><line x1="250.0" y1="400.0" x2="335.0" y2="400.0" stroke="#0B6B5B" stroke-width="5" stroke-linecap="round"/><text x="250.0" y="424.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Deep ring (lateral)</text><text x="250.0" y="442.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">in transversalis fascia</text><line x1="465.0" y1="400.0" x2="550.0" y2="400.0" stroke="#B7791F" stroke-width="5" stroke-linecap="round"/><text x="550.0" y="424.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Superficial ring (medial)</text><text x="550.0" y="442.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">in external oblique aponeurosis</text></svg>