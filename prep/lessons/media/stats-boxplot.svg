<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Box plot with quartiles</title><desc id="d">Box plot of systolic blood pressure: minimum 48, first quartile 62, median 71, third quartile 80, maximum 94, one outlier at 104. The interquartile range is 18.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Box plot: quartiles and the interquartile range</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Example: systolic blood pressure (mmHg) in a clinic sample</text><line x1="185.2" y1="250" x2="617.6" y2="250" stroke="#071318" stroke-width="2"/><rect x="316.8" y="190" width="169.2" height="120" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><line x1="401.40000000000003" y1="190" x2="401.40000000000003" y2="310" stroke="#B7791F" stroke-width="4"/><line x1="185.2" y1="216" x2="185.2" y2="284" stroke="#071318" stroke-width="2.5"/><line x1="617.6" y1="216" x2="617.6" y2="284" stroke="#071318" stroke-width="2.5"/><circle cx="711.6" cy="250" r="6" fill="#B42318"/><text x="185.2" y="346" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">min 48</text><text x="316.8" y="166" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Q1 = 62</text><text x="401.40000000000003" y="346" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">median = 71</text><text x="486" y="166" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Q3 = 80</text><text x="617.6" y="346" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">max 94</text><text x="711.6" y="166" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">outlier 104</text><text x="400" y="410" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Box holds the middle 50%: IQR = Q3 − Q1 = 80 − 62 = 18 mmHg</text><line x1="110" y1="440" x2="768" y2="440" stroke="#E6ECEA" stroke-width="2"/><text x="110" y="462" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">40</text><text x="298" y="462" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">60</text><text x="486" y="462" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">80</text><text x="674" y="462" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">100</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The box plot shows centre, spread, skew and outliers in one line.</text></svg>
