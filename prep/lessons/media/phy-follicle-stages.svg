<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" role="img" aria-labelledby="t d"><title id="t">Follicle to corpus luteum</title><desc id="d">d</desc><rect width="800" height="402" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Follicle to corpus luteum</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Oocytes are arrested in prophase I from birth; meiosis II completes only if fertilised</text><rect x="31.0" y="96.0" width="230.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="146.0" y="126.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Primordial</text><rect x="285.0" y="96.0" width="230.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="126.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Primary</text><rect x="539.0" y="96.0" width="230.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="654.0" y="126.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Secondary</text><rect x="31.0" y="188.0" width="230.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="146.0" y="218.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Antral (FSH selects)</text><rect x="285.0" y="188.0" width="230.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="218.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Graafian (pre-ovulatory)</text><rect x="539.0" y="188.0" width="230.0" height="52.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="654.0" y="218.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ovulation (LH surge)</text><rect x="31.0" y="280.0" width="230.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="146.0" y="310.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Corpus luteum: progesterone</text><rect x="285.0" y="280.0" width="230.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="302.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Corpus albicans (if no</text><text x="400.0" y="318.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pregnancy)</text><line x1="261.0" y1="122.0" x2="277.8" y2="122.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M285.0 122.0 L276.7 125.5 L276.7 118.5 Z" fill="#3D5A54"/><line x1="515.0" y1="122.0" x2="531.8" y2="122.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M539.0 122.0 L530.7 125.5 L530.7 118.5 Z" fill="#3D5A54"/><line x1="654.0" y1="148.0" x2="153.2" y2="187.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M146.0 188.0 L154.0 183.9 L154.5 190.8 Z" fill="#3D5A54"/><line x1="261.0" y1="214.0" x2="277.8" y2="214.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M285.0 214.0 L276.7 217.5 L276.7 210.5 Z" fill="#3D5A54"/><line x1="515.0" y1="214.0" x2="531.8" y2="214.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M539.0 214.0 L530.7 217.5 L530.7 210.5 Z" fill="#3D5A54"/><line x1="654.0" y1="240.0" x2="153.2" y2="279.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M146.0 280.0 L154.0 275.9 L154.5 282.8 Z" fill="#3D5A54"/><line x1="261.0" y1="306.0" x2="277.8" y2="306.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M285.0 306.0 L276.7 309.5 L276.7 302.5 Z" fill="#3D5A54"/><text x="400.0" y="384.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">If hCG arrives (pregnancy), the corpus luteum persists until the placenta takes over.</text></svg>