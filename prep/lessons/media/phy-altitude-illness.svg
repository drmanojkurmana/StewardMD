<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 324" role="img" aria-labelledby="t d"><title id="t">Altitude illness</title><desc id="d">Table of high altitude illness: acute mountain sickness with headache and nausea treated by rest and acetazolamide, high altitude cerebral oedema with ataxia and confusion treated by descent and dexamethasone, high altitude pulmonary oedema with dyspnoea and crackles treated by descent and nifedipine.</desc><rect width="800" height="324" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Altitude illness</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Staged ascent prevents all three</text><text x="104.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Syndrome</text><text x="355.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Features</text><text x="651.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Treatment</text><rect x="19.0" y="100.0" width="170.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="132.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Acute mountain sickness</text><line x1="192.0" y1="128.0" x2="215.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 128.0 L214.6 131.1 L214.6 124.9 Z" fill="#3D5A54"/><rect x="225.0" y="100.0" width="260.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="355.0" y="124.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Headache, nausea, fatigue above</text><text x="355.0" y="140.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">about 2500 m</text><line x1="488.0" y1="128.0" x2="511.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M518.0 128.0 L510.6 131.1 L510.6 124.9 Z" fill="#3D5A54"/><rect x="521.0" y="100.0" width="260.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="651.0" y="124.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Rest, acetazolamide prophylaxis,</text><text x="651.0" y="140.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">stop ascent</text><rect x="19.0" y="168.0" width="170.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="200.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HACE</text><line x1="192.0" y1="196.0" x2="215.6" y2="196.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 196.0 L214.6 199.1 L214.6 192.9 Z" fill="#3D5A54"/><rect x="225.0" y="168.0" width="260.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="355.0" y="200.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ataxia, confusion, drowsiness</text><line x1="488.0" y1="196.0" x2="511.6" y2="196.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M518.0 196.0 L510.6 199.1 L510.6 192.9 Z" fill="#3D5A54"/><rect x="521.0" y="168.0" width="260.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="651.0" y="200.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Descent, dexamethasone, oxygen</text><rect x="19.0" y="236.0" width="170.0" height="56.0" rx="8" fill="#FFFFFF" 