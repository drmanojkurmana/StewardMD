<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Sorting gas exchange: volumes first, then the A-a gradient</title> <desc id="d">Flow: helium dilution underestimates volumes in trapped gas so plethysmography is preferred in bullous or obstructive disease; the alveolar gas equation estimates PAO2; the A-a gradient tells lung defect from ventilation defect. Normal PaO2 on room air is about 95 mmHg.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Gas exchange in two moves: volumes, then gradient</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Measure volumes without missing trapped air, then let the A-a gradient place the defect</text> <rect x="60" y="110" width="300" height="80" rx="12" fill="#071318"/> <text x="210" y="138" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Helium dilution</text> <text x="210" y="160" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">misses trapped gas: reads low</text> <rect x="440" y="110" width="300" height="80" rx="12" fill="#0B6B5B"/> <text x="590" y="138" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Body plethysmography</text> <text x="590" y="160" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">preferred in bullous, obstructive</text> <line x1="400" y1="150" x2="400" y2="150" stroke="#0B6B5B" stroke-width="3"/> <text x="400" y="142" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">vs</text> <line x1="400" y1="190" x2="400" y2="240" stroke="#0B6B5B" stroke-width="3"/> <polygon points="392,240 408,240 400,254" fill="#0B6B5B"/> <rect x="180" y="254" width="440" height="80" rx="12" fill="#071318"/> <text x="400" y="282" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Alveolar gas equation gives PAO2</text> <text x="400" y="304" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">what the alveolus should hold</text> <line x1="400" y1="334" x2="400" y2="368" stroke="#0B6B5B" stroke-width="3"/> <polygon points="392,368 408,368 400,382" fill="#0B6B5B"/> <rect x="110" y="382" width="270" height="70" rx="12" fill="#0B6B5B"/> <text x="245" y="406" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Gradient wide</text> <text x="245" y="428" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">defect is in the lungs</text> <rect x="420" y="382" width="270" height="70" rx="12" fill="#3D5A54"/> <text x="555" y="406" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Gradient normal</text> <text x="555" y="428" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">defect is ventilation</text> <text x="400" y="478" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">A-a = PAO2 minus PaO2; room-air PaO2 about 95 mmHg in a healthy adult.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Wide gap blames the lung; tight gap blames the pump and drive.</text> </svg>
