<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Ziehl-Neelsen stain: why tubercle bacilli stay red</title> <desc id="d">Four staining steps: smear, flood with carbol fuchsin and heat, decolourise with acid alcohol, counterstain. The waxy mycolic acid wall resists decolourisation so bacilli stay red on a blue background. Mycobacterium tuberculosis is a non-spore-forming, non-motile, slender aerobic rod that stains poorly with Gram stain.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ziehl-Neelsen: the bacilli that keep the red</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Acid fastness is wall chemistry: waxy mycolic acid resists acid alcohol</text> <rect x="40" y="100" width="160" height="130" rx="12" fill="#071318"/> <text x="120" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">1. Smear</text> <text x="120" y="150" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">thin sputum</text> <text x="120" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">film, heat fix</text> <text x="120" y="196" font-size="11.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">slender aerobic rods</text> <rect x="220" y="100" width="160" height="130" rx="12" fill="#071318"/> <text x="300" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">2. Carbol fuchsin</text> <text x="300" y="150" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">flood + gentle</text> <text x="300" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">heat drives dye in</text> <text x="300" y="196" font-size="11.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">everything turns red</text> <rect x="400" y="100" width="160" height="130" rx="12" fill="#0B6B5B"/> <text x="480" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">3. Acid alcohol</text> <text x="480" y="150" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">decolouriser:</text> <text x="480" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">waxy wall holds</text> <text x="480" y="190" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">the dye back</text> <text x="480" y="212" font-size="11.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">others go colourless</text> <rect x="580" y="100" width="180" height="130" rx="12" fill="#B7791F"/> <text x="670" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4. Counterstain</text> <text x="670" y="150" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">methylene blue:</text> <text x="670" y="172" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">red bacilli on</text> <text x="670" y="194" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">a blue field</text> <text x="670" y="216" font-size="11.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">acid-fast bacilli seen</text> <rect x="40" y="260" width="480" height="130" rx="12" fill="none" stroke="#071318" stroke-width="2"/> <text x="280" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Why it works: the wall</text> <text x="280" y="312" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">mycolic acid-rich waxy envelope resists</text> <text x="280" y="334" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">decolourisation; Gram stain colours it poorly</text> <text x="280" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">non-spore-forming, non-motile, aerobic rod</text> <rect x="540" y="260" width="220" height="130" rx="12" fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="7 5"/> <text x="650" y="288" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Report language</text> <text x="650" y="312" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">AFB smear positive:</text> <text x="650" y="334" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">infectious until proven</text> <text x="650" y="356" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">otherwise; culture to</text> <text x="650" y="378" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">confirm</text> <text x="400" y="430" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Read left to right across the four steps; the wall inset explains the colour that remains.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Red on blue means acid-fast: the dye the acid could not wash out.</text> </svg>
