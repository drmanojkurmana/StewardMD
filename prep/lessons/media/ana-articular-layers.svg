<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Layers of articular cartilage</title><desc id="d">Layer diagram of articular cartilage from surface to bone: superficial zone with tangential collagen, middle zone, deep zone with vertical collagen, tidemark, calcified cartilage and subchondral bone; there is no perichondrium, no nerves and no vessels.</desc><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Layers of articular cartilage</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Joint space at the top</text><rect x="90.0" y="90.0" width="620.0" height="50.0" rx="0" fill="#E6EEF5" stroke="#071318" stroke-width="1.4"/><text x="400.0" y="120.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Superficial zone: collagen parallel to surface</text><rect x="90.0" y="140.0" width="620.0" height="60.0" rx="0" fill="#D3E0EC" stroke="#071318" stroke-width="1.4"/><text x="400.0" y="175.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Middle zone: oblique collagen</text><rect x="90.0" y="200.0" width="620.0" height="70.0" rx="0" fill="#BFD1E1" stroke="#071318" stroke-width="1.4"/><text x="400.0" y="240.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Deep zone: collagen vertical, anchors to bone</text><rect x="90.0" y="270.0" width="620.0" height="40.0" rx="0" fill="#A9BFD3" stroke="#071318" stroke-width="1.4"/><text x="400.0" y="295.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Calcified cartilage (below the tidemark)</text><rect x="90.0" y="310.0" width="620.0" height="50.0" rx="0" fill="#E6DCC8" stroke="#071318" stroke-width="1.4"/><text x="400.0" y="340.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Subchondral bone</text><line x1="70.0" y1="270.0" x2="730.0" y2="270.0" stroke="#B7791F" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="722.0" y="270.0" font-size="12" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">tidemark</text><text x="400.0" y="405.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Articular cartilage has no perichondrium, no nerves, no vessels; nutrition from synovial fluid.</text></svg>