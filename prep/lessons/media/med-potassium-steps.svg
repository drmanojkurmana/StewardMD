<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">High potassium: protect, shift, remove</title><desc id="d">Calcium guards the membrane when the ECG changes, insulin with glucose plus salbutamol shifts potassium in, and patiromer or dialysis removes it; peaked T to wide QRS to sine means act now.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High potassium: protect, shift, remove</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Calcium first when the ECG changes</text><rect x="30.0" y="80.0" width="230.0" height="150.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="145.0" y="151.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PROTECT: calcium guards</text><text x="145.0" y="167.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">membrane</text><rect x="285.0" y="80.0" width="230.0" height="150.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="151.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">SHIFT: insulin + glucose,</text><text x="400.0" y="167.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">salbutamol</text><rect x="540.0" y="80.0" width="230.0" height="150.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="655.0" y="151.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">REMOVE: patiromer binds,</text><text x="655.0" y="167.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">dialysis</text><rect x="30.0" y="255.0" width="740.0" height="90.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="400.0" y="285.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Peaked T  to  flat P  to  wide QRS  to  sine: act</text><text x="400.0" y="312.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Magnesium for torsades. Stop ACE and trimethoprim.</text><text x="400.0" y="385.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Rebound glucose: watch after insulin. Refeeding: slow plus thiamine.</text><text x="400.0" y="407.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Unmonitored arrest kills: continuous ECG until steady.</text></svg>