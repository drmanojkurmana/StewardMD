<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Bacterial cell wall: Gram-positive versus Gram-negative</title><desc id="d">Cross-sectional comparison of bacterial cell envelopes. Gram-positive bacteria feature a thick multilayered peptidoglycan mesh rich in lipoteichoic and teichoic acids above a single inner membrane. Gram-negative bacteria feature an outer lipid bilayer with lipopolysaccharide endotoxin and porins, a periplasmic space containing thin peptidoglycan, and an inner cytoplasmic membrane.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bacterial cell wall: Gram-positive vs Gram-negative</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Envelope architecture, peptidoglycan depth, and endotoxin localization</text><line x1="400" y1="80" x2="400" y2="460" stroke="#E0ECE8" stroke-width="2" stroke-dasharray="6 4"/><text x="210" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Gram-Positive Envelope</text><text x="210" y="118" font-size="11.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Thick peptidoglycan (retains crystal violet)</text><rect x="60" y="140" width="300" height="150" rx="4" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="210" y="210" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Thick Peptidoglycan (20–80 nm)</text><text x="210" y="230" font-size="11.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Multilayered murein cross-linked mesh</text><line x1="110" y1="130" x2="110" y2="350" stroke="#B7791F" stroke-width="4"/><circle cx="110" cy="126" r="6" fill="#B7791F"/><line x1="260" y1="130" x2="260" y2="290" stroke="#B7791F" stroke-width="3" stroke-dasharray="4 2"/><circle cx="260" cy="126" r="5" fill="#B7791F"/><text x="210" y="138" font-size="10.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Lipoteichoic &amp; Teichoic acids</text><rect x="60" y="330" width="300" height="40" rx="4" fill="#0B6B5B" stroke="#071318" stroke-width="1.5"/><text x="210" y="355" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Inner Cytoplasmic Membrane</text><text x="210" y="420" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stains deep violet / purple</text><text x="210" y="438" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">e.g. Staphylococcus, Streptococcus, Bacillus</text><text x="590" y="100" font-size="16" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Gram-Negative Envelope</text><text x="590" y="118" font-size="11.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Outer membrane + periplasm + thin peptidoglycan</text><rect x="440" y="140" width="300" height="35" rx="4" fill="#B42318" stroke="#071318" stroke-width="1.5"/><text x="590" y="162" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Outer Membrane (LPS / Endotoxin)</text><line x1="470" y1="125" x2="470" y2="140" stroke="#B7791F" stroke-width="3"/><line x1="510" y1="125" x2="510" y2="140" stroke="#B7791F" stroke-width="3"/><line x1="670" y1="125" x2="670" y2="140" stroke="#B7791F" stroke-width="3"/><text x="590" y="132" font-size="10.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Lipid A + Core + O-antigen</text><rect x="580" y="140" width="20" height="35" fill="#EAF3F0" stroke="#071318" stroke-width="1"/><text x="590" y="190" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Porin channel</text><rect x="440" y="195" width="300" height="95" fill="#F4F8F6" stroke="#D0E2DB" stroke-width="1"/><text x="448" y="215" font-size="11" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Periplasmic space</text><rect x="450" y="235" width="280" height="20" rx="3" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="590" y="250" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Thin Peptidoglycan (2–7 nm)</text><rect x="440" y="330" width="300" height="40" rx="4" fill="#0B6B5B" stroke="#071318" stroke-width="1.5"/><text x="590" y="355" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Inner Cytoplasmic Membrane</text><text x="590" y="420" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stains pink / red (counterstained by safranin)</text><text x="590" y="438" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">e.g. E. coli, Klebsiella, Pseudomonas, Neisseria</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Alcohol dissolves the lipid-rich Gram-negative outer membrane, washing out crystal violet; the dense Gram-positive mesh traps it.</text></svg>