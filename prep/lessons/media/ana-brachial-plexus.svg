<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d"><title id="t">Brachial plexus</title><desc id="d">Schematic of the brachial plexus: five roots C5 to T1 form upper, middle and lower trunks, each splits into anterior and posterior divisions, which form lateral, posterior and medial cords giving the musculocutaneous, axillary, radial, median and ulnar nerves. Dorsal scapular and long thoracic arise from the roots.</desc><rect width="800" height="560" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Brachial plexus</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Roots, trunks, divisions, cords, branches (right side, schematic)</text><text x="170.0" y="82.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Roots</text><text x="305.0" y="82.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Trunks</text><text x="420.0" y="82.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Divisions</text><text x="525.0" y="82.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cords</text><text x="625.0" y="82.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Branches</text><circle cx="170.0" cy="130.0" r="15" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="170.0" y="134.5" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">C5</text><circle cx="170.0" cy="180.0" r="15" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="170.0" y="184.5" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-f