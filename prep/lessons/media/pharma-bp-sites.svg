<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Blood pressure control sites and first-line drug classes</title>
<desc id="d">Blood pressure equals cardiac output times vascular resistance. Five control sites: volume handled by thiazide-like diuretics; renin signalling by ACE inhibitors, ARBs and spironolactone as the proven fourth agent in resistant hypertension; arterial tone by dihydropyridine calcium blockers with ankle oedema; heart rate and contractility by rate-limiting calcium blockers and beta blockers; hypertensive emergency with organ damage needs controlled IV reduction while severe asymptomatic hypertension needs oral titration.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">BP = CO x SVR: Five Control Sites</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">First line: thiazide-like diuretic + ACE-I/ARB + calcium blocker; beta blocker for cardiac indications</text>
<rect x="30" y="80" width="140" height="220" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/>
<text x="100" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">VOLUME</text>
<text x="42" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Thiazide-like:</text>
<text x="42" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">chlorthalidone,</text>
<text x="42" y="162" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">indapamide</text>
<text x="42" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Watch: low K+, low Na+,</text>
<text x="42" y="200" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">high uric acid, glucose</text>
<rect x="185" y="80" width="150" height="220" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/>
<text x="260" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">RENIN</text>
<text x="197" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">ACE-I: cough (bradykinin),</text>
<text x="197" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">angioedema, fetotoxic</text>
<text x="197" y="168" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">ARB: no cough; same K+</text>
<text x="197" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">and creatinine checks</text>
<text x="197" y="206" font-size="10.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Spironolactone: proven</text>
<text x="197" y="222" font-size="10.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">4th agent in resistant HTN</text>
<rect x="350" y="80" width="140" height="220" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="420" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ARTERIES</text>
<text x="362" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">DHP CCB: amlodipine</text>
<text x="362" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">dilates arteries</text>
<text x="362" y="168" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Ankle oedema, flushing,</text>
<text x="362" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">gum hypertrophy</text>
<rect x="505" y="80" width="140" height="220" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="575" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HEART</text>
<text x="517" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Rate-limiting CCB:</text>
<text x="517" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">verapamil, diltiazem</text>
<text x="517" y="168" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Beta blockers: rate +</text>
<text x="517" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">contractility down</text>
<text x="517" y="206" font-size="10.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Never casually combine</text>
<text x="517" y="222" font-size="10.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">the two rate-slowing sets</text>
<rect x="660" y="80" width="110" height="220" rx="8" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.2"/>
<text x="715" y="106" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">CRISIS</text>
<text x="670" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Organ damage:</text>
<text x="670" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">controlled IV cut</text>
<text x="670" y="168" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">No damage: oral</text>
<text x="670" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">titration, follow up</text>
<rect x="30" y="320" width="740" height="60" rx="6" fill="#FDF2F0" stroke="#B42318" stroke-width="1.2"/>
<text x="400" y="344" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Resistant HTN = uncontrolled on 3 drugs including a diuretic: add spironolactone, then hunt secondary causes</text>
<text x="400" y="364" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Primary aldosteronism, renal artery stenosis, sleep apnoea, thyroid disease, NSAIDs, steroids, contraceptives.</text>
<rect x="30" y="392" width="740" height="52" rx="6" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.2"/>
<text x="400" y="414" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Pregnancy: methyldopa, nifedipine and labetalol are safe; ACE-I and ARBs are fetotoxic</text>
<text x="400" y="432" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Never drop pressure precipitously in adapted organs: ischaemic injury follows.</text>
<text x="400" y="478" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Check potassium and creatinine after starting ACE-I/ARB; a small creatinine rise is expected, a large one needs workup.</text>
<text x="400" y="505" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">All first-line classes prevent stroke and heart failure; choose by compelling indication and adverse-effect profile.</text>
</svg>
