<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t d"><title id="t">Corticospinal tract and the pyramidal decussation</title><desc id="d">d</desc><rect width="800" height="620" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Corticospinal tract and the pyramidal decussation</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Descending motor pathway, level by level</text><rect x="230.0" y="80.0" width="300.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="106.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Motor cortex (precentral gyrus)</text><text x="215.0" y="107.0" font-size="12" font-weight="700" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Cortex</text><line x1="380.0" y1="124.0" x2="380.0" y2="138.8" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round"/><path d="M380.0 146.0 L376.5 137.7 L383.5 137.7 Z" fill="#0B6B5B"/><rect x="230.0" y="146.0" width="300.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="172.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior limb of internal capsule</text><text x="215.0" y="173.0" font-size="12" font-weight="700" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Capsule</text><line x1="380.0" y1="190.0" x2="380.0" y2="204.8" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round"/><path d="M380.0 212.0 L376.5 203.7 L383.5 203.7 Z" fill="#0B6B5B"/><rect x="230.0" y="212.0" width="300.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="238.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cerebral peduncle (crus cerebri)</text><text x="215.0" y="239.0" font-size="12" font-weight="700" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Midbrain</text><line x1="380.0" y1="256.0" x2="380.0" y2="270.8" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round"/><path d="M380.0 278.0 L376.5 269.7 L383.5 269.7 Z" fill="#0B6B5B"/><rect x="230.0" y="278.0" width="300.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="304.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Basis pontis</text><text x="215.0" y="305.0" font-size="12" font-weight="700" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Pons</text><line x1="380.0" y1="322.0" x2="380.0" y2="336.8" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round"/><path d="M380.0 344.0 L376.5 335.7 L383.5 335.7 Z" fill="#0B6B5B"/><rect x="230.0" y="344.0" width="300.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="370.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Medullary pyramid</text><text x="215.0" y="371.0" font-size="12" font-weight="700" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Medulla</text><line x1="380.0" y1="388.0" x2="380.0" y2="402.8" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round"/><path d="M380.0 410.0 L376.5 401.7 L383.5 401.7 Z" fill="#0B6B5B"/><rect x="230.0" y="410.0" width="300.0" height="50.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="380.0" y="431.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pyramidal decussation</text><text x="380.0" y="447.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">about 85 to 90% cross</text><text x="215.0" y="440.0" font-size="12" font-weight="700" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Cervicomedullary</text><text x="215.0" y="456.0" font-size="12" font-weight="700" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">junction</text><line x1="300.0" y1="460.0" x2="273.2" y2="513.6" stroke="#B3382C" stroke-width="2.2" stroke-linecap="round"/><path d="M270.0 520.0 L270.6 511.0 L276.8 514.2 Z" fill="#B3382C"/><line x1="460.0" y1="460.0" x2="486.8" y2="513.6" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round"/><path d="M490.0 520.0 L483.2 514.2 L489.4 511.0 Z" fill="#0B6B5B"/><rect x="120.0" y="524.0" width="270.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#B3382C" stroke-width="1.6"/><text x="255.0" y="545.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lateral corticospinal tract</text><text x="255.0" y="561.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(crossed: limbs)</text><rect x="430.0" y="524.0" width="250.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="555.0" y="545.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior corticospinal tract</text><text x="555.0" y="561.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(uncrossed: trunk)</text><text x="560.0" y="120.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Lesion above the</text><text x="560.0" y="138.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">decussation: weakness</text><text x="560.0" y="156.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">on the opposite side</text><text x="560.0" y="190.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Lesion below it: same</text><text x="560.0" y="208.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">side as the lesion</text></svg>