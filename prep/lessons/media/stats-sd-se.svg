<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Standard deviation versus standard error</title><desc id="d">With a standard deviation of 10, the standard error is 5.0 for n equals 4, 2.0 for n equals 25 and 1.0 for n equals 100. The SD does not change with sample size.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Standard deviation vs standard error</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">SD describes the patients; SE describes the precision of the mean (SE = SD / √n, SD = 10 here)</text><text x="200" y="110" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">SD stays 10</text><text x="200" y="134" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">however big the sample</text><rect x="90" y="300" width="220" height="26" rx="6" fill="#0B6B5B"/><text x="200" y="318" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">spread of individuals: SD = 10</text><text x="590" y="110" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">SE shrinks as n grows</text><text x="590" y="134" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">the mean is pinned down, patients do not change</text><text x="452" y="202" font-size="13" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">n = 4</text><rect x="540" y="180" width="150" height="26" rx="6" fill="#B7791F"/><text x="698" y="198" font-size="12.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">SE = 5.0</text><text x="452" y="280" font-size="13" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">n = 25</text><rect x="540" y="258" width="60" height="26" rx="6" fill="#B7791F"/><text x="608" y="276" font-size="12.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">SE = 2.0</text><text x="452" y="358" font-size="13" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">n = 100</text><rect x="540" y="336" width="30" height="26" rx="6" fill="#B7791F"/><text x="578" y="354" font-size="12.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">SE = 1.0</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Never report a small SE as if the data themselves were less variable.</text></svg>
