<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">ACS: who gets the cath lab now</title><desc id="d">Chest pain with ST elevation goes straight to reperfusion: primary PCI within 90 minutes of door, or lysis within 30 minutes when PCI is delayed. Without ST elevation, troponin and risk decide: high risk to cath within 24 hours, low risk to DAPT and workup.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ACS: who gets the cath lab now</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">ECG within 10 minutes of arrival sorts every chest pain</text><rect x="220.0" y="78.0" width="360.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="108.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Chest pain: ECG within 10 min</text><line x1="400.0" y1="130.0" x2="400.0" y2="144.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 152.0 L396.5 143.7 L403.5 143.7 Z" fill="#3D5A54"/><rect x="220.0" y="152.0" width="360.0" height="52.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="182.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ST elevation or new LBBB?</text><line x1="220.0" y1="178.0" x2="127.2" y2="178.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M120.0 178.0 L128.3 174.5 L128.3 181.5 Z" fill="#3D5A54"/><text x="130.0" y="170.0" font-size="12" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">yes</text><line x1="580.0" y1="178.0" x2="672.8" y2="178.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M680.0 178.0 L671.7 181.5 L671.7 174.5 Z" fill="#3D5A54"/><text x="636.0" y="170.0" font-size="12" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">no</text><rect x="20.0" y="210.0" width="340.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="190.0" y="244.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">STEMI: reperfuse now</text><rect x="440.0" y="210.0" width="340.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="610.0" y="244.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">NSTE-ACS: troponin + risk</text><line x1="190.0" y1="270.0" x2="190.0" y2="284.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M190.0 292.0 L186.5 283.7 L193.5 283.7 Z" fill="#3D5A54"/><line x1="610.0" y1="270.0" x2="610.0" y2="284.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M610.0 292.0 L606.5 283.7 L613.5 283.7 Z" fill="#3D5A54"/><rect x="20.0" y="292.0" width="340.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="190.0" y="328.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Primary PCI: door to balloon 90 min or less</text><rect x="440.0" y="292.0" width="340.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="610.0" y="328.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High risk: cath within 24 h</text><rect x="20.0" y="368.0" width="340.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="190.0" y="392.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PCI delayed: lysis door to needle 30 min or</text><text x="190.0" y="407.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">less</text><rect x="440.0" y="368.0" width="340.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="610.0" y="400.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low risk: DAPT + stress test, admit</text><text x="400.0" y="460.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">MONA + DAPT + heparin + statin ride along every path.</text><text x="400.0" y="480.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lysis is off the table with bleeding risk or late arrival.</text></svg>