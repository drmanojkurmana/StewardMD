<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-labelledby="t d"><title id="t">Frey syndrome (gustatory sweating)</title><desc id="d">d</desc><rect width="800" height="396" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Frey syndrome (gustatory sweating)</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Left: normal pathway. Right: after injury</text><rect x="58.0" y="96.0" width="330.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="223.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Glossopharyngeal nerve (CN IX)</text><text x="223.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">tympanic and lesser petrosal nerves</text><rect x="412.0" y="96.0" width="330.0" height="60.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="577.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Surgery or trauma to the</text><text x="577.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">auriculotemporal nerve</text><rect x="58.0" y="196.0" width="330.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="223.0" y="230.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Otic ganglion</text><rect x="412.0" y="196.0" width="330.0" height="60.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="577.0" y="222.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parasympathetic fibres regrow</text><text x="577.0" y="238.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">into sweat glands and vessels</text><rect x="58.0" y="296.0" width="330.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="223.0" y="322.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Auriculotemporal nerve:</text><text x="223.0" y="338.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">parotid secretion (normal)</text><rect x="412.0" y="296.0" width="330.0" height="60.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="577.0" y="322.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Eating: sweating and flushing</text><text x="577.0" y="338.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">over the preauricular cheek</text><line x1="223.0" y1="156.0" x2="223.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M223.0 196.0 L219.5 187.7 L226.5 187.7 Z" fill="#3D5A54"/><line x1="223.0" y1="256.0" x2="223.0" y2="288.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M223.0 296.0 L219.5 287.7 L226.5 287.7 Z" fill="#3D5A54"/><line x1="577.0" y1="156.0" x2="577.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M577.0 196.0 L573.5 187.7 L580.5 187.7 Z" fill="#3D5A54"/><line x1="577.0" y1="256.0" x2="577.0" y2="288.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M577.0 296.0 L573.5 287.7 L580.5 287.7 Z" fill="#3D5A54"/></svg>