<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Opioid receptors: mu, kappa and delta effects with antagonist reversal</title>
<desc id="d">Three receptor columns. Mu-1 gives analgesia and euphoria; mu-2 gives respiratory depression, constipation and miosis. Kappa gives spinal analgesia with dysphoria. Delta modulates mood. All are Gi coupled and close calcium channels. Naloxone is a short pure antagonist for overdose; naltrexone maintains abstinence. Tolerance spares constipation.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Opioid Receptors and Reversal</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">All Gi coupled, closing Ca2+ channels; mu splits into mu-1 and mu-2</text>
<rect x="40" y="80" width="220" height="300" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/>
<text x="150" y="106" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">MU (mu-1 / mu-2)</text>
<text x="56" y="132" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">mu-1: analgesia + euphoria</text>
<text x="56" y="152" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">mu-2: respiratory depression</text>
<text x="56" y="172" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">mu-2: constipation (no tolerance)</text>
<text x="56" y="192" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">mu-2: miosis (pinpoint pupils)</text>
<text x="56" y="220" font-size="11.5" fill="#3D5A54" font-family="system-ui,sans-serif">Full agonists: morphine,</text>
<text x="56" y="238" font-size="11.5" fill="#3D5A54" font-family="system-ui,sans-serif">fentanyl (no ceiling but toxicity)</text>
<text x="56" y="266" font-size="11.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Overdose: slow breath +</text>
<text x="56" y="284" font-size="11.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">pinpoint pupils</text>
<text x="56" y="312" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">Dependence: withdrawal on</text>
<text x="56" y="330" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">stopping; constipation persists</text>
<rect x="290" y="80" width="220" height="300" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="400" y="106" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">KAPPA</text>
<text x="306" y="132" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">Spinal analgesia (weaker)</text>
<text x="306" y="152" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">Dysphoria (not euphoria)</text>
<text x="306" y="172" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">Mild respiratory depression</text>
<text x="306" y="192" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">Diuresis (unlike mu)</text>
<text x="306" y="220" font-size="11.5" fill="#3D5A54" font-family="system-ui,sans-serif">Agonist-antagonists:</text>
<text x="306" y="238" font-size="11.5" fill="#3D5A54" font-family="system-ui,sans-serif">pentazocine, butorphanol</text>
<text x="306" y="266" font-size="11.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Ceiling effect: analgesia</text>
<text x="306" y="284" font-size="11.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">plateaus; can precipitate</text>
<text x="306" y="302" font-size="11.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">withdrawal in dependence</text>
<rect x="540" y="80" width="220" height="300" rx="8" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.2"/>
<text x="650" y="106" font-size="15" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">DELTA</text>
<text x="556" y="132" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">Mood and affect modulation</text>
<text x="556" y="152" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">Adjunct analgesia (weak)</text>
<text x="556" y="172" font-size="11.5" fill="#071318" font-family="system-ui,sans-serif">May lower seizure threshold</text>
<text x="556" y="200" font-size="11.5" fill="#3D5A54" font-family="system-ui,sans-serif">No major drug acts purely</text>
<text x="556" y="218" font-size="11.5" fill="#3D5A54" font-family="system-ui,sans-serif">here; exam tests contrast</text>
<text x="556" y="236" font-size="11.5" fill="#3D5A54" font-family="system-ui,sans-serif">with mu-2 and kappa</text>
<rect x="40" y="400" width="360" height="68" rx="6" fill="#FDF2F0" stroke="#B42318" stroke-width="1.2"/>
<text x="220" y="424" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">NALOXONE: pure antagonist, short (30-90 min)</text>
<text x="220" y="444" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Reverses overdose; re-sedation needs repeat doses / infusion</text>
<rect x="420" y="400" width="340" height="68" rx="6" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.2"/>
<text x="590" y="424" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">NALTREXONE: long oral antagonist</text>
<text x="590" y="444" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Maintains abstinence; never for acute overdose</text>
<text x="400" y="505" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Mu-1 kills pain, mu-2 slows breath and stalls gut; pinpoint pupils with slow breathing diagnose overdose.</text>
</svg>
