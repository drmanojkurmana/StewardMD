" x2="277.8" y2="145.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M285.0 145.0 L276.7 148.5 L276.7 141.5 Z" fill="#3D5A54"/><line x1="515.0" y1="145.0" x2="531.8" y2="145.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M539.0 145.0 L530.7 148.5 L530.7 141.5 Z" fill="#3D5A54"/><text x="400.0" y="232.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Tertiary villi connect to the embryonic circulation: exchange begins in week 3.</text></svg>