<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Ascitic tap: SAAG sorts the cause</title><desc id="d">SAAG is serum albumin minus ascitic albumin. At or above 1.1 the cause is portal hypertension; below 1.1 it is peritoneal disease. Ascitic neutrophils at or above 250 mean SBP: cefotaxime plus albumin.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ascitic tap: SAAG sorts the cause</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">One subtraction, one cell count, and the tap has spoken</text><rect x="220.0" y="78.0" width="360.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="100.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ascites: tap it, SAAG = serum minus ascitic</text><text x="400.0" y="116.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">albumin</text><line x1="400.0" y1="130.0" x2="400.0" y2="142.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 150.0 L396.5 141.7 L403.5 141.7 Z" fill="#3D5A54"/><rect x="220.0" y="150.0" width="360.0" height="52.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="180.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">SAAG 1.1 g/dL or more?</text><line x1="220.0" y1="176.0" x2="127.2" y2="176.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M120.0 176.0 L128.3 172.5 L128.3 179.5 Z" fill="#3D5A54"/><text x="128.0" y="168.0" font-size="12" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">yes</text><line x1="580.0" y1="176.0" x2="672.8" y2="176.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M680.0 176.0 L671.7 179.5 L671.7 172.5 Z" fill="#3D5A54"/><text x="636.0" y="168.0" font-size="12" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">no</text><rect x="20.0" y="208.0" width="340.0" height="76.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="190.0" y="242.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Portal hypertension:</text><text x="190.0" y="258.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">cirrhosis, cardiac, Budd-Chiari</text><rect x="440.0" y="208.0" width="340.0" height="76.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="610.0" y="242.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Peritoneal disease:</text><text x="610.0" y="258.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">TB, malignancy, pancreatic</text><rect x="180.0" y="308.0" width="440.0" height="64.0" rx="8" fill="#FDECEA" stroke="#B42318" stroke-width="1.6"/><text x="400.0" y="344.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Neutrophils 250 or more: SBP, cefotaxime + albumin</text><line x1="190.0" y1="284.0" x2="293.0" y2="306.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M300.0 308.0 L291.2 309.7 L292.6 302.8 Z" fill="#3D5A54"/><line x1="610.0" y1="284.0" x2="507.0" y2="306.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M500.0 308.0 L507.4 302.8 L508.8 309.7 Z" fill="#3D5A54"/><text x="400.0" y="412.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Secondary prophylaxis after one SBP; band varices before they bleed.</text><text x="400.0" y="432.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Spironolactone before furosemide, roughly 100 mg to 40 mg.</text></svg>