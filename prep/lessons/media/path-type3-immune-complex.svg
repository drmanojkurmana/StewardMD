<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Type III hypersensitivity: immune complex injury</title><desc id="d">Antigen plus antibody complexes form in excess, deposit in vessel walls and membranes, fix complement to release C3a and C5a, and attract neutrophils whose enzymes injure tissue. Classic diseases are lupus, rheumatoid arthritis, post streptococcal glomerulonephritis and polyarteritis nodosa. Serum sickness follows exposure by 5 to 10 days with fever, urticaria, arthralgia, proteinuria and lymphadenopathy; the local Arthus reaction appears in 4 to 10 hours with oedema, haemorrhage and necrosis.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Type III hypersensitivity: immune complex injury</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Complexes deposit, complement fires, neutrophils injure</text><rect x="30.0" y="110.0" width="172.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="116.0" y="152.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ag + Ab complexes</text><text x="116.0" y="168.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">form</text><line x1="204.0" y1="156.0" x2="207.6" y2="156.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M214.0 156.0 L206.6 159.1 L206.6 152.9 Z" fill="#3D5A54"/><rect x="216.0" y="110.0" width="172.0" height="92.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="302.0" y="152.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Deposit in vessel</text><text x="302.0" y="168.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">walls</text><line x1="390.0" y1="156.0" x2="393.6" y2="156.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 156.0 L392.6 159.1 L392.6 152.9 Z" fill="#3D5A54"/><rect x="402.0" y="110.0" width="172.0" height="92.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="488.0" y="152.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fix complement (C3a,</text><text x="488.0" y="168.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">C5a)</text><line x1="576.0" y1="156.0" x2="579.6" y2="156.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M586.0 156.0 L578.6 159.1 L578.6 152.9 Z" fill="#3D5A54"/><rect x="588.0" y="110.0" width="172.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="674.0" y="152.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Neutrophils injure</text><text x="674.0" y="168.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">tissue</text><rect x="60.0" y="240.0" width="330.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="225.0" y="289.1" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Systemic examples:</text><text x="225.0" y="304.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">SLE, rheumatoid arthritis,</text><text x="225.0" y="319.6" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PSGN, polyarteritis nodosa</text><rect x="410.0" y="240.0" width="330.0" height="120.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="575.0" y="289.1" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Serum sickness: 5 to 10 days</text><text x="575.0" y="304.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(fever, urticaria, arthralgia)</text><text x="575.0" y="319.6" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Arthus: local, 4 to 10 hours</text><text x="400.0" y="402.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Most serum sickness today follows drugs, not animal serum.</text><text x="400.0" y="492.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Type III sits between cytotoxic type II and delayed type IV.</text></svg>