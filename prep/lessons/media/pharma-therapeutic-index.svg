<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Therapeutic index and window</title><desc id="d">Sigmoid population frequency curves for therapeutic efficacy (ED50) and toxicity (TD50). The therapeutic index is TD50 divided by ED50, defining the margin of safety between clinical benefit and dangerous toxicity.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Therapeutic index and safety window</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Comparison of therapeutic response (ED50) and adverse toxic response (TD50)</text><line x1="140" y1="410" x2="680" y2="410" stroke="#071318" stroke-width="2"/><line x1="140" y1="410" x2="140" y2="120" stroke="#071318" stroke-width="2"/><rect x="310" y="130" width="200" height="280" fill="#EAF3F0" opacity="0.6"/><path d="M 160.0 406.9 L 167.5 406.2 L 175.0 405.2 L 182.5 404.0 L 190.0 402.6 L 197.5 400.7 L 205.0 398.5 L 212.5 395.7 L 220.0 392.4 L 227.5 388.3 L 235.0 383.3 L 242.5 377.4 L 250.0 370.3 L 257.5 362.0 L 265.0 352.4 L 272.5 341.4 L 280.0 329.1 L 287.5 315.5 L 295.0 301.0 L 302.5 285.7 L 310.0 270.0 L 317.5 254.3 L 325.0 239.0 L 332.5 224.5 L 340.0 210.9 L 347.5 198.6 L 355.0 187.6 L 362.5 178.0 L 370.0 169.7 L 377.5 162.6 L 385.0 156.7 L 392.5 151.7 L 400.0 147.6 L 407.5 144.3 L 415.0 141.5 L 422.5 139.3 L 430.0 137.4 L 437.5 136.0 L 445.0 134.8 L 452.5 133.8 L 460.0 133.1 L 467.5 132.5 L 475.0 132.0 L 482.5 131.6 L 490.0 131.3 L 497.5 131.0 L 505.0 130.8 L 512.5 130.6 L 520.0 130.5 L 527.5 130.4 L 535.0 130.3 L 542.5 130.3 L 550.0 130.2 L 557.5 130.2 L 565.0 130.1 L 572.5 130.1 L 580.0 130.1 L 587.5 130.1 L 595.0 130.1 L 602.5 130.0 L 610.0 130.0 L 617.5 130.0 L 625.0 130.0 L 632.5 130.0 L 640.0 130.0" fill="none" stroke="#0B6B5B" stroke-width="3.5"/><path d="M 160.0 410.0 L 167.5 410.0 L 175.0 410.0 L 182.5 410.0 L 190.0 410.0 L 197.5 410.0 L 205.0 410.0 L 212.5 410.0 L 220.0 410.0 L 227.5 409.9 L 235.0 409.9 L 242.5 409.9 L 250.0 409.9 L 257.5 409.9 L 265.0 409.8 L 272.5 409.8 L 280.0 409.7 L 287.5 409.6 L 295.0 409.6 L 302.5 409.4 L 310.0 409.3 L 317.5 409.1 L 325.0 408.9 L 332.5 408.6 L 340.0 408.3 L 347.5 407.9 L 355.0 407.3 L 362.5 406.7 L 370.0 405.9 L 377.5 404.8 L 385.0 403.6 L 392.5 402.0 L 400.0 400.0 L 407.5 397.6 L 415.0 394.7 L 422.5 391.1 L 430.0 386.7 L 437.5 381.4 L 445.0 375.1 L 452.5 367.7 L 460.0 358.9 L 467.5 348.8 L 475.0 337.4 L 482.5 324.7 L 490.0 310.8 L 497.5 295.9 L 505.0 280.5 L 512.5 264.8 L 520.0 249.2 L 527.5 234.1 L 535.0 219.8 L 542.5 206.7 L 550.0 194.8 L 557.5 184.3 L 565.0 175.1 L 572.5 167.2 L 580.0 160.5 L 587.5 154.9 L 595.0 150.3 L 602.5 146.4 L 610.0 143.3 L 617.5 140.7 L 625.0 138.6 L 632.5 136.9 L 640.0 135.6" fill="none" stroke="#B42318" stroke-width="3.5"/><circle cx="310" cy="270" r="4" fill="#0B6B5B"/><line x1="310" y1="270" x2="310" y2="410" stroke="#0B6B5B" stroke-width="1.5" stroke-dasharray="3 3"/><text x="310" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">ED50</text><circle cx="510" cy="270" r="4" fill="#B42318"/><line x1="510" y1="270" x2="510" y2="410" stroke="#B42318" stroke-width="1.5" stroke-dasharray="3 3"/><text x="510" y="426" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">TD50</text><line x1="310" y1="200" x2="510" y2="200" stroke="#071318" stroke-width="2"/><circle cx="310" cy="200" r="3" fill="#071318"/><circle cx="510" cy="200" r="3" fill="#071318"/><text x="410" y="190" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Therapeutic window</text><text x="410" y="222" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">TI = TD50 / ED50</text><text x="240" y="150" font-size="13" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Therapeutic response (efficacy)</text><text x="535" y="150" font-size="13" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Toxic response (adverse effect)</text><rect x="540" y="240" width="180" height="75" rx="8" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.5"/><text x="550" y="260" font-size="11" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Narrow Therapeutic Index:</text><text x="550" y="278" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">• Digoxin, Warfarin, Lithium</text><text x="550" y="294" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">• Phenytoin, Theophylline</text><text x="550" y="308" font-size="10" fill="#3D5A54" font-family="system-ui,sans-serif">(Requires drug level monitoring)</text><text x="410" y="455" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Log Dose [mg/kg]</text><text x="90" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 90 265)">Percentage of individuals responding</text><text x="125" y="414" font-size="11" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">0%</text><text x="125" y="274" font-size="11" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">50%</text><text x="125" y="134" font-size="11" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">100%</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">A larger therapeutic index represents a safer drug; narrow therapeutic index agents demand therapeutic drug monitoring.</text></svg>