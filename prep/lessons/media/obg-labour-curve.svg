<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Active-phase dilatation rates, alert and action lines</title>
<desc id="d">Latent phase runs to about 4 centimetres. Active labour must progress at least 1.2 centimetres per hour in nulliparous women and 1.5 in parous women, against an alert line of 1 centimetre per hour drawn from 4 centimetres; the action line sits 4 hours to its right. Arrest means no change for 2 or more hours. Precipitate labour exceeds 5 centimetres per hour in nulliparae and 10 in multiparae.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Active labour: how fast is fast enough</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Latent to 4 cm, then 1.2 cm/h (nullip) or 1.5 cm/h (parous); arrest is stillness for 2+ hours</text>
<rect x="90" y="296" width="670" height="144" fill="#F4F8F6"/>
<text x="100" y="316" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">latent phase (to ~4 cm)</text>
<line x1="90" y1="80" x2="90" y2="440" stroke="#071318" stroke-width="1.5"/>
<line x1="90" y1="440" x2="760" y2="440" stroke="#071318" stroke-width="1.5"/>
<text x="52" y="444" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">0</text>
<text x="52" y="372" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2</text>
<text x="52" y="300" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4</text>
<text x="52" y="228" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">6</text>
<text x="52" y="156" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">8</text>
<text x="52" y="84" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">10</text>
<text x="30" y="250" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif" transform="rotate(-90 30 250)" text-anchor="middle">dilatation (cm)</text>
<text x="90" y="460" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">0</text>
<text x="202" y="460" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2</text>
<text x="313" y="460" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4</text>
<text x="425" y="460" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">6</text>
<text x="537" y="460" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">8</text>
<text x="648" y="460" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">10</text>
<text x="760" y="460" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">12</text>
<text x="425" y="482" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">hours of active labour</text>
<line x1="90" y1="296" x2="425" y2="80" stroke="#3D5A54" stroke-width="2" stroke-dasharray="7 5"/>
<text x="435" y="120" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">alert line: 1 cm/h from 4 cm</text>
<line x1="313" y1="296" x2="648" y2="80" stroke="#3D5A54" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="560" y="200" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">action line (+4 h): review</text>
<line x1="90" y1="296" x2="369" y2="80" stroke="#B7791F" stroke-width="3"/>
<text x="180" y="150" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">nullip 1.2 cm/h</text>
<line x1="90" y1="296" x2="313" y2="80" stroke="#0B6B5B" stroke-width="3"/>
<text x="120" y="250" font-size="11" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">parous 1.5 cm/h</text>
<line x1="425" y1="224" x2="537" y2="224" stroke="#B42318" stroke-width="2"/>
<line x1="425" y1="216" x2="425" y2="232" stroke="#B42318" stroke-width="2"/>
<line x1="537" y1="216" x2="537" y2="232" stroke="#B42318" stroke-width="2"/>
<text x="481" y="212" font-size="11" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">arrest: flat for 2+ h</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Slower than the alert line: protracted active phase. Steeper than 5 cm/h (nullip) or 10 cm/h (multip): precipitate.</text>
</svg>
