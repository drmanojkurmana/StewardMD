<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" role="img" aria-labelledby="t d"><title id="t">Ciliary ganglion pathways</title><desc id="d">d</desc><rect width="800" height="458" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ciliary ganglion pathways</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Parasympathetic synapses; sympathetic and sensory fibres pass through</text><rect x="31.0" y="96.0" width="230.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="146.0" y="129.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Edinger-Westphal nucleus</text><rect x="285.0" y="96.0" width="230.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="121.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Superior cervical ganglion</text><text x="400.0" y="137.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(sympathetic)</text><rect x="539.0" y="96.0" width="230.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="654.0" y="121.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nasociliary nerve (V1)</text><text x="654.0" y="137.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">sensory from cornea</text><rect x="31.0" y="184.0" width="230.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="146.0" y="209.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oculomotor nerve</text><text x="146.0" y="225.5" font-si