<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 592" role="img" aria-labelledby="t d"><title id="t">CSF circulation</title><desc id="d">Flow diagram of CSF circulation: produced by choroid plexus in the lateral ventricles, passes through the interventricular foramina to the third ventricle, the cerebral aqueduct to the fourth ventricle, exits through the median and lateral apertures into the subarachnoid space and is absorbed by arachnoid granulations into the superior sagittal sinus.</desc><rect width="800" height="592" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CSF circulation</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">About 500 mL made per day, 150 mL present at any time</text><rect x="190.0" y="90.0" width="420.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="110.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Choroid plexus: lateral ventricles</text><text x="400.0" y="126.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(also third and fourth ventricles)</text><rect x="190.0" y="154.0" width="420.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="182.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Interventricular foramina (of Monro)</text><rect x="190.0" y="218.0" width="420.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="246.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Third ventricle</text><rect x="190.0" y="282.0" width="420.0" height="48.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="310.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cerebral aqueduct (of Sylvius)</text><rect x="190.0" y="346.0" width="420.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="374.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fourth ventricle</text><rect x="190.0" y="410.0" width="420.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="430.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Median aperture (Magendie) and</text><text x="400.0" y="446.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">lateral apertures (Luschka)</text><rect x="190.0" y="474.0" width="420.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="494.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Subarachnoid space, arachnoid granulations,</text><text x="400.0" y="510.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">superior sagittal sinus</text><line x1="400.0" y1="138.0" x2="400.0" y2="146.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 154.0 L396.5 145.7 L403.5 145.7 Z" fill="#3D5A54"/><line x1="400.0" y1="202.0" x2="400.0" y2="210.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 218.0 L396.5 209.7 L403.5 209.7 Z" fill="#3D5A54"/><line x1="400.0" y1="266.0" x2="400.0" y2="274.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 282.0 L396.5 273.7 L403.5 273.7 Z" fill="#3D5A54"/><line x1="400.0" y1="330.0" x2="400.0" y2="338.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 346.0 L396.5 337.7 L403.5 337.7 Z" fill="#3D5A54"/><line x1="400.0" y1="394.0" x2="400.0" y2="402.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 410.0 L396.5 401.7 L403.5 401.7 Z" fill="#3D5A54"/><line x1="400.0" y1="458.0" x2="400.0" y2="466.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 474.0 L396.5 465.7 L403.5 465.7 Z" fill="#3D5A54"/><text x="400.0" y="574.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Aqueduct stenosis: obstructive hydrocephalus above the block.</text></svg>