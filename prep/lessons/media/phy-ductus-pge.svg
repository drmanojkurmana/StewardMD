<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">The ductus arteriosus</title><desc id="d">d</desc><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The ductus arteriosus</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Prostaglandin synthesis inhibitors (NSAIDs) in late pregnancy can close the duct early</text><rect x="250.0" y="96.0" width="300.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fetus: placental PGE2, low PO2,</text><text x="400.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">EP4 receptors keep the duct open</text><rect x="250.0" y="182.0" width="300.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="206.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Birth: lungs expand, PO2 rises,</text><text x="400.0" y="222.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">prostaglandins fall</text><rect x="250.0" y="268.0" width="300.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="292.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Duct constricts, then becomes</text><text x="400.0" y="308.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ligamentum arteriosum</text><rect x="88.0" y="354.0" width="300.0" height="56.0" rx="8" fill="#DCEAF7" stroke="#3E6FA5" stroke-width="1.6"/><text x="238.0" y="386.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Patent duct: indomethacin closes it</text><rect x="412.0" y="354.0" width="300.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="562.0" y="378.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Duct-dependent lesion:</text><text x="562.0" y="394.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">prostaglandin E1 keeps it open</text><line x1="400.0" y1="152.0" x2="400.0" y2="174.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 182.0 L396.5 173.7 L403.5 173.7 Z" fill="#3D5A54"/><line x1="400.0" y1="238.0" x2="400.0" y2="260.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 268.0 L396.5 259.7 L403.5 259.7 Z" fill="#3D5A54"/><line x1="400.0" y1="324.0" x2="245.1" y2="352.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 354.0 L245.5 349.0 L246.8 355.9 Z" fill="#3D5A54"/><line x1="400.0" y1="324.0" x2="554.9" y2="352.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M562.0 354.0 L553.2 355.9 L554.5 349.0 Z" fill="#3D5A54"/></svg>