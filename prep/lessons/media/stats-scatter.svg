<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Scatter plots for correlation plus one, zero and minus one</title><desc id="d">Three scatter plots: points exactly on a rising line for r equals plus 1, a shapeless cloud for r equals 0, and points exactly on a falling line for r equals minus 1.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Scatter plots and correlation (r)</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">r measures linear association only: +1 perfect rise, 0 no linear trend, −1 perfect fall</text><line x1="55" y1="380" x2="245" y2="380" stroke="#071318" stroke-width="2"/><line x1="55" y1="380" x2="55" y2="150" stroke="#071318" stroke-width="2"/><text x="150" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">r = +1</text><circle cx="55.0" cy="380.0" r="5.5" fill="#0B6B5B"/><circle cx="74.0" cy="357.0" r="5.5" fill="#0B6B5B"/><circle cx="93.0" cy="334.0" r="5.5" fill="#0B6B5B"/><circle cx="112.0" cy="311.0" r="5.5" fill="#0B6B5B"/><circle cx="131.0" cy="288.0" r="5.5" fill="#0B6B5B"/><circle cx="150.0" cy="265.0" r="5.5" fill="#0B6B5B"/><circle cx="169.0" cy="242.0" r="5.5" fill="#0B6B5B"/><circle cx="188.0" cy="219.0" r="5.5" fill="#0B6B5B"/><circle cx="207.0" cy="196.0" r="5.5" fill="#0B6B5B"/><circle cx="226.0" cy="173.0" r="5.5" fill="#0B6B5B"/><circle cx="245.0" cy="150.0" r="5.5" fill="#0B6B5B"/><line x1="55" y1="380" x2="245" y2="150" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="305" y1="380" x2="495" y2="380" stroke="#071318" stroke-width="2"/><line x1="305" y1="380" x2="305" y2="150" stroke="#071318" stroke-width="2"/><text x="400" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">r = 0</text><circle cx="305.0" cy="168.2" r="5.5" fill="#3D5A54"/><circle cx="360.0" cy="331.6" r="5.5" fill="#3D5A54"/><circle cx="443.6" cy="257.5" r="5.5" fill="#3D5A54"/><circle cx="367.6" cy="207.0" r="5.5" fill="#3D5A54"/><circle cx="448.5" cy="255.1" r="5.5" fill="#3D5A54"/><circle cx="435.1" cy="233.7" r="5.5" fill="#3D5A54"/><circle cx="460.2" cy="324.3" r="5.5" fill="#3D5A54"/><circle cx="376.1" cy="217.2" r="5.5" fill="#3D5A54"/><circle cx="437.6" cy="367.6" r="5.5" fill="#3D5A54"/><circle cx="434.9" cy="272.4" r="5.5" fill="#3D5A54"/><circle cx="480.3" cy="194.3" r="5.5" fill="#3D5A54"/><line x1="555" y1="380" x2="745" y2="380" stroke="#071318" stroke-width="2"/><line x1="555" y1="380" x2="555" y2="150" stroke="#071318" stroke-width="2"/><text x="650" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">r = −1</text><circle cx="555.0" cy="150.0" r="5.5" fill="#0B6B5B"/><circle cx="574.0" cy="173.0" r="5.5" fill="#0B6B5B"/><circle cx="593.0" cy="196.0" r="5.5" fill="#0B6B5B"/><circle cx="612.0" cy="219.0" r="5.5" fill="#0B6B5B"/><circle cx="631.0" cy="242.0" r="5.5" fill="#0B6B5B"/><circle cx="650.0" cy="265.0" r="5.5" fill="#0B6B5B"/><circle cx="669.0" cy="288.0" r="5.5" fill="#0B6B5B"/><circle cx="688.0" cy="311.0" r="5.5" fill="#0B6B5B"/><circle cx="707.0" cy="334.0" r="5.5" fill="#0B6B5B"/><circle cx="726.0" cy="357.0" r="5.5" fill="#0B6B5B"/><circle cx="745.0" cy="380.0" r="5.5" fill="#0B6B5B"/><line x1="555" y1="150" x2="745" y2="380" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="6 4"/><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Correlation is not causation, and r near 0 can still hide a strong curved relationship.</text></svg>
