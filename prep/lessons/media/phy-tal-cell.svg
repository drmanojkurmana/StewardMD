<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Thick ascending limb of the loop of Henle</title><desc id="d">Thick ascending limb cell: NKCC2 on the apical membrane brings sodium potassium and two chloride in, ROMK returns potassium to the lumen creating a lumen positive voltage, the basolateral sodium potassium pump and chloride channel complete transport, and the positive voltage pushes calcium and magnesium through the paracellular path; the segment is water impermeable and loop diuretics block NKCC2.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thick ascending limb of the loop of Henle</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lumen on the left, blood on the right; the segment is impermeable to water</text><rect x="280.0" y="110.0" width="240.0" height="300.0" rx="8" fill="#FBEFD2" stroke="#071318" stroke-width="2.2"/><text x="130.0" y="130.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">LUMEN (+ voltage)</text><text x="670.0" y="130.0" font-size="13" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">BLOOD</text><text x="400.0" y="140.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">TAL cell</text><rect x="266.0" y="190.0" width="28.0" height="60.0" rx="8" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="280.0" y="224.0" font-size="8.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">NKCC2</text><line x1="150.0" y1="220.0" x2="254.8" y2="220.0" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round"/><path d="M262.0 220.0 L253.7 223.5 L253.7 216.5 Z" fill="#3E6FA5"/><text x="110.0" y="200.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Na+, K+, 2Cl-</text><rect x="266.0" y="290.0" width="28.0" height="44.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="280.0" y="316.0" font-size="8.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ROMK</text><line x1="262.0" y1="312.0" x2="167.2" y2="312.0" stroke="#3D5A54" stroke-width="2.4" stroke-linecap="round"/><path d="M160.0 312.0 L168.3 308.5 L168.3 315.5 Z" fill="#3D5A54"/><text x="110.0" y="304.0" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">K+ recycles</text><rect x="506.0" y="330.0" width="28.0" height="50.0" rx="8" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="520.0" y="360.0" font-size="8.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Na/K</text><line x1="538.0" y1="352.0" x2="632.8" y2="352.0" stroke="#3D5A54" stroke-width="2.4" stroke-linecap="round"/><path d="M640.0 352.0 L631.7 355.5 L631.7 348.5 Z" fill="#3D5A54"/><text x="680.0" y="346.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Na+ out</text><rect x="506.0" y="230.0" width="28.0" height="50.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="520.0" y="260.0" font-size="7.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ClC-Kb</text><line x1="538.0" y1="252.0" x2="632.8" y2="252.0" stroke="#3D5A54" stroke-width="2.4" stroke-linecap="round"/><path d="M640.0 252.0 L631.7 255.5 L631.7 248.5 Z" fill="#3D5A54"/><text x="680.0" y="246.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cl- out</text><line x1="280.0" y1="110.0" x2="280.0" y2="86.0" stroke="#3D5A54" stroke-width="1.2" stroke-linecap="round"/><text x="280.0" y="440.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Paracellular Ca2+ and Mg2+</text><text x="280.0" y="458.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">follow the lumen-positive voltage</text><text x="400.0" y="494.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Furosemide blocks NKCC2: salt wasting, hypokalaemia, calcium loss. Dilutes tubular fluid.</text></svg>