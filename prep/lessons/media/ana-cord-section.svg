<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d"><title id="t">Spinal cord cross-section: grey matter and tracts</title><desc id="d">Cross-section of the spinal cord with labelled grey matter horns and white matter tracts: dorsal columns, lateral corticospinal tract, anterolateral spinothalamic tract, anterior corticospinal tract.</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Spinal cord cross-section: grey matter and tracts</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Dorsal at the top; labels on the right side only, the left mirrors it</text><ellipse cx="400.0" cy="290.0" rx="170" ry="130" fill="#F4FAF8" stroke="#071318" stroke-width="2.4"/><path d="M400 282 C370 190 340 180 320 194 C300 220 340 270 300 285 C270 295 270 340 310 370 C350 355 380 330 400 320 C420 330 450 355 490 370 C530 340 530 295 500 285 C460 270 500 220 480 194 C460 180 430 190 400 282 Z" fill="#BFD9D1" stroke="#5C7D75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400.0" cy="298.0" r="5" fill="#FFFFFF" stroke="#5C7D75" stroke-width="1.4"/><path d="M408 190 L455 190 L430 260 L408 250 Z" fill="#F5DDA6" stroke="#B7791F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 240 L550 270 L540 310 L505 300 Z" fill="#E7B9B0" stroke="#B3382C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 320 L538 330 L510 380 L480 375 Z" fill="#C9D8EC" stroke="#3E6FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 390 L440 388 L430 408 L410 408 Z" fill="#DCEAF7" stroke="#3E6FA5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="430.0" y1="210.0" x2="560.0" y2="146.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="430.0" cy="210.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="565.0" y="150.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Dorsal columns</text><text x="565.0" y="168.0" font-size="11" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">fine touch, vibration, position</text><line x1="535.0" y1="270.0" x2="600.0" y2="256.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="535.0" cy="270.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="605.0" y="260.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Lateral corticospinal</text><text x="605.0" y="278.0" font-size="11" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">voluntary motor, crossed</text><line x1="520.0" y1="350.0" x2="580.0" y2="396.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="520.0" cy="350.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="585.0" y="400.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Spinothalamic</text><text x="585.0" y="418.0" font-size="11" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">pain, temperature, crossed</text><line x1="430.0" y1="398.0" x2="520.0" y2="486.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="430.0" cy="398.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="525.0" y="490.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Anterior corticospinal</text><text x="215.0" y="190.0" font-size="12" font-weight="700" text-anchor="end" fill="#0B6B5B" font-family="system-ui,sans-serif">DORSAL horn</text><text x="215.0" y="206.0" font-