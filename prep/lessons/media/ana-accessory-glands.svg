<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">Accessory gland secretions</title><desc id="d">Table of accessory gland secretions: seminal vesicles alkaline fluid rich in fructose and prostaglandins, prostate citric acid, acid phosphatase, PSA and zinc, bulbourethral glands mucus.</desc><rect width="800" height="330" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Accessory gland secretions</text><text x="104.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Gland</text><text x="370.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Secretes</text><text x="666.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Clinical note</text><rect x="19.0" y="100.0" width="170.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="132.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Seminal vesicles</text><line x1="192.0" y1="128.0" x2="215.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 128.0 L214.6 131.1 L214.6 124.9 Z" fill="#3D5A54"/><rect x="225.0" y="100.0" width="290.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="370.0" y="124.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Alkaline fluid: fructose, choline,</text><text x="370.0" y="140.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">prostaglandins</text><line x1="518.0" y1="128.0" x2="541.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M548.