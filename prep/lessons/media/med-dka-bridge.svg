<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">DKA to subcutaneous insulin: the overlap bridge</title>
<desc id="d">Never stop the insulin infusion before basal cover is on board. Give the first basal dose 1 to 2 hours before stopping the drip, so the infusion and the basal overlap. For insulin-naive patients, base the total daily dose on body weight, split about half basal and half mealtime, and never stop basal during the switch. Stopping the drip first invites rebound ketoacidosis.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Leaving the drip: overlap, never a gap</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Basal on board 1–2 h before the infusion stops; basal never stops</text>
<line x1="90" y1="200" x2="710" y2="200" stroke="#071318" stroke-width="2"/>
<text x="90" y="228" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">now</text>
<text x="400" y="228" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">+1 to 2 h</text>
<text x="710" y="228" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">steady</text>
<text x="400" y="250" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">time →</text>
<rect x="90" y="150" width="440" height="34" fill="#0B6B5B"/>
<text x="310" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">IV insulin infusion 0.1 units/kg/h</text>
<rect x="330" y="104" width="380" height="34" fill="#071318"/>
<text x="520" y="126" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">basal cover starts here</text>
<line x1="530" y1="104" x2="530" y2="200" stroke="#B42318" stroke-width="2" stroke-dasharray="5 4"/>
<text x="540" y="96" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">overlap 1–2 h</text>
<text x="520" y="300" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Weight-based total daily dose, then split it</text>
<rect x="150" y="316" width="500" height="56" fill="#F4F8F6"/>
<rect x="150" y="316" width="250" height="56" fill="#0B6B5B"/>
<rect x="400" y="316" width="250" height="56" fill="#3D5A54"/>
<text x="275" y="340" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">~½ basal</text>
<text x="275" y="358" font-size="11" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">once or twice daily</text>
<text x="525" y="340" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">~½ mealtime</text>
<text x="525" y="358" font-size="11" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">split across meals</text>
<rect x="90" y="396" width="620" height="44" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5"/>
<text x="400" y="423" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Stop the drip first and ketones rebound: overlap is the rule, not the exception.</text>
<text x="400" y="470" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Resolution before the switch: ketones below 0.6 with pH normalised; glucose below 250 rides with dextrose.</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Euglycaemic DKA on SGLT2 inhibitors needs dextrose plus insulin from the start.</text>
</svg>
