12.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Brunner glands (compound</text><text x="526.0" y="271.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">tubuloalveolar): alkaline mucus,</text><text x="526.0" y="287.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">neutralises acid chyme</text><line x1="460.0" y1="361.0" x2="520.0" y2="361.0" stroke="#3D5A54" stroke-width="1.2" stroke-linecap="round"/><text x="526.0" y="365.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">D1 serosa; D2 to D4 adventitia</text><text x="400.0" y="430.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Brunner glands: only in the duodenum. Peyer patches: ileum. Plicae are tallest in the jejunum.</text><text x="400.0" y="452.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The duct of each gland opens into a crypt.</text></svg>