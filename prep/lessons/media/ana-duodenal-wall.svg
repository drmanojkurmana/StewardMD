<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Wall of the duodenum</title><desc id="d">d</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Wall of the duodenum</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lumen at the top, layers in order</text><text x="60.0" y="108.0" font-size="12" font-weight="700" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">LUMEN</text><path d="M90 150 L90 112 Q110 96 130 112 L130 150" fill="#F5DDA6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 150 L150 112 Q170 96 190 112 L190 150" fill="#F5DDA6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 150 L210 112 Q230 96 250 112 L250 150" fill="#F5DDA6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 150 L270 112 Q290 96 310 112 L310 150" fill="#F5DDA6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 150 L330 112 Q350 96 370 112 L370 150" fill="#F5DDA6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M390 150 L390 112 Q410 96 430 112 L430 150" fill="#F5DDA6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="80.0" y="150.0" width="380.0" height="56.0" rx="0" fill="#F9ECD0" stroke="#071318" stroke-width="1.6"/><text x="270.0" y="183.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mucosa: villi + crypts of Lieberkuhn</text><rect x="80.0" y="206.0" width="380.0" height="18.0" rx="0" fill="#E4C9C4" stroke="#071318" stroke-width="1.4"/><rect x="80.0" y="2