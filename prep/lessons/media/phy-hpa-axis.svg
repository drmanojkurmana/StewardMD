<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 504" role="img" aria-labelledby="t d"><title id="t">Hypothalamic-pituitary-adrenal axis</title><desc id="d">d</desc><rect width="800" height="504" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypothalamic-pituitary-adrenal axis</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cortisol feeds back negatively on the hypothalamus and the pituitary</text><rect x="230.0" y="90.0" width="340.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="110.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stress, circadian rhythm (peak early</text><text x="400.0" y="126.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">morning)</text><rect x="230.0" y="164.0" width="340.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="192.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypothalamus: CRH</text><rect x="230.0" y="238.0" width="340.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="266.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior pituitary: ACTH</text><rect x="230.0" y="312.0" width="340.0" height="48.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="340.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Adrenal zona fasciculata: cortisol</text><rect x="230.0" y="386.0" width="340.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="406.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Glucose up, immune response down, protein</text><text x="400.0" y="422.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">breakdown</text><line x1="400.0" y1="138.0" x2="400.0" y2="156.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 164.0 L396.5 155.7 L403.5 155.7 Z" fill="#3D5A54"/><line x1="400.0" y1="212.0" x2="400.0" y2="230.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 238.0 L396.5 229.7 L403.5 229.7 Z" fill="#3D5A54"/><line x1="400.0" y1="286.0" x2="400.0" y2="304.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 312.0 L396.5 303.7 L403.5 303.7 Z" fill="#3D5A54"/><line x1="400.0" y1="360.0" x2="400.0" y2="378.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 386.0 L396.5 377.7 L403.5 377.7 Z" fill="#3D5A54"/><text x="400.0" y="486.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Long steroid courses suppress the axis: withdraw slowly to avoid adrenal crisis.</text></svg>