<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Femoral canal boundaries and why femoral hernias strangulate</title> <desc id="d">Box diagram of the femoral canal: anterior inguinal ligament, posterior Cooper pectineal ligament, medial sharp lacunar Gimbernat ligament, lateral femoral vein. Unyielding fibrous walls give a forty percent incarceration and strangulation risk, mandating urgent elective repair.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Femoral canal: four rigid walls, one rule</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Small cone of the femoral sheath, medial compartment: nothing here stretches</text> <rect x="230" y="150" width="340" height="200" rx="12" fill="#071318"/> <text x="400" y="182" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">FEMORAL CANAL</text> <text x="400" y="208" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">empty cone, medial compartment</text> <text x="400" y="230" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">of the femoral sheath</text> <text x="400" y="262" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">a hernia here cannot expand</text> <text x="400" y="300" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">below: saphenous opening below</text> <text x="400" y="322" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">above: femoral ring above</text> <text x="400" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">ANTERIOR: inguinal ligament</text> <text x="150" y="260" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif" transform="rotate(-90 150 260)">MEDIAL: lacunar (Gimbernat)</text> <text x="650" y="260" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif" transform="rotate(-90 650 260)">LATERAL: femoral vein</text> <text x="400" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">POSTERIOR: Cooper (pectineal) ligament</text> <rect x="100" y="410" width="600" height="52" rx="12" fill="#B7791F"/> <text x="400" y="442" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">40% incarcerate or strangulate: repair electively but urgently</text> <text x="400" y="480" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sharp lacunar ligament medially explains why reduction is hard and urgency is real.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Femoral hernia in an elderly woman: assume strangulation risk, book the list.</text> </svg>
