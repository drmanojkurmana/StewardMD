<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" role="img" aria-labelledby="t d"><title id="t">Middle ear: matching air to fluid</title><desc id="d">d</desc><rect width="800" height="326" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Middle ear: matching air to fluid</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Conductive hearing loss (wax, otosclerosis) loses this gain, typically about 20 to 30 dB</text><rect x="31.0" y="96.0" width="230.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="146.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tympanic membrane</text><text x="146.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(about 55 mm2)</text><rect x="285.0" y="96.0" width="230.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ossicular lever</text><text x="400.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(malleus longer than incus)</text><rect x="539.0" y="96.0" width="230.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="654.0" y="122.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oval window</text><text x="654.0" y="138.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(about 3.2 mm2)</text><rect x="31.0" y="196.0" width="230.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="146.0" y="230.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Area ratio about 17</text><rect x="285.0" y="196.0" width="230.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="230.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lever ratio about 1.3</text><rect x="539.0" y="196.0" width="230.0" height="60.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="654.0" y="230.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pressure gain about 22 times</text><line x1="261.0" y1="126.0" x2="277.8" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M285.0 126.0 L276.7 129.5 L276.7 122.5 Z" fill="#3D5A54"/><line x1="515.0" y1="126.0" x2="531.8" y2="126.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M539.0 126.0 L530.7 129.5 L530.7 122.5 Z" fill="#3D5A54"/><line x1="146.0" y1="156.0" x2="146.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M146.0 196.0 L142.5 187.7 L149.5 187.7 Z" fill="#3D5A54"/><line x1="400.0" y1="156.0" x2="400.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M400.0 196.0 L396.5 187.7 L403.5 187.7 Z" fill="#3D5A54"/><line x1="654.0" y1="156.0" x2="654.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M654.0 196.0 L650.5 187.7 L657.5 187.7 Z" fill="#3D5A54"/><text x="400.0" y="308.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Attenuation reflex: stapedius and tensor tympani contract in loud sound.</text></svg>