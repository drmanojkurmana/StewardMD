<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 434" role="img" aria-labelledby="t d"><title id="t">Neural tube closure</title><desc id="d">d</desc><rect width="800" height="434" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Neural tube closure</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Defects arise before many women know they are pregnant</text><rect x="255.0" y="96.0" width="290.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="114.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fusion starts at the cervical</text><text x="400.0" y="130.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">region,</text><text x="400.0" y="146.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">zips both ways (about week 4)</text><rect x="98.0" y="200.0" width="290.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="243.0" y="226.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Rostral neuropore closes</text><text x="243.0" y="242.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">about day 25</text><rect x="412.0" y="200.0" width="290.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="557.0" y="226.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Caudal neuropore closes</text><text x="557.0" y="242.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">about day 28</text><rect x="98.0" y="304.0" width="290.0" height="60.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="243.0" y="330.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Failure: anencephaly</text><text x="243.0" y="346.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(raised alpha-fetoprotein)</text><rect x="412.0" y="304.0" width="290.0" height="60.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="557.0" y="330.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Failure: spina bifida</text><text x="557.0" y="346.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(myelomeningocele, occulta)</text><line x1="400.0" y1="156.0" x2="249.9" y2="198.1" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M243.0 200.0 L250.0 194.4 L251.9 201.1 Z" fill="#3D5A54"/><line x1="400.0" y1="156.0" x2="550.1" y2="198.1" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M557.0 200.0 L548.1 201.1 L550.0 194.4 Z" fill="#3D5A54"/><line x1="243.0" y1="260.0" x2="243.0" y2="296.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M243.0 304.0 L239.5 295.7 L246.5 295.7 Z" fill="#3D5A54"/><line x1="557.0" y1="260.0" x2="557.0" y2="296.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M557.0 304.0 L553.5 295.7 L560.5 295.7 Z" fill="#3D5A54"/><text x="400.0" y="416.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Folic acid in the periconception period reduces neural tube defect risk.</text></svg>