<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Type one and type two errors</title><desc id="d">Two overlapping bell curves for the null and alternative hypotheses with a significance cut-off. The tail beyond the cut-off under the null is alpha, the type one error; the area under the alternative curve before the cut-off is beta, the type two error; the rest is power.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Type I and type II errors</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Two overlapping worlds: no real effect (H0) and a real effect (H1)</text><path d="M120.0 358.9 L127.9 358.3 L135.8 357.4 L143.8 356.2 L151.7 354.6 L159.6 352.3 L167.5 349.3 L175.4 345.4 L183.3 340.5 L191.3 334.3 L199.2 326.7 L207.1 317.7 L215.0 307.2 L222.9 295.2 L230.8 281.9 L238.8 267.5 L246.7 252.4 L254.6 237.1 L262.5 222.0 L270.4 207.9 L278.3 195.2 L286.3 184.6 L294.2 176.6 L302.1 171.7 L310.0 170.0 L317.9 171.7 L325.8 176.6 L333.8 184.6 L341.7 195.2 L349.6 207.9 L357.5 222.0 L365.4 237.1 L373.3 252.4 L381.3 267.5 L389.2 281.9 L397.1 295.2 L405.0 307.2 L412.9 317.7 L420.8 326.7 L428.8 334.3 L436.7 340.5 L444.6 345.4 L452.5 349.3 L460.4 352.3 L468.3 354.6 L476.3 356.2 L484.2 357.4 L492.1 358.3 L500.0 358.9 L500 360 L120 360 Z" fill="none" stroke="#0B6B5B" stroke-width="3"/><path d="M310.0 358.9 L317.9 358.3 L325.8 357.4 L333.8 356.2 L341.7 354.6 L349.6 352.3 L357.5 349.3 L365.4 345.4 L373.3 340.5 L381.3 334.3 L389.2 326.7 L397.1 317.7 L405.0 307.2 L412.9 295.2 L420.8 281.9 L428.8 267.5 L436.7 252.4 L444.6 237.1 L452.5 222.0 L460.4 207.9 L468.3 195.2 L476.3 184.6 L484.2 176.6 L492.1 171.7 L500.0 170.0 L507.9 171.7 L515.8 176.6 L523.8 184.6 L531.7 195.2 L539.6 207.9 L547.5 222.0 L555.4 237.1 L563.3 252.4 L571.3 267.5 L579.2 281.9 L587.1 295.2 L595.0 307.2 L602.9 317.7 L610.8 326.7 L618.8 334.3 L626.7 340.5 L634.6 345.4 L642.5 349.3 L650.4 352.3 L658.3 354.6 L666.3 356.2 L674.2 357.4 L682.1 358.3 L690.0 358.9 L690 360 L310 360 Z" fill="none" stroke="#B7791F" stroke-width="3"/><line x1="405" y1="120" x2="405" y2="360" stroke="#B42318" stroke-width="2.5" stroke-dasharray="6 4"/><text x="405" y="106" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">significance cut-off</text><text x="250" y="150" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">H0 true:</text><text x="250" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">no effect</text><text x="560" y="150" font-size="14" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">H1 true:</text><text x="560" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">real effect</text><text x="478" y="330" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">α: type I error</text><text x="478" y="352" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">false positive</text><text x="316" y="330" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">β: type II error</text><text x="316" y="352" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">false negative (missed effect)</text><text x="600" y="252" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">power = 1 − β</text><line x1="120" y1="360" x2="690" y2="360" stroke="#071318" stroke-width="2"/><text x="400" y="430" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">α is set in advance (usually 0.05). More patients, bigger effects and less noise all raise power.</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">A non-significant result in a low-power study is inconclusive, not proof of no effect.</text></svg>
