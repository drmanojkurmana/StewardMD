<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">The epidemiologic triad: agent, host, environment</title><desc id="d">Two triangles. In balance the three factors sit level and disease stays at its expected level. When one corner grows heavy the triangle tips and an epidemic follows.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The epidemiologic triad: agent, host, environment</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Disease stays expected while the three corners balance; tipping one corner tips the scale</text><path d="M180 130 L300 360 L60 360 Z" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="360" r="32" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="3"/><text x="60" y="359" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">AGENT</text><circle cx="300" cy="360" r="32" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="3"/><text x="300" y="359" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">HOST</text><circle cx="180" cy="130" r="32" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="3"/><text x="180" y="133.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif" textLength="56" lengthAdjust="spacingAndGlyphs">ENVIRONMENT</text><text x="180" y="430" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Balanced: disease at expected level</text><path d="M570 190 L668 320 L428 386 Z" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="3" stroke-linejoin="round"/><circle cx="428" cy="386" r="38" fill="#FFFFFF" stroke="#B42318" stroke-width="3"/><text x="428" y="385" font-size="10.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">AGENT</text><text x="428" y="438" font-size="11" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">heavier</text><circle cx="668" cy="320" r="32" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="3"/><text x="668" y="319" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">HOST</text><circle cx="570" cy="190" r="32" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="3"/><text x="570" y="193.5" font-size="9.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif" textLength="56" lengthAdjust="spacingAndGlyphs">ENVIRONMENT</text><text x="560" y="430" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Tipped: epidemic follows</text><text x="400.0" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Investigation asks which corner shifted: a new agent, weaker hosts, or a changed environment.</text></svg>
