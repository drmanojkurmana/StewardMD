<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d"><title id="t">Adrenal gland: layers and hormones</title><desc id="d">Layers of the adrenal gland from outside in: capsule, zona glomerulosa making aldosterone, zona fasciculata making cortisol, zona reticularis making androgens, and the medulla making adrenaline and noradrenaline.</desc><rect width="800" height="480" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Adrenal gland: layers and hormones</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Outer cortex, inner medulla</text><rect x="60.0" y="90.0" width="280.0" height="26.0" rx="0" fill="#F4FAF8" stroke="#071318" stroke-width="1.6"/><text x="200.0" y="108.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Capsule</text><rect x="60.0" y="116.0" width="280.0" height="50.0" rx="0" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="200.0" y="146.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Zona glomerulosa</text><text x="370.0" y="139.0" font-size="13" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Aldosterone (mineralocorticoid)</text><text x="370.0" y="157.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Controlled by angiotensin II and K+</text><rect x="60.0" y="166.0" width="280.0" height="100.0" rx="0" fill="#F5DDA6" stroke="#071318" stroke-width="1.6"/><text x="200.0" y="221.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Zona fasciculata</text><text x="370.0" y="214.0" font-size="13" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Cortisol (glucocorticoid)</text><text x="370.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Controlled by ACTH; widest layer</text><rect x="60.0" y="266.0" width="280.0" height="60.0" rx="0" fill="#F1C6C0" stroke="#071318" stroke-width="1.6"/><text x="200.0" y="301.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Zona reticularis</text><text x="370.0" y="294.0" font-size="13" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">DHEA, androstenedione (androgens)</text><text x="370.0" y="312.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Controlled by ACTH</text><rect x="60.0" y="326.0" width="280.0" height="80.0" rx="0" fill="#C9D8EC" stroke="#071318" stroke-width="1.6"/><text x="200.0" y="371.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Medulla</text><text x="370.0" y="364.0" font-size="13" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Adrenaline and noradrenaline</text><text x="370.0" y="382.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Chromaffin cells, sympathetic preganglionic ACh</text><text x="400.0" y="440.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mnemonic from outside in: Salt, Sugar, Sex (GFR). The deeper, the sweeter.</text></svg>