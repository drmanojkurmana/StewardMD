<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Myasthenia gravis</title><desc id="d">d</desc><rect width="800" height="450" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Myasthenia gravis</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Crisis: too little (myasthenic) or too much (cholinergic) acetylcholinesterase inhibitor</text><rect x="235.0" y="96.0" width="330.0" height="56.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="128.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Autoantibodies: AChR (most), MuSK, LRP4</text><rect x="235.0" y="182.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="206.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fewer functional receptors,</text><text x="400.0" y="222.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">end plate potential falls below threshold</text><rect x="58.0" y="268.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="223.0" y="292.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fatigable weakness: ptosis, diplopia,</text><text x="223.0" y="308.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">bulbar, limb</text><rect x="412.0" y="268.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="577.0" y="292.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thymoma or thymic hyperplasia:</text><text x="577.0" y="308.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CT chest</text><rect x="235.0" y="354.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="378.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Treat: pyridostigmine, immunosuppression,</text><text x="400.0" y="394.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">thymectomy</text><line x1="400.0" y1="152.0" x2="400.0" y2="174.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 182.0 L396.5 173.7 L403.5 173.7 Z" fill="#3D5A54"/><line x1="400.0" y1="238.0" x2="230.1" y2="266.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M223.0 268.0 L230.6 263.2 L231.8 270.1 Z" fill="#3D5A54"/><line x1="400.0" y1="238.0" x2="569.9" y2="266.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M577.0 268.0 L568.2 270.1 L569.4 263.2 Z" fill="#3D5A54"/><line x1="223.0" y1="324.0" x2="392.9" y2="352.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 354.0 L391.2 356.1 L392.4 349.2 Z" fill="#3D5A54"/><line x1="577.0" y1="324.0" x2="407.1" y2="352.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 354.0 L407.6 349.2 L408.8 356.1 Z" fill="#3D5A54"/></svg>