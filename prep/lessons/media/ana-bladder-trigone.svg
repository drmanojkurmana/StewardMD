<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d"><title id="t">Trigone of the bladder</title><desc id="d">d</desc><rect width="800" height="480" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Trigone of the bladder</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Bladder opened from the front</text><path d="M110 140 C110 90 690 90 690 140 L610 300 C580 360 470 400 400 410 C330 400 220 360 190 300 Z" fill="#EAF2F6" stroke="#071318" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 190 L510 190 L400 330 Z" fill="#BFE3D6" stroke="#0B6B5B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="290.0" y1="190.0" x2="510.0" y2="190.0" stroke="#0B6B5B" stroke-width="5" stroke-linecap="round"/><circle cx="290.0" cy="190.0" r="8" fill="#FFFFFF" stroke="#071318" stroke-width="2"/><circle cx="510.0" cy="190.0" r="8" fill="#FFFFFF" stroke="#071318" stroke-width="2"/><circle cx="400.0" cy="330.0" r="9" fill="#FFFFFF" stroke="#071318" stroke-width="2"/><text x="275.0" y="178.0" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Right ureteric</text><text x="275.0" y="194.0" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">orifice</text><text x="525.0" y="178.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Left ureteric</text><text x="525.0" y="194.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">orifice</text><text x="400.0" y="180.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">interureteric ridge</text><text x="420.0" y="352.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Internal urethral orifice</text><text x="400.0" y="262.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Trigone</text><text x="400.0" y="445.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Trigone mucosa is smooth and fixed; the rest of the bladder is rugose and folds when empty.</text></svg>