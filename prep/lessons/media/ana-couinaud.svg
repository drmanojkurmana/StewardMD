<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Couinaud segments of the liver</title><desc id="d">Couinaud liver segments in the standard layout: top row VII, VIII, IVa, II; bottom row VI, V, IVb, III; caudate lobe I separate; vertical planes of the right, middle and left hepatic veins and a transverse portal plane.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Couinaud segments of the liver</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Anterior view, patient right on the left of the page</text><rect x="100.0" y="130.0" width="140.0" height="120.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="170.0" y="198.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">VII</text><rect x="100.0" y="262.0" width="140.0" height="120.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="170.0" y="330.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">VI</text><rect x="255.0" y="130.0" width="140.0" height="120.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="325.0" y="198.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">VIII</text><rect x="255.0" y="262.0" width="140.0" height="120.0" rx="8" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="325.0" y="330.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">V</text><rect x="410.0" y="130.0" width="140.0" height="120.0" rx="8" fill="#F5DDA6" stroke="#071318" stroke-width="1.6"/><text x="480.0" y="198.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">IVa</text><rect x="410.0" y="262.0" width="140.0" height="120.0" rx="8" fill="#F5DDA6" stroke="#071318" stroke-width="1.6"/><text x="480.0" y="330.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">IVb</text><rect x="565.0" y="130.0" width="140.0" height="120.0" rx="8" fill="#DCEAF7" stroke="#071318" stroke-width="1.6"/><text x="635.0" y="198.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">II</text><rect x="565.0" y="262.0" width="140.0" height="120.0" rx="8" fill="#DCEAF7" stroke="#071318" stroke-width="1.6"/><text x="635.0" y="330.4" font-size="24" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">III</text><circle cx="400.0" cy="100.0" r="0" fill="none" stroke="none" stroke-width="0"/><text x="250.0" y="112.0" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Right lobe</text><text x="485.0" y="112.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Left lobe (IV: medial, II and III: lateral)</text><line x1="247.5" y1="126.0" x2="247.5" y2="388.0" stroke="#3E6FA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="247.5" y="408.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3E6FA5" font-family="system-ui,sans-serif">right hepatic vein plane</text><line x1="402.5" y1="126.0" x2="402.5" y2="388.0" stroke="#3E6FA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="402.5" y="408.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3E6FA5" font-family="system-ui,sans-serif">middle hepatic vein plane</text><line x1="557.5" y1="126.0" x2="557.5" y2="388.0" stroke="#3E6FA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="557.5" y="408.0" font-size="10.5" font-weight=