<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d"><title id="t">Cerebral artery territories</title><desc id="d">d</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cerebral artery territories</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Coronal section; deficits appear on the opposite side of the body</text><clipPath id="cb"><ellipse cx="300" cy="262" rx="180" ry="148"/></clipPath><ellipse cx="300.0" cy="262.0" rx="180" ry="148" fill="#DCEAF7" stroke="#071318" stroke-width="2"/><g clip-path="url(#cb)"><rect x="238.0" y="102.0" width="124.0" height="190.0" rx="0" fill="#BFE3D6" stroke="none" stroke-width="0"/><rect x="100.0" y="337.0" width="400.0" height="90.0" rx="0" fill="#F5DDA6" stroke="none" stroke-width="0"/></g><ellipse cx="300.0" cy="262.0" rx="180" ry="148" fill="none" stroke="#071318" stroke-width="2"/><line x1="300.0" y1="114.0" x2="300.0" y2="332.0" stroke="#071318" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="300.0" cy="282.0" rx="70" ry="14" fill="none" stroke="#3D5A54" stroke-width="1.4"/><line x1="328.0" y1="182.0" x2="530.0" y2="126.1" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="328.0" cy="182.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="535.0" y="130.0" font-size="13" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Anterior cerebral artery</text><text x="535.0" y="148.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Contralateral leg weakness,</text><text x="535.0" y="163.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">abulia, incontinence</text><line x1="430.0" y1="242.0" x2="530.0" y2="246.1" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="430.0" cy="242.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="535.0" y="250.0" font-size="13" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Middle cerebral artery</text><text x="535.0" y="268.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Face and arm weakness; aphasia</text><text x="535.0" y="283.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">(dominant), neglect (non-dominant)</text><line x1="360.0" y1="382.0" x2="530.0" y2="376.1" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="360.0" cy="382.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="535.0" y="380.0" font-size="13" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Posterior cerebral artery</text><text x="535.0" y="398.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Contralateral homonymous</text><text x="535.0" y="413.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">hemianopia, macula spared</text><text x="400.0" y="505.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Penetrating lenticulostriate branches of the MCA supply the internal capsule and basal ganglia.</text></svg>