<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Standing up</title><desc id="d">d</desc><rect width="800" height="460" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Standing up</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Muscle pump and valves in leg veins also help return</text><rect x="250.0" y="92.0" width="300.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="112.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stand: 300 to 500 mL pools in leg</text><text x="400.0" y="128.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">veins</text><rect x="250.0" y="162.0" width="300.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="182.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Venous return, stroke volume and BP</text><text x="400.0" y="198.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">fall</text><rect x="250.0" y="232.0" width="300.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="260.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Baroreceptor unloading</text><rect x="250.0" y="302.0" width="300.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="330.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sympathetic up, vagal down</text><rect x="88.0" y="372.0" width="300.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="238.0" y="392.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Heart rate and vasoconstriction</text><text x="238.0" y="408.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">restore BP</text><rect x="412.0" y="372.0" width="300.0" height="48.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="562.0" y="384.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Failure: orthostatic hypotension,</text><text x="562.0" y="400.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">autonomic neuropathy, low volume,</text><text x="562.0" y="416.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">drugs</text><line x1="400.0" y1="140.0" x2="400.0" y2="154.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 162.0 L396.5 153.7 L403.5 153.7 Z" fill="#3D5A54"/><line x1="400.0" y1="210.0" x2="400.0" y2="224.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 232.0 L396.5 223.7 L403.5 223.7 Z" fill="#3D5A54"/><line x1="400.0" y1="280.0" x2="400.0" y2="294.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 302.0 L396.5 293.7 L403.5 293.7 Z" fill="#3D5A54"/><line x1="400.0" y1="350.0" x2="245.1" y2="371.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 372.0 L245.7 367.4 L246.7 374.4 Z" fill="#3D5A54"/><line x1="400.0" y1="350.0" x2="554.9" y2="371.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M562.0 372.0 L553.3 374.4 L554.3 367.4 Z" fill="#3D5A54"/></svg>