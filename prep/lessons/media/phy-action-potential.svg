<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d"><title id="t">The neuronal action potential</title><desc id="d">Plot of one neuronal action potential against time: resting at minus 70 millivolts, threshold at minus 55, rapid depolarisation to about plus 35 as sodium channels open, repolarisation as potassium channels open, undershoot below rest, and return to rest.</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The neuronal action potential</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Threshold -55 mV; ENa about +60 mV; EK about -90 mV</text><line x1="92.0" y1="450.0" x2="760.0" y2="450.0" stroke="#071318" stroke-width="2" stroke-linecap="round"/><line x1="92.0" y1="450.0" x2="92.0" y2="84.0" stroke="#071318" stroke-width="2" stroke-linecap="round"/><line x1="92.0" y1="450.0" x2="92.0" y2="456.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="92.0" y="472.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><line x1="225.6" y1="450.0" x2="225.6" y2="456.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="225.6" y="472.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1</text><line x1="359.2" y1="450.0" x2="359.2" y2="456.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="359.2" y="472.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2</text><line x1="492.8" y1="450.0" x2="492.8" y2="456.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="492.8" y="472.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">3</text><line x1="626.4" y1="450.0" x2="626.4" y2="456.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="626.4" y="472.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">4</text><line x1="760.0" y1="450.0" x2="760.0" y2="456.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="760.0" y="472.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">5</text><line x1="86.0" y1="450.0" x2="92.0" y2="450.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="454.0" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">-100</text><line x1="86.0" y1="381.4" x2="92.0" y2="381.4" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="385.4" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">-70</text><line x1="86.0" y1="347.1" x2="92.0" y2="347.1" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="351.1" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">-55</text><line x1="86.0" y1="221.2" x2="92.0" y2="221.2" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="225.2" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><line x1="86.0" y1="141.2" x2="92.0" y2="141.2" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="82.0" y="145.2" font-size="12" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">35</text><text x="426.0" y="512.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Time (ms)</text><text x="26" y="267.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-u