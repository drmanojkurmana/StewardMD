<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" role="img" aria-labelledby="t d"><title id="t">Ligaments that hold the uterus</title><desc id="d">d</desc><rect width="800" height="484" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ligaments that hold the uterus</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Anteverted: cervix points back. Anteflexed: body bends forward on the cervix</text><text x="99.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Ligament</text><text x="375.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Runs between</text><text x="676.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Role</text><rect x="-1.0" y="104.0" width="200.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="130.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cardinal (transverse</text><text x="99.0" y="146.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">cervical)</text><line x1="202.0" y1="134.0" x2="225.6" y2="134.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M232.0 134.0 L224.6 137.1 L224.6 130.9 Z" fill="#3D5A54"/><rect x="235.0" y="104.0" width="280.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="375.0" y="130.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cervix and vaginal vault to lateral</text><text x="375.0" y="146.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pelvic wall</text><line x1="518.0" y1="134.0" x2="541.6" y2="134.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M548.0 134.0 L540.6 137.1 L540.6 130.9 Z" fill="#3D5A54"/><rect x="551.0" y="104.0" width="250.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="676.0" y="130.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Main support; uterine artery</text><text x="676.0" y="146.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">crosses above the ureter</text><rect x="-1.0" y="176.0" width="200.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="210.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Uterosacral</text><line x1="202.0" y1="206.0" x2="225.6" y2="206.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M232.0 206.0 L224.6 209.1 L224.6 202.9 Z" fill="#3D5A54"/><rect x="235.0" y="176.0" width="280.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="375.0" y="210.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cervix to sacrum</text><line x1="518.0" y1="206.0" x2="541.6" y2="206.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M548.0 206.0 L540.6 209.1 L540.6 202.9 Z" fill="#3D5A54"/><rect x="551.0" y="176.0" width="250.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="676.0" y="202.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Keeps the cervix back</text><text x="676.0" y="218.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(anteversion)</text><rect x="-1.0" y="248.0" width="200.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="282.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Round ligament</text><line x1="202.0" y1="278.0" x2="225.6" y2="278.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M232.0 278.0 L224.6 281.1 L224.6 274.9 Z" fill="#3D5A54"/><rect x="235.0" y="248.0" width="280.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="375.0" y="274.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Uterine horn, deep inguinal ring,</text><text x="375.0" y="290.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">labium majus</text><line x1="518.0" y1="278.0" x2="541.6" y2="278.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M548.0 278.0 L540.6 281.1 L540.6 274.9 Z" fill="#3D5A54"/><rect x="551.0" y="248.0" width="250.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="676.0" y="282.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pulls fundus forward (anteversion)</text><rect x="-1.0" y="320.0" width="200.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="354.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pubocervical</text><line x1="202.0" y1="350.0" x2="225.6" y2="350.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M232.0 350.0 L224.6 353.1 L224.6 346.9 Z" fill="#3D5A54"/><rect x="235.0" y="320.0" width="280.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="375.0" y="354.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cervix to pubis</text><line x1="518.0" y1="350.0" x2="541.6" y2="350.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M548.0 350.0 L540.6 353.1 L540.6 346.9 Z" fill="#3D5A54"/><rect x="551.0" y="320.0" width="250.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="676.0" y="354.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Supports the front of the cervix</text><rect x="-1.0" y="392.0" width="200.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="99.0" y="426.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Broad ligament</text><line x1="202.0" y1="422.0" x2="225.6" y2="422.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M232.0 422.0 L224.6 425.1 L224.6 418.9 Z" fill="#3D5A54"/><rect x="235.0" y="392.0" width="280.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="375.0" y="418.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Peritoneal fold, uterus to pelvic</text><text x="375.0" y="434.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">side wall</text><line x1="518.0" y1="422.0" x2="541.6" y2="422.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M548.0 422.0 L540.6 425.1 L540.6 418.9 Z" fill="#3D5A54"/><rect x="551.0" y="392.0" width="250.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="676.0" y="418.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Not a true support; contains tube,</text><text x="676.0" y="434.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ovarian ligament</text></svg>