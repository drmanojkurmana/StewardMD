<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Ecological correlation and the ecological fallacy</title><desc id="d">Left: six countries show a rising group-level line between fat intake and heart deaths. Right: individuals inside two countries form flat clouds, so the group link does not hold for individuals.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ecological correlation and the ecological fallacy</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">A link between averages need not hold for individuals</text><text x="200" y="90" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Groups: countries rise together</text><line x1="60" y1="110" x2="60" y2="400" stroke="#071318" stroke-width="2"/><line x1="60" y1="400" x2="350" y2="400" stroke="#071318" stroke-width="2"/><text x="30" y="250" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Deaths</text><text x="205" y="420" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Average fat intake</text><circle cx="132" cy="324" r="13" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="132.0" y="328.5" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A</text><circle cx="171" cy="286" r="13" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="171.0" y="290.5" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">B</text><circle cx="210" cy="238" r="13" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="210.0" y="243.0" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">C</text><circle cx="249" cy="200" r="13" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="249.0" y="205.0" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">D</text><circle cx="288" cy="153" r="13" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="288.0" y="157.5" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">E</text><circle cx="327" cy="115" r="13" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="327.0" y="119.5" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">F</text><line x1="95" y1="330" x2="330" y2="120" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="7 5"/><text x="200" y="445" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Country averages correlate strongly</text><text x="600" y="90" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Individuals: flat inside each country</text><line x1="450" y1="110" x2="450" y2="400" stroke="#071318" stroke-width="2"/><line x1="450" y1="400" x2="750" y2="400" stroke="#071318" stroke-width="2"/><text x="600" y="420" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Personal fat intake</text><circle cx="554" cy="180" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="630" cy="176" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="603" cy="192" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="493" cy="200" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="489" cy="196" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="496" cy="177" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="578" cy="218" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="508" cy="185" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="624" cy="225" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="613" cy="194" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="705" cy="175" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="677" cy="188" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="513" cy="179" r="6" fill="#0B6B5B" opacity="0.75"/><circle cx="551" cy="218" r="6" fill="#0B6B5B" opacity="0.75"/><text x="600" y="158" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Country B people</text><circle cx="522" cy="325" r="6" fill="#B7791F" opacity="0.75"/><circle cx="627" cy="313" r="6" fill="#B7791F" opacity="0.75"/><circle cx="606" cy="296" r="6" fill="#B7791F" opacity="0.75"/><circle cx="494" cy="304" r="6" fill="#B7791F" opacity="0.75"/><circle cx="636" cy="316" r="6" fill="#B7791F" opacity="0.75"/><circle cx="552" cy="325" r="6" fill="#B7791F" opacity="0.75"/><circle cx="584" cy="309" r="6" fill="#B7791F" opacity="0.75"/><circle cx="663" cy="331" r="6" fill="#B7791F" opacity="0.75"/><circle cx="536" cy="324" r="6" fill="#B7791F" opacity="0.75"/><circle cx="601" cy="341" r="6" fill="#B7791F" opacity="0.75"/><circle cx="648" cy="308" r="6" fill="#B7791F" opacity="0.75"/><circle cx="705" cy="299" r="6" fill="#B7791F" opacity="0.75"/><circle cx="576" cy="334" r="6" fill="#B7791F" opacity="0.75"/><circle cx="515" cy="319" r="6" fill="#B7791F" opacity="0.75"/><text x="600" y="278" font-size="11" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Country E people</text><text x="600" y="445" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Within each country: no link at all</text><text x="400.0" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Group patterns can mislead: always check the individuals before concluding.</text></svg>
