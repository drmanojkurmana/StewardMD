<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Purine salvage and catabolism pathway</title><desc id="d">Biochemical pathway of purine salvage and degradation. Hypoxanthine and guanine are salvaged by HGPRT to form IMP and GMP. When salvage fails or degradation proceeds, xanthine oxidase converts hypoxanthine to xanthine and xanthine to poorly soluble uric acid. Allopurinol and febuxostat inhibit xanthine oxidase to manage hyperuricaemia and clinical gout.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Purine metabolism: Salvage and Catabolism</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">HGPRT salvage versus Xanthine Oxidase pathway leading to uric acid</text><rect x="60" y="90" width="320" height="230" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="220" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Purine Salvage Pathway</text><rect x="85" y="140" width="115" height="35" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="142" y="162" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypoxanthine</text><rect x="235" y="140" width="115" height="35" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="292" y="162" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Guanine</text><line x1="142" y1="175" x2="142" y2="240" stroke="#0B6B5B" stroke-width="2" marker-end="url(#arr-teal)"/><line x1="292" y1="175" x2="292" y2="240" stroke="#0B6B5B" stroke-width="2" marker-end="url(#arr-teal)"/><rect x="135" y="195" width="170" height="26" rx="4" fill="#0B6B5B"/><text x="220" y="213" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">HGPRT (+ PRPP)</text><rect x="85" y="245" width="115" height="35" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="142" y="267" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">IMP (Nucleotide)</text><rect x="235" y="245" width="115" height="35" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="292" y="267" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GMP (Nucleotide)</text><rect x="85" y="290" width="265" height="22" fill="none"/><text x="217" y="305" font-size="10.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">HGPRT deficiency = Lesch-Nyhan syndrome</text><rect x="420" y="90" width="320" height="340" rx="8" fill="#FDF2F0" stroke="#B42318" stroke-width="2"/><text x="580" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Purine Degradation Pathway</text><rect x="500" y="140" width="160" height="36" rx="4" fill="#FFFFFF" stroke="#071318" stroke-width="1.5"/><text x="580" y="163" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypoxanthine</text><line x1="580" y1="176" x2="580" y2="225" stroke="#B42318" stroke-width="2.5" marker-end="url(#arr-red)"/><rect x="480" y="190" width="200" height="24" rx="4" fill="#B42318"/><text x="580" y="206" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Xanthine Oxidase</text><rect x="500" y="230" width="160" height="36" rx="4" fill="#FFFFFF" stroke="#071318" stroke-width="1.5"/><text x="580" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Xanthine</text><line x1="580" y1="266" x2="580" y2="315" stroke="#B42318" stroke-width="2.5" marker-end="url(#arr-red)"/><rect x="480" y="280" width="200" height="24" rx="4" fill="#B42318"/><text x="580" y="296" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Xanthine Oxidase</text><rect x="480" y="320" width="200" height="42" rx="4" fill="#071318"/><text x="580" y="346" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Uric Acid (Low solubility)</text><rect x="440" y="380" width="280" height="40" rx="4" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.5"/><text x="580" y="398" font-size="11" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Drug Target: Allopurinol / Febuxostat</text><text x="580" y="412" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Inhibits Xanthine Oxidase → Lowers Urate</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Needle-shaped negatively birefringent monosodium urate crystals precipitate in joints (podagra) when urate exceeds 6.8 mg/dL.</text></svg>