<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Symmetric and skewed distributions</title><desc id="d">Three distribution curves. In the symmetric curve the mode, median and mean coincide. In the positively skewed curve the order is mode, then median, then mean. In the negatively skewed curve the order reverses.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Symmetric and skewed distributions</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Where the mean, median and mode sit decides which average to report</text><path d="M35.0 329.6 L38.5 329.4 L42.0 329.2 L45.5 328.8 L49.0 328.3 L52.5 327.6 L56.0 326.6 L59.5 325.4 L63.0 323.7 L66.5 321.5 L70.0 318.8 L73.5 315.4 L77.0 311.3 L80.5 306.2 L84.0 300.2 L87.5 293.2 L91.0 285.2 L94.5 276.2 L98.0 266.2 L101.5 255.4 L105.0 243.9 L108.5 232.0 L112.0 220.0 L115.5 208.2 L119.0 196.9 L122.5 186.6 L126.0 177.5 L129.5 170.1 L133.0 164.6 L136.5 161.2 L140.0 160.0 L143.5 161.2 L147.0 164.6 L150.5 170.1 L154.0 177.5 L157.5 186.6 L161.0 196.9 L164.5 208.2 L168.0 220.0 L171.5 232.0 L175.0 243.9 L178.5 255.4 L182.0 266.2 L185.5 276.2 L189.0 285.2 L192.5 293.2 L196.0 300.2 L199.5 306.2 L203.0 311.3 L206.5 315.4 L210.0 318.8 L213.5 321.5 L217.0 323.7 L220.5 325.4 L224.0 326.6 L227.5 327.6 L231.0 328.3 L234.5 328.8 L238.0 329.2 L241.5 329.4 L245.0 329.6 L245.0 330 L35.0 330 Z" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="140" y="90" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Symmetric</text><line x1="140" y1="330" x2="140" y2="212" stroke="#0B6B5B" stroke-width="2.5" stroke-dasharray="5 4"/><text x="140" y="204" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family=