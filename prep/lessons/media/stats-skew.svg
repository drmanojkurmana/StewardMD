00" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mean pulled to the tail: report the median</text><text x="660" y="380" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mean pulled to the tail: report the median</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">In skewed data the mean chases the long tail; the median stays with the typical patient.</text></svg>
