<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 361.0" role="img" aria-labelledby="t d"><title id="t">Ligaments of the ankle</title><desc id="d">Table of ankle ligaments: medial deltoid ligament is strong and rarely torn, lateral ligaments are anterior talofibular, calcaneofibular and posterior talofibular, with the anterior talofibular most often sprained in inversion injury.</desc><rect width="800" height="361.0" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ligaments of the ankle</text><text x="74.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Side</text><text x="310.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Ligament</text><text x="636.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Clinical point</text><rect x="19.0" y="100.0" width="110.0" height="48.5" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="74.0" y="128.6" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Medial</text><line x1="132.0" y1="124.2" x2="155.6" y2="124.2" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M162.0 124.2 L154.6 127.4 L154.6 121.1 Z" fill="#3D5A54"/><rect x="165.0" y="100.0" width="290.0" height="48.5" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="310.0" y="121.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Deltoid: tibionavicular,</text><text x="310.0" y="136.2" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">tibiocalcaneal, tibiotalar</text><line x1="458.0" y1="124.2" x2="481.6" y2="124.2" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M488.0 124.2 L480.6 127.4 L480.6 121.1 Z" fill="#3D5A54"/><rect x="491.0" y="100.0" width="290.0" height="48.5" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="636.0" y="121.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Strong; eversion injury more often</text><text x="636.0" y="136.2" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">fractures the malleolus</text><rect x="19.0" y="160.5" width="110.0" height="48.5" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="74.0" y="189.1" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lateral</text><line x1="132.0" y1="184.8" x2="155.6" y2="184.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M162.0 184.8 L154.6 187.9 L154.6 181.6 Z" fill="#3D5A54"/><rect x="165.0" y="160.5" width="290.0" height="48.5" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="310.0" y="189.1" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior talofibular</text><line x1="458.0" y1="184.8" x2="481.6" y2="184.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M488.0 184.8 L480.6 187.9 L480.6 181.6 Z" fill="#3D5A54"/><rect x="491.0" y="160.5" width="290.0" height="48.5" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="636.0" y="181.5" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Weakest and most often torn, in</text><text x="636.0" y="196.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">inversion</text><rect x="19.0" y="221.0" width="110.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="74.0" y="249.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lateral</text><line x1="132.0" y1="245.0" x2="155.6" y2="245.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M162.0 245.0 L154.6 248.1 L154.6 241.9 Z" fill="#3D5A54"/><rect x="165.0" y="221.0" width="290.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="310.0" y="249.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Calcaneofibular</text><line x1="458.0" y1="245.0" x2="481.6" y2="245.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M488.0 245.0 L480.6 248.1 L480.6 241.9 Z" fill="#3D5A54"/><rect x="491.0" y="221.0" width="290.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="636.0" y="249.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Torn second in severe inversion</text><rect x="19.0" y="281.0" width="110.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="74.0" y="309.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lateral</text><line x1="132.0" y1="305.0" x2="155.6" y2="305.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M162.0 305.0 L154.6 308.1 L154.6 301.9 Z" fill="#3D5A54"/><rect x="165.0" y="281.0" width="290.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="310.0" y="309.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior talofibular</text><line x1="458.0" y1="305.0" x2="481.6" y2="305.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M488.0 305.0 L480.6 308.1 L480.6 301.9 Z" fill="#3D5A54"/><rect x="491.0" y="281.0" width="290.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="636.0" y="309.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Strongest lateral band; rarely torn</text></svg>