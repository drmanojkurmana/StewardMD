<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Cavernous sinus, coronal section</title><desc id="d">Coronal section of the cavernous sinus: pituitary medially, internal carotid artery and abducens nerve within the sinus, and in the lateral wall from above downward the oculomotor, trochlear, ophthalmic and maxillary nerves, with the sphenoid sinus below.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cavernous sinus, coronal section</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">One side shown; the pituitary lies medial, the nerves in the lateral wall</text><path d="M300 160 L560 160 L560 330 L300 330 Z" fill="#EAF2F6" stroke="#071318" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="170.0" y="120.0" width="130.0" height="50.0" rx="14" fill="#F5DDA6" stroke="#071318" stroke-width="1.8"/><text x="235.0" y="150.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pituitary</text><circle cx="380.0" cy="255.0" r="22" fill="#B3382C" stroke="#071318" stroke-width="2"/><text x="380.0" y="260.0" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">ICA</text><circle cx="450.0" cy="285.0" r="9" fill="#E8C547" stroke="#071318" stroke-width="1.8"/><text x="470.0" y="289.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">CN VI</text><circle cx="535.0" cy="185.0" r="8" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="582.0" y="189.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">III oculomotor</text><circle cx="535.0" cy="212.0" r="8" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="582.0" y="216.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">IV trochlear</text><circle cx="535.0" cy="239.0" r="8" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="582.0" y="243.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">V1 ophthalmic</text><circle cx="535.0" cy="266.0" r="8" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="582.0" y="270.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">V2 maxillary</text><rect x="170.0" y="350.0" width="420.0" height="70.0" rx="12" fill="#D6EAF0" stroke="#071318" stroke-width="1.6"/><text x="380.0" y="390.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sphenoid sinus</text><line x1="535.0" y1="185.0" x2="535.0" y2="266.0" stroke="#3D5A54" stroke-width="1.2" stroke-linecap="round"/><text x="400.0" y="470.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lateral wall nerves are III, IV, V1, V2. Within the sinus: ICA (with sympathetic plexus) and VI.</text><text x="400.0" y="490.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Infection from the face (danger triangle) can spread here via the ophthalmic veins.</text></svg>