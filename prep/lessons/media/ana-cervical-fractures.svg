<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t d"><title id="t">Named cervical fractures</title><desc id="d">d</desc><rect width="800" height="380" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Named cervical fractures</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The spinal canal is wide at C2, so cord injury in hangman fracture is often absent</text><text x="119.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Fracture</text><text x="380.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Level and site</text><text x="661.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Mechanism</text><rect x="19.0" y="104.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="119.0" y="134.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Jefferson</text><line x1="222.0" y1="130.0" x2="245.6" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M252.0 130.0 L244.6 133.1 L244.6 126.9 Z" fill="#3D5A54"/><rect x="255.0" y="104.0" width="250.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="134.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">C1 ring, burst</text><line x1="508.0" y1="130.0" x2="531.6" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M538.0 130.0 L530.6 133.1 L530.6 126.9 Z" fill="#3D5A54"/><rect x="541.0" y="104.0" width="240.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="661.0" y="134.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Axial load on the head</text><rect x="19.0" y="168.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="119.0" y="190.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hangman (traumatic</text><text x="119.0" y="206.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">spondylolisthesis)</text><line x1="222.0" y1="194.0" x2="245.6" y2="194.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M252.0 194.0 L244.6 197.1 L244.6 190.9 Z" fill="#3D5A54"/><rect x="255.0" y="168.0" width="250.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="190.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">C2 pars interarticularis,</text><text x="380.0" y="206.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">bilateral</text><line x1="508.0" y1="194.0" x2="531.6" y2="194.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M538.0 194.0 L530.6 197.1 L530.6 190.9 Z" fill="#3D5A54"/><rect x="541.0" y="168.0" width="240.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="661.0" y="198.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hyperextension with distraction</text><rect x="19.0" y="232.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="119.0" y="262.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Odontoid</text><line x1="222.0" y1="258.0" x2="245.6" y2="258.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M252.0 258.0 L244.6 261.1 L244.6 254.9 Z" fill="#3D5A54"/><rect x="255.0" y="232.0" width="250.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="262.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Dens of C2 (types I to III)</text><line x1="508.0" y1="258.0" x2="531.6" y2="258.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M538.0 258.0 L530.6 261.1 L530.6 254.9 Z" fill="#3D5A54"/><rect x="541.0" y="232.0" width="240.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="661.0" y="262.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Flexion or extension injury</text><rect x="19.0" y="296.0" width="200.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="119.0" y="326.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Clay shoveler</text><line x1="222.0" y1="322.0" x2="245.6" y2="322.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M252.0 322.0 L244.6 325.1 L244.6 318.9 Z" fill="#3D5A54"/><rect x="255.0" y="296.0" width="250.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="326.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">C7 (or T1) spinous process</text><line x1="508.0" y1="322.0" x2="531.6" y2="322.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M538.0 322.0 L530.6 325.1 L530.6 318.9 Z" fill="#3D5A54"/><rect x="541.0" y="296.0" width="240.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="661.0" y="326.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Muscle avulsion in