<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Thoracic outlet and a cervical rib</title><desc id="d">Side view of the thoracic outlet: first rib below, scalenus anterior in front and scalenus medius behind, subclavian vein in front of scalenus anterior, subclavian artery and lower trunk in the gap between the scalenes; a cervical rib crowds this gap.</desc><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thoracic outlet and a cervical rib</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Side view, anterior to the left; interscalene gap above the first rib</text><path d="M120 360 C300 330 520 340 700 400" fill="none" stroke="#9A8F7A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><text x="690.0" y="428.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">First rib</text><path d="M280 120 L360 330 L330 335 L250 135 Z" fill="#E7B9B0" stroke="#071318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="256.0" y="112.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Scalenus anterior</text><path d="M470 120 L440 335 L400 335 L430 125 Z" fill="#E7B9B0" stroke="#071318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="476.0" y="112.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Scalenus medius</text><circle cx="240.0" cy="300.0" r="20" fill="#3E6FA5" stroke="#071318" stroke-width="1.8"/><text x="204.0" y="304.0" font-size="12.5" font-weight="600" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Subclavian vein</text><text x="204.0" y="320.0" font-size="11" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">(in front of scalenus anterior)</text><circle cx="385.0" cy="298.0" r="16" fill="#B3382C" stroke="#071318" stroke-width="1.8"/><text x="385.0" y="303.0" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">A</text><circle cx="418.0" cy="300.0" r="13" fill="#E8C547" stroke="#071318" stroke-width="1.8"/><text x="418.0" y="305.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">T1</text><line x1="385.0" y1="285.0" x2="520.0" y2="201.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="385.0" cy="285.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="525.0" y="205.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Subclavian artery</text><line x1="418.0" y1="290.0" x2="520.0" y2="234.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="418.0" cy="290.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="525.0" y="238.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Lower trunk (C8, T1)</text><path d="M330 270 C380 225 470 235 480 300" fill="none" stroke="#B7791F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 6"/><line x1="480.0" y1="292.0" x2="560.0" y2="316.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="480.0" cy="292.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="565.0" y="320.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">Cervical rib (extra, from C7)</text><text x="388.0" y="186.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">interscalene</text><text x="388.0" y="202.