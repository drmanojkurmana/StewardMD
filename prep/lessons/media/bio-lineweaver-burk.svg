<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Lineweaver-Burk double reciprocal enzyme plot</title><desc id="d">Lineweaver-Burk plot of 1/V versus 1/[S]. The uninhibited enzyme line crosses the Y-axis at 1/Vmax and X-axis at -1/Km. Competitive inhibition intersects at the same Y-axis point (unchanged Vmax) with an increased apparent Km. Non-competitive inhibition intersects at the same X-axis point (unchanged Km) with a depressed Vmax indicated by a higher Y-intercept.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lineweaver-Burk plot: Enzyme inhibition</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Double-reciprocal plot (1/V versus 1/[S]) defining Km and Vmax</text><line x1="120" y1="360" x2="660" y2="360" stroke="#071318" stroke-width="2"/><line x1="340" y1="380" x2="340" y2="120" stroke="#071318" stroke-width="2"/><line x1="160" y1="410" x2="520" y2="110" stroke="#0B6B5B" stroke-width="3.5"/><line x1="228" y1="410" x2="480" y2="110" stroke="#B7791F" stroke-width="3" stroke-dasharray="6 3"/><line x1="170" y1="410" x2="440" y2="100" stroke="#B42318" stroke-width="3"/><circle cx="340" cy="260" r="5" fill="#0B6B5B"/><text x="325" y="264" font-size="11.5" font-weight="700" text-anchor="end" fill="#0B6B5B" font-family="system-ui,sans-serif">1 / Vmax</text><circle cx="220" cy="360" r="4.5" fill="#0B6B5B"/><text x="210" y="380" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">−1 / Km</text><circle cx="270" cy="360" r="4.5" fill="#B7791F"/><text x="280" y="392" font-size="11" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">−1 / Km'</text><circle cx="340" cy="190" r="5" fill="#B42318"/><text x="325" y="194" font-size="11.5" font-weight="700" text-anchor="end" fill="#B42318" font-family="system-ui,sans-serif">1 / Vmax'</text><rect x="490" y="140" width="240" height="80" rx="6" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><text x="500" y="162" font-size="12.5" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Uninhibited Enzyme</text><text x="500" y="180" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Y-intercept = 1 / Vmax</text><text x="500" y="196" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• X-intercept = −1 / Km</text><text x="500" y="212" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">• Slope = Km / Vmax</text><rect x="490" y="230" width="240" height="75" rx="6" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.5"/><text x="500" y="250" font-size="12.5" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Competitive Inhibition</text><text x="500" y="268" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Same Y-intercept (Same Vmax)</text><text x="500" y="284" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• X-intercept moves right (Increased Km)</text><text x="500" y="298" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">• Overcome by adding more substrate</text><rect x="490" y="315" width="240" height="75" rx="6" fill="#FDF2F0" stroke="#B42318" stroke-width="1.5"/><text x="500" y="335" font-size="12.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Non-Competitive Inhibition</text><text x="500" y="353" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Same X-intercept (Same Km)</text><text x="500" y="369" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Higher Y-intercept (Decreased Vmax)</text><text x="500" y="383" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">• Binds allosteric site; cannot be overcome</text><text x="410" y="440" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1 / [Substrate] (1 / mM)</text><text x="290" y="140" font-size="13" font-weight="600" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">1 / Velocity</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Statins are competitive HMG-CoA reductase inhibitors (Km increases); non-competitive inhibitors lower Vmax without affecting Km.</text></svg>