<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Sampling methods</title><desc id="d">Five panels: simple random, systematic, stratified random and cluster sampling as probability methods, and convenience sampling as a non-probability method that cannot be generalised.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sampling methods</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Probability samples let you generalise; convenience samples do not</text><rect x="35" y="106" width="330" height="92" rx="14" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="200" y="138" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Simple random</text><text x="200" y="166" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">every member has an equal chance (random numbers)</text><text x="200" y="186" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">probability sample</text><rect x="435" y="106" width="330" height="92" rx="14" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="600" y="138" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Systematic</text><text x="600" y="166" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">every kth name from a list, random start</text><text x="600" y="186" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">probability sample</text><rect x="35" y="224" width="330" height="92" rx="14" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="200" y="256" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Stratified random</text><text x="200" y="284" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">sample within age / sex / site strata</text><text x="200" y="304" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">probability sample</text><rect x="435" y="224" width="330" height="92" rx="14" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="600" y="256" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cluster</text><text x="600" y="284" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">random clinics, then patients inside them</text><text x="600" y="304" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">probability sample</text><rect x="190" y="348" width="420" height="92" rx="14" fill="#EAF3F0" stroke="#B42318" stroke-width="2"/><text x="400" y="380" font-size="14.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Convenience (non-probability)</text><text x="400" y="408" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">whoever is at hand: quick, biased, not generalisable</text><text x="400" y="428" font-size="11" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">no sampling frame, no inference</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sample size follows the question: effect to detect, variability, α and power.</text></svg>
