<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Central cellular energy metabolism hub</title><desc id="d">Metabolic pathway map connecting cytoplasmic glycolysis to mitochondrial respiration. Glucose converts to pyruvate yielding 2 ATP and 2 NADH. Under aerobic conditions pyruvate dehydrogenase generates Acetyl-CoA. Acetyl-CoA fuels the Krebs citric acid cycle generating 3 NADH, 1 FADH2, and 1 GTP per turn, driving oxidative phosphorylation to yield approximately 30 to 32 ATP.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Central carbohydrate and energy metabolism</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cytoplasmic glycolysis, pyruvate dehydrogenase, and mitochondrial citric acid cycle</text><rect x="60" y="85" width="680" height="110" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.8"/><text x="80" y="108" font-size="13" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Cytoplasm: Glycolysis</text><rect x="80" y="125" width="100" height="36" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="130" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Glucose (6C)</text><line x1="180" y1="143" x2="250" y2="143" stroke="#0B6B5B" stroke-width="2" marker-end="url(#arr-teal)"/><rect x="250" y="125" width="130" height="36" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="315" y="148" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fructose-1,6-BP</text><text x="215" y="135" font-size="10" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">PFK-1 (Rate-limiting)</text><line x1="380" y1="143" x2="450" y2="143" stroke="#0B6B5B" stroke-width="2" marker-end="url(#arr-teal)"/><rect x="450" y="125" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="510" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2 × Pyruvate (3C)</text><text x="635" y="135" font-size="11" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Net Yield:</text><text x="635" y="152" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">2 ATP + 2 NADH</text><rect x="60" y="210" width="680" height="230" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="80" y="235" font-size="13" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Mitochondrial Matrix: Pyruvate Dehydrogenase &amp; TCA Cycle</text><line x1="510" y1="161" x2="510" y2="245" stroke="#0B6B5B" stroke-width="2.5" marker-end="url(#arr-teal)"/><text x="525" y="210" font-size="11" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">PDH Complex</text><text x="525" y="224" font-size="9.5" fill="#3D5A54" font-family="system-ui,sans-serif">(Requires B1, B2, B3, B5, Lipoic acid)</text><rect x="440" y="250" width="140" height="36" rx="4" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/><text x="510" y="273" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Acetyl-CoA (2C)</text><circle cx="280" cy="335" r="70" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2.5"/><text x="280" y="325" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Krebs Cycle</text><text x="280" y="342" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">(Citric Acid / TCA)</text><line x1="440" y1="270" x2="350" y2="300" stroke="#0B6B5B" stroke-width="2" marker-end="url(#arr-teal)"/><text x="390" y="318" font-size="10.5" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">+ Oxaloacetate (4C)</text><text x="280" y="280" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Citrate (6C)</text><text x="185" y="340" font-size="10" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">α-Ketoglutarate</text><text x="280" y="420" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Succinyl-CoA → Malate</text><rect x="440" y="315" width="260" height="95" rx="6" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="455" y="338" font-size="12" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">TCA Cycle Yield (per Acetyl-CoA):</text><text x="455" y="358" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• 3 NADH + 1 FADH₂</text><text x="455" y="374" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• 1 GTP (= 1 ATP)</text><text x="455" y="392" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Total per Glucose: ~30 to 32 ATP</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Thiamine (B1) deficiency impairs pyruvate dehydrogenase, causing pyruvate accumulation and lactic acidosis in beriberi.</text></svg>