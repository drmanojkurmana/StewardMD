<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Vaughan Williams classes I to IV</title><desc id="d">Four antiarrhythmic classes by dominant ion channel action: class I blocks sodium (procainamide, lidocaine, flecainide); class II blocks beta receptors (metoprolol, esmolol); class III blocks potassium and lengthens repolarisation (amiodarone, sotalol, with torsades risk); class IV blocks calcium (verapamil, diltiazem). Unclassified essentials are adenosine, digoxin and magnesium. Every class can provoke arrhythmia and class Ic is barred after infarction.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Vaughan Williams classes I to IV</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Grouped by dominant ion channel action</text><rect x="36.0" y="108.0" width="170.0" height="238.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="121.0" y="138.0" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Class I</text><text x="121.0" y="160.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Na+ channel block</text><text x="121.0" y="192.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">procainamide (Ia)</text><text x="121.0" y="218.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">lidocaine (Ib)</text><text x="121.0" y="244.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">flecainide (Ic)</text><text x="121.0" y="270.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ic barred after MI</text><rect x="222.0" y="108.0" width="170.0" height="238.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="307.0" y="138.0" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Class II</text><text x="307.0" y="160.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Beta block</text><text x="307.0" y="192.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">metoprolol</text><text x="307.0" y="218.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">esmolol IV</text><text x="307.0" y="244.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">slows AV node</text><text x="307.0" y="270.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">rate control</text><rect x="408.0" y="108.0" width="170.0" height="238.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="493.0" y="138.0" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Class III</text><text x="493.0" y="160.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">K+ block</text><text x="493.0" y="192.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">amiodarone</text><text x="493.0" y="218.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">sotalol</text><text x="493.0" y="244.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">longer QT</text><text x="493.0" y="270.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">torsades risk</text><rect x="594.0" y="108.0" width="170.0" height="238.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="679.0" y="138.0" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Class IV</text><text x="679.0" y="160.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Ca2+ block</text><text x="679.0" y="192.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">verapamil</text><text x="679.0" y="218.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">diltiazem</text><text x="679.0" y="244.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">slows AV node</text><text x="679.0" y="270.0" font-size="12" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">not with beta block</text><rect x="130.0" y="362.0" width="540.0" height="62.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="397.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Unclassified essentials: adenosine, digoxin, magnesium</text><text x="400.0" y="452.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Every class can provoke arrhythmia (proarrhythmia); CAST barred class Ic in structural disease.</text><text x="400.0" y="492.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Narrow indications, ECG and electrolyte review before every start.</text></svg>