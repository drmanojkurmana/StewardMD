<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d"><title id="t">Bursae around the knee</title><desc id="d">Table of knee bursitis names: housemaid knee is the prepatellar bursa, clergyman knee is the infrapatellar bursa, Baker cyst is the semimembranosus gastrocnemius bursa communicating with the joint.</desc><rect width="800" height="330" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bursae around the knee</text><text x="114.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Name</text><text x="355.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Bursa</text><text x="641.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cause or note</text><rect x="19.0" y="100.0" width="190.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="114.0" y="132.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Housemaid&#x27;s knee</text><line x1="212.0" y1="128.0" x2="235.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M242.0 128.0 L234.6 131.1 L234.6 124.9 Z" fill="#3D5A54"/><rect x="245.0" y="100.0" width="220.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="355.0" y="132.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prepatellar</text><line x1="468.0" y1="128.0" x2="491.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M498.0 128.0 L490.6 131.1 L490.6 124.9 Z" fill="#3D5A54"/><rect x="501.0" y="100.0" width="280.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="641.0" y="124.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prolonged kneeling, swelling in front</text><text x="641.0" y="140.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">of the patella</text><rect x="19.0" y="170.0" width="190.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="114.0" y="202.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Clergyman&#x27;s knee</text><line x1="212.0" y1="198.0" x2="235.6" y2="198.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M242.0 198.0 L234.6 201.1 L234.6 194.9 Z" fill="#3D5A54"/><rect x="245.0" y="170.0" width="220.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="355.0" y="202.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Infrapatellar (deep)</text><line x1="468.0" y1="198.0" x2="491.6" y2="198.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M498.0 198.0 L490.6 201.1 L490.6 194.9 Z" fill="#3D5A54"/><rect x="501.0" y="170.0" width="280.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="641.0" y="194.8" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Kneeling upright, swelling below the</text><text x="641.0" y="210.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">patella</text><rect x="19.0" y="240.0" width="190.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="114.0" y="272.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Baker&#x27;s cyst</text><line x1="212.0" y1="268.0" x2="235.6" y2="268.0" stroke="#3D5A54" stroke-widt