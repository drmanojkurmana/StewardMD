<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d"><title id="t">White cell differential</title><desc id="d">Table of white cell types with typical share and role: neutrophils about 60 percent for first response, lymphocytes about 30 percent adaptive immunity, monocytes becoming macrophages, eosinophils for parasites and allergy, basophils with histamine and heparin.</desc><rect width="800" height="390" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">White cell differential</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Never Let Monkeys Eat Bananas</text><text x="94.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cell</text><text x="290.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Typical share</text><text x="596.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Role</text><rect x="19.0" y="100.0" width="150.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="94.0" y="126.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Neutrophil</text><line x1="172.0" y1="122.0" x2="195.6" y2="122.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M202.0 122.0 L194.6 125.1 L194.6 118.9 Z" fill="#3D5A54"/><rect x="205.0" y="100.0" width="170.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="290.0" y="126.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">40 to 70 percent</text><line x1="378.0" y1="122.0" x2="401.6" y2="122.0" stroke="#3D5A54" stroke-