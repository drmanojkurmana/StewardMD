<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Popliteal fossa: boundaries and contents</title><desc id="d">Diamond-shaped popliteal fossa: biceps femoris upper lateral, semimembranosus and semitendinosus upper medial, lateral and medial heads of gastrocnemius lower, with contents from superficial to deep tibial nerve, popliteal vein, popliteal artery.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Popliteal fossa: boundaries and contents</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Posterior view of the right knee</text><path d="M400 100 L560 250 L400 400 L240 250 Z" fill="#F4FAF8" stroke="#071318" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="235.0" y="160.0" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Biceps femoris</text><text x="235.0" y="177.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">(upper lateral)</text><text x="565.0" y="160.0" font-size="13" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Semimembranosus and</text><text x="565.0" y="177.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">semitendinosus (upper medial)</text><text x="235.0" y="365.0" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Lateral head of</text><text x="235.0" y="382.0" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">gastrocnemius</text><text x="565.0" y="365.0" font-size="13" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Medial head of</text><text x="565.0" y="382.0" font-size="13" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">gastrocnemius</text><circle cx="400.0" cy="215.0" r="16" fill="#E8C547" stroke="#071318" stroke-width="1.8"/><circle cx="400.0" cy="255.0" r="13" fill="#3E6FA5" stroke="#071318" stroke-width="1.8"/><circle cx="400.0" cy="292.0" r="11" fill="#B3382C" stroke="#071318" stroke-width="1.8"/><line x1="416.0" y1="215.0" x2="580.0" y2="245.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="584.0" y="249.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Tibial nerve (superficial)</text><line x1="413.0" y1="255.0" x2="580.0" y2="270.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="584.0" y="274.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Popliteal vein</text><line x1="411.0" y1="292.0" x2="580.0" y2="295.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="584.0" y="299.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Popliteal artery (deepest)</text><text x="400.0" y="450.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Common peroneal nerve runs along the medial edge of biceps femoris.</text><text x="400.0" y="472.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Roof: popliteal fascia. Floor: popliteal surface of femur, capsule, popliteus.</text></svg>