<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Supination and pronation</title><desc id="d">Two views of the left forearm. In supination radius and ulna lie parallel with the radius lateral; in pronation the radius crosses over the ulna, pivoting about an axis from the radial head to the ulnar head.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Supination and pronation</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Left forearm, front view; the radius rotates round the ulna</text><text x="200.0" y="96.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Supinated</text><line x1="200.0" y1="130.0" x2="200.0" y2="360.0" stroke="#7A8FB5" stroke-width="10" stroke-linecap="round"/><circle cx="200.0" cy="365.0" r="9" fill="#7A8FB5" stroke="#071318" stroke-width="1.5"/><line x1="234.0" y1="135.0" x2="240.0" y2="355.0" stroke="#B7791F" stroke-width="9" stroke-linecap="round"/><circle cx="234.0" cy="132.0" r="11" fill="#B7791F" stroke="#071318" stroke-width="1.5"/><line x1="234.0" y1="132.0" x2="200.0" y2="365.0" stroke="#3D5A54" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="182.0" y="140.0" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Ulna</text><text x="252.0" y="132.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Radius</text><text x="580.0" y="96.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Pronated</text><line x1="580.0" y1="130.0" x2="580.0" y2="360.0" stroke="#7A8FB5" stroke-width="10" stroke-linecap="round"/><circle cx="580.0" cy="365.0" r="9" fill="#7A8FB5" stroke="#071318" stroke-width="1.5"/><line x1="614.0" y1="135.0" x2="552.0" y2="355.0" stroke="#B7791F" stroke-width="9" stroke-linecap="round"/><circle cx="614.0" cy="132.0" r="11" fill="#B7791F" stroke="#071318" stroke-width="1.5"/><line x1="614.0" y1="132.0" x2="580.0" y2="365.0" stroke="#3D5A54" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="562.0" y="140.0" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Ulna</text><text x="632.0" y="132.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Radius</text><text x="200.0" y="410.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Supinators: supinator, biceps brachii</text><text x="580.0" y="410.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pronators: pronator teres, pronator quadratus</text><text x="400.0" y="460.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Dashed line: axis through the radial head and the ulnar head.</text><text x="400.0" y="480.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The middle radioulnar joint is a fibrous interosseous membrane and does not rotate.</text></svg>