<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Leukocyte extravasation sequence in acute inflammation</title><desc id="d">Stepwise cascade of neutrophil recruitment from vascular lumen into inflamed interstitial tissue: 1. Margination and rolling mediated by endothelial E-selectin and P-selectin; 2. Activation and firm adhesion via neutrophil integrins LFA-1 and Mac-1 binding ICAM-1; 3. Diapedesis and transmigration through junctions mediated by PECAM-1 CD31; 4. Chemotaxis along gradient toward C5a, LTB4, IL-8, and bacterial peptides.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Leukocyte extravasation cascade</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Four sequential steps: Margination, Rolling, Firm Adhesion, and Diapedesis</text><rect x="60" y="90" width="680" height="150" fill="#FDF5F4" stroke="#E8A09A" stroke-width="1.5"/><text x="75" y="115" font-size="12" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Vascular Lumen (Blood flow →)</text><rect x="60" y="240" width="680" height="30" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="75" y="260" font-size="11" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Endothelial Monolayer</text><rect x="60" y="270" width="680" height="160" fill="#FAFBFB" stroke="#D0E2DB" stroke-width="1.5"/><text x="75" y="295" font-size="12" font-weight="700" fill="#3D5A54" font-family="system-ui,sans-serif">Extravascular Interstitial Tissue</text><circle cx="140" cy="170" r="28" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2.5"/><text x="140" y="174" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PMN</text><text x="140" y="222" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1. Margination</text><text x="140" y="325" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Stasis pushes</text><text x="140" y="340" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">cells to periphery</text><circle cx="300" cy="190" r="28" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><text x="300" y="194" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PMN</text><text x="300" y="232" font-size="11" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">2. Rolling</text><text x="300" y="325" font-size="11" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Selectins</text><text x="300" y="342" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">E- &amp; P-selectin bind</text><text x="300" y="356" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sialyl-Lewis X</text><circle cx="470" cy="225" r="28" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="3"/><text x="470" y="229" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PMN</text><text x="470" y="270" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">3. Adhesion</text><text x="470" y="325" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Integrins</text><text x="470" y="342" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">LFA-1, Mac-1 bind</text><text x="470" y="356" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">ICAM-1 &amp; VCAM-1</text><ellipse cx="640" cy="265" rx="20" ry="32" fill="#FFFFFF" stroke="#B42318" stroke-width="2.5"/><text x="640" y="269" font-size="9" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PMN</text><text x="640" y="318" font-size="11" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">4. Diapedesis</text><text x="640" y="340" font-size="11" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">PECAM-1 (CD31)</text><text x="640" y="356" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Transmigration to</text><text x="640" y="370" font-size="10" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">C5a, LTB4, IL-8</text><line x1="170" y1="170" x2="260" y2="185" stroke="#071318" stroke-width="1.5" marker-end="url(#arr-bl)"/> <line x1="335" y1="195" x2="430" y2="215" stroke="#071318" stroke-width="1.5" marker-end="url(#arr-bl)"/> <line x1="505" y1="225" x2="605" y2="255" stroke="#071318" stroke-width="1.5" marker-end="url(#arr-bl)"/><defs><marker id="arr-bl" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#071318"/></marker></defs><text x="400" y="465" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Chemotactic gradient: C5a · Leukotriene B4 (LTB4) · Interleukin-8 (IL-8) · Bacterial N-formyl peptides</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Defective integrin CD18 causes Leukocyte Adhesion Deficiency type 1 (LAD-1) with delayed umbilical cord separation.</text></svg>