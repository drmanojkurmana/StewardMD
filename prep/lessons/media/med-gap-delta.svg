<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Acidosis: let the gap sort it</title><desc id="d">Normal gap means RTA, diarrhoea, saline or ureteral diversion; high gap means renal failure, lactic, DKA or toxic ingestion; urine gap positive points to kidney, negative to gut.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Acidosis: let the gap sort it</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Urine gap points to kidney or gut</text><rect x="30.0" y="80.0" width="355.0" height="170.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="207.5" y="161.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">NORMAL gap: RTA, diarrhoea, saline infusion,</text><text x="207.5" y="176.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ureteral diversion</text><rect x="415.0" y="80.0" width="355.0" height="170.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="592.5" y="161.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HIGH gap: renal failure, lactic, DKA, toxic</text><text x="592.5" y="176.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ingestion</text><rect x="120.0" y="280.0" width="280.0" height="90.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="260.0" y="329.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Urine gap POSITIVE: kidney (RTA)</text><rect x="420.0" y="280.0" width="280.0" height="90.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="560.0" y="329.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Urine gap NEGATIVE: gut (diarrhoea)</text><text x="400.0" y="410.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Delta gap and delta ratio unmask mixed disorders.</text><text x="400.0" y="432.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Type 1 distal: urine pH above 5.5. Type 4: aldosterone low, potassium high.</text></svg>