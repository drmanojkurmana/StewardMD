<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Why alveoli need surfactant</title><desc id="d">Two connected alveoli of different size: by the law of Laplace pressure equals two times surface tension divided by radius, so without surfactant the small alveolus has higher pressure and would empty into the large one; surfactant lowers tension more in the small alveolus and equalises pressure.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Why alveoli need surfactant</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Law of Laplace: P = 2T / r</text><text x="200.0" y="100.0" font-size="15" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Without surfactant</text><circle cx="145.0" cy="230.0" r="38" fill="#F4FAF8" stroke="#071318" stroke-width="2.4"/><circle cx="250.0" cy="220.0" r="70" fill="#F4FAF8" stroke="#071318" stroke-width="2.4"/><rect x="180.0" y="224.0" width="8.0" height="12.0" rx="0" fill="#F4FAF8" stroke="none" stroke-width="0"/><text x="145.0" y="235.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">small</text><text x="250.0" y="225.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">large</text><text x="600.0" y="100.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">With surfactant</text><circle cx="545.0" cy="230.0" r="38" fill="#F4FAF8" stroke="#071318" stroke-width="2.4"/><circle cx="650.0" cy="220.0" r="70" fill="#F4FAF8" stroke="#071318" stroke-width="2.4"/><rect x="580.0" y="224.0" width="8.0" height="12.0" rx="0" fill="#F4FAF8" stroke="none" stroke-width="0"/><text x="545.0" y="235.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">small</text><text x="650.0" y="225.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">large</text><text x="200.0" y="345.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Small alveolus: higher pressure</text><line x1="165.0" y1="360.0" x2="235.4" y2="360.0" stroke="#B3382C" stroke-width="3.5" stroke-linecap="round"/><path d="M245.0 360.0 L233.9 364.7 L233.9 355.3 Z" fill="#B3382C"/><text x="200.0" y="385.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">air flows small to large: collapse (atelectasis)</text><text x="600.0" y="345.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Surfactant lowers T more as r shrinks</text><text x="600.0" y="365.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">pressures equalise: alveoli stay open</text><text x="400.0" y="440.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Surfactant: dipalmitoylphosphatidylcholine from type II pneumocytes.</text><text x="400.0" y="462.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Absent in prematurity: respiratory distress syndrome; antenatal steroids speed its production.</text></svg>