<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Hepatitis B serology over time</title><desc id="d">Marker levels against months since exposure in resolving acute infection: HBeAg is high early and clears by month 4; HBsAg rises in month 1, stays high, then clears near month 5; anti-HBc IgM spikes early and is the lone marker in the window period shaded near month 5; anti-HBs appears after month 5 and persists as immunity. HBsAg past 6 months means chronic infection; chronicity is about 90 percent in neonates and 5 percent in adults.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hepatitis B serology over time</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Resolving acute infection; marker levels are schematic</text><line x1="90.0" y1="400.0" x2="90.0" y2="406.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="90.0" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><line x1="171.2" y1="400.0" x2="171.2" y2="406.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="171.2" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1</text><line x1="252.5" y1="400.0" x2="252.5" y2="406.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="252.5" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2</text><line x1="333.8" y1="400.0" x2="333.8" y2="406.0" stroke="#071318" stroke-width="1.4" stroke-linecap="round"/><text x="333.8" y="422.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">3</text>