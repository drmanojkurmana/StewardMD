<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Heart block: four rhythms, four answers</title><desc id="d">First degree only lengthens PR past 200 ms and is observed. Mobitz I drops a beat after lengthening PR and is usually benign. Mobitz II drops without warning and needs pacing. Third degree dissociates atria from ventricles and is paced now.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Heart block: four rhythms, four answers</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lengthening warns, sudden drops pace, dissociation paces now</text><text x="30.0" y="114.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">1st degree: observe</text><line x1="190.0" y1="108.0" x2="570.0" y2="108.0" stroke="#9DB5AE" stroke-width="1.2" stroke-linecap="round"/><path d="M210.0 108.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.0 108.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M274.0 108.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M298.0 108.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M338.0 108.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M362.0 108.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M402.0 108.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M426.0 108.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="590.0" y="86.0" width="180.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="680.0" y="109.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PR over 200 ms, every P</text><text x="680.0" y="123.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">followed: observe</text><text x="30.0" y="190.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Mobitz I: watch</text><line x1="190.0" y1="184.0" x2="570.0" y2="184.0" stroke="#9DB5AE" stroke-width="1.2" stroke-linecap="round"/><path d="M210.0 184.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.0 184.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M274.0 184.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M298.0 184.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M338.0 184.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M362.0 184.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M386.0 184.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="590.0" y="162.0" width="180.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="680.0" y="185.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PR grows then a beat</text><text x="680.0" y="199.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">drops: usually benign</text><text x="30.0" y="266.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#B42318" font-family="system-ui,sans-serif">Mobitz II: pace</text><line x1="190.0" y1="260.0" x2="570.0" y2="260.0" stroke="#9DB5AE" stroke-width="1.2" stroke-linecap="round"/><path d="M210.0 260.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M234.0 260.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M274.0 260.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M298.0 260.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M338.0 260.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M362.0 260.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M386.0 260.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="590.0" y="238.0" width="180.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="680.0" y="261.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fixed PR, sudden drops:</text><text x="680.0" y="275.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pace (His below)</text><text x="30.0" y="342.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#B42318" font-family="system-ui,sans-serif">3rd degree: pace now</text><line x1="190.0" y1="336.0" x2="570.0" y2="336.0" stroke="#9DB5AE" stroke-width="1.2" stroke-linecap="round"/><path d="M210.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M244.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M278.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M312.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M346.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M380.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M414.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M448.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M482.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M516.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M550.0 336.0 q6 -14 12 0" fill="none" stroke="#0B6B5B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M220.0 336.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M282.0 336.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M344.0 336.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M406.0 336.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M468.0 336.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M530.0 336.0 l6 22 l6 -44 l6 22" fill="none" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="590.0" y="314.0" width="180.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="680.0" y="337.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">P and QRS march apart:</text><text x="680.0" y="351.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pace now</text><text x="400.0" y="436.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Atropine bridges a symptomatic bradycardia to the pacing wire.</text><text x="400.0" y="456.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Green bumps are P waves; black spikes are QRS complexes.</text></svg>