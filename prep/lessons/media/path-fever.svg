<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Fever pathway: pyrogenic cytokines raise the hypothalamic set point via PGE2</title> <desc id="d">Flow from pyrogenic cytokines interleukin-1, tumour necrosis factor and interleukin-6 to the hypothalamus, then prostaglandin E2, then a raised thermoregulatory set point and fever. IL-1 and TNF are the most important pyrogens; IL-18 is not pyrogenic.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fever: cytokines reset the thermostat via PGE2</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Pyrogenic cytokines act on the hypothalamus; prostaglandin E2 raises the set point</text> <rect x="40" y="110" width="200" height="70" rx="12" fill="#071318"/> <text x="140" y="136" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">IL-1 + TNF</text> <text x="140" y="158" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">most important pyrogens</text> <rect x="260" y="110" width="140" height="70" rx="12" fill="#3D5A54"/> <text x="330" y="136" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">IL-6</text> <text x="330" y="158" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">also pyrogenic</text> <line x1="140" y1="180" x2="140" y2="230" stroke="#0B6B5B" stroke-width="3"/> <polygon points="132,230 148,230 140,244" fill="#0B6B5B"/> <line x1="330" y1="180" x2="330" y2="230" stroke="#0B6B5B" stroke-width="3"/> <polygon points="322,230 338,230 330,244" fill="#0B6B5B"/> <rect x="180" y="244" width="280" height="70" rx="12" fill="#0B6B5B"/> <text x="320" y="270" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Hypothalamus</text> <text x="320" y="292" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">thermoregulatory centre</text> <line x1="320" y1="314" x2="320" y2="350" stroke="#0B6B5B" stroke-width="3"/> <polygon points="312,350 328,350 320,364" fill="#0B6B5B"/> <text x="336" y="344" font-size="11" font-weight="600" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">makes PGE2</text> <rect x="180" y="364" width="280" height="70" rx="12" fill="#B7791F"/> <text x="320" y="390" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Set point raised</text> <text x="320" y="412" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">body heats to match: fever</text> <rect x="500" y="110" width="260" height="120" rx="12" fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="7 5"/> <text x="630" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Exam traps</text> <text x="630" y="160" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">IL-18 is NOT pyrogenic</text> <text x="630" y="184" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prostaglandins are NOT</text> <text x="630" y="206" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">cytokines</text> <rect x="500" y="244" width="260" height="190" rx="12" fill="#071318"/> <text x="630" y="270" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Why antipyretics work</text> <text x="630" y="296" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">NSAIDs and paracetamol</text> <text x="630" y="318" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">block prostaglandin</text> <text x="630" y="340" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">synthesis, so PGE2</text> <text x="630" y="362" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">falls and the set</text> <text x="630" y="384" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">point resets down</text> <text x="630" y="410" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">sweating follows</text> <text x="400" y="480" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Read top to bottom: cytokines in, hypothalamus, PGE2, higher set point, fever out.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fever is a regulated rise, not failed cooling: the body defends the new set point.</text> </svg>
