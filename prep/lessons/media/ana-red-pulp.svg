<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 498" role="img" aria-labelledby="t d"><title id="t">Red pulp: the spleen&#x27;s red cell filter</title><desc id="d">Flow diagram of red pulp filtration: arterioles open into the cords of Billroth where macrophages inspect red cells, which squeeze through slits in the sinusoid wall to reach the splenic vein; rigid abnormal cells are trapped and destroyed.</desc><rect width="800" height="498" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Red pulp: the spleen&#x27;s red cell filter</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">White pulp: PALS (T cells), follicles (B cells), marginal zone</text><rect x="255.0" y="96.0" width="290.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Penicillar arterioles</text><text x="400.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(open-ended)</text><rect x="255.0" y="188.0" width="290.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="212.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cords of Billroth:</text><text x="400.0" y="228.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">macrophages inspect red cells</text><rect x="98.0" y="280.0" width="290.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="243.0" y="304.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal cells squeeze through</text><text x="243.0" y="320.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">slits into the sinusoids</text><rect x="412.0" y="280.0" width="290.0" height="56.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="557.0" y="304.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Rigid or abnormal cells</text><text x="557.0" y="320.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">trapped, phagocytosed</text><rect x="255.0" y="372.0" width="290.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="404.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Splenic vein</text><line x1="400.0" y1="152.0" x2="400.0" y2="180.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 188.0 L396.5 179.7 L403.5 179.7 Z" fill="#3D5A54"/><line x1="400.0" y1="244.0" x2="250.0" y2="278.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M243.0 280.0 L250.3 274.7 L251.9 281.6 Z" fill="#3D5A54"/><line x1="400.0" y1="244.0" x2="550.0" y2="278.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M557.0 280.0 L548.1 281.6 L549.7 274.7 Z" fill="#3D5A54"/><line x1="243.0" y1="336.0" x2="393.0" y2="370.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 372.0 L391.1 373.6 L392.7 366.7 Z" fill="#3D5A54"/><text x="400.0" y="480.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Hereditary spherocytosis: spherocytes are trapped in the cords, causing splenomegaly.</text></svg>