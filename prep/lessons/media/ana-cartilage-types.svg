<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Three types of cartilage</title><desc id="d">Three cartilage types shown as microscopic motifs: hyaline with paired chondrocytes in clear matrix, elastic with a dense network of elastic fibres, fibrocartilage with parallel collagen bundles and rows of cells, with sites and perichondrium status listed.</desc><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Three types of cartilage</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cartilage has no blood vessels: chondrocytes are nourished by diffusion</text><rect x="28.0" y="80.0" width="230.0" height="130.0" rx="6" fill="#EAF2F6" stroke="#9DB5AE" stroke-width="1.2"/><ellipse cx="68.0" cy="119.0" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="80.0" cy="119.0" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="148.5" cy="164.5" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="160.5" cy="164.5" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="206.0" cy="112.5" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="218.0" cy="112.5" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="102.5" cy="171.0" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="114.5" cy="171.0" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="194.5" cy="177.5" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><ellipse cx="206.5" cy="177.5" rx="6" ry="8" fill="#9FB6C9" stroke="#5C7D95" stroke-width="1.2"/><text x="143.0" y="238.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Hyaline</text><text x="143.0" y="258.0" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Type II collagen</text><text x="143.0" y="286.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Articular surfaces, costal, nasal,</text><text x="143.0" y="300.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">trachea, epiphyseal plate</text><text x="143.0" y="336.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Perichondrium: yes</text><text x="143.0" y="350.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(not on articular surface)</text><rect x="286.0" y="80.0" width="230.0" height="130.0" rx="6" fill="#EAF2F6" stroke="#9DB5AE" stroke-width="1.2"/><path d="M292 92 C355 80 424 104 510 92" fill="none" stroke="#5B3A29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 110 C355 98 424 122 510 110" fill="none" stroke="#5B3A29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 127 C355 115 424 139 510 127" fill="none" stroke="#5B3A29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 145 C355 133 424 157 510 145" fill="none" stroke="#5B3A29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 163 C355 151 424 175 510 163" fill="none" stroke="#5B3A29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 180 C355 168 424 192 510 180" fill="none" stroke="#5B3A29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 198 C355 186 424 210 510 198" fill="none" stroke="#5B3A29" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="343.5" cy="119.0" rx="7" ry="9" fill="#EAF2F6" stroke="#5C7D95" stroke-width="1.4"/><ellipse cx="435.5" cy="145.0" rx="7" ry="9" fill="#EAF2F6" stroke="#5C7D95" stroke-width="1.4"/><ellipse cx="378.0" cy="181.4" rx="7" ry="9" fill="#EAF2F6" stroke="#5C7D95" stroke-width="1.4"/><text x="401.0" y="238.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Elastic</text><text x="401.0" y="258.0" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Type II collagen + elastin</text><text x="401.0" y="286.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">External ear, epiglottis,</text><text x="401.0" y="300.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Eustachian tube</text><text x="401.0" y="336.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Perichondrium: yes</text><rect x="544.0" y="80.0" width="230.0" height="130.0" rx="6" fill="#F5EFE3" stroke="#9DB5AE" stroke-width="1.2"/><line x1="550.0" y1="92.0" x2="768.0" y2="92.0" stroke="#A58B64" stroke-width="2" stroke-linecap="round"/><line x1="550.0" y1="109.7" x2="768.0" y2="109.7" stroke="#A58B64" stroke-width="2" stroke-linecap="round"/><line x1="550.0" y1="127.3" x2="768.0" y2="127.3" stroke="#A58B64" stroke-width="2" stroke-linecap="round"/><line x1="550.0" y1="145.0" x2="768.0" y2="145.0" stroke="#A58B64" stroke-width="2" stroke-linecap="round"/><line x1="550.0" y1="162.7" x2="768.0" y2="162.7" stroke="#A58B64" stroke-width="2" stroke-linecap="round"/><line x1="550.0" y1="180.3" x2="768.0" y2="180.3" stroke="#A58B64" stroke-width="2" stroke-linecap="round"/><line x1="550.0" y1="198.0" x2="768.0" y2="198.0" stroke="#A58B64" stroke-width="2" stroke-linecap="round"/><ellipse cx="590.0" cy="116.4" rx="8" ry="5" fill="#FFFFFF" stroke="#5C7D95" stroke-width="1.4"/><ellipse cx="659.0" cy="147.6" rx="8" ry="5" fill="#FFFFFF" stroke="#5C7D95" stroke-width="1.4"/><ellipse cx="723.4" cy="176.2" rx="8" ry="5" fill="#FFFFFF" stroke="#5C7D95" stroke-width="1.4"/><ellipse cx="613.0" cy="184.0" rx="8" ry="5" fill="#FFFFFF" stroke="#5C7D95" stroke-width="1.4"/><text x="659.0" y="238.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Fibrocartilage</text><text x="659.0" y="258.0" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Type I collagen</text><text x="659.0" y="286.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Intervertebral disc, pubic symphysis,</text><text x="659.0" y="300.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">menisci</text><text x="659.0" y="336.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Perichondrium: none</text><text x="400.0" y="440.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fibrocartilage is the only type with no perichondrium and with type I collagen.</text></svg>