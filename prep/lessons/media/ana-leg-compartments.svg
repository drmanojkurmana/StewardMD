<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d"><title id="t">Compartments of the leg</title><desc id="d">Cross-section of the leg with tibia and fibula and four compartments: anterior (dorsiflexion, deep peroneal nerve), lateral (eversion, superficial peroneal nerve), superficial posterior (plantar flexion, tibial nerve), deep posterior (inversion and toe flexion, tibial nerve).</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Compartments of the leg</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cross-section through the mid leg: front at the top</text><circle cx="400.0" cy="285.0" r="150" fill="#F4FAF8" stroke="#071318" stroke-width="2.4"/><ellipse cx="360.0" cy="255.0" rx="30" ry="22" fill="#E6DCC8" stroke="#071318" stroke-width="2"/><text x="360.0" y="259.0" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tibia</text><ellipse cx="495.0" cy="290.0" rx="13" ry="13" fill="#E6DCC8" stroke="#071318" stroke-width="2"/><text x="512.0" y="323.0" font-size="11" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Fibula</text><line x1="388.0" y1="267.0" x2="484.0" y2="287.0" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><line x1="508.0" y1="280.0" x2="470.0" y2="153.0" stroke="#3D5A54" stroke-width="1.6" stroke-linecap="round"/><line x1="508.0" y1="297.0" x2="440.0" y2="429.0" stroke="#3D5A54" stroke-width="1.6" stroke-linecap="round"/><text x="380.0" y="205.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">ANTERIOR</text><text x="500.0" y="205.0" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">LATERAL</text><text x="395.0" y="335.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">DEEP POSTERIOR</text><text x="395.0" y="385.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">SUPERFICIAL POSTERIOR</text><text x="60.0" y="120.0" font-size="14" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Anterior</text><text x="60.0" y="142.0" font-size="12" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Dorsiflexion</text><text x="60.0" y="160.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Deep peroneal nerve</text><text x="620.0" y="120.0" font-size="14" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Lateral</text><text x="620.0" y="142.0" font-size="12" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Eversion</text><text x="620.0" y="160.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Superficial peroneal n.</text><text x="60.0" y="430.0" font-size="14" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Deep posterior</text><text x="60.0" y="452.0" font-size="12" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Inversion, toe flexion</text><text x="60.0" y="470.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Tibial nerve</text><text x="560.0" y="430.0" font-size="14" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Superficial posterior</text><text x="560.0" y="452.0" font-size="12" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Plantar flexion (calf)</text><text x="560.0" y="470.0" font-size="12" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Tibial nerve</text></svg>