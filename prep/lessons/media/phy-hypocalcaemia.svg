<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d"><title id="t">Hypocalcaemia</title><desc id="d">d</desc><rect width="800" height="400" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypocalcaemia</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Neuromuscular excitability rises: perioral tingling, tetany, seizures, long QT</text><text x="157.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cause or sign</text><text x="538.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Detail</text><rect x="37.0" y="100.0" width="240.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="157.0" y="127.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypoparathyroidism</text><line x1="280.0" y1="123.0" x2="303.6" y2="123.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M310.0 123.0 L302.6 126.1 L302.6 119.9 Z" fill="#3D5A54"/><rect x="313.0" y="100.0" width="450.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="538.0" y="127.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Often after thyroid or parathyroid surgery</text><rect x="37.0" y="156.0" width="240.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="157.0" y="183.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">DiGeorge syndrome (22q11)</text><line x1="280.0" y1="179.0" x2="303.6" y2="179.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M310.0 179.0 L302.6 182.1 L302.6 175.9 Z" fill="#3D5A54"/><rect x="313.0" y="156.0" width="450.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="538.0" y="183.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Absent parathyroids with cardiac defects and facial changes</text><rect x="37.0" y="212.0" width="240.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="157.0" y="239.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pseudohypoparathyroidism</text><line x1="280.0" y1="235.0" x2="303.6" y2="235.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M310.0 235.0 L302.6 238.1 L302.6 231.9 Z" fill="#3D5A54"/><rect x="313.0" y="212.0" width="450.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="538.0" y="239.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">PTH resistance: short fourth metacarpal (Albright)</text><rect x="37.0" y="268.0" width="240.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="157.0" y="295.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Chvostek sign</text><line x1="280.0" y1="291.0" x2="303.6" y2="291.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M310.0 291.0 L302.6 294.1 L302.6 287.9 Z" fill="#3D5A54"/><rect x="313.0" y="268.0" width="450.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="538.0" y="295.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tap over facial nerve: facial twitching</text><rect x="37.0" y="324.0" width="240.0" height="46.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="157.0" y="351.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Trousseau sign</text><line x1="280.0" y1="347.0" x2="303.6" y2="347.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M310.0 347.0 L302.6 350.1 L302.6 343.9 Z" fill="#3D5A54"/><rect x="313.0" y="324.0" width="450.0" height="46.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="538.0" y="351.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Blood pressure cuff inflated: carpal spasm</text></svg>