<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">TB: 2 months of four, 4 months of two</title><desc id="d">Daily 2HRZE then 4HR under DOTS: steroids for meningeal or pericardial disease, bedaquiline with delamanid for MDR, timed ART with IRIS watch for HIV.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">TB: 2 months of four, 4 months of two</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Daily DOTS to the finish</text><rect x="60.0" y="90.0" width="320.0" height="90.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="220.0" y="139.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Intensive: 2HRZE daily</text><line x1="380.0" y1="135.0" x2="412.8" y2="135.0" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M420.0 135.0 L411.7 138.5 L411.7 131.5 Z" fill="#3D5A54"/><rect x="420.0" y="90.0" width="320.0" height="90.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="580.0" y="139.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Continuation: 4HR daily</text><text x="400.0" y="208.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">DOTS observes every dose; monthly sputum and weight.</text><rect x="30.0" y="240.0" width="230.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="145.0" y="296.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Steroids: meningeal +</text><text x="145.0" y="311.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pericardial</text><rect x="285.0" y="240.0" width="230.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="400.0" y="304.2" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">MDR: bedaquiline + delamanid</text><rect x="540.0" y="240.0" width="230.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="655.0" y="304.2" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HIV: time ART, watch IRIS</text><text x="400.0" y="400.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Yellow: stop for liver. Red-green blur: ethambutol eyes.</text><text x="400.0" y="422.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Gouty joints: pyrazinamide. Default breeds MDR.</text></svg>