<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Contraceptive failure ladder and emergency windows</title>
<desc id="d">Typical-use pregnancies per 100 women in the first year: implant 0.1, IUCD under 1, pill 9, condom 18, withdrawal 22, nothing 85. Emergency contraception: copper IUCD within 5 days works best, levonorgestrel 1.5 milligrams within 72 hours, ulipristal within 120 hours and keeps working at higher weight.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">How often each method fails in real use</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Pregnancies per 100 women in year one, typical use; LARC sits near zero</text>
<text x="146" y="100" font-size="11" font-weight="700" fill="#3D5A54" font-family="system-ui,sans-serif">0</text>
<text x="244" y="100" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">5</text>
<text x="440" y="100" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">15</text>
<text x="636" y="100" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">25</text>
<text x="40" y="130" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Implant</text>
<rect x="150" y="116" width="8" height="18" rx="4" fill="#0B6B5B"/>
<text x="166" y="130" font-size="11" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">0.1 (3 years, irregular bleeding)</text>
<text x="40" y="162" font-size="11" fill="#071318" font-family="system-ui,sans-serif">IUCD</text>
<rect x="150" y="148" width="20" height="18" rx="4" fill="#0B6B5B"/>
<text x="178" y="162" font-size="11" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">&lt;1 (copper 10 y, LNG 5 y)</text>
<text x="40" y="194" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Pill</text>
<rect x="150" y="180" width="176" height="18" rx="4" fill="#B7791F"/>
<text x="334" y="194" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">9 (miss 2: backup 7 days)</text>
<text x="40" y="226" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Condom</text>
<rect x="150" y="212" width="353" height="18" rx="4" fill="#B42318"/>
<text x="511" y="226" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">18</text>
<text x="40" y="258" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Withdrawal</text>
<rect x="150" y="244" width="431" height="18" rx="4" fill="#B42318"/>
<text x="589" y="258" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">22</text>
<text x="40" y="290" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Nothing</text>
<rect x="150" y="276" width="560" height="18" rx="4" fill="#071318"/>
<text x="718" y="290" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">85</text>
<text x="150" y="312" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">Axis stops at 25; the no-method bar runs off it because 85 dwarfs every method.</text>
<rect x="30" y="326" width="740" height="96" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.2"/>
<text x="400" y="350" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Too late for routine methods: emergency windows</text>
<text x="120" y="376" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Copper IUCD: 5 days, best</text>
<text x="400" y="376" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Levonorgestrel 1.5 mg: 72 hours</text>
<text x="660" y="376" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ulipristal: 120 hours</text>
<text x="400" y="400" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Ulipristal keeps working at higher BMI; check strings after any IUCD.</text>
<text x="400" y="478" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Counsel with numbers first: typical use, not perfect use, is the honest quote.</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">LARC first for adolescents; condoms add STI cover to any method.</text>
</svg>
