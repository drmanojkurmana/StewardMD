<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">First-order versus zero-order elimination kinetics</title><desc id="d">Comparative plasma drug concentration decline curves over time. First-order elimination exhibits an exponential curve with constant half-life where a constant fraction is cleared per hour. Zero-order elimination displays a straight line where a constant amount is cleared per hour due to enzyme saturation.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Drug elimination: First-order vs Zero-order</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Plasma concentration decay profiles and clearance mechanisms</text><line x1="160" y1="410" x2="660" y2="410" stroke="#071318" stroke-width="2"/><line x1="160" y1="410" x2="160" y2="120" stroke="#071318" stroke-width="2"/><path d="M 160.0 130.0 L 170.0 148.7 L 180.0 166.2 L 190.0 182.6 L 200.0 197.8 L 210.0 212.0 L 220.0 225.3 L 230.0 237.6 L 240.0 249.2 L 250.0 259.9 L 260.0 270.0 L 270.0 279.4 L 280.0 288.1 L 290.0 296.3 L 300.0 303.9 L 310.0 311.0 L 320.0 317.6 L 330.0 323.8 L 340.0 329.6 L 350.0 335.0 L 360.0 340.0 L 370.0 344.7 L 380.0 349.0 L 390.0 353.1 L 400.0 356.9 L 410.0 360.5 L 420.0 363.8 L 430.0 366.9 L 440.0 369.8 L 450.0 372.5 L 460.0 375.0 L 470.0 377.3 L 480.0 379.5 L 490.0 381.6 L 500.0 383.5 L 510.0 385.2 L 520.0 386.9 L 530.0 388.4 L 540.0 389.9 L 550.0 391.2 L 560.0 392.5" fill="none" stroke="#0B6B5B" stroke-width="3.5"/><path d="M 160.0 130.0 L 170.0 137.0 L 180.0 144.0 L 190.0 151.0 L 200.0 158.0 L 210.0 165.0 L 220.0 172.0 L 230.0 179.0 L 240.0 186.0 L 250.0 193.0 L 260.0 200.0 L 270.0 207.0 L 280.0 214.0 L 290.0 221.0 L 300.0 228.0 L 310.0 235.0 L 320.0 242.0 L 330.0 249.0 L 340.0 256.0 L 350.0 263.0 L 360.0 270.0 L 370.0 277.0 L 380.0 284.0 L 390.0 291.0 L 400.0 298.0 L 410.0 305.0 L 420.0 312.0 L 430.0 319.0 L 440.0 326.0 L 450.0 333.0 L 460.0 340.0 L 470.0 347.0 L 480.0 354.0 L 490.0 361.0 L 500.0 368.0 L 510.0 375.0 L 520.0 382.0 L 530.0 389.0 L 540.0 396.0 L 550.0 403.0 L 560.0 410.0" fill="none" stroke="#B42318" stroke-width="3.5" stroke-dasharray="6 3"/><circle cx="260" cy="270.0" r="4" fill="#0B6B5B"/><line x1="260" y1="270.0" x2="260" y2="410" stroke="#0B6B5B" stroke-width="1" stroke-dasharray="3 3"/><text x="260" y="425" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">t½ = 2h</text><circle cx="360" cy="340.0" r="4" fill="#0B6B5B"/><line x1="360" y1="340.0" x2="360" y2="410" stroke="#0B6B5B" stroke-width="1" stroke-dasharray="3 3"/><text x="360" y="425" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">2× t½</text><rect x="420" y="140" width="220" height="90" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><text x="430" y="162" font-size="12.5" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">First-Order Elimination (Most drugs)</text><text x="430" y="180" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Constant fraction (e.g. 50%) / unit time</text><text x="430" y="196" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Half-life (t½) is constant</text><text x="430" y="212" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">• Rate = k · C (concentration-dependent)</text><rect x="420" y="250" width="220" height="90" rx="8" fill="#FDF2F0" stroke="#B42318" stroke-width="1.5"/><text x="430" y="272" font-size="12.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Zero-Order Elimination (Saturable)</text><text x="430" y="290" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Constant amount (e.g. 10 mg) / unit time</text><text x="430" y="306" font-size="11" fill="#071318" font-family="system-ui,sans-serif">• Half-life increases with higher dose</text><text x="430" y="322" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">• Phenytoin, Ethanol, Aspirin (high dose)</text><text x="410" y="450" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Time [hours]</text><text x="95" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 95 265)">Plasma Concentration (mg/L)</text><text x="145" y="414" font-size="11" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="145" y="274" font-size="11" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">50</text><text x="145" y="134" font-size="11" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">100</text><text x="160" y="440" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="260" y="440" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2</text><text x="360" y="440" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">4</text><text x="460" y="440" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">6</text><text x="560" y="440" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">8</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">In first-order kinetics, 4 to 5 half-lives clear >95% of a drug; zero-order clearance enzymes are saturated at therapeutic levels.</text></svg>