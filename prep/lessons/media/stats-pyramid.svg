<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Hierarchy of evidence pyramid</title><desc id="d">Pyramid from systematic reviews and meta-analyses at the top, then randomised trials, cohort studies, case-control studies, case series, and expert opinion at the base.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Levels of evidence</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Designs ranked by how well they resist bias (strongest at the top)</text><path d="M120 140 L400 96 L680 140 Z" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="400" y="128" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Systematic reviews / meta-analyses</text><path d="M182 198 L400 154 L618 198 Z" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="400" y="186" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Randomised controlled trials</text><path d="M244 256 L400 212 L556 256 Z" fill="#EAF3F0" stroke="#B7791F" stroke-width="2"/><text x="400" y="244" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Cohort studies</text><path d="M306 314 L400 270 L494 314 Z" fill="#EAF3F0" stroke="#B7791F" stroke-width="2"/><text x="400" y="302" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Case-control studies</text><path d="M368 372 L400 328 L432 372 Z" fill="#EAF3F0" stroke="#3D5A54" stroke-width="2"/><text x="400" y="360" font-size="13" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Case series and case reports</text><path d="M430 430 L400 386 L370 430 Z" fill="#EAF3F0" stroke="#3D5A54" stroke-width="2"/><text x="400" y="418" font-size="13" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Expert opinion</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">A well-done lower design can beat a badly done higher one: appraise, do not just rank.</text></svg>
