<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" role="img" aria-labelledby="t d"><title id="t">Descent of the testis</title><desc id="d">Flow diagram of testicular descent: gubernaculum anchors the caudal pole, processus vaginalis evaginates the abdominal wall, testis passes through the inguinal canal and reaches the scrotum; persistence of the process gives indirect hernia or hydrocele, failure to descend gives cryptorchidism.</desc><rect width="800" height="458" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Descent of the testis</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Testis lies behind the processus vaginalis, which becomes the tunica vaginalis</text><rect x="235.0" y="96.0" width="330.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="121.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Testis forms near the kidney;</text><text x="400.0" y="137.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">gubernaculum attaches to its lower pole</text><rect x="235.0" y="184.0" width="330.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="201.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Processus vaginalis pushes out</text><text x="400.0" y="217.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">through the abdominal wall (inguinal</text><text x="400.0" y="233.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">canal)</text><rect x="235.0" y="272.0" width="330.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="297.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Gubernaculum shortens; testis</text><text x="400.0" y="313.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">follows into the scrotum by birth</text><rect x="58.0" y="360.0" width="330.0" height="58.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="223.0" y="385.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Process persists:</text><text x="223.0" y="401.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">indirect hernia, hydrocele</text><rect x="412.0" y="360.0" width="330.0" height="58.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="577.0" y="385.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Failure to descend:</text><text x="577.0" y="401.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">cryptorchidism (cancer risk)</text><line x1="400.0" y1="154.0" x2="400.0" y2="176.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 184.0 L396.5 175.7 L403.5 175.7 Z" fill="#3D5A54"/><line x1="400.0" y1="242.0" x2="400.0" y2="264.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 272.0 L396.5 263.7 L403.5 263.7 Z" fill="#3D5A54"/><line x1="400.0" y1="330.0" x2="230.1" y2="358.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M223.0 360.0 L230.6 355.2 L231.8 362.1 Z" fill="#3D5A54"/><line x1="400.0" y1="330.0" x2="569.9" y2="358.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M577.0 360.0 L568.2 362.1 L569.4 355.2 Z" fill="#3D5A54"/></svg>