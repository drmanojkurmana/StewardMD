<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Sodium: volume sorts, speed kills</title><desc id="d">Hypovolemic takes isotonic fill, euvolemic SIADH restricts fluids with salt tablets, central DI takes DDAVP; seizures or coma take 100 mL hypertonic, and correction stays at 8 to 10 per day.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sodium: volume sorts, speed kills</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fix the cause, respect the ceiling</text><rect x="30.0" y="80.0" width="230.0" height="120.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="145.0" y="144.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HYPOvolemic: isotonic fill</text><rect x="285.0" y="80.0" width="230.0" height="120.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="136.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">EUvolemic SIADH: restrict +</text><text x="400.0" y="152.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">salt tabs</text><rect x="540.0" y="80.0" width="230.0" height="120.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="655.0" y="144.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Central DI: DDAVP spray</text><rect x="180.0" y="225.0" width="440.0" height="80.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="269.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Seizures or coma: hypertonic 100 mL</text><rect x="30.0" y="330.0" width="740.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><rect x="30.0" y="330.0" width="500.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="0"/><text x="280.0" y="368.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ceiling: 8 to 10 per day</text><text x="635.0" y="360.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Faster risks</text><text x="635.0" y="378.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">myelinolysis</text><text x="400.0" y="430.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Overcorrection: DDAVP clamp. Chronic: go slow.</text><text x="400.0" y="452.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Treat the tumour, adrenal or thyroid behind it.</text></svg>