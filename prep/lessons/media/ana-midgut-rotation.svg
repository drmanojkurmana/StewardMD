<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Midgut rotation around the superior mesenteric artery</title><desc id="d">d</desc><rect width="800" height="460" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Midgut rotation around the superior mesenteric artery</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Axis of rotation: the superior mesenteric artery</text><rect x="190.0" y="92.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="114.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Week 6: rapid elongation</text><text x="400.0" y="130.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">physiological herniation into the cord</text><rect x="190.0" y="174.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="196.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Herniated loop turns 90 degrees</text><text x="400.0" y="212.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">anticlockwise (seen from the front)</text><rect x="190.0" y="256.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="278.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Week 10: loops return to the abdomen,</text><text x="400.0" y="294.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">turning a further 180 degrees</text><rect x="190.0" y="338.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="360.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Total 270 degrees; colon fixes,</text><text x="400.0" y="376.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ascending and descending become retroperitoneal</text><line x1="400.0" y1="144.0" x2="400.0" y2="166.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 174.0 L396.5 165.7 L403.5 165.7 Z" fill="#3D5A54"/><line x1="400.0" y1="226.0" x2="400.0" y2="248.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 256.0 L396.5 247.7 L403.5 247.7 Z" fill="#3D5A54"/><line x1="400.0" y1="308.0" x2="400.0" y2="330.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 338.0 L396.5 329.7 L403.5 329.7 Z" fill="#3D5A54"/><text x="400.0" y="442.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Failure to return: omphalocele. Incomplete rotation: malrotation and volvulus.</text></svg>