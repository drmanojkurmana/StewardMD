<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 514" role="img" aria-labelledby="t d"><title id="t">Plasma calcium control</title><desc id="d">Feedback loop of calcium control: low plasma calcium raises PTH, which increases bone resorption, renal calcium reabsorption, phosphate excretion and activation of vitamin D to calcitriol, which increases gut calcium absorption; high calcium switches PTH off and calcitonin opposes.</desc><rect width="800" height="514" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Plasma calcium control</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">High calcium switches PTH off (calcium-sensing receptor); calcitonin from C cells lowers calcium</text><rect x="280.0" y="96.0" width="240.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="130.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low ionised calcium</text><rect x="280.0" y="192.0" width="240.0" height="60.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="218.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parathyroid chief cells: PTH</text><text x="400.0" y="234.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">released</text><rect x="16.0" y="288.0" width="240.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="136.0" y="322.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bone: resorption</text><rect x="280.0" y="288.0" width="240.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="306.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Kidney: Ca2+ reabsorbed,</text><text x="400.0" y="322.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">phosphate lost,</text><text x="400.0" y="338.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1-alpha-hydroxylase</text><rect x="544.0" y="288.0" width="240.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="664.0" y="314.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Gut (via calcitriol):</text><text x="664.0" y="330.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ca2+ absorbed</text><rect x="280.0" y="384.0" width="240.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="418.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Plasma calcium rises</text><line x1="400.0" y1="156.0" x2="400.0" y2="184.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 192.0 L396.5 183.7 L403.5 183.7 Z" fill="#3D5A54"/><line x1="400.0" y1="252.0" x2="143.1" y2="287.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M136.0 288.0 L143.7 283.4 L144.7 290.4 Z" fill="#3D5A54"/><line x1="400.0" y1="252.0" x2="400.0" y2="280.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 288.0 L396.5 279.7 L403.5 279.7 Z" fill="#3D5A54"/><line x1="400.0" y1="252.0" x2="656.9" y2="287.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M664.0 288.0 L655.3 290.4 L656.3 283.4 Z" fill="#3D5A54"/><line x1="136.0" y1="348.0" x2="392.9" y2="383.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 384.0 L391.3 386.4 L392.3 379.4 Z" fill="#3D5A54"/><line x1="400.0" y1="348.0" x2="400.0" y2="376.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 384.0 L396.5 375.7 L403.5 375.7 Z" fill="#3D5A54"/><line x1="664.0" y1="348.0" x2="407.1" y2="383.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 384.0 L407.7 379.4 L408.7 386.4 Z" fill="#3D5A54"/><text x="400.0" y="496.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">PTH raises calcium and lowers phosphate; vitamin D raises both.</text></svg>