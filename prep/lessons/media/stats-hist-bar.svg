<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Histogram compared with bar chart</title><desc id="d">Left: a histogram of age in ten-year bands with touching bars. Right: a bar chart of case counts by ward with separated bars.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Histogram vs bar chart</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Touching bars for a continuous scale; separated bars for categories</text><text x="210" y="96" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Histogram: age distribution</text><rect x="70" y="304" width="36" height="26" fill="#0B6B5B"/><text x="88" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><rect x="106" y="265" width="36" height="65" fill="#0B6B5B"/><text x="124" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">10</text><rect x="142" y="213" width="36" height="117" fill="#0B6B5B"/><text x="160" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">20</text><rect x="178" y="148" width="36" height="182" fill="#0B6B5B"/><text x="196" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">30</text><rect x="214" y="187" width="36" height="143" fill="#0B6B5B"/><text x="232" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">40</text><rect x="250" y="239" width="36" height="91" fill="#0B6B5B"/><text x="268" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">50</text><rect x="286" y="278" width="36" height="52" fill="#0B6B5B"/><text x="304" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">60</text><rect x="322" y="304" width="36" height="26" fill="#0B6B5B"/><text x="340" y="352" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">70</text><text x="210" y="380" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">bars touch: age runs on with no gaps</text><text x="210" y="402" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">(age in years, 10-year bands)</text><text x="590" y="96" font-size="14.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Bar chart: cases by ward</text><rect x="452" y="174" width="52" height="156" fill="#B7791F"/><text x="478" y="352" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Ward A</text><text x="478" y="162" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">12</text><rect x="530" y="239" width="52" height="91" fill="#B7791F"/><text x="556" y="352" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Ward B</text><text x="556" y="227" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">7</text><rect x="608" y="135" width="52" height="195" fill="#B7791F"/><text x="634" y="352" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Ward C</text><text x="634" y="123" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">15</text><rect x="686" y="265" width="52" height="65" fill="#B7791F"/><text x="712" y="352" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Ward D</text><text x="712" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">5</text><text x="590" y="380" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">bars apart: wards have no order or scale</text><text x="590" y="402" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">(counts of cases)</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Swap them and the chart lies: a histogram implies continuity that categories do not have.</text></svg>
