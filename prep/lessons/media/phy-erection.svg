<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="t d"><title id="t">Erection and ejaculation</title><desc id="d">d</desc><rect width="800" height="410" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Erection and ejaculation</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Nitrates with PDE5 inhibitors cause profound hypotension</text><rect x="48.0" y="96.0" width="340.0" height="56.0" rx="8" fill="#DCEAF7" stroke="#3E6FA5" stroke-width="1.6"/><text x="218.0" y="128.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parasympathetic S2 to S4</text><rect x="412.0" y="96.0" width="340.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="582.0" y="128.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sympathetic T11 to L2, pudendal nerve</text><rect x="48.0" y="190.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="218.0" y="214.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nitric oxide, cGMP up:</text><text x="218.0" y="230.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">corporal smooth muscle relaxes</text><rect x="412.0" y="190.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="582.0" y="214.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Emission (vas, seminal vesicles, prostate),</text><text x="582.0" y="230.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">then expulsion</text><rect x="48.0" y="284.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="218.0" y="316.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Erection (PDE5 inhibitors prolong cGMP)</text><rect x="412.0" y="284.0" width="340.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="582.0" y="316.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ejaculation</text><line x1="218.0" y1="152.0" x2="218.0" y2="182.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M218.0 190.0 L214.5 181.7 L221.5 181.7 Z" fill="#3D5A54"/><line x1="218.0" y1="246.0" x2="218.0" y2="276.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M218.0 284.0 L214.5 275.7 L221.5 275.7 Z" fill="#3D5A54"/><line x1="582.0" y1="152.0" x2="582.0" y2="182.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M582.0 190.0 L578.5 181.7 L585.5 181.7 Z" fill="#3D5A54"/><line x1="582.0" y1="246.0" x2="582.0" y2="276.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M582.0 284.0 L578.5 275.7 L585.5 275.7 Z" fill="#3D5A54"/><text x="400.0" y="392.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Diabetic neuropathy and vascular disease are common organic causes of erectile failure.</text></svg>