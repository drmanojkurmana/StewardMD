<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" role="img" aria-labelledby="t d"><title id="t">Sesamoid bones and their tendons</title><desc id="d">d</desc><rect width="800" height="386" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sesamoid bones and their tendons</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Bone forms inside a tendon where it is under friction; it acts as a pulley</text><rect x="24.0" y="110.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="109.0" y="143.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Patella</text><rect x="218.0" y="110.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="303.0" y="143.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pisiform</text><rect x="412.0" y="110.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="497.0" y="143.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fabella</text><rect x="606.0" y="110.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="691.0" y="135.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hallux sesamoids</text><text x="691.0" y="151.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(two)</text><rect x="24.0" y="258.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="109.0" y="283.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Quadriceps</text><text x="109.0" y="299.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">tendon</text><rect x="218.0" y="258.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="303.0" y="283.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Flexor carpi</text><text x="303.0" y="299.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ulnaris tendon</text><rect x="412.0" y="258.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="497.0" y="283.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lateral head of</text><text x="497.0" y="299.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">gastrocnemius</text><rect x="606.0" y="258.0" width="170.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="691.0" y="283.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Flexor hallucis</text><text x="691.0" y="299.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">brevis</text><line x1="194.0" y1="287.0" x2="224.0" y2="287.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="224.0" y1="287.0" x2="224.0" y2="139.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="224.0" y1="139.0" x2="203.2" y2="139.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M196.0 139.0 L204.3 135.5 L204.3 142.5 Z" fill="#3D5A54"/><line x1="388.0" y1="287.0" x2="418.0" y2="287.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="418.0" y1="287.0" x2="418.0" y2="139.0" stroke="#3D5A54" stroke-width