<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">HIV replication cycle and drug targets</title><desc id="d">Five steps with blocking drug classes: gp120 attachment to CD4 plus CCR5 or CXCR4 is blocked by maraviroc and enfuvirtide; reverse transcription of RNA to DNA is blocked by NRTI and NNRTI classes; integration into host DNA is blocked by integrase inhibitors such as dolutegravir; Gag-Pol translation follows; protease cleavage and maturation is blocked by protease inhibitors. The virion carries 2 identical positive sense RNA copies; gag builds the core and pol carries reverse transcriptase, protease and integrase.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HIV replication cycle and drug targets</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Each step names the drug class that blocks it</text><rect x="110.0" y="96.0" width="440.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="124.0" y="117.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">1. Attachment</text><text x="124.0" y="135.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">gp120 binds CD4 + CCR5/CXCR4</text><text x="562.0" y="126.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">blocks: maraviroc, enfuvirtide</text><line x1="330.0" y1="148.0" x2="330.0" y2="151.6" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M330.0 158.0 L326.9 150.6 L333.1 150.6 Z" fill="#3D5A54"/><rect x="110.0" y="160.0" width="440.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="124.0" y="181.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">2. Reverse transcription</text><text x="124.0" y="199.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">RNA copied to DNA</text><text x="562.0" y="190.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">blocks: NRTI + NNRTI</text><line x1="330.0" y1="212.0" x2="330.0" y2="215.6" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M330.0 222.0 L326.9 214.6 L333.1 214.6 Z" fill="#3D5A54"/><rect x="110.0" y="224.0" width="440.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="124.0" y="245.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">3. Integration</text><text x="124.0" y="263.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">viral DNA into host DNA</text><text x="562.0" y="254.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">blocks: INSTI (dolutegravir)</text><line x1="330.0" y1="276.0" x2="330.0" y2="279.6" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M330.0 286.0 L326.9 278.6 L333.1 278.6 Z" fill="#3D5A54"/><rect x="110.0" y="288.0" width="440.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="124.0" y="309.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">4. Translation</text><text x="124.0" y="327.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Gag-Pol proteins made</text><line x1="330.0" y1="340.0" x2="330.0" y2="343.6" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M330.0 350.0 L326.9 342.6 L333.1 342.6 Z" fill="#3D5A54"/><rect x="110.0" y="352.0" width="440.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="124.0" y="373.0" font-size="13.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">5. Maturation</text><text x="124.0" y="391.0" font-size="12" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">protease cleaves, virion matures</text><text x="562.0" y="382.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">blocks: protease inhibitors</text><text x="400.0" y="452.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Diploid genome: 2 identical +ssRNA copies; gag builds core, pol carries RT, protease, integrase.</text><text x="400.0" y="492.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">First isolated 1983; shown to cause AIDS 1984.</text></svg>