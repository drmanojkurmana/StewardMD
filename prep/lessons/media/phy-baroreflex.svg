<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 524" role="img" aria-labelledby="t d"><title id="t">Baroreceptor reflex</title><desc id="d">Baroreceptor reflex loop: raised blood pressure stretches carotid sinus and aortic arch receptors, afferents via IX and X reach the nucleus tractus solitarius, which increases vagal tone and reduces sympathetic outflow, lowering heart rate and vessel tone and so pressure.</desc><rect width="800" height="524" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Baroreceptor reflex</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Negative feedback; fires within seconds</text><rect x="190.0" y="90.0" width="420.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="116.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Blood pressure rises</text><rect x="190.0" y="154.0" width="420.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="180.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Carotid sinus and aortic arch stretch</text><rect x="190.0" y="218.0" width="420.0" height="44.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="244.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Afferents CN IX and X to nucleus tractus solitarius</text><rect x="190.0" y="282.0" width="420.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="308.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Vagal tone up, sympathetic outflow down</text><rect x="190.0" y="346.0" width="420.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="372.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Heart rate and vessel tone fall</text><rect x="190.0" y="410.0" width="420.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="436.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Blood pressure returns toward normal</text><line x1="400.0" y1="134.0" x2="400.0" y2="146.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 154.0 L396.5 145.7 L403.5 145.7 Z" fill="#3D5A54"/><line x1="400.0" y1="198.0" x2="400.0" y2="210.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 218.0 L396.5 209.7 L403.5 209.7 Z" fill="#3D5A54"/><line x1="400.0" y1="262.0" x2="400.0" y2="274.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 282.0 L396.5 273.7 L403.5 273.7 Z" fill="#3D5A54"/><line x1="400.0" y1="326.0" x2="400.0" y2="338.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 346.0 L396.5 337.7 L403.5 337.7 Z" fill="#3D5A54"/><line x1="400.0" y1="390.0" x2="400.0" y2="402.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 410.0 L396.5 401.7 L403.5 401.7 Z" fill="#3D5A54"/><text x="400.0" y="506.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Carotid sinus massage activates it and can slow or break supraventricular tachycardia.</text></svg>