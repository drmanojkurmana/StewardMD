<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 472" role="img" aria-labelledby="t d"><title id="t">Puberty: the gonadal axis wakes up</title><desc id="d">d</desc><rect width="800" height="472" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Puberty: the gonadal axis wakes up</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sex steroids feed back on the hypothalamus and pituitary</text><rect x="230.0" y="96.0" width="340.0" height="48.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="124.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypothalamus: GnRH, released in pulses</text><rect x="230.0" y="172.0" width="340.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="200.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior pituitary: LH and FSH</text><rect x="230.0" y="248.0" width="340.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="276.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Gonads: oestradiol or testosterone, gametes</text><rect x="230.0" y="324.0" width="340.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="344.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Secondary sexual characteristics, growth</text><text x="400.0" y="360.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">spurt</text><line x1="400.0" y1="144.0" x2="400.0" y2="164.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 172.0 L396.5 163.7 L403.5 163.7 Z" fill="#3D5A54"/><line x1="400.0" y1="220.0" x2="400.0" y2="240.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 248.0 L396.5 239.7 L403.5 239.7 Z" fill="#3D5A54"/><line x1="400.0" y1="296.0" x2="400.0" y2="316.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 324.0 L396.5 315.7 L403.5 315.7 Z" fill="#3D5A54"/><text x="400.0" y="424.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">First sign: breast budding (thelarche) in girls, testicular enlargement in boys.</text><text x="400.0" y="454.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Precocious puberty: central (early GnRH) treated with GnRH analogues.</text></svg>