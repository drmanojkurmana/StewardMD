<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 434" role="img" aria-labelledby="t d"><title id="t">Autonomic outflow</title><desc id="d">d</desc><rect width="800" height="434" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Autonomic outflow</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Adrenal medulla is a modified ganglion: preganglionic fibres release ACh directly onto chromaffin cells</text><rect x="48.0" y="96.0" width="340.0" height="52.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="218.0" y="126.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sympathetic: T1 to L2 (thoracolumbar)</text><rect x="412.0" y="96.0" width="340.0" height="52.0" rx="8" fill="#DCEAF7" stroke="#3E6FA5" stroke-width="1.6"/><text x="582.0" y="118.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parasympathetic: CN III, VII, IX, X and S2</text><text x="582.0" y="134.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">to S4</text><rect x="48.0" y="178.0" width="340.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="218.0" y="208.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Short preganglionic (ACh, nicotinic)</text><rect x="412.0" y="178.0" width="340.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="582.0" y="208.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Long preganglionic (ACh, nicotinic)</text><rect x="48.0" y="260.0" width="340.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><tex