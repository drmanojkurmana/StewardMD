<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Four fates of a thrombus</title><desc id="d">A thrombus in a vessel can take four paths: propagation enlarges it and may occlude the lumen; embolisation breaks a piece off to travel downstream and is the most dangerous early fate; dissolution by fibrinolysis clears it, and fresh thrombi lyse best; organisation brings fibroblast and capillary ingrowth with possible recanalisation, but the organised clot turns fibrotic and resists lysis.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Four fates of a thrombus</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fresh thrombi answer drugs; organised thrombi resist them</text><rect x="325.0" y="120.0" width="150.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="157.2" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thrombus</text><rect x="0.0" y="218.0" width="260.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="130.0" y="242.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Propagation</text><text x="130.0" y="264.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">grows, may occlude</text><text x="130.0" y="282.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">heparin limits it</text><line x1="400.0" y1="184.0" x2="136.3" y2="217.2" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M130.0 218.0 L136.9 214.0 L137.7 220.2 Z" fill="#3D5A54"/><rect x="365.0" y="218.0" width="260.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/><text x="495.0" y="242.0" font-size="14" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Embolisation</text><text x="495.0" y="264.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">travels downstream</text><text x="495.0" y="282.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">most dangerous early</text><line x1="400.0" y1="184.0" x2="489.0" y2="215.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M495.0 218.0 L487.0 218.5 L489.1 212.6 Z" fill="#3D5A54"/><rect x="0.0" y="348.0" width="260.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="2"/><text x="130.0" y="372.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Dissolution</text><text x="130.0" y="394.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">fibrinolysis clears it</text><text x="130.0" y="412.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">fresh clots lyse best</text><line x1="400.0" y1="184.0" x2="135.5" y2="344.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M130.0 348.0 L134.7 341.5 L137.9 346.8 Z" fill="#3D5A54"/><rect x="365.0" y="348.0" width="260.0" height="84.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="2"/><text x="495.0" y="372.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Organisation</text><text x="495.0" y="394.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">fibrosis + recanalisation</text><text x="495.0" y="412.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">resists lysis</text><line x1="400.0" y1="184.0" x2="491.8" y2="342.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M495.0 348.0 L488.6 343.2 L494.0 340.1 Z" fill="#3D5A54"/><text x="400.0" y="492.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Embolisation is the most dangerous immediate fate; organisation is the slowest.</text></svg>