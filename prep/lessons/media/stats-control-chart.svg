<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Control chart: common cause versus special cause</title><desc id="d">A control chart of twenty measurements over time with a centre mean line and upper and lower control limits at three standard deviations. Nineteen points wobble inside the limits as common-cause noise; one point breaks above the upper limit as a special cause needing investigation.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Control chart: common cause vs special cause</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Limits sit at three standard deviations from the mean</text><line x1="60" y1="180" x2="740" y2="180" stroke="#B42318" stroke-width="2.5" stroke-dasharray="6 4"/><text x="736" y="172" font-size="12.5" font-weight="700" text-anchor="end" fill="#B42318" font-family="system-ui,sans-serif">UCL (+3 SD)</text><line x1="60" y1="300" x2="740" y2="300" stroke="#0B6B5B" stroke-width="2.5"/><text x="736" y="292" font-size="12.5" font-weight="700" text-anchor="end" fill="#0B6B5B" font-family="system-ui,sans-serif">mean</text><line x1="60" y1="420" x2="740" y2="420" stroke="#B42318" stroke-width="2.5" stroke-dasharray="6 4"/><text x="736" y="412" font-size="12.5" font-weight="700" text-anchor="end" fill="#B42318" font-family="system-ui,sans-serif">LCL (−3 SD)</text><text x="70" y="120" font-size="12.5" font-weight="600" fill="#3D5A54" font-family="system-ui,sans-serif">audit measure</text><text x="70" y="440" font-size="12.5" font-weight="400" fill="#3D5A54" font-family="system-ui,sans-serif">time (audit cycles)</text><path d="M70.0 288.0 L104.7 320.0 L139.5 268.0 L174.2 308.0 L208.9 280.0 L243.7 348.0 L278.4 284.0 L313.2 264.0 L347.9 328.0 L382.6 292.0 L417.4 256.0 L452.1 324.0 L486.8 272.0 L521.6 312.0 L556.3 156.0 L591.1 284.0 L625.8 332.0 L660.5 280.0 L695.3 308.0 L730.0 276.0" fill="none" stroke="#071318" stroke-width="2"/><circle cx="70.0" cy="288.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="104.7" cy="320.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="139.5" cy="268.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="174.2" cy="308.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="208.9" cy="280.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="243.7" cy="348.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="278.4" cy="284.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="313.2" cy="264.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="347.9" cy="328.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="382.6" cy="292.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="417.4" cy="256.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="452.1" cy="324.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="486.8" cy="272.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="521.6" cy="312.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="556.3" cy="156.0" r="8" fill="#B42318" stroke="#071318" stroke-width="2"/><circle cx="591.1" cy="284.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="625.8" cy="332.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="660.5" cy="280.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="695.3" cy="308.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="730.0" cy="276.0" r="5" fill="#0B6B5B" stroke="#FFFFFF" stroke-width="1.5"/><line x1="556.3" y1="148.0" x2="556.3" y2="96" stroke="#B42318" stroke-width="1.5" stroke-dasharray="4 3"/><text x="556.3" y="82" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">special cause: investigate</text><text x="556.3" y="100" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">point beyond the limits</text><text x="400" y="478" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Inside the limits: common-cause noise, do not chase. Beyond a limit: special cause, investigate first.</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Never move the limits or edit the data to hide a special-cause point.</text></svg>