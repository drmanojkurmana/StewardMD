<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Potassium and the ECG: hyperkalaemia progression versus hypokalaemia</title> <desc id="d">Two strips. Hyperkalaemia progresses from peaked T waves to flattened P waves to widened QRS to a sine wave pattern. Hypokalaemia flattens T waves and makes U waves prominent.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Potassium on ECG: high peaks, low flattens</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Hyperkalaemia marches P to QRS to sine; hypokalaemia shows flat T with prominent U</text> <rect x="40" y="90" width="350" height="300" rx="12" fill="#071318"/> <text x="215" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">HYPERKALAEMIA: rising K+</text> <line x1="70" y1="300" x2="360" y2="300" stroke="#FFFFFF" stroke-width="1.5"/> <path d="M80 300 L100 300 L108 260 L116 300 L150 300 L158 272 L166 300 L200 300 L208 284 L216 300 L250 300 L258 296 L290 296 L298 300 L330 296 L338 300" fill="none" stroke="#B7791F" stroke-width="2.5"/> <text x="105" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">peaked T</text> <text x="180" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">flat P</text> <text x="255" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">wide QRS</text> <text x="320" y="330" font-size="11" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">sine wave</text> <text x="215" y="160" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">tall tented T first,</text> <text x="215" y="182" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">P flattens, QRS widens,</text> <text x="215" y="204" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">sine wave at high levels</text> <text x="215" y="368" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">arrest risk: act fast</text> <rect x="410" y="90" width="350" height="300" rx="12" fill="#0B6B5B"/> <text x="585" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">HYPOKALAEMIA: low K+</text> <line x1="440" y1="300" x2="730" y2="300" stroke="#FFFFFF" stroke-width="1.5"/> <path d="M460 300 L490 300 L498 292 L506 300 L540 300 L548 296 L556 300 L590 300 L598 288 L606 300 L640 300 L648 282 L656 300 L690 300" fill="none" stroke="#FFFFFF" stroke-width="2.5"/> <text x="500" y="330" font-size="11" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">flat T</text> <text x="600" y="330" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">prominent U</text> <text x="585" y="160" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">T flattens first,</text> <text x="585" y="182" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">U wave stands out</text> <text x="585" y="204" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">after the T</text> <text x="585" y="368" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">replace K+, watch digoxin</text> <text x="400" y="430" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Peaked and wide means high; flat with a hump after means low.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sine wave is pre-arrest: calcium, insulin-glucose, shift then remove potassium.</text> </svg>
