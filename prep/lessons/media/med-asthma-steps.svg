<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Asthma: the five-step ladder</title><desc id="d">Controller therapy climbs five steps from as-needed reliever to biologic; the reliever rides along at every step. Step up when uncontrolled, step down after three stable months.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Asthma: the five-step ladder</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Reliever at every step; controllers climb the ladder</text><rect x="150.0" y="84.0" width="500.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="400.0" y="115.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Step 1: SABA as needed alone</text><text x="130.0" y="117.0" font-size="15" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1</text><rect x="150.0" y="148.0" width="500.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="400.0" y="179.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Step 2: daily low-dose ICS</text><text x="130.0" y="181.0" font-size="15" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2</text><rect x="150.0" y="212.0" width="500.0" height="54.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="243.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Step 3: low ICS + LABA (MART)</text><text x="130.0" y="245.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">3</text><rect x="150.0" y="276.0" width="500.0" height="54.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="307.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Step 4: medium ICS + LABA, add tiotropium</text><text x="130.0" y="309.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">4</text><rect x="150.0" y="340.0" width="500.0" height="54.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="371.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Step 5: high ICS + LABA + biologic (anti-IgE, anti-IL5)</text><text x="130.0" y="373.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">5</text><text x="400.0" y="452.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Status asthmaticus: oxygen, nebulised salbutamol, magnesium, ICU.</text><text x="400.0" y="472.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">LABA never rides alone: always paired with ICS.</text></svg>