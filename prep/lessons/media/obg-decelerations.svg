<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Deceleration patterns: early, late and variable</title>
<desc id="d">Early decelerations mirror the contraction exactly and come from head compression; they are benign. Late decelerations start after the contraction peak and end after it ends, signalling uteroplacental insufficiency. Variable decelerations drop abruptly within 30 seconds to nadir, often with a small pre-rise called shouldering, and come from cord compression. Traces are schematic, not to scale.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Read the dip against the squeeze</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Green: fetal heart rate. Amber: contraction. Schematic, not to scale.</text>
<rect x="30" y="80" width="236" height="300" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/>
<text x="148" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">EARLY</text>
<line x1="45" y1="150" x2="251" y2="150" stroke="#3D5A54" stroke-width="1" stroke-dasharray="5 4"/>
<polyline points="45,150 66,150 87,156 108,166 129,172 150,174 171,172 192,166 213,156 234,150 251,150" fill="none" stroke="#0B6B5B" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="45,300 66,296 87,288 108,278 129,270 150,266 171,270 192,278 213,288 234,296 251,300" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-linejoin="round"/>
<text x="148" y="330" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">mirrors the squeeze</text>
<text x="148" y="348" font-size="11" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">head compression: benign</text>
<rect x="282" y="80" width="236" height="300" rx="8" fill="#FDF2F0" stroke="#B42318" stroke-width="1.5"/>
<text x="400" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">LATE</text>
<line x1="297" y1="150" x2="503" y2="150" stroke="#3D5A54" stroke-width="1" stroke-dasharray="5 4"/>
<polyline points="297,150 318,150 339,150 360,152 381,158 402,166 423,172 444,174 465,172 486,164 503,158" fill="none" stroke="#B42318" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="297,300 318,296 339,288 360,278 381,270 402,266 423,270 444,278 465,288 486,296 503,300" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-linejoin="round"/>
<text x="400" y="330" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">lags behind, ends late</text>
<text x="400" y="348" font-size="11" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">placental failure: act</text>
<rect x="534" y="80" width="236" height="300" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="652" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">VARIABLE</text>
<line x1="549" y1="150" x2="755" y2="150" stroke="#3D5A54" stroke-width="1" stroke-dasharray="5 4"/>
<polyline points="549,150 570,150 591,150 612,144 633,176 654,184 675,176 696,150 717,150 738,150 755,150" fill="none" stroke="#071318" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="549,300 570,296 591,288 612,278 633,270 654,266 675,270 696,278 717,288 738,296 755,300" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-linejoin="round"/>
<text x="652" y="330" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">abrupt V, under 30 s</text>
<text x="652" y="348" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">cord squeeze: commonest</text>
<rect x="30" y="392" width="740" height="52" rx="6" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.2"/>
<text x="400" y="414" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Shouldering (brief rise before a variable dip) is venous occlusion, not reassurance by itself</text>
<text x="400" y="434" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sinusoidal waves lasting 20-30 minutes mean severe anaemia: deliver or resuscitate now.</text>
<text x="400" y="478" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Judge every dip by timing first, depth second: timing names the mechanism.</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">FIGO classes bundle all four parameters; one pathological feature changes the plan.</text>
</svg>
