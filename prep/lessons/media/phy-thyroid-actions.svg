<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d"><title id="t">Actions of thyroid hormone</title><desc id="d">Table of thyroid hormone actions by system: raises basal metabolic rate and heat production, upregulates beta receptors, essential for fetal and childhood brain and bone growth, speeds gut motility.</desc><rect width="800" height="390" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Actions of thyroid hormone</text><text x="117.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">System</text><text x="498.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Effect</text><rect x="37.0" y="100.0" width="160.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="117.0" y="126.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Metabolism</text><line x1="200.0" y1="122.0" x2="223.6" y2="122.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 122.0 L222.6 125.1 L222.6 118.9 Z" fill="#3D5A54"/><rect x="233.0" y="100.0" width="530.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="498.0" y="126.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Basal metabolic rate and oxygen use rise; heat production</text><rect x="37.0" y="154.0" width="160.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="117.0" y="180.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Heart</text><line x1="200.0" y1="176.0" x2="223.6" y2="176.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 176.0 L222.6 179.1 L222.6 172.9 Z" fill="#3D5A54"/><rect x="233.0" y="154.0" width="530.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="498.0" y="180.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Beta-1 receptors upregulated: tachycardia, higher output</text><rect x="37.0" y="208.0" width="160.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="117.0" y="234.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nervous system</text><line x1="200.0" y1="230.0" x2="223.6" y2="230.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 230.0 L222.6 233.1 L222.6 226.9 Z" fill="#3D5A54"/><rect x="233.0" y="208.0" width="530.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="498.0" y="234.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Brain development in the fetus and infant; tremor, anxiety in excess</text><rect x="37.0" y="262.0" width="160.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="117.0" y="288.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Growth</text><line x1="200.0" y1="284.0" x2="223.6" y2="284.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 284.0 L222.6 287.1 L222.6 280.9 Z" fill="#3D5A54"/><rect x="233.0" y="262.0" width="530.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="498.0" y="288.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bone maturation; deficiency causes cretinism</text><rect x="37.0" y="316.0" width="160.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="117.0" y="342.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Gut</text><line x1="200.0" y1="338.0" x2="223.6" y2="338.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 338.0 L222.6 341.1 L222.6 334.9 Z" fill="#3D5A54"/><rect x="233.0" y="316.0" width="530.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="498.0" y="342.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Motility rises: diarrhoea in excess, constipation in deficiency</text></svg>