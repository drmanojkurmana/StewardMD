<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 482" role="img" aria-labelledby="t d"><title id="t">Neuromuscular transmission</title><desc id="d">Steps at the neuromuscular junction: motor nerve action potential opens calcium channels, vesicles release acetylcholine, it binds nicotinic receptors producing an end plate potential, sodium entry fires a muscle action potential, and acetylcholinesterase removes the transmitter.</desc><rect width="800" height="482" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Neuromuscular transmission</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The safety factor is about three: the end plate potential far exceeds threshold</text><rect x="180.0" y="90.0" width="440.0" height="42.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="115.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Motor nerve action potential reaches the terminal</text><rect x="180.0" y="152.0" width="440.0" height="42.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="177.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Voltage-gated Ca2+ channels open</text><rect x="180.0" y="214.0" width="440.0" height="42.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="239.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Vesicles release acetylcholine (quanta)</text><rect x="180.0" y="276.0" width="440.0" height="42.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="293.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ACh binds nicotinic receptors: Na+ in, end plate</text><text x="400.0" y="309.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">potential</text><rect x="180.0" y="338.0" width="440.0" height="42.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="363.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Muscle action potential and contraction</text><rect x="180.0" y="400.0" width="440.0" height="42.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="425.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Acetylcholinesterase breaks down ACh in the cleft</text><line x1="400.0" y1="132.0" x2="400.0" y2="144.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 152.0 L396.5 143.7 L403.5 143.7 Z" fill="#3D5A54"/><line x1="400.0" y1="194.0" x2="400.0" y2="206.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 214.0 L396.5 205.7 L403.5 205.7 Z" fill="#3D5A54"/><line x1="400.0" y1="256.0" x2="400.0" y2="268.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 276.0 L396.5 267.7 L403.5 267.7 Z" fill="#3D5A54"/><line x1="400.0" y1="318.0" x2="400.0" y2="330.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 338.0 L396.5 329.7 L403.5 329.7 Z" fill="#3D5A54"/><line x1="400.0" y1="380.0" x2="400.0" y2="392.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 400.0 L396.5 391.7 L403.5 391.7 Z" fill="#3D5A54"/></svg>