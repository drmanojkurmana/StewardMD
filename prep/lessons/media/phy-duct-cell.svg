<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Pancreatic duct cell bicarbonate secretion</title><desc id="d">Pancreatic duct cell: carbonic anhydrase makes bicarbonate inside, a chloride bicarbonate exchanger and CFTR chloride channel at the apical membrane secrete bicarbonate into the lumen, basolateral sodium hydrogen exchange and the sodium potassium pump support it, and secretin acts through cAMP to open CFTR.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pancreatic duct cell bicarbonate secretion</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lumen at the top, blood at the bottom</text><rect x="180.0" y="150.0" width="440.0" height="230.0" rx="8" fill="#FBEFD2" stroke="#071318" stroke-width="2.2"/><text x="70.0" y="130.0" font-size="13" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">LUMEN</text><text x="70.0" y="410.0" font-size="13" font-weight="700" text-anchor="start" fill="#B3382C" font-family="system-ui,sans-serif">BLOOD</text><text x="400.0" y="180.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Duct cell</text><rect x="250.0" y="140.0" width="34.0" height="22.0" rx="6" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="267.0" y="154.0" font-size="9.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CFTR</text><line x1="267.0" y1="140.0" x2="267.0" y2="107.2" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M267.0 100.0 L270.5 108.3 L263.5 108.3 Z" fill="#3D5A54"/><text x="267.0" y="92.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cl- out</text><rect x="400.0" y="140.0" width="60.0" height="22.0" rx="6" fill="#BFE3D6" stroke="#071318" stroke-width="1.6"/><text x="430.0" y="154.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cl-/HCO3-</text><line x1="430.0" y1="140.0" x2="430.0" y2="107.2" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M430.0 100.0 L433.5 108.3 L426.5 108.3 Z" fill="#3D5A54"/><text x="430.0" y="92.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HCO3- out</text><text x="400.0" y="240.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">CO2 + H2O  &lt;-&gt;  H+ + HCO3-  (carbonic anhydrase)</text><rect x="260.0" y="370.0" width="70.0" height="22.0" rx="6" fill="#F5DDA6" stroke="#071318" stroke-width="1.6"/><text x="295.0" y="384.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Na+/H+</text><line x1="295.0" y1="392.0" x2="295.0" y2="416.8" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M295.0 424.0 L291.5 415.7 L298.5 415.7 Z" fill="#3D5A54"/><text x="295.0" y="440.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">H+ out to blood</text><rect x="470.0" y="370.0" width="80.0" height="22.0" rx="6" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="510.0" y="384.0" font-size="9.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Na+/K+ ATPase</text><text x="400.0" y="295.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Secretin (S cells) -&gt; cAMP -&gt; opens CFTR</text><text x="400.0" y="480.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cystic fibrosis: CFTR defect, thick pancreatic secretions, malabsorption.</text></svg>