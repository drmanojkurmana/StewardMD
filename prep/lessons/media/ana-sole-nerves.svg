<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d"><title id="t">Plantar nerves of the foot</title><desc id="d">Sole of the right foot showing the medial plantar nerve territory over the medial two thirds of the sole and medial three and a half toes, and the lateral plantar nerve over the lateral third and lateral one and a half toes.</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Plantar nerves of the foot</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sole of the right foot; big toe on the left of the page</text><g transform="translate(40,0)"><path d="M335 200 C320 260 345 330 350 380 C355 430 360 490 410 500 C460 505 490 470 495 420 C500 360 510 250 505 205 Z" fill="#E3F3EF" stroke="#071318" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><clipPath id="so"><path d="M335 200 C320 260 345 330 350 380 C355 430 360 490 410 500 C460 505 490 470 495 420 C500 360 510 250 505 205 Z"/></clipPath><g clip-path="url(#so)"><rect x="455.0" y="190.0" width="80.0" height="330.0" rx="0" fill="#F5DDA6" stroke="none" stroke-width="0"/></g><path d="M335 200 C320 260 345 330 350 380 C355 430 360 490 410 500 C460 505 490 470 495 420 C500 360 510 250 505 205 Z" fill="none" stroke="#071318" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="455.0" y1="205.0" x2="455.0" y2="400.0" stroke="#3D5A54" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="350.0" cy="152.0" r="28" fill="#E3F3EF" stroke="#071318" stroke-width="1.8"/><circle cx="404.0" cy="128.0" r="17" fill="#E3F3EF" stroke="#071318" stroke-width="1.8"/><circle cx="440.0" cy="135.0" r="16" fill="#E3F3EF" stroke="#071318" stroke-width="1.8"/><circle cx="472.0" cy="150.0" r="15" fill="#F5DDA6" stroke="#071318" stroke-width="1.8"/><circle cx="500.0" cy="175.0" r="13" fill="#F5DDA6" stroke="#071318" stroke-width="1.8"/><circle cx="472.0" cy="150.0" r="15" fill="#E3F3EF" stroke="#071318" stroke-width="1.8"/><path d="M472 135 A15 15 0 0 1 472 165 Z" fill="#F5DDA6" stroke="#071318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="420.0" y="466.0" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">heel</text><circle cx="380.0" cy="300.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><circle cx="485.0" cy="300.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/></g><line x1="420.0" y1="300.0" x2="250.0" y2="300.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="244.0" y="304.0" font-size="13" font-weight="500" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Medial plantar nerve</text><text x="244.0" y="322.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">Medial 3.5 toes,</text><text x="244.0" y="337.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">medial two thirds of sole</text><line x1="525.0" y1="300.0" x2="600.0" y2="300.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="606.0" y="304.0" font-size="13" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Lateral plantar nerve</text><text x="606.0" y="322.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Lateral 1.5 toes,</text><text x="606.0" y="337.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">lateral third of sole</text><text x="40.0" y="130.0" font-size="12" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Medial plantar muscles (LAFF):</text><text x="40.0" y="148.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">1st Lumbrical, Abductor hallucis,</text><text x="40.0" y="163.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Flexor hallucis brevis,</text><text x="40.0" y="178.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Flexor digitorum brevis</text><text x="620.0" y="130.0" font-size="12" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">Lateral plantar:</text><text x="620.0" y="148.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">all other intrinsic muscles</text><text x="620.0" y="163.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">and the interossei</text><text x="400.0" y="524.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Both are terminal branches of the tibial nerve.</text></svg>