<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" role="img" aria-labelledby="t d"><title id="t">Three kidneys of the embryo</title><desc id="d">d</desc><rect width="800" height="388" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Three kidneys of the embryo</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">All arise from intermediate mesoderm</text><rect x="16.0" y="96.0" width="240.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="136.0" y="124.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pronephros (week 4)</text><text x="136.0" y="140.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">vestigial, cervical</text><rect x="280.0" y="96.0" width="240.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="124.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mesonephros</text><text x="400.0" y="140.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">transient; its duct persists</text><rect x="544.0" y="96.0" width="240.0" height="64.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="664.0" y="124.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Metanephros (week 5)</text><text x="664.0" y="140.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">permanent kidney</text><rect x="280.0" y="190.0" width="240.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="218.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mesonephric duct:</text><text x="400.0" y="234.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ductus deferens, epididymis</text><rect x="544.0" y="190.0" width="240.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="664.0" y="210.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ureteric bud:</text><text x="664.0" y="226.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ureter, pelvis, calyces,</text><text x="664.0" y="242.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">collecting ducts</text><rect x="544.0" y="284.0" width="240.0" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="664.0" y="312.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Metanephric mesenchyme:</text><text x="664.0" y="328.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">glomerulus to distal tubule</text><line x1="256.0" y1="128.0" x2="272.8" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M280.0 128.0 L271.7 131.5 L271.7 124.5 Z" fill="#3D5A54"/><line x1="520.0" y1="128.0" x2="536.8" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M544.0 128.0 L535.7 131.5 L535.7 124.5 Z" fill="#3D5A54"/><line x1="400.0" y1="160.0" x2="400.0" y2="182.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 190.0 L396.5 181.7 L403.5 181.7 Z" fill="#3D5A54"/><line x1="664.0" y1="160.0" x2="664.0" y2="182.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M664.0 190.0 L660.5 181.7 L667.5 181.7 Z" fill="#3D5A54"/><line x1="544.0" y1="128.0" x2="-10.0" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="-10.0" y1="128.0" x2="-10.0" y2="316.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="-10.0" y1="316.0" x2="534.8" y2="316.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M542.0 316.0 L533.7 319.5 L533.7 312.5 Z" fill="#3D5A54"/></svg>