<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Bishop score and cardinal movements of labour</title>
<desc id="d">The Bishop score sums five cervical features, each 0 to 3: dilatation, effacement, consistency, position and station. A total of 8 or more means a favourable cervix for induction. The cardinal movements run in order: engagement, descent, flexion, internal rotation, extension, restitution, external rotation, then expulsion. Ha's rule: levator ani recoil brings the occiput to the midline.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Is she ready? Bishop score + the road out</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Five features, 0 to 3 each; 8 or more is favourable for induction</text>
<text x="30" y="90" font-size="13" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">BISHOP SCORE</text>
<text x="252" y="90" font-size="11" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text>
<text x="326" y="90" font-size="11" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1</text>
<text x="400" y="90" font-size="11" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2</text>
<text x="466" y="90" font-size="11" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">3</text>
<rect x="30" y="100" width="450" height="38" rx="6" fill="#F4F8F6"/>
<text x="40" y="124" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Dilatation</text>
<text x="252" y="124" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">closed</text>
<text x="326" y="124" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1-2 cm</text>
<text x="400" y="124" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">3-4 cm</text>
<text x="466" y="124" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">5+ cm</text>
<rect x="30" y="142" width="450" height="38" rx="6" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1"/>
<text x="40" y="166" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Effacement</text>
<text x="252" y="166" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">0-30%</text>
<text x="326" y="166" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">40-50%</text>
<text x="400" y="166" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">60-70%</text>
<text x="466" y="166" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">80%+</text>
<rect x="30" y="184" width="450" height="38" rx="6" fill="#F4F8F6"/>
<text x="40" y="208" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Consistency</text>
<text x="252" y="208" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">firm</text>
<text x="326" y="208" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">medium</text>
<text x="400" y="208" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">soft</text>
<text x="466" y="208" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">-</text>
<rect x="30" y="226" width="450" height="38" rx="6" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1"/>
<text x="40" y="250" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Position</text>
<text x="252" y="250" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">posterior</text>
<text x="326" y="250" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">midline</text>
<text x="400" y="250" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">anterior</text>
<text x="466" y="250" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">-</text>
<rect x="30" y="268" width="450" height="38" rx="6" fill="#F4F8F6"/>
<text x="40" y="292" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Station</text>
<text x="252" y="292" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">-3</text>
<text x="326" y="292" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">-2</text>
<text x="400" y="292" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">-1, 0</text>
<text x="466" y="292" font-size="10.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">+1, +2</text>
<rect x="500" y="80" width="270" height="330" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="635" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CARDINAL MOVEMENTS</text>
<rect x="516" y="118" width="238" height="26" rx="13" fill="#F4F8F6"/>
<text x="635" y="136" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1 Engagement</text>
<rect x="516" y="150" width="238" height="26" rx="13" fill="#F4F8F6"/>
<text x="635" y="168" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2 Descent</text>
<rect x="516" y="182" width="238" height="26" rx="13" fill="#F4F8F6"/>
<text x="635" y="200" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">3 Flexion</text>
<rect x="516" y="214" width="238" height="26" rx="13" fill="#F4F8F6"/>
<text x="635" y="232" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4 Internal rotation</text>
<rect x="516" y="246" width="238" height="26" rx="13" fill="#F4F8F6"/>
<text x="635" y="264" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">5 Extension</text>
<rect x="516" y="278" width="238" height="26" rx="13" fill="#F4F8F6"/>
<text x="635" y="296" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">6 Restitution</text>
<rect x="516" y="310" width="238" height="26" rx="13" fill="#F4F8F6"/>
<text x="635" y="328" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">7 External rotation</text>
<rect x="516" y="342" width="238" height="26" rx="13" fill="#0B6B5B"/>
<text x="635" y="360" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">8 Expulsion</text>
<text x="635" y="396" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Ha's rule: levator recoil</text>
<text x="635" y="412" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">brings occiput to midline</text>
<rect x="30" y="322" width="450" height="52" rx="6" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.2"/>
<text x="255" y="344" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Total 8 or more: favourable, induce</text>
<text x="255" y="362" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Below 8: ripen the cervix first (prostaglandin, Foley).</text>
<rect x="30" y="386" width="740" height="52" rx="6" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.2"/>
<text x="400" y="408" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Read the cervix before the clock: an unripe cervix fails induction, not the uterus</text>
<text x="400" y="428" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Score every induction candidate; document dilatation, effacement, consistency, position, station.</text>
<text x="400" y="478" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Bishop is a readiness test, not a labour test: it predicts whether induction will work.</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Movements overlap in real labour; the exam wants them in this order.</text>
</svg>
