<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" role="img" aria-labelledby="t d"><title id="t">Male reproductive axis</title><desc id="d">d</desc><rect width="800" height="422" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Male reproductive axis</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Testosterone feeds back on GnRH and LH; inhibin B feeds back on FSH</text><rect x="235.0" y="96.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="128.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypothalamus: GnRH (pulsatile)</text><rect x="58.0" y="196.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="223.0" y="228.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior pituitary: LH</text><rect x="412.0" y="196.0" width="330.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="577.0" y="228.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior pituitary: FSH</text><rect x="58.0" y="296.0" width="330.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="223.0" y="328.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Leydig cells: testosterone</text><rect x="412.0" y="296.0" width="330.0" height="56.0" rx="8" fill="#DCEAF7" stroke="#3E6FA5" stroke-width="1.6"/><text x="577.0" y="320.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sertoli cells: spermatogenesis, inhibin</text><text x="577.0" y="336.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">B, AMH</text><line x1="400.0" y1="152.0" x2="230.0" y2="194.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M223.0 196.0 L230.2 190.6 L231.9 197.4 Z" fill="#3D5A54"/><line x1="400.0" y1="152.0" x2="570.0" y2="194.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M577.0 196.0 L568.1 197.4 L569.8 190.6 Z" fill="#3D5A54"/><line x1="223.0" y1="252.0" x2="223.0" y2="288.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M223.0 296.0 L219.5 287.7 L226.5 287.7 Z" fill="#3D5A54"/><line x1="577.0" y1="252.0" x2="577.0" y2="288.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M577.0 296.0 L573.5 287.7 L580.5 287.7 Z" fill="#3D5A54"/><text x="400.0" y="404.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Spermatogenesis takes about 74 days and needs a temperature below core body temperature.</text></svg>