<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Zones of the prostate (McNeal)</title><desc id="d">Axial diagram of the prostate with urethra in the centre, transition zone around it (benign prostatic hyperplasia), central zone around the ejaculatory ducts, peripheral zone at the back (most cancers, palpable on rectal examination) and anterior fibromuscular stroma in front.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Zones of the prostate (McNeal)</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Axial section: front at the top, rectum below</text><ellipse cx="400.0" cy="260.0" rx="190" ry="130" fill="#F1C6C0" stroke="#071318" stroke-width="2.4"/><path d="M225 280 C250 360 550 360 575 280 C520 300 280 300 225 280 Z" fill="#E8B6A8" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="400.0" cy="240.0" rx="90" ry="60" fill="#F5DDA6" stroke="#071318" stroke-width="1.8"/><path d="M330 290 L470 290 L430 270 L370 270 Z" fill="#BFE3D6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="400.0" cy="230.0" rx="18" ry="24" fill="#FFFFFF" stroke="#071318" stroke-width="2"/><circle cx="386.0" cy="282.0" r="4" fill="#071318" stroke="#071318" stroke-width="0"/><circle cx="414.0" cy="282.0" r="4" fill="#071318" stroke="#071318" stroke-width="0"/><line x1="400.0" y1="224.0" x2="640.0" y2="241.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="400.0" cy="224.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="645.0" y="245.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Urethra</text><line x1="250.0" y1="320.0" x2="220.0" y2="426.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="250.0" cy="320.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="215.0" y="430.0" font-size="12.5" font-weight="500" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Peripheral zone</text><text x="215.0" y="448.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">most cancers, felt on DRE</text><line x1="420.0" y1="282.0" x2="600.0" y2="426.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="420.0" cy="282.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="605.0" y="430.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Central zone</text><text x="605.0" y="448.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">around ejaculatory ducts</text><line x1="460.0" y1="220.0" x2="640.0" y2="156.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="460.0" cy="220.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="645.0" y="160.0" font-size="12.5" font-weight="500" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Transition zone</text><text x="645.0" y="178.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">benign hyperplasia (BPH)</text><line x1="280.0" y1="165.0" x2="215.0" y2="96.2" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><circle cx="280.0" cy="165.0" r="2.6" fill="#071318" stroke="#071318" stroke-width="0"/><text x="210.0" y="100.0" font-size="12.5" font-weight="500" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Anterior fibromuscular</text><text x="210.0" y="116.0" font-size="12.5" font-weight="500" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">stroma</text><text x="400.0" y="495.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Peripheral zone is the largest; transition zone surrounds the urethra and presses on it in BPH.</text></svg>