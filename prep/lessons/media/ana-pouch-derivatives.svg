<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d"><title id="t">Pharyngeal pouch derivatives</title><desc id="d">Table of pharyngeal pouch derivatives: first pouch middle ear and auditory tube, second palatine tonsil, third inferior parathyroid and thymus, fourth superior parathyroid; DiGeorge syndrome results from failure of the third and fourth pouches.</desc><rect width="800" height="360" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pharyngeal pouch derivatives</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Inferior parathyroid is from the higher pouch: its migration crosses the superior one</text><text x="122.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Pouch</text><text x="493.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Becomes</text><rect x="47.0" y="100.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="122.0" y="128.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">First</text><line x1="200.0" y1="124.0" x2="223.6" y2="124.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 124.0 L222.6 127.1 L222.6 120.9 Z" fill="#3D5A54"/><rect x="233.0" y="100.0" width="520.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="493.0" y="128.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Middle ear cavity, mastoid antrum, auditory tube</text><rect x="47.0" y="160.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="122.0" y="188.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Second</text><line x1="200.0" y1="184.0" x2="223.6" y2="184.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 184.0 L222.6 187.1 L222.6 180.9 Z" fill="#3D5A54"/><rect x="233.0" y="160.0" width="520.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="493.0" y="188.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Palatine tonsil (epithelial lining)</text><rect x="47.0" y="220.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="122.0" y="248.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Third</text><line x1="200.0" y1="244.0" x2="223.6" y2="244.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 244.0 L222.6 247.1 L222.6 240.9 Z" fill="#3D5A54"/><rect x="233.0" y="220.0" width="520.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="493.0" y="248.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Inferior parathyroid (dorsal), thymus (ventral)</text><rect x="47.0" y="280.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="122.0" y="308.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Fourth</text><line x1="200.0" y1="304.0" x2="223.6" y2="304.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M230.0 304.0 L222.6 307.1 L222.6 300.9 Z" fill="#3D5A54"/><rect x="233.0" y="280.0" width="520.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="493.0" y="308.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Superior parathyroid (+ C cells via ultimobranchial body)</text></svg>