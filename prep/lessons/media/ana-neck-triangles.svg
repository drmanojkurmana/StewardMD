<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Triangles of the neck</title><desc id="d">d</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Triangles of the neck</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Right lateral view: face to the left</text><path d="M150 120 L720 120 L700 380 L150 380 Z" fill="#F4FAF8" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 120 L650 120 L310 380 L255 380 Z" fill="#E7B9B0" stroke="#071318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="250.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sternocleidomastoid</text><line x1="255.0" y1="380.0" x2="700.0" y2="380.0" stroke="#BDB39F" stroke-width="8" stroke-linecap="round"/><text x="400.0" y="402.0" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Clavicle</text><text x="150.0" y="108.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Mandible (above)</text><line x1="700.0" y1="120.0" x2="700.0" y2="380.0" stroke="#BDB39F" stroke-width="5" stroke-linecap="round"/><text x="712.0" y="250.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Trapezius</text><path d="M420 380 L700 290" fill="none" stroke="#B7791F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600.0" y="330.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">omohyoid</text><text x="260.0" y="170.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">ANTERIOR triangle</text><text x="260.0" y="190.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">carotid sheath, submandibular</text><text x="260.0" y="205.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">gland, thyroid, hyoid muscles</text><text x="610.0" y="165.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">POSTERIOR triangle</text><text x="610.0" y="183.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">accessory nerve, cervical</text><text x="610.0" y="197.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">plexus branches</text><text x="560.0" y="362.0" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">supraclavicular part</text><text x="400.0" y="450.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Anterior triangle: midline, mandible, sternocleidomastoid. Posterior: sternocleidomastoid, trapezius, clavicle.</text></svg>