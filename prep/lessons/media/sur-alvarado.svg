<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Alvarado score (MANTRELS): 10 points, 7 or more means operate</title> <desc id="d">Eight MANTRELS parameters sum to 10 points: RLQ tenderness 2 and leukocytosis 2, each other item 1. A score of 7 or more is high probability for surgery. Contrast CT over 6 mm confirms with sensitivity above 95 percent.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Alvarado (MANTRELS): 10 points, 7+ means operate</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Tenderness and leukocytosis carry double weight; the rest score 1 each</text> <g font-family="system-ui,sans-serif"> <rect x="60" y="80" width="360" height="40" rx="10" fill="#071318"/><text x="76" y="105" font-size="13" font-weight="700" fill="#FFFFFF">M Migration periumbilical to RLQ</text><text x="404" y="105" font-size="13" font-weight="700" text-anchor="end" fill="#42CDB5">1</text> <rect x="60" y="126" width="360" height="40" rx="10" fill="#071318"/><text x="76" y="151" font-size="13" font-weight="700" fill="#FFFFFF">A Anorexia</text><text x="404" y="151" font-size="13" font-weight="700" text-anchor="end" fill="#42CDB5">1</text> <rect x="60" y="172" width="360" height="40" rx="10" fill="#071318"/><text x="76" y="197" font-size="13" font-weight="700" fill="#FFFFFF">N Nausea or vomiting</text><text x="404" y="197" font-size="13" font-weight="700" text-anchor="end" fill="#42CDB5">1</text> <rect x="60" y="218" width="360" height="40" rx="10" fill="#0B6B5B"/><text x="76" y="243" font-size="13" font-weight="700" fill="#FFFFFF">T Tenderness maximal at McBurney</text><text x="404" y="243" font-size="13" font-weight="700" text-anchor="end" fill="#FFFFFF">2</text> <rect x="60" y="264" width="360" height="40" rx="10" fill="#071318"/><text x="76" y="289" font-size="13" font-weight="700" fill="#FFFFFF">R Rebound (peritoneal irritation)</text><text x="404" y="289" font-size="13" font-weight="700" text-anchor="end" fill="#42CDB5">1</text> <rect x="60" y="310" width="360" height="40" rx="10" fill="#071318"/><text x="76" y="335" font-size="13" font-weight="700" fill="#FFFFFF">E Temperature at least 37.3 C</text><text x="404" y="335" font-size="13" font-weight="700" text-anchor="end" fill="#42CDB5">1</text> <rect x="60" y="356" width="360" height="40" rx="10" fill="#0B6B5B"/><text x="76" y="381" font-size="13" font-weight="700" fill="#FFFFFF">L Leukocytosis over 10,000 /uL</text><text x="404" y="381" font-size="13" font-weight="700" text-anchor="end" fill="#FFFFFF">2</text> <rect x="60" y="402" width="360" height="40" rx="10" fill="#071318"/><text x="76" y="427" font-size="13" font-weight="700" fill="#FFFFFF">S Shift to the left (neutrophilia)</text><text x="404" y="427" font-size="13" font-weight="700" text-anchor="end" fill="#42CDB5">1</text> </g> <rect x="450" y="80" width="290" height="120" rx="12" fill="#B7791F"/><text x="595" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">TOTAL 10 POINTS</text><text x="595" y="140" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">7 or more: high probability</text><text x="595" y="164" font-size="15" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">book the operation</text> <rect x="450" y="212" width="290" height="150" rx="12" fill="#071318"/><text x="595" y="242" font-size="13" font-weight="700" text-anchor="middle" fill="#42CDB5" font-family="system-ui,sans-serif">CT CONFIRMS (sensitivity over 95%)</text><text x="595" y="268" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">diameter over 6 mm</text><text x="595" y="290" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">wall thickening, fat stranding</text><text x="595" y="322" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">1 + 1 + 1 + 2 + 1 + 1 + 2 + 1 = 10</text> <text x="400" y="482" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Two double-weight items (T and L): miss them and a 6 becomes an 8.</text> <text x="400" y="503" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">McBurney tenderness plus a left shift already puts the patient at 3.</text> </svg>
