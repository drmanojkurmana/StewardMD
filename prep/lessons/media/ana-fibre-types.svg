<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Three classes of white matter fibres</title><desc id="d">Coronal brain schematic showing three fibre classes: commissural fibres crossing in the corpus callosum, association fibres arching within one hemisphere, and projection fibres running through the internal capsule to the brainstem.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Three classes of white matter fibres</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Coronal section of the cerebrum</text><ellipse cx="400.0" cy="240.0" rx="250" ry="150" fill="#F4FAF8" stroke="#071318" stroke-width="2.2"/><line x1="400.0" y1="90.0" x2="400.0" y2="195.0" stroke="#071318" stroke-width="2.2" stroke-linecap="round"/><path d="M250 205 C320 190 480 190 550 205" fill="none" stroke="#B7791F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><text x="400.0" y="178.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Corpus callosum</text><path d="M455 160 C520 130 580 170 590 215" fill="none" stroke="#0B6B5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M485 160 C530 130 590 170 590 195" fill="none" stroke="#0B6B5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M234 140 C267 200 292 240 330 285" fill="none" stroke="#B3382C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 140 C285 200 310 240 330 285" fill="none" stroke="#B3382C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="330.0" y1="285.0" x2="335.0" y2="395.0" stroke="#B3382C" stroke-width="4" stroke-linecap="round"/><path d="M306 140 C303 200 328 240 330 285" fill="none" stroke="#B3382C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="335.0" y1="360.0" x2="335.0" y2="401.2" stroke="#B3382C" stroke-width="4" stroke-linecap="round"/><path d="M335.0 410.0 L330.7 399.9 L339.3 399.9 Z" fill="#B3382C"/><rect x="40.0" y="430.0" width="230.0" height="66.0" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.6"/><text x="155.0" y="453.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Commissural</text><text x="155.0" y="467.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">corpus callosum,</text><text x="155.0" y="481.1" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">anterior commissure</text><rect x="285.0" y="430.0" width="230.0" height="66.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="453.4" font-size="11" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Association</text><text x="400.0" y="466.9" font-size="11" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">within one hemisphere</text><text x="400.0" y="480.3" font-size="11" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(SLF, uncinate, cingulum)</text><rect x="530.0" y="430.0" width="230.0" height="66.0" rx="8" fill="#FFFFFF" stroke="#B3382C" stroke-width="1.6"/><text x="645.0" y="453.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Projection</text><text x="645.0" y="467.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">corona radiata,</text><text x="645.0" y="481.1" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">internal capsule</text><text x="250.0" y="262.0" font-size="12" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">projection</text><text x="560.0" y="135.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">association</text></svg>