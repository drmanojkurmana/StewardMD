<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" role="img" aria-labelledby="t d"><title id="t">Airway epithelium by level</title><desc id="d">d</desc><rect width="800" height="368" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Airway epithelium by level</text><text x="104.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Level</text><text x="380.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Lining</text><text x="676.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Support</text><rect x="19.0" y="100.0" width="170.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="104.0" y="129.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Trachea and bronchi</text><line x1="192.0" y1="125.0" x2="215.6" y2="125.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M222.0 125.0 L214.6 128.1 L214.6 121.9 Z" fill="#3D5A54"/><rect x="225.0" y="100.0" width="310.0" height="50.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="380.0" y="121.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pseudostratified ciliated columnar with</text><text x="380.0" y="137.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">goblet cells</text><line x1="538.0" y1="125.0" x2="561.6" y2="125.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M568.0 125.0 L560.6 128.1 L560.6 121.9 Z" fill="#3D5A54"/><rect x="571.0" y="100.0" width="210.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="676.0" y="121