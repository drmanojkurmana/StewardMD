<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Why the median cubital vein is used for venepuncture</title><desc id="d">Layered cross-section at the front of the elbow: skin, superficial fascia with the median cubital vein, bicipital aponeurosis, then the brachial artery and median nerve deep to the aponeurosis.</desc><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Why the median cubital vein is used for venepuncture</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Layers from skin (top) to deep, at the cubital fossa</text><rect x="90.0" y="90.0" width="620.0" height="70.0" rx="4" fill="#F4FAF8" stroke="#071318" stroke-width="1.6"/><text x="400.0" y="130.0" font-size="14" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Skin</text><rect x="90.0" y="160.0" width="620.0" height="62.0" rx="4" fill="#DCEAF7" stroke="#071318" stroke-width="1.6"/><text x="400.0" y="196.0" font-size="14" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Superficial fascia with median cubital vein</text><rect x="90.0" y="222.0" width="620.0" height="52.0" rx="4" fill="#FFF1CC" stroke="#071318" stroke-width="1.6"/><text x="400.0" y="253.0" font-size="14" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bicipital aponeurosis (barrier)</text><rect x="90.0" y="274.0" width="620.0" height="70.0" rx="4" fill="#FBE3E0" stroke="#071318" stroke-width="1.6"/><text x="400.0" y="314.0" font-size="14" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Deep: brachial artery and median nerve, biceps tendon</text><rect x="90.0" y="344.0" width="620.0" height="56.0" rx="4" fill="#E3F3EF" stroke="#071318" stroke-width="1.6"/><text x="400.0" y="377.0" font-size="14" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Brachialis (floor)</text><text x="400.0" y="440.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Vein sits above the aponeurosis, so the artery and nerve are protected from the needle.</text><circle cx="150.0" cy="191.0" r="12" fill="#3E6FA5" stroke="#071318" stroke-width="1.6"/><circle cx="150.0" cy="309.0" r="13" fill="#B3382C" stroke="#071318" stroke-width="1.6"/><circle cx="195.0" cy="312.0" r="10" fill="#E8C547" stroke="#071318" stroke-width="1.6"/></svg>