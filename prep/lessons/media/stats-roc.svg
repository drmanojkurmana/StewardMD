<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Receiver operating characteristic curves</title><desc id="d">ROC plot with a chance diagonal at AUC 0.50, a weaker test around AUC 0.65 and a better test around AUC 0.90, closer to the top left corner.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Receiver operating characteristic (ROC) curve</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Every possible cut-off of one test, plotted as sensitivity against 1 − specificity</text><line x1="150" y1="410" x2="630" y2="410" stroke="#071318" stroke-width="2"/><line x1="150" y1="410" x2="150" y2="130" stroke="#071318" stroke-width="2"/><line x1="150" y1="410" x2="630" y2="130" stroke="#3D5A54" stroke-width="2" stroke-dasharray="6 5"/><path d="M150.0 410.0 L170.0 308.7 L190.0 283.6 L210.0 266.1 L230.0 252.2 L250.0 240.5 L270.0 230.3 L290.0 221.2 L310.0 213.0 L330.0 205.4 L350.0 198.4 L370.0 191.9 L390.0 185.7 L410.0 179.9 L430.0 174.4 L450.0 169.1 L470.0 164.1 L490.0 159.3 L510.0 154.6 L530.0 150.2 L550.0 145.9 L570.0 141.7 L590.0 137.7 L610.0 133.8 L630.0 130.0" fill="none" stroke="#0B6B5B" stroke-width="3.5"/><path d="M150.0 410.0 L170.0 381.6 L190.0 363.2 L210.0 347.3 L230.0 332.9 L250.0 319.5 L270.0 306.8 L290.0 294.7 L310.0 283.1 L330.0 271.8 L350.0 260.9 L370.0 250.3 L390.0 240.0 L410.0 229.9 L430.0 220.1 L450.0 210.4 L470.0 200.9 L490.0 191.6 L510.0 182.4 L530.0 173.3 L550.0 164.4 L570.0 155.7 L590.0 147.0 L610.0 138.4 L630.0 130.0" fill="none" stroke="#B7791F" stroke-width="3"/><text x="622" y="156" font-size="13" font-weight="700" text-anchor="end" fill="#0B6B5B" font-family="system-ui,sans-serif">better test: AUC ≈ 0.90</text><text x="622" y="290" font-size="13" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">weaker test: AUC ≈ 0.65</text><text x="340" y="188" font-size="12.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">chance: AUC = 0.50</text><text x="390" y="444" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1 − specificity (false positive rate)</text><text x="102" y="270" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 102 270)">sensitivity (true positive rate)</text><text x="150" y="444" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="630" y="444" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1</text><text x="136" y="410" font-size="11" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="136" y="130" font-size="11" font-weight="400" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">1</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Area under the curve (AUC) summarises discrimination: 1.0 is perfect, 0.5 is useless.</text></svg>
