<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Two by two table with sensitivity, specificity and predictive values</title><desc id="d">A two by two table with 80 true positives, 20 false negatives, 10 false positives and 90 true negatives. Sensitivity 80 percent, specificity 90 percent, positive predictive value 88.9 percent, negative predictive value 81.8 percent.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The 2 × 2 table: sensitivity, specificity, predictive values</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">One test in 200 patients: 100 with the disease, 100 without</text><text x="285" y="112" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Disease present</text><text x="445" y="112" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Disease absent</text><text x="196" y="168" font-size="13.5" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Test +</text><text x="196" y="264" font-size="13.5" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Test −</text><rect x="210" y="124" width="150" height="86" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="285" y="164" font-size="21" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">TP = 80</text><text x="285" y="188" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">true positive</text><rect x="370" y="124" width="150" height="86" fill="#EAF3F0" stroke="#B42318" stroke-width="2.5"/><text x="445" y="164" font-size="21" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">FP = 10</text><text x="445" y="188" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">false positive</text><rect x="210" y="220" width="150" height="86" fill="#EAF3F0" stroke="#B42318" stroke-width="2.5"/><text x="285" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">FN = 20</text><text x="285" y="284" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">false negative</text><rect x="370" y="220" width="150" height="86" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="445" y="260" font-size="21" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">TN = 90</text><text x="445" y="284" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">true negative</text><text x="285" y="336" font-size="12" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">100 diseased</text><text x="445" y="336" font-size="12" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">100 not diseased</text><text x="560" y="168" font-size="12" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">90 test positive</text><text x="560" y="264" font-size="12" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">110 test negative</text><text x="210" y="392" font-size="13.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Sensitivity = TP/(TP+FN) = 80/100 = 80%</text><text x="210" y="420" font-size="13.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">Specificity = TN/(TN+FP) = 90/100 = 90%</text><text x="210" y="448" font-size="13.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">PPV = TP/(TP+FP) = 80/90 = 88.9%</text><text x="210" y="476" font-size="13.5" font-weight="700" text-anchor="start" fill="#B7791F" font-family="system-ui,sans-serif">NPV = TN/(TN+FN) = 90/110 = 81.8%</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sensitivity and specificity belong to the test; predictive values move with prevalence.</text></svg>
