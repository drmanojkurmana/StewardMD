<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" role="img" aria-labelledby="t d"><title id="t">Nondisjunction in meiosis</title><desc id="d">Outcomes of nondisjunction: normal meiosis gives four normal gametes; nondisjunction in meiosis I gives four abnormal gametes, two with an extra chromosome and two missing one; nondisjunction in meiosis II gives two normal gametes, one with an extra and one missing.</desc><rect width="800" height="388" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nondisjunction in meiosis</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">n = haploid chromosome number; n+1 gives trisomy at fertilisation, n-1 gives monosomy</text><rect x="30.0" y="100.0" width="230.7" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="145.3" y="136.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal meiosis</text><rect x="284.7" y="100.0" width="230.7" height="64.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="128.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nondisjunction</text><text x="400.0" y="144.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">in meiosis I</text><rect x="539.3" y="100.0" width="230.7" height="64.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="654.7" y="128.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nondisjunction</text><text x="654.7" y="144.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">in meiosis II</text><rect x="30.0" y="224.0" width="230.7" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="145.3" y="252.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Four gametes: n</text><text x="145.3" y="268.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(all normal)</text><rect x="284.7" y="224.0" width="230.7" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="252.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Two gametes n+1</text><text x="400.0" y="268.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Two gametes n-1</text><rect x="539.3" y="224.0" width="230.7" height="64.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="654.7" y="252.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Two gametes n</text><text x="654.7" y="268.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">One n+1, one n-1</text><line x1="145.3" y1="164.0" x2="145.3" y2="216.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M145.3 224.0 L141.8 215.7 L148.8 215.7 Z" fill="#3D5A54"/><line x1="400.0" y1="164.0" x2="400.0" y2="216.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 224.0 L396.5 215.7 L403.5 215.7 Z" fill="#3D5A54"/><line x1="654.7" y1="164.0" x2="654.7" y2="216.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M654.7 224.0 L651.2 215.7 L658.2 215.7 Z" fill="#3D5A54"/><text x="400.0" y="340.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Trisomy 21 (Down syndrome) is most often from maternal meiosis I nondisjunction.</text><text x="400.0" y="370.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Risk rises with maternal age.</text></svg>