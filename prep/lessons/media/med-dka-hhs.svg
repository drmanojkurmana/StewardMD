<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Sugar crises: DKA vs HHS</title><desc id="d">DKA vomits with Kussmaul breath and fruity ketones and resolves with fluids, potassium then insulin; HHS is drowsy and hyperosmolar and corrects slow.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sugar crises: DKA vs HHS</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fluids and potassium first, insulin after</text><rect x="30.0" y="80.0" width="355.0" height="220.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="207.5" y="172.2" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">DKA: vomiting, Kussmaul, fruity. Fluids +</text><text x="207.5" y="186.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">potassium, then insulin. Check</text><text x="207.5" y="201.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">beta-hydroxybutyrate. Metformin first fails</text><text x="207.5" y="216.2" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">here.</text><rect x="415.0" y="80.0" width="355.0" height="220.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="592.5" y="179.6" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HHS: drowsy, very high osmolarity. Slow</text><text x="592.5" y="194.2" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">correction, gentle fluids. Watch the brain as</text><text x="592.5" y="208.8" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">water returns.</text><text x="400.0" y="345.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">SGLT2 with normal sugar can still keto: check ketones.</text><text x="400.0" y="367.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Hypos warn drivers. Sick-day rules: never stop basal.</text></svg>