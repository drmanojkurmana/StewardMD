<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t d"><title id="t">Atrial septation</title><desc id="d">Flow diagram of atrial septation: septum primum grows down, the ostium primum closes, perforations form the ostium secundum, septum secundum grows beside it leaving the foramen ovale, which acts as a one-way flap.</desc><rect width="800" height="490" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Atrial septation</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fetal blood passes right atrium to left atrium through the foramen ovale</text><rect x="190.0" y="92.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="114.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Septum primum grows</text><text x="400.0" y="130.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">downwards from the roof</text><rect x="190.0" y="174.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="196.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ostium primum closes against</text><text x="400.0" y="212.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">the endocardial cushions</text><rect x="190.0" y="256.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="278.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Perforations join to form</text><text x="400.0" y="294.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">the ostium secundum</text><rect x="190.0" y="338.0" width="420.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="360.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Septum secundum grows to the right</text><text x="400.0" y="376.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">of the primum, leaving the foramen ovale</text><line x1="400.0" y1="144.0" x2="400.0" y2="166.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 174.0 L396.5 165.7 L403.5 165.7 Z" fill="#3D5A54"/><line x1="400.0" y1="226.0" x2="400.0" y2="248.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 256.0 L396.5 247.7 L403.5 247.7 Z" fill="#3D5A54"/><line x1="400.0" y1="308.0" x2="400.0" y2="330.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 338.0 L396.5 329.7 L403.5 329.7 Z" fill="#3D5A54"/><text x="400.0" y="442.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">After birth the left atrial pressure rises, the flap fuses: fossa ovalis.</text><text x="400.0" y="472.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Persistent opening: patent foramen ovale or atrial septal defect.</text></svg>