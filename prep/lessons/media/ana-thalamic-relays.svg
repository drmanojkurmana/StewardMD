<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Thalamic nuclei as relays</title><desc id="d">Table-style diagram linking each thalamic nucleus to its inputs and cortical targets: VPL to somatosensory cortex, VPM to face and taste, VL to motor cortex, VA to premotor cortex, LGN to visual cortex, MGN to auditory cortex, anterior nucleus to cingulate gyrus, dorsomedial to prefrontal cortex.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thalamic nuclei as relays</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">All relay nuclei project to cortex; the reticular nucleus does not</text><text x="144.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Input</text><text x="400.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Thalamic nucleus</text><text x="656.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cortical target</text><rect x="19.0" y="100.0" width="250.0" height="38.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="144.0" y="123.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Medial lemniscus, spinothalamic</text><line x1="272.0" y1="119.0" x2="295.6" y2="119.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M302.0 119.0 L294.6 122.1 L294.6 115.9 Z" fill="#3D5A54"/><rect x="305.0" y="100.0" width="190.0" height="38.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="123.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="sys