<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" role="img" aria-labelledby="t d"><title id="t">Beta-1 stimulation and phospholamban</title><desc id="d">Phospholamban regulation of the cardiac sarcoplasmic reticulum: beta-1 stimulation raises cAMP and protein kinase A, which phosphorylates phospholamban, relieving its inhibition of the SERCA calcium pump, so calcium is taken up faster for quicker relaxation and larger stores for stronger contraction.</desc><rect width="800" height="488" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Beta-1 stimulation and phospholamban</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Unphosphorylated phospholamban inhibits SERCA</text><rect x="250.0" y="92.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="114.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Beta-1 receptor activated</text><text x="400.0" y="130.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(noradrenaline)</text><rect x="250.0" y="168.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="198.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Gs: cAMP up, protein kinase A active</text><rect x="250.0" y="244.0" width="300.0" height="52.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="266.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Phospholamban phosphorylated:</text><text x="400.0" y="282.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">SERCA inhibition lifted</text><rect x="88.0" y="320.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="238.0" y="342.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Faster Ca2+ uptake into the</text><text x="238.0" y="358.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">sarcoplasmic reticulum</text><rect x="412.0" y="320.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="562.0" y="342.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">L-type Ca2+ channels</text><text x="562.0" y="358.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">phosphorylated: more entry</text><rect x="250.0" y="396.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="418.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Faster relaxation (lusitropy) and</text><text x="400.0" y="434.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">stronger contraction</text><line x1="400.0" y1="144.0" x2="400.0" y2="160.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 168.0 L396.5 159.7 L403.5 159.7 Z" fill="#3D5A54"/><line x1="400.0" y1="220.0" x2="400.0" y2="236.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 244.0 L396.5 235.7 L403.5 235.7 Z" fill="#3D5A54"/><line x1="400.0" y1="296.0" x2="245.1" y2="318.9" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 320.0 L245.7 315.3 L246.7 322.3 Z" fill="#3D5A54"/><line x1="550.0" y1="194.0" x2="738.0" y2="194.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="738.0" y1="194.0" x2="738.0" y2="346.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><line x1="738.0" y1="346.0" x2="721.2" y2="346.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M714.0 346.0 L722.3 342.5 L722.3 349.5 Z" fill="#3D5A54"/><line x1="238.0" y1="372.0" x2="392.9" y2="394.9" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 396.0 L391.3 398.3 L392.3 391.3 Z" fill="#3D5A54"/><line x1="562.0" y1="372.0" x2="407.1" y2="394.9" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 396.0 L407.7 391.3 L408.7 398.3 Z" fill="#3D5A54"/></svg>