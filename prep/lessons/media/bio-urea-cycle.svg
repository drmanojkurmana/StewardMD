<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">The urea cycle and its cost</title><desc id="d">The ornithine cycle in order: ornithine plus ammonia and bicarbonate enter through carbamoyl phosphate synthetase I using 2 ATP with obligate N acetylglutamate activation, then ornithine transcarbamylase gives citrulline; argininosuccinate synthetase adds aspartate and converts ATP to AMP plus pyrophosphate; argininosuccinate lyase releases fumarate to give arginine; arginase releases urea and regenerates ornithine. Each turn costs 4 high energy phosphates.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">The urea cycle and its cost</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">One turn clears 2 nitrogens as urea at a cost of 4 high energy bonds</text><rect x="135.0" y="244.0" width="150.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="210.0" y="274.7" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ornithine</text><rect x="325.0" y="114.0" width="150.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="144.7" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Citrulline</text><rect x="515.0" y="244.0" width="150.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="590.0" y="266.5" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Arginino-</text><text x="590.0" y="283.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">succinate</text><rect x="325.0" y="374.0" width="150.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="404.7" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Arginine</text><line x1="210.0" y1="244.0" x2="319.7" y2="169.6" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M325.0 166.0 L320.7 172.7 L317.2 167.6 Z" fill="#3D5A54"/><text x="255.5" y="203.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#0B6B5B" font-family="system-ui,sans-serif">CPS-I + OTC</text><text x="255.5" y="220.0" font-size="11.5" font-weight="500" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">NH3 + HCO3, 2 ATP, NAG needed</text><line x1="475.0" y1="166.0" x2="584.7" y2="240.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M590.0 244.0 L582.2 242.4 L585.7 237.3 Z" fill="#3D5A54"/><text x="544.5" y="203.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">ASS</text><text x="544.5" y="220.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">+ aspartate, ATP to AMP</text><line x1="590.0" y1="296.0" x2="480.3" y2="370.4" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M475.0 374.0 L479.3 367.3 L482.8 372.4 Z" fill="#3D5A54"/><text x="544.5" y="333.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">ASL</text><text x="544.5" y="350.0" font-size="11.5" font-weight="500" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">releases fumarate</text><line x1="325.0" y1="374.0" x2="215.3" y2="299.6" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M210.0 296.0 L217.8 297.6 L214.3 302.7 Z" fill="#3D5A54"/><text x="255.5" y="333.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#0B6B5B" font-family="system-ui,sans-serif">arginase</text><text x="255.5" y="350.0" font-size="11.5" font-weight="500" text-anchor="end" fill="#3D5A54" font-family="system-ui,sans-serif">releases urea</text><text x="400.0" y="262.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cost per turn:</text><text x="400.0" y="284.0" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">4 high energy bonds</text><text x="400.0" y="492.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">CPS-I is rate limiting; arginine switches on NAG synthase after a protein meal.</text></svg>