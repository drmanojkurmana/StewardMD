<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Type IV hypersensitivity timeline peaking at 48 to 72 hours</title> <desc id="d">Horizontal timeline from exposure at 0 hours through 24, 48 and 72 hours, with induration rising to a peak at 48 to 72 hours. Memory Th1 cells secrete interferon gamma, recruiting macrophages. Examples: tuberculin test and contact dermatitis.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Type IV: delayed, T-cell mediated, peaks 48 to 72 h</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Memory Th1 cells secrete IFN-gamma, macrophages gather, induration follows</text> <line x1="80" y1="300" x2="560" y2="300" stroke="#071318" stroke-width="2"/> <line x1="80" y1="292" x2="80" y2="308" stroke="#071318" stroke-width="2"/> <text x="80" y="328" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">0 h</text> <text x="80" y="346" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">exposure</text> <line x1="240" y1="292" x2="240" y2="308" stroke="#071318" stroke-width="2"/> <text x="240" y="328" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">24 h</text> <text x="240" y="346" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Th1 recall</text> <line x1="400" y1="292" x2="400" y2="308" stroke="#071318" stroke-width="2"/> <text x="400" y="328" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">48 h</text> <text x="400" y="346" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">induration</text> <line x1="560" y1="292" x2="560" y2="308" stroke="#071318" stroke-width="2"/> <text x="560" y="328" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">72 h</text> <text x="560" y="346" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">peak, then wanes</text> <path d="M80 300 C 160 296, 220 280, 280 240 C 340 200, 380 140, 440 130 C 480 125, 520 140, 560 170" fill="none" stroke="#0B6B5B" stroke-width="3.5"/> <circle cx="440" cy="130" r="5" fill="#B7791F"/> <text x="440" y="108" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">peak 48-72 h</text> <rect x="80" y="380" width="220" height="70" rx="12" fill="#071318"/> <text x="190" y="406" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Tuberculin test</text> <text x="190" y="428" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">read induration at 48-72 h</text> <rect x="320" y="380" width="220" height="70" rx="12" fill="#071318"/> <text x="430" y="406" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Contact dermatitis</text> <text x="430" y="428" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">e.g. nickel, poison ivy</text> <rect x="580" y="80" width="180" height="180" rx="12" fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="7 5"/> <text x="670" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">NOT type IV</text> <text x="670" y="130" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Graves disease:</text> <text x="670" y="150" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">type II stimulatory</text> <text x="670" y="170" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(called type V)</text> <text x="670" y="198" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Shwartzman reaction:</text> <text x="670" y="218" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">endotoxin prime +</text> <text x="670" y="238" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">second challenge</text> <text x="160" y="120" font-size="12.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">No antibody involved: cells, not serum, transfer it.</text> <text x="160" y="142" font-size="12.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">Macrophages, not neutrophils, dominate the infiltrate.</text> <text x="400" y="480" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Read left to right: slow rise over days, not minutes like type I anaphylaxis.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Mantoux read at 48 to 72 hours: measure induration, not redness.</text> </svg>
