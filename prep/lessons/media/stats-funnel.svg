<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Funnel plot for publication bias</title><desc id="d">Funnel plot with a pooled effect centre line, precise studies clustered near the top and scattered small studies below, with a gap where small negative studies are missing.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Funnel plot: looking for publication bias</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Small imprecise studies scatter widely; missing small negative studies leave a gap</text><path d="M400 120 L250 400 L550 400 Z" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><line x1="400" y1="106" x2="400" y2="400" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="6 4"/><text x="400" y="96" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">pooled effect</text><circle cx="397.7" cy="136.0" r="5" fill="#0B6B5B"/><circle cx="349.1" cy="215.2" r="5" fill="#0B6B5B"/><circle cx="378.9" cy="354.6" r="5" fill="#0B6B5B"/><circle cx="394.9" cy="267.4" r="5" fill="#0B6B5B"/><circle cx="368.0" cy="256.0" r="5" fill="#0B6B5B"/><circle cx="419.6" cy="191.5" r="5" fill="#0B6B5B"/><circle cx="391.1" cy="171.7" r="5" fill="#0B6B5B"/><circle cx="456.1" cy="285.4" r="5" fill="#0B6B5B"/><circle cx="347.2" cy="233.2" r="5" fill="#0B6B5B"/><circle cx="421.5" cy="191.3" r="5" fill="#0B6B5B"/><circle cx="409.4" cy="286.5" r="5" fill="#0B6B5B"/><circle cx="360.7" cy="257.6" r="5" fill="#0B6B5B"/><circle cx="432.9" cy="214.2" r="5" fill="#0B6B5B"/><circle cx="385.7" cy="138.9" r="5" fill="#0B6B5B"/><circle cx="436.1" cy="282.3" r="5" fill="#0B6B5B"/><circle cx="394.5" cy="139.4" r="5" fill="#0B6B5B"/><text x="592" y="356" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">gap here: small</text><text x="592" y="376" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">negative studies missing</text><text x="400" y="448" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Symmetry is reassuring; asymmetry suggests small-study or publication bias.</text><text x="96" y="260" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 96 260)">precision (larger studies higher)</text><text x="400" y="430" font-size="12.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">effect size</text></svg>
