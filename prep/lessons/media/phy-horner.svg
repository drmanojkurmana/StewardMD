<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" role="img" aria-labelledby="t d"><title id="t">Sympathetic pathway to the eye and Horner syndrome</title><desc id="d">Three neuron sympathetic pathway to the eye: first order from posterior hypothalamus to the ciliospinal centre at C8 to T2, second order through the sympathetic chain over the lung apex to the superior cervical ganglion, third order along the carotid to the pupil dilator and tarsal muscle; interruption gives Horner syndrome.</desc><rect width="800" height="446" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sympathetic pathway to the eye and Horner syndrome</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Causes by site: lateral medullary stroke (1st), Pancoast tumour (2nd), carotid dissection (3rd)</text><rect x="180.0" y="92.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="116.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1st order: hypothalamus down the brainstem</text><text x="400.0" y="132.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">to the ciliospinal centre (C8 to T2)</text><rect x="180.0" y="178.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="202.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2nd order: sympathetic chain over the lung apex</text><text x="400.0" y="218.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">to the superior cervical ganglion</text><rect x="180.0" y="264.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="288.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">3rd order: along the internal carotid</text><text x="400.0" y="304.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">to dilator pupillae, tarsal muscle, sweat glands</text><rect x="180.0" y="350.0" width="440.0" height="56.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="400.0" y="382.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Horner syndrome: ptosis, miosis, anhidrosis</text><line x1="400.0" y1="148.0" x2="400.0" y2="170.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 178.0 L396.5 169.7 L403.5 169.7 Z" fill="#3D5A54"/><line x1="400.0" y1="234.0" x2="400.0" y2="256.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 264.0 L396.5 255.7 L403.5 255.7 Z" fill="#3D5A54"/><line x1="400.0" y1="320.0" x2="400.0" y2="342.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 350.0 L396.5 341.7 L403.5 341.7 Z" fill="#3D5A54"/></svg>