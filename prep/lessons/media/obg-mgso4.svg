<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Magnesium sulphate regimens and toxicity checks</title>
<desc id="d">Pritchard loads 4 grams intravenously plus 10 grams intramuscularly, then 5 grams intramuscularly every 4 hours. Zuspan loads 4 grams intravenously, then 1 to 2 grams per hour as an infusion. Toxicity climbs a ladder: lost reflexes, then respiratory depression, then cardiac arrest; calcium gluconate is the antidote. Urine output and respiratory rate gate every dose. Labetalol leads blood pressure control, then oral nifedipine, then hydralazine; ACE inhibitors are banned and diazepam is obsolete.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Magnesium: two regimens, one ladder</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">For seizure prophylaxis and treatment; reflexes, breathing and urine gate each dose</text>
<rect x="30" y="80" width="360" height="190" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/>
<text x="210" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">PRITCHARD (IM)</text>
<text x="48" y="136" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Loading: 4 g IV + 10 g IM</text>
<text x="48" y="158" font-size="11" fill="#071318" font-family="system-ui,sans-serif">(5 g deep in each buttock)</text>
<text x="48" y="186" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Then: 5 g IM every 4 hours</text>
<text x="48" y="208" font-size="11" fill="#071318" font-family="system-ui,sans-serif">with lignocaine for the pain</text>
<text x="48" y="236" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Use where no infusion pump</text>
<text x="48" y="252" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">is available</text>
<rect x="410" y="80" width="360" height="190" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="590" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ZUSPAN (IV)</text>
<text x="428" y="136" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Loading: 4 g IV over 20 min</text>
<text x="428" y="164" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Then: 1 to 2 g per hour</text>
<text x="428" y="186" font-size="11" fill="#071318" font-family="system-ui,sans-serif">as a controlled infusion</text>
<text x="428" y="214" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Needs a pump and strict</text>
<text x="428" y="230" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">intake-output charting</text>
<text x="428" y="252" font-size="11" fill="#3D5A54" font-family="system-ui,sans-serif">Continue 24 h after delivery</text>
<rect x="30" y="282" width="360" height="120" rx="8" fill="#FDF2F0" stroke="#B42318" stroke-width="1.5"/>
<text x="210" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">TOXICITY LADDER</text>
<rect x="48" y="316" width="324" height="22" rx="11" fill="#FBF8EE" stroke="#B7791F" stroke-width="1"/>
<text x="210" y="332" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1 Reflexes lost: stop the drip</text>
<rect x="48" y="342" width="324" height="22" rx="11" fill="#FBE3E0" stroke="#B42318" stroke-width="1"/>
<text x="210" y="358" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2 Breathing slows: assist ventilation</text>
<rect x="48" y="368" width="324" height="22" rx="11" fill="#B42318"/>
<text x="210" y="384" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">3 Arrest: calcium gluconate IV</text>
<rect x="410" y="282" width="360" height="120" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.2"/>
<text x="590" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">PRESSURE CONTROL</text>
<text x="428" y="332" font-size="11" fill="#071318" font-family="system-ui,sans-serif">1 Labetalol first line</text>
<text x="428" y="354" font-size="11" fill="#071318" font-family="system-ui,sans-serif">2 Nifedipine oral next</text>
<text x="428" y="376" font-size="11" fill="#071318" font-family="system-ui,sans-serif">3 Hydralazine; ACE banned</text>
<text x="590" y="396" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Diazepam is obsolete. Keep lungs dry.</text>
<rect x="30" y="414" width="740" height="40" rx="6" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.2"/>
<text x="400" y="439" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Before every dose: knee jerk present, breathing 16+/min, urine 30+ mL/h</text>
<text x="400" y="478" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Magnesium also steadies the preterm brain: neuroprotection under 32 weeks.</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Fits despite magnesium: secure airway, exclude bleed, deliver.</text>
</svg>
