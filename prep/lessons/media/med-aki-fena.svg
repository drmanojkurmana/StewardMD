<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Prerenal failure vs acute tubular necrosis</title><desc id="d">Five bedside numbers separate dry kidneys from injured tubules: FENa below 1 percent, urine sodium below 20, osmolality above 500, bland sediment and a BUN to creatinine ratio above 20 point prerenal; the mirror values with muddy brown casts point to ATN.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prerenal failure vs acute tubular necrosis</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Dry kidneys concentrate; dead tubules cannot</text><text x="265.0" y="92.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Prerenal (dry)</text><text x="615.0" y="92.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">ATN (injured tubules)</text><rect x="40.0" y="104.0" width="330.0" height="52.0" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.6"/><text x="205.0" y="134.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">FENa below 1%</text><rect x="430.0" y="104.0" width="330.0" height="52.0" rx="8" fill="#FBE3E0" stroke="#B42318" stroke-width="1.6"/><text x="595.0" y="134.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">FENa above 2%</text><rect x="40.0" y="166.0" width="330.0" height="52.0" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.6"/><text x="205.0" y="196.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Urine Na below 20</text><rect x="430.0" y="166.0" width="330.0" height="52.0" rx="8" fill="#FBE3E0" stroke="#B42318" stroke-width="1.6"/><text x="595.0" y="196.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Urine Na above 40</text><rect x="40.0" y="228.0" width="330.0" height="52.0" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.6"/><text x="205.0" y="258.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Osmolality above 500</text><rect x="430.0" y="228.0" width="330.0" height="52.0" rx="8" fill="#FBE3E0" stroke="#B42318" stroke-width="1.6"/><text x="595.0" y="258.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Osmolality below 350</text><rect x="40.0" y="290.0" width="330.0" height="52.0" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.6"/><text x="205.0" y="320.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sediment bland, hyaline</text><rect x="430.0" y="290.0" width="330.0" height="52.0" rx="8" fill="#FBE3E0" stroke="#B42318" stroke-width="1.6"/><text x="595.0" y="320.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Muddy brown granular casts</text><rect x="40.0" y="352.0" width="330.0" height="52.0" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.6"/><text x="205.0" y="382.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">BUN/Cr ratio above 20</text><rect x="430.0" y="352.0" width="330.0" height="52.0" rx="8" fill="#FBE3E0" stroke="#B42318" stroke-width="1.6"/><text x="595.0" y="382.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">BUN/Cr ratio below 15</text><text x="400.0" y="472.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Units: FENa in percent, urine Na in mmol/L, osmolality in mOsm/kg.</text><text x="400.0" y="492.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Diuretics blur FENa: use FEUrea below 35 percent instead.</text></svg>