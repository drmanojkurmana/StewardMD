<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" role="img" aria-labelledby="t d"><title id="t">Kidney biomarkers</title><desc id="d">Table of kidney injury biomarkers: cystatin C freely filtered marker of GFR, NGAL early marker of acute kidney injury from tubular injury, KIM-1 marker of proximal tubular damage, IL-18 inflammatory marker in acute tubular necrosis.</desc><rect width="800" height="364" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Kidney biomarkers</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Creatinine rises only after about half of the filtration has been lost</text><text x="122.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Marker</text><text x="503.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">What it shows</text><rect x="37.0" y="104.0" width="170.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="122.0" y="132.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cystatin C</text><line x1="210.0" y1="128.0" x2="233.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M240.0 128.0 L232.6 131.1 L232.6 124.9 Z" fill="#3D5A54"/><rect x="243.0" y="104.0" width="520.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="503.0" y="132.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GFR: freely filtered, unaffected by muscle mass</text><rect x="37.0" y="164.0" width="170.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="122.0" y="192.4" font-size="12.5" font-weight="500" text-