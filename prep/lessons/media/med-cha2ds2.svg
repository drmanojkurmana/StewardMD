<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">CHA2DS2-VASc: who needs anticoagulation in AF</title><desc id="d">Eight letters add to nine points: heart failure, hypertension, age 75 or more, diabetes, prior stroke, vascular disease, age 65 to 74, female sex. Zero needs no OAC, one considers it, two or more starts it, DOAC over warfarin.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CHA2DS2-VASc: who needs anticoagulation in AF</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Two or more: anticoagulate. One: consider. Zero: reassure.</text><rect x="60.0" y="84.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="210.0" y="113.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">C: heart failure = 1</text><text x="360.0" y="115.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">1</text><rect x="430.0" y="84.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="580.0" y="113.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">H: hypertension = 1</text><text x="730.0" y="115.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">1</text><rect x="60.0" y="146.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="210.0" y="175.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A2: age 75 or more = 2</text><text x="360.0" y="177.0" font-size="15" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">2</text><rect x="430.0" y="146.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="580.0" y="175.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">D: diabetes = 1</text><text x="730.0" y="177.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">1</text><rect x="60.0" y="208.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="210.0" y="237.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">S2: stroke or TIA = 2</text><text x="360.0" y="239.0" font-size="15" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">2</text><rect x="430.0" y="208.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="580.0" y="237.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">V: vascular disease = 1</text><text x="730.0" y="239.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">1</text><rect x="60.0" y="270.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="210.0" y="299.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A: age 65 to 74 = 1</text><text x="360.0" y="301.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">1</text><rect x="430.0" y="270.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="580.0" y="299.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Sc: female sex = 1</text><text x="730.0" y="301.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">1</text><rect x="40.0" y="344.0" width="220.0" height="62.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="150.0" y="379.2" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Score 0: no OAC, reassure</text><rect x="290.0" y="344.0" width="220.0" height="62.0" rx="8" fill="#FBF3E2" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="379.2" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Score 1: consider OAC</text><rect x="540.0" y="344.0" width="220.0" height="62.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="650.0" y="371.9" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Score 2 or more: OAC, DOAC</text><text x="650.0" y="386.5" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">first</text><text x="400.0" y="446.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">HAS-BLED counts bleeding risk; a high score cautions, it never forbids.</text><text x="400.0" y="466.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Rhythm control (flecainide, amiodarone, ablation) never replaces OAC.</text></svg>