<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Prodrug conversions: inactive as given, active in the body</title> <desc id="d">Three prodrug conversions with arrows: enalapril to enalaprilat by liver esterase, levodopa to dopamine by DOPA decarboxylase, becampicillin to ampicillin by hydrolysis. Captopril and lisinopril are active as given and are not prodrugs.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prodrugs: inactive as given, active in the body</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Conversion in the body gives better absorption, greater stability and fewer side effects</text> <rect x="60" y="100" width="220" height="64" rx="12" fill="#071318"/> <text x="170" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Enalapril</text> <text x="170" y="148" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">inactive prodrug</text> <line x1="290" y1="132" x2="340" y2="132" stroke="#0B6B5B" stroke-width="3"/> <polygon points="340,122 358,132 340,142" fill="#0B6B5B"/> <text x="315" y="120" font-size="11" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">liver esterase</text> <rect x="368" y="100" width="220" height="64" rx="12" fill="#0B6B5B"/> <text x="478" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Enalaprilat</text> <text x="478" y="148" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">active ACE inhibitor</text> <rect x="60" y="200" width="220" height="64" rx="12" fill="#071318"/> <text x="170" y="226" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Levodopa</text> <text x="170" y="248" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">crosses blood-brain barrier</text> <line x1="290" y1="232" x2="340" y2="232" stroke="#0B6B5B" stroke-width="3"/> <polygon points="340,222 358,232 340,242" fill="#0B6B5B"/> <text x="315" y="220" font-size="11" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">DOPA decarboxylase</text> <rect x="368" y="200" width="220" height="64" rx="12" fill="#0B6B5B"/> <text x="478" y="226" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Dopamine</text> <text x="478" y="248" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">active in the brain</text> <rect x="60" y="300" width="220" height="64" rx="12" fill="#071318"/> <text x="170" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Becampicillin</text> <text x="170" y="348" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">inactive ester</text> <line x1="290" y1="332" x2="340" y2="332" stroke="#0B6B5B" stroke-width="3"/> <polygon points="340,322 358,332 340,342" fill="#0B6B5B"/> <text x="315" y="320" font-size="11" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">hydrolysis</text> <rect x="368" y="300" width="220" height="64" rx="12" fill="#0B6B5B"/> <text x="478" y="326" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Ampicillin</text> <text x="478" y="348" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">active antibiotic</text> <rect x="620" y="100" width="130" height="264" rx="12" fill="none" stroke="#B7791F" stroke-width="2" stroke-dasharray="7 5"/> <text x="685" y="126" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">NOT prodrugs</text> <text x="685" y="150" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Captopril</text> <text x="685" y="172" font-size="12.5" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lisinopril</text> <text x="685" y="200" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">active as given:</text> <text x="685" y="220" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">no conversion</text> <text x="685" y="240" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">needed</text> <text x="685" y="300" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Exam trap:</text> <text x="685" y="320" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">not every ACE</text> <text x="685" y="340" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">inhibitor is</text> <text x="685" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">a prodrug</text> <text x="400" y="420" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Read left to right: grey drug as swallowed, arrow names the converting enzyme, green drug is what acts.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Prodrugs trade one extra metabolic step for absorption, stability and tolerability.</text> </svg>
