<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d"><title id="t">Glomerular filtration barrier</title><desc id="d">Cross-section of the glomerular filtration barrier from capillary lumen to urinary space: fenestrated endothelium, glomerular basement membrane with negative charge, and podocyte foot processes joined by slit diaphragms; water and small solutes pass, albumin is held back by size and charge.</desc><rect width="800" height="470" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Glomerular filtration barrier</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Blood on the left, urinary (Bowman) space on the right</text><rect x="40.0" y="90.0" width="130.0" height="300.0" rx="0" fill="#FBE3E0" stroke="none" stroke-width="0"/><rect x="340.0" y="90.0" width="150.0" height="300.0" rx="0" fill="#EAF2F6" stroke="none" stroke-width="0"/><text x="105.0" y="120.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Capillary</text><text x="105.0" y="136.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">lumen</text><text x="415.0" y="120.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3E6FA5" font-family="system-ui,sans-serif">Urinary</text><text x="415.0" y="136.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#3E6FA5" font-family="system-ui,sans-serif">space</text><ellipse cx="70.0" cy="180.0" rx="14" ry="9" fill="#C0392B" stroke="#7A1F17" stroke-width="1"/><ellipse cx="115.0" cy="235.0" rx="14" ry="9" fill="#C0392B" stroke="#7A1F17" stroke-width="1"/><ellipse cx="70.0" cy="290.0" rx="14" ry="9" fill="#C0392B" stroke="#7A1F17" stroke-width="1"/><ellipse cx="115.0" cy="345.0" rx="14" ry="9" fill="#C0392B" stroke="#7A1F17" stroke-width="1"/><rect x="170.0" y="90.0" width="24.0" height="300.0" rx="0" fill="#F5DDA6" stroke="#071318" stroke-width="1.6"/><rect x="170.0" y="120.0" width="24.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="170.0" y="190.0" width="24.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="170.0" y="260.0" width="24.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="170.0" y="330.0" width="24.0" height="16.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="194.0" y="90.0" width="76.0" height="300.0" rx="0" fill="#BFD1E1" stroke="#071318" stroke-width="1.6"/><text x="232.0" y="110.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="130.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="150.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="170.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="190.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="210.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="230.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="250.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="270.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="290.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="310.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="330.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="350.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="370.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><text x="232.0" y="390.0" font-size="11" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">- - -</text><path d="M270 94 L270 174 L336 174 L336 94 Z" fill="#BFE3D6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 184 L270 264 L336 264 L336 184 Z" fill="#BFE3D6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 274 L270 354 L336 354 L336 274 Z" fill="#BFE3D6" stroke="#071318" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110.0" cy="285.0" r="14" fill="#E8C547" stroke="#071318" stroke-width="1.8"/><text x="110.0" y="289.0" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Alb</text><line x1="124.0" y1="285.0" x2="160.0" y2="285.0" stroke="#B3382C" stroke-width="3" stroke-linecap="round"/><line x1="160.0" y1="279.0" x2="160.0" y2="291.0" stroke="#B3382C" stroke-width="4" stroke-linecap="round"/><line x1="100.0" y1="335.0" x2="462.0" y2="335.0" stroke="#3E6FA5" stroke-width="3" stroke-linecap="round"/><path d="M470.0 335.0 L460.8 338.9 L460.8 331.1 Z" fill="#3E6FA5"/><text x="300.0" y="358.0" font-size="12" font-weight="600" text-anchor="middle" fill="#3E6FA5" font-family="system-ui,sans-serif">water, glucose, urea pass freely</text><line x1="182.0" y1="140.0" x2="540.0" y2="120.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="548.0" y="118.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Fenestrated endothelium</text><text x="548.0" y="134.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">pores block cells, not proteins</text><line x1="232.0" y1="240.0" x2="540.0" y2="215.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="548.0" y="213.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Basement membrane</text><text x="548.0" y="229.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">negative charge repels albumin</text><line x1="303.0" y1="260.0" x2="540.0" y2="300.0" stroke="#3D5A54" stroke-width="1.1" stroke-linecap="round"/><text x="548.0" y="298.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Podocyte foot processes</text><text x="548.0" y="314.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">joined by slit diaphragms (nephrin)</text><text x="400.0" y="430.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Albumin (about 66 kDa, negatively charged) is repelled; in nephrotic syndrome the charge barrier is lost.</text></svg>