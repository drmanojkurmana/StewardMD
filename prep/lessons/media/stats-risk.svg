<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Absolute risk reduction and number needed to treat</title><desc id="d">Control event rate 20 percent and experimental event rate 15 percent: relative risk 0.75, absolute risk reduction 5 percent, number needed to treat 20.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Risk, absolute risk reduction and NNT</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Events per 100 patients over the trial period</text><text x="230" y="108" font-size="14.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Control: 20 in 100</text><rect x="100" y="126" width="260" height="30" rx="8" fill="#B42318"/><text x="230" y="146" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">CER = 20%</text><text x="570" y="108" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Treatment: 15 in 100</text><rect x="452" y="126" width="195" height="30" rx="8" fill="#0B6B5B"/><text x="549" y="146" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">EER = 15%</text><rect x="100" y="126" width="520" height="30" rx="8" fill="none" stroke="#E6ECEA" stroke-width="1.5"/><text x="400" y="220" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Relative risk = 15/20 = 0.75  ·  a 25% relative reduction sounds large</text><text x="400" y="262" font-size="14.5" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">Absolute risk reduction = 20% − 15% = 5% (5 fewer events per 100 treated)</text><rect x="230" y="292" width="340" height="64" rx="16" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="400" y="332" font-size="18" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">NNT = 1 / ARR = 1 / 0.05 = 20</text><text x="400" y="396" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Treat 20 patients for one extra patient to benefit. Always ask: over how long, and at what harm (NNH)?</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Relative risks impress; absolute risks and NNT inform the patient in front of you.</text></svg>
