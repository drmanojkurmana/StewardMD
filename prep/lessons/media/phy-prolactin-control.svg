<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" role="img" aria-labelledby="t d"><title id="t">Control of prolactin</title><desc id="d">d</desc><rect width="800" height="414" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Control of prolactin</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Dopamine agonists (cabergoline) lower prolactin</text><rect x="88.0" y="96.0" width="300.0" height="56.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="238.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypothalamus: dopamine (inhibits,</text><text x="238.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">tonic)</text><rect x="412.0" y="96.0" width="300.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="562.0" y="120.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">TRH, oestrogen, suckling</text><text x="562.0" y="136.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(stimulate)</text><rect x="250.0" y="192.0" width="300.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="216.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior pituitary lactotrophs:</text><text x="400.0" y="232.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">prolactin</text><rect x="88.0" y="288.0" width="300.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="238.0" y="320.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Breast: milk synthesis</text><rect x="412.0" y="288.0" width="300.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="562.0" y="320.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypothalamus: GnRH suppressed</text><line x1="238.0" y1="152.0" x2="393.0" y2="190.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 192.0 L391.1 193.4 L392.8 186.6 Z" fill="#3D5A54"/><line x1="562.0" y1="152.0" x2="407.0" y2="190.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 192.0 L407.2 186.6 L408.9 193.4 Z" fill="#3D5A54"/><line x1="400.0" y1="248.0" x2="245.0" y2="286.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 288.0 L245.2 282.6 L246.9 289.4 Z" fill="#3D5A54"/><line x1="400.0" y1="248.0" x2="555.0" y2="286.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M562.0 288.0 L553.1 289.4 L554.8 282.6 Z" fill="#3D5A54"/><text x="400.0" y="396.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Stalk damage or dopamine antagonists raise prolactin: galactorrhoea, hypogonadism.</text></svg>