<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">Laminar and turbulent flow</title><desc id="d">Two tubes: laminar flow with parallel streamlines and a parabolic velocity profile, and turbulent flow with chaotic eddies that happens when the Reynolds number exceeds about 2000, with the Reynolds number formula.</desc><rect width="800" height="500" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Laminar and turbulent flow</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Re = density x velocity x diameter / viscosity; turbulence above about 2000</text><rect x="80.0" y="90.0" width="640.0" height="120.0" rx="0" fill="#FBE3E0" stroke="#071318" stroke-width="2.4"/><line x1="325.0" y1="110.0" x2="467.8" y2="110.0" stroke="#3E6FA5" stroke-width="2.6" stroke-linecap="round"/><path d="M475.0 110.0 L466.7 113.5 L466.7 106.5 Z" fill="#3E6FA5"/><line x1="265.0" y1="130.0" x2="527.8" y2="130.0" stroke="#3E6FA5" stroke-width="2.6" stroke-linecap="round"/><path d="M535.0 130.0 L526.7 133.5 L526.7 126.5 Z" fill="#3E6FA5"/><line x1="230.0" y1="150.0" x2="562.8" y2="150.0" stroke="#3E6FA5" stroke-width="2.6" stroke-linecap="round"/><path d="M570.0 150.0 L561.7 153.5 L561.7 146.5 Z" fill="#3E6FA5"/><line x1="265.0" y1="170.0" x2="527.8" y2="170.0" stroke="#3E6FA5" stroke-width="2.6" stroke-linecap="round"/><path d="M535.0 170.0 L526.7 173.5 L526.7 166.5 Z" fill="#3E6FA5"/><line x1="325.0" y1="190.0" x2="467.8" y2="190.0" stroke="#3E6FA5" stroke-width="2.6" stroke-linecap="round"/><path d="M475.0 190.0 L466.7 193.5 L466.7 186.5 Z" fill="#3E6FA5"/><path d="M475.0 110.0 C485.0 113.3 519.2 123.3 535.0 130.0 C550.8 136.7 570.0 143.3 570.0 150.0 C570.0 156.7 550.8 163.3 535.0 170.0 C519.2 176.7 485.0 186.7 475.0 190.0" fill="none" stroke="#B7791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="400.0" y="78.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Laminar: parabolic profile, fastest at the centre, silent</text><rect x="80.0" y="280.0" width="640.0" height="120.0" rx="0" fill="#FBE3E0" stroke="#071318" stroke-width="2.4"/><path d="M140 330 q18 -30 36 -6 t36 4 t30 -8" fill="none" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160.0" cy="320.0" r="12" fill="none" stroke="#B3382C" stroke-width="1.4"/><path d="M250 310 q18 -30 36 -6 t36 4 t30 -8" fill="none" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270.0" cy="300.0" r="12" fill="none" stroke="#B3382C" stroke-width="1.4"/><path d="M330 340 q18 -30 36 -6 t36 4 t30 -8" fill="none" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350.0" cy="330.0" r="12" fill="none" stroke="#B3382C" stroke-width="1.4"/><path d="M440 320 q18 -30 36 -6 t36 4 t30 -8" fill="none" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="460.0" cy="310.0" r="12" fill="none" stroke="#B3382C" stroke-width="1.4"/><path d="M540 335 q18 -30 36 -6 t36 4 t30 -8" fill="none" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560.0" cy="325.0" r="12" fill="none" stroke="#B3382C" stroke-width="1.4"/><path d="M610 305 q18 -30 36 -6 t36 4 t30 -8" fill="none" stroke="#3E6FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="630.0" cy="295.0" r="12" fill="none" stroke="#B3382C" stroke-width="1.4"/><text x="400.0" y="268.0" font-size="13" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">Turbulent: eddies, loses energy, makes murmurs and bruits</text><text x="400.0" y="440.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Raised by higher velocity, wider vessel, lower viscosity. Anaemia and stenosis both promote turbulence.</text><text x="400.0" y="462.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Poiseuille: resistance is proportional to length x viscosity / radius to the fourth power.</text></svg>