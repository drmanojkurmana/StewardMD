<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Primary versus secondary antibody response</title><desc id="d">Serum antibody titre comparison following initial antigen exposure versus secondary booster exposure. The primary response features a 5 to 7 day lag with modest IgM preceding IgG. The secondary response displays a brief 1 to 3 day lag, massive high-affinity IgG production driven by memory B cells, and persistent protective titre.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Primary versus secondary humoral immune response</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Kinetics, lag phase, and isotype switching from IgM to high-affinity IgG</text><line x1="140" y1="410" x2="700" y2="410" stroke="#071318" stroke-width="2"/><line x1="140" y1="410" x2="140" y2="120" stroke="#071318" stroke-width="2"/><line x1="180" y1="360" x2="180" y2="410" stroke="#071318" stroke-width="2" marker-end="url(#arr-dn)"/><text x="180" y="350" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Primary antigen</text><line x1="440" y1="360" x2="440" y2="410" stroke="#071318" stroke-width="2" marker-end="url(#arr-dn)"/><text x="440" y="350" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Secondary booster</text><defs><marker id="arr-dn" viewBox="0 0 6 6" refX="3" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L3 6 L6 0 z" fill="#071318"/></marker></defs><path d="M 180 410 Q 210 410 230 360 Q 250 310 270 330 Q 310 370 360 405" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M 180 410 Q 230 410 260 350 Q 280 290 310 300 Q 360 330 420 390" fill="none" stroke="#0B6B5B" stroke-width="3"/><text x="250" y="315" font-size="11" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Primary IgM</text><text x="310" y="280" font-size="11.5" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Primary IgG</text><rect x="180" y="160" width="180" height="70" rx="6" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.2"/><text x="190" y="180" font-size="11.5" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Primary Response:</text><text x="190" y="196" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">• Lag: 5–7 days (naive B cells)</text><text x="190" y="210" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">• IgM appears before IgG</text><text x="190" y="224" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">• Lower peak titre &amp; lower affinity</text><path d="M 440 410 Q 455 410 470 365 Q 490 335 520 375 Q 560 400 600 408" fill="none" stroke="#B7791F" stroke-width="2.5" stroke-dasharray="5 3"/><path d="M 440 410 Q 455 405 470 230 Q 485 130 520 145 Q 600 170 680 220" fill="none" stroke="#0B6B5B" stroke-width="3.5"/><text x="495" y="340" font-size="11" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">Secondary IgM</text><text x="535" y="140" font-size="14" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Secondary IgG (High affinity)</text><rect x="460" y="220" width="200" height="70" rx="6" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.2"/><text x="470" y="240" font-size="11.5" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">Secondary Response:</text><text x="470" y="256" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">• Short lag: 1–3 days (Memory B)</text><text x="470" y="270" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">• Dominated by high-titre IgG</text><text x="470" y="284" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">• Somatic hypermutation &amp; affinity maturation</text><text x="410" y="445" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Time [Weeks]</text><text x="95" y="265" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif" transform="rotate(-90 95 265)">Serum Antibody Titre (log scale)</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Memory B cells and follicular helper T cells drive rapid isotype-switched, high-affinity IgG production on re-exposure.</text></svg>