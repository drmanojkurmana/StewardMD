<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Structure of an epithelioid granuloma</title><desc id="d">Concentric architecture of a chronic tuberculous granuloma. Center contains acellular eosinophilic caseous necrosis, surrounded by modified epithelioid macrophages and multinucleated horseshoe-shaped Langhans giant cells, enclosed by a peripheral lymphocytic cuff of CD4 T cells and fibroblasts.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Architecture of a caseating granuloma</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Concentric organisation in chronic mycobacterial and fungal infection</text><circle cx="340" cy="270" r="190" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="2"/><circle cx="340" cy="270" r="135" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2" stroke-dasharray="4 2"/><circle cx="340" cy="270" r="65" fill="#FDF2F0" stroke="#B42318" stroke-width="2"/><text x="340" y="265" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Central Caseous</text><text x="340" y="282" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Necrosis</text><circle cx="280" cy="180" r="16" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.8"/><circle cx="380" cy="170" r="18" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.8"/><circle cx="430" cy="250" r="16" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.8"/><circle cx="250" cy="310" r="17" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.8"/><path d="M 290 350 C 290 330, 350 330, 350 350 C 350 370, 290 370, 290 350 Z" fill="#FFFFFF" stroke="#B7791F" stroke-width="2.5"/><circle cx="298" cy="342" r="2.5" fill="#B7791F"/><circle cx="308" cy="336" r="2.5" fill="#B7791F"/><circle cx="320" cy="334" r="2.5" fill="#B7791F"/><circle cx="332" cy="336" r="2.5" fill="#B7791F"/><circle cx="342" cy="342" r="2.5" fill="#B7791F"/><rect x="560" y="110" width="200" height="65" rx="6" fill="#FDF2F0" stroke="#B42318" stroke-width="1.5"/><text x="570" y="130" font-size="12" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">1. Central Necrosis</text><text x="570" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Cheesy, acellular debris</text><text x="570" y="160" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">Loss of cell outlines</text><rect x="560" y="185" width="200" height="65" rx="6" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><text x="570" y="205" font-size="12" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">2. Epithelioid Cells</text><text x="570" y="221" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Activated macrophages</text><text x="570" y="235" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">Abundant pink cytoplasm</text><rect x="560" y="260" width="200" height="75" rx="6" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.5"/><text x="570" y="280" font-size="12" font-weight="700" fill="#B7791F" font-family="system-ui,sans-serif">3. Langhans Giant Cells</text><text x="570" y="296" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Fused macrophages</text><text x="570" y="310" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">Horseshoe nuclei rim</text><rect x="560" y="345" width="200" height="75" rx="6" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/><text x="570" y="365" font-size="12" font-weight="700" fill="#0B6B5B" font-family="system-ui,sans-serif">4. Lymphocytic Cuff</text><text x="570" y="381" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">CD4+ Th1 T-cells (IFN-γ)</text><text x="570" y="395" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">Surrounding rim of fibroblasts</text><line x1="395" y1="270" x2="560" y2="145" stroke="#B42318" stroke-width="1" stroke-dasharray="3 3"/><line x1="435" y1="235" x2="560" y2="215" stroke="#0B6B5B" stroke-width="1" stroke-dasharray="3 3"/><line x1="355" y1="355" x2="560" y2="300" stroke="#B7791F" stroke-width="1" stroke-dasharray="3 3"/><line x1="495" y1="365" x2="560" y2="375" stroke="#0B6B5B" stroke-width="1" stroke-dasharray="3 3"/><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Activated macrophages secrete TNF-alpha, which maintains granuloma stability; anti-TNF biologics carry risk of TB reactivation.</text></svg>