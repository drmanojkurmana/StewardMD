<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Hypertensive disorders of pregnancy: three classes</title>
<desc id="d">Chronic hypertension predates 20 weeks. Gestational hypertension starts at or after 20 weeks without proteinuria. Preeclampsia starts at or after 20 weeks with blood pressure 140 over 90 on two readings plus proteinuria of 300 milligrams per day or a protein-creatinine ratio of 30, or any severe feature. High-risk women take aspirin 150 milligrams from 12 to 36 weeks; calcium supplements help where intake is low.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High pressure in pregnancy: which one is it</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Twenty weeks and proteinuria split the three; severe features upgrade any of them</text>
<rect x="30" y="80" width="236" height="200" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/>
<text x="148" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">CHRONIC</text>
<text x="42" y="134" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Known before pregnancy,</text>
<text x="42" y="150" font-size="11" fill="#071318" font-family="system-ui,sans-serif">or found before 20 weeks</text>
<text x="42" y="176" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Persists past 12 weeks</text>
<text x="42" y="192" font-size="11" fill="#071318" font-family="system-ui,sans-serif">after delivery</text>
<text x="42" y="218" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">Superimposed preeclampsia:</text>
<text x="42" y="234" font-size="11" fill="#071318" font-family="system-ui,sans-serif">new proteinuria or a</text>
<text x="42" y="250" font-size="11" fill="#071318" font-family="system-ui,sans-serif">sudden pressure jump</text>
<rect x="282" y="80" width="236" height="200" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="400" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">GESTATIONAL</text>
<text x="294" y="134" font-size="11" fill="#071318" font-family="system-ui,sans-serif">First seen at or after</text>
<text x="294" y="150" font-size="11" fill="#071318" font-family="system-ui,sans-serif">20 weeks, no proteinuria</text>
<text x="294" y="176" font-size="11" fill="#071318" font-family="system-ui,sans-serif">Fades by 12 weeks after</text>
<text x="294" y="192" font-size="11" fill="#071318" font-family="system-ui,sans-serif">delivery; if not, it was</text>
<text x="294" y="208" font-size="11" fill="#071318" font-family="system-ui,sans-serif">chronic all along</text>
<text x="294" y="234" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Watch: half declare</text>
<text x="294" y="250" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">preeclampsia later</text>
<rect x="534" y="80" width="236" height="200" rx="8" fill="#FDF2F0" stroke="#B42318" stroke-width="1.5"/>
<text x="652" y="108" font-size="13" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">PREECLAMPSIA</text>
<text x="546" y="134" font-size="11" fill="#071318" font-family="system-ui,sans-serif">At or after 20 weeks:</text>
<text x="546" y="150" font-size="11" font-weight="700" fill="#071318" font-family="system-ui,sans-serif">140/90 twice, plus</text>
<text x="546" y="176" font-size="11" fill="#071318" font-family="system-ui,sans-serif">protein 300 mg/day or</text>
<text x="546" y="192" font-size="11" fill="#071318" font-family="system-ui,sans-serif">PCR 30, or any severe</text>
<text x="546" y="208" font-size="11" fill="#071318" font-family="system-ui,sans-serif">feature below</text>
<text x="546" y="234" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Root: failed spiral-artery</text>
<text x="546" y="250" font-size="11" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">remodelling, sFlt-1 high</text>
<rect x="30" y="292" width="740" height="86" rx="6" fill="#FFFFFF" stroke="#B42318" stroke-width="1.2"/>
<text x="400" y="314" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Severe features: headache or visual change, epigastric band pain, clonus</text>
<text x="400" y="334" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">platelets under 1 lakh, creatinine doubled, transaminases twice normal, pulmonary oedema</text>
<text x="400" y="354" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HELLP: haemolysis, elevated liver enzymes, low platelets, often with epigastric pain and DIC</text>
<rect x="30" y="390" width="740" height="52" rx="6" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.2"/>
<text x="400" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Prevention in high-risk women: aspirin 150 mg daily from 12 to 36 weeks; calcium where intake is low</text>
<text x="400" y="432" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Delivery cures: 37 weeks without severe features, 34 weeks with; eclampsia, HELLP and DIC deliver now.</text>
<text x="400" y="478" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Eclampsia fits are tonic-clonic and can strike up to 48 hours after delivery.</text>
<text x="400" y="502" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Labetalol and nifedipine are breastfeeding-safe; ACE inhibitors stay banned.</text>
</svg>
