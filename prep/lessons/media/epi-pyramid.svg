<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Population pyramid: age and sex structure</title><desc id="d">A population pyramid with five age bands. Males on the left total 174 million and females on the right total 174 million, a sex ratio of 1000. Fifty-eight dependants rely on every hundred working-age people.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Population pyramid: age and sex structure</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Males left, females right; shape shows a young, growing population</text><text x="400" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Total 348 million - sex ratio 1000 females per 1000 males</text><line x1="400" y1="110" x2="400" y2="400" stroke="#071318" stroke-width="2"/><text x="180" y="125" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">MALES</text><text x="620" y="125" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">FEMALES</text><text x="180" y="141" font-size="11" font-weight="400" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">174 million in all</text><text x="620" y="141" font-size="11" font-weight="400" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">174 million in all</text><rect x="286" y="152" width="114" height="34" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><rect x="400" y="152" width="110" height="34" fill="#FBF3E2" stroke="#B7791F" stroke-width="2"/><text x="400" y="173.5" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">0-14</text><text x="277.6