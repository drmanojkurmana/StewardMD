<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Point-source and propagated epidemic curves</title><desc id="d">Two epidemic curves. The point-source curve has one sharp peak inside a single incubation period. The propagated curve rises gradually and shows secondary waves.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Point-source and propagated epidemic curves</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">One peak inside one incubation period, or slow rise with secondary waves</text><text x="200" y="90" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Point source: one peak</text><rect x="60.0" y="388.0" width="16" height="12.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="80.6" y="376.0" width="16" height="24.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="101.2" y="340.0" width="16" height="60.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="121.8" y="256.0" width="16" height="144.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="142.4" y="160.0" width="16" height="240.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="163.0" y="232.0" width="16" height="168.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="183.6" y="316.0" width="16" height="84.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="204.2" y="364.0" width="16" height="36.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="224.8" y="388.0" width="16" height="12.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="245.4" y="400.0" width="16" height="0.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="266.0" y="400.0" width="16" height="0.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="286.6" y="400.0" width="16" height="0.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="307.2" y="400.0" width="16" height="0.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><line x1="45" y1="400" x2="365" y2="400" stroke="#071318" stroke-width="2"/><text x="205" y="420" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Days since exposure (one incubation period shaded)</text><rect x="60" y="120" width="270" height="280" fill="none" stroke="#B7791F" stroke-width="1.5" stroke-dasharray="6 4"/><text x="195" y="112" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ONE incubation period</text><text x="200" y="445" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">65 cases: rapid rise, rapid fall, no second wave</text><text x="600" y="90" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Propagated: secondary waves</text><rect x="460.0" y="400.0" width="16" height="0.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="480.6" y="388.0" width="16" height="12.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="501.2" y="376.0" width="16" height="24.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="521.8" y="364.0" width="16" height="36.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="542.4" y="340.0" width="16" height="60.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="563.0" y="316.0" width="16" height="84.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="583.6" y="328.0" width="16" height="72.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="604.2" y="304.0" width="16" height="96.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="624.8" y="280.0" width="16" height="120.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="645.4" y="304.0" width="16" height="96.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="666.0" y="328.0" width="16" height="72.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="686.6" y="292.0" width="16" height="108.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><rect x="707.2" y="316.0" width="16" height="84.0" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="1.5"/><line x1="445" y1="400" x2="765" y2="400" stroke="#071318" stroke-width="2"/><text x="605" y="420" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Weeks (person-to-person spread)</text><text x="600" y="445" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">72 cases: gradual rise, slow tail, second wave</text><text x="400" y="478" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cases</text><text x="400.0" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Point source strikes once and ends; person-to-person spread returns in waves.</text></svg>
