<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Nephritic versus nephrotic syndrome: the exam fork</title> <desc id="d">Two columns. Nephritic: inflamed glomeruli, haematuria with dysmorphic red cells and red cell casts, hypertension, falling filtration. Nephrotic: leaky glomeruli, massive proteinuria, oedema, hypoalbuminaemia and thrombosis risk. Syndrome first, biopsy names the disease.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nephritic or nephrotic? Decide the syndrome first</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Every glomerular stem forks here; biopsy patterns only name the disease after</text> <rect x="40" y="90" width="350" height="300" rx="12" fill="#071318"/> <text x="215" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">NEPHRITIC: inflamed</text> <text x="215" y="150" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">haematuria: dysmorphic red</text> <text x="215" y="172" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">cells + red cell casts</text> <text x="215" y="202" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hypertension</text> <text x="215" y="224" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">falling filtration: creatinine up,</text> <text x="215" y="246" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">oliguria</text> <text x="215" y="276" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">proteinuria modest,</text> <text x="215" y="298" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">oedema mild</text> <text x="215" y="330" font-size="12" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">glomeruli bleed</text> <rect x="410" y="90" width="350" height="300" rx="12" fill="#0B6B5B"/> <text x="585" y="120" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">NEPHROTIC: leaky</text> <text x="585" y="150" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">massive proteinuria,</text> <text x="585" y="172" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hypoalbuminaemia</text> <text x="585" y="202" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">oedema: periorbital to</text> <text x="585" y="224" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">anasarca</text> <text x="585" y="254" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hyperlipidaemia,</text> <text x="585" y="276" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">thrombosis risk</text> <text x="585" y="306" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">urine bland: few cells,</text> <text x="585" y="328" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">fatty casts possible</text> <text x="585" y="360" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">glomeruli leak</text> <text x="400" y="430" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Red urine with hypertension and rising creatinine: nephritic. Swelling with heavy protein: nephrotic.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Syndrome first, biopsy name second: the pattern, not the protein number, makes the call.</text> </svg>
