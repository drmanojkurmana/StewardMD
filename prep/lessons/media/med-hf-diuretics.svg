<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Diuretics: dry the lungs, not the future</title><desc id="d">Diuretics ease congestion only and add no survival: double the home oral dose as IV bolus or infusion, and resistance means urine sodium 90 or less after 3 days of high-dose loops.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Diuretics: dry the lungs, not the future</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Congestion only: no survival gain</text><rect x="120.0" y="90.0" width="250.0" height="110.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="245.0" y="149.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Home oral dose</text><line x1="370.0" y1="145.0" x2="412.8" y2="145.0" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M420.0 145.0 L411.7 148.5 L411.7 141.5 Z" fill="#3D5A54"/><text x="395.0" y="128.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2x</text><rect x="430.0" y="90.0" width="250.0" height="110.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="555.0" y="149.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">IV bolus or infusion</text><rect x="120.0" y="235.0" width="560.0" height="110.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="294.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Resistance: urine sodium 90 or less after 3 days of high-dose loops</text><text x="400.0" y="385.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Twice the dose, watch the kidneys and potassium.</text><text x="400.0" y="407.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Four pillars treat the failure; water pills only dry it.</text></svg>