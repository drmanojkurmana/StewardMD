<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" role="img" aria-labelledby="t d"><title id="t">Four types of hypoxia</title><desc id="d">d</desc><rect width="800" height="364" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Four types of hypoxia</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Chemoreceptors sense PaO2, so only hypoxic hypoxia drives breathing</text><text x="94.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Type</text><text x="255.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">PaO2</text><text x="561.0" y="90.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cause</text><rect x="19.0" y="104.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="94.0" y="132.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypoxic</text><line x1="172.0" y1="128.0" x2="195.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M202.0 128.0 L194.6 131.1 L194.6 124.9 Z" fill="#3D5A54"/><rect x="205.0" y="104.0" width="100.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="255.0" y="132.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low</text><line x1="308.0" y1="128.0" x2="331.6" y2="128.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M338.0 128.0 L330.6 131.1 L330.6 124.9 Z" fill="#3D5A54"/><rect x="341.0" y="104.0" width="440.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="561.0" y="132.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Altitude, lung disease, hypoventilation</text><rect x="19.0" y="164.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="94.0" y="192.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anaemic</text><line x1="172.0" y1="188.0" x2="195.6" y2="188.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M202.0 188.0 L194.6 191.1 L194.6 184.9 Z" fill="#3D5A54"/><rect x="205.0" y="164.0" width="100.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="255.0" y="192.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal</text><line x1="308.0" y1="188.0" x2="331.6" y2="188.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M338.0 188.0 L330.6 191.1 L330.6 184.9 Z" fill="#3D5A54"/><rect x="341.0" y="164.0" width="440.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="561.0" y="192.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low haemoglobin or carbon monoxide: content falls</text><rect x="19.0" y="224.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="94.0" y="252.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stagnant</text><line x1="172.0" y1="248.0" x2="195.6" y2="248.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M202.0 248.0 L194.6 251.1 L194.6 244.9 Z" fill="#3D5A54"/><rect x="205.0" y="224.0" width="100.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="255.0" y="252.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal</text><line x1="308.0" y1="248.0" x2="331.6" y2="248.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M338.0 248.0 L330.6 251.1 L330.6 244.9 Z" fill="#3D5A54"/><rect x="341.0" y="224.0" width="440.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="561.0" y="252.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low flow: shock, heart failure, local ischaemia</text><rect x="19.0" y="284.0" width="150.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="94.0" y="312.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Histotoxic</text><line x1="172.0" y1="308.0" x2="195.6" y2="308.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M202.0 308.0 L194.6 311.1 L194.6 304.9 Z" fill="#3D5A54"/><rect x="205.0" y="284.0" width="100.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="255.0" y="312.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Normal</text><line x1="308.0" y1="308.0" x2="331.6" y2="308.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M338.0 308.0 L330.6 311.1 L330.6 304.9 Z" fill="#3D5A54"/><rect x="341.0" y="284.0" width="440.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="561.0" y="312.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cyanide blocks cytochrome oxidase; tissues cannot use O2</text></svg>