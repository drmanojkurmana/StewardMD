<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" role="img" aria-labelledby="t d"><title id="t">Tongue deviation on protrusion</title><desc id="d">Flow diagram of hypoglossal lesions: a lower motor neuron lesion gives ipsilateral wasting and fasciculation with the tip deviating toward the lesion; an upper motor neuron lesion gives no wasting and deviation away from the cortical lesion.</desc><rect width="800" height="458" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tongue deviation on protrusion</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Hypoglossal nerve (CN XII) supplies all tongue muscles except palatoglossus</text><rect x="250.0" y="96.0" width="300.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="113.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Genioglossus protrudes the tongue;</text><text x="400.0" y="129.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">each side pushes it to the opposite</text><text x="400.0" y="145.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">side</text><rect x="88.0" y="184.0" width="300.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="238.0" y="217.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">LMN lesion (nerve or nucleus)</text><rect x="412.0" y="184.0" width="300.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="562.0" y="217.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">UMN lesion (cortex, capsule)</text><rect x="88.0" y="272.0" width="300.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="238.0" y="297.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Ipsilateral weakness,</text><text x="238.0" y="313.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">atrophy and fasciculation</text><rect x="412.0" y="272.0" width="300.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="562.0" y="297.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">No wasting; weakness is</text><text x="562.0" y="313.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">contralateral to the lesion</text><rect x="88.0" y="360.0" width="300.0" height="58.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="238.0" y="393.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tip deviates TOWARD the lesion</text><rect x="412.0" y="360.0" width="300.0" height="58.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="562.0" y="393.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Tip deviates AWAY from the lesion</text><line x1="400.0" y1="154.0" x2="245.1" y2="182.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 184.0 L245.5 179.0 L246.8 185.9 Z" fill="#3D5A54"/><line x1="400.0" y1="154.0" x2="554.9" y2="182.7" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M562.0 184.0 L553.2 185.9 L554.5 179.0 Z" fill="#3D5A54"/><line x1="238.0" y1="242.0" x2="238.0" y2="264.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 272.0 L234.5 263.7 L241.5 263.7 Z" fill="#3D5A54"/><line x1="562.0" y1="242.0" x2="562.0" y2="264.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M562.0 272.0 L558.5 263.7 L565.5 263.7 Z" fill="#3D5A54"/><line x1="238.0" y1="330.0" x2="238.0" y2="352.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 360.0 L234.5 351.7 L241.5 351.7 Z" fill="#3D5A54"/><line x1="562.0" y1="330.0" x2="562.0" y2="352.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M562.0 360.0 L558.5 351.7 L565.5 351.7 Z" fill="#3D5A54"/></svg>