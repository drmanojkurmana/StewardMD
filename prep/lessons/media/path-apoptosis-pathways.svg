<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Apoptosis pathways: intrinsic versus extrinsic</title><desc id="d">Diagram illustrating the two initiating pathways of programmed cell death. The intrinsic mitochondrial pathway is triggered by DNA damage, reactive oxygen species, and growth factor withdrawal, causing Bax and Bak pore formation, cytochrome c release, and caspase 9 activation. The extrinsic death receptor pathway is triggered by Fas ligand or TNF binding, activating caspase 8. Both converge on executioner caspases 3, 6, and 7.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Apoptosis: Intrinsic versus Extrinsic pathways</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Initiating triggers, caspase cascades, and convergence on executioner enzymes</text><rect x="60" y="85" width="310" height="235" rx="8" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2"/><text x="215" y="110" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Intrinsic (Mitochondrial) Pathway</text><text x="215" y="130" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">DNA damage (p53) · Hypoxia · Misfolded proteins</text><text x="215" y="152" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">BAX &amp; BAK activation</text><text x="215" y="168" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">(Inhibited by anti-apoptotic BCL-2 &amp; BCL-XL)</text><line x1="215" y1="175" x2="215" y2="195" stroke="#0B6B5B" stroke-width="2" marker-end="url(#arr-teal)"/><rect x="110" y="198" width="210" height="30" rx="4" fill="#FFFFFF" stroke="#0B6B5B" stroke-width="1.5"/><text x="215" y="218" font-size="12" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Cytochrome c + Apaf-1 release</text><line x1="215" y1="230" x2="215" y2="250" stroke="#0B6B5B" stroke-width="2" marker-end="url(#arr-teal)"/><rect x="130" y="255" width="170" height="36" rx="4" fill="#0B6B5B"/><text x="215" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Caspase-9 (Initiator)</text><rect x="430" y="85" width="310" height="235" rx="8" fill="#FDF2F0" stroke="#B42318" stroke-width="2"/><text x="585" y="110" font-size="14.5" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Extrinsic (Death Receptor) Pathway</text><text x="585" y="130" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">FasL binding Fas (CD95) · TNF-α binding TNFR1</text><line x1="585" y1="145" x2="585" y2="175" stroke="#B42318" stroke-width="2" marker-end="url(#arr-red)"/><rect x="480" y="178" width="210" height="46" rx="4" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5"/><text x="585" y="198" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Receptor Trimerization + FADD</text><text x="585" y="214" font-size="10.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Death domain adaptor recruitment</text><line x1="585" y1="228" x2="585" y2="250" stroke="#B42318" stroke-width="2" marker-end="url(#arr-red)"/><rect x="495" y="255" width="180" height="36" rx="4" fill="#B42318"/><text x="585" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Caspase-8 &amp; 10 (Initiator)</text><line x1="215" y1="295" x2="350" y2="355" stroke="#0B6B5B" stroke-width="2.5" marker-end="url(#arr-teal)"/><line x1="585" y1="295" x2="450" y2="355" stroke="#B42318" stroke-width="2.5" marker-end="url(#arr-red)"/><defs><marker id="arr-teal" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#0B6B5B"/></marker><marker id="arr-red" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#B42318"/></marker></defs><rect x="250" y="360" width="300" height="50" rx="6" fill="#071318"/><text x="400" y="385" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Executioner Caspases: 3, 6 &amp; 7</text><text x="400" y="401" font-size="11" text-anchor="middle" fill="#EAF3F0" font-family="system-ui,sans-serif">Cleave structural proteins &amp; activate endonucleases</text><line x1="400" y1="412" x2="400" y2="435" stroke="#071318" stroke-width="2" marker-end="url(#arr-bl)"/><text x="400" y="455" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Apoptotic Bodies → Phagocytosis without inflammation</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">BCL-2 overexpression in follicular lymphoma (t(14;18)) inhibits the intrinsic apoptotic pathway, preventing cell death.</text></svg>