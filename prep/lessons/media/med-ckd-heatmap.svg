<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">CKD heat map: GFR stage by albuminuria</title><desc id="d">Six GFR stages G1 to G5 meet three albuminuria bands A1 to A3. Risk runs from low in the top left to very high at the bottom right; amber means refer, red means prepare dialysis and transplant.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CKD heat map: GFR stage by albuminuria</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Two axes, one colour: green monitors, amber refers, red prepares</text><text x="150.0" y="108.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A1 below 30</text><text x="360.0" y="108.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A2 30 to 300</text><text x="570.0" y="108.0" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">A3 above 300</text><text x="455.0" y="88.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">ACR (mg/g)</text><text x="60.0" y="148.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">G1 90+</text><rect x="90.0" y="122.0" width="200.0" height="44.0" rx="6" fill="#EAF3F0" stroke="#9DB5AE" stroke-width="1.2"/><text x="190.0" y="150.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low</text><rect x="300.0" y="122.0" width="200.0" height="44.0" rx="6" fill="#FBF3E2" stroke="#9DB5AE" stroke-width="1.2"/><text x="400.0" y="150.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Moderate</text><rect x="510.0" y="122.0" width="200.0" height="44.0" rx="6" fill="#F5C86E" stroke="#9DB5AE" stroke-width="1.2"/><text x="610.0" y="150.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High</text><text x="60.0" y="200.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">G2 60-89</text><rect x="90.0" y="174.0" width="200.0" height="44.0" rx="6" fill="#EAF3F0" stroke="#9DB5AE" stroke-width="1.2"/><text x="190.0" y="202.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low</text><rect x="300.0" y="174.0" width="200.0" height="44.0" rx="6" fill="#FBF3E2" stroke="#9DB5AE" stroke-width="1.2"/><text x="400.0" y="202.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Moderate</text><rect x="510.0" y="174.0" width="200.0" height="44.0" rx="6" fill="#F5C86E" stroke="#9DB5AE" stroke-width="1.2"/><text x="610.0" y="202.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High</text><text x="60.0" y="252.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">G3a 45-59</text><rect x="90.0" y="226.0" width="200.0" height="44.0" rx="6" fill="#FBF3E2" stroke="#9DB5AE" stroke-width="1.2"/><text x="190.0" y="254.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Moderate</text><rect x="300.0" y="226.0" width="200.0" height="44.0" rx="6" fill="#F5C86E" stroke="#9DB5AE" stroke-width="1.2"/><text x="400.0" y="254.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High</text><rect x="510.0" y="226.0" width="200.0" height="44.0" rx="6" fill="#FDECEA" stroke="#9DB5AE" stroke-width="1.2"/><text x="610.0" y="254.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Very high</text><text x="60.0" y="304.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">G3b 30-44</text><rect x="90.0" y="278.0" width="200.0" height="44.0" rx="6" fill="#F5C86E" stroke="#9DB5AE" stroke-width="1.2"/><text x="190.0" y="306.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High</text><rect x="300.0" y="278.0" width="200.0" height="44.0" rx="6" fill="#FDECEA" stroke="#9DB5AE" stroke-width="1.2"/><text x="400.0" y="306.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Very high</text><rect x="510.0" y="278.0" width="200.0" height="44.0" rx="6" fill="#FDECEA" stroke="#9DB5AE" stroke-width="1.2"/><text x="610.0" y="306.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Very high</text><text x="60.0" y="356.0" font-size="12" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">G4 15-29</text><rect x="90.0" y="330.0" width="200.0" height="44.0" rx="6" fill="#F5C86E" stroke="#9DB5AE" stroke-width="1.2"/><text x="190.0" y="358.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">High</text><rect x="300.0" y="330.0" width="200.0" height="44.0" rx="6" fill="#FDECEA" stroke="#9DB5AE" stroke-width="1.2"/><text x="400.0" y="358.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Very high</text><rect x="510.0" y="330.0" width="200.0" height="44.0" rx="6" fill="#FDECEA" stroke="#9DB5AE" stroke-width="1.2"/><text x="610.0" y="358.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Very high</text><text x="60.0" y="408.0" font-