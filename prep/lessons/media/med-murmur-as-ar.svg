<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Aortic valve: narrow vs leaky</title><desc id="d">Stenosis faints with SAD, rises slow, and crescendos to the carotids; regurgitation collapses the pulse, widens the pressure, and murmurs early diastolic at the left sternal edge.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Aortic valve: narrow vs leaky</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">SAD faints, leaks collapse</text><rect x="30.0" y="80.0" width="355.0" height="200.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="207.5" y="170.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">STENOSIS: SAD syncope angina dyspnoea. Slow-rising</text><text x="207.5" y="184.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pulse, narrow pressure. Crescendo systolic to</text><text x="207.5" y="198.1" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">carotids, S4. TAVR if high risk; Bentall for root.</text><rect x="415.0" y="80.0" width="355.0" height="200.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="592.5" y="163.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">REGURG: collapsing pulse, wide pressure. Early</text><text x="592.5" y="177.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">diastolic murmur, left sternal edge. Austin Flint,</text><text x="592.5" y="191.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">pistol shot, Duroziez. Marfan root: dissection</text><text x="592.5" y="205.1" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">alarm.</text><text x="207.0" y="320.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Systole: crescendo</text><path d="M80 360 L207 360 L250 332 L293 388 L336 360 L340 360" fill="none" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="70.0" y1="388.0" x2="350.0" y2="388.0" stroke="#9DB5AE" stroke-width="1.4" stroke-linecap="round"/><text x="592.0" y="320.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Diastole: decrescendo</text><line x1="450.0" y1="332.0" x2="460.0" y2="332.0" stroke="#3D5A54" stroke-width="1.4" stroke-linecap="round"/><path d="M465 332 L720 388" fill="none" stroke="#0B6B5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="450.0" y1="388.0" x2="730.0" y2="388.0" stroke="#9DB5AE" stroke-width="1.4" stroke-linecap="round"/><text x="207.0" y="412.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">S1 --- S2</text><text x="592.0" y="412.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">S2 --- S1</text><text x="400.0" y="460.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Pregnancy and AF with MS: the mitral side decompensates and clots.</text></svg>