<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d"><title id="t">Course and branches of the facial nerve (CN VII)</title><desc id="d">Course of the facial nerve: internal acoustic meatus, geniculate ganglion giving greater petrosal nerve, facial canal giving nerve to stapedius and chorda tympani, stylomastoid foramen giving posterior auricular and digastric branches, then the parotid plexus with five terminal branches.</desc><rect width="800" height="600" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Course and branches of the facial nerve (CN VII)</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">In order along the nerve; boxes on the right leave at that level</text><rect x="40.0" y="86.0" width="230.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="155.0" y="114.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Internal acoustic meatus</text><line x1="155.0" y1="134.0" x2="155.0" y2="170.0" stroke="#0B6B5B" stroke-width="2.4" stroke-linecap="round"/><path d="M155.0 178.0 L151.1 168.8 L158.9 168.8 Z" fill="#0B6B5B"/><rect x="40.0" y="178.0" width="230.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="155.0" y="206.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Geniculate ganglion</text><line x1="155.0" y1="226.0" x2="155.0" y2="262.0" stroke="#0B6B5B" stroke-width="2.4" stroke-linecap="round"/><path d="M155.0 270.0 L151.1 260.8 L158.9 260.8 Z" fill="#0B6B5B"/><rect x="40.0" y="270.0" width="230.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="155.0" y="298.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Facial canal (descends)</text><line x1="155.0" y1="318.0" x2="155.0" y2="354.0" stroke="#0B6B5B" stroke-width="2.4" stroke-linecap="round"/><path d="M155.0 362.0 L151.1 352.8 L158.9 352.8 Z" fill="#0B6B5B"/><rect x="40.0" y="362.0" width="230.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="155.0" y="390.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Stylomastoid foramen (exit)</text><line x1="155.0" y1="410.0" x2="155.0" y2="446.0" stroke="#0B6B5B" stroke-width="2.4" stroke-linecap="round"/><path d="M155.0 454.0 L151.1 444.8 L158.9 444.8 Z" fill="#0B6B5B"/><rect x="40.0" y="454.0" width="230.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="155.0" y="482.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parotid plexus</text><rect x="335.0" y="172.0" width="440.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="555.0" y="199.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Greater petrosal nerve</text><text x="555.0" y="213.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lacrimal, nasal and palatine glands</text><line x1="270.0" y1="202.0" x2="326.6" y2="202.0" stroke="#3D5A54" stroke-width="1.6" stroke-linecap="round"/><path d="M333.0 202.0 L325.6 205.1 L325.6 198.9 Z" fill="#3D5A54"/><rect x="335.0" y="256.0" width="440.0" height="36.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="555.0" y="278.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nerve to stapedius</text><line x1="270.0" y1="285.0" x2="326.7" y2="275.1" stroke="#3D5A54" stroke-width="1.6" stroke-linecap="round"/><path d="M333.0 274.0 L326.3 278.3 L325.2 272.2 Z" fill="#3D5A54"/><rect x="335.0" y="300.0" width="440.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="555.0" y="327.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Chorda tympani</text><text x="555.0" y="341.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Taste anterior two thirds; submandibular, sublingual glands</text><line x1="270.0" y1="295.0" x2="327.4" y2="326.9" stroke="#3D5A54" stroke-width="1.6" stroke-linecap="round"/><path d="M333.0 330.0 L325.0 329.1 L328.1 323.7 Z" fill="#3D5A54"/><rect x="335.0" y="374.0" width="440.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="555.0" y="408.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior auricular, posterior belly of digastric, stylohyoid</text><line x1="270.0" y1="386.0" x2="326.8" y2="402.2" stroke="#3D5A54" stroke-width="1.6" stroke-linecap="round"/><path d="M333.0 404.0 L325.1 405.0 L326.8 399.0 Z" fill="#3D5A54"/><rect x="335.0" y="446.0" width="440.0" height="62.0" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.6"/><text x="555.0" y="474.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical</text><text x="555.0" y="488.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">&quot;To Zanzibar By Motor Car&quot;</text><line x1="270.0" y1="478.0" x2="326.6" y2="477.1" stroke="#3D5A54" stroke-width="1.6" stroke-linecap="round"/><path d="M333.0 477.0 L325.7 480.2 L325.6 474.0 Z" fill="#3D5A54"/><text x="400.0" y="552.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">LMN lesion (Bell palsy): whole ipsilateral face weak. UMN lesion: forehead spared.</text><text x="400.0" y="574.0" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Motor root loops around the abducens nucleus (facial colliculus).</text></svg>