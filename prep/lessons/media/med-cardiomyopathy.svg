<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">The three cardiomyopathies at a glance</title>
<desc id="d">Dilated cardiomyopathy is a big floppy cavity with thin walls, low ejection fraction and an S3: think ischaemia, alcohol, peripartum, and tachycardia. Hypertrophic cardiomyopathy is asymmetric septal thickening of 15 millimetres or more with systolic anterior motion and a murmur louder on Valsalva and softer on squatting: screen athletes and families, risk-score for an ICD. Restrictive cardiomyopathy is a stiff ventricle of normal thickness with biatrial enlargement: think amyloid with apical sparing on strain, iron, and sarcoid; do not confuse with constriction or tamponade. Myocarditis mimics infarction with clean coronaries and Lake Louise oedema on MRI.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Three cardiomyopathies: dilate, thicken, stiffen</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cavity, wall, and filling tell the three apart</text>
<rect x="50" y="76" width="220" height="330" fill="#F4F8F6"/>
<rect x="290" y="76" width="220" height="330" fill="#F4F8F6"/>
<rect x="530" y="76" width="220" height="330" fill="#F4F8F6"/>
<text x="160" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">DILATED</text>
<ellipse cx="160" cy="180" rx="62" ry="52" fill="none" stroke="#0B6B5B" stroke-width="5"/>
<ellipse cx="160" cy="180" rx="44" ry="35" fill="#0B6B5B" opacity="0.25"/>
<text x="160" y="262" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">big cavity, thin wall</text>
<text x="160" y="282" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">EF down, S3 present</text>
<text x="160" y="312" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">ischaemia · alcohol</text>
<text x="160" y="332" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">peripartum · tachycardia</text>
<text x="160" y="362" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">wide LBBB → consider CRT</text>
<text x="160" y="384" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">screen first-degree kin</text>
<text x="400" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HYPERTROPHIC</text>
<ellipse cx="400" cy="180" rx="48" ry="46" fill="none" stroke="#0B6B5B" stroke-width="5"/>
<ellipse cx="400" cy="180" rx="26" ry="26" fill="#0B6B5B" opacity="0.25"/>
<rect x="418" y="140" width="16" height="80" fill="#B42318"/>
<text x="400" y="262" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">septum ≥ 15 mm, SAM</text>
<text x="400" y="282" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Valsalva louder, squat softer</text>
<text x="400" y="312" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">exertional syncope, AF</text>
<text x="400" y="332" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">risk-score → ICD</text>
<text x="400" y="362" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">myectomy or septal ablation</text>
<text x="400" y="384" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">athletes screened out</text>
<text x="640" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">RESTRICTIVE</text>
<ellipse cx="640" cy="180" rx="48" ry="46" fill="none" stroke="#0B6B5B" stroke-width="5"/>
<ellipse cx="640" cy="180" rx="30" ry="29" fill="none" stroke="#B7791F" stroke-width="3"/>
<ellipse cx="612" cy="128" rx="14" ry="10" fill="#B7791F" opacity="0.5"/>
<ellipse cx="668" cy="128" rx="14" ry="10" fill="#B7791F" opacity="0.5"/>
<text x="640" y="262" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">stiff, normal thickness</text>
<text x="640" y="282" font-size="11.5" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">biatrial enlargement</text>
<text x="640" y="312" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">amyloid: apical sparing</text>
<text x="640" y="332" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">iron · sarcoid AV block</text>
<text x="640" y="362" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">vs constriction vs tamponade</text>
<text x="640" y="384" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">diuretics: protect preload</text>
<text x="400" y="442" font-size="12" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Myocarditis mimics infarction with clean coronaries: Lake Louise oedema on MRI, rest 3–6 months.</text>
<text x="400" y="466" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Takotsubo balloons with stress and recovers; fulminant failure bridges with ECMO.</text>
</svg>
