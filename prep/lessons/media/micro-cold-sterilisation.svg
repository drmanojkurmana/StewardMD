<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">Cold sterilisation methods for heat-sensitive items</title> <desc id="d">Four method cards: gamma radiation for plastic syringes, catgut sutures and tissue grafts; membrane filtration for serum and heat-labile fluids; ethylene oxide gas which alkylates proteins and nucleic acids, is sporicidal but carcinogenic and toxic; low-temperature plasma sterilisation under vacuum.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cold sterilisation: when heat would destroy it</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Heat-sensitive items need non-heat methods; match the method to the material</text> <rect x="40" y="100" width="350" height="150" rx="12" fill="#071318"/> <text x="215" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Gamma radiation</text> <text x="215" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">plastic syringes</text> <text x="215" y="174" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">catgut sutures, tissue grafts</text> <text x="215" y="200" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">penetrates sealed packs</text> <text x="215" y="222" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">no heat, no residue</text> <rect x="410" y="100" width="350" height="150" rx="12" fill="#071318"/> <text x="585" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Membrane filtration</text> <text x="585" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">serum, heat-labile fluids</text> <text x="585" y="174" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">0.22 micrometre pores hold</text> <text x="585" y="196" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">bacteria back</text> <text x="585" y="222" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">sterilises fluids, not articles</text> <rect x="40" y="270" width="350" height="150" rx="12" fill="#0B6B5B"/> <text x="215" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Ethylene oxide gas</text> <text x="215" y="322" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">alkylates proteins + nucleic acids</text> <text x="215" y="344" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">sporicidal BUT carcinogenic,</text> <text x="215" y="366" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">toxic: aerate before use</text> <text x="215" y="392" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">catheters, plastic devices</text> <rect x="410" y="270" width="350" height="150" rx="12" fill="#0B6B5B"/> <text x="585" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">Low-temperature plasma</text> <text x="585" y="322" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">hydrogen peroxide plasma</text> <text x="585" y="344" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">under vacuum, near room</text> <text x="585" y="366" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">temperature</text> <text x="585" y="392" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">endoscopes, electronics</text> <text x="400" y="460" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Filtration removes microbes from liquids; the other three kill microbes on or in articles.</text> <text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Autoclave first choice whenever the item tolerates 121 C moist heat.</text> </svg>
