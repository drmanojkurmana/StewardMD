<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" role="img" aria-labelledby="t d"><title id="t">Growth hormone axis</title><desc id="d">Growth hormone axis: GHRH raises and somatostatin lowers growth hormone from the anterior pituitary; growth hormone stimulates IGF-1 from the liver, which acts on bone and tissues and feeds back to suppress growth hormone.</desc><rect width="800" height="476" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Growth hormone axis</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">IGF-1 feeds back to inhibit GH release</text><rect x="250.0" y="96.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="118.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hypothalamus: GHRH (+), somatostatin</text><text x="400.0" y="134.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(-)</text><rect x="250.0" y="182.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="204.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior pituitary: growth hormone</text><text x="400.0" y="220.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(pulsatile)</text><rect x="88.0" y="268.0" width="300.0" height="52.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="238.0" y="298.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Liver: IGF-1</text><rect x="412.0" y="268.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="562.0" y="290.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Direct: fat breakdown,</text><text x="562.0" y="306.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">glucose up</text><rect x="250.0" y="354.0" width="300.0" height="52.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="384.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bone growth plates, muscle</text><line x1="400.0" y1="148.0" x2="400.0" y2="174.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 182.0 L396.5 173.7 L403.5 173.7 Z" fill="#3D5A54"/><line x1="400.0" y1="234.0" x2="245.0" y2="266.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M238.0 268.0 L245.4 262.9 L246.8 269.7 Z" fill="#3D5A54"/><line x1="400.0" y1="234.0" x2="555.0" y2="266.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M562.0 268.0 L553.2 269.7 L554.6 262.9 Z" fill="#3D5A54"/><line x1="238.0" y1="320.0" x2="393.0" y2="352.5" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 354.0 L391.2 355.7 L392.6 348.9 Z" fill="#3D5A54"/><text x="400.0" y="458.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Excess: gigantism in children, acromegaly in adults. Deficiency: short stature.</text></svg>