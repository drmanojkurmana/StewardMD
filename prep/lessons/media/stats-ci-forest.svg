<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Forest plot of risk ratios with confidence intervals</title><desc id="d">Forest plot on a log scale: Study A 1.40 (1.10 to 1.80), Study B 0.90 (0.60 to 1.30) crossing the null line at 1, Study C 1.20 (1.00 to 1.50), pooled diamond 1.25 (1.08 to 1.45).</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Confidence intervals on a forest plot (risk ratio)</text><text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The null for a ratio is 1: an interval crossing 1 is not significant at the 5% level</text><line x1="330" y1="104" x2="330" y2="386" stroke="#B42318" stroke-width="2.5" stroke-dasharray="7 5"/><text x="330" y="92" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">null = 1</text><line x1="140" y1="104" x2="140" y2="386" stroke="#E6ECEA" stroke-width="1.5"/><text x="140" y="410" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0.5</text><line x1="330" y1="104" x2="330" y2="386" stroke="#E6ECEA" stroke-width="1.5"/><text x="330" y="410" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">1</text><line x1="520" y1="104" x2="520" y2="386" stroke="#E6ECEA" stroke-width="1.5"/><text x="520" y="410" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">2</text><text x="120" y="145" font-size="14" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Study A</text><line x1="356.12566951248766" y1="140" x2="491.1194122454405" y2="140" stroke="#0B6B5B" stroke-width="3.5"/><circle cx="422.2310971623459" cy="140" r="7" fill="#0B6B5B"/><text x="690" y="145" font-size="12.5" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">1.40 (1.10–1.80)</text><text x="120" y="207" font-size="14" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Study B</text><line x1="189.9765371084208" y1="202" x2="401.9172084182087" y2="202" stroke="#0B6B5B" stroke-width="3.5"/><circle cx="301.1194122454405" cy="202" r="7" fill="#0B6B5B"/><text x="690" y="207" font-size="12.5" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">0.90 (0.60–1.30)</text><text x="120" y="269" font-size="14" font-weight="600" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Study C</text><line x1="330" y1="264" x2="441.1428751370197" y2="264" stroke="#0B6B5B" stroke-width="3.5"/><circle cx="379.9765371084208" cy="264" r="7" fill="#0B6B5B"/><text x="690" y="269" font-size="12.5" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">1.20 (1.00–1.50)</text><text x="120" y="331" font-size="14" font-weight="700" text-anchor="start" fill="#071318" font-family="system-ui,sans-serif">Pooled</text><path d="M351.09594935386133 326 L391.16633802859883 311 L431.8500510456398 326 L391.16633802859883 341 Z" fill="#0B6B5B"/><text x="690" y="331" font-size="12.5" font-weight="600" text-anchor="start" fill="#3D5A54" font-family="system-ui,sans-serif">1.25 (1.08–1.45)</text><text x="400" y="448" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Study B crosses the null: compatible with no effect. The pooled interval excludes 1.</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Width is precision: wide intervals come from small samples or few events (log scale).</text></svg>
