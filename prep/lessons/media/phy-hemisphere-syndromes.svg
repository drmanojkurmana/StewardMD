<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 268" role="img" aria-labelledby="t d"><title id="t">Hemispheric lesions</title><desc id="d">Table of hemisphere syndromes: dominant left hemisphere aphasia and Gerstmann syndrome with agraphia, acalculia, finger agnosia and left right confusion; non-dominant right hemisphere neglect, anosognosia, prosopagnosia and constructional apraxia.</desc><rect width="800" height="268" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hemispheric lesions</text><text x="147.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Side</text><text x="528.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Syndrome features</text><rect x="37.0" y="100.0" width="220.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="147.0" y="134.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Dominant (usually left)</text><line x1="260.0" y1="130.0" x2="283.6" y2="130.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M290.0 130.0 L282.6 133.1 L282.6 126.9 Z" fill="#3D5A54"/><rect x="293.0" y="100.0" width="470.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="528.0" y="126.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Aphasias, Gerstmann: agraphia, acalculia, finger agnosia,</text><text x="528.0" y="142.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">left-right confusion</text><rect x="37.0" y="174.0" width="220.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="147.0" y="208.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Non-dominant (usually right)</text><line x1="260.0" y1="204.0" x2="283.6" y2="204.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M290.0 204.0 L282.6 207.1 L282.6 200.9 Z" fill="#3D5A54"/><rect x="293.0" y="174.0" width="470.0" height="60.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="528.0" y="200.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Contralateral neglect, anosognosia, prosopagnosia,</text><text x="528.0" y="216.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">constructional apraxia, dressing apraxia</text></svg>