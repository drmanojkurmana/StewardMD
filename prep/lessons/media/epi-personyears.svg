<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"><title id="t">Person-years: people multiplied by time followed</title><desc id="d">Five horizontal timelines of different lengths add to thirty person-years. Below, twenty-five people followed for thirty years give seven hundred and fifty person-years.</desc><rect width="800" height="520" fill="#FFFFFF"/><text x="400.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Person-years: people multiplied by time followed</text><text x="400.0" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Add every person's years under observation to get the denominator</text><line x1="150" y1="120" x2="150" y2="330" stroke="#071318" stroke-width="2"/><line x1="150" y1="330" x2="700" y2="330" stroke="#071318" stroke-width="2"/><text x="425" y="352" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Years under observation</text><text x="120" y="145" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Person A</text><rect x="150" y="128" width="500" height="24" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="658.0" y="145" font-size="12" font-weight="600" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">10 yrs</text><text x="150.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="400.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">5</text><text x="650.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">10</text><text x="120" y="183" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Person B</text><rect x="150" y="166" width="400" height="24" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="558.0" y="183" font-size="12" font-weight="600" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">8 yrs</text><text x="150.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="400.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">5</text><text x="650.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">10</text><text x="120" y="221" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Person C</text><rect x="150" y="204" width="300" height="24" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="458.0" y="221" font-size="12" font-weight="600" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">6 yrs</text><text x="150.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="400.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">5</text><text x="650.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">10</text><text x="120" y="259" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Person D</text><rect x="150" y="242" width="200" height="24" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="358.0" y="259" font-size="12" font-weight="600" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">4 yrs</text><text x="150.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="400.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">5</text><text x="650.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">10</text><text x="120" y="297" font-size="12" font-weight="700" text-anchor="end" fill="#071318" font-family="system-ui,sans-serif">Person E</text><rect x="150" y="280" width="100" height="24" fill="#EAF3F0" stroke="#0B6B5B" stroke-width="2.5"/><text x="258.0" y="297" font-size="12" font-weight="600" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">2 yrs</text><text x="150.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">0</text><text x="400.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">5</text><text x="650.0" y="372" font-size="10.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">10</text><text x="400" y="408" font-size="13.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">10 + 8 + 6 + 4 + 2 = 30 person-years</text><text x="400" y="440" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Lesson example: 25 people x 30 years = 750 person-years</text><text x="400.0" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cohort incidence divides new cases by person-years, not by people.</text></svg>
