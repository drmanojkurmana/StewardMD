<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d"><title id="t">Red cell and haemoglobin</title><desc id="d">d</desc><rect width="800" height="480" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Red cell and haemoglobin</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cross-section of the cell and structure of haemoglobin</text><path d="M80 200 C80 140 150 130 200 160 C250 130 320 140 320 200 C320 260 250 270 200 240 C150 270 80 260 80 200 Z" fill="#E3A19A" stroke="#071318" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="80.0" y1="330.0" x2="320.0" y2="330.0" stroke="#071318" stroke-width="1.5" stroke-linecap="round"/><line x1="80.0" y1="324.0" x2="80.0" y2="336.0" stroke="#071318" stroke-width="1.5" stroke-linecap="round"/><line x1="320.0" y1="324.0" x2="320.0" y2="336.0" stroke="#071318" stroke-width="1.5" stroke-linecap="round"/><text x="200.0" y="352.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">about 7.5 micrometres</text><text x="200.0" y="100.0" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Biconcave disc, no nucleus</text><text x="200.0" y="380.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Large surface area to volume ratio, deformable</text><text x="200.0" y="398.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lifespan about 120 days; energy from glycolysis only</text><circle cx="520.0" cy="170.0" r="42" fill="#C9D8EC" stroke="#071318" stroke-width="1.8"/><text x="520.0" y="175.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">alpha</text><circle cx="534.0" cy="156.0" r="8" fill="#B3382C" stroke="#071318" stroke-width="1.4"/><circle cx="620.0" cy="170.0" r="42" fill="#F5DDA6" stroke="#071318" stroke-width="1.8"/><text x="620.0" y="175.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">beta</text><circle cx="606.0" cy="156.0" r="8" fill="#B3382C" stroke="#071318" stroke-width="1.4"/><circle cx="520.0" cy="270.0" r="42" fill="#F5DDA6" stroke="#071318" stroke-width="1.8"/><text x="520.0" y="275.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">beta</text><circle cx="534.0" cy="256.0" r="8" fill="#B3382C" stroke="#071318" stroke-width="1.4"/><circle cx="620.0" cy="270.0" r="42" fill="#C9D8EC" stroke="#071318" stroke-width="1.8"/><text x="620.0" y="275.0" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">alpha</text><circle cx="606.0" cy="256.0" r="8" fill="#B3382C" stroke="#071318" stroke-width="1.4"/><text x="570.0" y="100.0" font-size="14" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Haemoglobin A (alpha 2 beta 2)</text><text x="570.0" y="345.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Each chain: one haem, one Fe2+, one O2 (four per molecule)</text><text x="570.0" y="380.0" font-size="12" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">HbF: alpha 2 gamma 2    HbA2: alpha 2 delta 2</text><text x="570.0" y="400.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Foetal Hb binds 2,3-BPG poorly, so it has higher O2 affinity</text></svg>