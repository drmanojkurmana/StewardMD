<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" role="img" aria-labelledby="t d"><title id="t">Lymphatic drainage of the breast</title><desc id="d">Flow diagram of breast lymph drainage: about three quarters drains to axillary nodes (anterior pectoral, central, apical) and the medial part to parasternal nodes along the internal thoracic artery, then to subclavian trunks.</desc><rect width="800" height="506" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Lymphatic drainage of the breast</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Level I lateral, II behind, III medial to pectoralis minor</text><rect x="270.0" y="96.0" width="260.0" height="58.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="129.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Breast</text><rect x="128.0" y="190.0" width="260.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="258.0" y="215.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Axillary nodes</text><text x="258.0" y="231.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(about 75 percent)</text><rect x="412.0" y="190.0" width="260.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="542.0" y="215.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parasternal nodes</text><text x="542.0" y="231.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(medial; internal thoracic)</text><rect x="128.0" y="284.0" width="260.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="258.0" y="317.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Central, then apical nodes</text><rect x="412.0" y="284.0" width="260.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="542.0" y="309.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Opposite breast and</text><text x="542.0" y="325.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">abdominal nodes (rare)</text><rect x="270.0" y="378.0" width="260.0" height="58.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="411.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Subclavian lymph trunk</text><line x1="400.0" y1="154.0" x2="265.0" y2="188.2" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M258.0 190.0 L265.2 184.6 L266.9 191.4 Z" fill="#3D5A54"/><line x1="400.0" y1="154.0" x2="535.0" y2="188.2" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M542.0 190.0 L533.1 191.4 L534.8 184.6 Z" fill="#3D5A54"/><line x1="258.0" y1="248.0" x2="258.0" y2="276.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M258.0 284.0 L254.5 275.7 L261.5 275.7 Z" fill="#3D5A54"/><line x1="542.0" y1="248.0" x2="542.0" y2="276.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M542.0 284.0 L538.5 275.7 L545.5 275.7 Z" fill="#3D5A54"/><line x1="258.0" y1="342.0" x2="393.0" y2="376.2" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 378.0 L391.1 379.4 L392.8 372.6 Z" fill="#3D5A54"/><text x="400.0" y="488.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sentinel node biopsy samples the first axillary node, usually anterior (pectoral) group.</text></svg>