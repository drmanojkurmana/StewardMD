<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 538" role="img" aria-labelledby="t d"><title id="t">Renin-angiotensin-aldosterone system</title><desc id="d">Flow diagram of the renin angiotensin aldosterone system: low renal perfusion or low sodium at the macula densa or sympathetic activity releases renin, which converts angiotensinogen to angiotensin I, ACE converts it to angiotensin II, which constricts vessels and drives aldosterone, retaining sodium and water.</desc><rect width="800" height="538" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Renin-angiotensin-aldosterone system</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Result: blood volume and blood pressure rise</text><rect x="215.0" y="90.0" width="370.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="110.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low renal perfusion, low Na+ at macula densa,</text><text x="400.0" y="126.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">sympathetic beta-1 drive</text><rect x="215.0" y="156.0" width="370.0" height="48.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="184.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Renin from juxtaglomerular cells</text><rect x="215.0" y="222.0" width="370.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="250.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Angiotensinogen (liver) to angiotensin I</text><rect x="215.0" y="288.0" width="370.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="316.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">ACE (lung endothelium) to angiotensin II</text><rect x="18.0" y="354.0" width="370.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="203.0" y="382.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Vasoconstriction (AT1), ADH, thirst</text><rect x="412.0" y="354.0" width="370.0" height="48.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="597.0" y="382.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Aldosterone (zona glomerulosa)</text><rect x="412.0" y="420.0" width="370.0" height="48.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="597.0" y="440.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Principal cells: Na+ and water retained,</text><text x="597.0" y="456.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">K+ and H+ excreted</text><line x1="400.0" y1="138.0" x2="400.0" y2="148.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 156.0 L396.5 147.7 L403.5 147.7 Z" fill="#3D5A54"/><line x1="400.0" y1="204.0" x2="400.0" y2="214.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 222.0 L396.5 213.7 L403.5 213.7 Z" fill="#3D5A54"/><line x1="400.0" y1="270.0" x2="400.0" y2="280.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 288.0 L396.5 279.7 L403.5 279.7 Z" fill="#3D5A54"/><line x1="400.0" y1="336.0" x2="210.2" y2="353.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M203.0 354.0 L210.9 349.8 L211.6 356.7 Z" fill="#3D5A54"/><line x1="400.0" y1="336.0" x2="589.8" y2="353.3" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M597.0 354.0 L588.4 356.7 L589.1 349.8 Z" fill="#3D5A54"/><line x1="597.0" y1="402.0" x2="597.0" y2="412.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M597.0 420.0 L593.5 411.7 L600.5 411.7 Z" fill="#3D5A54"/><text x="400.0" y="520.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">ACE inhibitors and ARBs block this pathway; spironolactone blocks the aldosterone receptor.</text></svg>