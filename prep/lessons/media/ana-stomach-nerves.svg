<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" role="img" aria-labelledby="t d"><title id="t">Vagal supply of the stomach</title><desc id="d">Flow diagram of stomach nerve supply: left vagus becomes the anterior vagal trunk giving the anterior nerve of Latarjet and hepatic branch; right vagus becomes the posterior trunk giving the posterior nerve of Latarjet, the nerve of Grassi to the fundus and the coeliac branch.</desc><rect width="800" height="432" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Vagal supply of the stomach</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Truncal vagotomy cuts both trunks above the branches</text><rect x="68.0" y="96.0" width="320.0" height="66.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="228.0" y="133.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Left vagus</text><rect x="412.0" y="96.0" width="320.0" height="66.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="572.0" y="133.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Right vagus</text><rect x="68.0" y="196.0" width="320.0" height="66.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="228.0" y="233.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior vagal trunk</text><rect x="412.0" y="196.0" width="320.0" height="66.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="572.0" y="233.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior vagal trunk</text><rect x="68.0" y="296.0" width="320.0" height="66.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="228.0" y="325.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anterior nerve of Latarjet</text><text x="228.0" y="341.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Hepatic branch</text><rect x="412.0" y="296.0" width="320.0" height="66.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="572.0" y="317.7" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Posterior nerve of Latarjet</text><text x="572.0" y="333.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Nerve of Grassi (fundus)</text><text x="572.0" y="349.4" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Coeliac branch</text><line x1="228.0" y1="162.0" x2="228.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M228.0 196.0 L224.5 187.7 L231.5 187.7 Z" fill="#3D5A54"/><line x1="572.0" y1="162.0" x2="572.0" y2="188.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M572.0 196.0 L568.5 187.7 L575.5 187.7 Z" fill="#3D5A54"/><line x1="228.0" y1="262.0" x2="228.0" y2="288.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M228.0 296.0 L224.5 287.7 L231.5 287.7 Z" fill="#3D5A54"/><line x1="572.0" y1="262.0" x2="572.0" y2="288.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M572.0 296.0 L568.5 287.7 L575.5 287.7 Z" fill="#3D5A54"/><text x="400.0" y="414.0" font-size="12.5" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Nerve of Grassi (criminal nerve): missed in vagotomy, causing recurrent ulcer.</text></svg>