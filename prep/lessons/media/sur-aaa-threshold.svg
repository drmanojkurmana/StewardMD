<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d"> <title id="t">AAA repair thresholds and the ruptured aneurysm branch</title> <desc id="d">Elective repair at 5.5 cm in men, 5.0 cm in women, or growth over 5 mm in 6 months. Rupture gives back or flank pain, a pulsatile mass and hypotension, complete in only half: stable patients go to CT, unstable straight to theatre with permissive hypotension 70 to 90 and clamp or balloon control.</desc> <rect width="800" height="520" fill="#FFFFFF"/> <text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">AAA: measure it, watch growth, respect rupture</text> <text x="400" y="56" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Aneurysm means over 3.0 cm: every millimetre past that raises the stakes</text> <g font-family="system-ui,sans-serif" text-anchor="middle"> <rect x="60" y="80" width="200" height="110" rx="12" fill="#071318"/><text x="160" y="110" font-size="13" font-weight="700" fill="#42CDB5">DEFINE</text><text x="160" y="136" font-size="15" font-weight="700" fill="#FFFFFF">over 3.0 cm</text><text x="160" y="158" font-size="11.5" font-weight="400" fill="#FFFFFF">focal dilation:</text><text x="160" y="174" font-size="11.5" font-weight="400" fill="#FFFFFF">it is an aneurysm</text> <rect x="280" y="80" width="220" height="110" rx="12" fill="#B7791F"/><text x="390" y="110" font-size="13" font-weight="700" fill="#071318">ELECTIVE REPAIR AT</text><text x="390" y="136" font-size="15" font-weight="700" fill="#071318">5.5 cm men</text><text x="390" y="160" font-size="15" font-weight="700" fill="#071318">5.0 cm women</text><text x="390" y="180" font-size="11.5" font-weight="400" fill="#071318">or growth over 5 mm / 6 mo</text> <rect x="520" y="80" width="220" height="110" rx="12" fill="#071318"/><text x="630" y="110" font-size="13" font-weight="700" fill="#42CDB5">EVAR NEEDS</text><text x="630" y="136" font-size="12.5" font-weight="400" fill="#FFFFFF">a friendly neck:</text><text x="630" y="158" font-size="12.5" font-weight="400" fill="#FFFFFF">landing zone seals</text><text x="630" y="180" font-size="12.5" font-weight="700" fill="#B7791F">else open repair</text> </g> <rect x="60" y="210" width="680" height="180" rx="12" fill="#B42318"/> <text x="400" y="240" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">RUPTURE: BACK OR FLANK PAIN + PULSATILE MASS + HYPOTENSION</text> <text x="400" y="264" font-size="12.5" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">The full triad shows in only half of cases: never wait for all three.</text> <text x="250" y="300" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">STABLE: immediate CT</text> <text x="250" y="322" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">contrast scan confirms</text> <text x="250" y="340" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">size and leak site</text> <text x="550" y="300" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">UNSTABLE: straight to theatre</text> <text x="550" y="322" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">permissive hypotension 70-90</text> <text x="550" y="340" font-size="12" font-weight="400" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">clamp or balloon occlusion</text> <text x="400" y="368" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif">No CT in the unstable: the scanner is where ruptures go to die.</text> <text x="400" y="440" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Screen once, then survey yearly: a 4.5 cm aneurysm growing 6 mm in 6 months earns repair.</text> <text x="400" y="461" font-size="11" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Carotid disease travels with AAA: feel the neck, listen for a bruit, protect the brain.</text> </svg>
