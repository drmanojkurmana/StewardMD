<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">Thyroid hormone synthesis in the follicle</title><desc id="d">d</desc><rect width="800" height="500" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thyroid hormone synthesis in the follicle</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Carbimazole and propylthiouracil block TPO; excess iodide transiently blocks release (Wolff-Chaikoff)</text><rect x="180.0" y="92.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="124.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Iodide trapped by NIS (Na+/I- symporter)</text><rect x="180.0" y="170.0" width="440.0" height="56.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="194.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Thyroid peroxidase (TPO): oxidises iodide,</text><text x="400.0" y="210.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">iodinates tyrosines on thyroglobulin (MIT, DIT)</text><rect x="180.0" y="248.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="272.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Coupling: MIT + DIT = T3; DIT + DIT = T4;</text><text x="400.0" y="288.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">stored in colloid</text><rect x="180.0" y="326.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="358.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">TSH: endocytosis, proteolysis of thyroglobulin</text><rect x="180.0" y="404.0" width="440.0" height="56.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="436.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">T4 (prohormone) and T3 (active) released</text><line x1="400.0" y1="148.0" x2="400.0" y2="162.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 170.0 L396.5 161.7 L403.5 161.7 Z" fill="#3D5A54"/><line x1="400.0" y1="226.0" x2="400.0" y2="240.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 248.0 L396.5 239.7 L403.5 239.7 Z" fill="#3D5A54"/><line x1="400.0" y1="304.0" x2="400.0" y2="318.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 326.0 L396.5 317.7 L403.5 317.7 Z" fill="#3D5A54"/><line x1="400.0" y1="382.0" x2="400.0" y2="396.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 404.0 L396.5 395.7 L403.5 395.7 Z" fill="#3D5A54"/></svg>