<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Beta-lactam spectrum ladder from penicillins to carbapenems</title>
<desc id="d">Spectrum widens left to right: narrow penicillins (benzylpenicillin for strep, meningococcus, syphilis), aminopenicillins (amoxicillin, ampicillin with EBV rash warning), antistaphylococcal cloxacillin for MSSA, antipseudomonal piperacillin-tazobactam, cephalosporin generations 1 to 5 with exemplars cefazolin, cefuroxime, ceftriaxone, ceftazidime and ceftaroline, carbapenems meropenem and imipenem-cilastatin for ESBL with ertapenem lacking pseudomonas cover, and beta-lactamase inhibitors that never work alone. All block penicillin-binding proteins and peptidoglycan crosslinking.</desc>
<rect width="800" height="520" fill="#FFFFFF"/>
<text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Beta-Lactam Spectrum Ladder</text>
<text x="400" y="56" font-size="12.5" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">All block PBPs and peptidoglycan crosslinking; spectrum widens left to right</text>
<rect x="30" y="80" width="170" height="260" rx="8" fill="#F4F8F6" stroke="#0B6B5B" stroke-width="1.5"/>
<text x="115" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">PENICILLINS</text>
<text x="42" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Benzylpenicillin: strep,</text>
<text x="42" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">meningococcus, syphilis</text>
<text x="42" y="168" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Amino (amox/ampi):</text>
<text x="42" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">enterococcus, Listeria;</text>
<text x="42" y="200" font-size="10.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">EBV rash warns</text>
<text x="42" y="222" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Cloxacillin: MSSA only</text>
<text x="42" y="244" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Piperacillin-tazo:</text>
<text x="42" y="260" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">pseudomonas cover</text>
<text x="42" y="290" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">Short half life;</text>
<text x="42" y="306" font-size="10.5" fill="#3D5A54" font-family="system-ui,sans-serif">renal dosing</text>
<rect x="215" y="80" width="200" height="260" rx="8" fill="#FFFFFF" stroke="#071318" stroke-width="1.2"/>
<text x="315" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CEPHALOSPORINS</text>
<text x="227" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">1st cefazolin: surgical</text>
<text x="227" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">prophylaxis, MSSA</text>
<text x="227" y="168" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">2nd cefuroxime: respiratory;</text>
<text x="227" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">cefoxitin anaerobes</text>
<text x="227" y="206" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">3rd ceftriaxone: meningitis,</text>
<text x="227" y="222" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">gonorrhoea (biliary sludge);</text>
<text x="227" y="238" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">ceftazidime: pseudomonas</text>
<text x="227" y="260" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">4th cefepime + 5th</text>
<text x="227" y="276" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">ceftaroline (MRSA)</text>
<rect x="430" y="80" width="185" height="260" rx="8" fill="#FBF8EE" stroke="#B7791F" stroke-width="1.2"/>
<text x="522" y="106" font-size="13" font-weight="700" text-anchor="middle" fill="#B7791F" font-family="system-ui,sans-serif">CARBAPENEMS</text>
<text x="442" y="130" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Meropenem, imipenem</text>
<text x="442" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">+ cilastatin (blocks renal</text>
<text x="442" y="162" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">dehydropeptidase)</text>
<text x="442" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Broadest: covers ESBL,</text>
<text x="442" y="200" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">resistant nosocomial</text>
<text x="442" y="222" font-size="10.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">Imipenem: seizures;</text>
<text x="442" y="238" font-size="10.5" font-weight="700" fill="#B42318" font-family="system-ui,sans-serif">crashes valproate levels</text>
<text x="442" y="260" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Ertapenem: once daily,</text>
<text x="442" y="276" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">NO pseudomonas cover</text>
<rect x="630" y="80" width="140" height="260" rx="8" fill="#FDF2F0" stroke="#B42318" stroke-width="1.2"/>
<text x="700" y="106" font-size="11" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">INHIBITORS</text>
<text x="700" y="122" font-size="10" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">(never alone)</text>
<text x="642" y="146" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Clavulanate:</text>
<text x="642" y="162" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">hepatotoxic</text>
<text x="642" y="184" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Sulbactam,</text>
<text x="642" y="200" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">tazobactam</text>
<text x="642" y="222" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">Avibactam:</text>
<text x="642" y="238" font-size="10.5" fill="#071318" font-family="system-ui,sans-serif">rescues KPC</text>
<rect x="30" y="360" width="740" height="60" rx="6" fill="#FDF2F0" stroke="#B42318" stroke-width="1.2"/>
<text x="400" y="384" font-size="12" font-weight="700" text-anchor="middle" fill="#B42318" font-family="system-ui,sans-serif">Penicillin allergy: IgE anaphylaxis needs skin testing; cephalosporin cross-reactivity is low except shared side chains</text>
<text x="400" y="404" font-size="11" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Co-amoxiclav diarrhoea is common; monobactam aztreonam is safe in penicillin allergy (no cross-reactivity).</text>
<text x="400" y="452" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Time above MIC drives killing: give beta-lactams on schedule, and dose renally except ceftriaxone.</text>
<text x="400" y="505" font-size="11" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Reserve carbapenems for ESBL and resistant nosocomial infection; ertapenem suits community ESBL without pseudomonas.</text>
</svg>
