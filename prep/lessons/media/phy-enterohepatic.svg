<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Enterohepatic circulation of bile acids</title><desc id="d">d</desc><rect width="800" height="430" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Enterohepatic circulation of bile acids</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">About 5 percent lost in faeces and replaced by new synthesis</text><rect x="230.0" y="90.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="116.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Liver: bile acids made from cholesterol</text><rect x="230.0" y="154.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="180.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Gallbladder: stored, concentrated</text><rect x="230.0" y="218.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="236.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">CCK contracts it: bile enters duodenum,</text><text x="400.0" y="252.5" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">micelles solubilise fat</text><rect x="230.0" y="282.0" width="340.0" height="44.0" rx="8" fill="#FFF1CC" stroke="#B7791F" stroke-width="1.6"/><text x="400.0" y="308.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Terminal ileum: about 95 percent reabsorbed</text><rect x="230.0" y="346.0" width="340.0" height="44.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="400.0" y="372.6" font-size="13" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Portal vein back to the liver</text><line x1="400.0" y1="134.0" x2="400.0" y2="146.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 154.0 L396.5 145.7 L403.5 145.7 Z" fill="#3D5A54"/><line x1="400.0" y1="198.0" x2="400.0" y2="210.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 218.0 L396.5 209.7 L403.5 209.7 Z" fill="#3D5A54"/><line x1="400.0" y1="262.0" x2="400.0" y2="274.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 282.0 L396.5 273.7 L403.5 273.7 Z" fill="#3D5A54"/><line x1="400.0" y1="326.0" x2="400.0" y2="338.8" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M400.0 346.0 L396.5 337.7 L403.5 337.7 Z" fill="#3D5A54"/><line x1="570.0" y1="368.0" x2="600.0" y2="368.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="600.0" y1="368.0" x2="600.0" y2="112.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="600.0" y1="112.0" x2="579.2" y2="112.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M572.0 112.0 L580.3 108.5 L580.3 115.5 Z" fill="#3D5A54"/></svg>