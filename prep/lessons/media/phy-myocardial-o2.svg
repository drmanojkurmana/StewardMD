<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Myocardial oxygen: demand and supply</title><desc id="d">d</desc><rect width="800" height="440" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Myocardial oxygen: demand and supply</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Extraction at rest is already about 70 percent, so more demand needs more flow</text><rect x="60.0" y="100.0" width="300.0" height="190.0" rx="8" fill="#FBE3E0" stroke="#B3382C" stroke-width="1.6"/><text x="210.0" y="166.8" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">DEMAND</text><text x="210.0" y="183.3" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif"></text><text x="210.0" y="199.7" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Heart rate</text><text x="210.0" y="216.2" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Contractility</text><text x="210.0" y="232.7" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Wall tension: preload and afterload</text><rect x="440.0" y="100.0" width="300.0" height="190.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="590.0" y="158.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">SUPPLY</text><text x="590.0" y="175.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif"></text><text x="590.0" y="191.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Diastolic aortic pressure</text><text x="590.0" y="208.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Low coronary resistance</text><text x="590.0" y="224.4" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Long diastolic time</text><text x="590.0" y="240.9" font-size="13.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Oxygen content (haemoglobin)</text><text x="400.0" y="205.0" font-size="18" font-weight="700" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">vs</text><text x="400.0" y="340.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Left ventricular coronary flow occurs mainly in diastole.</text><text x="400.0" y="362.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Tachycardia raises demand and shortens diastole: angina.</text></svg>