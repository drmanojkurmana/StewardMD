<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d"><title id="t">Parietal cell acid secretion</title><desc id="d">d</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parietal cell acid secretion</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Lumen at the top, blood at the bottom</text><rect x="170.0" y="150.0" width="460.0" height="250.0" rx="8" fill="#F6E8E4" stroke="#071318" stroke-width="2.2"/><text x="60.0" y="130.0" font-size="13" font-weight="700" text-anchor="start" fill="#0B6B5B" font-family="system-ui,sans-serif">LUMEN</text><text x="60.0" y="430.0" font-size="13" font-weight="700" text-anchor="start" fill="#B3382C" font-family="system-ui,sans-serif">BLOOD</text><text x="400.0" y="178.0" font-size="14" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Parietal cell</text><rect x="250.0" y="140.0" width="70.0" height="22.0" rx="6" fill="#E8C547" stroke="#071318" stroke-width="1.6"/><text x="285.0" y="154.0" font-size="9" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">H+/K+ ATPase</text><line x1="268.0" y1="140.0" x2="268.0" y2="107.2" stroke="#B3382C" stroke-width="2.4" stroke-linecap="round"/><path d="M268.0 100.0 L271.5 108.3 L264.5 108.3 Z" fill="#B3382C"/><line x1="300.0" y1="100.0" x2="300.0" y2="132.8" stroke="#3D5A54" stroke-width="2" stroke-linecap="round"/><path d="M300.0 140.0 L296.5 131.7 L303.5 131.7 Z" fill="#3D5A54"/><text x="255.0" y="90.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#B3382C" font-family="system-ui,sans-serif">H+ out</text><text x="318.0" y="90.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">K+ in</text><rect