amily="system-ui,sans-serif">ACh</text><text x="520.0" y="440.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">gastrin</text><text x="570.0" y="440.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">histamine</text><text x="400.0" y="506.0" font-size="12" font-weight="500" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">PPIs (omeprazole) block the pump; H2 blockers block histamine; both lower acid.</text></svg>