<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 324" role="img" aria-labelledby="t d"><title id="t">Pleural and lung surface levels</title><desc id="d">Table of surface levels of lung and pleura in ribs: lung reaches rib 6 at the midclavicular line, rib 8 at the midaxillary line and rib 10 posteriorly; pleura reaches rib 8, rib 10 and rib 12 at the same lines.</desc><rect width="800" height="324" fill="#FFFFFF"/><text x="400.0" y="32.0" font-size="20" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pleural and lung surface levels</text><text x="400.0" y="54.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">The gap is the costodiaphragmatic recess: the site for pleural taps</text><text x="164.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Reference line</text><text x="415.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Lower edge of lung</text><text x="651.0" y="86.0" font-size="13" font-weight="700" text-anchor="middle" fill="#0B6B5B" font-family="system-ui,sans-serif">Lower edge of pleura</text><rect x="49.0" y="100.0" width="230.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#9DB5AE" stroke-width="1.6"/><text x="164.0" y="131.4" font-size="12.5" font-weight="500" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Midclavicular line</text><line x1="282.0" y1="127.0" x2="305.6" y2="127.0" stroke="#3D5A54" stroke-width="1.8" stroke-linecap="round"/><path d="M312.0 127.0 L304.6 130.1 L304.6 123.9 Z" fill="#3D5A54"/><rect x="315.0" y="100.0" width="200.0" height="54.0" rx="8" fill="#E3F3EF" stroke="#0B6B5B" stroke-width="1.6"/><text x="415.0" y="131.4" font-size="12.5" font-weight="600" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Rib 6</text><line x1="518.0" y1="127.0" x2="541.6" y