iddle" fill="#071318" font-family="system-ui,sans-serif">LV</text><text x="120" y="185" font-size="12" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">ASD (secundum)</text><line x1="185" y1="188" x2="387" y2="185" stroke="#071318" stroke-width="1.2"/><circle cx="387" cy="185" r="3" fill="#071318"/><text x="120" y="258" font-size="12" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">ASD (primum, low)</text><line x1="185" y1="261" x2="390" y2="258" stroke="#071318" stroke-width="1.2"/><circle cx="390" cy="258" r="3" fill="#071318"/><text x="680" y="322" font-size="12" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">VSD (membranous,</text><text x="680" y="338" font-size="12" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">upper septum)</text><line x1="612" y1="325" x2="411" y2="322" stroke="#071318" stroke-width="1.2"/><circle cx="411" cy="322" r="3" fill="#071318"/><text x="680" y="80" font-size="12" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">PDA (red link)</text><line x1="615" y1="82" x2="553" y2="80" stroke="#071318" stroke-width="1.2"/><circle cx="553" cy="80" r="3" fill="#071318"/><text x="400" y="480" font-size="11" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Septa: teal atrial above, ventricular below the AV line. Red rings = defect sites.</text><text x="400" y="528" font-size="11" font-weight="400" text-anchor="middle" fill="#5B6B66" font-family="system-ui,sans-serif">StewardMD illustration (original schematic, not to scale)</text></svg>