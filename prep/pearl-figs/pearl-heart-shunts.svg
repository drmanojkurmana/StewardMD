<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,sans-serif"><text x="320" y="28" text-anchor="middle" font-size="16" fill="#071318" font-weight="700">Sites of ASD, VSD and PDA in the heart</text><rect x="180" y="80" width="280" height="220" rx="24" fill="#FBE9E7" stroke="#A33A2C"/><text x="320" y="140" text-anchor="middle" font-size="13" fill="#071318" font-weight="700">ASD: between atria</text><text x="320" y="200" text-anchor="middle" font-size="13" fill="#071318" font-weight="700">VSD: between ventricles</text><text x="320" y="260" text-anchor="middle" font-size="13" fill="#071318" font-weight="700">PDA: aorta to pulmonary artery</text><text x="320" y="385" text-anchor="middle" font-size="11" fill="#5b6573">StewardMD illustration (original schematic, not to scale)</text></svg>