<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,sans-serif"><text x="320" y="28" text-anchor="middle" font-size="16" fill="#071318" font-weight="700">Perineal muscles: male and female, inferior view</text><rect x="40" y="90" width="260" height="120" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="170.0" y="154.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Male: bulbospongiosus midline</text><rect x="340" y="90" width="260" height="120" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="470.0" y="154.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Female: muscles split by vagina</text><text x="320" y="260" text-anchor="middle" font-size="11" fill="#5b6573" font-weight="400">Both: ischiocavernosus, superficial and deep transverse perineal, external anal sphincter.</text><text x="320" y="385" text-anchor="middle" font-size="11" fill="#5b6573">StewardMD illustration (original schematic, not to scale)</text></svg>