<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,sans-serif"><text x="320" y="28" text-anchor="middle" font-size="16" fill="#071318" font-weight="700">Development of the interatrial septum</text><rect x="40" y="100" width="170" height="110" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="125.0" y="159.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Septum primum grows down</text><rect x="240" y="100" width="170" height="110" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="325.0" y="159.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Foramen secundum forms</text><rect x="440" y="100" width="160" height="110" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="520.0" y="159.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Septum secundum overlaps</text><text x="320" y="260" text-anchor="middle" font-size="11" fill="#5b6573" font-weight="400">Foramen ovale lets fetal blood pass right to left; it closes after birth.</text><text x="320" y="385" text-anchor="middle" font-size="11" fill="#5b6573">StewardMD illustration (original schematic, not to scale)</text></svg>