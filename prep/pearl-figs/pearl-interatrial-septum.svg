<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="system-ui,sans-serif"><rect width="800" height="540" fill="#FFFFFF"/><text x="400" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Development of the interatrial septum</text><text x="400" y="50" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Seen from the right atrium (schematic)</text><rect x="30" y="100" width="168" height="250" rx="78" fill="#F3E3C2" stroke="#071318"/><text x="114" y="124" font-size="10" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">from RA</text><path d="M108 128 Q82 215 108 282" fill="none" stroke="#0E7C6B" stroke-width="7"/><text x="114" y="385" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">1 · Septum primum</text><text x="114" y="401" font-size="10" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">grows down</text><text x="114" y="362" font-size="9" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">foramen primum (gap)</text><rect x="218" y="100" width="168" height="250" rx="78" fill="#F3E3C2" stroke="#071318"/><text x="302" y="124" font-size="10" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">from RA</text><path d="M296 128 Q270 215 296 340" fill="none" stroke="#0E7C6B" stroke-width="7"/><path d="M318 132 Q340 215 316 300" fill="none" stroke="#071318" stroke-width="7"/><circle cx="284" cy="168" r="6" fill="#FFFFFF" stroke="#071318"/><circle cx="280" cy="192" r="6" fill="#FFFFFF" stroke="#071318"/><text x="302" y="385" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">2 · Secundum holes</text><text x="302" y="401" font-size="10" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">primum shut below</text><text x="302" y="362" font-size="9" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">foramen secundum (holes)</text><rect x="406" y="100" width="168" height="250" rx="78" fill="#F3E3C2" stroke="#071318"/><text x="490" y="124" font-size="10" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">from RA</text><path d="M484 128 Q458 215 484 340" fill="none" stroke="#0E7C6B" stroke-width="7"/><path d="M506 132 Q528 215 504 300" fill="none" stroke="#071318" stroke-width="7"/><circle cx="472" cy="168" r="6" fill="#FFFFFF" stroke="#071318"/><circle cx="468" cy="192" r="6" fill="#FFFFFF" stroke="#071318"/><text x="490" y="385" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">3 · Foramen ovale</text><text x="490" y="401" font-size="10" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">primum = flap</text><text x="490" y="362" font-size="9" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">channel past flap</text><rect x="594" y="100" width="168" height="250" rx="78" fill="#F3E3C2" stroke="#071318"/><path d="M678 128 Q660 220 678 340" fill="none" stroke="#071318" stroke-width="7"/><path d="M674 130 Q658 220 674 336" fill="none" stroke="#0E7C6B" stroke-width="4"/><text x="678" y="124" font-size="10" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">fused wall</text><text x="678" y="385" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">4 · After birth</text><text x="678" y="401" font-size="10" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">fossa ovalis</text><circle cx="496" cy="288" r="10" fill="none" stroke="#B3261E" stroke-width="3"/><text x="496" y="322" font-size="10" font-weight="700" text-anchor="middle" fill="#B3261E" font-family="system-ui,sans-serif">foramen ovale</text><text x="110" y="470" font-size="12" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">Septum primum (teal)</text><line x1="195" y1="468" x2="108" y2="215" stroke="#071318" stroke-width="1.2"/><circle cx="108" cy="215" r="3" fill="#071318"/><text x="640" y="470" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Septum secundum (black, RA side)</text><line x1="560" y1="468" x2="322" y2="200" stroke="#071318" stroke-width="1.2"/><circle cx="322" cy="200" r="3" fill="#071318"/><text x="400" y="500" font-size="11" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">RA pressure holds the channel open before birth; LA pressure shuts the flap after.</text><text x="400" y="528" font-size="11" font-weight="400" text-anchor="middle" fill="#5B6B66" font-family="system-ui,sans-serif">StewardMD illustration (original schematic, not to scale)</text></svg>