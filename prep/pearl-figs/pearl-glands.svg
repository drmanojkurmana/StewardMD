<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,sans-serif"><text x="320" y="28" text-anchor="middle" font-size="16" fill="#071318" font-weight="700">Types of glands: secretion and structure</text><rect x="30" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="76.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Merocrine</text><text x="76" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Merocrine</text><text x="76" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">exocytosis (salivary)</text><rect x="132" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="178.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Apocrine</text><text x="178" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Apocrine</text><text x="178" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">apical budding (mammary)</text><rect x="234" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="280.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Holocrine</text><text x="280" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Holocrine</text><text x="280" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">whole cell shed (sebaceous)</text><rect x="336" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="382.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Simple</text><text x="382" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Simple gland</text><text x="382" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">one duct</text><rect x="438" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="48