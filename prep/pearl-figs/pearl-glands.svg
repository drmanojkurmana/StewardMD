<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="system-ui,sans-serif" role="img" aria-labelledby="t d"><title id="t">Types of glands</title><desc id="d">Schematic of exocrine gland architecture and secretion modes, including unicellular goblet cell and simple tubular forms.</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Types of glands</text><text x="400" y="50" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Exocrine architecture and secretion mode (schematic)</text><g transform="translate(30,78)"><rect x="25" y="30" width="115" height="42" fill="#E3A488" stroke="#071318"/><path d="M68 30 Q82 4 96 30 L91 66 Q82 76 73 66Z" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="2"/></g><text x="112" y="200" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Goblet cell</text><text x="112" y="214" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Unicellular</text><g transform="translate(185,78)"><rect x="68" y="18" width="28" height="72" fill="#E3A488" stroke="#071318"/><rect x="76" y="0" width="12" height="20" fill="#F3E3C2" stroke="#071318"/></g><text x="267" y="200" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Simple tubular</text><text x="267" y="214" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Straight tube</text><g transform="translate(340,78)"><path d="M82 2 L82 34 Q82 60 106 52 Q128 45 116 30 Q106 18 120 15" fill="none" stroke="#E3A488" stroke-width="9"/></g><text x="422" y="200" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Simple coiled</text><text x="422" y="214" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Sweat gland</text><g transform="translate(495,78)"><circle cx="82" cy="52" r="32" fill="#E3A488" stroke="#071318"/><rect x="74" y="2" width="16" height="24" fill="#F3E3C2" stroke="#071318"/></g><text x="577" y="200" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Simple acinar</text><text x="577" y="214" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Round sac</text><g transform="translate(650,78)"><rect x="75" y="0" width="14" height="26" fill="#F3E3C2" stroke="#071318"/><path d="M82 26 L54 52 M82 26 L82 54 M82 26 L110 52" stroke="#071318" stroke-width="4"/><rect x="44" y="52" width="20" height="34" rx="9" fill="#E3A488" stroke="#071318"/><rect x="72" y="54" width="20" height="34" rx="9" fill="#E3A488" stroke="#071318"/><rect x="100" y="52" width="20" height="34" rx="9" fill="#E3A488" stroke="#071318"/></g><text x="732" y="200" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Compound tubular</text><text x="732" y="214" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Branched tubes</text><g transform="translate(30,300)"><rect x="75" y="0" width="14" height="26" fill="#F3E3C2" stroke="#071318"/><path d="M82 26 L54 50 M82 26 L82 52 M82 26 L110 50" stroke="#071318" stroke-width="3"/><circle cx="50" cy="62" r="14" fill="#E3A488" stroke="#071318"/><circle cx="82" cy="66" r="14" fill="#E3A488" stroke="#071318"/><circle cx="114" cy="62" r="14" fill="#E3A488" stroke="#071318"/></g><text x="112" y="422" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Compound acinar</text><text x="112" y="436" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Branched sacs</text><g transform="translate(222,300)"><rect x="35" y="42" width="95" height="48" fill="#E3A488" stroke="#071318"/><circle cx="58" cy="26" r="8" fill="#0E7C6B"/><circle cx="82" cy="16" r="8" fill="#0E7C6B"/><circle cx="106" cy="26" r="8" fill="#0E7C6B"/></g><text x="304" y="422" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Merocrine</text><text x="304" y="436" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Cell stays intact</text><g transform="translate(414,300)"><rect x="35" y="42" width="95" height="48" fill="#E3A488" stroke="#071318"/><path d="M70 42 Q82 18 94 42" fill="#F3E3C2" stroke="#0E7C6B" stroke-width="2"/><circle cx="82" cy="12" r="7" fill="#0E7C6B"/></g><text x="496" y="422" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Apocrine</text><text x="496" y="436" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Apex pinched off</text><g transform="translate(606,300)"><rect x="35" y="42" width="95" height="48" fill="#E3A488" stroke="#071318"/><circle cx="82" cy="22" r="14" fill="#F3E3C2" stroke="#0E7C6B" stroke-width="2"/><circle cx="70" cy="10" r="3" fill="#0E7C6B"/><circle cx="94" cy="8" r="3" fill="#0E7C6B"/></g><text x="688" y="422" font-size="10" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Holocrine</text><text x="688" y="436" font-size="9" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Whole cell shed</text><text x="400" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Duct branched = compound. Secretory part tubular (long) or acinar (round).</text><text x="400" y="528" font-size="11" font-weight="400" text-anchor="middle" fill="#5B6B66" font-family="system-ui,sans-serif">StewardMD illustration (original schematic, not to scale)</text></svg>