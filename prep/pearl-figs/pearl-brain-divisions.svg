<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="system-ui,sans-serif" role="img" aria-labelledby="t d"><title id="t">Divisions of the developing brain</title><desc id="d">Schematic flow from primary vesicles (prosencephalon, mesencephalon, rhombencephalon) to secondary vesicles to adult parts including cerebral hemispheres, thalamus and hypothalamus.</desc><rect width="800" height="540" fill="#FFFFFF"/><text x="400" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Divisions of the developing brain</text><text x="400" y="50" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Primary to secondary vesicles to adult parts (schematic)</text><rect x="60" y="110" width="190" height="52" rx="10" fill="#E3A488" stroke="#071318"/><text x="155" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Prosencephalon</text><text x="285" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">→</text><rect x="320" y="110" width="230" height="52" rx="10" fill="#F3E3C2" stroke="#071318"/><text x="435" y="142" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Telencephalon + Diencephalon</text><text x="585" y="142" font-size="16" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">→</text><text x="695" y="142" font-size="10" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Cerebral hemispheres · thalamus/hypothalamus</text><rect x="60" y="195" width="190" height="52" rx="10" fill="#E3A488" stroke="#071318"/><text x="155" y="227" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mesencephalon</text><text x="285" y="227" font-size="16" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">→</text><rect x="320" y="195" width="230" height="52" rx="10" fill="#F3E3C2" stroke="#071318"/><text x="435" y="227" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Mesencephalon (unchanged)</text><text x="585" y="227" font-size="16" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">→</text><text x="695" y="227" font-size="10" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Midbrain</text><rect x="60" y="280" width="190" height="52" rx="10" fill="#E3A488" stroke="#071318"/><text x="155" y="312" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Rhombencephalon</text><text x="285" y="312" font-size="16" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">→</text><rect x="320" y="280" width="230" height="52" rx="10" fill="#F3E3C2" stroke="#071318"/><text x="435" y="312" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Metencephalon + Myelencephalon</text><text x="585" y="312" font-size="16" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">→</text><text x="695" y="312" font-size="10" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Pons + cerebellum · medulla oblongata</text><text x="400" y="430" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Three primary vesicles become five secondary vesicles.</text><text x="400" y="528" font-size="11" font-weight="400" text-anchor="middle" fill="#5B6B66" font-family="system-ui,sans-serif">StewardMD illustration (original schematic, not to scale)</text></svg>