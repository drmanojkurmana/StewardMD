<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,sans-serif"><text x="320" y="28" text-anchor="middle" font-size="16" fill="#071318" font-weight="700">Divisions of the developing brain</text><rect x="30" y="90" width="180" height="70" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="120.0" y="129.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Prosencephalon</text><rect x="230" y="90" width="180" height="70" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="320.0" y="129.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Mesencephalon</text><rect x="430" y="90" width="180" height="70" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="520.0" y="129.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Rhombencephalon</text><rect x="30" y="200" width="180" height="60" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="120.0" y="234.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Telencephalon</text><rect x="230" y="200" width="180" height="60" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="320.0" y="234.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Diencephalon</text><rect x="430" y="200" width="180" height="60" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="520.0" y="234.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Met + Myelencephalon</text><text x="320" y="300" text-anchor="middle" font-size="11" fill="#5b6573" font-weight="400">Forebrain, midbrain and hindbrain give the five secondary vesicles.</text><text x="320" y="385" text-anchor="middle" font-size="11" fill="#5b6573">StewardMD illustration (original schematic, not to scale)</text></svg>