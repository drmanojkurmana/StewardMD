<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,sans-serif"><text x="320" y="28" text-anchor="middle" font-size="16" fill="#071318" font-weight="700">Types of epithelium (schematic cell icons)</text><rect x="30" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="76.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Simple</text><text x="76" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Simple squamous</text><text x="76" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">flat single layer</text><rect x="132" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="178.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Simple</text><text x="178" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Simple cuboidal</text><text x="178" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">cube single layer</text><rect x="234" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="280.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Simple</text><text x="280" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Simple columnar</text><text x="280" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">tall single layer</text><rect x="336" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="382.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Stratified</text><text x="382" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Stratified squamous</text><text x="382" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">many flat layers</text><rect x="438" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="484.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Pseudostratified</text><text x="484" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Pseudostratified</text><text x="484" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">one layer, uneven nuclei</text><rect x="540" y="120" width="92" height="90" rx="8" fill="#E6F4F1" stroke="#1F7A68"/><text x="586.0" y="169.0" text-anchor="middle" font-size="12" fill="#071318" font-weight="700">Transitional</text><text x="586" y="235" text-anchor="middle" font-size="9" fill="#071318" font-weight="700">Transitional</text><text x="586" y="252" text-anchor="middle" font-size="8" fill="#5b6573" font-weight="400">stretchable dome cells</text><text x="320" y="385" text-anchor="middle" font-size="11" fill="#5b6573">StewardMD illustration (original schematic, not to scale)</text></svg>