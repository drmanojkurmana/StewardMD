<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="system-ui,sans-serif"><rect width="800" height="540" fill="#FFFFFF"/><text x="400" y="30" font-size="17" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Perineal body</text><text x="400" y="50" font-size="12" font-weight="400" text-anchor="middle" fill="#3D5A54" font-family="system-ui,sans-serif">Inferior view of the perineum (schematic)</text><path d="M400 70 L610 250 L400 470 L190 250 Z" fill="#F3E3C2" stroke="#071318" stroke-width="1.5"/><ellipse cx="400" cy="330" rx="26" ry="18" fill="none" stroke="#071318" stroke-width="6"/><text x="400" y="335" font-size="11" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Anus</text><circle cx="400" cy="272" r="11" fill="#0E7C6B" stroke="#071318"/><path d="M352 150 Q400 120 448 150 L438 250 L362 250 Z" fill="#E3A488" stroke="#071318"/><rect x="300" y="252" width="200" height="16" rx="8" fill="#C96F4A" stroke="#071318"/><path d="M250 300 Q330 350 385 330 M550 300 Q470 350 415 330" fill="none" stroke="#C96F4A" stroke-width="10"/><text x="150" y="140" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Bulbospongiosus (paired)</text><line x1="215" y1="145" x2="372" y2="185" stroke="#071318" stroke-width="1.2"/><circle cx="372" cy="185" r="3" fill="#071318"/><text x="150" y="250" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Superficial transverse</text><text x="150" y="265" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">perinei (paired)</text><line x1="215" y1="252" x2="330" y2="258" stroke="#071318" stroke-width="1.2"/><circle cx="330" cy="258" r="3" fill="#071318"/><text x="150" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Levator ani (paired)</text><line x1="215" y1="358" x2="310" y2="322" stroke="#071318" stroke-width="1.2"/><circle cx="310" cy="322" r="3" fill="#071318"/><text x="650" y="140" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Urethra (and vagina</text><text x="650" y="155" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">in the female)</text><text x="650" y="250" font-size="12" font-weight="700" text-anchor="middle" fill="#0E7C6B" font-family="system-ui,sans-serif">Perineal body</text><line x1="585" y1="252" x2="411" y2="272" stroke="#071318" stroke-width="1.2"/><circle cx="411" cy="272" r="3" fill="#071318"/><text x="650" y="360" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">External anal sphincter</text><text x="650" y="375" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">(unpaired fibres)</text><line x1="585" y1="362" x2="400" y2="350" stroke="#071318" stroke-width="1.2"/><circle cx="424" cy="338" r="3" fill="#071318"/><text x="400" y="505" font-size="12" font-weight="700" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Two unpaired + four paired muscles: the ten-muscle convergence</text><text x="400" y="528" font-size="11" font-weight="400" text-anchor="middle" fill="#5B6B66" font-family="system-ui,sans-serif">StewardMD illustration (original schematic, not to scale)</text><rect x="315" y="232" width="170" height="10" rx="5" fill="none" stroke="#071318" stroke-width="1.5" stroke-dasharray="5,4"/><text x="650" y="205" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Deep transverse perinei</text><line x1="585" y1="208" x2="470" y2="235" stroke="#071318" stroke-width="1.2"/><circle cx="470" cy="235" r="3" fill="#071318"/><text x="150" y="430" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">Longitudinal coat of</text><text x="150" y="445" font-size="12" font-weight="400" text-anchor="middle" fill="#071318" font-family="system-ui,sans-serif">anal canal (unpaired)</text><line x1="215" y1="432" x2="392" y2="345" stroke="#071318" stroke-width="1.2"/><circle cx="392" cy="345" r="3" fill="#071318"/><circle cx="400" cy="200" r="9" fill="#FFFFFF" stroke="#0E7C6B" stroke-width="3"/><line x1="585" y1="148" x2="409" y2="200" stroke="#071318" stroke-width="1.2"/><circle cx="409" cy="200" r="3" fill="#071318"/></svg>