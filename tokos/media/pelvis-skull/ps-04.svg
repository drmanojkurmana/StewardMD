<svg xmlns="http://www.w3.org/2000/svg" width="580" height="380" viewBox="0 0 580 380" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Pelvic planes and the J shaped obstetric axis in side view"><rect x="0" y="0" width="580" height="380" rx="10" fill="#f6f3ec"/><path d="M235 60 C255 120 300 190 332 262 C340 288 346 304 350 318" stroke="#3a424e" stroke-width="13" stroke-opacity="0.20" fill="none"/><path d="M235 60 C255 120 300 190 332 262 C340 288 346 304 350 318" stroke="#3a424e" stroke-width="2.4" fill="none"/><rect x="94" y="246" width="20" height="72" rx="6" fill="#d9c9ad" stroke="#3a424e" stroke-width="2.2"/><circle cx="235" cy="60" r="4.4" fill="#3a424e" stroke="none"/><circle cx="350" cy="318" r="3.6" fill="#3a424e" stroke="none"/><circle cx="224" cy="290" r="4.4" fill="#b3262e" stroke="none"/><text x="247" y="54" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Sacral promontory</text><text x="88" y="284" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Symphysis pubis</text><text x="358" y="322" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Coccyx tip</text><line x1="235" y1="60" x2="104" y2="246" stroke="#1f6fd1" stroke-width="2.6"/><line x1="108" y1="282" x2="272" y2="140" stroke="#2c8a46" stroke-width="2.6"/><line x1="116" y1="318" x2="332" y2="262" stroke="#b3262e" stroke-width="2.6"/><line x1="116" y1="318" x2="350" y2="318" stroke="#3a424e" stroke-width="2.2" stroke-dasharray="5 4"/><path d="M170 153 C195 190 220 240 226 288 C230 318 210 340 170 358" stroke="#7b4fb0" stroke-width="2.6" stroke-dasharray="7 4" fill="none"/><path d="M170 358 l10 -2 m-10 2 l4 -10" stroke="#7b4fb0" stroke-width="2.4"/><text x="216" y="308" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="end" fill="#b3262e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">ischial spines</text><line x1="372" y1="66" x2="398" y2="66" stroke="#1f6fd1" stroke-width="3"/><text x="406" y="70" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f6fd1" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">1 Inlet</text><text x="406" y="83" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">55 degrees to the horizontal</text><line x1="372" y1="106" x2="398" y2="106" stroke="#2c8a46" stroke-width="3"/><text x="406" y="110" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#2c8a46" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">2 Mid-cavity</text><text x="406" y="123" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">round, 12.5 cm; greatest dimensions</text><line x1="372" y1="146" x2="398" y2="146" stroke="#b3262e" stroke-width="3"/><text x="406" y="150" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#b3262e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">3 Least dimensions</text><text x="406" y="163" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">symphysis, ischial spines, sacral tip</text><line x1="372" y1="186" x2="398" y2="186" stroke="#3a424e" stroke-width="3"/><text x="406" y="190" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">4 Anatomical outlet</text><text x="406" y="203" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">two triangular planes</text><line x1="372" y1="226" x2="398" y2="226" stroke="#7b4fb0" stroke-width="3"/><text x="406" y="230" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#7b4fb0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Obstetric axis (J shaped)</text><text x="406" y="243" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">down and back to the spines, then forward</text><text x="14" y="22" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Pelvic planes and the obstetric axis</text><text x="14" y="38" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">front of the woman on the left; the anatomical axis (curve of Carus) is C shaped and has no obstetric use</text><text x="570" y="372" font-family="system-ui,sans-serif" font-size="9" fill="#8a93a0" text-anchor="end">schematic, not to scale</text></svg>