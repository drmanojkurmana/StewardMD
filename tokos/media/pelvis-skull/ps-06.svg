ont-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">nape to glabella: incomplete flexion</text><line x1="372" y1="146" x2="398" y2="146" stroke="#2c8a46" stroke-width="3"/><text x="406" y="150" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#2c8a46" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Occipito-frontal 11.5</text><text x="406" y="163" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">protuberance to glabella: deflexion</text><line x1="372" y1="186" x2="398" y2="186" stroke="#7b4fb0" stroke-width="3"/><text x="406" y="190" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#7b4fb0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Mento-vertical 14</text><text x="406" y="203" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">chin to vertex: brow presentation</text><line x1="372" y1="226" x2="398" y2="226" stroke="#c26a00" stroke-width="3"/><text x="406" y="230" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#c26a00" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Submento-vertical 11.5</text><text x="406" y="243" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">floor of mouth to vertex: face</text><line x1="372" y1="266" x2="398" y2="266" stroke="#0e8f8f" stroke-width="3"/><text x="406" y="270" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#0e8f8f" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Submento-bregmatic 9.5</text><text x="406" y="283" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">floor of mouth to bregma: face</text><text x="14" y="22" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Fetal skull from the side: anteroposterior diameters</text><text x="14" y="38" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">face to the right; lengths in cm; the attitude of the head decides which one engages</text><text x="610" y="312" font-family="system-ui,sans-serif" font-size="9" fill="#8a93a0" text-anchor="end">schematic, not to scale</text></svg>