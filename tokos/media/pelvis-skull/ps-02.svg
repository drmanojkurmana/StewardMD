romontory to lower border (felt vaginally)</text><line x1="372" y1="186" x2="398" y2="186" stroke="#7b4fb0" stroke-width="3"/><text x="406" y="190" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#7b4fb0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Obstetric outlet AP 13</text><text x="406" y="203" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">sacral tip to lower border; coccyx moves back</text><line x1="372" y1="226" x2="398" y2="226" stroke="#3a424e" stroke-width="3"/><text x="406" y="230" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Anatomical outlet AP 11</text><text x="406" y="243" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">coccyx tip to lower border of symphysis</text><text x="14" y="22" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Pelvis in midsagittal section</text><text x="14" y="38" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">front of the woman on the left; diameters in cm</text><text x="570" y="342" font-family="system-ui,sans-serif" font-size="9" fill="#8a93a0" text-anchor="end">schematic, not to scale</text></svg>