<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fetal skull from above with sutures, fontanelles and the biparietal diameter"><rect x="0" y="0" width="480" height="320" rx="10" fill="#f6f3ec"/><path d="M240 40 C300 40 352 90 352 160 C352 230 306 284 240 292 C174 284 128 230 128 160 C128 90 180 40 240 40 Z" fill="#e6d9c2" stroke="#3a424e" stroke-width="2.4"/><path d="M240 40 L240 292" stroke="#3a424e" stroke-width="1.8"/><path d="M142 118 C190 104 290 104 338 118" stroke="#3a424e" stroke-width="1.8"/><path d="M240 262 L214 288 M240 262 L266 288" stroke="#3a424e" stroke-width="1.8"/><path d="M240 100 L262 118 L240 140 L218 118 Z" fill="#d9c9ad" stroke="#3a424e" stroke-width="1.8"/><path d="M240 258 L252 276 L228 276 Z" fill="#d9c9ad" stroke="#3a424e" stroke-width="1.6"/><circle cx="184" cy="190" r="4" fill="#b3262e" stroke="none"/><circle cx="296" cy="190" r="4" fill="#b3262e" stroke="none"/><line x1="184" y1="190" x2="296" y2="190" stroke="#b3262e" stroke-width="2.2"/><circle cx="184" cy="190" r="3" fill="#b3262e" stroke="none"/><circle cx="296" cy="190" r="3" fill="#b3262e" stroke="none"/><text x="240" y="210" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b3262e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Biparietal 9.5</text><text x="120" y="194" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#b3262e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Parietal eminence</text><text x="360" y="194" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#b3262e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Parietal eminence</text><line x1="160" y1="96" x2="320" y2="96" stroke="#1f6fd1" stroke-width="2.2"/><circle cx="160" cy="96" r="3" fill="#1f6fd1" stroke="none"/><circle cx="320" cy="96" r="3" fill="#1f6fd1" stroke="none"/><text x="240" y="88" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round"></text><text x="272" y="100" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Anterior fontanelle (bregma)</text><text x="272" y="113" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">diamond: 4 sutures meet</text><text x="262" y="262" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Posterior fontanelle (lambda)</text><text x="262" y="275" font-family="system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">triangle: 3 sutures meet</text><text x="124" y="120" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Coronal suture</text><text x="356" y="120" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Coronal suture</text><text x="248" y="70" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Frontal suture</text><text x="248" y="236" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Sagittal suture</text><text x="204" y="296" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="end" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Lambdoid sutures</text><text x="14" y="22" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#3a424e" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">Fetal skull from above: sutures and fontanelles</text><text x="14" y="38" font-family="system-ui,sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#8a93a0" stroke="#f6f3ec" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round">face at the top; the biparietal diameter always engages (9.5 cm); bitemporal is 8.5 cm</text><text x="470" y="312" font-family="system-ui,sans-serif" font-size="9" fill="#8a93a0" text-anchor="end">schematic, not to scale</text></svg>