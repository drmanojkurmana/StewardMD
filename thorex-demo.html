<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThoreX AI — on-device demo harness (onnxruntime-web, no cloud)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="/thorex.css?v=demo">
<link rel="stylesheet" href="/thorex-screens.css?v=demo">
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f8f9;color:#0d1b24}
  .demo-bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#0d1b24;color:#fff;font-size:13px}
  .demo-bar b{font-weight:600}
  .demo-bar button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #3a5a6b;background:#12303f;color:#fff;cursor:pointer}
  .demo-note{opacity:.75}
  .demo-spacer{height:52px}
  #odlog{position:fixed;bottom:0;left:0;right:0;max-height:34vh;overflow:auto;z-index:6;background:#08131a;color:#9fe1cb;font:12px/1.5 ui-monospace,monospace;padding:8px 12px;white-space:pre-wrap;border-top:1px solid #1d9e75;display:none}
</style>
</head>
<body>
<div class="demo-bar">
  <b>ThoreX on-device demo</b>
  <button id="engineRun">Run REAL on-device inference (onnxruntime-web)</button>
  <button id="openMod">Open module</button>
  <span class="demo-note">clinical DenseNet · runs in this browser · no cloud</span>
</div>
<div class="demo-spacer"></div>
<pre id="odlog"></pre>

<script>
(function () {
  "use strict";
  try { localStorage.setItem("smd_thorex", "1"); } catch (e) {}
  try { localStorage.setItem("smd_thorex_ondevice", "1"); } catch (e) {}   // prefer ON-DEVICE
  try { localStorage.removeItem("smd_thorex_demo"); } catch (e) {}          // NOT mock
  window.SMD_PRO = { isProSync: function () { return true; }, isPro: function () { return Promise.resolve(true); } };
  try { document.body.classList.add("pro-verified"); } catch (e) {}
  var _tier = "v1";
  window.__setDemoTier = function (t) { _tier = t; };
  window.SMD_XACCESS = { gate: function (f, cb) { try { cb(); } catch (e) {} }, openGate: function (f, cb) { cb && cb(); },
    ensure: function () { return Promise.resolve({ active: true, tier: _tier }); }, isActiveCached: function () { return true; },
    tierFor: function () { return _tier; }, activate: function () { return Promise.resolve({ ok: true, tier: _tier }); },
    clear: function () {}, onChange: function () {}, devBypass: function () { return true; } };
  window.toast = function (m) { log("[toast] " + m); }; window.SMD_toast = window.toast;
  window.log = function (m) { try { var el = document.getElementById("odlog"); el.style.display = "block"; el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; console.log(m); } catch (e) {} };
})();
</script>

<script src="/fflate.min.js"></script>
<script src="/thorex-flags.js?v=demo"></script>
<script src="/thorex-models.js?v=demo"></script>
<script src="/thorex-entitlement.js?v=demo"></script>
<script src="/thorex-store.js?v=demo"></script>
<script src="/thorex-net.js?v=demo"></script>
<script src="/thorex-model-cache.js?v=demo"></script>
<script src="/thorex-ort.js?v=demo"></script>
<script src="/thorex-providers.js?v=demo"></script>
<script src="/thorex-screens.js?v=demo"></script>
<script src="/thorex.js?v=demo"></script>

<script>
(function () {
  "use strict";
  // Draw a synthetic chest-X-ray-like grayscale image (dark lung fields, bright mediastinum/ribs)
  function syntheticCxrBlob() {
    var c = document.createElement("canvas"); c.width = 224; c.height = 224;
    var g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, 224, 224);
    // spine/mediastinum bright column
    var grad = g.createLinearGradient(90, 0, 134, 0);
    grad.addColorStop(0, "#111"); grad.addColorStop(.5, "#d8d8d8"); grad.addColorStop(1, "#111");
    g.fillStyle = grad; g.fillRect(90, 10, 44, 210);
    // ribs (arcs)
    g.strokeStyle = "rgba(200,200,200,.55)"; g.lineWidth = 3;
    for (var i = 0; i < 8; i++) { g.beginPath(); g.arc(60, 40 + i * 20, 55, -0.5, 1.3); g.stroke(); g.beginPath(); g.arc(164, 40 + i * 20, 55, 1.85, 3.6); g.stroke(); }
    // a hazy opacity in the right lower zone
    var op = g.createRadialGradient(150, 165, 5, 150, 165, 45);
    op.addColorStop(0, "rgba(210,210,210,.6)"); op.addColorStop(1, "rgba(210,210,210,0)");
    g.fillStyle = op; g.fillRect(105, 120, 90, 90);
    return new Promise(function (res) { c.toBlob(function (b) { res(b); }, "image/png"); });
  }

  document.getElementById("engineRun").addEventListener("click", function () {
    log("— Running REAL on-device inference —");
    log("engine available? SMD_THOREX_ORT=" + !!window.SMD_THOREX_ORT);
    syntheticCxrBlob().then(function (blob) {
      log("synthetic CXR built (" + blob.size + " bytes). Loading onnxruntime-web + model…");
      var t0 = Date.now();
      return window.SMD_THOREX_ORT.analyzeImage(blob, {}).then(function (a) {
        var ms = Date.now() - t0;
        log("✓ on-device inference complete in " + ms + " ms (no network).");
        try {
          var eng = (a.engines && a.engines[0]) || {};
          log("engine: " + eng.engine + "  educational=" + eng.educational);
          (eng.findings || []).forEach(function (f) { log("  • " + f.label + " — band " + (f.band || f.confLabel) + (f.heatmap ? "  [+CAM heatmap]" : "")); });
          if (!eng.findings || !eng.findings.length) log("  (no findings above threshold on this synthetic image — expected)");
          window.__lastAnalysis = a;
        } catch (e) { log("map error: " + e); }
        // also render it through the real result screen
        try { window.THOREX && THOREX.open && THOREX.open(); if (window.SMD_THOREX_ROUTER) { SMD_THOREX_ROUTER.__renderAnalysis ? SMD_THOREX_ROUTER.__renderAnalysis(a) : (window.__lastAnalysis = a); } } catch (e) {}
      });
    }).catch(function (e) { log("✗ inference failed: " + (e && (e.code || e.message || e))); });
  });

  document.getElementById("openMod").addEventListener("click", function () { try { THOREX.open(); } catch (e) { log(String(e)); } });

  log("[demo] ready. THOREX=" + !!window.THOREX + " ORT=" + !!window.SMD_THOREX_ORT + " PROVIDERS=" + !!window.SMD_THOREX_PROVIDERS);
})();
</script>
</body>
</html>
