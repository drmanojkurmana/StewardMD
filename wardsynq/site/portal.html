<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your record - WardSynQ</title>
<!-- wardsynq.com/portal.html - the patient's and family's own page (P2.9). No staff sign-in, no
     Firebase, no shell: it calls only /api/portal/*, which checks the access on the server. -->
<link rel="icon" type="image/png" sizes="32x32" href="/wardsynq/ui/brand/icon-32.png">
<link rel="stylesheet" href="/wardsynq/ui/wardsynq.css?v=11">
<link rel="stylesheet" href="/wardsynq/site/shell.css?v=5">
<style>
  body { margin: 0; }
  #portal { max-width: 640px; margin: 0 auto; padding: 16px; font-size: 17px; line-height: 1.5; }
  #portal .card { display: block; padding: 12px 0; border-bottom: 1px solid var(--hair, #ddd); }
  #portal .card::before { display: none; }
  #portal .f { margin: 10px 0; }
  #portal input, #portal textarea { font-size: 17px; padding: 10px; width: 100%; box-sizing: border-box; }
  #portal .btn { min-height: 44px; padding: 0 16px; margin-top: 8px; }
  #portal .plist { padding-left: 18px; }
  #portal .plist > li { margin: 10px 0; }
  #portal h1 { font-size: 22px; }
  #portal :focus-visible { outline: 3px solid #1c3048; outline-offset: 2px; }
  #portal .ds-full h4 { margin: 14px 0 4px; font-size: 17px; }
  #portal .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  #portal .lang-switch { text-align: right; margin-bottom: 8px; }
  #portal .lang-switch select { font-size: 15px; padding: 6px 8px; }
  /* A full discharge summary prints on its own: everything else on the page is hidden while it does. */
  @media print {
    body.printing * { visibility: hidden; }
    body.printing .printing, body.printing .printing * { visibility: visible; }
    body.printing .printing { position: absolute; left: 0; top: 0; width: 100%; }
    body.printing .noprint { display: none !important; }
  }
</style>
</head>
<body>
<main id="portal" aria-live="polite"></main>
<script src="/wardsynq/site/i18n.js?v=5"></script>
<script src="/wardsynq/site/portal.js?v=6"></script>
<script src="/wardsynq/site/bug-reporter.js?v=2"></script>
</body>
</html>
