<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insulin module - demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/insulin.css">
<style>
  /* App design tokens (mirrors index.html :root + redesign-system.css) so the module renders native. */
  :root, body {
    --teal:#0F766E; --teal-soft:#E4F2EF; --paper:#F5F8F9; --panel:#ffffff; --panel2:#F5F8F9;
    --ink:#0D1B24; --slate:#5B7083; --slate-soft:#8CA2B1; --line:#E3EAEE;
    --rds-font:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
    --rds-mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
    --rds-el-card:0 1px 2px rgba(13,27,36,.05); --rds-el-cta:0 6px 18px rgba(15,118,110,.22);
    --sev-critical-fg:#B42332; --sev-critical-bg:#FBE9EC; --sev-critical-bd:#F0B7C0;
    --sev-urgent-fg:#C2410C; --sev-urgent-bg:#FDEEE4; --sev-urgent-bd:#F5C6A5;
    --sev-warning-fg:#996007; --sev-warning-bg:#FBF3DC; --sev-warning-bd:#EAD28F;
    --sev-stable-fg:#1C7A4A; --sev-stable-bg:#E7F5EC; --sev-stable-bd:#B5DFC6;
    --sev-info-fg:#1D6FA3; --sev-info-bg:#E8F2F9; --sev-info-bd:#B5D4E8;
  }
  body.dark {
    --teal:#33B3A2; --teal-soft:#0E2A28; --paper:#0B141A; --panel:#111E27; --panel2:#16242E;
    --ink:#E7EEF2; --slate:#93A6B4; --line:#20313B;
    --rds-el-card:0 1px 2px rgba(0,0,0,.30);
    --sev-critical-fg:#F17287; --sev-critical-bg:#2A1218; --sev-critical-bd:#4A2028;
    --sev-urgent-fg:#F0A36B; --sev-urgent-bg:#2C190C; --sev-urgent-bd:#4A2C15;
    --sev-warning-fg:#EAC26A; --sev-warning-bg:#241B00; --sev-warning-bd:#3E2F08;
    --sev-stable-fg:#5BD08F; --sev-stable-bg:#06240F; --sev-stable-bd:#123E22;
    --sev-info-fg:#6FB4E0; --sev-info-bg:#0C2233; --sev-info-bd:#163B54;
  }
  html,body{margin:0;height:100%;background:var(--paper);font-family:var(--rds-font);color:var(--ink);}
  .demo-bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);}
  .demo-bar b{font-size:14px;font-weight:700;}
  .demo-bar .sp{margin-left:auto;}
  .demo-bar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;}
  .demo-bar button.p{background:var(--teal);color:#fff;border-color:var(--teal);}
</style>
</head>
<body>
  <div class="demo-bar">
    <b>Insulin module</b><span style="color:var(--slate);font-size:12px">demo harness</span>
    <span class="sp"></span>
    <button id="theme">Toggle dark</button>
    <button class="p" id="openBtn">Open calculator</button>
  </div>

  <script>
    // Demo-only: enable the (default-OFF) master flag so INSULIN.open() passes its gate.
    try { localStorage.setItem("smd_insulin", "1"); } catch (e) {}
  </script>
  <script src="/vendor/motion/motion.js" defer></script>
  <script src="/insulin-flags.js" defer></script>
  <script src="/insulin-engine.js" defer></script>
  <script src="/insulin-safety.js" defer></script>
  <script src="/insulin-db.js" defer></script>
  <script src="/insulin-convert.js" defer></script>
  <script src="/insulin.js" defer></script>
  <script>
    window.addEventListener("load", function () {
      document.getElementById("openBtn").addEventListener("click", function () { window.INSULIN && INSULIN.open(); });
      document.getElementById("theme").addEventListener("click", function () { document.body.classList.toggle("dark"); });
      setTimeout(function () { window.INSULIN && INSULIN.open(); }, 120);
    });
  </script>
</body>
</html>
